<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">区间 DP 算法流程（按区间长度递增填表）</text>

  <!-- Step 1: pad -->
  <rect x="120" y="44" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">① 两端补 1：val = [1] + nums + [1]</text>
  <text x="280" y="78" text-anchor="middle" font-size="10" fill="#888">dp[i][j] = 开区间 (i,j) 内戳气球的最大硬币数</text>

  <path d="M 280 84 L 280 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: outer loop over length -->
  <polygon points="280,106 400,150 280,194 160,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" fill="#333">② 枚举区间长度 len</text>
  <text x="280" y="164" text-anchor="middle" font-size="11" fill="#666">len = 3 … n+2</text>
  <text x="280" y="180" text-anchor="middle" font-size="10" fill="#888">(len=2 时区间为空 = 0)</text>

  <path d="M 280 194 L 280 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop i, j -->
  <rect x="120" y="216" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="12" fill="#333">③ 枚举左端 i = 0 … n+2−len</text>
  <text x="280" y="252" text-anchor="middle" font-size="12" fill="#333">令 j = i + len − 1</text>

  <path d="M 280 260 L 280 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: loop k -->
  <rect x="120" y="282" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#333">④ 枚举「最后戳」的气球</text>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#333">k = i+1 … j−1</text>

  <path d="M 280 326 L 280 344" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: transition -->
  <rect x="60" y="348" width="440" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">⑤ 状态转移</text>
  <text x="280" y="388" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">dp[i][j] = max&#123; dp[i][k] + dp[k][j] + val[i]·val[k]·val[j] &#125;</text>
  <text x="280" y="402" text-anchor="middle" font-size="10" fill="#888">子区间 (i,k)、(k,j) 长度更短，已在上几轮算好</text>

  <path d="M 280 406 L 280 424" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: return -->
  <ellipse cx="280" cy="450" rx="150" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="454" text-anchor="middle" font-size="13" fill="#333">⑥ 返回 dp[0][n+1]</text>

  <!-- loop-back arrows -->
  <path d="M 60 377 L 36 377 L 36 150 L 160 150" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="22" y="270" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 22 270)">k / i 遍历完回上一层</text>

  <!-- right side note -->
  <rect x="430" y="216" width="120" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="490" y="238" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">遍历顺序</text>
  <text x="490" y="258" text-anchor="middle" font-size="10" fill="#666">len ↑</text>
  <text x="490" y="276" text-anchor="middle" font-size="10" fill="#666">→ i</text>
  <text x="490" y="294" text-anchor="middle" font-size="10" fill="#666">→ k</text>
  <text x="490" y="318" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">保证子状态</text>
  <text x="490" y="330" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">先算好</text>
</svg>
