<svg xmlns="http://www.w3.org/2000/svg" width="940" height="780" viewBox="0 0 940 780" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="940" height="780" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：官方用例逐步推演</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="66" text-anchor="middle" font-size="11" fill="#666">黄色=哨兵(head/tail,不存数据)  蓝色=数据节点  绿色=新插入  红色虚框=待删/已删  下标 0,1,2…</text>

  <!-- 公共：每行 y 起点 90，行高 92 -->
  <!-- 行0: init -->
  <text x="40" y="112" font-size="12" fill="#666" font-weight="bold">0</text>
  <text x="70" y="112" font-size="12" fill="#333" font-weight="bold">MyLinkedList()</text>
  <text x="70" y="128" font-size="9" fill="#888">size=0，只有两个哨兵相连</text>
  <g filter="url(#sk2)">
    <rect x="300" y="96" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="400" y="96" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <path d="M 360 116 L 400 116" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 400 122 L 360 122" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
  </g>
  <text x="330" y="121" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">head</text>
  <text x="430" y="121" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">tail</text>
  <text x="540" y="121" font-size="12" fill="#888">空链表：head ↔ tail</text>
  <text x="820" y="121" font-size="12" fill="#888" font-weight="bold">null</text>

  <!-- 行1: addAtHead(1) -->
  <text x="40" y="196" font-size="12" fill="#666" font-weight="bold">1</text>
  <text x="70" y="196" font-size="12" fill="#2e6e2e" font-weight="bold">addAtHead(1)</text>
  <text x="70" y="212" font-size="9" fill="#2e6e2e">cur=head，在 head 后插</text>
  <g filter="url(#sk2)">
    <rect x="300" y="180" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="400" y="180" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="500" y="180" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <path d="M 360 200 L 400 200" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 400 206 L 360 206" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 460 200 L 500 200" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 500 206 L 460 206" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
  </g>
  <text x="330" y="205" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">head</text>
  <text x="430" y="205" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="530" y="205" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">tail</text>
  <text x="430" y="238" text-anchor="middle" font-size="9" fill="#4a7a3a">idx 0</text>
  <text x="820" y="205" font-size="12" fill="#888" font-weight="bold">null</text>

  <!-- 行2: addAtTail(3) -->
  <text x="40" y="280" font-size="12" fill="#666" font-weight="bold">2</text>
  <text x="70" y="280" font-size="12" fill="#2e6e2e" font-weight="bold">addAtTail(3)</text>
  <text x="70" y="296" font-size="9" fill="#2e6e2e">cur=tail.prev，在 1 后插</text>
  <g filter="url(#sk2)">
    <rect x="300" y="264" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="400" y="264" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="500" y="264" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="600" y="264" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <path d="M 360 284 L 400 284" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 400 290 L 360 290" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 460 284 L 500 284" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 500 290 L 460 290" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 560 284 L 600 284" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 600 290 L 560 290" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
  </g>
  <text x="330" y="289" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">head</text>
  <text x="430" y="289" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="530" y="289" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">3</text>
  <text x="630" y="289" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">tail</text>
  <text x="430" y="322" text-anchor="middle" font-size="9" fill="#666">idx 0</text>
  <text x="530" y="322" text-anchor="middle" font-size="9" fill="#4a7a3a">idx 1</text>
  <text x="820" y="289" font-size="12" fill="#888" font-weight="bold">null</text>

  <!-- 行3: addAtIndex(1,2) -->
  <text x="40" y="364" font-size="12" fill="#666" font-weight="bold">3</text>
  <text x="70" y="364" font-size="12" fill="#2e6e2e" font-weight="bold">addAtIndex(1, 2)</text>
  <text x="70" y="380" font-size="9" fill="#2e6e2e">index==1, cur 走 1 步到“1”后插</text>
  <g filter="url(#sk2)">
    <rect x="280" y="348" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="366" y="348" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="452" y="348" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="538" y="348" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="624" y="348" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <path d="M 336 368 L 366 368" stroke="#446688" stroke-width="1.3" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 366 374 L 336 374" stroke="#446688" stroke-width="1.3" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 422 368 L 452 368" stroke="#446688" stroke-width="1.3" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 452 374 L 422 374" stroke="#446688" stroke-width="1.3" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 508 368 L 538 368" stroke="#446688" stroke-width="1.3" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 538 374 L 508 374" stroke="#446688" stroke-width="1.3" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 594 368 L 624 368" stroke="#446688" stroke-width="1.3" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 624 374 L 594 374" stroke="#446688" stroke-width="1.3" marker-end="url(#arB)" filter="url(#sk2)"/>
  </g>
  <text x="308" y="373" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">head</text>
  <text x="394" y="373" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="480" y="373" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="566" y="373" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="652" y="373" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">tail</text>
  <text x="394" y="406" text-anchor="middle" font-size="9" fill="#666">0</text>
  <text x="480" y="406" text-anchor="middle" font-size="9" fill="#4a7a3a">1</text>
  <text x="566" y="406" text-anchor="middle" font-size="9" fill="#666">2</text>
  <text x="820" y="373" font-size="12" fill="#888" font-weight="bold">null</text>

  <!-- 行4: get(1) -> 2 -->
  <text x="40" y="448" font-size="12" fill="#666" font-weight="bold">4</text>
  <text x="70" y="448" font-size="12" fill="#2b6e9e" font-weight="bold">get(1)</text>
  <text x="70" y="464" font-size="9" fill="#2b6e9e">走 1 步定位 idx=1</text>
  <g filter="url(#sk2)">
    <rect x="280" y="432" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="366" y="432" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="452" y="432" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <rect x="538" y="432" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="624" y="432" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="308" y="457" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">head</text>
  <text x="394" y="457" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="480" y="457" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="566" y="457" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="652" y="457" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">tail</text>
  <text x="480" y="490" text-anchor="middle" font-size="9" fill="#2b6e9e" font-weight="bold">↑ idx 1 命中</text>
  <text x="820" y="457" font-size="13" fill="#2e6e2e" font-weight="bold">return 2</text>

  <!-- 行5: deleteAtIndex(1) -->
  <text x="40" y="532" font-size="12" fill="#666" font-weight="bold">5</text>
  <text x="70" y="532" font-size="12" fill="#b85450" font-weight="bold">deleteAtIndex(1)</text>
  <text x="70" y="548" font-size="9" fill="#b85450">摘除 idx=1 的节点 2</text>
  <g filter="url(#sk2)">
    <rect x="280" y="516" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="366" y="516" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <!-- 待删节点 2：红色虚框 -->
    <rect x="452" y="516" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="538" y="516" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="624" y="516" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <!-- 越过 2 的重连：1.next→3, 3.prev→1 -->
    <path d="M 422 540 Q 480 556 538 540" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
    <path d="M 538 530 Q 480 514 422 530" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  </g>
  <text x="308" y="541" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">head</text>
  <text x="394" y="541" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="480" y="541" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="566" y="541" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="652" y="541" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">tail</text>
  <text x="480" y="574" text-anchor="middle" font-size="9" fill="#b85450">1.next 越过 2 指 3；3.prev 越过 2 指 1</text>
  <text x="820" y="541" font-size="12" fill="#888" font-weight="bold">null</text>

  <!-- 行6: get(1) -> 3 -->
  <text x="40" y="616" font-size="12" fill="#666" font-weight="bold">6</text>
  <text x="70" y="616" font-size="12" fill="#2b6e9e" font-weight="bold">get(1)</text>
  <text x="70" y="632" font-size="9" fill="#2b6e9e">再走 1 步，idx=1 已是 3</text>
  <g filter="url(#sk2)">
    <rect x="300" y="600" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="400" y="600" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="500" y="600" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <rect x="600" y="600" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <path d="M 360 620 L 400 620" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 400 626 L 360 626" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 460 620 L 500 620" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 500 626 L 460 626" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 560 620 L 600 620" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
    <path d="M 600 626 L 560 626" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk2)"/>
  </g>
  <text x="330" y="625" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">head</text>
  <text x="430" y="625" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="530" y="625" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">3</text>
  <text x="630" y="625" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">tail</text>
  <text x="430" y="658" text-anchor="middle" font-size="9" fill="#666">idx 0</text>
  <text x="530" y="658" text-anchor="middle" font-size="9" fill="#2b6e9e" font-weight="bold">↑ idx 1 命中</text>
  <text x="820" y="625" font-size="13" fill="#2e6e2e" font-weight="bold">return 3</text>

  <!-- 底部小结 -->
  <g filter="url(#sk)">
    <rect x="60" y="686" width="820" height="76" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="80" y="710" font-size="12" font-weight="bold" fill="#2e6e2e">关键看点：</text>
  <text x="80" y="730" font-size="11" fill="#444">① 第 1、2 步：插头=在 head 后插、插尾=在 tail.prev 后插，同一套 spliceAfter，O(1)。</text>
  <text x="80" y="748" font-size="11" fill="#444">② 第 5 步：删除 idx=1 的节点 2，只需 1.next→3、3.prev→1 两根指针越过它——哨兵保证前后继永非空。</text>
</svg>
