<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：nums = [2,1,3] → 排序 [1,2,3]</text>

  <!-- Original array -->
  <text x="60" y="54" font-size="11" fill="#888">原数组:</text>
  <rect x="130" y="40" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="180" y="40" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="230" y="40" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- Sort arrow -->
  <path d="M 300 55 L 340 55" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="48" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">排序</text>

  <!-- Sorted array -->
  <text x="370" y="54" font-size="11" fill="#888">排序后:</text>
  <rect x="430" y="40" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="470" y="40" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="488" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="510" y="40" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="528" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- Divider -->
  <path d="M 40 88 L 520 88" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- Table header -->
  <rect x="40" y="98" width="480" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="116" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">i</text>
  <text x="150" y="116" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">nums[i]</text>
  <text x="250" y="116" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">2^i (max 次数)</text>
  <text x="370" y="116" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">2^(n-1-i) (min 次数)</text>
  <text x="485" y="116" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">贡献</text>

  <!-- Row i=0 -->
  <rect x="40" y="128" width="480" height="32" fill="#e8f0fe" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="80" y="148" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="150" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="250" y="148" text-anchor="middle" font-size="11" fill="#b85450">2⁰ = 1</text>
  <text x="370" y="148" text-anchor="middle" font-size="11" fill="#446688">2² = 4</text>
  <text x="485" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1×(1−4)=−3</text>

  <!-- Row i=1 -->
  <rect x="40" y="162" width="480" height="32" fill="#fff8e1" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="80" y="182" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="150" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="250" y="182" text-anchor="middle" font-size="11" fill="#b85450">2¹ = 2</text>
  <text x="370" y="182" text-anchor="middle" font-size="11" fill="#446688">2¹ = 2</text>
  <text x="485" y="182" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2×(2−2)=0</text>

  <!-- Row i=2 -->
  <rect x="40" y="196" width="480" height="32" fill="#fce4ec" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="80" y="216" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="150" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="250" y="216" text-anchor="middle" font-size="11" fill="#b85450">2² = 4</text>
  <text x="370" y="216" text-anchor="middle" font-size="11" fill="#446688">2⁰ = 1</text>
  <text x="485" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3×(4−1)=9</text>

  <!-- Sum row -->
  <rect x="40" y="232" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">总和 = (−3) + 0 + 9 = 6</text>

  <!-- Subsequences breakdown -->
  <rect x="40" y="278" width="480" height="130" fill="#f8f8f8" stroke="#ddd" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="60" y="298" font-size="10" fill="#888" font-weight="bold">验证：枚举所有 7 个非空子序列</text>

  <text x="60" y="318" font-size="10" fill="#666">子序列</text>
  <text x="180" y="318" font-size="10" fill="#666">max</text>
  <text x="240" y="318" font-size="10" fill="#666">min</text>
  <text x="310" y="318" font-size="10" fill="#666">宽度</text>

  <text x="60" y="336" font-size="9" fill="#333">[1]</text>
  <text x="180" y="336" font-size="9" fill="#333">1</text>
  <text x="240" y="336" font-size="9" fill="#333">1</text>
  <text x="310" y="336" font-size="9" fill="#333">0</text>

  <text x="60" y="350" font-size="9" fill="#333">[2]</text>
  <text x="180" y="350" font-size="9" fill="#333">2</text>
  <text x="240" y="350" font-size="9" fill="#333">2</text>
  <text x="310" y="350" font-size="9" fill="#333">0</text>

  <text x="60" y="364" font-size="9" fill="#333">[3]</text>
  <text x="180" y="364" font-size="9" fill="#333">3</text>
  <text x="240" y="364" font-size="9" fill="#333">3</text>
  <text x="310" y="364" font-size="9" fill="#333">0</text>

  <text x="380" y="336" font-size="9" fill="#333">[1,2]</text>
  <text x="460" y="336" font-size="9" fill="#333">2−1=1</text>

  <text x="380" y="350" font-size="9" fill="#333">[2,3]</text>
  <text x="460" y="350" font-size="9" fill="#333">3−2=1</text>

  <text x="380" y="364" font-size="9" fill="#333">[1,3]</text>
  <text x="460" y="364" font-size="9" fill="#333">3−1=2</text>

  <text x="60" y="380" font-size="9" fill="#333">[1,2,3]</text>
  <text x="180" y="380" font-size="9" fill="#333">3</text>
  <text x="240" y="380" font-size="9" fill="#333">1</text>
  <text x="310" y="380" font-size="9" fill="#b85450" font-weight="bold">2</text>

  <text x="380" y="380" font-size="9" fill="#666">宽度之和:</text>
  <text x="460" y="380" font-size="10" fill="#4a7a3a" font-weight="bold">0+0+0+1+1+2+2=6</text>

  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">公式结果 6 = 枚举结果 6 ✓</text>
</svg>
