<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：plants = [2,2,3,3], capA = 5, capB = 5</text>
  <text x="290" y="42" text-anchor="middle" font-size="10.5" fill="#888">初始：a = 5, b = 5, refills = 0</text>

  <!-- Table header -->
  <text x="40" y="70" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">轮次</text>
  <text x="155" y="70" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">Alice 操作</text>
  <text x="258" y="70" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">a: 前→后</text>
  <text x="365" y="70" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">Bob 操作</text>
  <text x="468" y="70" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">b: 前→后</text>
  <text x="535" y="70" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">refills</text>

  <!-- header underline -->
  <path d="M 20 78 L 565 78" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: round 1, i=0, j=3 -->
  <rect x="20" y="84" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="40" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮1</text>
  <text x="90" y="100" font-size="9" fill="#888">i=0</text>

  <rect x="80" y="84" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="106" text-anchor="middle" font-size="10.5" fill="#333">浇 plants[0]=2</text>

  <text x="258" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5 → 3</text>

  <rect x="290" y="84" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="106" text-anchor="middle" font-size="10.5" fill="#333">浇 plants[3]=3</text>

  <text x="468" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5 → 2</text>

  <text x="535" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>

  <!-- Row 2: round 2, i=1, j=2 -->
  <rect x="20" y="124" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="40" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮2</text>
  <text x="90" y="140" font-size="9" fill="#888">i=1</text>

  <rect x="80" y="124" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="146" text-anchor="middle" font-size="10.5" fill="#333">浇 plants[1]=2</text>

  <text x="258" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3 → 1</text>

  <!-- Bob refill highlight -->
  <rect x="290" y="124" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="146" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">灌满 + 浇 plants[2]=3</text>

  <text x="468" y="146" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2 → 2</text>

  <rect x="510" y="124" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="535" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>

  <!-- divider -->
  <path d="M 20 172 L 565 172" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- loop end note -->
  <text x="40" y="194" font-size="10.5" fill="#666">i=2, j=1：</text>
  <rect x="100" y="180" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="210" y="198" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">i &gt; j，循环结束，无相遇</text>

  <!-- final result -->
  <rect x="80" y="218" width="420" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终答案：refills = 0 + 1 = 1</text>

  <!-- breakdown -->
  <rect x="60" y="264" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮2：Bob 的 b=2 &lt; plants[2]=3 → 立即灌满 b=5 再浇 → b=2, refills=1</text>
  <text x="290" y="300" text-anchor="middle" font-size="10" fill="#888">n=4 为偶数，Alice 浇 {0,1}、Bob 浇 {3,2}，两人在中间擦肩不相遇</text>
</svg>
