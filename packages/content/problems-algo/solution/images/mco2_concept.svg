<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">翻转一个 0 = 拼接前后两段 1</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">以 nums = [1, 0, 1, 1, 0, 1]，翻下标 1 的 0 为例</text>

  <!-- index labels -->
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <text x="115" y="76">0</text><text x="173" y="76">1</text><text x="231" y="76">2</text>
    <text x="289" y="76">3</text><text x="347" y="76">4</text><text x="405" y="76">5</text>
  </g>

  <!-- prev run: index 0 -> 1 (blue) -->
  <rect x="90" y="84" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="115" y="110" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">1</text>

  <!-- flipped 0: index 1 (orange, emphasized) -->
  <rect x="148" y="84" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="173" y="110" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">0</text>

  <!-- cur run: index 2,3 -> 1,1 (green) -->
  <rect x="206" y="84" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="231" y="110" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="264" y="84" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="289" y="110" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- not flipped 0: index 4 (grey dashed) -->
  <rect x="322" y="84" width="50" height="40" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="347" y="110" text-anchor="middle" font-size="18" fill="#bbb" font-weight="bold">0</text>

  <!-- outside: index 5 (grey dashed) -->
  <rect x="380" y="84" width="50" height="40" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="405" y="110" text-anchor="middle" font-size="18" fill="#bbb" font-weight="bold">1</text>

  <!-- segment brackets / labels -->
  <text x="115" y="146" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">prev = 1</text>
  <text x="173" y="146" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">+1</text>
  <text x="173" y="160" text-anchor="middle" font-size="9.5" fill="#d6a040">翻转</text>
  <text x="260" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">cur = 2</text>

  <!-- connecting brace: prev + 0 + cur span from x=90 to x=314 -->
  <path d="M 90 168 L 90 176 L 314 176 L 314 168" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="202" y="192" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">拼接后连续 1 段</text>

  <!-- formula box -->
  <rect x="40" y="206" width="440" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">候选答案 = prev + 1 + cur</text>
  <text x="260" y="252" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">= 1 + 1 + 2 = 4</text>

  <!-- note -->
  <rect x="40" y="278" width="440" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k = 1 时无需窗口计数</text>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#446688">prev / cur 两段长度接力，一趟扫描 O(n) O(1)</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">全 1 数组需 min(ans, n) 兜底</text>
</svg>
