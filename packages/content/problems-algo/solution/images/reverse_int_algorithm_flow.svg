<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">整数反转算法流程（弹出 → 溢出预判 → 压入）</text>

  <!-- Start -->
  <ellipse cx="200" cy="56" rx="78" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="60" text-anchor="middle" font-size="12" fill="#333">开始: rev = 0</text>

  <path d="M 200 76 L 200 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: x != 0? -->
  <polygon points="200,96 300,138 200,180 100,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="134" text-anchor="middle" font-size="12" fill="#333">x ≠ 0 ?</text>
  <text x="200" y="150" text-anchor="middle" font-size="10" fill="#666">(还有位数)</text>

  <!-- No -> return rev -->
  <path d="M 300 138 L 372 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="130" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="440" cy="138" rx="62" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="142" text-anchor="middle" font-size="11" fill="#333">返回 rev</text>

  <!-- Yes down: pop d -->
  <path d="M 200 180 L 200 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="194" font-size="11" fill="#82b366">是</text>

  <rect x="110" y="200" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="218" text-anchor="middle" font-size="11" fill="#333">弹出末位：d = x % 10</text>
  <text x="200" y="232" text-anchor="middle" font-size="11" fill="#333">x = x / 10</text>

  <path d="M 200 238 L 200 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: overflow positive? -->
  <polygon points="200,260 312,300 200,340 88,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="296" text-anchor="middle" font-size="11" fill="#333">rev &gt; INT_MAX/10</text>
  <text x="200" y="312" text-anchor="middle" font-size="11" fill="#333">或 (==且 d&gt;7) ?</text>

  <!-- Yes -> return 0 -->
  <path d="M 312 300 L 372 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="343" y="292" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <rect x="372" y="280" width="136" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="298" text-anchor="middle" font-size="11" fill="#333">正数侧溢出</text>
  <text x="440" y="312" text-anchor="middle" font-size="11" fill="#b85450">返回 0</text>

  <path d="M 200 340 L 200 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="352" font-size="11" fill="#82b366">否</text>

  <!-- Decision: overflow negative? -->
  <polygon points="200,360 312,400 200,440 88,400" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="396" text-anchor="middle" font-size="11" fill="#333">rev &lt; INT_MIN/10</text>
  <text x="200" y="412" text-anchor="middle" font-size="11" fill="#333">或 (==且 d&lt;−8) ?</text>

  <path d="M 312 400 L 372 400" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="343" y="392" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <rect x="372" y="380" width="136" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="398" text-anchor="middle" font-size="11" fill="#333">负数侧溢出</text>
  <text x="440" y="412" text-anchor="middle" font-size="11" fill="#b85450">返回 0</text>

  <!-- No -> push, loop back -->
  <path d="M 200 440 L 200 452" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="450" font-size="10" fill="#888">否 → rev=rev×10+d，回到循环</text>

  <path d="M 88 400 L 50 400 L 50 138 L 100 138" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="270" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 40 270)">继续下一位</text>
</svg>
