<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：操作区间互不相交，同一区间可链式连打</text>

  <rect x="150" y="52" width="112" height="118" rx="8" fill="#e6f4ea" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="206" y="45" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">区间 A [1,3]</text>
  <rect x="294" y="52" width="112" height="118" rx="8" fill="#fff8e1" fill-opacity="0.6" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="45" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">区间 B [5,7]</text>

  <text x="104" y="81" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">source</text>
  <g font-size="13" fill="#333">
    <rect x="116" y="60" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="134" y="81" text-anchor="middle" filter="url(#rough2)">a</text>
    <rect x="152" y="60" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="170" y="81" text-anchor="middle" filter="url(#rough2)">b</text>
    <rect x="188" y="60" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="206" y="81" text-anchor="middle" filter="url(#rough2)">c</text>
    <rect x="224" y="60" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="242" y="81" text-anchor="middle" filter="url(#rough2)">d</text>
    <rect x="260" y="60" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="278" y="81" text-anchor="middle" filter="url(#rough2)">e</text>
    <rect x="296" y="60" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="314" y="81" text-anchor="middle" filter="url(#rough2)">f</text>
    <rect x="332" y="60" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="350" y="81" text-anchor="middle" filter="url(#rough2)">g</text>
    <rect x="368" y="60" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="386" y="81" text-anchor="middle" filter="url(#rough2)">h</text>
  </g>

  <text x="104" y="147" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">target</text>
  <g font-size="13" fill="#333">
    <rect x="116" y="126" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="134" y="147" text-anchor="middle" filter="url(#rough2)">a</text>
    <rect x="152" y="126" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="170" y="147" text-anchor="middle" filter="url(#rough2)">c</text>
    <rect x="188" y="126" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="206" y="147" text-anchor="middle" filter="url(#rough2)">d</text>
    <rect x="224" y="126" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="242" y="147" text-anchor="middle" filter="url(#rough2)">e</text>
    <rect x="260" y="126" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="278" y="147" text-anchor="middle" filter="url(#rough2)">e</text>
    <rect x="296" y="126" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="314" y="147" text-anchor="middle" filter="url(#rough2)">g</text>
    <rect x="332" y="126" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="350" y="147" text-anchor="middle" filter="url(#rough2)">h</text>
    <rect x="368" y="126" width="36" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="386" y="147" text-anchor="middle" filter="url(#rough2)">h</text>
  </g>

  <text x="76" y="234" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">链 A</text>
  <rect x="110" y="214" width="64" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="142" y="234" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">bcd</text>
  <path d="M 178 229 L 212 229" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="195" y="221" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">成本 1</text>
  <rect x="218" y="214" width="64" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="234" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">cde</text>
  <text x="298" y="234" font-size="11" fill="#4a7a3a" filter="url(#rough2)">← 区间 A 的链（1 步）</text>

  <text x="76" y="294" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">链 B</text>
  <rect x="110" y="274" width="64" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="142" y="294" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">fgh</text>
  <path d="M 178 289 L 212 289" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="195" y="281" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">成本 3</text>
  <rect x="218" y="274" width="64" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="294" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">thh</text>
  <path d="M 286 289 L 320 289" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="303" y="281" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">成本 5</text>
  <rect x="326" y="274" width="64" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="358" y="294" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ghh</text>
  <text x="110" y="326" font-size="11" fill="#8a6d3b" filter="url(#rough2)">← 区间 B 的链：同一区间连打 2 步（fgh 先变 thh 再变 ghh）</text>

  <rect x="40" y="352" width="440" height="72" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="374" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">任意两次操作：区间要么不相交，要么完全相同 ⇒</text>
  <text x="260" y="394" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">按区间分组：不同组两两不相交，组内串成一条替换链，</text>
  <text x="260" y="412" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">总成本 = Σ 链成本，区间互相独立 → 前缀 DP 的无后效性来源</text>
</svg>
