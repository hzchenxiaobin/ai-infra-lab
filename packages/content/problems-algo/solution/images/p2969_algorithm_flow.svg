<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 610" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="610" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">单调队列流程：dp[i] = 窗口 [⌈i/2⌉, i] 的最小候选</text>

  <rect x="440" y="38" width="168" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="524" y="58" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">不变式：队列中候选的值</text>
  <text x="524" y="72" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">从队首到队尾严格递增，</text>
  <text x="524" y="86" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">队首 = 窗口最小值</text>

  <ellipse cx="310" cy="64" rx="105" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="69" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp[0] = 0，q = 空队列</text>

  <line x1="310" y1="85" x2="310" y2="102" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="104" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">v = dp[i−1] + prices[i]（新候选 l=i）</text>

  <line x1="310" y1="140" x2="310" y2="156" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="310,158 428,198 310,238 192,198" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="202" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">队尾的值 ≥ v ?</text>

  <line x1="192" y1="198" x2="148" y2="198" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="170" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="55" y="182" width="95" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="102" y="202" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">弹出队尾</text>

  <path d="M 102 182 C 102 150, 210 138, 300 154" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <line x1="310" y1="238" x2="310" y2="254" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="251" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="185" y="256" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(i, v) 追加到队尾</text>

  <line x1="310" y1="292" x2="310" y2="308" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="310,310 428,350 310,390 192,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="354" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">队首下标 &lt; ⌈i/2⌉ ?</text>

  <line x1="192" y1="350" x2="148" y2="350" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="170" y="342" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="55" y="334" width="95" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="102" y="354" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">弹出队首</text>

  <path d="M 102 334 C 102 304, 210 292, 300 306" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <line x1="310" y1="390" x2="310" y2="406" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="403" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="185" y="408" width="250" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="310" y="430" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp[i] = 队首的值</text>

  <line x1="310" y1="444" x2="310" y2="460" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="310,462 398,496 310,530 222,496" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="500" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i == n ?</text>

  <line x1="398" y1="496" x2="453" y2="496" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="426" y="488" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否，i+1</text>
  <path d="M 455 496 L 566 496 L 566 122 L 437 122" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="505" y="114" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（i+1 ≤ n，回到循环开头）</text>

  <line x1="310" y1="530" x2="310" y2="548" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="545" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <ellipse cx="310" cy="574" rx="85" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="579" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 dp[n]</text>
</svg>
