<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：LAG 逐行回看，标记三连相同</text>

  <!-- Logs table header -->
  <text x="90" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Logs（按 id 排序）</text>
  <rect x="30" y="60" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="76" font-size="10" fill="#333">id</text>
  <text x="90" y="76" font-size="10" fill="#333">num</text>
  <text x="125" y="76" font-size="9" fill="#888">prev1/prev2</text>
  <line x1="70" y1="60" x2="70" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="60" x2="110" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 1: id=1, num=1 -->
  <rect x="30" y="84" width="120" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="99" font-size="10" fill="#333">1</text>
  <text x="90" y="99" font-size="10" fill="#333">1</text>
  <text x="125" y="99" font-size="9" fill="#aaa">NULL/N</text>
  <line x1="70" y1="84" x2="70" y2="106" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="84" x2="110" y2="106" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 2: id=2, num=1 -->
  <rect x="30" y="106" width="120" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="121" font-size="10" fill="#333">2</text>
  <text x="90" y="121" font-size="10" fill="#333">1</text>
  <text x="125" y="121" font-size="9" fill="#aaa">1/N</text>
  <line x1="70" y1="106" x2="70" y2="128" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="106" x2="110" y2="128" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 3: id=3, num=1 — HIT -->
  <rect x="30" y="128" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="143" font-size="10" fill="#333">3</text>
  <text x="90" y="143" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="125" y="143" font-size="9" fill="#b85450" font-weight="bold">1/1 ✓</text>
  <line x1="70" y1="128" x2="70" y2="150" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="128" x2="110" y2="150" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 4: id=4, num=2 -->
  <rect x="30" y="150" width="120" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="165" font-size="10" fill="#333">4</text>
  <text x="90" y="165" font-size="10" fill="#333">2</text>
  <text x="125" y="165" font-size="9" fill="#aaa">1/1</text>
  <line x1="70" y1="150" x2="70" y2="172" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="150" x2="110" y2="172" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 5: id=5, num=1 -->
  <rect x="30" y="172" width="120" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="187" font-size="10" fill="#333">5</text>
  <text x="90" y="187" font-size="10" fill="#333">1</text>
  <text x="125" y="187" font-size="9" fill="#aaa">2/1</text>
  <line x1="70" y1="172" x2="70" y2="194" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="172" x2="110" y2="194" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 6: id=6, num=2 -->
  <rect x="30" y="194" width="120" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="209" font-size="10" fill="#333">6</text>
  <text x="90" y="209" font-size="10" fill="#333">2</text>
  <text x="125" y="209" font-size="9" fill="#aaa">1/2</text>
  <line x1="70" y1="194" x2="70" y2="216" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="194" x2="110" y2="216" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 7: id=7, num=2 -->
  <rect x="30" y="216" width="120" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="231" font-size="10" fill="#333">7</text>
  <text x="90" y="231" font-size="10" fill="#333">2</text>
  <text x="125" y="231" font-size="9" fill="#aaa">2/1</text>
  <line x1="70" y1="216" x2="70" y2="238" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="216" x2="110" y2="238" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- LAG arrows: show prev1 and prev2 lookback -->
  <path d="M155 139 C190 138, 200 116, 155 116" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="195" y="128" font-size="8" fill="#b85450">prev1=1</text>
  <path d="M155 143 C210 144, 220 98, 155 98" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="215" y="110" font-size="8" fill="#b85450">prev2=1</text>

  <!-- Arrow to result -->
  <path d="M90 260 L90 290" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="278" font-size="9" fill="#4a7a3a">命中行 num=1</text>

  <!-- Right side: analysis steps -->
  <rect x="290" y="60" width="240" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">逐行判定（num = prev1 = prev2?）</text>

  <text x="305" y="100" font-size="9" fill="#333">id=1: 1 vs NULL vs NULL → ✗（无前两行）</text>
  <text x="305" y="116" font-size="9" fill="#333">id=2: 1 vs 1    vs NULL → ✗（仅一个前驱）</text>
  <text x="305" y="132" font-size="9" fill="#b85450" font-weight="bold">id=3: 1 vs 1 vs 1 → ✓ 三连命中！</text>
  <text x="305" y="148" font-size="9" fill="#333">id=4: 2 vs 1 vs 1    → ✗（num 变了）</text>
  <text x="305" y="164" font-size="9" fill="#333">id=5: 1 vs 2 vs 1    → ✗</text>
  <text x="305" y="180" font-size="9" fill="#333">id=6: 2 vs 1 vs 2    → ✗</text>
  <text x="305" y="196" font-size="9" fill="#333">id=7: 2 vs 2 vs 1    → ✗（prev2=1 不匹配）</text>
  <text x="305" y="216" font-size="9" fill="#888">→ 仅 id=3 命中，num=1</text>

  <!-- Result -->
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">DISTINCT 去重后结果</text>
  <rect x="210" y="312" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#333">ConsecutiveNums</text>
  <rect x="210" y="336" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- Bottom note -->
  <rect x="30" y="370" width="500" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="385" text-anchor="middle" font-size="10" fill="#d6a040">⚠ DISTINCT 不可省：同一 num 可能有多段三连（如 1,1,1,2,1,1,1 → 1 命中两次）</text>
</svg>
