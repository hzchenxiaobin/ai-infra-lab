<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：二维拆一维 — 行向右看 + 列向下看，answer = 行贡献 + 列贡献</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">heights = [[5,1],[3,1],[4,1]]，每人既向右看所在行又向下看所在列，两方向不交叉</text>

  <!-- Grid label -->
  <text x="40" y="74" font-size="10.5" fill="#666">网格</text>

  <!-- 3x2 grid: rows (0,0)=5 (0,1)=1 ; (1,0)=3 (1,1)=1 ; (2,0)=4 (2,1)=1 -->
  <!-- cell w=44 h=40, start x=70 y=56 -->
  <!-- row 0 -->
  <rect x="70" y="56" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="92" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="118" y="56" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="14" fill="#333">1</text>
  <!-- row 1 -->
  <rect x="70" y="100" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="92" y="124" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="118" y="100" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="124" text-anchor="middle" font-size="14" fill="#333">1</text>
  <!-- row 2 -->
  <rect x="70" y="144" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="92" y="168" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="118" y="144" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="168" text-anchor="middle" font-size="14" fill="#333">1</text>

  <!-- coordinate labels -->
  <text x="92" y="50" text-anchor="middle" font-size="9" fill="#888">col0</text>
  <text x="140" y="50" text-anchor="middle" font-size="9" fill="#888">col1</text>
  <text x="58" y="80" text-anchor="middle" font-size="9" fill="#888">row0</text>
  <text x="58" y="124" text-anchor="middle" font-size="9" fill="#888">row1</text>
  <text x="58" y="168" text-anchor="middle" font-size="9" fill="#888">row2</text>

  <!-- Rightward arrows from (0,0)=5 to (0,1)=1, blocked beyond -->
  <path d="M 116 70 L 132 70" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="64" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">向右1</text>

  <!-- Downward arrows from (0,0)=5 to (1,0)=3 and (2,0)=4 -->
  <path d="M 92 98 L 92 114" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 92 142 L 92 158" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="50" y="130" font-size="9.5" fill="#4a7a3a" font-weight="bold">向下2</text>

  <!-- (0,0) total = 3 callout -->
  <rect x="172" y="60" width="76" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="210" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(0,0) = 1+2 = 3</text>

  <!-- arrow from grid to right panels -->
  <path d="M 266 120 L 290 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right side: two pass panels -->
  <!-- Row pass panel -->
  <rect x="296" y="56" width="240" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="416" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">行趟：每行跑一遍 f(row)</text>
  <text x="416" y="92" text-anchor="middle" font-size="10.5" fill="#555">向右看：[5,1]→[1,0]　[3,1]→[1,0]　[4,1]→[1,0]</text>
  <text x="416" y="108" text-anchor="middle" font-size="10" fill="#888">行贡献 = [[1,0],[1,0],[1,0]]</text>

  <!-- Column pass panel -->
  <rect x="296" y="128" width="240" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="416" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">列趟：每列跑一遍 f(col)</text>
  <text x="416" y="164" text-anchor="middle" font-size="10.5" fill="#555">向下看：col0[5,3,4]→[2,1,0]　col1[1,1,1]→[1,1,0]</text>
  <text x="416" y="180" text-anchor="middle" font-size="10" fill="#888">列贡献 = [[2,1],[1,1],[0,0]]</text>

  <!-- Plus sign -->
  <text x="416" y="208" text-anchor="middle" font-size="20" fill="#d6a040" font-weight="bold">+</text>

  <!-- Sum result -->
  <rect x="296" y="216" width="240" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="416" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">相加 → answer</text>
  <text x="416" y="256" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">[[3,1],[2,1],[1,0]]</text>

  <!-- Bottom note: visibility rule -->
  <rect x="40" y="300" width="500" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">互可见规则：min(h[A], h[B]) &gt; max(中间所有人)</text>
  <text x="280" y="336" text-anchor="middle" font-size="10.5" fill="#555">可见者身高严格递增；遇首个 ≥ h[A] 者被挡住，序列终止</text>

  <!-- Legend -->
  <rect x="40" y="362" width="500" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <rect x="56" y="374" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="78" y="385" font-size="10" fill="#555">行趟（向右看）</text>
  <rect x="190" y="374" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="212" y="385" font-size="10" fill="#555">列趟（向下看）</text>
  <rect x="324" y="374" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="346" y="385" font-size="10" fill="#555">总和 answer</text>
  <text x="430" y="385" font-size="10" fill="#888">→ 答案正确</text>
  <text x="280" y="400" text-anchor="middle" font-size="9.5" fill="#aaa">与 1944 同骨架：从右/下到左/上 + 单调递减栈</text>
</svg>
