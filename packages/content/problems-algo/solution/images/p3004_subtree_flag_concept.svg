<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：子树同色性可自底向上 O(1) 合并</text>
  <text x="280" y="45" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">示例 3：colors = [1,2,3,3,3]，节点 2 的子树 {2,3,4} 全为色 3 → size = 3 即答案</text>

  <!-- subtree highlight ellipse: {2,3,4} -->
  <ellipse cx="252" cy="207" rx="100" ry="82" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- tree edges -->
  <g filter="url(#rough2)" stroke="#999" stroke-width="1.5">
    <line x1="165" y1="92" x2="95" y2="165"/>
    <line x1="165" y1="92" x2="245" y2="165"/>
    <line x1="245" y1="165" x2="205" y2="245"/>
    <line x1="245" y1="165" x2="290" y2="245"/>
  </g>

  <!-- nodes: fill = color value (1=blue, 2=orange, 3=green) -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <circle cx="165" cy="92" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="165" y="97" text-anchor="middle">0</text>
    <text x="165" y="124" text-anchor="middle" font-size="11" fill="#555">c=1</text>

    <circle cx="95" cy="165" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="95" y="170" text-anchor="middle">1</text>
    <text x="95" y="197" text-anchor="middle" font-size="11" fill="#8a6414">c=2</text>

    <circle cx="245" cy="165" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="245" y="170" text-anchor="middle">2</text>
    <text x="245" y="197" text-anchor="middle" font-size="11" fill="#2e5c22">c=3</text>

    <circle cx="205" cy="245" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="205" y="250" text-anchor="middle">3</text>
    <text x="205" y="277" text-anchor="middle" font-size="11" fill="#2e5c22">c=3</text>

    <circle cx="290" cy="245" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="290" y="250" text-anchor="middle">4</text>
    <text x="290" y="277" text-anchor="middle" font-size="11" fill="#2e5c22">c=3</text>
  </g>

  <!-- size / flag badges -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="180" y="58" width="58" height="15" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="209" y="69.5" text-anchor="middle" fill="#b85450">s=5 f=0 ✗</text>

    <rect x="110" y="133" width="52" height="15" fill="#fff" stroke="#999" stroke-width="1.2" rx="3"/>
    <text x="136" y="144.5" text-anchor="middle" fill="#555">s=1 f=1</text>

    <rect x="262" y="133" width="60" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="292" y="144.5" text-anchor="middle" fill="#2e5c22" font-weight="bold">s=3 f=1 ✓</text>

    <rect x="220" y="218" width="52" height="15" fill="#fff" stroke="#999" stroke-width="1.2" rx="3"/>
    <text x="246" y="229.5" text-anchor="middle" fill="#555">s=1 f=1</text>

    <rect x="306" y="218" width="52" height="15" fill="#fff" stroke="#999" stroke-width="1.2" rx="3"/>
    <text x="332" y="229.5" text-anchor="middle" fill="#555">s=1 f=1</text>
  </g>

  <!-- subtree annotation -->
  <text x="252" y="303" text-anchor="middle" font-size="10.5" fill="#2e5c22" filter="url(#rough2)">子树(2) = {2,3,4} 全为色 3 → flag=1, size=3</text>

  <!-- legend + note -->
  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <rect x="66" y="326" width="13" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="2"/>
    <text x="84" y="336">色 1</text>
    <rect x="118" y="326" width="13" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <text x="136" y="336">色 2</text>
    <rect x="170" y="326" width="13" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2"/>
    <text x="188" y="336">色 3</text>
    <text x="240" y="336">（节点填充色 = colors 值）</text>
  </g>
  <text x="170" y="356" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">flag[0]=0：孩子色 2≠1、色 3≠1 → 完整子树候选被封死</text>

  <!-- right box 1 -->
  <rect x="345" y="58" width="200" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#2c4a6e">
    <text x="445" y="80" text-anchor="middle" font-size="12" font-weight="bold">观察 ①：单点天然合法</text>
    <text x="445" y="102" text-anchor="middle">任意单节点子树必然同色</text>
    <text x="445" y="124" text-anchor="middle">⟹ 答案 ≥ 1，ans 初始化为 1</text>
  </g>

  <!-- right box 2 -->
  <rect x="345" y="158" width="200" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#8a6414">
    <text x="445" y="180" text-anchor="middle" font-size="12" font-weight="bold">观察 ②：自底向上合并</text>
    <text x="445" y="201" text-anchor="middle">flag[v] = AND flag[y]</text>
    <text x="445" y="219" text-anchor="middle">∧ (colors[y] = colors[v])</text>
    <text x="445" y="237" text-anchor="middle">size[v] = 1 + Σ size[y]</text>
  </g>

  <!-- right box 3 -->
  <rect x="345" y="266" width="200" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#2e5c22">
    <text x="445" y="288" text-anchor="middle" font-size="12" font-weight="bold">观察 ③：一次后序 O(n)</text>
    <text x="445" y="308" text-anchor="middle">flag[v]=1 的节点处更新答案</text>
    <text x="445" y="326" text-anchor="middle" font-size="10.5">ans = max(ans, size[v])</text>
  </g>

  <path d="M 315 120 L 341 120" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>
</svg>
