<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单遍扫描，遇 0 计数、遇 1 取大</text>

  <!-- Start oval -->
  <ellipse cx="280" cy="62" rx="56" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans=0, zeros=0</text>

  <!-- arrow down -->
  <path d="M 280 84 L 280 108" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop rect -->
  <rect x="160" y="112" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">遍历 s 中每个字符 c</text>

  <!-- arrow down to diamond -->
  <path d="M 280 150 L 280 176" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: c == '0'? -->
  <polygon points="280,180 360,220 280,260 200,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c == '0' ?</text>
  <text x="280" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold"></text>

  <!-- Yes branch: left -->
  <path d="M 200 220 L 120 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="204" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="80" y="225" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">zeros += 1</text>

  <!-- No branch: down -->
  <path d="M 280 260 L 280 290" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="280" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Diamond: zeros > 0? -->
  <polygon points="280,294 360,332 280,370 200,332" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">zeros &gt; 0 ?</text>

  <!-- Yes branch: left -->
  <path d="M 200 332 L 130 332" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="312" width="112" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="76" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans =</text>
  <text x="76" y="348" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">max(ans+1, zeros)</text>

  <!-- No branch: right -->
  <path d="M 360 332 L 430 332" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="316" width="110" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="485" y="338" text-anchor="middle" font-size="11" fill="#888">ans 不变（无 0 可跨）</text>

  <!-- merge arrows back up to loop: from zeros+=1, max, and "ans不变" back to loop rect -->
  <!-- left side return: from (80,204) up around to (160,130) -->
  <path d="M 80 204 L 80 150 L 160 130" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- middle return: from (76,354) up to loop -->
  <path d="M 76 354 L 76 150 L 160 122" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- right return: from (430,333) up and around to (400,130) -->
  <path d="M 430 333 L 420 150 L 400 130" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="160" font-size="10" fill="#888">回到循环</text>

  <!-- exit arrow from loop to return -->
  <path d="M 400 130 L 470 130 L 470 96 L 340 76" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="120" font-size="10" fill="#888">遍历完</text>

  <!-- End oval -->
  <ellipse cx="280" cy="406" rx="90" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="411" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">return ans</text>

  <!-- bottom note -->
  <rect x="60" y="438" width="440" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="455" text-anchor="middle" font-size="11" fill="#666">单遍 O(n) 扫描，O(1) 额外空间——满足进阶要求</text>
</svg>
