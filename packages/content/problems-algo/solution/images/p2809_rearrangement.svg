<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">重排不等式：大 nums2 配大时刻 tᵢ，减少量最大</text>

  <!-- left: wrong pairing (large b with small time) -->
  <text x="150" y="62" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">逆序配对（劣）</text>
  <!-- b values descending, times ascending -->
  <g font-size="13" fill="#333">
    <rect x="70" y="78" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="95" y="96" text-anchor="middle">b=9</text>
    <rect x="70" y="116" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="95" y="134" text-anchor="middle">b=5</text>
    <rect x="70" y="154" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="95" y="172" text-anchor="middle">b=2</text>
  </g>
  <g font-size="13" fill="#446688">
    <rect x="180" y="78" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="205" y="96" text-anchor="middle">t=1</text>
    <rect x="180" y="116" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="205" y="134" text-anchor="middle">t=2</text>
    <rect x="180" y="154" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="205" y="172" text-anchor="middle">t=3</text>
  </g>
  <!-- connect lines -->
  <line x1="120" y1="91" x2="180" y2="91" stroke="#888" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="120" y1="129" x2="180" y2="129" stroke="#888" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="120" y1="167" x2="180" y2="167" stroke="#888" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="150" y="206" text-anchor="middle" font-size="11" fill="#b85450">9·1+5·2+2·3 = 25</text>

  <!-- right: correct pairing (sorted same direction) -->
  <text x="410" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">同序配对（优）</text>
  <g font-size="13" fill="#333">
    <rect x="330" y="78" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="355" y="96" text-anchor="middle">b=2</text>
    <rect x="330" y="116" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="355" y="134" text-anchor="middle">b=5</text>
    <rect x="330" y="154" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="355" y="172" text-anchor="middle">b=9</text>
  </g>
  <g font-size="13" fill="#446688">
    <rect x="440" y="78" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="465" y="96" text-anchor="middle">t=1</text>
    <rect x="440" y="116" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="465" y="134" text-anchor="middle">t=2</text>
    <rect x="440" y="154" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="465" y="172" text-anchor="middle">t=3</text>
  </g>
  <line x1="380" y1="91" x2="440" y2="91" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="380" y1="129" x2="440" y2="129" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="380" y1="167" x2="440" y2="167" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="410" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2·1+5·2+9·3 = 39 ✅</text>

  <!-- arrow between two -->
  <path d="M 240 130 L 320 130" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="10" fill="#d6a040">排序</text>

  <!-- conclusion box -->
  <rect x="60" y="232" width="440" height="124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">结论</text>
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#444">· 按 nums2 升序排序后，第 j 个被清零的下标时刻恰为 j</text>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#444">· 减少量 = nums1[i] + nums2[i]·j，j 越大配越大的 nums2</text>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#444">· 最优解中每秒都清零（不留空），时刻 1..t 连续</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 转化为：选 t 个下标，最大化 Σ(nums1[i]+nums2[i]·j)</text>
</svg>
