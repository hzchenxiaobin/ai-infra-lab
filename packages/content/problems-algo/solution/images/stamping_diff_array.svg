<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">二维差分：一张邮票 = 4 个单点修改</text>

  <!-- diff grid 6x6, origin (52,68), cell 36 -->
  <g filter="url(#rough2)">
    <!-- all cells light -->
    <g fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1">
      <rect x="52" y="68" width="36" height="36" rx="2"/>
      <rect x="88" y="68" width="36" height="36" rx="2"/>
      <rect x="124" y="68" width="36" height="36" rx="2"/>
      <rect x="160" y="68" width="36" height="36" rx="2"/>
      <rect x="196" y="68" width="36" height="36" rx="2"/>
      <rect x="232" y="68" width="36" height="36" rx="2"/>
      <rect x="52" y="104" width="36" height="36" rx="2"/>
      <rect x="88" y="104" width="36" height="36" rx="2"/>
      <rect x="124" y="104" width="36" height="36" rx="2"/>
      <rect x="160" y="104" width="36" height="36" rx="2"/>
      <rect x="196" y="104" width="36" height="36" rx="2"/>
      <rect x="232" y="104" width="36" height="36" rx="2"/>
      <rect x="52" y="140" width="36" height="36" rx="2"/>
      <rect x="88" y="140" width="36" height="36" rx="2"/>
      <rect x="124" y="140" width="36" height="36" rx="2"/>
      <rect x="160" y="140" width="36" height="36" rx="2"/>
      <rect x="196" y="140" width="36" height="36" rx="2"/>
      <rect x="232" y="140" width="36" height="36" rx="2"/>
      <rect x="52" y="176" width="36" height="36" rx="2"/>
      <rect x="88" y="176" width="36" height="36" rx="2"/>
      <rect x="124" y="176" width="36" height="36" rx="2"/>
      <rect x="160" y="176" width="36" height="36" rx="2"/>
      <rect x="196" y="176" width="36" height="36" rx="2"/>
      <rect x="232" y="176" width="36" height="36" rx="2"/>
      <rect x="52" y="212" width="36" height="36" rx="2"/>
      <rect x="88" y="212" width="36" height="36" rx="2"/>
      <rect x="124" y="212" width="36" height="36" rx="2"/>
      <rect x="160" y="212" width="36" height="36" rx="2"/>
      <rect x="196" y="212" width="36" height="36" rx="2"/>
      <rect x="232" y="212" width="36" height="36" rx="2"/>
      <rect x="52" y="248" width="36" height="36" rx="2"/>
      <rect x="88" y="248" width="36" height="36" rx="2"/>
      <rect x="124" y="248" width="36" height="36" rx="2"/>
      <rect x="160" y="248" width="36" height="36" rx="2"/>
      <rect x="196" y="248" width="36" height="36" rx="2"/>
      <rect x="232" y="248" width="36" height="36" rx="2"/>
    </g>
    <!-- stamp region rows1-3 cols1-3 (cells (1,1)..(3,3)) light blue -->
    <g fill="#e8f0fe" stroke="#446688" stroke-width="1.2">
      <rect x="88" y="104" width="36" height="36" rx="2"/>
      <rect x="124" y="104" width="36" height="36" rx="2"/>
      <rect x="160" y="104" width="36" height="36" rx="2"/>
      <rect x="88" y="140" width="36" height="36" rx="2"/>
      <rect x="124" y="140" width="36" height="36" rx="2"/>
      <rect x="160" y="140" width="36" height="36" rx="2"/>
      <rect x="88" y="176" width="36" height="36" rx="2"/>
      <rect x="124" y="176" width="36" height="36" rx="2"/>
      <rect x="160" y="176" width="36" height="36" rx="2"/>
    </g>
    <!-- region outline -->
    <rect x="86" y="102" width="112" height="112" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="6 4" rx="4"/>
    <!-- 4 marks -->
    <!-- d[r1][c1] +1 green at (88,104) -->
    <rect x="88" y="104" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="2"/>
    <text x="106" y="127" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">+1</text>
    <!-- d[r2+1][c1] -1 red at (88,212) -->
    <rect x="88" y="212" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="2"/>
    <text x="106" y="235" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">−1</text>
    <!-- d[r1][c2+1] -1 red at (196,104) -->
    <rect x="196" y="104" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="2"/>
    <text x="214" y="127" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">−1</text>
    <!-- d[r2+1][c2+1] +1 green at (196,212) -->
    <rect x="196" y="212" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="2"/>
    <text x="214" y="235" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">+1</text>
  </g>

  <!-- labels for region -->
  <g filter="url(#rough2)" font-size="12" fill="#446688">
    <text x="142" y="98" text-anchor="middle">邮票区域 [r1..r2]×[c1..c2]</text>
    <text x="106" y="262" text-anchor="middle" fill="#b85450">r2+1</text>
    <text x="214" y="98" text-anchor="middle" fill="#b85450">c2+1</text>
  </g>

  <!-- arrows from +1 marks to region -->
  <g filter="url(#rough2)">
    <path d="M70,86 Q80,95 86,104" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)"/>
    <text x="48" y="92" font-size="11" fill="#4a7a3a">d[r1][c1]</text>
  </g>

  <!-- Right side: formula -->
  <g filter="url(#rough2)">
    <rect x="300" y="74" width="244" height="124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="312" y="98" font-size="13" fill="#2b2b2b">放一张邮票（覆盖到 r2,c2）：</text>
    <text x="312" y="122" font-size="13" fill="#4a7a3a">d[r1][c1]      += 1</text>
    <text x="312" y="144" font-size="13" fill="#b85450">d[r2+1][c1]   -= 1</text>
    <text x="312" y="166" font-size="13" fill="#b85450">d[r1][c2+1]   -= 1</text>
    <text x="312" y="188" font-size="13" fill="#4a7a3a">d[r2+1][c2+1] += 1</text>

    <rect x="300" y="214" width="244" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="312" y="238" font-size="13" fill="#2b2b2b">所有邮票标记完后：</text>
    <text x="312" y="262" font-size="13" fill="#2b2b2b">对 d 做一次二维前缀和</text>
    <text x="312" y="284" font-size="13" fill="#2b2b2b">d[i][j] += d[i-1][j]</text>
    <text x="320" y="300" font-size="13" fill="#2b2b2b">+ d[i][j-1] − d[i-1][j-1]</text>
    <text x="312" y="324" font-size="12" fill="#d6a040">⟹ coverage[i][j] = d[i+1][j+1]</text>
  </g>
</svg>
