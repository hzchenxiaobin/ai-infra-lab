<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：峰值是数组的固有属性，逐峰圈定左右端点范围</text>

  <!-- 面板一：唯一峰 + 距离 k -->
  <g filter="url(#rough2)">
    <rect x="24" y="34" width="512" height="158" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="36" y="54" font-size="12" fill="#33506b" font-weight="bold">① 唯一峰：两端各最多延伸 k 步——[4,3,5,1]，k = 2（示例 3）</text>

    <rect x="110" y="70" width="52" height="44" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="162" y="70" width="52" height="44" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="214" y="70" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="266" y="70" width="52" height="44" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="136" y="98" text-anchor="middle" font-size="15" fill="#333">4</text>
    <text x="188" y="98" text-anchor="middle" font-size="15" fill="#333">3</text>
    <text x="240" y="98" text-anchor="middle" font-size="15" fill="#8a6d1a" font-weight="bold">5</text>
    <text x="292" y="98" text-anchor="middle" font-size="15" fill="#333">1</text>
    <text x="136" y="126" text-anchor="middle" font-size="10" fill="#999">0</text>
    <text x="188" y="126" text-anchor="middle" font-size="10" fill="#999">1</text>
    <text x="240" y="126" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold">2</text>
    <text x="292" y="126" text-anchor="middle" font-size="10" fill="#999">3</text>
    <polygon points="233,66 247,66 240,57" fill="#d6a040"/>
    <text x="256" y="64" font-size="10" fill="#8a6d1a" font-weight="bold">峰值 p=2</text>

    <path d="M236 142 L142 142" stroke="#446688" stroke-width="1.8" marker-end="url(#arrL)"/>
    <text x="188" y="136" text-anchor="middle" font-size="9.5" fill="#33506b">i−l ≤ k（实扩 2 步）</text>
    <path d="M244 142 L288 142" stroke="#446688" stroke-width="1.8" marker-end="url(#arrR)"/>
    <text x="272" y="136" text-anchor="middle" font-size="9.5" fill="#33506b">r−i ≤ k</text>
    <text x="292" y="156" text-anchor="middle" font-size="9" fill="#b85450">n−1 截断，只剩 1 步</text>

    <rect x="336" y="70" width="184" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="428" y="88" text-anchor="middle" font-size="10" fill="#8a6d1a">子数组长度 ≤ 2k+1</text>
    <text x="428" y="104" text-anchor="middle" font-size="10" fill="#8a6d1a">两端到峰距离可不对称：</text>
    <text x="428" y="119" text-anchor="middle" font-size="10" fill="#8a6d1a">一端贴峰 0 步、另一端拉满 k</text>

    <text x="36" y="164" font-size="11" fill="#33506b">L = max(p−k, 0) = 0（无前峰）　　R = min(p+k, n−1) = 3（n−1 截断）</text>
    <text x="36" y="182" font-size="11.5" fill="#33506b" font-weight="bold">贡献 = (p−L+1)×(R−p+1) = 3×2 = 6 ✓（示例 3 答案）</text>
  </g>

  <!-- 面板二：相邻峰是墙 -->
  <g filter="url(#rough2)">
    <rect x="24" y="202" width="512" height="134" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="36" y="222" font-size="12" fill="#2f5d24" font-weight="bold">② 相邻峰是「墙」——[2,5,3,6,1]，k = 1（双峰交互）</text>

    <rect x="100" y="236" width="48" height="40" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="148" y="236" width="48" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="196" y="236" width="48" height="40" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="244" y="236" width="48" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="292" y="236" width="48" height="40" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="124" y="261" text-anchor="middle" font-size="14" fill="#333">2</text>
    <text x="172" y="261" text-anchor="middle" font-size="14" fill="#8a6d1a" font-weight="bold">5</text>
    <text x="220" y="261" text-anchor="middle" font-size="14" fill="#333">3</text>
    <text x="268" y="261" text-anchor="middle" font-size="14" fill="#8a6d1a" font-weight="bold">6</text>
    <text x="316" y="261" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="124" y="290" text-anchor="middle" font-size="9.5" fill="#999">0</text>
    <text x="172" y="290" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">1</text>
    <text x="220" y="290" text-anchor="middle" font-size="9.5" fill="#999">2</text>
    <text x="268" y="290" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">3</text>
    <text x="316" y="290" text-anchor="middle" font-size="9.5" fill="#999">4</text>

    <line x1="196" y1="230" x2="196" y2="286" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="196" y="227" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">墙</text>

    <text x="36" y="312" font-size="10.5" fill="#2f5d24">峰1(值5)：L∈[0,1]，R∈[1,2]（右界=墙）→ 2×2 = 4　　峰3(值6)：L∈[2,3]（左界=墙），R∈[3,4] → 2×2 = 4</text>
    <text x="36" y="330" font-size="10.5" fill="#2f5d24" font-weight="bold">合计 8；跨过墙就变双峰 ✗；k 从 1 增到 2 答案不变——墙比 k 更紧</text>
  </g>

  <!-- 底部：不重不漏 + 溢出 -->
  <g filter="url(#rough2)">
    <rect x="24" y="344" width="512" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="280" y="361" text-anchor="middle" font-size="11.5" fill="#8a3030" font-weight="bold">不重不漏：每个有效子数组恰含一个峰 ⟹ 按峰独立计数再求和（贡献法）</text>
    <text x="280" y="379" text-anchor="middle" font-size="11" fill="#8a3030">答案可达 ~n²/4 ≈ 2.5×10⁹（n=10⁵）&gt; int32 上限 → 必须 long long</text>
  </g>
</svg>
