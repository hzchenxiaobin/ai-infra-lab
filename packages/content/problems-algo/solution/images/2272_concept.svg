<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：固定字符对 (X,Y)，X→+1 / Y→−1，求“至少含一个 Y”的最大子数组和</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">双状态 Kadane：f=无约束最大和，g=“含≥1 个 Y”最大和；遇 Y 时把 f “提升”为 g</text>

  <!-- ===== Reduction strip ===== -->
  <rect x="30" y="56" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">波动 = count(最多) − count(最少) ⟶ 固定对 (X,Y)：X→+1，Y→−1，其余→0</text>
  <text x="280" y="90" text-anchor="middle" font-size="10.5" fill="#446688">子串数值和 = count(X)−count(Y)；只需强制 Y 出现（和&gt;0 则 X 亦出现）</text>

  <!-- ===== indices ===== -->
  <text x="100" y="118" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="150" y="118" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="200" y="118" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="250" y="118" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="300" y="118" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="350" y="118" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="400" y="118" text-anchor="middle" font-size="9" fill="#888">6</text>

  <!-- ===== char row: s="aababbb", X='b' green, Y='a' orange ===== -->
  <text x="62" y="146" font-size="10.5" fill="#666" font-weight="bold">s</text>
  <rect x="78" y="126" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="146" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">a</text>
  <rect x="128" y="126" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="146" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">a</text>
  <rect x="178" y="126" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">b</text>
  <rect x="228" y="126" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="146" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">a</text>
  <rect x="278" y="126" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">b</text>
  <rect x="328" y="126" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="350" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">b</text>
  <rect x="378" y="126" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="400" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">b</text>
  <text x="436" y="146" font-size="9.5" fill="#888">X=b(+1) Y=a(−1)</text>

  <!-- ===== value row ===== -->
  <text x="62" y="178" font-size="10.5" fill="#666">val</text>
  <text x="100" y="178" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">−1</text>
  <text x="150" y="178" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">−1</text>
  <text x="200" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="250" y="178" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">−1</text>
  <text x="300" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="350" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="400" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- ===== f lane ===== -->
  <text x="40" y="214" font-size="10.5" fill="#666" font-weight="bold">f（无约束）</text>
  <rect x="78" y="198" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="217" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−1</text>
  <rect x="128" y="198" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="217" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−1</text>
  <rect x="178" y="198" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="217" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="228" y="198" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="217" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="278" y="198" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="217" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="328" y="198" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="217" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="378" y="198" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="217" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- promotion arrows at Y positions (i=0,1,3): f → g -->
  <path d="M 100 228 L 100 248" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3 2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 150 228 L 150 248" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3 2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 250 228 L 250 248" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="250" y="242" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">提升</text>

  <!-- ===== g lane ===== -->
  <text x="40" y="276" font-size="10.5" fill="#666" font-weight="bold">g（含≥1 Y）</text>
  <rect x="78" y="258" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="277" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>
  <rect x="128" y="258" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="277" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>
  <rect x="178" y="258" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="277" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="228" y="258" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="277" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="278" y="258" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="277" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="328" y="258" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="277" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <rect x="378" y="258" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="277" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="430" y="277" font-size="9.5" fill="#b85450" font-weight="bold">ans=3</text>

  <!-- ===== transition formula box ===== -->
  <rect x="30" y="300" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">遇 Y（−1）时三选一：g ← max( g−1,  f−1,  −1 )</text>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#666">① 延伸已含 Y 的最优前段   ② 把无约束 f 接上当前 Y “提升”合法化   ③ 单取当前 Y 作新起点</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#888">遇 X（+1）：f=max(f+1,1)，g=g+1（须已含 Y）；遇其余（0）：f=max(f,0)，g 不变</text>

  <!-- ===== invariant / footer ===== -->
  <rect x="30" y="374" width="500" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">不变式：g ≤ f 恒成立（g 是 f 的受限子集）；ans = max_i g_i 即本对贡献</text>
  <text x="280" y="411" text-anchor="middle" font-size="10" fill="#4a7a3a">本例对 (X='b',Y='a')：子串 "babbb" 和=3 = count(b)−count(a) = 4−1 = 波动</text>
  <text x="280" y="427" text-anchor="middle" font-size="10" fill="#666">枚举全部 26×26 有序对取最大：最优子串的 (最多字符, 最少字符) 必在某一对其上取等号</text>
  <text x="280" y="446" text-anchor="middle" font-size="9.5" fill="#888">哨兵 NEG=−10⁵ 表“尚未含 Y”，遇 Y 即被 max(·,−1) 覆盖，无需特判</text>
</svg>
