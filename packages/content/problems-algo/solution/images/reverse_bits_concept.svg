<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：逐位取放——从 n 低位取 1 位，塞进 result 高位</text>

  <!-- ===== n 行 (4 位简化: 1101) ===== -->
  <text x="48" y="86" font-size="12.5" fill="#446688" font-weight="bold">n = 13</text>
  <text x="48" y="102" font-size="10" fill="#888">4 位简化</text>
  <!-- 位3 位2 位1 位0 -->
  <rect x="160" y="66" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="89" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="220" y="66" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="248" y="89" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="280" y="66" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="308" y="89" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <rect x="340" y="66" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="89" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <!-- 位标签 -->
  <text x="188" y="54" text-anchor="middle" font-size="9.5" fill="#888">位3</text>
  <text x="248" y="54" text-anchor="middle" font-size="9.5" fill="#888">位2</text>
  <text x="308" y="54" text-anchor="middle" font-size="9.5" fill="#888">位1</text>
  <text x="368" y="54" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">位0</text>
  <text x="410" y="86" font-size="10.5" fill="#b85450" font-weight="bold">↑ n &amp; 1 取最低位</text>

  <!-- 交叉箭头: n位i -> result位(3-i) -->
  <!-- 位0 -> result位3 (右下到左下) -->
  <path d="M 368 104 C 368 150, 188 150, 188 196" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 位1 -> result位2 -->
  <path d="M 308 104 C 308 150, 248 150, 248 196" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 位2 -> result位1 -->
  <path d="M 248 104 C 248 150, 308 150, 308 196" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 位3 -> result位0 -->
  <path d="M 188 104 C 188 150, 368 150, 368 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 中间标注 -->
  <text x="436" y="156" font-size="10.5" fill="#888">位 i → 位 (3−i)</text>
  <text x="436" y="170" font-size="10" fill="#888">逐位交叉</text>

  <!-- ===== result 行 (1011) ===== -->
  <text x="48" y="216" font-size="12.5" fill="#4a7a3a" font-weight="bold">result</text>
  <text x="48" y="232" font-size="10" fill="#888">翻转后</text>
  <rect x="160" y="198" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="221" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <rect x="220" y="198" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="248" y="221" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <rect x="280" y="198" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="308" y="221" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="340" y="198" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="368" y="221" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="188" y="248" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">位3←原位0</text>
  <text x="368" y="248" text-anchor="middle" font-size="9.5" fill="#888">位0←原位3</text>

  <!-- 公式框 -->
  <rect x="50" y="268" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">每轮：bit = n &amp; 1;  res = (res &lt;&lt; 1) | bit;  n &gt;&gt;= 1</text>

  <!-- 底部说明 -->
  <rect x="50" y="318" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="336" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">res 左移腾出最低位放新 bit，循环 32 轮后最早取的位被推到最高位</text>
  <text x="270" y="352" text-anchor="middle" font-size="11" fill="#888">（4 位简化演示，32 位同理循环 32 次）</text>
</svg>
