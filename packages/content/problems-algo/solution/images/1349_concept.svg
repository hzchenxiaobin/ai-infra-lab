<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：学生可视范围 = 左 / 右 / 左上 / 右上</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">正前方、正后方不可见 → 可坐人；同行左右、上行斜对角禁坐</text>

  <!-- ===== grid 5 cols × 4 rows ===== -->
  <!-- origin (150,64), cell 52×42 -->
  <g font-size="13">
    <!-- row 0 -->
    <rect x="150" y="64" width="52" height="42" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="202" y="64" width="52" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="228" y="91" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
    <rect x="254" y="64" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="280" y="91" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <rect x="306" y="64" width="52" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="332" y="91" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
    <rect x="358" y="64" width="52" height="42" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

    <!-- row 1 (student row) -->
    <rect x="150" y="106" width="52" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="176" y="133" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
    <rect x="202" y="106" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <circle cx="228" cy="127" r="15" fill="#446688" filter="url(#rough2)"/>
    <text x="228" y="132" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">S</text>
    <rect x="254" y="106" width="52" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="280" y="133" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
    <rect x="306" y="106" width="52" height="42" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="358" y="106" width="52" height="42" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

    <!-- row 2 -->
    <rect x="150" y="148" width="52" height="42" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="202" y="148" width="52" height="42" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="254" y="148" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="280" y="175" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <rect x="306" y="148" width="52" height="42" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="358" y="148" width="52" height="42" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

    <!-- row 3 (empty) -->
    <rect x="150" y="190" width="52" height="42" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="202" y="190" width="52" height="42" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="254" y="190" width="52" height="42" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="306" y="190" width="52" height="42" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="358" y="190" width="52" height="42" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  </g>

  <!-- direction labels -->
  <text x="228" y="58" text-anchor="middle" font-size="9" fill="#b85450">左上</text>
  <text x="332" y="58" text-anchor="middle" font-size="9" fill="#b85450">右上</text>
  <text x="280" y="58" text-anchor="middle" font-size="9" fill="#4a7a3a">正前</text>
  <text x="176" y="104" text-anchor="middle" font-size="9" fill="#b85450">左</text>
  <text x="280" y="104" text-anchor="middle" font-size="9" fill="#b85450">右</text>
  <text x="280" y="202" text-anchor="middle" font-size="9" fill="#4a7a3a">正后</text>

  <!-- dashed arrows from student to visible positions -->
  <path d="M 214 127 L 192 127" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 242 127 L 264 127" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 218 116 L 240 98" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 238 116 L 316 98" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== legend ===== -->
  <rect x="40" y="252" width="220" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="56" y="266" width="20" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="278" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <text x="86" y="278" font-size="11" fill="#444">可视方向 → 不可坐人</text>
  <rect x="56" y="288" width="20" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="86" y="300" font-size="11" fill="#444">不可视方向 → 可坐人</text>

  <!-- ===== constraints ===== -->
  <rect x="290" y="252" width="230" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="272" font-size="10" fill="#446688" font-weight="bold">位掩码约束：</text>
  <text x="300" y="288" font-size="10" fill="#444" font-family="monospace">同行: mask &amp; (mask&lt;&lt;1) == 0</text>
  <text x="300" y="302" font-size="10" fill="#444" font-family="monospace">跨行: mask &amp; (prev&lt;&lt;1|prev&gt;&gt;1) == 0</text>

  <!-- bottom note -->
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#888">学生 S 在 (row=1, col=2)，红色 ✗ 为可被看到的四个方向，绿色 ✓ 为看不到的方向</text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#888">n ≤ 8 → 每行用 8 位掩码编码就座方案，共 2⁸ = 256 种状态</text>
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#888">逐行 DP，只需关心上一行的掩码即可判断兼容性</text>
</svg>
