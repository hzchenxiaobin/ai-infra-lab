<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：两个指标是两套口径 —— ① 峰值并发看「段」，② 总时长看「对」</text>

  <path d="M 110 50 L 530 50" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 110 46 L 110 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 166 46 L 166 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 222 46 L 222 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 278 46 L 278 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 334 46 L 334 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 390 46 L 390 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 446 46 L 446 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 502 46 L 502 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 530 46 L 530 54" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="42" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">09</text>
  <text x="166" y="42" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">11</text>
  <text x="222" y="42" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">13</text>
  <text x="278" y="42" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">15</text>
  <text x="334" y="42" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">17</text>
  <text x="390" y="42" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">19</text>
  <text x="446" y="42" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">21</text>
  <text x="502" y="42" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">23</text>
  <text x="530" y="42" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">00:00</text>

  <rect x="110" y="62" width="224" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="222" y="73" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">s1 09:00–17:00</text>
  <rect x="278" y="84" width="224" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="390" y="95" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">s2 15:00–23:00</text>
  <rect x="306" y="106" width="224" height="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="418" y="117" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">s3 16:00–次日00:00</text>

  <text x="58" y="145" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">指标①</text>
  <text x="58" y="159" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">逐段计数</text>

  <rect x="110" y="136" width="168" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="194" y="150" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="278" y="136" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="292" y="150" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="306" y="136" width="28" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="150" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="334" y="136" width="168" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="418" y="150" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="502" y="136" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="516" y="150" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">1</text>

  <text x="306" y="172" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">峰值 = 3（16:00–17:00 段）</text>
  <text x="306" y="186" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">→ max_overlapping_shifts</text>

  <text x="58" y="207" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">指标②</text>
  <text x="58" y="221" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">按对求和</text>

  <rect x="278" y="196" width="56" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="306" y="205" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">2h</text>
  <rect x="306" y="213" width="28" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="320" y="222" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">1h</text>
  <rect x="306" y="230" width="196" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="404" y="239" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">7h</text>

  <rect x="306" y="58" width="28" height="188" fill="#fce4ec" fill-opacity="0.4" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3" rx="2" filter="url(#rough2)"/>

  <text x="110" y="260" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">Σ 每对时长 = 2h + 1h + 7h = 10h = 600 分钟 → total_overlap_duration</text>
  <text x="110" y="274" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">（16:00–17:00 那一小时被 3 对各数一次，不是并集的 8h = 480）</text>

  <rect x="22" y="288" width="252" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="148" y="308" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">指标① 峰值并发</text>
  <text x="148" y="326" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">任一时刻同时在岗班次数的最大值</text>
  <text x="148" y="342" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">边界点切原子段 → 逐段计数 → MAX</text>
  <text x="148" y="358" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">与重叠对无关：单班次员工也是 1</text>

  <rect x="296" y="288" width="242" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="417" y="308" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">指标② 按对求和（分钟）</text>
  <text x="417" y="326" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">Σ 每对 [max(starts), min(ends)]</text>
  <text x="417" y="342" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">k 重交叠区被数 C(k,2) 次</text>
  <text x="417" y="358" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">≠ 并集时长：600 ≠ 480</text>

  <rect x="22" y="378" width="516" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⚠️ 最大陷阱：600 是「对的和」，不是「重叠区域并集」的 480 —— 动手前先对齐口径</text>
</svg>
