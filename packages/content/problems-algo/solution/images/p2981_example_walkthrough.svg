<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "aaabaaa"（n = 7）</text>

  <!-- ===== step 1: runs ===== -->
  <text x="30" y="62" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 分段</text>

  <rect x="100" y="70" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="89" text-anchor="middle" font-size="13" fill="#2f4d6b" filter="url(#rough2)">a</text>
  <rect x="126" y="70" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="89" text-anchor="middle" font-size="13" fill="#2f4d6b" filter="url(#rough2)">a</text>
  <rect x="152" y="70" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="89" text-anchor="middle" font-size="13" fill="#2f4d6b" filter="url(#rough2)">a</text>
  <rect x="186" y="70" width="26" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="89" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">b</text>
  <rect x="220" y="70" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="89" text-anchor="middle" font-size="13" fill="#2f4d6b" filter="url(#rough2)">a</text>
  <rect x="246" y="70" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="89" text-anchor="middle" font-size="13" fill="#2f4d6b" filter="url(#rough2)">a</text>
  <rect x="272" y="70" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="89" text-anchor="middle" font-size="13" fill="#2f4d6b" filter="url(#rough2)">a</text>

  <rect x="96" y="66" width="86" height="36" fill="none" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <rect x="182" y="66" width="34" height="36" fill="none" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <rect x="216" y="66" width="86" height="36" fill="none" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>

  <text x="139" y="118" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">L=3</text>
  <text x="199" y="118" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">L=1</text>
  <text x="259" y="118" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">L=3</text>

  <text x="360" y="86" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">runs：</text>
  <text x="360" y="106" font-size="11.5" fill="#555" filter="url(#rough2)">a: [3, 3]　b: [1]</text>

  <!-- ===== step 2: binary search table ===== -->
  <text x="30" y="152" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 二分最大可行长度 k</text>

  <rect x="36" y="160" width="448" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="64" y="176" text-anchor="middle" font-size="11" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">lo</text>
  <text x="104" y="176" text-anchor="middle" font-size="11" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">hi</text>
  <text x="146" y="176" text-anchor="middle" font-size="11" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">mid</text>
  <text x="232" y="176" text-anchor="middle" font-size="11" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">a 段计数 (4−k)×2</text>
  <text x="330" y="176" text-anchor="middle" font-size="11" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">可行？</text>
  <text x="418" y="176" text-anchor="middle" font-size="11" fill="#2f4d6b" font-weight="bold" filter="url(#rough2)">动作</text>

  <rect x="36" y="184" width="448" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="201" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="104" y="201" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">7</text>
  <text x="146" y="201" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="232" y="201" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0 + 0 = 0</text>
  <text x="330" y="201" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="418" y="201" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">hi = 3</text>

  <rect x="36" y="210" width="448" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="227" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="104" y="227" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="146" y="227" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="232" y="227" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2 + 2 = 4</text>
  <text x="330" y="227" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="418" y="227" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = 2, lo = 3</text>

  <rect x="36" y="236" width="448" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="253" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="104" y="253" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="146" y="253" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="232" y="253" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1 + 1 = 2</text>
  <text x="330" y="253" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="418" y="253" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">hi = 2</text>

  <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">b 段（L=1）在 k ≥ 2 时贡献 0；lo = 3 &gt; hi = 2，二分结束 → 返回 ans = 2</text>

  <!-- ===== step 3: four occurrences ===== -->
  <text x="30" y="314" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 验证："aa" 共出现 4 次（重叠也算）</text>

  <rect x="60" y="324" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="73" y="342" text-anchor="middle" font-size="12" fill="#2f4d6b" filter="url(#rough2)">a</text>
  <rect x="86" y="324" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="99" y="342" text-anchor="middle" font-size="12" fill="#2f4d6b" filter="url(#rough2)">a</text>
  <rect x="112" y="324" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="125" y="342" text-anchor="middle" font-size="12" fill="#2f4d6b" filter="url(#rough2)">a</text>
  <rect x="138" y="324" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="151" y="342" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">b</text>
  <rect x="164" y="324" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="177" y="342" text-anchor="middle" font-size="12" fill="#2f4d6b" filter="url(#rough2)">a</text>
  <rect x="190" y="324" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="203" y="342" text-anchor="middle" font-size="12" fill="#2f4d6b" filter="url(#rough2)">a</text>
  <rect x="216" y="324" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="229" y="342" text-anchor="middle" font-size="12" fill="#2f4d6b" filter="url(#rough2)">a</text>

  <rect x="60" y="360" width="52" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="86" y="372" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">#1</text>
  <rect x="86" y="380" width="52" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="112" y="392" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">#2</text>
  <rect x="164" y="360" width="52" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="190" y="372" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">#3</text>
  <rect x="190" y="380" width="52" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="216" y="392" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">#4</text>

  <text x="260" y="432" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">左段 3−2+1 = 2 次，右段 3−2+1 = 2 次，共 4 次 ≥ 3 ✓</text>
  <text x="260" y="456" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">对照："aaa" 每段仅 1 次，共 2 次 &lt; 3 ✗；官方示例 1 "aaaa"：单段 4−2+1 = 3 次 ✓</text>
</svg>
