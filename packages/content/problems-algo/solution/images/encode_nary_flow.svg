<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：encode（左）与 decode（右）互为镜像</text>

  <!-- ===== 左半：encode ===== -->
  <rect x="20" y="46" width="260" height="350" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="150" y="70" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">encode(root)：N叉树 → 二叉树</text>

  <rect x="44" y="84" width="212" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="106" text-anchor="middle" font-size="11" fill="#333">root == null ? 返回 null</text>

  <line x1="150" y1="118" x2="150" y2="136" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="44" y="138" width="212" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="160" text-anchor="middle" font-size="11" fill="#333">bn = TreeNode(root.val)</text>

  <line x1="150" y1="172" x2="150" y2="190" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="44" y="192" width="212" height="50" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="212" text-anchor="middle" font-size="11" fill="#333">if children 非空:</text>
  <text x="150" y="228" text-anchor="middle" font-size="11" fill="#446688">bn.left = encode(children[0])</text>

  <line x1="150" y1="242" x2="150" y2="260" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="44" y="262" width="212" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="150" y="282" text-anchor="middle" font-size="11" fill="#333">curr = bn.left</text>
  <text x="150" y="298" text-anchor="middle" font-size="11" fill="#b85450">for i in 1..len-1:</text>
  <text x="150" y="314" text-anchor="middle" font-size="11" fill="#b85450">curr.right = encode(children[i])</text>

  <line x1="150" y1="320" x2="150" y2="338" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="44" y="340" width="212" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="150" y="362" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return bn</text>

  <text x="150" y="390" text-anchor="middle" font-size="10" fill="#888">长子递归 encode → left</text>

  <!-- ===== 右半：decode ===== -->
  <rect x="300" y="46" width="260" height="350" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="430" y="70" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">decode(root)：二叉树 → N叉树</text>

  <rect x="324" y="84" width="212" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="106" text-anchor="middle" font-size="11" fill="#333">root == null ? 返回 null</text>

  <line x1="430" y1="118" x2="430" y2="136" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="324" y="138" width="212" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="160" text-anchor="middle" font-size="11" fill="#333">node = Node(root.val, [])</text>

  <line x1="430" y1="172" x2="430" y2="190" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="324" y="192" width="212" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a">curr = root.left（长子入口）</text>

  <line x1="430" y1="226" x2="430" y2="244" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="324" y="246" width="212" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="430" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">while curr != null:</text>
  <text x="430" y="284" text-anchor="middle" font-size="11" fill="#333">child = decode(curr)</text>
  <text x="430" y="300" text-anchor="middle" font-size="11" fill="#333">node.children.append(child)</text>
  <text x="430" y="316" text-anchor="middle" font-size="11" fill="#b85450">curr = curr.right（下一兄弟）</text>

  <line x1="430" y1="320" x2="430" y2="338" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="324" y="340" width="212" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="430" y="362" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return node</text>

  <text x="430" y="390" text-anchor="middle" font-size="10" fill="#888">沿 right 链收集所有兄弟</text>
</svg>
