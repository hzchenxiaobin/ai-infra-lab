<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举 1..n + 逐位分类判定</text>

  <!-- 1. init -->
  <rect x="180" y="46" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">ans = 0</text>
  <path d="M 280 78 L 280 92" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. outer loop -->
  <rect x="150" y="94" width="260" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="109" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">for i = 1 to n</text>
  <text x="280" y="124" text-anchor="middle" font-size="10" fill="#888">枚举 [1, n] 内每个整数</text>
  <path d="M 280 132 L 280 146" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. reset -->
  <rect x="150" y="148" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">changed = false ; tmp = i</text>
  <path d="M 280 186 L 280 200" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. take digit -->
  <rect x="170" y="202" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">d = tmp % 10</text>
  <path d="M 280 236 L 280 250" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. diamond: invalid? -->
  <polygon points="280,252 372,292 280,332 188,292" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">d ∈ {3,4,7} ?</text>
  <text x="280" y="304" text-anchor="middle" font-size="9.5" fill="#888">含非法位即作废</text>

  <!-- yes: break inner, jump to next i -->
  <path d="M 372 292 L 470 292" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="418" y="286" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="430" y="274" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="297" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">break（跳过）</text>

  <!-- no: go down to change check -->
  <path d="M 280 332 L 280 346" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="296" y="342" font-size="10" fill="#4a7a3a">否</text>

  <!-- 6. diamond: changes? -->
  <polygon points="280,348 372,386 280,424 188,386" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">d ∈ {2,5,6,9} ?</text>
  <text x="280" y="398" text-anchor="middle" font-size="9.5" fill="#888">命中改变位则标记</text>

  <!-- yes: set changed -->
  <path d="M 372 386 L 430 386" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="398" y="380" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="368" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="391" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">changed = true</text>

  <!-- merge down -->
  <path d="M 280 424 L 280 440" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 7. advance digit -->
  <rect x="170" y="442" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="464" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">tmp /= 10</text>
  <path d="M 280 476 L 280 490" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 8. diamond: tmp > 0? loop back to digit -->
  <polygon points="280,492 360,522 280,540 200,522" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="526" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">tmp &gt; 0 ?</text>

  <!-- yes: back to step 4 (take digit) -->
  <path d="M 360 522 L 470 522 L 470 219 L 390 219" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="430" y="516" text-anchor="middle" font-size="10" fill="#4a7a3a">是：取下一位</text>

  <!-- no: end of number -> changed? count -->
  <path d="M 200 522 L 70 522 L 70 360" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="86" y="516" font-size="10" fill="#888">否</text>
  <rect x="20" y="324" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="70" y="342" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">位数耗尽</text>
  <text x="70" y="356" text-anchor="middle" font-size="9.5" fill="#888">if changed</text>
  <path d="M 70 364 L 70 376" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="378" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="398" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans += 1</text>

  <!-- ans+=1 -> back to outer loop (for i) -->
  <path d="M 70 408 L 70 112 L 150 112" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 485 310 L 485 112 L 410 112" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="104" text-anchor="middle" font-size="10" fill="#888">← 取下一个 i</text>

  <!-- final return (right side) -->
  <rect x="430" y="46" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="485" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">return ans</text>
</svg>
