<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：枚举频率 k + 组合计数</text>

  <!-- step 1 -->
  <rect x="30" y="50" width="230" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="76" text-anchor="middle" font-size="13" fill="#2c3e50" filter="url(#rough2)">1. 统计每个字符频率 cnt，记 mx=max</text>

  <!-- step 2 -->
  <rect x="300" y="50" width="230" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="76" text-anchor="middle" font-size="13" fill="#2c3e50" filter="url(#rough2)">2. 预处理 fact[], inv[] 到 n</text>

  <path d="M 260 71 L 296 71" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop init -->
  <rect x="180" y="118" width="200" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="13" fill="#7a5520" filter="url(#rough2)">3. ans=0；k 从 1 到 mx</text>
  <path d="M 145 92 L 200 116" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 415 92 L 360 116" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- inner loop -->
  <rect x="40" y="186" width="280" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="208" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">4. prod=1；遍历 cnt[c]=f</text>
  <text x="180" y="228" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">若 f≥k：prod *= C(f,k)+1</text>
  <path d="M 280 160 L 180 184" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- accumulate -->
  <rect x="350" y="194" width="180" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="220" text-anchor="middle" font-size="13" fill="#7a2230" filter="url(#rough2)">5. ans += prod − 1</text>
  <path d="M 322 214 L 348 214" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop back -->
  <path d="M 440 236 C 440 290 440 300 280 300 C 200 300 180 282 180 246" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="12" fill="#a07020" filter="url(#rough2)">k++（循环回 3）</text>

  <!-- return -->
  <rect x="180" y="340" width="200" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="13" fill="#2c3e50" filter="url(#rough2)">6. 返回 (ans mod p + p) mod p</text>
  <path d="M 280 300 L 280 338" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
</svg>
