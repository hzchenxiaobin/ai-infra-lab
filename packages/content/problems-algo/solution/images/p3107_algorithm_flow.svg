<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 定中位 → 三段累加</text>

  <!-- Step 1: start -->
  <rect x="235" y="48" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="17" filter="url(#rough2)"/>
  <text x="310" y="70" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">开始：nums, k</text>

  <path d="M 310 82 L 310 98" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: sort -->
  <rect x="200" y="102" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">sort(nums) 升序排序</text>

  <path d="M 310 136 L 310 152" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: median index -->
  <rect x="160" y="156" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="178" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">m = n / 2 ← 偶数长度取较大中位数</text>
  <text x="478" y="177" font-size="9.5" fill="#b85450" filter="url(#rough2)">⚠️ 不是 n/2−1</text>

  <path d="M 310 190 L 310 206" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: median pinned to k -->
  <rect x="170" y="210" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans = |nums[m] − k|（long long）</text>
  <text x="462" y="231" font-size="9.5" fill="#b85450" filter="url(#rough2)">最大 ~2×10¹⁴</text>

  <path d="M 310 244 L 310 260" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: left half -->
  <rect x="140" y="264" width="340" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">for i in [0, m)：nums[i] &gt; k ⇒ ans += nums[i] − k</text>
  <text x="492" y="285" font-size="9.5" fill="#b85450" filter="url(#rough2)">左半超标压顶</text>

  <path d="M 310 298 L 310 314" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: right half -->
  <rect x="140" y="318" width="340" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="340" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">for i in (m, n)：nums[i] &lt; k ⇒ ans += k − nums[i]</text>
  <text x="492" y="339" font-size="9.5" fill="#446688" filter="url(#rough2)">右半不足托底</text>

  <path d="M 310 352 L 310 368" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 7: return -->
  <rect x="235" y="372" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="310" y="394" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="310" y="426" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">有序性：左半超标者是左半末尾连续后缀，右半不足者是右半开头连续前缀 → 扫描可提前 break</text>
</svg>
