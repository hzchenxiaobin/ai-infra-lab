<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">DP 核心递推：枚举第一刀 j，剩余部分拆或不拆</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">切下 j 后，剩余 n−j 可作为整体因子，也可继续拆分取最优</text>

  <!-- ===== n bar ===== -->
  <rect x="120" y="62" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">整数 n</text>

  <!-- scissors cut line -->
  <path d="M 200 98 L 200 130" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="186" y="118" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">第一刀 j</text>

  <!-- ===== j box ===== -->
  <rect x="70" y="132" width="130" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="156" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">j</text>
  <text x="135" y="174" text-anchor="middle" font-size="10" fill="#555">作为一个因子</text>
  <text x="135" y="186" text-anchor="middle" font-size="9" fill="#888">1 ≤ j &lt; n</text>

  <!-- ===== n-j box (the rest) ===== -->
  <rect x="240" y="132" width="210" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="345" y="156" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">剩余 n − j</text>
  <text x="345" y="174" text-anchor="middle" font-size="10" fill="#555">两种选择 ↓</text>

  <!-- arrow down from n-j -->
  <path d="M 345 190 L 345 208" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Choice A: keep ===== -->
  <rect x="232" y="212" width="100" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="282" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">不拆</text>
  <text x="282" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j × (n−j)</text>

  <!-- ===== Choice B: break ===== -->
  <rect x="352" y="212" width="100" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="402" y="232" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">继续拆</text>
  <text x="402" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j × dp[n−j]</text>

  <!-- arrow from j to both choices -->
  <path d="M 200 160 Q 240 160 260 212" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 160 Q 300 160 380 212" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== max bracket ===== -->
  <path d="M 232 264 Q 232 274 242 274 L 332 274 Q 342 274 342 284 L 342 284 Q 342 274 352 274 L 442 274 Q 452 274 452 264" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="342" y="292" text-anchor="middle" font-size="10" fill="#666">取较大</text>

  <!-- ===== Formula ===== -->
  <rect x="40" y="300" width="440" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dp[i] = max(j×(i−j), j×dp[i−j])</text>
  <text x="260" y="336" text-anchor="middle" font-size="9" fill="#888">枚举 j=1…i−1 取最大；dp[k] 记录「k 作为因子」的最大值（允许不拆）</text>
</svg>
