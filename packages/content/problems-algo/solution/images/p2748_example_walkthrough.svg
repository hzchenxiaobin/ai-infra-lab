<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2748w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：nums = [2, 5, 1, 4] → 5 组美丽对</text>

  <!-- array -->
  <text x="40" y="62" font-size="11" fill="#888" font-weight="bold">nums</text>
  <rect x="80" y="48" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="105" y="70" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <text x="105" y="96" text-anchor="middle" font-size="9" fill="#888">[0]</text>

  <rect x="135" y="48" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="160" y="70" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">5</text>
  <text x="160" y="96" text-anchor="middle" font-size="9" fill="#888">[1]</text>

  <rect x="190" y="48" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="215" y="70" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="215" y="96" text-anchor="middle" font-size="9" fill="#888">[2]</text>

  <rect x="245" y="48" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">4</text>
  <text x="270" y="96" text-anchor="middle" font-size="9" fill="#888">[3]</text>

  <!-- header row -->
  <text x="44" y="122" font-size="10" fill="#888" font-weight="bold">配对</text>
  <text x="100" y="122" font-size="10" fill="#d6a040" font-weight="bold">首位 a</text>
  <text x="180" y="122" font-size="10" fill="#4a7a3a" font-weight="bold">末位 b</text>
  <text x="260" y="122" font-size="10" fill="#888" font-weight="bold">gcd(a,b)</text>
  <text x="350" y="122" font-size="10" fill="#888" font-weight="bold">美丽?</text>

  <!-- (0,1) gcd(2,5)=1 ✓ -->
  <rect x="30" y="128" width="380" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="44" y="147" font-size="11" fill="#4a7a3a" font-weight="bold">(0,1)</text>
  <text x="100" y="147" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="180" y="147" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="260" y="147" font-size="11" fill="#333">1</text>
  <text x="350" y="147" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- (0,2) gcd(2,1)=1 ✓ -->
  <rect x="30" y="160" width="380" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="44" y="179" font-size="11" fill="#4a7a3a" font-weight="bold">(0,2)</text>
  <text x="100" y="179" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="180" y="179" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="260" y="179" font-size="11" fill="#333">1</text>
  <text x="350" y="179" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- (0,3) gcd(2,4)=2 ✗ -->
  <rect x="30" y="192" width="380" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="44" y="211" font-size="11" fill="#b85450" font-weight="bold">(0,3)</text>
  <text x="100" y="211" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="180" y="211" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="260" y="211" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="350" y="211" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <!-- (1,2) gcd(5,1)=1 ✓ -->
  <rect x="30" y="224" width="380" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="44" y="243" font-size="11" fill="#4a7a3a" font-weight="bold">(1,2)</text>
  <text x="100" y="243" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="180" y="243" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="260" y="243" font-size="11" fill="#333">1</text>
  <text x="350" y="243" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- (1,3) gcd(5,4)=1 ✓ -->
  <rect x="30" y="256" width="380" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="44" y="275" font-size="11" fill="#4a7a3a" font-weight="bold">(1,3)</text>
  <text x="100" y="275" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="180" y="275" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="260" y="275" font-size="11" fill="#333">1</text>
  <text x="350" y="275" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- (2,3) gcd(1,4)=1 ✓ -->
  <rect x="30" y="288" width="380" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="44" y="307" font-size="11" fill="#4a7a3a" font-weight="bold">(2,3)</text>
  <text x="100" y="307" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="180" y="307" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="260" y="307" font-size="11" fill="#333">1</text>
  <text x="350" y="307" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- side notes -->
  <text x="440" y="180" font-size="10" fill="#4a7a3a" font-weight="bold">绿 = 美丽</text>
  <text x="440" y="196" font-size="10" fill="#4a7a3a">gcd = 1</text>
  <text x="440" y="220" font-size="10" fill="#b85450" font-weight="bold">红 = 不美丽</text>
  <text x="440" y="236" font-size="10" fill="#b85450">仅(0,3)</text>
  <text x="440" y="252" font-size="10" fill="#b85450">gcd(2,4)=2</text>

  <!-- result -->
  <path d="M220,326 L220,348" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2748w)" filter="url(#rough2)"/>

  <rect x="120" y="352" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="220" y="378" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">5 组美丽对 ✓</text>
</svg>
