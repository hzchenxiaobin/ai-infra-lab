<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：位掩码编码 + 子集关系</text>

  <!-- word row label -->
  <text x="40" y="74" font-size="12" fill="#333" filter="url(#rough2)">word: able</text>
  <!-- word chips: a b e l -->
  <rect x="120" y="56" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="135" y="75" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="156" y="56" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="171" y="75" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">b</text>
  <rect x="192" y="56" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="207" y="75" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">e</text>
  <rect x="228" y="56" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="243" y="75" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">l</text>
  <text x="270" y="74" font-size="11" fill="#666" filter="url(#rough2)">掩码 = {a,b,e,l}</text>

  <!-- word mask bits (compact) -->
  <text x="40" y="104" font-size="10" fill="#888" filter="url(#rough2)">bit:</text>
  <text x="80" y="104" font-size="10" fill="#888" filter="url(#rough2)">...l..e.ba  (26 位，仅示出现位)</text>

  <!-- divider -->
  <path d="M 40 122 L 520 122" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- puzzle row label -->
  <text x="40" y="154" font-size="12" fill="#333" filter="url(#rough2)">puzzle: abslute</text>
  <!-- puzzle chips: a b e l s t u ; a = first letter (orange) -->
  <rect x="120" y="136" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="135" y="155" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">a</text>
  <rect x="156" y="136" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="171" y="155" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">b</text>
  <rect x="192" y="136" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="207" y="155" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">e</text>
  <rect x="228" y="136" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="243" y="155" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">l</text>
  <rect x="264" y="136" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="279" y="155" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">s</text>
  <rect x="300" y="136" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="315" y="155" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">t</text>
  <rect x="336" y="136" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="351" y="155" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">u</text>
  <text x="380" y="154" font-size="11" fill="#8a6a20" filter="url(#rough2)">↑ 首字母 a</text>

  <!-- containment check -->
  <text x="120" y="184" font-size="11" fill="#3a5a2a" filter="url(#rough2)">{a,b,e,l} ⊆ {a,b,e,l,s,t,u} ✓</text>

  <!-- arrow down -->
  <path d="M 280 196 L 280 212" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- two conditions -->
  <rect x="50" y="218" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="236" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">条件①：word 含首字母 a</text>
  <text x="160" y="251" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">(word &amp; first) ≠ 0</text>

  <rect x="290" y="218" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="236" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">条件②：word ⊆ puzzle</text>
  <text x="400" y="251" text-anchor="middle" font-size="10" fill="#3a5a2a" filter="url(#rough2)">(word &amp; ~puzzle) == 0</text>

  <!-- arrow down to insight -->
  <path d="M 280 266 L 280 282" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- insight box: flip perspective -->
  <rect x="40" y="288" width="480" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="13" fill="#8a3a3a" filter="url(#rough2)">翻转视角：不逐个查 word，改为枚举 puzzle 的子集</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#8a3a3a" filter="url(#rough2)">合法 word 的掩码 = puzzle 掩码的某个「含首字母」子集</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#8a3a3a" filter="url(#rough2)">预处理 freq[掩码] = 出现该字母集的 word 数</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#8a3a3a" filter="url(#rough2)">每个 puzzle 只枚举 2⁶ = 64 个子集，查表累加</text>
  <text x="280" y="394" text-anchor="middle" font-size="11" fill="#8a3a3a" filter="url(#rough2)">10⁵ words × 10⁴ puzzles → 仅 64×10⁴ 次查表</text>
</svg>
