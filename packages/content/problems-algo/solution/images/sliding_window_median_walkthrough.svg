<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="510" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [1,3,-1,-3,5,3,6,7], k = 3</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">6 个窗口，逐步展示双堆状态与中位数</text>

  <!-- Header -->
  <g font-size="9" fill="#888" font-weight="bold">
    <text x="30" y="64">步</text>
    <text x="60" y="64">i</text>
    <text x="95" y="64">窗口</text>
    <text x="215" y="64">left（大顶堆）</text>
    <text x="350" y="64">right（小顶堆）</text>
    <text x="470" y="64">中位数</text>
  </g>
  <line x1="20" y1="70" x2="540" y2="70" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 1: i=2, window [1,3,-1] ===== -->
  <g font-size="10">
    <text x="30" y="90" fill="#888">3</text>
    <text x="60" y="90" fill="#888">2</text>
    <!-- window cells -->
    <rect x="85" y="78" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="102" y="93" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="121" y="78" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="138" y="93" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="157" y="78" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="174" y="93" text-anchor="middle" fill="#4a7a3a" font-weight="bold">-1</text>
    <!-- left heap -->
    <rect x="215" y="78" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="235" y="93" text-anchor="middle" fill="#446688" font-weight="bold">1*</text>
    <rect x="257" y="78" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="277" y="93" text-anchor="middle" fill="#446688">-1</text>
    <!-- right heap -->
    <rect x="350" y="78" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="370" y="93" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3*</text>
    <!-- median -->
    <text x="470" y="93" fill="#b85450" font-weight="bold">1.0</text>
  </g>

  <!-- ===== Row 2: i=3, window [3,-1,-3] ===== -->
  <g font-size="10">
    <text x="30" y="128" fill="#888">4</text>
    <text x="60" y="128" fill="#888">3</text>
    <rect x="85" y="116" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="102" y="131" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="121" y="116" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="138" y="131" text-anchor="middle" fill="#4a7a3a" font-weight="bold">-1</text>
    <rect x="157" y="116" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="174" y="131" text-anchor="middle" fill="#4a7a3a" font-weight="bold">-3</text>
    <rect x="215" y="116" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="235" y="131" text-anchor="middle" fill="#446688" font-weight="bold">-1*</text>
    <rect x="257" y="116" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="277" y="131" text-anchor="middle" fill="#446688">-3</text>
    <rect x="350" y="116" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="370" y="131" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3*</text>
    <text x="470" y="131" fill="#b85450" font-weight="bold">-1.0</text>
    <text x="405" y="131" font-size="8" fill="#d6a040">删1+移1→right</text>
  </g>

  <!-- ===== Row 3: i=4, window [-1,-3,5] ===== -->
  <g font-size="10">
    <text x="30" y="166" fill="#888">5</text>
    <text x="60" y="166" fill="#888">4</text>
    <rect x="85" y="154" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="102" y="169" text-anchor="middle" fill="#4a7a3a" font-weight="bold">-1</text>
    <rect x="121" y="154" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="138" y="169" text-anchor="middle" fill="#4a7a3a" font-weight="bold">-3</text>
    <rect x="157" y="154" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="174" y="169" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="215" y="154" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="235" y="169" text-anchor="middle" fill="#446688" font-weight="bold">-1*</text>
    <rect x="257" y="154" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="277" y="169" text-anchor="middle" fill="#446688">-3</text>
    <rect x="350" y="154" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="370" y="169" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5*</text>
    <text x="470" y="169" fill="#b85450" font-weight="bold">-1.0</text>
    <text x="405" y="169" font-size="8" fill="#d6a040">删3+入5</text>
  </g>

  <!-- ===== Row 4: i=5, window [-3,5,3] ===== -->
  <g font-size="10">
    <text x="30" y="204" fill="#888">6</text>
    <text x="60" y="204" fill="#888">5</text>
    <rect x="85" y="192" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="102" y="207" text-anchor="middle" fill="#4a7a3a" font-weight="bold">-3</text>
    <rect x="121" y="192" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="138" y="207" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="157" y="192" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="174" y="207" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="215" y="192" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="235" y="207" text-anchor="middle" fill="#446688" font-weight="bold">3*</text>
    <rect x="257" y="192" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="277" y="207" text-anchor="middle" fill="#446688">-3</text>
    <rect x="350" y="192" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="370" y="207" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5*</text>
    <text x="470" y="207" fill="#b85450" font-weight="bold">3.0</text>
    <text x="405" y="207" font-size="8" fill="#d6a040">删-1+移3→left</text>
  </g>

  <!-- ===== Row 5: i=6, window [5,3,6] ===== -->
  <g font-size="10">
    <text x="30" y="242" fill="#888">7</text>
    <text x="60" y="242" fill="#888">6</text>
    <rect x="85" y="230" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="102" y="245" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="121" y="230" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="138" y="245" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="157" y="230" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="174" y="245" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <rect x="215" y="230" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="235" y="245" text-anchor="middle" fill="#446688" font-weight="bold">5*</text>
    <rect x="257" y="230" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="277" y="245" text-anchor="middle" fill="#446688">3</text>
    <rect x="350" y="230" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="370" y="245" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6*</text>
    <text x="470" y="245" fill="#b85450" font-weight="bold">5.0</text>
    <text x="405" y="245" font-size="8" fill="#d6a040">删-3+移5→left</text>
  </g>

  <!-- ===== Row 6: i=7, window [3,6,7] ===== -->
  <g font-size="10">
    <text x="30" y="280" fill="#888">8</text>
    <text x="60" y="280" fill="#888">7</text>
    <rect x="85" y="268" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="102" y="283" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="121" y="268" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="138" y="283" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <rect x="157" y="268" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="174" y="283" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <rect x="215" y="268" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="235" y="283" text-anchor="middle" fill="#446688" font-weight="bold">6*</text>
    <rect x="257" y="268" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="277" y="283" text-anchor="middle" fill="#446688">3</text>
    <rect x="350" y="268" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="370" y="283" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7*</text>
    <text x="470" y="283" fill="#b85450" font-weight="bold">6.0</text>
    <text x="405" y="283" font-size="8" fill="#d6a040">删5+移6→left</text>
  </g>

  <line x1="20" y1="300" x2="540" y2="300" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Output ===== -->
  <rect x="100" y="320" width="360" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">输出 = [1.0, -1.0, -1.0, 3.0, 5.0, 6.0]</text>
  <text x="280" y="354" text-anchor="middle" font-size="9" fill="#888">与排序验证一致：每窗排序取中</text>

  <!-- ===== Legend ===== -->
  <rect x="60" y="380" width="440" height="110" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">图例与说明</text>
  <g font-size="9" fill="#555">
    <text x="80" y="418">蓝色格 = left 大顶堆元素（较小一半）</text>
    <text x="80" y="432">绿色格 = right 小顶堆元素（较大一半）</text>
    <text x="80" y="446">* 标记 = 堆顶（left.max / right.min）</text>
    <text x="80" y="460">k=3 奇数 → 中位数 = left.top（left 比 right 多 1）</text>
    <text x="80" y="474">步骤 4 关键：add(-3) 后 left 过大 → 移堆顶 1 到 right → 删旧 1（堆顶 prune）</text>
    <text x="80" y="488">步骤 6 关键：删 -1 后 right 过大 → 移 right.top 3 到 left</text>
  </g>
</svg>
