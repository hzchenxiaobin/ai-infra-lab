<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 352" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="352" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">之字形遍历 + 全局交替跳过（示例 3：3×3）</text>
  <text x="290" y="38" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">按走行顺序给全局序号 k，只保留 k 为偶数的格子</text>

  <!-- 3x3 grid, cell 62x62, origin (60,76) -->
  <!-- kept cells -->
  <rect x="60" y="76" width="62" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="184" y="76" width="62" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="122" y="138" width="62" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="200" width="62" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="184" y="200" width="62" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <!-- skipped cells -->
  <rect x="122" y="76" width="62" height="62" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="184" y="138" width="62" height="62" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="138" width="62" height="62" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="122" y="200" width="62" height="62" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- k labels (top-left of each cell, traversal order) -->
  <text x="65" y="88" font-size="7.5" fill="#999" filter="url(#rough2)">k=0</text>
  <text x="127" y="88" font-size="7.5" fill="#999" filter="url(#rough2)">k=1</text>
  <text x="189" y="88" font-size="7.5" fill="#999" filter="url(#rough2)">k=2</text>
  <text x="189" y="150" font-size="7.5" fill="#999" filter="url(#rough2)">k=3</text>
  <text x="127" y="150" font-size="7.5" fill="#999" filter="url(#rough2)">k=4</text>
  <text x="65" y="150" font-size="7.5" fill="#999" filter="url(#rough2)">k=5</text>
  <text x="65" y="212" font-size="7.5" fill="#999" filter="url(#rough2)">k=6</text>
  <text x="127" y="212" font-size="7.5" fill="#999" filter="url(#rough2)">k=7</text>
  <text x="189" y="212" font-size="7.5" fill="#999" filter="url(#rough2)">k=8</text>

  <!-- values -->
  <text x="91" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="153" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="215" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="215" y="184" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <text x="153" y="184" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="91" y="184" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="91" y="246" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>
  <text x="153" y="246" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>
  <text x="215" y="246" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">9</text>

  <!-- skip marks -->
  <text x="171" y="130" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="233" y="192" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="109" y="192" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="171" y="254" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>

  <!-- zigzag path: row 0 left->right -->
  <path d="M 91 102 L 151 102" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 160 102 L 210 102" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- down at right -->
  <path d="M 233 108 L 233 156" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- row 1 right->left -->
  <path d="M 215 164 L 160 164" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 151 164 L 96 164" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- down at left -->
  <path d="M 73 170 L 73 218" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- row 2 left->right -->
  <path d="M 91 226 L 151 226" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 160 226 L 210 226" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- legend -->
  <text x="153" y="290" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">绿格＝保留（k 偶）　×＝跳过（k 奇）　箭头＝行走方向</text>

  <!-- right panel -->
  <rect x="290" y="60" width="270" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="306" y="82" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">全局序号 k（题眼）</text>
  <text x="306" y="102" font-size="9.5" fill="#333" filter="url(#rough2)">行 i 的格子占序号区间 [i·n, (i+1)·n)</text>
  <text x="306" y="118" font-size="9.5" fill="#333" filter="url(#rough2)">偶数行：k = i·n + 列号；奇数行：k = i·n + (n−1−列号)</text>
  <text x="306" y="134" font-size="9.5" fill="#446688" filter="url(#rough2)">保留 k 为偶数 ⇒ 每行从 start=(i·n)%2 起、步长 2</text>
  <text x="306" y="150" font-size="9.5" fill="#446688" filter="url(#rough2)">跳过的格子根本不必走</text>

  <rect x="290" y="172" width="270" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="306" y="194" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">⚠️ 交替跨行连续，不随行重置！</text>
  <text x="306" y="214" font-size="9.5" fill="#333" filter="url(#rough2)">本例 n=3（奇数）：第 1 行从右端先进 6，k=3 → 跳</text>
  <text x="306" y="230" font-size="9.5" fill="#333" filter="url(#rough2)">若误按「每行从取开始」，会错收 6 和 4</text>
  <text x="306" y="246" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">n 为偶数时 i·n 恒偶，每行起点恰好都是「取」</text>
  <text x="306" y="260" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">坑被掩盖 ⇒ 须用 n 奇数的用例自测</text>

  <rect x="290" y="284" width="270" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果（示例 3）</text>
  <text x="425" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1, 3, 5, 7, 9] ✓</text>
</svg>
