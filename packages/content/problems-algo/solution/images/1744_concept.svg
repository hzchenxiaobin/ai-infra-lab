<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心概念：糖果按类型排成一线，前缀和标记类型边界</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第 d 天的吃糖窗口 [d, (d+1)×cap−1] 与类型 t 的区间 [s[t], s[t+1]−1] 有交集 ⟺ true</text>

  <!-- ===== Candy line with types ===== -->
  <text x="40" y="74" font-size="11" fill="#888" filter="url(#rough2)">糖果序列（按类型排列，0-indexed）：</text>

  <!-- Type 0: 7 candies (s[0]=0 .. s[1]=7) -->
  <rect x="50" y="82" width="98" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="99" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">类型 0（7 颗）</text>

  <!-- Type 1: 4 candies (s[1]=7 .. s[2]=11) -->
  <rect x="148" y="82" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="176" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">类型1（4）</text>

  <!-- Type 2: 5 candies (s[2]=11 .. s[3]=16)  HIGHLIGHTED -->
  <rect x="204" y="82" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="239" y="100" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">类型 2（5 颗）★</text>

  <!-- Type 3: 3 candies (s[3]=16 .. s[4]=19) -->
  <rect x="274" y="82" width="42" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="295" y="100" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">类型3（3）</text>

  <!-- Type 4: 8 candies (s[4]=19 .. s[5]=27) -->
  <rect x="316" y="82" width="112" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="372" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">类型 4（8 颗）</text>

  <!-- Prefix sum markers below candy line -->
  <g font-size="9" fill="#666" filter="url(#rough2)">
    <text x="50" y="124" text-anchor="middle">s[0]=0</text>
    <text x="148" y="124" text-anchor="middle">s[1]=7</text>
    <text x="204" y="124" text-anchor="middle" fill="#d6a040" font-weight="bold">s[2]=11</text>
    <text x="274" y="124" text-anchor="middle" fill="#d6a040" font-weight="bold">s[3]=16</text>
    <text x="316" y="124" text-anchor="middle">s[4]=19</text>
    <text x="428" y="124" text-anchor="middle">s[5]=27</text>
  </g>

  <!-- tick marks -->
  <g stroke="#999" stroke-width="1" filter="url(#rough2)">
    <path d="M 50 110 L 50 116"/>
    <path d="M 148 110 L 148 116"/>
    <path d="M 204 110 L 204 116"/>
    <path d="M 274 110 L 274 116"/>
    <path d="M 316 110 L 316 116"/>
    <path d="M 428 110 L 428 116"/>
  </g>

  <!-- ===== Type t interval bracket (below) ===== -->
  <text x="40" y="148" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">类型 t=2 的区间：</text>
  <!-- bracket from s[2]=11 to s[3]-1=15, mapped to x=204..274 -->
  <path d="M 204 156 L 204 162 L 274 162 L 274 156" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="239" y="178" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">[s[2], s[3]−1] = [11, 15]</text>

  <!-- ===== Day d eating window bracket (above, query [2,13,∞]) ===== -->
  <text x="460" y="74" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">查询 [2, 13, cap]</text>

  <!-- Slowest: day 13 → candy 13 (1/day) -->
  <text x="40" y="206" font-size="11" fill="#888" filter="url(#rough2)">最慢（1 颗/天）：第 13 天吃第 13 号糖</text>
  <!-- candy 13 is in type 2 range [11,15] → mark with green dot -->
  <circle cx="239" cy="200" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="239" y="204" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">13</text>
  <text x="300" y="206" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">∈ [11,15] → 未吃完类型 2 ✓</text>

  <!-- Fastest: (13+1)*cap candies by end of day 13 -->
  <text x="40" y="234" font-size="11" fill="#888" filter="url(#rough2)">最快（cap 颗/天）：到第 13 天末共吃 14×cap 颗</text>
  <text x="40" y="250" font-size="10" fill="#4a7a3a" filter="url(#rough2)">14×cap > s[2]=11 → 已到达类型 2 ✓（cap≥1 即满足）</text>

  <!-- ===== Condition boxes ===== -->
  <rect x="40" y="270" width="260" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">条件一：least &lt; s[t+1]</text>
  <text x="170" y="306" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">day &lt; s[t+1]</text>
  <text x="170" y="320" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">最慢也没吃完类型 t → 还有 t 可吃</text>

  <rect x="320" y="270" width="260" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="290" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">条件二：most &gt; s[t]</text>
  <text x="450" y="306" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(day+1) × cap &gt; s[t]</text>
  <text x="450" y="320" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">最快已到达类型 t → 能开始吃 t</text>

  <!-- AND connector -->
  <text x="310" y="306" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">AND</text>

  <!-- ===== Result ===== -->
  <path d="M 170 326 L 170 348 L 310 348 L 310 360" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 450 326 L 450 348 L 310 348" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <rect x="210" y="366" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="386" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">两条件同时满足</text>
  <text x="310" y="402" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ answer = true ✓</text>

  <!-- Note about overflow -->
  <rect x="40" y="366" width="160" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="120" y="384" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 溢出警告</text>
  <text x="120" y="398" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">(day+1)×cap 可达 10¹⁸</text>
  <text x="120" y="412" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">s[t+1] 可达 10¹⁰ → 用 long</text>
</svg>
