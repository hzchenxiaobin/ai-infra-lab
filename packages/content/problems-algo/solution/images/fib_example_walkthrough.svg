<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n = 5 时 DP 数组填充过程</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">自底向上，每个 f[i] 由前两项相加得到，初值 f[0]=0, f[1]=1</text>

  <!-- ===== index row ===== -->
  <g font-size="11" fill="#888">
    <text x="80" y="95" text-anchor="middle">i</text>
    <text x="140" y="95" text-anchor="middle">0</text>
    <text x="210" y="95" text-anchor="middle">1</text>
    <text x="280" y="95" text-anchor="middle">2</text>
    <text x="350" y="95" text-anchor="middle">3</text>
    <text x="420" y="95" text-anchor="middle">4</text>
    <text x="490" y="95" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
  </g>

  <!-- ===== f[i] cells ===== -->
  <!-- f[0] init -->
  <rect x="115" y="108" width="50" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="136" text-anchor="middle" font-size="14" fill="#a07820" font-weight="bold">0</text>
  <!-- f[1] init -->
  <rect x="185" y="108" width="50" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="136" text-anchor="middle" font-size="14" fill="#a07820" font-weight="bold">1</text>
  <!-- f[2] -->
  <rect x="255" y="108" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="14" fill="#2a3f55" font-weight="bold">1</text>
  <!-- f[3] -->
  <rect x="325" y="108" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="136" text-anchor="middle" font-size="14" fill="#2a3f55" font-weight="bold">2</text>
  <!-- f[4] -->
  <rect x="395" y="108" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="136" text-anchor="middle" font-size="14" fill="#2a3f55" font-weight="bold">3</text>
  <!-- f[5] answer -->
  <rect x="465" y="108" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="136" text-anchor="middle" font-size="14" fill="#2d4d22" font-weight="bold">5</text>

  <!-- label f[i] -->
  <text x="80" y="136" text-anchor="middle" font-size="11" fill="#888">f[i]</text>

  <!-- ===== arrows for the current step: f[5] = f[4] + f[3] ===== -->
  <!-- from f[3] to f[5] (dashed, the i-2 term) -->
  <path d="M 350 155 Q 380 195 470 152" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="335" y="180" width="70" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="370" y="194" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">f[i-2]=2</text>

  <!-- from f[4] to f[5] (solid, the i-1 term) -->
  <path d="M 420 155 Q 445 178 475 152" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="172" width="68" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="464" y="186" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">f[i-1]=3</text>

  <!-- ===== step table ===== -->
  <rect x="40" y="220" width="480" height="100" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="60" y="244" font-size="11" fill="#444" font-weight="bold">逐步递推：</text>
  <g font-size="11" fill="#333">
    <text x="60" y="266">i=2: f[2] = f[1] + f[0] = 1 + 0 = 1</text>
    <text x="60" y="284">i=3: f[3] = f[2] + f[1] = 1 + 1 = 2</text>
    <text x="60" y="302">i=4: f[4] = f[3] + f[2] = 2 + 1 = 3</text>
    <text x="300" y="266">i=5: f[5] = f[4] + f[3] = 3 + 2 = 5  ← 答案</text>
    <text x="300" y="296" fill="#888" font-size="10">滚动数组只需保留 f[i-1]、f[i-2] 两个变量</text>
  </g>
</svg>
