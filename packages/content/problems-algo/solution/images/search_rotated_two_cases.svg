<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两种情形：左半有序 / 右半有序</text>

  <!-- ========= Case A: left half ordered ========= -->
  <rect x="20" y="40" width="520" height="170" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="40" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A. nums[left] ≤ nums[mid]：左半有序</text>

  <!-- array: left half blue (ordered), right half red (rotated) -->
  <rect x="60" y="78" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="96" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="104" y="78" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="96" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="148" y="78" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="96" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="192" y="78" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <rect x="236" y="78" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="96" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="280" y="78" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="96" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="324" y="78" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="96" text-anchor="middle" font-size="11" fill="#333">2</text>

  <text x="80" y="120" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">left</text>
  <text x="212" y="120" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">mid</text>
  <text x="344" y="120" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">right</text>

  <!-- bracket: left half ordered -->
  <path d="M 62 70 L 62 64 L 230 64 L 230 70" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="146" y="58" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">左半有序</text>

  <!-- decision -->
  <rect x="50" y="136" width="460" height="62" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="60" y="156" font-size="11" fill="#446688" font-weight="bold">若 nums[left] ≤ target &lt; nums[mid]：</text>
  <text x="380" y="156" font-size="11" fill="#4a7a3a" font-weight="bold">→ target 在左半，right = mid−1</text>
  <text x="60" y="178" font-size="11" fill="#888">否则：</text>
  <text x="380" y="178" font-size="11" fill="#b85450" font-weight="bold">→ target 在右半，left = mid+1</text>

  <!-- ========= Case B: right half ordered ========= -->
  <rect x="20" y="226" width="520" height="170" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="226" width="520" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">B. nums[mid] &lt; nums[right]：右半有序</text>

  <!-- array: left half red (rotated), right half blue (ordered) -->
  <rect x="60" y="264" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="282" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="104" y="264" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="282" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="148" y="264" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="282" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="192" y="264" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="282" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="236" y="264" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="282" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="280" y="264" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="282" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="324" y="264" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="282" text-anchor="middle" font-size="11" fill="#333">4</text>

  <text x="80" y="306" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">left</text>
  <text x="168" y="306" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">mid</text>
  <text x="344" y="306" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">right</text>

  <path d="M 150 256 L 150 250 L 274 250 L 274 256" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="212" y="244" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">右半有序</text>

  <rect x="50" y="322" width="460" height="62" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="60" y="342" font-size="11" fill="#446688" font-weight="bold">若 nums[mid] &lt; target ≤ nums[right]：</text>
  <text x="380" y="342" font-size="11" fill="#4a7a3a" font-weight="bold">→ target 在右半，left = mid+1</text>
  <text x="60" y="364" font-size="11" fill="#888">否则：</text>
  <text x="380" y="364" font-size="11" fill="#b85450" font-weight="bold">→ target 在左半，right = mid−1</text>

  <text x="280" y="408" text-anchor="middle" font-size="11" fill="#888">两种情形对称：先定有序半段，再据 target 是否落在有序区间收缩</text>
</svg>
