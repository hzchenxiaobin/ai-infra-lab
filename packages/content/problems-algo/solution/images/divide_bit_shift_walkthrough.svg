<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：100 ÷ 3 = 33（两轮）</text>

  <!-- ============ ROUND 1 ============ -->
  <rect x="24" y="38" width="532" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold">第 1 轮：a = 100</text>

  <!-- value doubling chain -->
  <text x="40" y="82" font-size="11" fill="#666">value 翻倍（≤ 100 才停）：</text>

  <rect x="44" y="92" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="64" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
  <text x="88" y="110" font-size="11" fill="#888">→</text>

  <rect x="100" y="92" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a">6</text>
  <text x="144" y="110" font-size="11" fill="#888">→</text>

  <rect x="156" y="92" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="178" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a">12</text>
  <text x="206" y="110" font-size="11" fill="#888">→</text>

  <rect x="218" y="92" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a">24</text>
  <text x="268" y="110" font-size="11" fill="#888">→</text>

  <rect x="280" y="92" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="302" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a">48</text>
  <text x="330" y="110" font-size="11" fill="#888">→</text>

  <rect x="342" y="92" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="110" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">96 ✓</text>
  <text x="394" y="110" font-size="11" fill="#888">→</text>

  <rect x="406" y="92" width="52" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="110" text-anchor="middle" font-size="11" fill="#b85450">192 ✗</text>
  <text x="464" y="110" font-size="10.5" fill="#888">超了，停</text>

  <!-- selection line -->
  <text x="40" y="140" font-size="11" fill="#444">选定 value = </text>
  <rect x="118" y="128" width="48" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="142" y="143" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">96</text>
  <text x="172" y="140" font-size="11" fill="#444">（= 3 ≪ 5），k = </text>
  <rect x="288" y="128" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="308" y="143" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">32</text>
  <text x="334" y="140" font-size="11" fill="#444">（= 2^5）</text>

  <!-- update line -->
  <rect x="40" y="158" width="500" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="56" y="178" font-size="11.5" fill="#333">a = 100 − 96 = </text>
  <text x="166" y="178" font-size="11.5" fill="#446688" font-weight="bold">4</text>
  <text x="186" y="178" font-size="11.5" fill="#333">，  ans = 0 + 32 = </text>
  <text x="320" y="178" font-size="11.5" fill="#4a7a3a" font-weight="bold">32</text>
  <text x="346" y="178" font-size="10.5" fill="#888">→ 继续下一轮（a ≥ b 仍成立）</text>

  <!-- arrow down to round 2 -->
  <path d="M 290 200 L 290 216" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ ROUND 2 ============ -->
  <rect x="24" y="218" width="532" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="40" y="238" font-size="12" fill="#446688" font-weight="bold">第 2 轮：a = 4</text>

  <text x="40" y="262" font-size="11" fill="#666">value 翻倍（≤ 4 才停）：</text>

  <rect x="44" y="272" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="64" y="290" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3 ✓</text>
  <text x="88" y="290" font-size="11" fill="#888">→</text>

  <rect x="100" y="272" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="290" text-anchor="middle" font-size="11" fill="#b85450">6 ✗</text>
  <text x="152" y="290" font-size="10.5" fill="#888">超了，停</text>

  <!-- selection line -->
  <text x="40" y="320" font-size="11" fill="#444">选定 value = </text>
  <rect x="118" y="308" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="138" y="323" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="164" y="320" font-size="11" fill="#444">（= 3 ≪ 0），k = </text>
  <rect x="280" y="308" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="323" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="326" y="320" font-size="11" fill="#444">（= 2^0）</text>

  <!-- update line -->
  <rect x="40" y="338" width="500" height="24" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="56" y="354" font-size="11.5" fill="#333">a = 4 − 3 = </text>
  <text x="138" y="354" font-size="11.5" fill="#446688" font-weight="bold">1</text>
  <text x="156" y="354" font-size="11.5" fill="#333">，  ans = 32 + 1 = </text>
  <text x="290" y="354" font-size="11.5" fill="#4a7a3a" font-weight="bold">33</text>
  <text x="316" y="354" font-size="10.5" fill="#888">→ a = 1 &lt; 3 = b，外层结束</text>

  <!-- final result -->
  <rect x="24" y="384" width="532" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="406" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">商 = 32 + 1 = 33 ✓  （= ⌊100 / 3⌋，向零截断一致）</text>
</svg>
