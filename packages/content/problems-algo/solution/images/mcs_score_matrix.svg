<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">兼容性评分矩阵：学生 × 导师 → 每格 = 答案相同的个数</text>

  <!-- Mentor column headers -->
  <text x="100" y="60" font-size="11" fill="#888">导师:</text>
  <!-- M0 [1,0,0] -->
  <rect x="140" y="44" width="90" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="185" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">M0</text>
  <text x="185" y="78" text-anchor="middle" font-size="10" fill="#666">[1,0,0]</text>
  <!-- M1 [0,0,1] -->
  <rect x="245" y="44" width="90" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">M1</text>
  <text x="290" y="78" text-anchor="middle" font-size="10" fill="#666">[0,0,1]</text>
  <!-- M2 [1,1,0] -->
  <rect x="350" y="44" width="90" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="395" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">M2</text>
  <text x="395" y="78" text-anchor="middle" font-size="10" fill="#666">[1,1,0]</text>

  <!-- Student row labels -->
  <!-- S0 [1,1,0] -->
  <rect x="20" y="108" width="110" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="48" y="124" font-size="11" fill="#333" font-weight="bold">S0</text>
  <text x="80" y="124" font-size="10" fill="#666">[1,1,0]</text>
  <!-- S1 [1,0,1] -->
  <rect x="20" y="168" width="110" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="48" y="184" font-size="11" fill="#333" font-weight="bold">S1</text>
  <text x="80" y="184" font-size="10" fill="#666">[1,0,1]</text>
  <!-- S2 [0,0,1] -->
  <rect x="20" y="228" width="110" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="48" y="244" font-size="11" fill="#333" font-weight="bold">S2</text>
  <text x="80" y="244" font-size="10" fill="#666">[0,0,1]</text>

  <!-- Score grid: S0 row -->
  <rect x="140" y="108" width="90" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="136" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">2</text>
  <rect x="245" y="108" width="90" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="136" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">0</text>
  <rect x="350" y="108" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="136" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- Score grid: S1 row -->
  <rect x="140" y="168" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="196" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="245" y="168" width="90" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="196" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">2</text>
  <rect x="350" y="168" width="90" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="196" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>

  <!-- Score grid: S2 row -->
  <rect x="140" y="228" width="90" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="256" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <rect x="245" y="228" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="256" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="350" y="228" width="90" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="256" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">0</text>

  <!-- Legend -->
  <rect x="460" y="108" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="129" text-anchor="middle" font-size="10" fill="#4a7a3a">= 最优配对</text>
  <rect x="460" y="150" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="500" y="171" text-anchor="middle" font-size="10" fill="#b85450">= 未选配对</text>

  <!-- Bottom explanation -->
  <rect x="30" y="300" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="325" text-anchor="middle" font-size="12" fill="#444">最优配对：S0→M2 (3) + S1→M0 (2) + S2→M1 (3) = 8</text>

  <!-- Assignment arrows -->
  <path d="M 130 130 L 138 130" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 190 L 138 190" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 250 L 138 250" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Problem essence -->
  <rect x="30" y="354" width="500" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="11" fill="#446688">问题本质：在 m×m 评分矩阵中选 m 个互不同行不同列的格，使和最大 → 指派问题</text>
</svg>
