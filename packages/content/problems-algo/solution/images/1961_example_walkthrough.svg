<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：游标 i 逐字符推进 + 词末检查</text>

  <!-- ===== Example 1: true ===== -->
  <text x="40" y="54" font-size="12.5" fill="#555" font-weight="bold">示例 1：s="iloveleetcode", words=["i","love","leetcode","apples"]</text>

  <!-- s characters with index ruler -->
  <text x="40" y="80" font-size="10" fill="#aaa">idx:</text>
  <g font-size="9.5" fill="#aaa" text-anchor="middle">
    <text x="93" y="80">0</text>
    <text x="123" y="80">1</text>
    <text x="153" y="80">2</text>
    <text x="183" y="80">3</text>
    <text x="213" y="80">4</text>
    <text x="243" y="80">5</text>
    <text x="273" y="80">6</text>
    <text x="303" y="80">7</text>
    <text x="333" y="80">8</text>
    <text x="363" y="80">9</text>
    <text x="393" y="80">10</text>
    <text x="423" y="80">11</text>
    <text x="453" y="80">12</text>
  </g>

  <text x="40" y="104" font-size="11" fill="#888">s:</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="78" y="88" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="93" y="107">i</text>
    <rect x="108" y="88" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="123" y="107">l</text>
    <rect x="138" y="88" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="153" y="107">o</text>
    <rect x="168" y="88" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="183" y="107">v</text>
    <rect x="198" y="88" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="213" y="107">e</text>
    <rect x="228" y="88" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="243" y="107">l</text>
    <rect x="258" y="88" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="273" y="107">e</text>
    <rect x="288" y="88" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="303" y="107">e</text>
    <rect x="318" y="88" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="333" y="107">t</text>
    <rect x="348" y="88" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="363" y="107">c</text>
    <rect x="378" y="88" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="393" y="107">o</text>
    <rect x="408" y="88" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="423" y="107">d</text>
    <rect x="438" y="88" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="453" y="107">e</text>
  </g>

  <!-- step rows -->
  <text x="40" y="138" font-size="11" fill="#888">步骤1:</text>
  <rect x="78" y="124" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"i"</text>
  <text x="125" y="142" font-size="10.5" fill="#4a7a3a">s[0]='i' ✓ → i=1, 词末 i≠13 继续</text>

  <text x="40" y="170" font-size="11" fill="#888">步骤2:</text>
  <rect x="108" y="156" width="118" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="167" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"love"</text>
  <text x="238" y="174" font-size="10.5" fill="#4a7a3a">s[1..4] ✓ → i=5, 词末 i≠13 继续</text>

  <text x="40" y="202" font-size="11" fill="#888">步骤3:</text>
  <rect x="228" y="188" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"leetcode"</text>
  <text x="478" y="206" font-size="10.5" fill="#4a7a3a" font-weight="bold">i=13= n ✓</text>

  <!-- boundary line -->
  <path d="M 468 84 L 468 216" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <rect x="78" y="220" width="420" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="288" y="239" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">词末 i==13==n → return true ✓ （"apples" 不处理）</text>

  <!-- Divider -->
  <path d="M 40 268 L 560 268" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 2: false (mismatch) ===== -->
  <text x="40" y="294" font-size="12.5" fill="#555" font-weight="bold">示例 2：s="iloveleetcode", words=["apples","i","love","leetcode"]</text>

  <text x="40" y="320" font-size="10" fill="#aaa">idx:</text>
  <g font-size="9.5" fill="#aaa" text-anchor="middle">
    <text x="93" y="320">0</text>
  </g>

  <text x="40" y="344" font-size="11" fill="#888">s:</text>
  <rect x="78" y="328" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="347" text-anchor="middle" font-size="12" fill="#333">i</text>
  <text x="118" y="344" font-size="10" fill="#888">... (n=13)</text>

  <text x="40" y="378" font-size="11" fill="#888">步骤1:</text>
  <rect x="78" y="364" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="382" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"apples"</text>
  <text x="170" y="382" font-size="10.5" fill="#b85450" font-weight="bold">w[0]='a' ≠ s[0]='i' → 失配!</text>

  <!-- mismatch annotation -->
  <path d="M 93 358 L 93 364" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 108 358 L 118 364" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="78" y="400" width="420" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="288" y="419" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">首字符 'a' ≠ 'i' → return false ✗ （O(1) 步即淘汰）</text>

  <!-- ===== Summary ===== -->
  <path d="M 40 448 L 560 448" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="78" y="456" width="460" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="308" y="470" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">三类检查：① 越界 i≥n → false  ② 失配 s[i]≠c → false  ③ 词末 i==n → true</text>
</svg>
