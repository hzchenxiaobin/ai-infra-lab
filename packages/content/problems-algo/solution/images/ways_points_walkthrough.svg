<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：target=6, types=[[6,1],[3,2],[2,3]] → dp[6]=7</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">dp[0..6] 经三种题型演化；橙列 = dp[6]（答案位）</text>

  <!-- ===== Header row ===== -->
  <rect x="40" y="56" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="105" y="75" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">处理后 \ j</text>
  <rect x="170" y="56" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="194" y="75" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">j=0</text>
  <rect x="218" y="56" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="242" y="75" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">j=1</text>
  <rect x="266" y="56" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="75" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">j=2</text>
  <rect x="314" y="56" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="75" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">j=3</text>
  <rect x="362" y="56" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="386" y="75" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">j=4</text>
  <rect x="410" y="56" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="434" y="75" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">j=5</text>
  <rect x="458" y="56" width="48" height="30" fill="#fff0d0" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="482" y="75" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">j=6</text>

  <!-- ===== Row r0: 初始 ===== -->
  <rect x="40" y="86" width="130" height="30" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="105" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">初始</text>
  <rect x="170" y="86" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="194" y="105" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="218" y="86" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="242" y="105" text-anchor="middle" font-size="11" fill="#bbb" font-family="monospace">0</text>
  <rect x="266" y="86" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="105" text-anchor="middle" font-size="11" fill="#bbb" font-family="monospace">0</text>
  <rect x="314" y="86" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="338" y="105" text-anchor="middle" font-size="11" fill="#bbb" font-family="monospace">0</text>
  <rect x="362" y="86" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="386" y="105" text-anchor="middle" font-size="11" fill="#bbb" font-family="monospace">0</text>
  <rect x="410" y="86" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="434" y="105" text-anchor="middle" font-size="11" fill="#bbb" font-family="monospace">0</text>
  <rect x="458" y="86" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="482" y="105" text-anchor="middle" font-size="11" fill="#bbb" font-family="monospace">0</text>

  <!-- ===== Row r1: 处理 (6,1) 后 ===== -->
  <rect x="40" y="116" width="130" height="30" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="135" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">处理(6,1)后</text>
  <rect x="170" y="116" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="194" y="135" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="218" y="116" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="242" y="135" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="266" y="116" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="135" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="314" y="116" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="338" y="135" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="362" y="116" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="386" y="135" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="410" y="116" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="434" y="135" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="458" y="116" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="482" y="135" text-anchor="middle" font-size="11" fill="#7a5a20" font-family="monospace" font-weight="bold">1</text>

  <!-- ===== Row r2: 处理 (3,2) 后 ===== -->
  <rect x="40" y="146" width="130" height="30" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="165" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">处理(3,2)后</text>
  <rect x="170" y="146" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="194" y="165" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="218" y="146" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="242" y="165" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="266" y="146" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="165" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="314" y="146" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="338" y="165" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">2</text>
  <rect x="362" y="146" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="386" y="165" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">3</text>
  <rect x="410" y="146" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="434" y="165" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">3</text>
  <rect x="458" y="146" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="482" y="165" text-anchor="middle" font-size="11" fill="#7a5a20" font-family="monospace" font-weight="bold">4</text>

  <!-- ===== Row r3: 处理 (2,3) 后 ===== -->
  <rect x="40" y="176" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="105" y="195" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">处理(2,3)后</text>
  <rect x="170" y="176" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="194" y="195" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="218" y="176" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="242" y="195" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="266" y="176" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="195" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="314" y="176" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="338" y="195" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">3</text>
  <rect x="362" y="176" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="386" y="195" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">4</text>
  <rect x="410" y="176" width="48" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="434" y="195" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">4</text>
  <rect x="458" y="176" width="48" height="30" fill="#ffe0b2" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="482" y="195" text-anchor="middle" font-size="12" fill="#b03a3a" font-family="monospace" font-weight="bold">7</text>

  <!-- annotations -->
  <text x="280" y="224" text-anchor="middle" font-size="11" fill="#7a5a20">↑ dp[6] 演化：0 → 1 → 4 → 7</text>
  <text x="280" y="240" text-anchor="middle" font-size="10.5" fill="#888">每轮累加「为该题型预留 k·marks 分后，剩余分用已处理题型凑的旧方案数」</text>

  <!-- formula box -->
  <rect x="40" y="252" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="11.5" fill="#7a5a20" font-family="monospace" font-weight="bold">处理(3,2)：dp[6] = dp[6] + dp[4] + dp[2] + dp[0] = 1+1+1+1 = 4</text>
  <text x="280" y="300" text-anchor="middle" font-size="11.5" fill="#7a5a20" font-family="monospace" font-weight="bold">处理(2,3)：dp[6] = dp[6] + dp[3] + dp[0] = 4+2+1 = 7 ✓</text>

  <!-- final box -->
  <rect x="80" y="332" width="400" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold">最终结果</text>
  <text x="280" y="378" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" font-family="monospace">答案 = dp[6] = 7 ✓</text>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#888">对应 7 种凑出 6 分的方法（见示例 1）</text>
</svg>
