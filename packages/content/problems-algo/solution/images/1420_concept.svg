<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">逐位扫描：遇到「更大值」才刷新最大值、cost + 1</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">arr = [3, 1, 4, 1, 5]，m = 5 → 最终 search_cost = 3</text>

  <!-- arr row label -->
  <text x="36" y="96" font-size="12" fill="#446688" font-weight="bold">arr[i]</text>

  <!-- 5 value cells: 3,1,4,1,5 -->
  <g font-size="16">
    <rect x="80" y="74" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="112" y="104" text-anchor="middle" fill="#333">3</text>
    <rect x="170" y="74" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="202" y="104" text-anchor="middle" fill="#333">1</text>
    <rect x="260" y="74" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="292" y="104" text-anchor="middle" fill="#333">4</text>
    <rect x="350" y="74" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="382" y="104" text-anchor="middle" fill="#333">1</text>
    <rect x="440" y="74" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="472" y="104" text-anchor="middle" fill="#333">5</text>
  </g>

  <!-- refresh / keep badges above cells -->
  <g font-size="10">
    <!-- pos 0: refresh -->
    <rect x="84" y="48" width="56" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
    <text x="112" y="62" text-anchor="middle" fill="#b85450" font-weight="bold">刷新 +1</text>
    <!-- pos 1: keep -->
    <rect x="174" y="48" width="56" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
    <text x="202" y="62" text-anchor="middle" fill="#4a7a3a">保持</text>
    <!-- pos 2: refresh -->
    <rect x="264" y="48" width="56" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
    <text x="292" y="62" text-anchor="middle" fill="#b85450" font-weight="bold">刷新 +1</text>
    <!-- pos 3: keep -->
    <rect x="354" y="48" width="56" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
    <text x="382" y="62" text-anchor="middle" fill="#4a7a3a">保持</text>
    <!-- pos 4: refresh -->
    <rect x="444" y="48" width="56" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
    <text x="472" y="62" text-anchor="middle" fill="#b85450" font-weight="bold">刷新 +1</text>
  </g>

  <!-- downward arrows to running state -->
  <g>
    <path d="M 112 122 L 112 144" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
    <path d="M 202 122 L 202 144" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
    <path d="M 292 122 L 292 144" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
    <path d="M 382 122 L 382 144" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
    <path d="M 472 122 L 472 144" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  </g>

  <!-- running max row -->
  <text x="36" y="168" font-size="12" fill="#446688" font-weight="bold">max</text>
  <g font-size="14">
    <rect x="80" y="150" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="112" y="170" text-anchor="middle" fill="#333">3</text>
    <rect x="170" y="150" width="64" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
    <text x="202" y="170" text-anchor="middle" fill="#666">3</text>
    <rect x="260" y="150" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="292" y="170" text-anchor="middle" fill="#333">4</text>
    <rect x="350" y="150" width="64" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
    <text x="382" y="170" text-anchor="middle" fill="#666">4</text>
    <rect x="440" y="150" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="472" y="170" text-anchor="middle" fill="#333">5</text>
  </g>

  <!-- cost row -->
  <text x="36" y="214" font-size="12" fill="#b85450" font-weight="bold">cost</text>
  <g font-size="14">
    <rect x="80" y="196" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="112" y="216" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="170" y="196" width="64" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
    <text x="202" y="216" text-anchor="middle" fill="#666">1</text>
    <rect x="260" y="196" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="292" y="216" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="350" y="196" width="64" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
    <text x="382" y="216" text-anchor="middle" fill="#666">2</text>
    <rect x="440" y="196" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="472" y="216" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- horizontal progression arrow -->
  <path d="M 80 252 L 504 252" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="10" fill="#b85450">扫描方向 →</text>

  <!-- insight box -->
  <rect x="60" y="276" width="440" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="80" y="300" font-size="12" fill="#446688" font-weight="bold">关键洞察</text>
  <text x="80" y="320" font-size="11" fill="#333">· cost 只在「v &gt; 当前最大值」时 +1，否则保持；</text>
  <text x="80" y="338" font-size="11" fill="#333">· 因此构造数组时只需跟踪两个量：当前最大值 j、已花代价 c；</text>
  <text x="80" y="356" font-size="11" fill="#333">· 更早的历史不影响未来 → 状态压成 (位数 i, j, c) 三维。</text>
</svg>
