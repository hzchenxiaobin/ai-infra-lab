<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双指针计数：mid = 3 时统计距离 ≤ 3 的数对（nums 已排序）</text>

  <!-- cell positions: x = 120 + idx*70, width 56 -->
  <!-- i=0 row -->
  <text x="40" y="74" font-size="12" fill="#888" font-weight="bold">i=0</text>
  <rect x="120" y="56" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="190" y="56" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="260" y="56" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="330" y="56" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>

  <!-- i pointer -->
  <text x="148" y="46" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i</text>
  <path d="M 148 48 L 148 54" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- j scan: 0→1→2→3 stop (7-1=6>3) -->
  <text x="358" y="46" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j 停</text>
  <path d="M 148 38 L 358 38" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- diff annotations -->
  <text x="218" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">2−1=1 ✓</text>
  <text x="288" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">4−1=3 ✓</text>
  <text x="358" y="108" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">7−1=6 ✗</text>
  <text x="412" y="78" font-size="11" fill="#444">数对 (0,1),(0,2) → j−i−1 = 3−0−1 = <tspan font-weight="bold" fill="#d6a040">2</tspan></text>

  <!-- i=1 row -->
  <text x="40" y="154" font-size="12" fill="#888" font-weight="bold">i=1</text>
  <rect x="120" y="136" width="56" height="36" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="148" y="160" text-anchor="middle" font-size="14" fill="#999">1</text>
  <rect x="190" y="136" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="260" y="136" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="330" y="136" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>

  <text x="218" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i</text>
  <path d="M 218 128 L 218 134" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="126" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j 不动</text>

  <text x="288" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a">4−2=2 ✓</text>
  <text x="358" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">7−2=5 ✗</text>
  <text x="412" y="158" font-size="11" fill="#444">数对 (1,2) → j−i−1 = 3−1−1 = <tspan font-weight="bold" fill="#d6a040">1</tspan></text>

  <!-- i=2 row -->
  <text x="40" y="234" font-size="12" fill="#888" font-weight="bold">i=2</text>
  <rect x="120" y="216" width="56" height="36" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="148" y="240" text-anchor="middle" font-size="14" fill="#999">1</text>
  <rect x="190" y="216" width="56" height="36" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="218" y="240" text-anchor="middle" font-size="14" fill="#999">2</text>
  <rect x="260" y="216" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="240" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="330" y="216" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="240" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>

  <text x="288" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i</text>
  <path d="M 288 208 L 288 214" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">j→越界</text>
  <path d="M 358 208 L 392 208" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="358" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a">7−4=3 ✓</text>
  <text x="412" y="238" font-size="11" fill="#444">数对 (2,3) → j−i−1 = 4−2−1 = <tspan font-weight="bold" fill="#d6a040">1</tspan></text>

  <!-- summary -->
  <rect x="60" y="294" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="318" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">count(3) = 2 + 1 + 1 = 4 ≥ k=4 ✓</text>
  <text x="300" y="340" text-anchor="middle" font-size="11" fill="#666">j 全程只增不减：i=0 时 j 走到 3，i=1、i=2 时 j 从 3 继续（最多再走 1 步）</text>
  <text x="300" y="358" text-anchor="middle" font-size="11" fill="#4a7a3a">两指针各走 ≤ n 步 ⇒ 每次 check 为 O(n)</text>

  <!-- legend -->
  <rect x="120" y="384" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="396" font-size="11" fill="#555">左端点 i</text>
  <rect x="210" y="384" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="232" y="396" font-size="11" fill="#555">j 扫过的合法位</text>
  <rect x="350" y="384" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="372" y="396" font-size="11" fill="#555">j 停下（差值超 mid）</text>
  <rect x="490" y="384" width="16" height="16" fill="#ddd" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="512" y="396" font-size="11" fill="#555">已跳过</text>

  <text x="300" y="426" text-anchor="middle" font-size="10" fill="#888">前提：nums 已排序 ⇒ nums[j]−nums[i] 随 i 增大而减小 ⇒ j 单调右移</text>
</svg>
