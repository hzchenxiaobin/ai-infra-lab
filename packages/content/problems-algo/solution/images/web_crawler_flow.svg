<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="580" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BFS 爬虫流程：队列驱动遍历</text>

  <!-- Step 1: Init -->
  <rect x="95" y="44" width="270" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="86" text-anchor="middle" font-size="10.5" fill="#555">queue = [startUrl]，visited = {startUrl}</text>

  <path d="M 230 106 L 230 124" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Step 2: queue empty? -->
  <polygon points="230,128 360,172 230,216 100,172" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">queue 为空？</text>
  <text x="230" y="186" text-anchor="middle" font-size="10" fill="#777">队列已耗尽？</text>

  <!-- Yes branch: return -->
  <path d="M 100 172 L 46 172 L 46 238" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="52" y="164" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="6" y="242" width="112" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="62" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回结果</text>
  <text x="62" y="282" text-anchor="middle" font-size="9.5" fill="#555">return list(visited)</text>

  <!-- No branch -->
  <path d="M 360 172 L 414 172 L 414 238" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="372" y="164" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <!-- Step 3: dequeue -->
  <rect x="318" y="242" width="186" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="411" y="262" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">url = queue.pop()</text>
  <text x="411" y="280" text-anchor="middle" font-size="9.5" fill="#555">取出队首 URL</text>

  <path d="M 411 294 L 411 312" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Step 4: getUrls -->
  <rect x="308" y="316" width="206" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="411" y="336" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">urls = parser.getUrls(url)</text>
  <text x="411" y="352" text-anchor="middle" font-size="9.5" fill="#555">获取页面中所有链接</text>

  <path d="M 411 364 L 411 382" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Step 5: for each nxt -->
  <rect x="298" y="386" width="226" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="411" y="411" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">for nxt in urls：</text>

  <path d="M 411 430 L 411 448" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Step 6: Diamond - same host & not visited? -->
  <polygon points="411,452 360,492 411,532 462,492" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="411" y="488" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">同主机名</text>
  <text x="411" y="504" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">且未访问？</text>

  <!-- No branch: skip (left) -->
  <path d="M 360 492 L 250 492" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowL)" filter="url(#rough2)"/>
  <text x="300" y="484" font-size="10" fill="#b85450" font-weight="bold">No</text>
  <rect x="118" y="476" width="132" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="184" y="498" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">跳过（剪枝）</text>

  <!-- Yes branch: enqueue (down) -->
  <path d="M 411 532 L 411 548" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="420" y="546" font-size="10" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="318" y="552" width="186" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="411" y="568" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">visited.add(nxt) → 入队</text>

  <!-- Loop back: from enqueue & from skip, back up to "queue empty?" -->
  <!-- from skip box left side, up to top -->
  <path d="M 118 494 L 48 494 L 48 172 L 96 172" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="22" y="330" font-size="9.5" fill="#aaa" transform="rotate(-90 22 330)">继续循环</text>

  <!-- complexity note -->
  <text x="230" y="568" text-anchor="middle" font-size="10.5" fill="#d6a040" font-style="italic">O(N×L) 时间，O(N) 空间</text>
</svg>
