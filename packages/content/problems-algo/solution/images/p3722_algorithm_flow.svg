<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">算法流程：枚举 k，两类候选逐个比小</text>

  <!-- ① 初始化 -->
  <rect x="60" y="44" width="310" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="215" y="66" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold"
        filter="url(#rough2)">① ans = s（k = 1 的候选就是原串）</text>

  <path d="M 215 80 L 215 94" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 枚举 k -->
  <rect x="60" y="98" width="310" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="215" y="120" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold"
        filter="url(#rough2)">② k = 1, 2, …, n 逐个枚举</text>

  <path d="M 215 134 L 215 148" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 前缀候选 -->
  <rect x="40" y="152" width="350" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="215" y="174" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold"
        filter="url(#rough2)">③ 前缀候选 rev(s[:k]) + s[k:]，更新 ans</text>

  <path d="M 215 188 L 215 202" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 后缀候选 -->
  <rect x="40" y="206" width="350" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="215" y="228" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold"
        filter="url(#rough2)">④ 后缀候选 s[:n−k] + rev(s[n−k:])，更新 ans</text>

  <!-- 循环回环：④ → ② -->
  <path d="M 40 224 L 16 224 L 16 116 L 54 116" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="10" y="170" transform="rotate(-90 10 170)" font-size="10" fill="#446688"
        filter="url(#rough2)">k = k + 1</text>

  <!-- 枚举完毕 → 返回 -->
  <path d="M 370 116 L 496 116 L 496 307 L 326 307" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="108" font-size="10" fill="#446688" filter="url(#rough2)">k &gt; n</text>

  <!-- ⑤ 返回 -->
  <rect x="140" y="288" width="180" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="230" y="311" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">⑤ 返回 ans</text>

  <!-- 注释框 -->
  <rect x="398" y="152" width="92" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#d6a040" text-anchor="middle">
    <text x="444" y="172" font-weight="bold">候选共 2n 个</text>
    <text x="444" y="188">构造 + 比较</text>
    <text x="444" y="204">各 O(n)</text>
    <text x="444" y="220">总计 O(n²)</text>
    <text x="444" y="236">n ≤ 1000 稳过</text>
  </g>

  <text x="26" y="344" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">示例 1 "dcab"：8 个候选中 "acdb" 最小 ⇒ 返回 "acdb"</text>
</svg>
