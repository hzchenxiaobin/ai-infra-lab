<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两个示例的逐步查找过程</text>

  <!-- ===== 示例 1 ===== -->
  <text x="50" y="52" font-size="12" fill="#666" font-weight="bold">示例 1：words = ["mass","as","hero","superhero"]，排序后 ["as","mass","hero","superhero"]</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="50" y="60" width="70" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="85" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">words[i]</text>
    <rect x="120" y="60" width="40" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="140" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">长度</text>
    <rect x="160" y="60" width="180" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="250" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">检查 words[j] (j &gt; i)</text>
    <rect x="340" y="60" width="120" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="400" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">命中?</text>
    <rect x="460" y="60" width="50" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="485" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">结果</text>
  </g>

  <!-- 行1: as → mass 命中 -->
  <g filter="url(#rough2)">
    <rect x="50" y="86" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="85" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">as</text>
    <rect x="120" y="86" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="140" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="160" y="86" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="250" y="104" text-anchor="middle" font-size="11" fill="#333">m<tspan fill="#4a7a3a" font-weight="bold">as</tspan>s</text>
    <rect x="340" y="86" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="400" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 命中</text>
    <rect x="460" y="86" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="485" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">加入</text>
  </g>

  <!-- 行2: mass → 未命中 -->
  <g filter="url(#rough2)">
    <rect x="50" y="112" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="85" y="130" text-anchor="middle" font-size="11" fill="#333">mass</text>
    <rect x="120" y="112" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="140" y="130" text-anchor="middle" font-size="11" fill="#333">4</text>
    <rect x="160" y="112" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="250" y="130" text-anchor="middle" font-size="11" fill="#333">hero ✗, superhero ✗</text>
    <rect x="340" y="112" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="400" y="130" text-anchor="middle" font-size="11" fill="#d6a040">未命中</text>
    <rect x="460" y="112" width="50" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="485" y="130" text-anchor="middle" font-size="11" fill="#999">跳过</text>
  </g>

  <!-- 行3: hero → superhero 命中 -->
  <g filter="url(#rough2)">
    <rect x="50" y="138" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="85" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">hero</text>
    <rect x="120" y="138" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="140" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
    <rect x="160" y="138" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="250" y="156" text-anchor="middle" font-size="11" fill="#333">super<tspan fill="#4a7a3a" font-weight="bold">hero</tspan></text>
    <rect x="340" y="138" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="400" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 命中</text>
    <rect x="460" y="138" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="485" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">加入</text>
  </g>

  <!-- 行4: superhero → 无更长串 -->
  <g filter="url(#rough2)">
    <rect x="50" y="164" width="70" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="85" y="182" text-anchor="middle" font-size="11" fill="#999">superhero</text>
    <rect x="120" y="164" width="40" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="140" y="182" text-anchor="middle" font-size="11" fill="#999">10</text>
    <rect x="160" y="164" width="180" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="250" y="182" text-anchor="middle" font-size="11" fill="#aaa">（无更长串）</text>
    <rect x="340" y="164" width="120" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="400" y="182" text-anchor="middle" font-size="11" fill="#aaa">—</text>
    <rect x="460" y="164" width="50" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="485" y="182" text-anchor="middle" font-size="11" fill="#999">跳过</text>
  </g>

  <!-- 示例 1 答案 -->
  <rect x="50" y="198" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="217" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 1：["as", "hero"]</text>

  <!-- ===== 示例 2 ===== -->
  <text x="50" y="252" font-size="12" fill="#666" font-weight="bold">示例 2：words = ["leetcode","et","code"]，排序后 ["et","code","leetcode"]</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="50" y="260" width="70" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="85" y="278" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">words[i]</text>
    <rect x="120" y="260" width="40" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="140" y="278" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">长度</text>
    <rect x="160" y="260" width="180" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="250" y="278" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">检查 words[j] (j &gt; i)</text>
    <rect x="340" y="260" width="120" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="400" y="278" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">命中?</text>
    <rect x="460" y="260" width="50" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="485" y="278" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">结果</text>
  </g>

  <!-- 行1: et → leetcode 命中 -->
  <g filter="url(#rough2)">
    <rect x="50" y="286" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="85" y="304" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">et</text>
    <rect x="120" y="286" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="140" y="304" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="160" y="286" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="250" y="304" text-anchor="middle" font-size="11" fill="#333">code ✗, le<tspan fill="#4a7a3a" font-weight="bold">et</tspan>code</text>
    <rect x="340" y="286" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="400" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 命中</text>
    <rect x="460" y="286" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="485" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">加入</text>
  </g>

  <!-- 行2: code → leetcode 命中 -->
  <g filter="url(#rough2)">
    <rect x="50" y="312" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="85" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">code</text>
    <rect x="120" y="312" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="140" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
    <rect x="160" y="312" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="250" y="330" text-anchor="middle" font-size="11" fill="#333">leet<tspan fill="#4a7a3a" font-weight="bold">code</tspan></text>
    <rect x="340" y="312" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="400" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 命中</text>
    <rect x="460" y="312" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="485" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">加入</text>
  </g>

  <!-- 行3: leetcode → 无更长串 -->
  <g filter="url(#rough2)">
    <rect x="50" y="338" width="70" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="85" y="356" text-anchor="middle" font-size="11" fill="#999">leetcode</text>
    <rect x="120" y="338" width="40" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="140" y="356" text-anchor="middle" font-size="11" fill="#999">8</text>
    <rect x="160" y="338" width="180" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="250" y="356" text-anchor="middle" font-size="11" fill="#aaa">（无更长串）</text>
    <rect x="340" y="338" width="120" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="400" y="356" text-anchor="middle" font-size="11" fill="#aaa">—</text>
    <rect x="460" y="338" width="50" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="485" y="356" text-anchor="middle" font-size="11" fill="#999">跳过</text>
  </g>

  <!-- 示例 2 答案 -->
  <rect x="50" y="372" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="391" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 2：["et", "code"]</text>

  <!-- 关键提示 -->
  <rect x="50" y="408" width="460" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⚠ 子串要求连续：示例 3 中 "bu" 不是 "blue" 的子串（b 和 u 之间隔了 l）</text>
</svg>
