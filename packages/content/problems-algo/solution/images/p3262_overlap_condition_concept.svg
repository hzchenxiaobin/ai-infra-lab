<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：定向后只判一侧 —— 唯一的问题是「A.end 在 B.start 的哪边？」</text>

  <path d="M 110 52 L 510 52" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 143 48 L 143 56" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 210 48 L 210 56" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 277 48 L 277 56" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 343 48 L 343 56" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 410 48 L 410 56" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 477 48 L 477 56" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="143" y="47" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">08</text>
  <text x="210" y="47" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">10</text>
  <text x="277" y="47" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">12</text>
  <text x="343" y="47" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">14</text>
  <text x="410" y="47" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">16</text>
  <text x="477" y="47" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">18</text>

  <text x="55" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">情况 ①</text>
  <text x="55" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">重叠</text>

  <rect x="243" y="74" width="34" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <rect x="143" y="78" width="134" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="90" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">A 08:00–12:00</text>
  <rect x="243" y="104" width="134" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="310" y="116" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">B 11:00–15:00</text>
  <text x="400" y="95" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">A.end 12:00 在 B.start 右侧</text>
  <text x="400" y="110" text-anchor="start" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">12:00 &gt; 11:00 → 重叠 ✓</text>

  <text x="55" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">情况 ②</text>
  <text x="55" y="190" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">首尾相接</text>

  <path d="M 277 150 L 277 208" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="143" y="152" width="134" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="164" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">A 08:00–12:00</text>
  <rect x="277" y="178" width="100" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="327" y="190" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">B 12:00–15:00</text>
  <text x="400" y="169" text-anchor="start" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">A.end 与 B.start 相等（x=12:00）</text>
  <text x="400" y="184" text-anchor="start" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">12:00 &gt; 12:00 ✗ → 相接不算</text>

  <text x="55" y="250" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">情况 ③</text>
  <text x="55" y="264" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">分离</text>

  <rect x="210" y="226" width="67" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="243" y="238" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">A 10–12</text>
  <rect x="310" y="252" width="67" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="343" y="264" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">B 13–15</text>
  <text x="400" y="243" text-anchor="start" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">A.end 12:00 在 B.start 左侧</text>
  <text x="400" y="258" text-anchor="start" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">12:00 &gt; 13:00 ✗ → 分离</text>

  <rect x="30" y="288" width="250" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="155" y="310" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">判定公式（定序 A.start &lt; B.start 后）</text>
  <text x="155" y="332" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">重叠 ⇔ A.end &gt; B.start（严格大于）</text>
  <text x="155" y="352" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">另一侧 B.end &gt; A.start 由</text>
  <text x="155" y="367" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">B.end &gt; B.start &gt; A.start 自动成立</text>

  <rect x="296" y="288" width="234" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="413" y="310" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">主键定向：每对恰好数一次</text>
  <text x="413" y="332" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">主键 (employee_id, start_time)</text>
  <text x="413" y="348" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">⇒ 同员工 start_time 互不相同</text>
  <text x="413" y="366" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">⇒ t1.start &lt; t2.start 定序，不重不漏</text>
</svg>
