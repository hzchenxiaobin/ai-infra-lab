<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：从右往左单趟扫描，O(n) 时间</text>

  <!-- Start -->
  <rect x="240" y="50" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="310" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = ∞, min_idx = {}</text>
  <path d="M 310 84 L 310 104" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i = n-1 -->
  <rect x="240" y="108" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i = n−1 downto 0</text>
  <path d="M 310 142 L 310 162" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute target -->
  <rect x="210" y="166" width="200" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="310" y="188" text-anchor="middle" font-size="12" fill="#333">target = reverse(nums[i])</text>
  <path d="M 310 200 L 310 218" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: target in min_idx? -->
  <polygon points="310,222 430,266 310,310 190,266" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="260" text-anchor="middle" font-size="12" fill="#333">target 在</text>
  <text x="310" y="276" text-anchor="middle" font-size="12" fill="#333">min_idx 中？</text>

  <!-- Yes branch -->
  <path d="M 190 266 L 120 266 L 120 300" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="258" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="44" y="304" width="152" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="120" y="322" text-anchor="middle" font-size="11" fill="#333">ans = min(ans,</text>
  <text x="120" y="338" text-anchor="middle" font-size="11" fill="#333">min_idx[target] − i)</text>

  <!-- No branch -->
  <path d="M 430 266 L 500 266 L 500 300" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="468" y="258" font-size="11" fill="#888">否</text>
  <rect x="430" y="304" width="140" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="500" y="330" text-anchor="middle" font-size="11" fill="#888">跳过配对</text>

  <!-- merge to update -->
  <path d="M 120 348 L 120 372 L 250 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 500 348 L 500 372 L 370 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update min_idx -->
  <rect x="210" y="376" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="398" text-anchor="middle" font-size="12" fill="#333">min_idx[nums[i]] = i</text>

  <!-- loop back -->
  <path d="M 410 393 L 560 393 L 560 125 L 380 125" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="118" font-size="10" fill="#888">下一个 i（左移一位）</text>

  <!-- end -->
  <path d="M 310 410 L 310 424" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="428" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="310" y="446" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return ans == ∞ ? −1 : ans</text>
</svg>
