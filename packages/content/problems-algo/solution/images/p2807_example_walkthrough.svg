<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：head = [18,6,10,3] → [18,6,6,2,10,1,3]</text>

  <!-- Row 1: initial -->
  <text x="20" y="72" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">初始链表</text>
  <!-- nodes 18,6,10,3 ; left edges at 130,206,282,358 ; width 48 -->
  <rect x="130" y="54" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="154" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">18</text>
  <path d="M 178 71 L 206 71" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="206" y="54" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <path d="M 254 71 L 282 71" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="282" y="54" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="306" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>
  <path d="M 330 71 L 358 71" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="358" y="54" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="382" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- Row 2: step 1 insert gcd(18,6)=6 -->
  <text x="20" y="142" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">① gcd(18,6)=6</text>
  <!-- 18,6,[6],10,3 ; left edges 130,206,282,358,434 -->
  <rect x="130" y="124" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="154" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">18</text>
  <path d="M 178 141 L 206 141" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="206" y="124" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <path d="M 254 141 L 282 141" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="282" y="124" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="306" y="146" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <path d="M 330 141 L 358 141" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="358" y="124" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="382" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>
  <path d="M 406 141 L 434 141" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="434" y="124" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="458" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- Row 3: step 2 insert gcd(6,10)=2 -->
  <text x="20" y="212" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">② gcd(6,10)=2</text>
  <!-- 18,6,6,[2],10,3 ; left edges 130,206,282,358,434,510 -->
  <rect x="130" y="194" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="154" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">18</text>
  <path d="M 178 211 L 206 211" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="206" y="194" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <path d="M 254 211 L 282 211" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="282" y="194" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="306" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <path d="M 330 211 L 358 211" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="358" y="194" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="382" y="216" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 406 211 L 434 211" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="434" y="194" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="458" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>
  <path d="M 482 211 L 510 211" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="510" y="194" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="534" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- Row 4: step 3 insert gcd(10,3)=1 -->
  <text x="20" y="282" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ gcd(10,3)=1</text>
  <!-- 18,6,6,2,10,[1],3 ; left edges 130,206,282,358,434,510,586 -->
  <rect x="130" y="264" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="154" y="286" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">18</text>
  <path d="M 178 281 L 206 281" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="206" y="264" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="286" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <path d="M 254 281 L 282 281" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="282" y="264" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="306" y="286" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <path d="M 330 281 L 358 281" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="358" y="264" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="382" y="286" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 406 281 L 434 281" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="434" y="264" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="458" y="286" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>
  <path d="M 482 281 L 510 281" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="510" y="264" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="534" y="286" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 558 281 L 586 281" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="586" y="264" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="610" y="286" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- bottom note -->
  <rect x="20" y="328" width="620" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="34" y="350" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每步 curr 跳过新插入的红节点落到“原后继”，下一轮处理原始链表的下一段相邻对</text>
  <text x="34" y="370" font-size="11" fill="#555" filter="url(#rough2)">最终：18→6→6→2→10→1→3，蓝色为原节点、红色为按相邻对 GCD 新插入的节点</text>
</svg>
