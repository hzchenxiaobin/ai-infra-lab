<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：l|*e*et|c**o|*de| 逐字符扫描</text>

  <!-- Table frame -->
  <rect x="40" y="44" width="480" height="298" fill="none" stroke="#cfcfcf" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <!-- Header row -->
  <rect x="40" y="44" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="61" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">字符</text>
  <text x="220" y="61" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">inside 变化</text>
  <text x="360" y="61" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">动作</text>
  <text x="470" y="61" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">cnt</text>
  <line x1="160" y1="44" x2="160" y2="342" stroke="#cfcfcf" stroke-width="1" filter="url(#rough2)"/>
  <line x1="290" y1="44" x2="290" y2="342" stroke="#cfcfcf" stroke-width="1" filter="url(#rough2)"/>
  <line x1="430" y1="44" x2="430" y2="342" stroke="#cfcfcf" stroke-width="1" filter="url(#rough2)"/>

  <!-- Data rows: 11 rows, each 29 px, starting y=68 -->
  <!-- Row 1: l -->
  <text x="100" y="86" text-anchor="middle" font-size="12" fill="#333">l</text>
  <text x="220" y="86" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <text x="360" y="86" text-anchor="middle" font-size="11.5" fill="#888">跳过</text>
  <text x="470" y="86" text-anchor="middle" font-size="12" fill="#333">0</text>
  <line x1="40" y1="97" x2="520" y2="97" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 2: | 进门 (orange) -->
  <rect x="40" y="97" width="480" height="29" fill="#fff8e1" opacity="0.55" filter="url(#rough2)"/>
  <text x="100" y="116" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">|</text>
  <text x="220" y="116" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">false → true</text>
  <text x="360" y="116" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">进门</text>
  <text x="470" y="116" text-anchor="middle" font-size="12" fill="#333">0</text>
  <line x1="40" y1="126" x2="520" y2="126" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 3: *e*et 在内 -->
  <text x="100" y="145" text-anchor="middle" font-size="12" fill="#333">*e*et</text>
  <text x="220" y="145" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">true</text>
  <text x="360" y="145" text-anchor="middle" font-size="11.5" fill="#b85450">在内·忽略</text>
  <text x="470" y="145" text-anchor="middle" font-size="12" fill="#333">0</text>
  <line x1="40" y1="155" x2="520" y2="155" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 4: | 出门 (orange) -->
  <rect x="40" y="155" width="480" height="29" fill="#fff8e1" opacity="0.55" filter="url(#rough2)"/>
  <text x="100" y="174" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">|</text>
  <text x="220" y="174" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">true → false</text>
  <text x="360" y="174" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">出门</text>
  <text x="470" y="174" text-anchor="middle" font-size="12" fill="#333">0</text>
  <line x1="40" y1="184" x2="520" y2="184" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 5: c -->
  <text x="100" y="203" text-anchor="middle" font-size="12" fill="#333">c</text>
  <text x="220" y="203" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">false</text>
  <text x="360" y="203" text-anchor="middle" font-size="11.5" fill="#888">跳过</text>
  <text x="470" y="203" text-anchor="middle" font-size="12" fill="#333">0</text>
  <line x1="40" y1="213" x2="520" y2="213" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 6: * count (green highlight) -->
  <rect x="40" y="213" width="480" height="29" fill="#e6f4ea" opacity="0.7" filter="url(#rough2)"/>
  <text x="100" y="232" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">*</text>
  <text x="220" y="232" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">false</text>
  <text x="360" y="232" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">在外·数！</text>
  <text x="470" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="40" y1="242" x2="520" y2="242" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 7: * count (green highlight) -->
  <rect x="40" y="242" width="480" height="29" fill="#e6f4ea" opacity="0.7" filter="url(#rough2)"/>
  <text x="100" y="261" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">*</text>
  <text x="220" y="261" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">false</text>
  <text x="360" y="261" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">在外·数！</text>
  <text x="470" y="261" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="40" y1="271" x2="520" y2="271" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 8: o -->
  <text x="100" y="290" text-anchor="middle" font-size="12" fill="#333">o</text>
  <text x="220" y="290" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">false</text>
  <text x="360" y="290" text-anchor="middle" font-size="11.5" fill="#888">跳过</text>
  <text x="470" y="290" text-anchor="middle" font-size="12" fill="#333">2</text>
  <line x1="40" y1="300" x2="520" y2="300" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 9: | 进门 -->
  <rect x="40" y="300" width="480" height="22" fill="#fff8e1" opacity="0.55" filter="url(#rough2)"/>
  <text x="100" y="316" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">|</text>
  <text x="220" y="316" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">false → true</text>
  <text x="360" y="316" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">进门</text>
  <text x="470" y="316" text-anchor="middle" font-size="12" fill="#333">2</text>
  <line x1="40" y1="322" x2="520" y2="322" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 10: *de 在内 -->
  <text x="100" y="338" text-anchor="middle" font-size="12" fill="#333">*de</text>
  <text x="220" y="338" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">true</text>
  <text x="360" y="338" text-anchor="middle" font-size="11.5" fill="#b85450">在内·忽略</text>
  <text x="470" y="338" text-anchor="middle" font-size="12" fill="#333">2</text>
</svg>
