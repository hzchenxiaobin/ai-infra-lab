<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD2" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M 4.5 0 L 9 9 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n=10, ranges=[[3,5],[7,8]]</text>

  <!-- Row 0: original array with indices -->
  <text x="20" y="64" font-size="11" fill="#999" filter="url(#rough2)">数组</text>
  <!-- 10 cells, width 50, start x=60 -->
  <!-- cell 0 -->
  <rect x="60" y="44" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="69" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>
  <!-- cell 1 -->
  <rect x="110" y="44" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="69" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <!-- cell 2 -->
  <rect x="160" y="44" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="69" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <!-- cell 3 covered -->
  <rect x="210" y="44" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="69" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <!-- cell 4 covered -->
  <rect x="260" y="44" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="69" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <!-- cell 5 covered -->
  <rect x="310" y="44" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="69" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <!-- cell 6 uncovered -->
  <rect x="360" y="44" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="69" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">6</text>
  <!-- cell 7 covered -->
  <rect x="410" y="44" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="69" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text>
  <!-- cell 8 covered -->
  <rect x="460" y="44" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="485" y="69" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">8</text>
  <!-- cell 9 uncovered -->
  <rect x="510" y="44" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="535" y="69" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">9</text>

  <!-- arrow down -->
  <path d="M 320 90 L 320 104" stroke="#446688" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Row 1: after sort + merge (same in this case) -->
  <text x="20" y="134" font-size="11" fill="#d6a040" filter="url(#rough2)">合并</text>
  <rect x="60" y="114" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="139" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">3</text>
  <rect x="110" y="114" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="139" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">4</text>
  <rect x="160" y="114" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="139" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">5</text>
  <rect x="360" y="114" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="139" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">7</text>
  <rect x="410" y="114" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="139" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">8</text>
  <text x="480" y="139" font-size="10" fill="#999" filter="url(#rough2)">[3,5] 和 [7,8] 无重叠</text>

  <!-- arrow down -->
  <path d="M 320 160 L 320 174" stroke="#446688" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Row 2: gap scanning -->
  <text x="20" y="204" font-size="11" fill="#4a7a3a" filter="url(#rough2)">间隙</text>

  <!-- gap 1: [0,2] -->
  <rect x="60" y="184" width="150" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="209" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[0, 2]</text>

  <!-- gap 2: [6,6] -->
  <rect x="360" y="184" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="209" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[6,6]</text>

  <!-- gap 3: [9,9] -->
  <rect x="510" y="184" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="535" y="209" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[9,9]</text>

  <!-- annotations for gaps -->
  <text x="135" y="240" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">prev: 无 → start=0</text>
  <text x="135" y="252" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">next:[3,5] → end=2</text>

  <text x="385" y="240" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">prev:[3,5]</text>
  <text x="385" y="252" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">next:[7,8]</text>
  <text x="385" y="264" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">→[6,6]</text>

  <text x="535" y="240" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">prev:[7,8]</text>
  <text x="535" y="252" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">next: 无 → end=9</text>
  <text x="535" y="264" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">→[9,9]</text>

  <!-- result box -->
  <rect x="60" y="284" width="500" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="308" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">结果</text>
  <text x="310" y="332" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">[[0,2], [6,6], [9,9]]</text>

  <text x="320" y="372" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">三个间隙：首段 [0,2]、中段 [6,6]、末段 [9,9]</text>
</svg>
