<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：单趟扫描，按序滚动更新三个变量</text>

  <rect x="180" y="30" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">开始（a=b=c=ans=−∞）</text>

  <path d="M 260 54 L 260 66" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- loop body container -->
  <rect x="70" y="66" width="380" height="180" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#55677d" filter="url(#rough2)">对每一英里 i（顺序固定，不可调换）</text>

  <rect x="95" y="92" width="330" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="109" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">a ← max(a, 0) + lane1[i]　（形态「1」：续驶 / 就地新进入）</text>

  <path d="M 260 118 L 260 124" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <rect x="95" y="124" width="330" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="141" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">b ← max( max(b, 0) + lane2[i], a )　（车道 2 续驶 / 进站换道 / 刚换道）</text>

  <path d="M 260 150 L 260 156" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <rect x="95" y="156" width="330" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="173" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">c ← max( max(c, 0) + lane1[i], b )　（换回车道 1 续驶 / 刚换回）</text>

  <path d="M 260 182 L 260 188" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <rect x="95" y="188" width="330" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="205" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">ans ← max(ans, a, c)　（c ≥ b：出站前可免费换道）</text>

  <path d="M 260 246 L 260 258" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,258 352,288 260,318 168,288" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="10.5" fill="#8f3a35" filter="url(#rough2)">还有下一英里？</text>

  <!-- yes: loop back -->
  <path d="M 168 288 L 44 288 L 44 156 L 70 156" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="52" y="278" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- no: return -->
  <path d="M 352 288 L 394 288" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="370" y="278" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="396" y="274" width="108" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="450" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">返回 ans</text>

  <!-- bottom notes -->
  <g filter="url(#rough2)">
    <rect x="40" y="328" width="215" height="28" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="147" y="339" text-anchor="middle" font-size="9" font-weight="bold" fill="#33506b">时间 O(n) / 空间 O(1)</text>
    <text x="147" y="351" text-anchor="middle" font-size="9" fill="#55677d">max(·, 0) 重启 ⇒ 「至少 1 英里」自动满足</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="280" y="328" width="215" height="28" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="387" y="339" text-anchor="middle" font-size="9" font-weight="bold" fill="#8f3a35">求和必须用 long long</text>
    <text x="387" y="351" text-anchor="middle" font-size="9" fill="#55677d">上界 10⁵ × 10⁹ = 10¹⁴，超出 int32</text>
  </g>
</svg>
