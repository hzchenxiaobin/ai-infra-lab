<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG2" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：前缀 DP + 单段代价公式</text>

  <!-- 右上提示框 -->
  <rect x="368" y="32" width="128" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⚠ 每段算两个方向：</text>
  <text x="432" y="64" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">正序 f₁ 与倒序 1+f₂</text>
  <text x="432" y="78" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">取小者作为 cost</text>

  <!-- 主流程 -->
  <rect x="175" y="34" width="170" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">读入 word1、word2（长 n）</text>

  <path d="M260,62 L260,74" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="155" y="78" width="210" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[0] = 0；dp[1..n] = +∞</text>

  <path d="M260,104 L260,114" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="155" y="120" width="210" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">枚举右端点 j = 1 … n</text>

  <path d="M260,148 L260,158" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="155" y="164" width="210" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">枚举左端点 i = 0 … j−1</text>

  <path d="M260,192 L260,202" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 代价面板 -->
  <rect x="70" y="208" width="380" height="104" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">计算单段代价并松弛 dp[j]</text>
  <rect x="86" y="238" width="168" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="170" y="256" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">正序 f₁ = m − Σ min(cnt)</text>
  <text x="170" y="274" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">型 (a,b)：s[k]≠t[k] 的失配位</text>
  <rect x="266" y="238" width="168" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="350" y="256" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">倒序 f₂：对 rev(s) 同式计算</text>
  <text x="350" y="274" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">s[k] 取 s[j−1−k]</text>
  <text x="260" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">cost = min(f₁, 1+f₂)；dp[j] ← min(dp[j], dp[i]+cost)</text>

  <!-- i 回边（右侧） -->
  <path d="M450,250 C488,250 488,178 365,178" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="420" y="170" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">下一个 i</text>

  <!-- j 回边（左侧，i 用尽回到 j 循环） -->
  <path d="M155,178 C60,178 60,127 155,127" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="92" y="162" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">i 用尽</text>

  <!-- 出口（j 用尽，左侧下行） -->
  <path d="M155,141 L30,141 L30,368 L58,368" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG2)" filter="url(#rough2)"/>
  <text x="92" y="136" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">j 用尽</text>

  <!-- 返回框 -->
  <rect x="62" y="352" width="150" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="137" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 dp[n]</text>

  <!-- 右下小注 -->
  <rect x="250" y="344" width="246" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373" y="362" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">复杂度 O(n²·Σ²)，Σ = 26</text>
  <text x="373" y="378" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">n ≤ 100，双循环 + 26×26 型计数轻松通过</text>
</svg>
