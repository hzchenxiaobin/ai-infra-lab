<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例 3 演算：prices = [26,18,6,12,49,7,45,45]，n = 8</text>
  <text x="260" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">dp[i] = prices[i−1] + min{ dp[j] : j ∈ [i+1, min(2i+1, 9)] }，哨兵 dp[9] = 0</text>

  <!-- header row -->
  <rect x="44" y="56" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="86" y="56" width="82" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">prices[i−1]</text>
  <rect x="168" y="56" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="243" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">转移窗口</text>
  <rect x="318" y="56" width="96" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口最小</text>
  <rect x="414" y="56" width="82" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[i]</text>

  <!-- row i=9 (sentinel) -->
  <rect x="44" y="82" width="452" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="65" y="99" text-anchor="middle" font-size="11" fill="#8a6420" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="127" y="99" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">—</text>
  <text x="243" y="99" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">哨兵：右侧无需再买</text>
  <text x="366" y="99" text-anchor="middle" font-size="10.5" fill="#8a6420" filter="url(#rough2)">—</text>
  <text x="455" y="99" text-anchor="middle" font-size="11" fill="#8a6420" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- row i=8 -->
  <rect x="44" y="108" width="452" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="127" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">45</text>
  <text x="243" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[9, 9]</text>
  <text x="366" y="125" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0（dp[9]）</text>
  <text x="455" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">45</text>

  <!-- row i=7 -->
  <rect x="44" y="134" width="452" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="127" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">45</text>
  <text x="243" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[8, 9]</text>
  <text x="366" y="151" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0（dp[9]）</text>
  <text x="455" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">45</text>

  <!-- row i=6 (optimal path) -->
  <rect x="44" y="160" width="452" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65" y="177" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="127" y="177" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">7</text>
  <text x="243" y="177" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">[7, 9]</text>
  <text x="366" y="177" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">0（dp[9]）</text>
  <text x="455" y="177" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- row i=5 -->
  <rect x="44" y="186" width="452" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="127" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">49</text>
  <text x="243" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[6, 9]</text>
  <text x="366" y="203" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0（dp[9]）</text>
  <text x="455" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">49</text>

  <!-- row i=4 -->
  <rect x="44" y="212" width="452" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="229" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="127" y="229" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>
  <text x="243" y="229" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[5, 9]</text>
  <text x="366" y="229" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0（dp[9]）</text>
  <text x="455" y="229" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>

  <!-- row i=3 (optimal path) -->
  <rect x="44" y="238" width="452" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65" y="255" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="127" y="255" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">6</text>
  <text x="243" y="255" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">[4, 7]</text>
  <text x="366" y="255" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">7（dp[6]）</text>
  <text x="455" y="255" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">13</text>

  <!-- row i=2 -->
  <rect x="44" y="264" width="452" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="127" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">18</text>
  <text x="243" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3, 5]</text>
  <text x="366" y="281" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">12（dp[4]）</text>
  <text x="455" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">30</text>

  <!-- row i=1 (optimal path) -->
  <rect x="44" y="290" width="452" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65" y="307" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="127" y="307" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">26</text>
  <text x="243" y="307" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">[2, 3]</text>
  <text x="366" y="307" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">13（dp[3]）</text>
  <text x="455" y="307" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">39</text>

  <!-- summary box 1 -->
  <rect x="48" y="330" width="424" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">绿色行 = 最优路径：dp[1] ← dp[3] ← dp[6] ← dp[9]</text>
  <text x="260" y="366" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">对应购买集 {1, 3, 6}</text>

  <!-- summary box 2 -->
  <rect x="48" y="384" width="424" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="404" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">买 1 花 26、买 3 花 6、买 6 花 7 ⇒ 总花费 39 ✓（与官方解释一致）</text>
</svg>
