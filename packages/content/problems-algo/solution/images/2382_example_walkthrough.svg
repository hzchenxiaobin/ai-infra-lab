<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[1,2,5,6,1]，removeQueries=[0,3,2,4,1]</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">从「全删」终态出发，逆序撤销每次删除，加回的点与左右活跃段合并</text>

  <!-- index axis -->
  <g filter="url(#rough2)">
    <text x="320" y="64" text-anchor="middle" font-size="10" fill="#999">下标：  0   1   2   3   4</text>
  </g>

  <!-- ============ Table ============ -->
  <!-- header -->
  <g filter="url(#rough2)">
    <rect x="30" y="74" width="580" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="70"  y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">逆序步</text>
    <text x="150" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">加回 idx（值）</text>
    <text x="330" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">数组状态 / 活跃段</text>
    <text x="490" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cur</text>
    <text x="570" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">answer</text>
    <line x1="110" y1="74" x2="110" y2="102" stroke="#446688" stroke-width="1"/>
    <line x1="210" y1="74" x2="210" y2="102" stroke="#446688" stroke-width="1"/>
    <line x1="450" y1="74" x2="450" y2="102" stroke="#446688" stroke-width="1"/>
    <line x1="530" y1="74" x2="530" y2="102" stroke="#446688" stroke-width="1"/>
  </g>

  <!-- rows: each h=72, cells drawn within x 220..440 (5 cells width 40, gap aligned) -->
  <!-- cell x positions: 224,264,304,344,384 ; cell w=36 -->

  <!-- Row 0: 初始 全删 -->
  <g filter="url(#rough2)">
    <rect x="30" y="102" width="580" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="70"  y="136" text-anchor="middle" font-size="12" fill="#444">初始</text>
    <text x="150" y="136" text-anchor="middle" font-size="12" fill="#888">—</text>
    <!-- 5 deleted cells -->
    <rect x="224" y="118" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" rx="4"/>
    <text x="242" y="138" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">✕</text>
    <rect x="264" y="118" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" rx="4"/>
    <text x="282" y="138" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">✕</text>
    <rect x="304" y="118" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" rx="4"/>
    <text x="322" y="138" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">✕</text>
    <rect x="344" y="118" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" rx="4"/>
    <text x="362" y="138" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">✕</text>
    <rect x="384" y="118" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" rx="4"/>
    <text x="402" y="138" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">✕</text>
    <text x="490" y="136" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">0</text>
    <text x="570" y="136" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans[4]=0</text>
  </g>

  <!-- Row 1: i=4, add idx1(=2) -->
  <g filter="url(#rough2)">
    <rect x="30" y="162" width="580" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="70"  y="196" text-anchor="middle" font-size="12" fill="#444">i=4</text>
    <text x="150" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">idx1（2）</text>
    <rect x="224" y="178" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" rx="4"/>
    <text x="242" y="198" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">✕</text>
    <rect x="264" y="178" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="282" y="198" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
    <rect x="304" y="178" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" rx="4"/>
    <text x="322" y="198" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">✕</text>
    <rect x="344" y="178" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" rx="4"/>
    <text x="362" y="198" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">✕</text>
    <rect x="384" y="178" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" rx="4"/>
    <text x="402" y="198" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">✕</text>
    <path d="M 266 210 L 266 216 L 300 216 L 300 210" stroke="#d6a040" stroke-width="1.4" fill="none"/>
    <text x="490" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="570" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans[3]=2</text>
  </g>

  <!-- Row 2: i=3, add idx4(=1) -->
  <g filter="url(#rough2)">
    <rect x="30" y="222" width="580" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="70"  y="256" text-anchor="middle" font-size="12" fill="#444">i=3</text>
    <text x="150" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">idx4（1）</text>
    <rect x="224" y="238" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" rx="4"/>
    <text x="242" y="258" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">✕</text>
    <rect x="264" y="238" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="282" y="258" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
    <rect x="304" y="238" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" rx="4"/>
    <text x="322" y="258" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">✕</text>
    <rect x="344" y="238" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" rx="4"/>
    <text x="362" y="258" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">✕</text>
    <rect x="384" y="238" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="402" y="258" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
    <path d="M 266 270 L 266 276 L 300 276 L 300 270" stroke="#446688" stroke-width="1.2" fill="none"/>
    <path d="M 386 270 L 386 276 L 420 276 L 420 270" stroke="#d6a040" stroke-width="1.4" fill="none"/>
    <text x="490" y="256" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="570" y="256" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans[2]=2</text>
  </g>

  <!-- Row 3: i=2, add idx2(=5), merges with idx1 -> {2,5}=7 -->
  <g filter="url(#rough2)">
    <rect x="30" y="282" width="580" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="70"  y="316" text-anchor="middle" font-size="12" fill="#444">i=2</text>
    <text x="150" y="316" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">idx2（5）</text>
    <rect x="224" y="298" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" rx="4"/>
    <text x="242" y="318" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">✕</text>
    <rect x="264" y="298" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="282" y="318" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
    <rect x="304" y="298" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="322" y="318" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">5</text>
    <rect x="344" y="298" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" rx="4"/>
    <text x="362" y="318" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">✕</text>
    <rect x="384" y="298" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="402" y="318" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
    <path d="M 266 330 L 266 336 L 340 336 L 340 330" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <text x="303" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">=7</text>
    <text x="490" y="316" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">7</text>
    <text x="570" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans[1]=7</text>
  </g>

  <!-- Row 4: i=1, add idx3(=6), merges {2,5}+6+{1} = 14 -->
  <g filter="url(#rough2)">
    <rect x="30" y="358" width="580" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
    <text x="70"  y="392" text-anchor="middle" font-size="12" fill="#444">i=1</text>
    <text x="150" y="392" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">idx3（6）</text>
    <rect x="224" y="374" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" rx="4"/>
    <text x="242" y="394" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">✕</text>
    <rect x="264" y="374" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="282" y="394" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
    <rect x="304" y="374" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="322" y="394" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5</text>
    <rect x="344" y="374" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="362" y="394" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">6</text>
    <rect x="384" y="374" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="402" y="394" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
    <path d="M 266 406 L 266 412 L 420 412 L 420 406" stroke="#4a7a3a" stroke-width="2.2" fill="none"/>
    <text x="343" y="426" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">= 7+6+1 = 14</text>
    <text x="490" y="392" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">14</text>
    <text x="570" y="392" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans[0]=14</text>
  </g>

  <!-- result box -->
  <rect x="120" y="440" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="320" y="465" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">answer = [14, 7, 2, 2, 0] ✓</text>

  <text x="320" y="500" text-anchor="middle" font-size="11" fill="#888">撤销第 i 次删除后，状态 = 「前 i−1 次删除后」→ 填 answer[i−1]；answer[4]=0 由初始化给出</text>
</svg>
