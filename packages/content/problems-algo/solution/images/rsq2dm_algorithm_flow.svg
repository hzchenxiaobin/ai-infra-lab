<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">update 与 query：两重 lowbit 循环，结构对称互为镜像</text>
  <text x="145" y="50" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">update（向上爬：x+=lb, y+=lb）</text>
  <text x="425" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">query（向下拆：x−=lb, y−=lb）</text>

  <!-- ============ 左列：update ============ -->
  <!-- box1 start -->
  <rect x="20" y="66" width="250" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="145" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">update(row, col, val)</text>
  <!-- box2 -->
  <rect x="20" y="102" width="250" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="145" y="121" text-anchor="middle" font-size="11" fill="#444">delta = val − mat[r][c]；  mat[r][c] = val</text>
  <!-- box3 -->
  <rect x="20" y="138" width="250" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="145" y="157" text-anchor="middle" font-size="11" fill="#444">i = row+1， j = col+1</text>
  <!-- box4 外层 while -->
  <rect x="20" y="174" width="250" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="193" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">while i ≤ m：   (外层·行方向)</text>
  <!-- box5 -->
  <rect x="40" y="210" width="230" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="155" y="229" text-anchor="middle" font-size="11" fill="#444">j = col+1</text>
  <!-- box6 内层 while -->
  <rect x="40" y="246" width="230" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155" y="265" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">while j ≤ n：   (内层·列方向)</text>
  <!-- box7 body 高亮 -->
  <rect x="60" y="282" width="210" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="165" y="301" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">tree[i][j] += delta</text>
  <!-- box8 -->
  <rect x="60" y="318" width="210" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="165" y="337" text-anchor="middle" font-size="11" fill="#444">j += lowbit(j) ； i += lowbit(i)</text>

  <!-- 左列箭头 -->
  <path d="M145 94 V102 M145 130 V138 M145 166 V174 M155 202 V210 M155 238 V246 M165 274 V282 M165 310 V318" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 循环回跳提示（内层→内层while） -->
  <path d="M270 296 C 286 296 286 260 270 260" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M250 332 C 268 332 268 188 250 188" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ 右列：query ============ -->
  <rect x="300" y="66" width="250" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="425" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sumRegion(r1, c1, r2, c2)</text>
  <!-- box2 四角公式 高亮 -->
  <rect x="300" y="102" width="250" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="425" y="121" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Q(r2+1,c2+1)−Q(r1,c2+1)−Q(r2+1,c1)+Q(r1,c1)</text>
  <!-- box3 子程序 -->
  <rect x="300" y="138" width="250" height="28" fill="#f4f4f4" stroke="#999" stroke-width="1.3" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>
  <text x="425" y="157" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">Q(i, j)：  求 [1..i]×[1..j] 之和</text>
  <!-- box4 外层 while -->
  <rect x="300" y="174" width="250" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="425" y="193" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">while x > 0：   (外层·行方向)</text>
  <!-- box5 -->
  <rect x="320" y="210" width="230" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="435" y="229" text-anchor="middle" font-size="11" fill="#444">y = j；  s 局部累加</text>
  <!-- box6 内层 while -->
  <rect x="320" y="246" width="230" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="435" y="265" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">while y > 0：   (内层·列方向)</text>
  <!-- box7 body 高亮 -->
  <rect x="340" y="282" width="210" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="445" y="301" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s += tree[x][y]</text>
  <!-- box8 -->
  <rect x="340" y="318" width="210" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="445" y="337" text-anchor="middle" font-size="11" fill="#444">y −= lowbit(y) ； x −= lowbit(x)</text>
  <!-- box9 return -->
  <rect x="300" y="354" width="250" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="425" y="373" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return s</text>

  <!-- 右列箭头 -->
  <path d="M425 94 V102 M425 130 V138 M425 166 V174 M435 202 V210 M435 238 V246 M445 274 V282 M445 310 V318 M425 346 V354" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 循环回跳提示 -->
  <path d="M550 296 C 566 296 566 260 550 260" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M530 332 C 548 332 548 188 530 188" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部说明 -->
  <rect x="20" y="398" width="540" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="419" text-anchor="middle" font-size="11" fill="#555">两重 lowbit 各 O(log)，update / query 均 O(log m · log n)；下标统一 1-indexed</text>
</svg>
