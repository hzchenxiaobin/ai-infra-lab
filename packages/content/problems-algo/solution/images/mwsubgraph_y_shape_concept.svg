<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">最优子图 = Y 形结构（汇合点 x 可枚举）</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">两条路径在 x 汇合后共享 x→dest 段，权重只算一次</text>

  <!-- ===== Y-shape ===== -->
  <text x="40" y="84" font-size="12" fill="#446688" font-weight="bold">Y 形（一般情况，x 为内部汇合点）</text>

  <!-- src1 -> x path (blue, two segments) -->
  <path d="M 92 130 Q 150 150 210 188" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="138" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">d(src1,x)</text>
  <!-- src2 -> x path (green) -->
  <path d="M 92 250 Q 150 232 210 196" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">d(src2,x)</text>
  <!-- x -> dest shared (orange) -->
  <path d="M 250 196 L 430 196" stroke="#d6a040" stroke-width="2.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="340" y="186" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">d(x,dest)  ← 共享段，只算一次</text>

  <!-- src1 -->
  <ellipse cx="66" cy="120" rx="30" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="66" y="118" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">src1</text>
  <text x="66" y="132" text-anchor="middle" font-size="8" fill="#446688">起点①</text>
  <!-- src2 -->
  <ellipse cx="66" cy="260" rx="30" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="66" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">src2</text>
  <text x="66" y="272" text-anchor="middle" font-size="8" fill="#4a7a3a">起点②</text>
  <!-- x merge -->
  <ellipse cx="232" cy="196" rx="26" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="232" y="200" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">x</text>
  <text x="232" y="232" text-anchor="middle" font-size="8" fill="#d6a040">汇合点</text>
  <!-- dest -->
  <ellipse cx="456" cy="196" rx="30" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="456" y="200" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">dest</text>

  <!-- formula box -->
  <rect x="40" y="296" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案 = min_x { d(src1,x) + d(src2,x) + d(x,dest) }</text>

  <!-- ===== V-shape note ===== -->
  <text x="40" y="356" font-size="12" fill="#446688" font-weight="bold">V 形（特例：x = dest，两路径仅在终点相遇）</text>
  <ellipse cx="76" cy="386" rx="24" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="390" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">src1</text>
  <ellipse cx="76" cy="386" rx="24" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" opacity="0"/>
  <ellipse cx="76" cy="386" rx="24" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="390" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">src1</text>
  <ellipse cx="76" cy="386" rx="24" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" opacity="0"/>

  <ellipse cx="226" cy="386" rx="22" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="226" y="390" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">src2</text>
  <path d="M 100 380 Q 160 372 432 384" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 100 392 Q 200 400 432 392" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <ellipse cx="456" cy="386" rx="24" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="456" y="390" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">dest</text>
  <text x="490" y="384" font-size="9" fill="#888">= x</text>
  <text x="280" y="412" text-anchor="middle" font-size="9" fill="#888">此时 d(x,dest)=0，退化为 d(src1,dest)+d(src2,dest)</text>
</svg>
