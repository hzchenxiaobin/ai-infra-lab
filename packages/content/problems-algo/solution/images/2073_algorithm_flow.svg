<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：按位置贡献一次遍历</text>

  <rect x="210" y="46" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 280 78 L 280 92" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="195" y="94" width="170" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="113" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">T = tickets[k]</text>
  <text x="280" y="128" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">ans = 0;  i = 0</text>
  <path d="M 280 134 L 280 148" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="180" y="150" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="170" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <path d="M 380 166 L 430 166" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="408" y="158" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="430" y="150" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="475" y="170" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">return ans</text>

  <path d="M 280 182 L 280 196" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="296" y="192" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <polygon points="280,200 380,236 280,272 180,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">i ≤ k ?</text>
  <text x="280" y="248" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)"></text>

  <path d="M 180 236 L 110 236" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="146" y="228" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 380 236 L 450 236" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="416" y="228" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="40" y="218" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="232" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ans +=</text>
  <text x="75" y="246" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">min(ti,T)</text>

  <rect x="450" y="218" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="485" y="232" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ans +=</text>
  <text x="485" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">min(ti,T−1)</text>

  <path d="M 75 254 L 75 296 L 280 296" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 485 254 L 485 296 L 280 296" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 296 L 280 308" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="200" y="310" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">i++ , 回到循环判断</text>

  <rect x="40" y="358" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">时间 O(n) · 空间 O(1) · 一次遍历求和</text>
</svg>
