<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：苹果在 2、4、5，后序 DFS 自底向上汇总得 8</text>

  <!-- divider -->
  <line x1="345" y1="50" x2="345" y2="410" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <text x="175" y="48" text-anchor="middle" font-size="11" fill="#888">树（左）</text>
  <text x="490" y="48" text-anchor="middle" font-size="11" fill="#888">后序 DFS 计算链（右）</text>

  <!-- ===== LEFT: tree ===== -->
  <!-- edges -->
  <line x1="175" y1="70" x2="110" y2="150" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="175" y1="70" x2="245" y2="150" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="110" y1="150" x2="70" y2="235" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="110" y1="150" x2="150" y2="235" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="245" y1="150" x2="205" y2="235" stroke="#bbb" stroke-width="1.3" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <line x1="245" y1="150" x2="290" y2="235" stroke="#bbb" stroke-width="1.3" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- x2 labels -->
  <text x="126" y="112" font-size="10" fill="#4a7a3a" font-weight="bold">×2</text>
  <text x="220" y="112" font-size="10" fill="#4a7a3a" font-weight="bold">×2</text>
  <text x="78" y="196" font-size="10" fill="#4a7a3a" font-weight="bold">×2</text>
  <text x="138" y="196" font-size="10" fill="#4a7a3a" font-weight="bold">×2</text>

  <!-- nodes -->
  <!-- 0 -->
  <circle cx="175" cy="70" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="75" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">0</text>
  <text x="175" y="98" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">(8, T)</text>
  <!-- 1 -->
  <circle cx="110" cy="150" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="155" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>
  <text x="110" y="178" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">(4, T)</text>
  <!-- 2 apple -->
  <circle cx="245" cy="150" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="245" y="155" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2</text>
  <text x="245" y="178" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">(0, T)</text>
  <!-- 4 apple -->
  <circle cx="70" cy="235" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="70" y="240" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">4</text>
  <text x="70" y="263" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">(0, T)</text>
  <!-- 5 apple -->
  <circle cx="150" cy="235" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="240" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">5</text>
  <text x="150" y="263" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">(0, T)</text>
  <!-- 3 -->
  <circle cx="205" cy="235" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="205" y="240" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>
  <text x="205" y="263" text-anchor="middle" font-size="10.5" fill="#999" font-weight="bold">(0, F)</text>
  <!-- 6 -->
  <circle cx="290" cy="235" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="240" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">6</text>
  <text x="290" y="263" text-anchor="middle" font-size="10.5" fill="#999" font-weight="bold">(0, F)</text>

  <!-- note under tree -->
  <rect x="40" y="295" width="290" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="185" y="315" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">汇总逻辑（自底向上）</text>
  <text x="50" y="335" font-size="10.5" fill="#555">• 叶 4、5：自身有苹果 → has=T，无内部边 → time=0</text>
  <text x="50" y="352" font-size="10.5" fill="#555">• 节点 1：子 4、5 均 T → +2+2=4，has=T</text>
  <text x="50" y="369" font-size="10.5" fill="#555">• 节点 2：子 3、6 均 F 不深入；自身苹果 → (0,T)</text>
  <text x="50" y="386" font-size="10.5" fill="#555">• 根 0：子 1→+4+2=6，子 2→+0+2=2 → 8 ✓</text>

  <!-- ===== RIGHT: post-order ladder ===== -->
  <!-- box 1 -->
  <rect x="370" y="60" width="240" height="34" rx="6" fill="#fff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="82" font-size="11.5" fill="#333">① dfs(4)</text>
  <text x="598" y="82" text-anchor="end" font-size="11.5" fill="#b85450" font-weight="bold">(0, T)</text>
  <line x1="490" y1="94" x2="490" y2="106" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box 2 -->
  <rect x="370" y="108" width="240" height="34" rx="6" fill="#fff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="130" font-size="11.5" fill="#333">② dfs(5)</text>
  <text x="598" y="130" text-anchor="end" font-size="11.5" fill="#b85450" font-weight="bold">(0, T)</text>
  <line x1="490" y1="142" x2="490" y2="154" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box 3 -->
  <rect x="370" y="156" width="240" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="382" y="178" font-size="11.5" fill="#333">③ dfs(1) = 2 + 2</text>
  <text x="598" y="178" text-anchor="end" font-size="11.5" fill="#4a7a3a" font-weight="bold">(4, T)</text>
  <line x1="490" y1="190" x2="490" y2="202" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box 4 -->
  <rect x="370" y="204" width="240" height="34" rx="6" fill="#fff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="226" font-size="11.5" fill="#333">④ dfs(3)</text>
  <text x="598" y="226" text-anchor="end" font-size="11.5" fill="#999" font-weight="bold">(0, F)</text>
  <line x1="490" y1="238" x2="490" y2="250" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box 5 -->
  <rect x="370" y="252" width="240" height="34" rx="6" fill="#fff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="274" font-size="11.5" fill="#333">⑤ dfs(6)</text>
  <text x="598" y="274" text-anchor="end" font-size="11.5" fill="#999" font-weight="bold">(0, F)</text>
  <line x1="490" y1="286" x2="490" y2="298" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box 6 -->
  <rect x="370" y="300" width="240" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="382" y="322" font-size="11.5" fill="#333">⑥ dfs(2) 自身苹果</text>
  <text x="598" y="322" text-anchor="end" font-size="11.5" fill="#d6a040" font-weight="bold">(0, T)</text>
  <line x1="490" y1="334" x2="490" y2="346" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box 7 (answer) -->
  <rect x="370" y="348" width="240" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="382" y="373" font-size="12" fill="#333" font-weight="bold">⑦ dfs(0) = 6 + 2</text>
  <text x="598" y="373" text-anchor="end" font-size="12.5" fill="#4a7a3a" font-weight="bold">(8, T) ✓</text>

  <!-- link arrow from tree root to final box -->
  <path d="M 195 70 Q 300 70 370 368" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="300" y="64" font-size="10" fill="#4a7a3a">根 0 汇总</text>
</svg>
