<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：除数 d 越大 → 求和 S(d) 越小（单调递减）</text>

  <!-- ===== nums bar chart ===== -->
  <text x="40" y="52" font-size="12" fill="#888">数组 nums:</text>
  <line x1="80" y1="160" x2="330" y2="160" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- num 1 -->
  <rect x="96" y="150" width="44" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- num 2 -->
  <rect x="156" y="140" width="44" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="134" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- num 5 -->
  <rect x="216" y="110" width="44" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <!-- num 9 -->
  <rect x="276" y="70" width="44" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="298" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <text x="298" y="44" text-anchor="middle" font-size="10" fill="#d6a040">max = 9</text>
  <text x="118" y="176" text-anchor="middle" font-size="10" fill="#999">nums[0]</text>
  <text x="298" y="176" text-anchor="middle" font-size="10" fill="#999">nums[n-1]</text>

  <!-- ===== Formula box ===== -->
  <rect x="360" y="48" width="180" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">给定除数 d</text>
  <text x="450" y="96" text-anchor="middle" font-size="11" fill="#444">每数除以 d 向上取整</text>
  <text x="450" y="116" text-anchor="middle" font-size="11" fill="#444">总和 =</text>
  <text x="450" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Σ ⌈ nums[i] / d ⌉</text>

  <!-- arrow down -->
  <path d="M 280 188 L 280 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="200" font-size="11" fill="#888">S(d) 单调递减</text>

  <!-- ===== Monotonic curve ===== -->
  <line x1="80" y1="220" x2="80" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="80" y1="370" x2="380" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="226" text-anchor="end" font-size="10" fill="#888">S(d)</text>
  <text x="384" y="374" font-size="10" fill="#888">d →</text>
  <text x="74" y="374" text-anchor="end" font-size="10" fill="#999">0</text>

  <!-- decreasing curve -->
  <path d="M 90 232 C 135 295 205 332 370 350" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="150" y="252" font-size="11" fill="#446688" font-weight="bold">d ↑ ⇒ S(d) ↓</text>

  <!-- threshold line -->
  <line x1="80" y1="324" x2="380" y2="324" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="384" y="328" font-size="11" fill="#b85450" font-weight="bold">threshold=6</text>

  <!-- answer point at d=5 -->
  <circle cx="200" cy="324" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="200" y1="324" x2="200" y2="370" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="200" y="386" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d = 5</text>

  <text x="110" y="316" font-size="10" fill="#b85450">除数太小 ✗</text>
  <text x="300" y="316" font-size="10" fill="#4a7a3a">可行 ✓</text>

  <!-- right summary note -->
  <rect x="392" y="232" width="150" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="467" y="256" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="467" y="278" text-anchor="middle" font-size="11" fill="#666">d ∈ [1, max(nums)]</text>
  <text x="467" y="300" text-anchor="middle" font-size="11" fill="#666">求最小的 d</text>
  <text x="467" y="318" text-anchor="middle" font-size="11" fill="#666">使 S(d) ≤ threshold</text>
  <text x="467" y="340" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分！</text>
</svg>
