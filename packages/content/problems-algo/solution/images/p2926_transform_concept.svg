<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：移项变形 —— 平衡 ⟺ b[i] = nums[i] − i 不下降</text>

  <!-- 条件原文 -->
  <rect x="55" y="48" width="410" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">相邻两次选择 i（前）→ j（后）：nums[j] − nums[i] ≥ j − i</text>
  <text x="260" y="83" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">值差必须盖住下标差（两个下标纠缠在一起）</text>

  <path d="M 260 92 L 260 114" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="108" font-size="10" fill="#666" filter="url(#rough2)">移项：同类项各归各边</text>

  <!-- 移项后 -->
  <rect x="55" y="120" width="410" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">nums[j] − j ≥ nums[i] − i</text>
  <text x="260" y="155" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">条件只和各自下标绑定！</text>

  <path d="M 260 164 L 260 186" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="180" font-size="10" fill="#666" filter="url(#rough2)">令 b[x] = nums[x] − x</text>

  <!-- 结论 -->
  <rect x="55" y="192" width="410" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">平衡子序列 ⟺ 选出的 b 值不下降（允许相等）</text>
  <text x="260" y="227" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">LIS 的「最大和」版本：在不下降子序列里最大化元素和</text>

  <!-- 示例小表 -->
  <text x="260" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">例：nums = [3,3,5,6]，选中下标 0, 2, 3（全为正也不能全选！）</text>

  <!-- 行标签列 -->
  <rect x="40" y="272" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="289" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <rect x="40" y="300" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="317" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums</text>
  <rect x="40" y="328" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="345" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>

  <!-- 列 0（选中，绿） -->
  <rect x="102" y="272" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="289" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="102" y="300" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="317" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="102" y="328" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="345" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- 列 1（弃用，灰） -->
  <rect x="166" y="272" width="56" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="194" y="289" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>
  <rect x="166" y="300" width="56" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="194" y="317" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">3</text>
  <rect x="166" y="328" width="56" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="194" y="345" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- 列 2（选中，绿） -->
  <rect x="230" y="272" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="289" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="230" y="300" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="317" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="230" y="328" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="345" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- 列 3（选中，绿） -->
  <rect x="294" y="272" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="322" y="289" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="294" y="300" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="322" y="317" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="294" y="328" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="322" y="345" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- 右侧点评 -->
  <text x="428" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">选中 [3,5,6]</text>
  <text x="428" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">b = [3,3,3]</text>
  <text x="428" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 ≤ 3 ≤ 3 ✓</text>
  <text x="428" y="344" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">下标 1：b=2 破坏</text>
  <text x="428" y="358" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不下降，弃用</text>
</svg>
