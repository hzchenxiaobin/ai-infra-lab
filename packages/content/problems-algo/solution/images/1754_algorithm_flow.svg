<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：双指针 + 后缀比较贪心</text>

  <!-- Start -->
  <rect x="210" y="42" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = 0, j = 0, merge = ""</text>

  <!-- arrow -->
  <path d="M 280 78 L 280 96" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: both empty? -->
  <polygon points="280,98 380,138 280,178 180,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i ≥ n1 且</text>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j ≥ n2 ?</text>

  <!-- Yes -> return -->
  <path d="M 380 138 L 440 138" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="130" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="440" y="120" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 merge</text>

  <!-- No -->
  <path d="M 280 178 L 280 196" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="192" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Decision: word1[i:] > word2[j:] ? -->
  <polygon points="280,198 400,248 280,298 160,248" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">word1[i:]</text>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">&gt; word2[j:] ?</text>
  <text x="280" y="272" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(后缀比较)</text>

  <!-- Yes -> take from word1 -->
  <path d="M 160 248 L 100 248" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="20" y="230" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">merge += word1[i]</text>
  <text x="60" y="282" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i++</text>

  <!-- No -> take from word2 -->
  <path d="M 400 248 L 460 248" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="240" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="460" y="230" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">merge += word2[j]</text>
  <text x="500" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">j++</text>

  <!-- Loop back arrow from word1 side -->
  <path d="M 60 266 L 60 60 L 210 60" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- Loop back arrow from word2 side -->
  <path d="M 500 266 L 500 60 L 350 60" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <path d="M 40 320 L 520 320" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="56" y="342" font-size="11.5" fill="#555" filter="url(#rough2)">• 每步比较 <tspan fill="#b85450" font-weight="bold">整个后缀</tspan> word1[i:] vs word2[j:]，而非仅首字符</text>
  <text x="56" y="362" font-size="11.5" fill="#555" filter="url(#rough2)">• 后缀更大的一方取首字符 → 当前位放尽可能大的字符</text>
  <text x="56" y="382" font-size="11.5" fill="#555" filter="url(#rough2)">• 一方取空后，另一方整段拼接即可（后缀比较自然退化）</text>
  <text x="56" y="402" font-size="11" fill="#888" filter="url(#rough2)">时间 O((n+m) · min(n,m))，空间 O(n+m) 存结果</text>
</svg>
