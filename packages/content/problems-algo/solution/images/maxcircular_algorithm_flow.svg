<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">环形最大子数组和：算法流程</text>

  <!-- Step 1: Compute Kadane max -->
  <rect x="30" y="44" width="200" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① Kadane 求最大子数组和</text>
  <text x="130" y="84" text-anchor="middle" font-size="11" fill="#555">curMax = max(x, curMax+x)</text>

  <!-- Step 2: Compute Kadane min -->
  <rect x="290" y="44" width="200" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② Kadane 求最小子数组和</text>
  <text x="390" y="84" text-anchor="middle" font-size="11" fill="#555">curMin = min(x, curMin+x)</text>

  <!-- Step 3: Compute total -->
  <rect x="160" y="120" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 累加 total = Σnums[i]</text>

  <!-- Arrows from step 1 and 2 to step 3 -->
  <path d="M 130 94 L 130 105 L 200 120" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 390 94 L 390 105 L 320 120" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Decision: max_sum > 0? -->
  <path d="M 260 170 L 340 210 L 260 250 L 180 210 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">max_sum</text>
  <text x="260" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">&gt; 0 ?</text>

  <path d="M 260 164 L 260 170" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Yes branch -->
  <path d="M 340 210 L 420 210" stroke="#82b366" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="380" y="202" text-anchor="middle" font-size="11" fill="#82b366">是</text>

  <rect x="370" y="188" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="206" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">考虑环形</text>
  <text x="430" y="222" text-anchor="middle" font-size="10" fill="#555">total − min_sum</text>

  <!-- No branch -->
  <path d="M 180 210 L 100 210" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="140" y="202" text-anchor="middle" font-size="11" fill="#b85450">否（全负）</text>

  <rect x="30" y="188" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="90" y="206" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">不考虑环形</text>
  <text x="90" y="222" text-anchor="middle" font-size="10" fill="#555">直接返回 max_sum</text>

  <!-- Final: max -->
  <path d="M 90 232 L 90 270 L 200 290" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 430 232 L 430 270 L 320 290" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="160" y="278" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ answer =</text>
  <text x="260" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">max(max_sum, total − min_sum)</text>

  <!-- Summary -->
  <rect x="30" y="338" width="460" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#888">一次遍历同时求 max_sum、min_sum、total，O(n) 时间 O(1) 空间</text>
</svg>
