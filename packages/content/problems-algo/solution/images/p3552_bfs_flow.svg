<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 512"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="512" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：BFS 主循环 + discover（发现时扩张）</text>

  <text x="16" y="54" font-size="11" fill="#b85450" filter="url(#rough2)">※ 队列空仍未到终点 ⇒ 返回 -1</text>

  <!-- 开始 -->
  <rect x="215" y="42" width="100" height="30" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="62" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">开始</text>
  <path d="M 265 72 L 265 88" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- A: discover 过程 -->
  <rect x="135" y="92" width="260" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="265" y="110" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">discover(x, y, d)：标记距离并入队</text>
  <text x="265" y="128" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">（起点调用 discover(0, 0, 0)）</text>
  <path d="M 265 136 L 265 150" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- D1: 未使用字母？ -->
  <polygon points="265,152 392,190 265,228 138,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">该格是「未使用」</text>
  <text x="265" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">的传送门字母？</text>
  <path d="M 392 190 L 414 190" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="398" y="182" font-size="11" fill="#a07818" filter="url(#rough2)">是</text>
  <path d="M 265 228 L 265 244" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="241" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <!-- B: 同层扩张 -->
  <rect x="416" y="158" width="94" height="64" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="463" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">标记字母已用</text>
  <text x="463" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">同字母格逐个</text>
  <text x="463" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">discover(同 d)</text>
  <path d="M 463 156 C 463 122, 430 112, 398 112" fill="none" stroke="#b85450" stroke-width="1.8"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="470" y="132" font-size="10.5" fill="#b85450" filter="url(#rough2)">0 成本</text>

  <!-- C: 出队 -->
  <rect x="135" y="246" width="260" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="265" y="271" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">出队 (x, y)，d = dist[x][y]</text>
  <path d="M 265 286 L 265 300" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- D2: 终点？ -->
  <polygon points="265,302 360,334 265,366 170,334" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="339" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">是终点？</text>
  <path d="M 360 334 L 382 334" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="366" y="326" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- R: 返回 -->
  <rect x="386" y="312" width="108" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="390" y="316" width="100" height="36" rx="6" fill="none" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="440" y="339" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">返回 d</text>
  <path d="M 265 366 L 265 382" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="379" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <!-- N: 枚举邻居 -->
  <rect x="135" y="384" width="260" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="265" y="408" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">枚举 (x, y) 的四方向邻居 (nx, ny)</text>
  <path d="M 265 422 L 265 434" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- D3: 邻居可用？ -->
  <polygon points="265,436 400,468 265,500 130,468" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="464" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">界内 且 非 '#'</text>
  <text x="265" y="480" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">且尚未访问？</text>
  <path d="M 400 468 L 422 468" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="406" y="460" font-size="11" fill="#666" filter="url(#rough2)">是</text>

  <!-- E: 发现邻居 -->
  <rect x="424" y="442" width="88" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="468" y="464" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">discover</text>
  <text x="468" y="480" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(nx,ny,d+1)</text>

  <!-- E -> N: 继续枚举 -->
  <path d="M 450 440 C 430 430, 414 418, 398 406" fill="none" stroke="#446688" stroke-width="1.6"
        stroke-dasharray="6 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="418" y="434" font-size="10" fill="#446688" filter="url(#rough2)">继续</text>

  <!-- D3 否 -> N -->
  <path d="M 130 468 C 96 466, 96 428, 133 419" fill="none" stroke="#446688" stroke-width="1.6"
        marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="88" y="452" font-size="10" fill="#666" filter="url(#rough2)">否·跳过</text>

  <!-- N -> C: 枚举完回到出队 -->
  <path d="M 135 390 C 80 368, 80 292, 133 268" fill="none" stroke="#446688" stroke-width="1.6"
        stroke-dasharray="6 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="66" y="332" font-size="10.5" fill="#446688" transform="rotate(-90 66 332)" filter="url(#rough2)">枚举完四邻居</text>
</svg>
