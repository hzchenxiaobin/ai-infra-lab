<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="460" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">回溯搜索树：nums=[1,8,17]（已排序）</text>

  <!-- Root -->
  <ellipse cx="340" cy="60" rx="38" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">start</text>

  <!-- Level 1: pick first element (no sum constraint) -->
  <ellipse cx="120" cy="120" rx="26" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <ellipse cx="340" cy="120" rx="26" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <ellipse cx="560" cy="120" rx="26" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="560" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">17</text>

  <!-- Edges root -> L1 -->
  <path d="M318,72 Q210,92 142,104" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M340,78 L340,102" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M362,72 Q472,92 540,104" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Level 2 -->
  <!-- Under 1: 8 (valid), 17 (pruned) -->
  <ellipse cx="70" cy="200" rx="24" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="96" y="166" font-size="11" fill="#4a7a3a" filter="url(#rough2)">9=3²✓</text>

  <ellipse cx="190" cy="200" rx="24" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="190" y="205" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">17</text>
  <text x="202" y="166" font-size="11" fill="#b85450" filter="url(#rough2)">18✗</text>

  <!-- Under 8: 1 (valid), 17 (valid) -->
  <ellipse cx="290" cy="200" rx="24" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="316" y="166" font-size="11" fill="#4a7a3a" filter="url(#rough2)">9=3²✓</text>

  <ellipse cx="390" cy="200" rx="24" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">17</text>
  <text x="416" y="166" font-size="11" fill="#4a7a3a" filter="url(#rough2)">25=5²✓</text>

  <!-- Under 17: 1 (pruned), 8 (valid) -->
  <ellipse cx="510" cy="200" rx="24" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="510" y="205" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="522" y="166" font-size="11" fill="#b85450" filter="url(#rough2)">18✗</text>

  <ellipse cx="610" cy="200" rx="24" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="610" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="636" y="166" font-size="11" fill="#4a7a3a" filter="url(#rough2)">25=5²✓</text>

  <!-- Edges L1 -> L2 -->
  <path d="M108,135 Q82,162 76,184" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M132,135 Q172,162 182,184" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M328,135 Q302,162 296,184" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M352,135 Q382,162 386,184" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M548,135 Q522,162 516,184" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M572,135 Q602,162 606,184" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Level 3 -->
  <ellipse cx="70" cy="280" rx="24" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">17</text>
  <text x="96" y="248" font-size="11" fill="#4a7a3a" filter="url(#rough2)">25=5²✓</text>

  <ellipse cx="290" cy="280" rx="24" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="290" y="285" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">17</text>
  <text x="306" y="248" font-size="11" fill="#b85450" filter="url(#rough2)">18✗</text>

  <ellipse cx="390" cy="280" rx="24" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="390" y="285" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="406" y="248" font-size="11" fill="#b85450" filter="url(#rough2)">18✗</text>

  <ellipse cx="610" cy="280" rx="24" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="610" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="636" y="248" font-size="11" fill="#4a7a3a" filter="url(#rough2)">9=3²✓</text>

  <!-- Edges L2 -> L3 -->
  <path d="M70,217 L70,264" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M290,217 L290,264" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M390,217 L390,264" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M610,217 L610,264" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Results -->
  <path d="M70,297 L70,330" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="20" y="332" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="70" y="354" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1,8,17] ✓</text>
  <text x="70" y="384" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">ans = 1</text>

  <path d="M610,297 L610,330" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="560" y="332" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="610" y="354" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[17,8,1] ✓</text>
  <text x="610" y="384" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">ans = 2</text>

  <!-- Legend -->
  <ellipse cx="170" cy="428" rx="14" ry="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="192" y="432" font-size="11" fill="#555" filter="url(#rough2)">合法分支（相邻和为完全平方数）</text>
  <ellipse cx="430" cy="428" rx="14" ry="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="452" y="432" font-size="11" fill="#555" filter="url(#rough2)">剪枝（和不平方 / 同层重复）</text>
</svg>
