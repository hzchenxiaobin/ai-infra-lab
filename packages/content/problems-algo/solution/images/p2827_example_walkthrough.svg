<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：low=10, high=20, k=3 → count(20) − count(9)</text>

  <!-- ===== count(9) ===== -->
  <rect x="30" y="40" width="500" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="60" font-size="11.5" fill="#333" font-weight="bold">count(9) = 0</text>
  <text x="44" y="77" font-size="11" fill="#555">一位数 1~9：diff = ±1 ≠ 0，总位数为奇数 ⇒ 必不美丽</text>

  <path d="M280 90 L280 110" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== count(20) tree ===== -->
  <text x="30" y="126" font-size="11.5" fill="#666" font-weight="bold">count(20)：s = "20"，逐位枚举（k=3）</text>

  <!-- root -->
  <rect x="225" y="136" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i=0, up=2</text>

  <!-- branch d=0 -->
  <path d="M240 162 L120 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="180" font-size="10.5" fill="#888">d=0 前导零</text>
  <rect x="30" y="196" width="180" height="56" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="120" y="216" text-anchor="middle" font-size="11" fill="#555">保持未开始 → i=1 填一位</text>
  <text x="120" y="234" text-anchor="middle" font-size="11" fill="#b85450">1~9 的 diff = ±1 → 贡献 0</text>

  <!-- branch d=1 -->
  <path d="M280 162 L280 192" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="182" font-size="10.5" fill="#4a7a3a">d=1 自由分支</text>
  <rect x="225" y="196" width="200" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="325" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">数值 10 ~ 19（i=1 自由填）</text>
  <text x="237" y="234" font-size="10.5" fill="#555">diff=0：10, 12, 14, 16, 18</text>
  <text x="237" y="250" font-size="10.5" fill="#4a7a3a" font-weight="bold">被 3 整除：12 ✓ 18 ✓</text>
  <text x="325" y="264" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">贡献 2</text>

  <!-- branch d=2 -->
  <path d="M320 162 L452 192" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="380" y="180" font-size="10.5" fill="#b85450">d=2 贴界分支</text>
  <rect x="452" y="196" width="80" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="492" y="216" text-anchor="middle" font-size="11" fill="#555">20 本身：</text>
  <text x="492" y="234" text-anchor="middle" font-size="11" fill="#b85450">diff=−2 → 0</text>

  <!-- sum -->
  <path d="M280 274 L280 298" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="304" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">count(20) = 0 + 2 + 0 = 2</text>

  <!-- final answer -->
  <path d="M280 342 L280 362" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="130" y="368" width="300" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">答案 = count(20) − count(9) = 2 − 0 = 2 ✓</text>
  <text x="280" y="408" text-anchor="middle" font-size="10.5" fill="#888">（美丽整数正是 12 和 18）</text>
</svg>
