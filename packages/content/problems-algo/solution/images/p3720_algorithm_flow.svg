<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 448"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="448" fill="#fafafa"/>

  <text x="30" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：贪心匹配到最远 → 回退找提升位 → 构造答案</text>

  <!-- ① 统计频次 -->
  <rect x="175" y="36" width="180" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="57" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">① 统计 s 的频次 cnt[26]</text>
  <path d="M 265 70 L 265 88" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 匹配菱形 -->
  <polygon points="265,92 365,128 265,164 165,128" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="124" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">② 剩余中有</text>
  <text x="265" y="140" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">target[m] ？</text>

  <path d="M 365 128 L 395 128" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="395" y="110" width="110" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="126" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">扣减一个，</text>
  <text x="450" y="140" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">m ← m + 1</text>
  <path d="M 450 110 C 450 78, 350 70, 270 90" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 265 164 L 265 186" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="180" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- ③ 初始化 p -->
  <rect x="140" y="190" width="250" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="207" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">③ p = min(m, n−1)</text>
  <text x="265" y="223" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">若 m = n：先还回 target[n−1]</text>
  <path d="M 265 230 L 265 250" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 检查菱形 -->
  <polygon points="265,254 385,294 265,334 145,294" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="290" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">④ 剩余中有字符</text>
  <text x="265" y="306" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">&gt; target[p] ？</text>

  <path d="M 385 294 L 405 294" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="394" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">有</text>
  <rect x="405" y="266" width="105" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="457" y="284" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">target[:p] + 提升字符</text>
  <text x="457" y="300" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">+ 剩余升序尾巴</text>
  <text x="457" y="316" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">→ 返回</text>

  <path d="M 265 334 L 265 354" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="348" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">无</text>

  <!-- ⑤ p==0 菱形 -->
  <polygon points="265,358 345,390 265,422 185,390" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="395" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⑤ p = 0 ？</text>

  <path d="M 345 390 L 375 390" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="382" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="375" y="372" width="110" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="395" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ""</text>

  <path d="M 185 390 L 155 390" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="170" y="382" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="22" y="352" width="133" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="88" y="374" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">还回</text>
  <text x="88" y="390" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">target[p−1]</text>
  <text x="88" y="406" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">p ← p − 1</text>
  <path d="M 88 352 C 88 315, 110 294, 140 294" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 橙色箭头 marker -->
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
</svg>
