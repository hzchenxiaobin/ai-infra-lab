<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：arr = [1,0,0,1,0,0,1,0,0]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">含末尾 0，体现 trailing 锁定机制</text>

  <!-- Array cells, width 46, start x=73 -->
  <!-- part1: 0,1,2 blue -->
  <rect x="73" y="60" width="46" height="32" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="81" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="119" y="60" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="81" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="165" y="60" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="81" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- part2: 3,4,5 green -->
  <rect x="211" y="60" width="46" height="32" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="81" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="257" y="60" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="81" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="303" y="60" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="81" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- part3: 6,7,8 orange -->
  <rect x="349" y="60" width="46" height="32" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="81" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="395" y="60" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="81" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="441" y="60" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="464" y="81" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- index labels -->
  <text x="96" y="108" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="234" y="108" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="372" y="108" text-anchor="middle" font-size="9" fill="#aaa">6</text>

  <!-- part braces -->
  <path d="M 73 100 L 73 116 L 211 116 L 211 100" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="142" y="132" text-anchor="middle" font-size="10" fill="#446688">part1 [1,0,0]</text>
  <path d="M 211 100 L 211 116 L 349 116 L 349 100" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a">part2 [1,0,0]</text>
  <path d="M 349 100 L 349 116 L 487 116 L 487 100" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="418" y="132" text-anchor="middle" font-size="10" fill="#d6a040">part3 [1,0,0]</text>

  <!-- computation steps -->
  <text x="40" y="160" font-size="12" fill="#333">① ones = [0, 3, 6]   →   m = 3</text>
  <text x="40" y="182" font-size="12" fill="#333">② 3 % 3 == 0   →   k = 1</text>
  <text x="40" y="204" font-size="12" fill="#333">③ trailing = 9 − 1 − 6 = </text>
  <text x="248" y="204" font-size="13" fill="#b85450" font-weight="bold">2</text>

  <text x="40" y="232" font-size="12" fill="#446688">④ i = ones[0] + 2 = 0 + 2 = </text>
  <text x="252" y="232" font-size="13" fill="#446688" font-weight="bold">2</text>
  <text x="40" y="254" font-size="12" fill="#4a7a3a">⑤ j = ones[1] + 2 + 1 = 3 + 2 + 1 = </text>
  <text x="296" y="254" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- compare box -->
  <rect x="40" y="272" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="291" text-anchor="middle" font-size="12" fill="#333">⑥ 逐位比较：[1,0,0] == [1,0,0] == [1,0,0]</text>
  <text x="280" y="307" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">三段完全相等 ✓</text>

  <!-- result box -->
  <rect x="40" y="326" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">return [2, 6]</text>
</svg>
