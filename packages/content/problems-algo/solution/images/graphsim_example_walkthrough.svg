<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrw" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：dp 表 + 回溯路径</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">targetPath = [ATL, DXB, HND, LAX]，红色框为回溯经过的最优单元（从 i=3 倒推到 i=0）</text>

  <!-- ===== grid ===== -->
  <!-- column x positions: i(40) target(95) v0(180) v1(250) v2(320) v3(390) v4(460) ; each cell 70 wide except first two -->
  <g font-size="11">
    <!-- header row -->
    <rect x="40" y="62" width="55" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="67" y="84" text-anchor="middle" fill="#446688" font-weight="bold">i</text>
    <rect x="95" y="62" width="85" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="137" y="80" text-anchor="middle" fill="#446688" font-weight="bold">target[i]</text>
    <text x="137" y="92" text-anchor="middle" font-size="8" fill="#888">城市名</text>

    <rect x="180" y="62" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="215" y="80" text-anchor="middle" fill="#333" font-weight="bold">v0</text>
    <text x="215" y="92" text-anchor="middle" font-size="8" fill="#888">ATL</text>
    <rect x="250" y="62" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="285" y="80" text-anchor="middle" fill="#333" font-weight="bold">v1</text>
    <text x="285" y="92" text-anchor="middle" font-size="8" fill="#888">PEK</text>
    <rect x="320" y="62" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="355" y="80" text-anchor="middle" fill="#333" font-weight="bold">v2</text>
    <text x="355" y="92" text-anchor="middle" font-size="8" fill="#888">LAX</text>
    <rect x="390" y="62" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="425" y="80" text-anchor="middle" fill="#333" font-weight="bold">v3</text>
    <text x="425" y="92" text-anchor="middle" font-size="8" fill="#888">DXB</text>
    <rect x="460" y="62" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="495" y="80" text-anchor="middle" fill="#333" font-weight="bold">v4</text>
    <text x="495" y="92" text-anchor="middle" font-size="8" fill="#888">HND</text>

    <!-- row i=0 -->
    <rect x="40" y="98" width="55" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="67" y="118" text-anchor="middle" fill="#333">0</text>
    <rect x="95" y="98" width="85" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="137" y="118" text-anchor="middle" fill="#b85450" font-weight="bold">ATL</text>
    <!-- v0=0 (backtrack) -->
    <rect x="180" y="98" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="215" y="118" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="250" y="98" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="285" y="118" text-anchor="middle" fill="#666">1</text>
    <rect x="320" y="98" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="355" y="118" text-anchor="middle" fill="#666">1</text>
    <rect x="390" y="98" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="425" y="118" text-anchor="middle" fill="#666">1</text>
    <rect x="460" y="98" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="495" y="118" text-anchor="middle" fill="#666">1</text>

    <!-- row i=1 -->
    <rect x="40" y="132" width="55" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="67" y="152" text-anchor="middle" fill="#333">1</text>
    <rect x="95" y="132" width="85" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="137" y="152" text-anchor="middle" fill="#b85450" font-weight="bold">DXB</text>
    <rect x="180" y="132" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="215" y="152" text-anchor="middle" fill="#666">2</text>
    <rect x="250" y="132" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="285" y="152" text-anchor="middle" fill="#666">2</text>
    <rect x="320" y="132" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="355" y="152" text-anchor="middle" fill="#666">1</text>
    <!-- v3=0 (backtrack) -->
    <rect x="390" y="132" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="425" y="152" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="460" y="132" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="495" y="152" text-anchor="middle" fill="#666">2</text>

    <!-- row i=2 -->
    <rect x="40" y="166" width="55" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="67" y="186" text-anchor="middle" fill="#333">2</text>
    <rect x="95" y="166" width="85" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="137" y="186" text-anchor="middle" fill="#b85450" font-weight="bold">HND</text>
    <!-- v0=1 (backtrack) -->
    <rect x="180" y="166" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="215" y="186" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="250" y="166" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="285" y="186" text-anchor="middle" fill="#666">1</text>
    <rect x="320" y="166" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="355" y="186" text-anchor="middle" fill="#666">3</text>
    <rect x="390" y="166" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="425" y="186" text-anchor="middle" fill="#666">3</text>
    <rect x="460" y="166" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="495" y="186" text-anchor="middle" fill="#666">1</text>

    <!-- row i=3 -->
    <rect x="40" y="200" width="55" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="67" y="220" text-anchor="middle" fill="#333">3</text>
    <rect x="95" y="200" width="85" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="137" y="220" text-anchor="middle" fill="#b85450" font-weight="bold">LAX</text>
    <rect x="180" y="200" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="215" y="220" text-anchor="middle" fill="#666">4</text>
    <rect x="250" y="200" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="285" y="220" text-anchor="middle" fill="#666">2</text>
    <!-- v2=1 (backtrack, answer) -->
    <rect x="320" y="200" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
    <text x="355" y="220" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="390" y="200" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="425" y="220" text-anchor="middle" fill="#666">2</text>
    <rect x="460" y="200" width="70" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="495" y="220" text-anchor="middle" fill="#666">2</text>
  </g>

  <!-- backtrack arrows (upward, i=3->0) -->
  <g fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)">
    <path d="M 355 200 C 355 168, 425 168, 425 132" marker-end="url(#arrw)"/>
    <path d="M 425 132 C 425 100, 215 100, 215 98" marker-end="url(#arrw)"/>
  </g>

  <!-- result path bar -->
  <text x="40" y="262" font-size="12" fill="#444" font-weight="bold">回溯得到路径：</text>
  <g font-size="11">
    <rect x="40" y="272" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="80" y="288" text-anchor="middle" fill="#333" font-weight="bold">节点0</text>
    <text x="80" y="300" text-anchor="middle" font-size="9" fill="#4a7a3a">ATL ✓</text>
    <rect x="124" y="272" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="164" y="288" text-anchor="middle" fill="#333" font-weight="bold">节点3</text>
    <text x="164" y="300" text-anchor="middle" font-size="9" fill="#4a7a3a">DXB ✓</text>
    <rect x="208" y="272" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="248" y="288" text-anchor="middle" fill="#333" font-weight="bold">节点0</text>
    <text x="248" y="300" text-anchor="middle" font-size="9" fill="#d6a040">ATL ✗≠HND</text>
    <rect x="292" y="272" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="332" y="288" text-anchor="middle" fill="#333" font-weight="bold">节点2</text>
    <text x="332" y="300" text-anchor="middle" font-size="9" fill="#4a7a3a">LAX ✓</text>
  </g>
  <text x="384" y="294" font-size="12" fill="#b85450" font-weight="bold">编辑距离 = 1</text>

  <!-- prev trace note -->
  <rect x="40" y="330" width="520" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="352" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">回溯轨迹（prev 指针）</text>
  <text x="300" y="372" text-anchor="middle" font-size="11" fill="#333">i=3：dp[3] 最小值 1 在 v2 → ans[3]=2，prev[3][2]=0</text>
  <text x="300" y="388" text-anchor="middle" font-size="11" fill="#333">i=2：ans[2]=0，prev[2][0]=3</text>
  <text x="300" y="404" text-anchor="middle" font-size="11" fill="#333">i=1：ans[1]=3，prev[1][3]=0</text>
  <text x="300" y="418" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i=0：ans[0]=0 → 路径 [0,3,0,2]</text>
</svg>
