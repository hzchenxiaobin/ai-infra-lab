  <!-- Divider -->
  <line x1="20" y1="266" x2="620" y2="266" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Observations -->
  <text x="20" y="290" font-size="12" fill="#444" font-weight="bold">关键观察：</text>
  <text x="20" y="312" font-size="11" fill="#333">• 下标 0/1/2 在首个 e 之前：正向得 ∞，仅靠反向补上 → 3, 2, 1</text>
  <text x="20" y="332" font-size="11" fill="#333">• 下标 9（o）介于 e(6) 与 e(11) 之间：正向 3、反向 2 → min = 2</text>
  <text x="20" y="352" font-size="11" fill="#333">• 下标 10（d）正向 4 偏大，反向 1 更近 e(11) → min = 1</text>
  <text x="20" y="372" font-size="11" fill="#333">• e 位置本身两遍都是 0，min 仍为 0</text>

  <rect x="20" y="386" width="600" height="0" fill="none"/>
  <rect x="200" y="396" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="418" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案 = [3,2,1,0,1,0,0,1,2,2,1,0] ⭐</text>
  <text x="320" y="448" text-anchor="middle" font-size="10" fill="#888">正反两遍各 O(n)，取 min 即得每个位置到最近 e 的距离</text>
