<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：哈希集合求差集</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">一次建表 + 集合差运算，O(n+m) 时间</text>

  <!-- ===== Step 1: build set2 ===== -->
  <rect x="40" y="64" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"
        rx="6" filter="url(#rough2)"/>
  <text x="150" y="84" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 建 set1 = set(nums1)</text>
  <text x="150" y="100" text-anchor="middle" font-size="10" fill="#888">O(n)，自动去重</text>

  <!-- arrow down -->
  <path d="M 150 110 L 150 132" stroke="#666" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: build set2 ===== -->
  <rect x="40" y="134" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"
        rx="6" filter="url(#rough2)"/>
  <text x="150" y="154" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 建 set2 = set(nums2)</text>
  <text x="150" y="170" text-anchor="middle" font-size="10" fill="#888">O(m)，自动去重</text>

  <!-- arrow down -->
  <path d="M 150 180 L 150 202" stroke="#666" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: decision diamond for difference 1 ===== -->
  <polygon points="150,206 250,250 150,294 50,250" fill="#e8f0fe" stroke="#446688"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="246" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">ans0 = set1 − set2</text>
  <text x="150" y="262" text-anchor="middle" font-size="9.5" fill="#888">A 中不在 B 的元素</text>

  <!-- arrow right to ans0 box -->
  <path d="M 250 250 L 320 250" stroke="#666" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="324" y="232" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"
        rx="6" filter="url(#rough2)"/>
  <text x="414" y="255" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">answer[0] = list(ans0)</text>

  <!-- ===== Step 4: decision diamond for difference 2 ===== -->
  <polygon points="150,306 250,350 150,394 50,350" fill="#e8f0fe" stroke="#446688"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="346" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">ans1 = set2 − set1</text>
  <text x="150" y="362" text-anchor="middle" font-size="9.5" fill="#888">B 中不在 A 的元素</text>

  <!-- arrow right to ans1 box -->
  <path d="M 250 350 L 320 350" stroke="#666" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="324" y="332" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"
        rx="6" filter="url(#rough2)"/>
  <text x="414" y="355" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">answer[1] = list(ans1)</text>

  <!-- dashed link between the two diamonds -->
  <path d="M 150 294 L 150 306" stroke="#888" stroke-width="1.4" fill="none"
        stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right side note -->
  <rect x="324" y="100" width="200" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"
        rx="6" filter="url(#rough2)"/>
  <text x="424" y="122" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">关键点</text>
  <text x="334" y="140" font-size="9.5" fill="#555">· 建集合即去重</text>
  <text x="334" y="156" font-size="9.5" fill="#555">· 集合差运算 O(min)</text>
  <text x="334" y="172" font-size="9.5" fill="#555">· 无需关心返回顺序</text>

  <!-- Footer -->
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#888">黄=建表 · 蓝=差运算 · 绿=结果 · 红=注意点</text>
</svg>
