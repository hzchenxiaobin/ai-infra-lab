<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="390" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：猜测分桶 → 保留同桶候选 → 候选集缩减</text>

  <!-- ===== Candidate pool: 6 words in a row ===== -->
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">候选集（6 个词，secret = bccbzz）</text>

  <!-- w0 -->
  <rect x="42" y="52" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="72" text-anchor="middle" font-size="12" fill="#333">acckzz</text>
  <!-- w1 -->
  <rect x="124" y="52" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="72" text-anchor="middle" font-size="12" fill="#333">ccbazz</text>
  <!-- w2 -->
  <rect x="206" y="52" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="72" text-anchor="middle" font-size="12" fill="#333">eiowzz</text>
  <!-- w3 -->
  <rect x="288" y="52" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="72" text-anchor="middle" font-size="12" fill="#333">abcczz</text>
  <!-- w4 -->
  <rect x="370" y="52" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="72" text-anchor="middle" font-size="12" fill="#333">aacdzz</text>
  <!-- w5 -->
  <rect x="452" y="52" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="72" text-anchor="middle" font-size="12" fill="#333">bccbzz</text>

  <!-- Arrow down to guess -->
  <path d="M 290 86 L 290 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Guess box ===== -->
  <rect x="120" y="102" width="340" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">min-max 选 w0 = acckzz → master.guess → m = 3</text>

  <!-- Arrow down to buckets -->
  <path d="M 290 140 L 290 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Buckets header ===== -->
  <text x="290" y="164" text-anchor="middle" font-size="11" fill="#888">按 match(acckzz, c) 分桶</text>

  <!-- Bucket m=2 -->
  <rect x="170" y="170" width="240" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="190" y="188" font-size="11" fill="#888">m=2:</text>
  <text x="230" y="188" font-size="11" fill="#999">eiowzz</text>

  <!-- Bucket m=3 (surviving) -->
  <rect x="160" y="202" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="222" font-size="11" fill="#4a7a3a" font-weight="bold">m=3:</text>
  <text x="220" y="222" font-size="12" fill="#333" font-weight="bold">ccbazz, bccbzz</text>
  <text x="390" y="222" font-size="11" fill="#4a7a3a" font-weight="bold">← 保留 ✓</text>

  <!-- Bucket m=4 -->
  <rect x="170" y="238" width="240" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="190" y="256" font-size="11" fill="#888">m=4:</text>
  <text x="230" y="256" font-size="11" fill="#999">abcczz, aacdzz</text>

  <!-- Bucket m=6 -->
  <rect x="170" y="270" width="240" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="190" y="288" font-size="11" fill="#888">m=6:</text>
  <text x="230" y="288" font-size="11" fill="#999">acckzz（自身）</text>

  <!-- Arrow from m=3 bucket to new candidates -->
  <path d="M 290 232 L 290 308 L 290 318" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== New candidate set ===== -->
  <rect x="120" y="308" width="340" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="329" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">新候选集 = {ccbazz, bccbzz}（6 → 2）</text>

  <!-- ===== Minimax note ===== -->
  <rect x="40" y="352" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="372" text-anchor="middle" font-size="11" fill="#444">minimax：选使最大桶最小的词 → 最坏情况缩减最多 → 100 词约 3 步收敛</text>
</svg>
