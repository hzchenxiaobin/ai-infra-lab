<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：长度 k 的滑动窗口扫过 num 的数字串，逐窗口判整除</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">val ≠ 0 且 num % val == 0 即计数 +1（以 num=430043, k=2 为例）</text>

  <!-- ===== String num = "430043" ===== -->
  <text x="32" y="86" font-size="10.5" fill="#666">num</text>
  <!-- index labels -->
  <text x="100" y="76" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="144" y="76" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="188" y="76" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="232" y="76" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="276" y="76" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="320" y="76" text-anchor="middle" font-size="9" fill="#888">5</text>

  <!-- boxes -->
  <rect x="80"  y="80" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="124" y="80" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="168" y="80" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="212" y="80" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="256" y="80" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="300" y="80" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- current window bracket at i=0 (boxes 0,1) -->
  <path d="M 80 122 Q 80 132 100 134 L 144 134 Q 164 132 164 122" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="122" y="150" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">当前窗口 i=0：43 ✓</text>

  <!-- sliding arrow -->
  <line x1="350" y1="98" x2="430" y2="98" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="390" y="90" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">窗口右移</text>

  <!-- ===== 5 candidate windows row ===== -->
  <text x="32" y="192" font-size="10.5" fill="#666">候选</text>

  <!-- window 0: 43 ✓ -->
  <rect x="36" y="172" width="92" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="82" y="192" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">43</text>
  <text x="82" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">val=43 ✓</text>

  <!-- window 1: 30 ✗ -->
  <rect x="136" y="172" width="92" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="182" y="192" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">30</text>
  <text x="182" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">余23 ✗</text>

  <!-- window 2: 00 ✗ (zero trap) -->
  <rect x="236" y="172" width="92" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="282" y="192" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">00</text>
  <text x="282" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">val=0 ✗</text>

  <!-- window 3: 04 ✗ -->
  <rect x="336" y="172" width="92" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="382" y="192" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">04</text>
  <text x="382" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">val=4 ✗</text>

  <!-- window 4: 43 ✓ -->
  <rect x="436" y="172" width="92" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="482" y="192" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">43</text>
  <text x="482" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">val=43 ✓</text>

  <!-- converge arrows down -->
  <line x1="82"  y1="220" x2="82"  y2="244" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <line x1="482" y1="220" x2="482" y2="244" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- counter -->
  <rect x="120" y="250" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="277" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">k 美丽值 ans = 2（命中两次）</text>

  <!-- trap callout -->
  <rect x="40" y="306" width="465" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="272" y="324" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">⚠ 陷阱："00"→val=0，0 不整除任何数，必须先判 val≠0 再取模，否则触发除零</text>
  <text x="272" y="338" text-anchor="middle" font-size="10" fill="#888">前缀 0 合法，"04" 按 val=4 参与判定（不剥前导零）</text>

  <!-- footer -->
  <rect x="40" y="358" width="465" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="272" y="378" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">一次遍历 O(n·k)：n−k+1 个窗口，每窗 O(k) 转整数 + O(1) 取模</text>
</svg>
