<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">不同的好子序列：按末位分桶 + 当前位再生</text>

  <!-- String row -->
  <text x="40" y="62" font-size="11" fill="#888">binary =</text>
  <rect x="96" y="46" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="138" y="46" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="180" y="46" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="222" y="46" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="242" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="276" y="62" font-size="11" fill="#888">（8 个不同好子序列）</text>

  <!-- Panel A: buckets -->
  <rect x="24" y="90" width="512" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">分桶：以 1 开头的好子序列按末位归档（"0" 另算）</text>

  <!-- end1 bucket -->
  <rect x="40" y="120" width="200" height="80" rx="6" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="138" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">end1 = 3（末位 1，含 "1"）</text>
  <text x="56" y="158" font-size="11" fill="#333">"1"</text>
  <text x="96" y="158" font-size="11" fill="#333">"11"</text>
  <text x="146" y="158" font-size="11" fill="#333">"101"</text>
  <text x="56" y="178" font-size="10" fill="#888">读 '1'：end1 ← total + 1</text>

  <!-- end0 bucket -->
  <rect x="248" y="120" width="200" height="80" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">end0 = 4（末位 0，以 1 开头）</text>
  <text x="260" y="158" font-size="11" fill="#333">"10"</text>
  <text x="300" y="158" font-size="11" fill="#333">"100"</text>
  <text x="350" y="158" font-size="11" fill="#333">"110"</text>
  <text x="400" y="158" font-size="11" fill="#333">"1010"</text>
  <text x="264" y="178" font-size="10" fill="#888">读 '0'：end0 ← total</text>

  <!-- "0" separate -->
  <rect x="456" y="120" width="72" height="80" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="492" y="138" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">"0" 单算</text>
  <text x="492" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">has0=1</text>
  <text x="492" y="178" text-anchor="middle" font-size="10" fill="#888">末尾 +1</text>

  <!-- Panel B: regeneration -->
  <rect x="24" y="226" width="512" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">再生：读 '0'(第 4 位) 时，每个 s → s+"0" 重生成 end0</text>

  <!-- left: s set (total = end0+end1) -->
  <text x="40" y="268" font-size="11" fill="#555" font-weight="bold">total = 4（当前以 1 开头的好子序列）</text>
  <text x="48" y="290" font-size="11" fill="#333">"1"</text>
  <text x="48" y="308" font-size="11" fill="#333">"10"</text>
  <text x="48" y="326" font-size="11" fill="#333">"11"</text>
  <text x="48" y="344" font-size="11" fill="#333">"101"</text>

  <!-- arrows -->
  <line x1="96" y1="286" x2="232" y2="286" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="96" y1="304" x2="232" y2="304" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="96" y1="322" x2="232" y2="322" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="96" y1="340" x2="232" y2="340" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="280" font-size="10" fill="#4a7a3a">+ "0"</text>

  <!-- right: new end0 -->
  <text x="248" y="268" font-size="11" fill="#4a7a3a" font-weight="bold">新 end0 = 4（无重复，单射）</text>
  <text x="260" y="290" font-size="11" fill="#333" font-weight="bold">"10"</text>
  <text x="260" y="308" font-size="11" fill="#333" font-weight="bold">"100"</text>
  <text x="260" y="326" font-size="11" fill="#333" font-weight="bold">"110"</text>
  <text x="260" y="344" font-size="11" fill="#333" font-weight="bold">"1010"</text>

  <!-- note -->
  <text x="360" y="290" font-size="10" fill="#888">旧 "10" 被</text>
  <text x="360" y="304" font-size="10" fill="#888">"1"+"0" 覆盖</text>
  <text x="360" y="326" font-size="10" fill="#b85450" font-weight="bold">替换不累加</text>
  <text x="360" y="340" font-size="10" fill="#b85450" font-weight="bold">重复自然合并</text>
</svg>
