<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：k=2, W=3, n=3 → 答案 8/9</text>

  <!-- ===== Table ===== -->
  <!-- header row -->
  <rect x="60" y="48" width="50" height="32" fill="#eeeeee" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="85" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">x</text>
  <rect x="110" y="48" width="110" height="32" fill="#eeeeee" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">窗口 y (&lt;k)</text>
  <rect x="220" y="48" width="70" height="32" fill="#eeeeee" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="255" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">S</text>
  <rect x="290" y="48" width="90" height="32" fill="#eeeeee" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="335" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">dp[x]=S/3</text>
  <rect x="380" y="48" width="90" height="32" fill="#eeeeee" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">累计 ans</text>

  <!-- row x=0 -->
  <rect x="60" y="80" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="85" y="100" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="110" y="80" width="110" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="165" y="100" text-anchor="middle" font-size="11" fill="#999">—</text>
  <rect x="220" y="80" width="70" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="100" text-anchor="middle" font-size="11" fill="#333">1.0</text>
  <rect x="290" y="80" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1.0</text>
  <rect x="380" y="80" width="90" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="425" y="100" text-anchor="middle" font-size="11" fill="#999">0</text>

  <!-- row x=1 -->
  <rect x="60" y="112" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="85" y="132" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="110" y="112" width="110" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="165" y="132" text-anchor="middle" font-size="11" fill="#333">{0}</text>
  <rect x="220" y="112" width="70" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="132" text-anchor="middle" font-size="11" fill="#333">1.0</text>
  <rect x="290" y="112" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1/3</text>
  <rect x="380" y="112" width="90" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="425" y="132" text-anchor="middle" font-size="11" fill="#999">0</text>

  <!-- row x=2 -->
  <rect x="60" y="144" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="85" y="164" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="110" y="144" width="110" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="165" y="164" text-anchor="middle" font-size="11" fill="#333">{0, 1}</text>
  <rect x="220" y="144" width="70" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="164" text-anchor="middle" font-size="11" fill="#333">4/3</text>
  <rect x="290" y="144" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4/9</text>
  <rect x="380" y="144" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="425" y="164" text-anchor="middle" font-size="11" fill="#333">4/9</text>

  <!-- row x=3 (answer highlight) -->
  <rect x="60" y="176" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="85" y="196" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="110" y="176" width="110" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="165" y="196" text-anchor="middle" font-size="11" fill="#333">{0, 1}</text>
  <rect x="220" y="176" width="70" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="196" text-anchor="middle" font-size="11" fill="#333">4/3</text>
  <rect x="290" y="176" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4/9</text>
  <rect x="380" y="176" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">8/9</text>

  <!-- color legend -->
  <rect x="60" y="220" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="80" y="232" font-size="10" fill="#666">x &lt; k（继续抽牌，不计入 ans）</text>
  <rect x="280" y="220" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="300" y="232" font-size="10" fill="#666">x ≥ k（停止，≤ n 计入 ans）</text>

  <!-- answer box -->
  <rect x="60" y="250" width="410" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="265" y="272" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案 = dp[2] + dp[3] = 4/9 + 4/9 = 8/9 ≈ 0.889</text>
  <text x="265" y="288" text-anchor="middle" font-size="10" fill="#888">dp[4] = 1/9 是唯一的"失败"分支（4 &gt; n=3，不计入）</text>

  <!-- note -->
  <rect x="60" y="306" width="410" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="265" y="328" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：窗口只含 y &lt; k 的状态</text>
  <text x="265" y="348" text-anchor="middle" font-size="10" fill="#555">x=3 时窗口 = {0,1}，y=2 虽在 [0,2] 内但 2 ≥ k 不参与</text>
  <text x="265" y="366" text-anchor="middle" font-size="10" fill="#555">x=0,1 继续抽牌；x=2,3 停止且 ≤ n=3 → 累加得答案</text>
  <text x="265" y="380" text-anchor="middle" font-size="10" fill="#4a7a3a">手算验证：P = (1/3)(2/3)+(1/3)(1)+(1/3)(1) = 8/9 ✓</text>
</svg>
