<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：并查集用「树」维护连通分量</text>

  <!-- adjacency matrix -->
  <text x="20" y="58" font-size="11" fill="#888">isConnected：</text>
  <rect x="104" y="44" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="117" y="58" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="130" y="44" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="143" y="58" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="156" y="44" width="26" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="169" y="58" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="104" y="64" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="117" y="78" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="130" y="64" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="143" y="78" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="156" y="64" width="26" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="169" y="78" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="104" y="84" width="26" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="117" y="98" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="130" y="84" width="26" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="143" y="98" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="156" y="84" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="169" y="98" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="196" y="68" font-size="10.5" fill="#888">→ 0,1 相连；2 独立</text>

  <!-- city nodes top -->
  <text x="270" y="58" text-anchor="middle" font-size="11.5" fill="#888">城市节点（4 个）</text>
  <circle cx="300" cy="92" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <circle cx="360" cy="92" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <line x1="316" y1="92" x2="344" y2="92" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="300" cy="148" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="153" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="360" cy="148" r="16" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="360" y="153" text-anchor="middle" font-size="12" fill="#aaa" font-weight="bold">3</text>

  <!-- parent array -->
  <text x="20" y="140" font-size="11" fill="#888">parent[]：</text>
  <rect x="84" y="126" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="101" y="143" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="118" y="126" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="143" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="152" y="126" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="143" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="186" y="126" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="143" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="101" y="166" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="135" y="166" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="169" y="166" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="203" y="166" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="120" y="166" font-size="10" fill="#446688">↑ parent[1]=0</text>
  <text x="120" y="180" font-size="10" fill="#4a7a3a">↑ parent[3]=2</text>

  <!-- key idea box -->
  <rect x="30" y="200" width="480" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="223" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">每个集合是一棵树，树根 = 该集合代表</text>
  <text x="270" y="241" text-anchor="middle" font-size="11.5" fill="#555">union(i,j)：把 i 的根接到 j 的根下</text>
  <text x="270" y="255" text-anchor="middle" font-size="11.5" fill="#446688">find(i)：沿 parent 一路向上找到根</text>

  <!-- result -->
  <rect x="30" y="272" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="296" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">根的个数 = 连通分量数 = 省份数</text>

  <rect x="30" y="320" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="#444">只关心「是否同一集合」，不必建完整图</text>
</svg>
