<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1：最优路径演算</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">grid = ["@.a..","###.#","b.A.B"], k=2, full=11₂ — 红色为最优路径</text>

  <!-- ===== Grid 3x5, cell=42px, start at (80,60) ===== -->
  <!-- Row 0: y=60 -->
  <rect x="80" y="60" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="101" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">@</text>
  <circle cx="101" cy="64" r="9" fill="#b85450" stroke="#fff" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="101" y="68" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">0</text>

  <rect x="122" y="60" width="42" height="42" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="143" y="88" text-anchor="middle" font-size="13" fill="#bbb">.</text>
  <circle cx="143" cy="64" r="9" fill="#b85450" stroke="#fff" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="143" y="68" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">1</text>

  <rect x="164" y="60" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="185" y="88" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">a</text>
  <circle cx="185" cy="64" r="9" fill="#b85450" stroke="#fff" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="185" y="68" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">2</text>

  <rect x="206" y="60" width="42" height="42" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="227" y="88" text-anchor="middle" font-size="13" fill="#bbb">.</text>
  <circle cx="227" cy="64" r="9" fill="#b85450" stroke="#fff" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="227" y="68" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">3</text>

  <rect x="248" y="60" width="42" height="42" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="269" y="88" text-anchor="middle" font-size="13" fill="#bbb">.</text>

  <!-- Row 1: y=102 -->
  <rect x="80" y="102" width="42" height="42" rx="4" fill="#eee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="101" y="130" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">#</text>
  <rect x="122" y="102" width="42" height="42" rx="4" fill="#eee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="143" y="130" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">#</text>
  <rect x="164" y="102" width="42" height="42" rx="4" fill="#eee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="185" y="130" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">#</text>
  <rect x="206" y="102" width="42" height="42" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="227" y="130" text-anchor="middle" font-size="13" fill="#bbb">.</text>
  <circle cx="227" cy="106" r="9" fill="#b85450" stroke="#fff" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="227" y="110" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">4</text>
  <rect x="248" y="102" width="42" height="42" rx="4" fill="#eee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="269" y="130" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">#</text>

  <!-- Row 2: y=144 -->
  <rect x="80" y="144" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="101" y="172" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">b</text>
  <circle cx="101" cy="148" r="9" fill="#b85450" stroke="#fff" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="101" y="152" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">8</text>

  <rect x="122" y="144" width="42" height="42" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="143" y="172" text-anchor="middle" font-size="13" fill="#bbb">.</text>
  <circle cx="143" cy="148" r="9" fill="#b85450" stroke="#fff" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="143" y="152" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">7</text>

  <rect x="164" y="144" width="42" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="185" y="172" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">A</text>
  <circle cx="185" cy="148" r="9" fill="#b85450" stroke="#fff" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="185" y="152" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">6</text>

  <rect x="206" y="144" width="42" height="42" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="227" y="172" text-anchor="middle" font-size="13" fill="#bbb">.</text>
  <circle cx="227" cy="148" r="9" fill="#b85450" stroke="#fff" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="227" y="152" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">5</text>

  <rect x="248" y="144" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="269" y="172" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">B</text>

  <!-- path arrows -->
  <path d="M 122 81 L 140 81" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 164 81 L 182 81" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 206 81 L 224 81" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 227 102 L 227 120" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 227 144 L 227 162" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 206 165 L 188 165" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 164 165 L 146 165" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 122 165 L 104 165" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- grid caption -->
  <text x="101" y="206" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="143" y="206" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="185" y="206" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="227" y="206" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="269" y="206" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="60" y="88" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="60" y="130" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="60" y="172" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="48" y="130" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 48 130)">行\列</text>

  <!-- ===== Step flow ===== -->
  <rect x="30" y="222" width="500" height="138" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">逐步演算：位置 → 格子 → 钥匙掩码演化</text>

  <!-- step numbers -->
  <text x="56" y="266" font-size="10" fill="#888">步</text>
  <text x="106" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="154" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="202" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="250" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="298" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="346" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="394" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="442" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7</text>
  <text x="490" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">8</text>

  <!-- positions -->
  <text x="56" y="286" font-size="10" fill="#888">位置</text>
  <text x="106" y="286" text-anchor="middle" font-size="10" fill="#333">(0,0)</text>
  <text x="154" y="286" text-anchor="middle" font-size="10" fill="#333">(0,1)</text>
  <text x="202" y="286" text-anchor="middle" font-size="10" fill="#333">(0,2)</text>
  <text x="250" y="286" text-anchor="middle" font-size="10" fill="#333">(0,3)</text>
  <text x="298" y="286" text-anchor="middle" font-size="10" fill="#333">(1,3)</text>
  <text x="346" y="286" text-anchor="middle" font-size="10" fill="#333">(2,3)</text>
  <text x="394" y="286" text-anchor="middle" font-size="10" fill="#333">(2,2)</text>
  <text x="442" y="286" text-anchor="middle" font-size="10" fill="#333">(2,1)</text>
  <text x="490" y="286" text-anchor="middle" font-size="10" fill="#333">(2,0)</text>

  <!-- grid chars -->
  <text x="56" y="306" font-size="10" fill="#888">格子</text>
  <text x="106" y="306" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">@</text>
  <text x="154" y="306" text-anchor="middle" font-size="12" fill="#999">.</text>
  <text x="202" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">a</text>
  <text x="250" y="306" text-anchor="middle" font-size="12" fill="#999">.</text>
  <text x="298" y="306" text-anchor="middle" font-size="12" fill="#999">.</text>
  <text x="346" y="306" text-anchor="middle" font-size="12" fill="#999">.</text>
  <text x="394" y="306" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">A</text>
  <text x="442" y="306" text-anchor="middle" font-size="12" fill="#999">.</text>
  <text x="490" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">b</text>

  <!-- keys mask -->
  <text x="56" y="326" font-size="10" fill="#888">keys</text>
  <text x="106" y="326" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">00</text>
  <text x="154" y="326" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">00</text>
  <text x="202" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">01</text>
  <text x="250" y="326" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">01</text>
  <text x="298" y="326" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">01</text>
  <text x="346" y="326" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">01</text>
  <text x="394" y="326" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">01</text>
  <text x="442" y="326" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">01</text>
  <text x="490" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">11</text>

  <!-- event annotations -->
  <text x="202" y="346" text-anchor="middle" font-size="9" fill="#4a7a3a">↑拾取a</text>
  <text x="394" y="346" text-anchor="middle" font-size="9" fill="#d6a040">有a,通过A</text>
  <text x="490" y="346" text-anchor="middle" font-size="9" fill="#b85450">↑拾取b=full!</text>

  <!-- arrows between steps -->
  <path d="M 120 276 L 140 276" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 168 276 L 188 276" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 216 276 L 236 276" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 264 276 L 284 276" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 312 276 L 332 276" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 276 L 380 276" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 408 276 L 428 276" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 456 276 L 476 276" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Answer box ===== -->
  <rect x="80" y="372" width="400" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">第 8 步拾取 b → keys=11=full → 返回 8</text>
</svg>
