<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [4, -2, -3, 4, 1]，答案 = 59</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">对每个 i 算 maxCnt·nums[i] 与 minCnt·nums[i]，分别求和再相减（cnt = 左可选 · 右可选）</text>

  <!-- ===== Header row ===== -->
  <g font-size="10" fill="#444" font-weight="bold">
    <rect x="30" y="60" width="40" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="76" text-anchor="middle">i</text>
    <rect x="74" y="60" width="56" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="102" y="76" text-anchor="middle">nums[i]</text>
    <rect x="134" y="60" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="164" y="76" text-anchor="middle" fill="#b85450">maxCnt</text>
    <rect x="198" y="60" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="243" y="76" text-anchor="middle" fill="#b85450">max 贡献</text>
    <rect x="292" y="60" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="322" y="76" text-anchor="middle" fill="#4a7a3a">minCnt</text>
    <rect x="356" y="60" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="401" y="76" text-anchor="middle" fill="#4a7a3a">min 贡献</text>
    <rect x="450" y="60" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="510" y="76" text-anchor="middle" fill="#d6a040">净贡献 max−min</text>
  </g>

  <!-- ===== Data rows ===== -->
  <g font-size="10" fill="#333">
    <!-- i=0: maxCnt=1*3=3 -> 12 ; minCnt=1*1=1 -> 4 ; net=8 -->
    <rect x="30" y="88" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="104" text-anchor="middle">0</text>
    <rect x="74" y="88" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="102" y="104" text-anchor="middle" font-weight="bold">4</text>
    <rect x="134" y="88" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="164" y="104" text-anchor="middle" fill="#b85450">1·3=3</text>
    <rect x="198" y="88" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="243" y="104" text-anchor="middle" fill="#b85450">4·3=12</text>
    <rect x="292" y="88" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="322" y="104" text-anchor="middle" fill="#4a7a3a">1·1=1</text>
    <rect x="356" y="88" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="401" y="104" text-anchor="middle" fill="#4a7a3a">4·1=4</text>
    <rect x="450" y="88" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="510" y="104" text-anchor="middle" fill="#d6a040" font-weight="bold">+8</text>

    <!-- i=1: maxCnt=1*2=2 -> -4 ; minCnt=2*1=2 -> -4 ; net=0 -->
    <rect x="30" y="114" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="130" text-anchor="middle">1</text>
    <rect x="74" y="114" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="102" y="130" text-anchor="middle" font-weight="bold">-2</text>
    <rect x="134" y="114" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="164" y="130" text-anchor="middle" fill="#b85450">1·2=2</text>
    <rect x="198" y="114" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="243" y="130" text-anchor="middle" fill="#b85450">-2·2=-4</text>
    <rect x="292" y="114" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="322" y="130" text-anchor="middle" fill="#4a7a3a">2·1=2</text>
    <rect x="356" y="114" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="401" y="130" text-anchor="middle" fill="#4a7a3a">-2·2=-4</text>
    <rect x="450" y="114" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="510" y="130" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>

    <!-- i=2: maxCnt=1*1=1 -> -3 ; minCnt=3*3=9 -> -27 ; net=24 -->
    <rect x="30" y="140" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="156" text-anchor="middle">2</text>
    <rect x="74" y="140" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="102" y="156" text-anchor="middle" font-weight="bold">-3</text>
    <rect x="134" y="140" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="164" y="156" text-anchor="middle" fill="#b85450">1·1=1</text>
    <rect x="198" y="140" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="243" y="156" text-anchor="middle" fill="#b85450">-3·1=-3</text>
    <rect x="292" y="140" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="322" y="156" text-anchor="middle" fill="#4a7a3a">3·3=9</text>
    <rect x="356" y="140" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="401" y="156" text-anchor="middle" fill="#4a7a3a">-3·9=-27</text>
    <rect x="450" y="140" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="510" y="156" text-anchor="middle" fill="#d6a040" font-weight="bold">+24</text>

    <!-- i=3: maxCnt=4*2=8 -> 32 ; minCnt=1*1=1 -> 4 ; net=28 -->
    <rect x="30" y="166" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="182" text-anchor="middle">3</text>
    <rect x="74" y="166" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="102" y="182" text-anchor="middle" font-weight="bold">4</text>
    <rect x="134" y="166" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="164" y="182" text-anchor="middle" fill="#b85450">4·2=8</text>
    <rect x="198" y="166" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="243" y="182" text-anchor="middle" fill="#b85450">4·8=32</text>
    <rect x="292" y="166" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="322" y="182" text-anchor="middle" fill="#4a7a3a">1·1=1</text>
    <rect x="356" y="166" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="401" y="182" text-anchor="middle" fill="#4a7a3a">4·1=4</text>
    <rect x="450" y="166" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="510" y="182" text-anchor="middle" fill="#d6a040" font-weight="bold">+28</text>

    <!-- i=4: maxCnt=1*1=1 -> 1 ; minCnt=2*1=2 -> 2 ; net=-1 -->
    <rect x="30" y="192" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="50" y="208" text-anchor="middle">4</text>
    <rect x="74" y="192" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="102" y="208" text-anchor="middle" font-weight="bold">1</text>
    <rect x="134" y="192" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="164" y="208" text-anchor="middle" fill="#b85450">1·1=1</text>
    <rect x="198" y="192" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="243" y="208" text-anchor="middle" fill="#b85450">1·1=1</text>
    <rect x="292" y="192" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="322" y="208" text-anchor="middle" fill="#4a7a3a">2·1=2</text>
    <rect x="356" y="192" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="401" y="208" text-anchor="middle" fill="#4a7a3a">1·2=2</text>
    <rect x="450" y="192" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="510" y="208" text-anchor="middle" fill="#d6a040" font-weight="bold">-1</text>
  </g>

  <!-- ===== Totals ===== -->
  <g font-size="11" font-weight="bold">
    <rect x="30" y="226" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="150" y="244" text-anchor="middle" fill="#b85450">sumMax = 12−4−3+32+1 = 38</text>
    <text x="402" y="244" text-anchor="middle" fill="#4a7a3a">sumMin = 4−4−27+4+2 = −21</text>
  </g>

  <!-- ===== boundary notes ===== -->
  <rect x="30" y="264" width="540" height="126" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="6" filter="url(#rough2)"/>
  <text x="40" y="284" font-size="11" fill="#b85450" font-weight="bold">maxCnt = (i − 左严格更大) · (右更大或相等 − i)</text>
  <text x="48" y="300" font-size="10" fill="#555">i=0: 左−1, 右3(nums[3]=4≥4) → 1·3=3</text>
  <text x="48" y="314" font-size="10" fill="#555">i=1: 左0(4&gt;-2), 右3(4≥-2) → 1·2=2</text>
  <text x="48" y="328" font-size="10" fill="#555">i=2: 左1(-2>-3), 右3(4≥-3) → 1·1=1</text>
  <text x="48" y="342" font-size="10" fill="#555">i=3: 左−1(无严格更大), 右5 → 4·2=8</text>
  <text x="48" y="356" font-size="10" fill="#555">i=4: 左3(4>1), 右5 → 1·1=1</text>
  <text x="40" y="376" font-size="10" fill="#4a7a3a">minCnt 同理（左严格更小 / 右更小或相等），i=2: 左−1 右5 → 3·3=9</text>

  <!-- ===== Final ===== -->
  <rect x="120" y="398" width="360" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="420" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">范围和 = sumMax − sumMin = 38 − (−21) = 59</text>
</svg>
