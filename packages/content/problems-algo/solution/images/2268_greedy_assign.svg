<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">贪心：频次从高到低排序，依次填入档 1 → 档 2 → 档 3</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">高 频次 → 低 成本（按 1 次）；交换论证保证此分配最优</text>

  <!-- ===== Left: sorted frequency bars ===== -->
  <text x="180" y="72" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">各字母频次（降序排列，示意）</text>

  <!-- baseline -->
  <line x1="44" y1="300" x2="316" y2="300" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="304" text-anchor="end" font-size="9" fill="#888">0</text>

  <!-- tier divider lines -->
  <line x1="140" y1="148" x2="140" y2="305" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="230" y1="148" x2="230" y2="305" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- bars: y = 300 - h, height = h -->
  <!-- tier1 green -->
  <rect x="50" y="150" width="8" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="60" y="172" width="8" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="70" y="192" width="8" height="108" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="80" y="208" width="8" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="90" y="222" width="8" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="100" y="235" width="8" height="65" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="110" y="246" width="8" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="120" y="255" width="8" height="45" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="130" y="263" width="8" height="37" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- tier2 orange -->
  <rect x="140" y="270" width="8" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="150" y="274" width="8" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="160" y="278" width="8" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="170" y="281" width="8" height="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="180" y="284" width="8" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="190" y="287" width="8" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="200" y="289" width="8" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="210" y="291" width="8" height="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="220" y="293" width="8" height="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- tier3 red -->
  <rect x="230" y="294" width="8" height="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="240" y="295" width="8" height="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="250" y="296" width="8" height="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="260" y="297" width="8" height="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="270" y="297" width="8" height="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="280" y="298" width="8" height="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="290" y="298" width="8" height="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="300" y="298" width="8" height="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- tier group labels -->
  <rect x="50" y="313" width="88" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="94" y="327" text-anchor="middle" font-size="10.5" fill="#2f5a22" font-weight="bold">9 个 ×1</text>
  <rect x="140" y="313" width="88" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="184" y="327" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">9 个 ×2</text>
  <rect x="230" y="313" width="78" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="269" y="327" text-anchor="middle" font-size="10.5" fill="#7a2e2a" font-weight="bold">8 个 ×3</text>

  <!-- rank axis arrow -->
  <line x1="50" y1="345" x2="300" y2="345" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="358" text-anchor="middle" font-size="9.5" fill="#888">频次排名 高 → 低</text>

  <!-- ===== Right: ans formula ===== -->
  <text x="430" y="72" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">总按键次数 = 三档贡献之和</text>

  <rect x="324" y="86" width="212" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="112" text-anchor="middle" font-size="10.5" fill="#2f5a22" font-weight="bold">档1 = (前9频次和) × 1</text>

  <rect x="324" y="136" width="212" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="162" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">档2 = (中9频次和) × 2</text>

  <rect x="324" y="186" width="212" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="212" text-anchor="middle" font-size="10.5" fill="#7a2e2a" font-weight="bold">档3 = (后8频次和) × 3</text>

  <rect x="324" y="238" width="212" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="265" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">ans = 档1 + 档2 + 档3</text>

  <rect x="324" y="290" width="212" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="312" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">频次 ↑ ⟹ 成本权重 ↓</text>

  <!-- footer note -->
  <rect x="20" y="346" width="520" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="10" fill="#7a2e2a" font-weight="bold">交换论证：把高频字母从高档换到低档，总次数下降 ⟹ 高频字母必在低成本档</text>
</svg>
