<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3,2,1,2,1,7]</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">排序后 [1,1,2,2,3,7] → 唯一化 [1,2,3,4,5,7]</text>

  <!-- Table header -->
  <rect x="30" y="54" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步</text>
  <text x="105" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">原值x</text>
  <text x="160" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">prev(前)</text>
  <text x="230" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">比较</text>
  <text x="300" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">唯一值</text>
  <text x="365" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">增量</text>
  <text x="430" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">prev(后)</text>
  <text x="500" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">moves</text>

  <!-- Step 1 -->
  <rect x="30" y="80" width="500" height="26" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="97" text-anchor="middle" font-size="11" fill="#333">①</text>
  <text x="105" y="97" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="160" y="97" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="230" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a">首元素</text>
  <text x="300" y="97" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="365" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a">+0</text>
  <text x="430" y="97" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="500" y="97" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- Step 2 -->
  <rect x="30" y="108" width="500" height="26" fill="#fff8e1" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="125" text-anchor="middle" font-size="11" fill="#333">②</text>
  <text x="105" y="125" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="160" y="125" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="230" y="125" text-anchor="middle" font-size="11" fill="#b85450">x ≤ prev</text>
  <text x="300" y="125" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="365" y="125" text-anchor="middle" font-size="11" fill="#d6a040">+1</text>
  <text x="430" y="125" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="500" y="125" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- Step 3 -->
  <rect x="30" y="136" width="500" height="26" fill="#fff8e1" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="153" text-anchor="middle" font-size="11" fill="#333">③</text>
  <text x="105" y="153" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="160" y="153" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="230" y="153" text-anchor="middle" font-size="11" fill="#b85450">x ≤ prev</text>
  <text x="300" y="153" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="365" y="153" text-anchor="middle" font-size="11" fill="#d6a040">+1</text>
  <text x="430" y="153" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="500" y="153" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- Step 4 -->
  <rect x="30" y="164" width="500" height="26" fill="#fff8e1" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="181" text-anchor="middle" font-size="11" fill="#333">④</text>
  <text x="105" y="181" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="160" y="181" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="230" y="181" text-anchor="middle" font-size="11" fill="#b85450">x ≤ prev</text>
  <text x="300" y="181" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="365" y="181" text-anchor="middle" font-size="11" fill="#d6a040">+2</text>
  <text x="430" y="181" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="500" y="181" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- Step 5 -->
  <rect x="30" y="192" width="500" height="26" fill="#fff8e1" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="209" text-anchor="middle" font-size="11" fill="#333">⑤</text>
  <text x="105" y="209" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="160" y="209" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="230" y="209" text-anchor="middle" font-size="11" fill="#b85450">x ≤ prev</text>
  <text x="300" y="209" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="365" y="209" text-anchor="middle" font-size="11" fill="#d6a040">+2</text>
  <text x="430" y="209" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="500" y="209" text-anchor="middle" font-size="11" fill="#333">6</text>

  <!-- Step 6 -->
  <rect x="30" y="220" width="500" height="26" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="237" text-anchor="middle" font-size="11" fill="#333">⑥</text>
  <text x="105" y="237" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="160" y="237" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="230" y="237" text-anchor="middle" font-size="11" fill="#4a7a3a">x &gt; prev</text>
  <text x="300" y="237" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="365" y="237" text-anchor="middle" font-size="11" fill="#4a7a3a">+0</text>
  <text x="430" y="237" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="500" y="237" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <!-- Visual: sorted -> unique -->
  <text x="30" y="280" font-size="12" fill="#4a7a3a" font-weight="bold">排序后：</text>
  <rect x="100" y="288" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="307" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="144" y="288" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="307" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="188" y="288" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="307" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="232" y="288" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="307" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="276" y="288" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="307" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="320" y="288" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="307" text-anchor="middle" font-size="11" fill="#333">7</text>

  <!-- Down arrow -->
  <path d="M 230 320 L 230 338" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="334" font-size="11" fill="#d6a040" font-weight="bold">贪心顶升</text>

  <text x="30" y="356" font-size="12" fill="#4a7a3a" font-weight="bold">唯一化：</text>
  <rect x="100" y="364" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="383" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="144" y="364" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="383" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="188" y="364" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="383" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="232" y="364" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="383" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="276" y="364" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="383" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="320" y="364" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="383" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>

  <!-- Result -->
  <rect x="380" y="364" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="383" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">moves = 6 ✅</text>
</svg>
