<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2,2,3,4]（已排序）</text>

  <!-- sorted array at top -->
  <text x="20" y="56" font-size="12" fill="#888">nums：</text>
  <rect x="120" y="42" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="166" y="42" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="188" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="212" y="42" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="234" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="258" y="42" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="142" y="84" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="188" y="84" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="234" y="84" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="280" y="84" text-anchor="middle" font-size="9" fill="#aaa">3</text>

  <!-- table headers -->
  <text x="20" y="112" font-size="10.5" fill="#888" font-weight="bold">步</text>
  <text x="56" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">k</text>
  <text x="96" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">nums[k]</text>
  <text x="170" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">left</text>
  <text x="220" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">right</text>
  <text x="310" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">nums[l]+nums[r]</text>
  <text x="430" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">动作</text>
  <text x="560" y="112" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">计数</text>
  <line x1="10" y1="120" x2="590" y2="120" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: k=3, left=0, right=2, 2+3=5>4, count+=2, right-- -->
  <text x="20" y="142" font-size="11" fill="#333">1</text>
  <text x="56" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="96" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="170" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0(2)</text>
  <text x="220" y="142" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2(3)</text>
  <rect x="280" y="130" width="60" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="310" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5 &gt; 4 ✓</text>
  <text x="430" y="142" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">right−−</text>
  <text x="560" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+2</text>

  <!-- Row 2: k=3, left=0, right=1, 2+2=4<=4, left++ -->
  <text x="20" y="166" font-size="11" fill="#333">2</text>
  <text x="56" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="96" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="170" y="166" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0(2)</text>
  <text x="220" y="166" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1(2)</text>
  <text x="310" y="166" text-anchor="middle" font-size="11" fill="#333">4 ≤ 4 ✗</text>
  <text x="430" y="166" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">left++</text>
  <text x="560" y="166" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 3: k=3, left=1, right=1, left>=right, end -->
  <text x="20" y="190" font-size="11" fill="#333">3</text>
  <text x="56" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="96" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="170" y="190" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1(2)</text>
  <text x="220" y="190" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1(2)</text>
  <text x="310" y="190" text-anchor="middle" font-size="10.5" fill="#888">left ≥ right</text>
  <text x="430" y="190" text-anchor="middle" font-size="10.5" fill="#888">k 轮结束</text>
  <text x="560" y="190" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <line x1="10" y1="204" x2="590" y2="204" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Row 4: k=2, left=0, right=1, 2+2=4>3, count+=1, right-- -->
  <text x="20" y="228" font-size="11" fill="#333">4</text>
  <text x="56" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="96" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="170" y="228" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0(2)</text>
  <text x="220" y="228" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1(2)</text>
  <rect x="280" y="216" width="60" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="310" y="229" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4 &gt; 3 ✓</text>
  <text x="430" y="228" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">right−−</text>
  <text x="560" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- Row 5: k=2, left=0, right=0, left>=right, end -->
  <text x="20" y="252" font-size="11" fill="#333">5</text>
  <text x="56" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="96" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="170" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0(2)</text>
  <text x="220" y="252" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0(2)</text>
  <text x="310" y="252" text-anchor="middle" font-size="10.5" fill="#888">left ≥ right</text>
  <text x="430" y="252" text-anchor="middle" font-size="10.5" fill="#888">k 轮结束</text>
  <text x="560" y="252" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <line x1="10" y1="266" x2="590" y2="266" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="80" y="282" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="304" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">count = 2 + 1 = 3 ✓  有效组合：(2,2,3),(2,3,4),(2,3,4)</text>

  <!-- legend -->
  <text x="20" y="346" font-size="11" fill="#888" font-weight="bold">图例：</text>
  <rect x="70" y="336" width="18" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="94" y="348" font-size="10.5" fill="#444">left（较小边 a）</text>
  <rect x="180" y="336" width="18" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="204" y="348" font-size="10.5" fill="#444">right（较大边 b）</text>
  <rect x="300" y="336" width="18" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="324" y="348" font-size="10.5" fill="#444">k（最大边 c）</text>
  <rect x="400" y="336" width="18" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="424" y="348" font-size="10.5" fill="#4a7a3a" font-weight="bold">a+b &gt; c</text>

  <!-- footer note: step 1 detail -->
  <rect x="40" y="370" width="520" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="390" text-anchor="middle" font-size="11.5" fill="#444">步骤 1：left=0(2) + right=2(3) = 5 &gt; 4，故 left 从 0 到 1 都配 right=2 合法</text>
  <text x="300" y="408" text-anchor="middle" font-size="11" fill="#888">即 (2,3,4) 和 (2,3,4) 两种组合 → 一次性计数 right−left = 2−0 = 2</text>

  <rect x="40" y="422" width="520" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="444" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">计数型双指针：找到 a+b&gt;c 后按区间长度计数，而非逐组记录</text>
</svg>
