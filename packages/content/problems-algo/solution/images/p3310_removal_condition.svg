<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">删除资格：只看「圈外 → 圈内」的边</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">一条入侵边就否决整组；圈内 → 圈外、圈内互调都拦不住删除</text>

  <!-- 行 1：外部 → 内部 -->
  <text x="137" y="90" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">圈外 → 圈内</text>
  <path d="M 106 108 L 170 108" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <circle cx="88" cy="108" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="113" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="188" cy="108" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="188" y="113" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 240 100 L 252 112 M 252 100 L 240 112" stroke="#b85450" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <rect x="262" y="90" width="240" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="382" y="106" text-anchor="middle" font-size="10.5" fill="#7a3530" font-weight="bold" filter="url(#rough2)">否决！外部还在调用圈内方法</text>
  <text x="382" y="121" text-anchor="middle" font-size="9.5" fill="#7a3530" filter="url(#rough2)">整组一个都不能删（示例 1 的 0→1、3→2）</text>

  <!-- 行 2：内部 → 外部 -->
  <text x="137" y="170" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">圈内 → 圈外</text>
  <path d="M 106 188 L 170 188" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <circle cx="88" cy="188" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="193" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="188" cy="188" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="188" y="193" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 240 186 l 4.5 5.5 L 255 179" stroke="#4a7a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#rough2)"/>
  <rect x="262" y="170" width="240" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="382" y="186" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">无碍：删掉圈内方法，圈外照常运行</text>
  <text x="382" y="201" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">外部方法只是少了一个调用者而已（方向别搞反）</text>

  <!-- 行 3：内部互调成环 -->
  <text x="138" y="230" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">圈内互调（成环）</text>
  <path d="M 98 255 Q 138 236 178 255" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 178 281 Q 138 300 98 281" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <circle cx="88" cy="268" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="273" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="188" cy="268" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="188" y="273" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 240 266 l 4.5 5.5 L 255 259" stroke="#4a7a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#rough2)"/>
  <rect x="262" y="250" width="240" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="382" y="266" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">无碍：整组一起删，组内调用随之蒸发</text>
  <text x="382" y="281" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">示例 3 成环 0→1→2→0，照样全删返回 [ ]</text>

  <!-- 底部结论 -->
  <rect x="34" y="300" width="452" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">一句话判定：线性扫一遍 invocations，发现任意 a∉S 且 b∈S ⇒ 返回 [0..n−1]</text>
  <text x="260" y="337" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">没有一条入侵边 ⇒ 删光 S，返回所有非可疑方法</text>
</svg>
