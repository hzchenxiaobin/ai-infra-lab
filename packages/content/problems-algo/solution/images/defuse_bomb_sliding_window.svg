<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fdfcf7"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">拆炸弹：滑动窗口转移（k &gt; 0）</text>
  <path d="M 240 42 Q 360 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="360" y="66" text-anchor="middle" font-size="12" fill="#666">把环「展开」成双倍数组，窗口右移一格：滑出一格、滑入一格</text>

  <!-- doubled array: [5,7,1,4,5,7,1,4], 8 cells width 56, start x=104 -->
  <!-- ===== Row 1: window at i=0 ===== -->
  <text x="74" y="120" text-anchor="end" font-size="13" font-weight="bold" fill="#2b6e9e">i=0</text>
  <text x="74" y="136" text-anchor="end" font-size="10" fill="#888">窗口</text>

  <!-- index 0: anchor 5 (blue) -->
  <g filter="url(#sk2)"><rect x="104" y="100" width="56" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="132" y="128" text-anchor="middle" font-size="15" fill="#2b4a6a" font-weight="bold">5</text>
  <text x="132" y="160" text-anchor="middle" font-size="10" fill="#666">0</text>

  <!-- index 1: 7 (window green) - will slide OUT -->
  <g filter="url(#sk2)"><rect x="168" y="100" width="56" height="44" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="196" y="128" text-anchor="middle" font-size="15" fill="#2e5e2e" font-weight="bold">7</text>
  <text x="196" y="160" text-anchor="middle" font-size="10" fill="#666">1</text>
  <text x="196" y="88" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">滑出 ↓</text>

  <!-- index 2: 1 (window) -->
  <g filter="url(#sk2)"><rect x="232" y="100" width="56" height="44" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="260" y="128" text-anchor="middle" font-size="15" fill="#2e5e2e" font-weight="bold">1</text>
  <text x="260" y="160" text-anchor="middle" font-size="10" fill="#666">2</text>

  <!-- index 3: 4 (window) -->
  <g filter="url(#sk2)"><rect x="296" y="100" width="56" height="44" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="324" y="128" text-anchor="middle" font-size="15" fill="#2e5e2e" font-weight="bold">4</text>
  <text x="324" y="160" text-anchor="middle" font-size="10" fill="#666">3</text>

  <!-- index 4: 5 (=code[0], will slide IN) -->
  <g filter="url(#sk2)"><rect x="360" y="100" width="56" height="44" rx="5" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 2"/></g>
  <text x="388" y="128" text-anchor="middle" font-size="15" fill="#888">5</text>
  <text x="388" y="160" text-anchor="middle" font-size="10" fill="#999">4(=0)</text>
  <text x="388" y="88" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">滑入 ↓</text>

  <!-- index 5: 7 -->
  <g filter="url(#sk2)"><rect x="424" y="100" width="56" height="44" rx="5" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="452" y="128" text-anchor="middle" font-size="15" fill="#888">7</text>
  <text x="452" y="160" text-anchor="middle" font-size="10" fill="#999">5(=1)</text>

  <!-- index 6: 1 -->
  <g filter="url(#sk2)"><rect x="488" y="100" width="56" height="44" rx="5" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="516" y="128" text-anchor="middle" font-size="15" fill="#888">1</text>
  <text x="516" y="160" text-anchor="middle" font-size="10" fill="#999">6(=2)</text>

  <!-- index 7: 4 -->
  <g filter="url(#sk2)"><rect x="552" y="100" width="56" height="44" rx="5" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="580" y="128" text-anchor="middle" font-size="15" fill="#888">4</text>
  <text x="580" y="160" text-anchor="middle" font-size="10" fill="#999">7(=3)</text>

  <!-- window bracket row1 -->
  <path d="M 168 174 L 168 180 L 352 180 L 352 174" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="260" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">res[0] = 7+1+4 = 12</text>

  <!-- transition arrow -->
  <path d="M 360 210 L 360 236" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="372" y="228" font-size="11" fill="#3a3a3a">s = s − code[1] + code[(1+3)%4]</text>

  <!-- ===== Row 2: window at i=1 ===== -->
  <text x="74" y="266" text-anchor="end" font-size="13" font-weight="bold" fill="#2b6e9e">i=1</text>
  <text x="74" y="282" text-anchor="end" font-size="10" fill="#888">窗口</text>

  <!-- index 0: 5 (now gray, left behind) -->
  <g filter="url(#sk2)"><rect x="104" y="246" width="56" height="44" rx="5" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="132" y="274" text-anchor="middle" font-size="15" fill="#888">5</text>
  <text x="132" y="306" text-anchor="middle" font-size="10" fill="#999">0</text>

  <!-- index 1: 7 (anchor blue now) -->
  <g filter="url(#sk2)"><rect x="168" y="246" width="56" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="196" y="274" text-anchor="middle" font-size="15" fill="#2b4a6a" font-weight="bold">7</text>
  <text x="196" y="306" text-anchor="middle" font-size="10" fill="#666">1</text>

  <!-- index 2: 1 (window) -->
  <g filter="url(#sk2)"><rect x="232" y="246" width="56" height="44" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="260" y="274" text-anchor="middle" font-size="15" fill="#2e5e2e" font-weight="bold">1</text>
  <text x="260" y="306" text-anchor="middle" font-size="10" fill="#666">2</text>

  <!-- index 3: 4 (window) -->
  <g filter="url(#sk2)"><rect x="296" y="246" width="56" height="44" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="324" y="274" text-anchor="middle" font-size="15" fill="#2e5e2e" font-weight="bold">4</text>
  <text x="324" y="306" text-anchor="middle" font-size="10" fill="#666">3</text>

  <!-- index 4: 5 (window, just slid in) -->
  <g filter="url(#sk2)"><rect x="360" y="246" width="56" height="44" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="388" y="274" text-anchor="middle" font-size="15" fill="#2e5e2e" font-weight="bold">5</text>
  <text x="388" y="306" text-anchor="middle" font-size="10" fill="#666">4(=0)</text>

  <!-- index 5..7 gray -->
  <g filter="url(#sk2)"><rect x="424" y="246" width="56" height="44" rx="5" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="452" y="274" text-anchor="middle" font-size="15" fill="#888">7</text>
  <text x="452" y="306" text-anchor="middle" font-size="10" fill="#999">5(=1)</text>
  <g filter="url(#sk2)"><rect x="488" y="246" width="56" height="44" rx="5" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="516" y="274" text-anchor="middle" font-size="15" fill="#888">1</text>
  <text x="516" y="306" text-anchor="middle" font-size="10" fill="#999">6(=2)</text>
  <g filter="url(#sk2)"><rect x="552" y="246" width="56" height="44" rx="5" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="580" y="274" text-anchor="middle" font-size="15" fill="#888">4</text>
  <text x="580" y="306" text-anchor="middle" font-size="10" fill="#999">7(=3)</text>

  <!-- window bracket row2 -->
  <path d="M 232 320 L 232 326 L 416 326 L 416 320" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="324" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">res[1] = 1+4+5 = 10</text>

  <text x="360" y="368" text-anchor="middle" font-size="10" fill="#999">窗口整体右移一格：左边 code[i] 滑出，右边 code[(i+k)%n] 滑入，O(1) 维护窗口和</text>
</svg>
