<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">同 x 的点怎么防串链？—— 排序顺序里的机关</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">以点集 {(1,2), (1,1), (2,1)} 为例：真实最长链 = 1（任何两点都无法双递增）</text>

  <!-- 左：错误做法 -->
  <rect x="28" y="60" width="228" height="196" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="142" y="82" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 错误：x 升序 + 同 x 的 y 升序</text>

  <rect x="44" y="96" width="60" height="30" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="74" y="115" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(1,1)</text>
  <rect x="112" y="96" width="60" height="30" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="142" y="115" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(1,2)</text>
  <rect x="180" y="96" width="60" height="30" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="115" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(2,1)</text>

  <text x="142" y="146" text-anchor="middle" font-size="10.5" fill="#8a4a48" filter="url(#rough2)">y 序列 = [ 1, 2, 1 ]</text>

  <!-- 圈出被 LIS 串中的 1,2 -->
  <ellipse cx="108" cy="142" rx="34" ry="13" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="142" y="172" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">LIS 选中 [1, 2] → 链 (1,1)→(1,2)</text>
  <text x="142" y="190" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">但两者的 x 都等于 1，没有严格递增！</text>
  <text x="142" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">非法链 → 答案虚高成 2</text>
  <path d="M 142 224 L 142 236" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="142" y="250" text-anchor="middle" font-size="10" fill="#8a4a48" filter="url(#rough2)">同 x 点被 y 升序「串」进一条链</text>

  <!-- 右：正确做法 -->
  <rect x="264" y="60" width="228" height="196" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="378" y="82" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 正确：x 升序 + 同 x 的 y 降序</text>

  <rect x="280" y="96" width="60" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="310" y="115" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(1,2)</text>
  <rect x="348" y="96" width="60" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="378" y="115" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(1,1)</text>
  <rect x="416" y="96" width="60" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="446" y="115" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(2,1)</text>

  <text x="378" y="146" text-anchor="middle" font-size="10.5" fill="#3a5f30" filter="url(#rough2)">y 序列 = [ 2, 1, 1 ]</text>

  <!-- 同 x 的两点 y 递减，被隔离 -->
  <path d="M 288 158 L 442 158" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="378" y="154" text-anchor="middle" font-size="9.5" fill="#3a5f30" filter="url(#rough2)">同 x=1：y 从 2 递减到 1</text>

  <text x="378" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">严格上升子序列至多从中选 1 个</text>
  <text x="378" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">LIS = [2] 或 [1]，长度 1</text>
  <text x="378" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合法 → 正确答案 1</text>
  <path d="M 378 230 L 378 242" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="378" y="256" text-anchor="middle" font-size="10" fill="#3a5f30" filter="url(#rough2)">降序排列「物理隔离」了同 x 点</text>

  <!-- 底部结论 -->
  <rect x="40" y="276" width="440" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">一句话：让同 x 的点在 y 序列里「自己打自己」</text>
  <text x="260" y="320" text-anchor="middle" font-size="10" fill="#2c4a66" filter="url(#rough2)">降序使它们互相「堵路」，无需任何额外判断，排序顺序本身就完成去重约束</text>
  <text x="260" y="336" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">同款技巧出自 354 俄罗斯套娃信封问题</text>
</svg>
