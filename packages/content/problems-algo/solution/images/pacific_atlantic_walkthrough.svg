<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：5×5 矩阵的 P 集合、A 集合与交集</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">蓝=仅太平洋可达｜橙=仅大西洋可达｜绿=两者皆可达（即答案）</text>

  <!-- Pacific ocean strips -->
  <g filter="url(#rough2)">
    <rect x="116" y="64" width="280" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="256" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">太平洋</text>
    <rect x="100" y="80" width="16" height="280" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="108" y="220" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" transform="rotate(-90 108 220)">太平洋</text>

    <!-- Atlantic ocean strips -->
    <rect x="116" y="360" width="280" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="256" y="372" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">大西洋</text>
    <rect x="396" y="80" width="16" height="280" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="404" y="220" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" transform="rotate(-90 404 220)">大西洋</text>
  </g>

  <!-- 5x5 grid: x start 118, y start 80, cell 56x56 -->
  <g filter="url(#rough2)" font-size="15" font-weight="bold">
    <!-- row0: P P P P BOTH -->
    <rect x="118" y="80" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="146" y="115" text-anchor="middle" fill="#446688">1</text>
    <rect x="174" y="80" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="202" y="115" text-anchor="middle" fill="#446688">2</text>
    <rect x="230" y="80" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="258" y="115" text-anchor="middle" fill="#446688">2</text>
    <rect x="286" y="80" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="314" y="115" text-anchor="middle" fill="#446688">3</text>
    <rect x="342" y="80" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="3"/><text x="370" y="115" text-anchor="middle" fill="#4a7a3a">5</text>
    <!-- row1: P P P BOTH BOTH -->
    <rect x="118" y="136" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="146" y="171" text-anchor="middle" fill="#446688">3</text>
    <rect x="174" y="136" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="202" y="171" text-anchor="middle" fill="#446688">2</text>
    <rect x="230" y="136" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="258" y="171" text-anchor="middle" fill="#446688">3</text>
    <rect x="286" y="136" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="3"/><text x="314" y="171" text-anchor="middle" fill="#4a7a3a">4</text>
    <rect x="342" y="136" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="3"/><text x="370" y="171" text-anchor="middle" fill="#4a7a3a">4</text>
    <!-- row2: P P BOTH A A -->
    <rect x="118" y="192" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="146" y="227" text-anchor="middle" fill="#446688">2</text>
    <rect x="174" y="192" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="202" y="227" text-anchor="middle" fill="#446688">4</text>
    <rect x="230" y="192" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="3"/><text x="258" y="227" text-anchor="middle" fill="#4a7a3a">5</text>
    <rect x="286" y="192" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="314" y="227" text-anchor="middle" fill="#d6a040">3</text>
    <rect x="342" y="192" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="370" y="227" text-anchor="middle" fill="#d6a040">1</text>
    <!-- row3: BOTH BOTH A A A -->
    <rect x="118" y="248" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="3"/><text x="146" y="283" text-anchor="middle" fill="#4a7a3a">6</text>
    <rect x="174" y="248" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="3"/><text x="202" y="283" text-anchor="middle" fill="#4a7a3a">7</text>
    <rect x="230" y="248" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="258" y="283" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="286" y="248" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="314" y="283" text-anchor="middle" fill="#d6a040">4</text>
    <rect x="342" y="248" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="370" y="283" text-anchor="middle" fill="#d6a040">5</text>
    <!-- row4: BOTH A A A A -->
    <rect x="118" y="304" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="3"/><text x="146" y="339" text-anchor="middle" fill="#4a7a3a">5</text>
    <rect x="174" y="304" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="202" y="339" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="230" y="304" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="258" y="339" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="286" y="304" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="314" y="339" text-anchor="middle" fill="#d6a040">2</text>
    <rect x="342" y="304" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/><text x="370" y="339" text-anchor="middle" fill="#d6a040">4</text>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="50" y="400" width="20" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2"/>
    <text x="76" y="412" fill="#666">仅 P（9 格）</text>
    <rect x="170" y="400" width="20" height="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2"/>
    <text x="196" y="412" fill="#666">仅 A（9 格）</text>
    <rect x="290" y="400" width="20" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2"/>
    <text x="316" y="412" fill="#666">P ∩ A = 答案（7 格）</text>
    <text x="280" y="430" text-anchor="middle" font-size="10" fill="#888">答案 = [(0,4),(1,3),(1,4),(2,2),(3,0),(3,1),(4,0)]</text>
  </g>
</svg>
