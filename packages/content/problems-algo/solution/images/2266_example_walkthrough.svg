<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：pressedKeys = "22233"</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">段1 "222"（键2=abc，3字母）× 段2 "33"（键3=def，3字母）</text>

  <!-- ===== Run 1: "222" ===== -->
  <text x="30" y="78" font-size="11.5" fill="#446688" font-weight="bold">段1 "222" → f(3) = 4 种</text>

  <!-- header: dp values for run1 -->
  <g font-size="10" fill="#888">
    <text x="40" y="98">L</text>
    <text x="90" y="98">f(L)</text>
    <text x="160" y="98">含义</text>
  </g>
  <g font-size="11">
    <rect x="36" y="104" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="56" y="118" text-anchor="middle" fill="#333">0</text>
    <rect x="86" y="104" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="106" y="118" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <text x="136" y="118" fill="#888" font-size="9.5">空段种子</text>

    <rect x="36" y="126" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="56" y="140" text-anchor="middle" fill="#333">1</text>
    <rect x="86" y="126" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="106" y="140" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <text x="136" y="140" fill="#888" font-size="9.5">"a"</text>

    <rect x="36" y="148" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="56" y="162" text-anchor="middle" fill="#333">2</text>
    <rect x="86" y="148" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="106" y="162" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <text x="136" y="162" fill="#888" font-size="9.5">"aa","b"</text>

    <rect x="36" y="170" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="56" y="184" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="86" y="170" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="106" y="184" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <text x="136" y="184" fill="#b85450" font-size="9.5" font-weight="bold">=1+2+1? → 1+1+2</text>
  </g>
  <text x="300" y="118" font-size="9.5" fill="#666">f(3)=f(2)+f(1)+f(0)=2+1+1=4</text>

  <!-- explicit decodings run1 -->
  <text x="290" y="138" font-size="9.5" fill="#888">具体解码（按次数切分）：</text>
  <g font-size="10">
    <rect x="290" y="144" width="74" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="327" y="157" text-anchor="middle" fill="#333">2|2|2 → aaa</text>
    <rect x="368" y="144" width="66" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="401" y="157" text-anchor="middle" fill="#333">2|22 → ab</text>
    <rect x="438" y="144" width="66" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="471" y="157" text-anchor="middle" fill="#333">22|2 → ba</text>
    <rect x="290" y="166" width="60" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="320" y="179" text-anchor="middle" fill="#333">222 → c</text>
  </g>

  <!-- ===== Run 2: "33" ===== -->
  <line x1="20" y1="200" x2="540" y2="200" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="30" y="226" font-size="11.5" fill="#4a7a3a" font-weight="bold">段2 "33" → f(2) = 2 种</text>

  <g font-size="11">
    <rect x="36" y="236" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="56" y="250" text-anchor="middle" fill="#333">1</text>
    <rect x="86" y="236" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="106" y="250" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <text x="136" y="250" fill="#888" font-size="9.5">"d"</text>

    <rect x="36" y="258" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="56" y="272" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="86" y="258" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="106" y="272" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="136" y="272" fill="#b85450" font-size="9.5" font-weight="bold">f(2)=f(1)+f(0)=1+1=2</text>
  </g>
  <text x="290" y="250" font-size="9.5" fill="#888">具体解码：</text>
  <g font-size="10">
    <rect x="290" y="236" width="60" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="320" y="249" text-anchor="middle" fill="#333">3|3 → dd</text>
    <rect x="356" y="236" width="56" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="384" y="249" text-anchor="middle" fill="#333">33 → e</text>
  </g>

  <!-- ===== Multiply ===== -->
  <line x1="20" y1="290" x2="540" y2="290" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="30" y="316" font-size="11.5" fill="#b85450" font-weight="bold">总方案 = 段1 × 段2 = 4 × 2 = 8</text>

  <!-- 8 combinations grid -->
  <text x="30" y="338" font-size="9.5" fill="#888">8 种完整信息（段1解码 × 段2解码）：</text>
  <g font-size="10" fill="#333">
    <rect x="36" y="346" width="120" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="96" y="360" text-anchor="middle">aaa|dd → aaadd</text>
    <rect x="162" y="346" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="212" y="360" text-anchor="middle">ab|dd → abdd</text>
    <rect x="268" y="346" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="318" y="360" text-anchor="middle">ba|dd → badd</text>
    <rect x="374" y="346" width="90" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="419" y="360" text-anchor="middle">c|dd → cdd</text>

    <rect x="36" y="370" width="120" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="96" y="384" text-anchor="middle">aaa|e → aaae</text>
    <rect x="162" y="370" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="212" y="384" text-anchor="middle">ab|e → abe</text>
    <rect x="268" y="370" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="318" y="384" text-anchor="middle">ba|e → bae</text>
    <rect x="374" y="370" width="90" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="419" y="384" text-anchor="middle">c|e → ce</text>
  </g>

  <!-- footer -->
  <rect x="40" y="402" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">跨段无歧义 → 相乘；段内按“最后字母占几次”做爬楼梯递推</text>
</svg>
