<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">核心观察：末位一次取模先过滤，首位反复 ÷10 再验证</text>

  <!-- nums 数组 -->
  <text x="52" y="61" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">nums =</text>
  <g stroke-width="1.6" filter="url(#rough2)">
    <rect x="62" y="40" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="116" y="40" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="170" y="40" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="84" y="61">1</text>
    <text x="138" y="61">100</text>
    <text x="192" y="61">1</text>
  </g>
  <rect x="56" y="34" width="108" height="44" rx="6" fill="none" stroke="#b85450"
        stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <g font-size="10" text-anchor="middle" filter="url(#rough2)">
    <text x="84" y="92" fill="#b85450">l=0</text>
    <text x="138" y="92" fill="#b85450">r=1</text>
    <text x="196" y="92" fill="#666">r 右移 →</text>
  </g>

  <!-- 增量和说明 -->
  <g filter="url(#rough2)">
    <text x="62" y="114" font-size="11" fill="#666">固定 l = 0，r 每右移一步，s 只加一个数：</text>
    <text x="62" y="132" font-size="11.5" fill="#4a7a3a">r=0：s=1 ✓　r=1：s=101 ✓（首末位均为 1，计入）</text>
    <text x="62" y="150" font-size="11.5" fill="#b85450">r=2：s=102 ✗（末位 2 ≠ 1，一次取模即淘汰）</text>
  </g>

  <!-- 101 数字解剖 -->
  <text x="196" y="188" text-anchor="end" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">s = 101</text>
  <g filter="url(#rough2)">
    <text x="226" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040">首位=1</text>
    <text x="322" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688">末位=1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="206" y="162" width="40" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="254" y="162" width="40" height="44" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
    <rect x="302" y="162" width="40" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="226" y="190">1</text>
    <text x="274" y="190">0</text>
    <text x="322" y="190">1</text>
  </g>
  <rect x="368" y="168" width="58" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="397" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">x = 1</text>

  <path d="M 276 206 L 276 218" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="220" width="250" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="275" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">首末位都等于 x → 有效子数组！</text>

  <!-- 两级检查面板 -->
  <rect x="30" y="254" width="225" height="68" rx="8" fill="#e8f0fe" fill-opacity="0.55"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="265" y="254" width="225" height="68" rx="8" fill="#fff8e1" fill-opacity="0.6"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="12" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="142" y="274" fill="#446688">末位：s % 10 == x</text>
    <text x="377" y="274" fill="#d6a040">首位：反复 ÷10</text>
  </g>
  <g font-size="10.5" fill="#333" filter="url(#rough2)">
    <text x="42" y="294">一次取模 O(1)，条件写在最前面</text>
    <text x="42" y="310">末位近似均匀 → ~90% 在此被滤掉</text>
    <text x="277" y="294">while (t ≥ 10) t /= 10，至多 13 次</text>
    <text x="277" y="310">只在末位过关后才执行</text>
  </g>

  <!-- 溢出提醒 -->
  <rect x="50" y="330" width="420" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="260" y="343" font-size="10.5" fill="#b85450">最大和 1500 × 10^9 = 1.5 × 10^12，超出 int → C++ 用 long long</text>
    <text x="260" y="353" font-size="10" fill="#666">元素全 ≥ 1 ⇒ 和恒正，无需处理 0 / 负数边界</text>
  </g>
</svg>
