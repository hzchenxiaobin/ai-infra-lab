<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：每人 1 票，投多人则均分</text>

  <rect x="80" y="44" width="400" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每票权重 = 1 / 该选民投出的候选人数</text>

  <line x1="290" y1="92" x2="290" y2="240" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="72" y="96" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Charles（投3人）</text>

  <rect x="20" y="200" width="68" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ryan</text>
  <rect x="98" y="200" width="68" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Christine</text>
  <rect x="176" y="200" width="68" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Kathy</text>

  <path d="M 110 124 Q 60 160 54 200" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 132 124 L 132 200" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 154 124 Q 200 160 210 200" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="68" y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1/3</text>
  <text x="148" y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1/3</text>
  <text x="228" y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1/3</text>

  <rect x="360" y="96" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Anthony（投1人）</text>

  <rect x="386" y="200" width="68" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ryan</text>

  <path d="M 420 124 L 420 200" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="165" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="100" y="270" width="360" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">Kathy、Terry 弃权（candidate = NULL）</text>
  <text x="280" y="305" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">→ 0 票，WHERE candidate IS NOT NULL 过滤掉</text>
</svg>
