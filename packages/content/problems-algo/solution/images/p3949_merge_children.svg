<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 448"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="560" height="448" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">II 版新约束：不同分支的反转节点也要相距 ≥ k</text>
  <text x="168" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">合并孩子档案时的距离核算（例：a = 2, b = 1）</text>

  <!-- 高亮路径：x → p → c1 → u → c2 → y -->
  <path d="M90,308 L90,242" stroke="#d6a040" stroke-width="3.5" fill="none" filter="url(#rough2)"/>
  <path d="M90,242 L90,172" stroke="#d6a040" stroke-width="3.5" fill="none" filter="url(#rough2)"/>
  <path d="M90,172 L175,98" stroke="#d6a040" stroke-width="3.5" fill="none" filter="url(#rough2)"/>
  <path d="M175,98 L262,172" stroke="#d6a040" stroke-width="3.5" fill="none" filter="url(#rough2)"/>
  <path d="M262,172 L262,240" stroke="#d6a040" stroke-width="3.5" fill="none" filter="url(#rough2)"/>

  <!-- 树的其余边 -->
  <path d="M262,240 L330,290" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- 反转节点：红色虚线圈 -->
  <circle cx="90" cy="308" r="21" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="262" cy="240" r="21" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="118" y="335" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">反转 x</text>
  <text x="290" y="240" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">反转 y</text>

  <!-- 树的节点 -->
  <circle cx="175" cy="98" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">u</text>
  <circle cx="90" cy="172" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c1</text>
  <circle cx="262" cy="172" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="262" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c2</text>
  <circle cx="90" cy="242" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="246" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">·</text>
  <circle cx="90" cy="308" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="313" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x</text>
  <circle cx="262" cy="240" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="262" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">y</text>
  <circle cx="334" cy="292" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="334" y="296" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">·</text>

  <!-- 路径边长标注 -->
  <text x="103" y="282" font-size="10" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="103" y="212" font-size="10" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="118" y="130" font-size="10" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="228" y="130" font-size="10" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="275" y="212" font-size="10" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="38" y="250" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">a = 2</text>
  <text x="240" y="222" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">b = 1</text>

  <!-- 距离公式 -->
  <text x="168" y="362" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">dist(x, y) = a + b + 2 = 5 ≥ k</text>
  <text x="168" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">⟹ 档位约束：d1 + d2 ≥ K = k − 2</text>

  <!-- 右上：双档案说明框 -->
  <rect x="352" y="58" width="194" height="124" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="449" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">mx / mn 双档案</text>
  <text x="449" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">反转 u ⟹ 子树和整体取反</text>
  <text x="449" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">反转后最大 = −(反转前最小)</text>
  <text x="449" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">≈ 前作的奇偶位 p：</text>
  <text x="449" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">mx ↔ p = 0，−mn ↔ p = 1</text>
  <text x="449" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">父亲从档案里挑档位 d</text>

  <!-- 右下：至多一个孩子贴底 -->
  <rect x="352" y="196" width="194" height="140" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="449" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">至多一个孩子贴底</text>
  <text x="449" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">两档均 &lt; L = ⌈K/2⌉ 时</text>
  <text x="449" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d1 + d2 ≤ 2L − 2 &lt; K 必冲突</text>
  <text x="449" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⟹ 全员 max(b, L) 档</text>
  <text x="449" y="294" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">或：一个特殊孩子 s ∈ [b, L)</text>
  <text x="449" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">其余孩子抬到 K − s 档</text>
  <text x="449" y="330" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">（b = 父亲档位下传的底限）</text>

  <!-- 底部：组装公式 -->
  <rect x="46" y="396" width="488" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="290" y="414" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">组装：mx[u][0] = max( nums[u] + F(0), −nums[u] − Σ mn[c][k−1] )</text>
  <text x="290" y="432" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">mx[u][d≥1] = nums[u] + F(d−1)；根的答案 = mx[0][0]</text>
</svg>
