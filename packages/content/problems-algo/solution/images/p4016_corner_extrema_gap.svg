<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="310" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：不重叠 ⟺ 角点极值差 ≥ k</text>
    <text x="310" y="42" text-anchor="middle" font-size="10.5" fill="#888">示例 1（m=3, n=4, k=2）：合法角点 {(0,0), (0,1), (1,2)}，取列极值对即不重叠</text>

    <text x="60" y="62" text-anchor="start" font-size="9" fill="#446688" font-weight="bold">mat（绿格 = 1 可用，红格 = 0 不可用）</text>

    <!-- grid cells: 4 cols x 3 rows, cell 44 -->
    <rect x="60" y="78" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="82" y="105" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">1</text>
    <rect x="104" y="78" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="126" y="105" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">1</text>
    <rect x="148" y="78" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="170" y="105" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">1</text>
    <rect x="192" y="78" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="214" y="105" text-anchor="middle" font-size="13" fill="#7a3a36" font-weight="bold">0</text>

    <rect x="60" y="122" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="82" y="149" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">1</text>
    <rect x="104" y="122" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="126" y="149" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">1</text>
    <rect x="148" y="122" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="170" y="149" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">1</text>
    <rect x="192" y="122" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="214" y="149" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">1</text>

    <rect x="60" y="166" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="82" y="193" text-anchor="middle" font-size="13" fill="#7a3a36" font-weight="bold">0</text>
    <rect x="104" y="166" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="126" y="193" text-anchor="middle" font-size="13" fill="#7a3a36" font-weight="bold">0</text>
    <rect x="148" y="166" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="170" y="193" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">1</text>
    <rect x="192" y="166" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="214" y="193" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">1</text>

    <!-- row / col labels -->
    <text x="52" y="104" text-anchor="end" font-size="9" fill="#889">r=0</text>
    <text x="52" y="148" text-anchor="end" font-size="9" fill="#889">r=1</text>
    <text x="52" y="192" text-anchor="end" font-size="9" fill="#889">r=2</text>
    <text x="82" y="224" text-anchor="middle" font-size="9" fill="#889">c=0</text>
    <text x="126" y="224" text-anchor="middle" font-size="9" fill="#889">c=1</text>
    <text x="170" y="224" text-anchor="middle" font-size="9" fill="#889">c=2</text>
    <text x="214" y="224" text-anchor="middle" font-size="9" fill="#889">c=3</text>

    <!-- the two disjoint squares -->
    <rect x="60" y="78" width="88" height="88" fill="none" stroke="#446688" stroke-width="2.5" rx="2"/>
    <text x="104" y="128" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">A</text>
    <rect x="148" y="122" width="88" height="88" fill="none" stroke="#d6a040" stroke-width="2.5" rx="2"/>
    <text x="192" y="172" text-anchor="middle" font-size="14" fill="#a87020" font-weight="bold">B</text>

    <!-- valid corner dots -->
    <circle cx="60" cy="78" r="4.5" fill="#b85450" stroke="#fff" stroke-width="1"/>
    <text x="56" y="70" text-anchor="middle" font-size="7.5" fill="#b85450">(0,0)</text>
    <circle cx="104" cy="78" r="4.5" fill="#b85450" stroke="#fff" stroke-width="1"/>
    <text x="112" y="70" text-anchor="middle" font-size="7.5" fill="#b85450">(0,1)</text>
    <circle cx="148" cy="122" r="4.5" fill="#b85450" stroke="#fff" stroke-width="1"/>
    <text x="156" y="116" text-anchor="middle" font-size="7.5" fill="#b85450">(1,2)</text>

    <!-- legend -->
    <rect x="60" y="232" width="12" height="12" fill="none" stroke="#446688" stroke-width="2.2" rx="2"/>
    <text x="80" y="242" text-anchor="start" font-size="9" fill="#446688">正方形 A：角点 (0,0)，k=2</text>
    <rect x="60" y="250" width="12" height="12" fill="none" stroke="#d6a040" stroke-width="2.2" rx="2"/>
    <text x="80" y="260" text-anchor="start" font-size="9" fill="#a87020">正方形 B：角点 (1,2)，k=2</text>
    <circle cx="66" cy="270" r="4" fill="#b85450"/>
    <text x="80" y="274" text-anchor="start" font-size="9" fill="#b85450">合法角点集 = {(0,0), (0,1), (1,2)}</text>

    <!-- column gap arrow: from col of minC=0 to col of maxC=2 -->
    <path d="M 60 294 H 148" stroke="#446688" stroke-width="1.8" marker-start="url(#arrB)" marker-end="url(#arrB)" fill="none"/>
    <text x="104" y="312" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">maxC − minC = 2 ≥ k = 2 ✓</text>
    <text x="104" y="326" text-anchor="middle" font-size="8.5" fill="#555">列区间 [0,1] 与 [2,3] 不相交 ⇒ A、B 不共享任何格</text>
    <text x="104" y="342" text-anchor="middle" font-size="8.5" fill="#7a3a36">maxR − minR = 1 &lt; 2 ✗ —— 行方向不够，但判据取「或」，列达标即可</text>

    <!-- right box: criterion derivation -->
    <rect x="300" y="70" width="300" height="258" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="450" y="92" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">判据：不重叠 ⟺ |Δr| ≥ k 或 |Δc| ≥ k</text>
    <text x="316" y="114" text-anchor="start" font-size="9" fill="#7a5c1a">两个 k×k 正方形，角点 (r₁,c₁)、(r₂,c₂)</text>
    <text x="316" y="132" text-anchor="start" font-size="9" fill="#7a5c1a">行区间 [r₁, r₁+k−1] 与 [r₂, r₂+k−1] 不交 ⟺ |Δr| ≥ k</text>
    <text x="316" y="152" text-anchor="start" font-size="9" fill="#7a5c1a">充分：maxR−minR ≥ k ⇒ 取行极值角点对，区间必不交</text>
    <text x="316" y="170" text-anchor="start" font-size="9" fill="#7a5c1a">必要：两差均 &lt; k ⇒ 行、列区间全都相交，</text>
    <text x="328" y="184" text-anchor="start" font-size="9" fill="#7a5c1a">公共格 (max(r₁,r₂), max(c₁,c₂)) 必被共享</text>
    <text x="316" y="206" text-anchor="start" font-size="9" fill="#8a6d1f" font-weight="bold">⇒「存在不重叠对」⟺ maxR−minR ≥ k ∨ maxC−minC ≥ k</text>
    <text x="316" y="226" text-anchor="start" font-size="9" fill="#7a5c1a">两两配对 O(P²) 坍缩成 4 个极值标量 O(1)</text>
    <text x="316" y="246" text-anchor="start" font-size="9" fill="#7a5c1a">红利：仅一个合法角点 ⇒ min = max ⇒ 差 0 &lt; k，自动否决</text>
    <text x="316" y="268" text-anchor="start" font-size="9" fill="#7a5c1a">本例：Δr = 1 ✗，Δc = 2 ✓ ⇒ check(2) = true</text>
    <text x="316" y="290" text-anchor="start" font-size="9" fill="#7a5c1a">取 (0,0) 与 (1,2)：列 [0,1] ∩ [2,3] = ∅，恰为 A、B</text>
    <text x="316" y="312" text-anchor="start" font-size="8.5" fill="#a87020">（紧贴允许：不相交只看格子，不看边界线）</text>

    <!-- bottom takeaway -->
    <rect x="60" y="350" width="540" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="330" y="368" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">三步合成</text>
    <text x="76" y="386" text-anchor="start" font-size="9" fill="#33506b">① 前缀和 O(1) 判全 1：S[r+k][c+k] − S[r][c+k] − S[r+k][c] + S[r][c] = k²</text>
    <text x="76" y="402" text-anchor="start" font-size="9" fill="#33506b">② 极值差判不重叠：4 个标量代替 O(P²) 两两配对（单一正方形自动否决）</text>
    <text x="76" y="418" text-anchor="start" font-size="9" fill="#33506b">③ 单调性 ⇒ 二分：k 可行 ⇒ k−1 可行，二分最大 k，答案 k²</text>
  </g>
</svg>
