<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历找极值 + 三策略取 min</text>

  <rect x="60" y="50" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">遍历 nums 找 minIdx / maxIdx</text>

  <path d="M 150 90 L 150 112" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="60" y="116" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="134" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">令 i=min(a,b)</text>
  <text x="150" y="150" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j=max(a,b)</text>

  <path d="M 150 156 L 150 178" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="182" width="110" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="95" y="202" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c1 = j+1</text>
  <text x="95" y="218" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">全从左删</text>

  <rect x="160" y="182" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="215" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c2 = n-i</text>
  <text x="215" y="218" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">全从右删</text>

  <rect x="280" y="182" width="130" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="345" y="200" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">c3=(i+1)+(n-j)</text>
  <text x="345" y="218" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">左删+右删</text>

  <path d="M 95 226 L 95 250 L 220 250" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 215 226 L 215 250" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 345 226 L 345 250 L 220 250" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <path d="M 220 250 L 220 268" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="120" y="272" width="200" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="220" y="298" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">return min(c1, c2, c3)</text>

  <rect x="40" y="336" width="480" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="356" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">关键不变量：</text>
  <text x="60" y="372" font-size="10.5" fill="#446688" filter="url(#rough2)">i &lt; j ⇒ 极值之间的「中间段」永远保留，只删两端到 i / j 即可覆盖两个目标</text>
</svg>
