<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">核心观察：排序后最优匹配「不交叉」</text>

  <!-- ===== Top panel: crossing (suboptimal) ===== -->
  <text x="60" y="64" font-size="13" fill="#b85450" filter="url(#rough2)">交叉匹配（次优）</text>
  <!-- axis -->
  <line x1="60" y1="180" x2="540" y2="180" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- positions: p=1->110, p=2->160(F_A), p=4->260(R_b), p=5->310(F_B) -->
  <!-- robots as triangles above line, factories as squares below line -->
  <g filter="url(#rough2)">
    <!-- R_a at x=110 -->
    <polygon points="110,168 100,156 120,156" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <!-- R_b at x=260 -->
    <polygon points="260,168 250,156 270,156" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <!-- F_A at x=160 -->
    <rect x="152" y="184" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <!-- F_B at x=310 -->
    <rect x="302" y="184" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
  </g>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="110" y="150" text-anchor="middle" fill="#446688">R_a (p=1)</text>
    <text x="260" y="150" text-anchor="middle" fill="#446688">R_b (p=4)</text>
    <text x="160" y="218" text-anchor="middle" fill="#d6a040">F_A (q=2)</text>
    <text x="310" y="218" text-anchor="middle" fill="#d6a040">F_B (q=5)</text>
  </g>
  <!-- crossing arcs: R_a -> F_B (110 -> 310), R_b -> F_A (260 -> 160) -->
  <path d="M110 156 Q210 80 310 184" fill="none" stroke="#b85450" stroke-width="2.4"
        stroke-linecap="round" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M260 156 Q210 120 160 184" fill="none" stroke="#b85450" stroke-width="2.4"
        stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="110" font-size="12" fill="#b85450" filter="url(#rough2)">R_a→F_B：|1−5|=4</text>
  <text x="360" y="128" font-size="12" fill="#b85450" filter="url(#rough2)">R_b→F_A：|4−2|=2</text>
  <text x="360" y="148" font-size="12" fill="#b85450" filter="url(#rough2)">合计 = 6</text>
  <!-- red X -->
  <text x="206" y="106" font-size="22" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- ===== Bottom panel: non-crossing (optimal) ===== -->
  <text x="60" y="264" font-size="13" fill="#4a7a3a" filter="url(#rough2)">不交叉匹配（最优）</text>
  <line x1="60" y1="380" x2="540" y2="380" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <polygon points="110,368 100,356 120,356" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <polygon points="260,368 250,356 270,356" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="152" y="384" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <rect x="302" y="384" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
  </g>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="110" y="350" text-anchor="middle" fill="#446688">R_a (p=1)</text>
    <text x="260" y="350" text-anchor="middle" fill="#446688">R_b (p=4)</text>
    <text x="160" y="418" text-anchor="middle" fill="#d6a040">F_A (q=2)</text>
    <text x="310" y="418" text-anchor="middle" fill="#d6a040">F_B (q=5)</text>
  </g>
  <!-- non-crossing arcs: R_a -> F_A (110->160), R_b -> F_B (260->310) -->
  <path d="M110 356 Q135 312 160 384" fill="none" stroke="#4a7a3a" stroke-width="2.4"
        stroke-linecap="round" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M260 356 Q285 312 310 384" fill="none" stroke="#4a7a3a" stroke-width="2.4"
        stroke-linecap="round" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="312" font-size="12" fill="#4a7a3a" filter="url(#rough2)">R_a→F_A：|1−2|=1</text>
  <text x="360" y="330" font-size="12" fill="#4a7a3a" filter="url(#rough2)">R_b→F_B：|4−5|=1</text>
  <text x="360" y="350" font-size="12" fill="#4a7a3a" filter="url(#rough2)">合计 = 2  ≤ 6 ✓</text>
  <text x="206" y="312" font-size="22" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- bottom note -->
  <rect x="40" y="424" width="0" height="0" fill="none"/>
</svg>
