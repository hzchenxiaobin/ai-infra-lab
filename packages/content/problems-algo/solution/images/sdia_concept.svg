<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：取余拆位天然 LSB 优先，逆序输出还原原序</text>

  <!-- ====== TOP: nums ====== -->
  <rect x="160" y="38" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="55" text-anchor="middle" font-size="10.5" fill="#888">输入数组 nums</text>
  <text x="270" y="72" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">[ 13, 25, 83, 77 ]</text>

  <!-- ====== Four columns: x | buf (LSB) | reverse arrow | original order ====== -->
  <!-- Column 1: 13 -->
  <text x="80" y="104" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">x = 13</text>
  <path d="M 80 110 L 80 124" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="126" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="139" text-anchor="middle" font-size="9.5" fill="#888">buf（LSB 优先）</text>
  <text x="80" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[3, 1]</text>
  <path d="M 80 160 L 80 174" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="96" y="171" font-size="9.5" fill="#b85450" font-weight="bold">逆序</text>
  <rect x="30" y="176" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="189" text-anchor="middle" font-size="9.5" fill="#888">原序输出</text>
  <text x="80" y="205" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">[1, 3]</text>

  <!-- Column 2: 25 -->
  <text x="200" y="104" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">x = 25</text>
  <path d="M 200 110 L 200 124" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="126" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="139" text-anchor="middle" font-size="9.5" fill="#888">buf（LSB 优先）</text>
  <text x="200" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[5, 2]</text>
  <path d="M 200 160 L 200 174" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="216" y="171" font-size="9.5" fill="#b85450" font-weight="bold">逆序</text>
  <rect x="150" y="176" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="189" text-anchor="middle" font-size="9.5" fill="#888">原序输出</text>
  <text x="200" y="205" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">[2, 5]</text>

  <!-- Column 3: 83 -->
  <text x="320" y="104" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">x = 83</text>
  <path d="M 320 110 L 320 124" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="270" y="126" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="139" text-anchor="middle" font-size="9.5" fill="#888">buf（LSB 优先）</text>
  <text x="320" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[3, 8]</text>
  <path d="M 320 160 L 320 174" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="336" y="171" font-size="9.5" fill="#b85450" font-weight="bold">逆序</text>
  <rect x="270" y="176" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="189" text-anchor="middle" font-size="9.5" fill="#888">原序输出</text>
  <text x="320" y="205" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">[8, 3]</text>

  <!-- Column 4: 77 -->
  <text x="440" y="104" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">x = 77</text>
  <path d="M 440 110 L 440 124" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="390" y="126" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="139" text-anchor="middle" font-size="9.5" fill="#888">buf（LSB 优先）</text>
  <text x="440" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[7, 7]</text>
  <path d="M 440 160 L 440 174" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="456" y="171" font-size="9.5" fill="#b85450" font-weight="bold">逆序</text>
  <rect x="390" y="176" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="189" text-anchor="middle" font-size="9.5" fill="#888">原序输出</text>
  <text x="440" y="205" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">[7, 7]</text>

  <!-- ====== Arrows converging to ans ====== -->
  <path d="M 80 210 L 80 240 L 270 240" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 200 210 L 200 240 L 270 240" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 320 210 L 320 240 L 270 240" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 440 210 L 440 240 L 270 240" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 270 240 L 270 258" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="298" y="236" font-size="11" fill="#b85450" font-weight="bold">顺序拼接</text>

  <!-- ====== Final answer ====== -->
  <rect x="80" y="262" width="380" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="288" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">answer = [1, 3, 2, 5, 8, 3, 7, 7]</text>

  <!-- ====== Bottom note ====== -->
  <rect x="40" y="316" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="336" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">t % 10 从最低位起取 → buf 自然倒序</text>
  <text x="270" y="352" text-anchor="middle" font-size="10.5" fill="#888">逆序遍历 buf 即还原「高位在前」的原序；缓冲容量 ≤ 6（nums[i] ≤ 10⁵）</text>
  <text x="270" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">含 0 数位（如 10921）天然正确：t==0 才停，不是遇 0 数位就停</text>
</svg>
