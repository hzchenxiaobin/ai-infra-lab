<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">单调栈流程：新值入栈一次 = 一个新块</text>

  <!-- 开始 -->
  <rect x="175" y="32" width="190" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="50" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始：st = []，ans = 0</text>
  <path d="M270,60 L270,74" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取下一个元素 -->
  <rect x="150" y="78" width="240" height="30" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="97" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一个 h（遍历完则返回 ans）</text>
  <path d="M270,108 L270,122" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- while 弹栈 -->
  <rect x="155" y="126" width="230" height="46" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">while 栈非空 且 栈顶 &gt; h：</text>
  <text x="270" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">弹出栈顶（更小的 h 是隔断）</text>
  <path d="M270,172 L270,186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="270,190 400,240 270,290 140,240" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">h &gt; 0 且</text>
  <text x="270" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(栈空 或 栈顶 &lt; h) ?</text>

  <!-- 是：push -->
  <path d="M400,240 L416,240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="403" y="231" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="420" y="222" width="90" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="465" y="238" text-anchor="middle" font-size="12" fill="#2e5a24" filter="url(#rough2)">push h</text>
  <text x="465" y="254" text-anchor="middle" font-size="12" fill="#2e5a24" filter="url(#rough2)">ans++ ★</text>

  <!-- 否：跳过 -->
  <path d="M140,240 L128,240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="134" y="231" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="14" y="222" width="112" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="238" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">跳过（不计数）</text>
  <text x="70" y="254" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">栈顶==h 同块</text>

  <!-- 右侧回环：下一个 h -->
  <path d="M465,222 L465,92 L398,92" stroke="#888888" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="190" font-size="11" fill="#888" filter="url(#rough2)">下一个 h</text>

  <!-- 左侧回环：下一个 h -->
  <path d="M70,222 L70,92 H144" stroke="#888888" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="118" font-size="11" fill="#888" filter="url(#rough2)">下一个 h</text>

  <!-- 结论标注 -->
  <rect x="150" y="312" width="240" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="270" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans ＝ 新值入栈的次数</text>
  <text x="270" y="346" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">＝ 各值被隔断出的段数总和</text>
</svg>
