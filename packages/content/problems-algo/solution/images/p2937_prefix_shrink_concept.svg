<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">只删末尾 ⇒ 每串只能收缩成自己的前缀</text>

  <!-- Row 1: s1 = abc -->
  <text x="36" y="76" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">s1</text>
  <rect x="66" y="52" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="83" y="75" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="104" y="52" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="121" y="75" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="142" y="52" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="159" y="75" text-anchor="middle" font-size="14" fill="#8f3a36" filter="url(#rough2)">c</text>
  <path d="M 146 55 L 172 83" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 172 55 L 146 83" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="101" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">删 1 次</text>

  <path d="M 188 69 L 226 69" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="207" y="60" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">变成前缀</text>

  <rect x="232" y="52" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="249" y="75" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">a</text>
  <rect x="270" y="52" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="287" y="75" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">b</text>
  <text x="336" y="75" font-size="11.5" fill="#888" filter="url(#rough2)">代价 3 − 2 = 1</text>

  <!-- Row 2: s2 = abb -->
  <text x="36" y="142" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">s2</text>
  <rect x="66" y="118" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="83" y="141" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="104" y="118" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="121" y="141" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="142" y="118" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="159" y="141" text-anchor="middle" font-size="14" fill="#8f3a36" filter="url(#rough2)">b</text>
  <path d="M 146 121 L 172 149" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 172 121 L 146 149" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="167" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">删 1 次</text>

  <path d="M 188 135 L 226 135" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="207" y="126" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">变成前缀</text>

  <rect x="232" y="118" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="249" y="141" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">a</text>
  <rect x="270" y="118" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="287" y="141" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">b</text>
  <text x="336" y="141" font-size="11.5" fill="#888" filter="url(#rough2)">代价 3 − 2 = 1</text>

  <!-- Row 3: s3 = ab -->
  <text x="36" y="208" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">s3</text>
  <rect x="66" y="184" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="83" y="207" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="104" y="184" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="121" y="207" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>

  <path d="M 150 201 L 226 201" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="188" y="192" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">已是最长公共前缀</text>

  <rect x="232" y="184" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="249" y="207" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">a</text>
  <rect x="270" y="184" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="287" y="207" text-anchor="middle" font-size="14" fill="#2f5d24" filter="url(#rough2)">b</text>
  <text x="336" y="207" font-size="11.5" fill="#888" filter="url(#rough2)">代价 2 − 2 = 0</text>

  <!-- target box -->
  <rect x="66" y="238" width="388" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">公共目标只能是三串的公共前缀</text>
  <text x="260" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">取最长的：L = LCP(s1, s2, s3) = 2，即 「ab」</text>

  <!-- formula box -->
  <rect x="66" y="292" width="388" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = (n1−L) + (n2−L) + (n3−L) = 1 + 1 + 0 = 2</text>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">公共前缀每加长 1，三串各少删 1 次，共省 3 次</text>

  <!-- bottom note -->
  <rect x="86" y="348" width="348" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">L = 0（首字符互不相同）⇒ 首字符永不改变</text>
  <text x="260" y="382" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">三串永远无法相等，返回 −1</text>
</svg>
