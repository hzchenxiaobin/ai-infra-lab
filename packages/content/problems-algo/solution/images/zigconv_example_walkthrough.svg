<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "PAYPALISHIRING", numRows = 4</text>

  <!-- Column headers -->
  <text x="50" y="62" font-size="11" fill="#888" font-weight="bold">下标 i</text>
  <text x="120" y="62" font-size="11" fill="#888" font-weight="bold">字符</text>
  <text x="190" y="62" font-size="11" fill="#888" font-weight="bold">i%6</text>
  <text x="270" y="62" font-size="11" fill="#888" font-weight="bold">折返?</text>
  <text x="350" y="62" font-size="11" fill="#888" font-weight="bold">行 r</text>
  <text x="430" y="62" font-size="11" fill="#888" font-weight="bold">rows 累积</text>

  <!-- separator -->
  <line x1="40" y1="68" x2="540" y2="68" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: i=0 P -->
  <text x="60" y="86" font-size="11" fill="#333">0</text>
  <text x="125" y="86" font-size="11" fill="#333" font-weight="bold">P</text>
  <text x="200" y="86" font-size="11" fill="#666">0</text>
  <text x="280" y="86" font-size="11" fill="#999">否</text>
  <rect x="340" y="74" width="30" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="87" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="440" y="86" font-size="10" fill="#555">行0:[P]</text>

  <!-- i=1 A -->
  <text x="60" y="108" font-size="11" fill="#333">1</text>
  <text x="125" y="108" font-size="11" fill="#333" font-weight="bold">A</text>
  <text x="200" y="108" font-size="11" fill="#666">1</text>
  <text x="280" y="108" font-size="11" fill="#999">否</text>
  <rect x="340" y="96" width="30" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="109" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="440" y="108" font-size="10" fill="#555">行1:[A]</text>

  <!-- i=2 Y -->
  <text x="60" y="130" font-size="11" fill="#333">2</text>
  <text x="125" y="130" font-size="11" fill="#333" font-weight="bold">Y</text>
  <text x="200" y="130" font-size="11" fill="#666">2</text>
  <text x="280" y="130" font-size="11" fill="#999">否</text>
  <rect x="340" y="118" width="30" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="131" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="440" y="130" font-size="10" fill="#555">行2:[Y]</text>

  <!-- i=3 P -->
  <text x="60" y="152" font-size="11" fill="#333">3</text>
  <text x="125" y="152" font-size="11" fill="#333" font-weight="bold">P</text>
  <text x="200" y="152" font-size="11" fill="#666">3</text>
  <text x="280" y="152" font-size="11" fill="#999">否</text>
  <rect x="340" y="140" width="30" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="153" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="440" y="152" font-size="10" fill="#555">行3:[P]</text>

  <!-- i=4 A  (fold: 4 -> 2) -->
  <text x="60" y="174" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="125" y="174" font-size="11" fill="#333" font-weight="bold">A</text>
  <text x="200" y="174" font-size="11" fill="#666">4</text>
  <text x="280" y="174" font-size="11" fill="#b85450" font-weight="bold">是→2</text>
  <rect x="340" y="162" width="30" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="175" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="440" y="174" font-size="10" fill="#555">行2:[Y,A]</text>

  <!-- i=5 L (fold: 5 -> 1) -->
  <text x="60" y="196" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="125" y="196" font-size="11" fill="#333" font-weight="bold">L</text>
  <text x="200" y="196" font-size="11" fill="#666">5</text>
  <text x="280" y="196" font-size="11" fill="#b85450" font-weight="bold">是→1</text>
  <rect x="340" y="184" width="30" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="197" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="440" y="196" font-size="10" fill="#555">行1:[A,L]</text>

  <!-- i=6 I (new cycle, 6%6=0) -->
  <text x="60" y="218" font-size="11" fill="#333">6</text>
  <text x="125" y="218" font-size="11" fill="#333" font-weight="bold">I</text>
  <text x="200" y="218" font-size="11" fill="#666">0</text>
  <text x="280" y="218" font-size="11" fill="#999">否</text>
  <rect x="340" y="206" width="30" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="219" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="440" y="218" font-size="10" fill="#555">行0:[P,I]</text>

  <!-- i=7 S -->
  <text x="60" y="240" font-size="11" fill="#333">7</text>
  <text x="125" y="240" font-size="11" fill="#333" font-weight="bold">S</text>
  <text x="200" y="240" font-size="11" fill="#666">1</text>
  <text x="280" y="240" font-size="11" fill="#999">否</text>
  <rect x="340" y="228" width="30" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="241" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="440" y="240" font-size="10" fill="#555">行1:[A,L,S]</text>

  <!-- ellipsis -->
  <text x="280" y="266" text-anchor="middle" font-size="12" fill="#aaa">…（同理继续 8..13）…</text>

  <!-- Final rows -->
  <line x1="40" y1="284" x2="540" y2="284" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <rect x="50" y="296" width="460" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="312" font-size="11" fill="#333">行 0:</text>
  <text x="100" y="312" font-size="11" fill="#333" font-weight="bold">P I N</text>

  <rect x="50" y="322" width="460" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="338" font-size="11" fill="#333">行 1:</text>
  <text x="100" y="338" font-size="11" fill="#333" font-weight="bold">A L S I G</text>

  <rect x="50" y="348" width="460" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="364" font-size="11" fill="#333">行 2:</text>
  <text x="100" y="364" font-size="11" fill="#333" font-weight="bold">Y A H R</text>

  <rect x="50" y="374" width="460" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="390" font-size="11" fill="#333">行 3:</text>
  <text x="100" y="390" font-size="11" fill="#333" font-weight="bold">P I</text>

  <!-- Result -->
  <rect x="110" y="404" width="340" height="14" fill="none" stroke="#b85450" stroke-width="0" rx="4" filter="url(#rough2)"/>
  <text x="280" y="415" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">拼接 → PINALSIGYAHRPI</text>
</svg>
