<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M10,0 L2,5 L10,10 Z" fill="#b85450"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：从两端贪心配对，把匹配字符冒泡到对称位</text>

  <!-- ① Original string with pointers -->
  <text x="40" y="56" font-size="12" fill="#555" font-weight="bold">① 原串 s = "aabb"，left 指向 0，从 right 向左找最右侧的 'a'</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="120" y="66" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="145" y="88" fill="#d6a040" font-weight="bold">a</text>
    <rect x="174" y="66" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="199" y="88" fill="#d6a040" font-weight="bold">a</text>
    <rect x="228" y="66" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="253" y="88">b</text>
    <rect x="282" y="66" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="307" y="88">b</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="145" y="111">0</text>
    <text x="199" y="111">1</text>
    <text x="253" y="111">2</text>
    <text x="307" y="111">3</text>
  </g>
  <text x="145" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">left</text>
  <text x="307" y="126" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">right</text>
  <!-- search arrow from right leftward to index 1 -->
  <path d="M300,138 Q224,160 205,138" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="252" y="158" text-anchor="middle" font-size="10.5" fill="#b85450">从 right 向左搜，找到 j=1</text>

  <!-- Divider -->
  <path d="M 40 174 L 520 174" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ② Bubble s[j] to right -->
  <text x="40" y="194" font-size="12" fill="#555" font-weight="bold">② 把 s[1] 一路冒泡到 right=3：每次和右邻交换，共 right−j = 2 次</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="120" y="204" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="140" y="224">a</text>
    <rect x="164" y="204" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="184" y="224" fill="#d6a040" font-weight="bold">a</text>
    <rect x="208" y="204" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="228" y="224">b</text>
    <rect x="252" y="204" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="272" y="224">b</text>
  </g>
  <text x="305" y="224" font-size="11" fill="#555">原串</text>
  <path d="M184,240 L228,240" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M228,246 L184,246" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="206" y="260" text-anchor="middle" font-size="10" fill="#b85450">交换 1,2 → "abab"</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="120" y="270" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="140" y="290">a</text>
    <rect x="164" y="270" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="184" y="290">b</text>
    <rect x="208" y="270" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="228" y="290" fill="#d6a040" font-weight="bold">a</text>
    <rect x="252" y="270" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="272" y="290">b</text>
  </g>
  <path d="M228,306 L272,306" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M272,312 L228,312" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="250" y="326" text-anchor="middle" font-size="10" fill="#b85450">交换 2,3 → "abba"</text>

  <!-- Divider -->
  <path d="M 40 340 L 520 340" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ③ Paired result -->
  <text x="40" y="360" font-size="12" fill="#555" font-weight="bold">③ 配对锁定：left/right 位已成对称对，缩进处理内层</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="120" y="370" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="145" y="392" fill="#4a7a3a" font-weight="bold">a</text>
    <rect x="174" y="370" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="199" y="392">b</text>
    <rect x="228" y="370" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="253" y="392">b</text>
    <rect x="282" y="370" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="307" y="392" fill="#4a7a3a" font-weight="bold">a</text>
  </g>
  <path d="M150,386 Q226,406 302,386" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="226" y="420" text-anchor="middle" font-size="10.5" fill="#4a7a3a">内层 "bb" 已对称 → 无需再交换</text>

  <!-- Formula box -->
  <rect x="60" y="432" width="440" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="448" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">每轮：找最右侧同字符 j，冒泡到 right，代价 = right − j</text>
</svg>
