<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">trimBST(node, low, high) 递归流程</text>

  <!-- 入口 -->
  <rect x="200" y="44" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">调用 trimBST(node)</text>
  <line x1="280" y1="74" x2="280" y2="92" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 菱形 -->
  <polygon points="280,94 360,134 280,174 200,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="11" fill="#555">node == null ?</text>
  <!-- 是 -->
  <line x1="200" y1="134" x2="120" y2="134" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="118" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="80" y="138" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return null</text>
  <!-- 否 -->
  <line x1="280" y1="174" x2="280" y2="192" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="186" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 判 < low 菱形 -->
  <polygon points="280,194 370,236 280,278 190,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#555">node.val &lt; low ?</text>
  <text x="280" y="248" text-anchor="middle" font-size="9" fill="#888">(node 与左子树全 &lt; low)</text>
  <!-- 是 → return trim(right) -->
  <line x1="190" y1="236" x2="110" y2="236" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="220" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="65" y="236" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">丢弃 node+左</text>
  <text x="65" y="248" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">return trim(right)</text>
  <!-- 否 -->
  <line x1="280" y1="278" x2="280" y2="296" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="290" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 判 > high 菱形 -->
  <polygon points="280,298 370,340 280,382 190,340" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#555">node.val &gt; high ?</text>
  <text x="280" y="352" text-anchor="middle" font-size="9" fill="#888">(node 与右子树全 &gt; high)</text>
  <!-- 是 → return trim(left) -->
  <line x1="190" y1="340" x2="110" y2="340" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="334" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="324" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="65" y="340" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">丢弃 node+右</text>
  <text x="65" y="352" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">return trim(left)</text>
  <!-- 否 -->
  <line x1="280" y1="382" x2="280" y2="400" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="394" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 保留节点：递归两侧 -->
  <rect x="170" y="402" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="420" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留 node（low ≤ val ≤ high）</text>
  <text x="280" y="436" text-anchor="middle" font-size="10" fill="#555">node.left = trim(node.left)</text>
  <text x="280" y="450" text-anchor="middle" font-size="10" fill="#555">node.right = trim(node.right)</text>

  <!-- 递归调用回弯箭头：从右侧 trim(right)/trim(left) 指回入口 -->
  <path d="M 110 236 C 470 236, 480 60, 360 60" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="150" text-anchor="middle" font-size="9" fill="#b85450">递归</text>
  <path d="M 110 340 C 470 340, 480 80, 360 64" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 保留分支返回箭头 -->
  <line x1="280" y1="458" x2="280" y2="472" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="471" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold">return node</text>
</svg>
