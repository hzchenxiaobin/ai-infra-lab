<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">置换环视角：i → nums[i] 成环，空白 0 的归宿落在某个环里</text>

  <!-- operation hint -->
  <rect x="378" y="36" width="170" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="463" y="51" text-anchor="middle" font-size="10.5" fill="#7a5a20" filter="url(#rough2)">一次操作 = 交换「值 0」与「某项目」</text>

  <!-- ===== Array row : nums = [4,2,0,3,1] ===== -->
  <text x="36" y="76" font-size="10" fill="#888" filter="url(#rough2)">下标</text>
  <text x="36" y="100" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">nums</text>

  <text x="170" y="72" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="214" y="72" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">1</text>
  <text x="258" y="72" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">2</text>
  <text x="302" y="72" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">3</text>
  <text x="346" y="72" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">4</text>

  <rect x="150" y="78" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="194" y="78" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <!-- value 0 = blank, highlight orange -->
  <rect x="238" y="78" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="98" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="282" y="78" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="326" y="78" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="258" y="124" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">↑ 值 0 = 空白，当前在位置 2（归宿应是位置 0）</text>

  <path d="M 258 130 L 258 142" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Cycle {0,4,1,2} length 4, contains blank home (node 0) ===== -->
  <g font-size="12">
    <!-- node 0 (top) = blank home, orange ring -->
    <circle cx="150" cy="186" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="150" y="190" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
    <!-- node 4 (right) -->
    <circle cx="188" cy="224" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="188" y="228" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
    <!-- node 1 (bottom) -->
    <circle cx="150" cy="262" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="150" y="266" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
    <!-- node 2 (left) -->
    <circle cx="112" cy="224" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="112" y="228" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

    <!-- clockwise arrows -->
    <path d="M 161 197 Q 184 196 182 212" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 182 236 Q 184 260 161 261" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 139 261 Q 116 260 118 236" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 118 212 Q 116 196 139 197" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <text x="150" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">环 {0,4,1,2}：长 4，含空白归宿</text>
    <text x="150" y="310" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">代价 m − 1 = 3</text>
  </g>

  <!-- ===== self-loop {3} ===== -->
  <g font-size="12">
    <circle cx="430" cy="224" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="430" y="228" text-anchor="middle" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
    <!-- self-loop on the right -->
    <path d="M 444 217 Q 466 207 462 231 Q 459 247 442 235" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
    <text x="430" y="262" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">位置 3 已归位（自环）</text>
    <text x="430" y="276" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">代价 0</text>
  </g>

  <!-- ===== rule box ===== -->
  <rect x="40" y="330" width="480" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12.5" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">含空白环 ⟹ m − 1 次｜不含空白环 ⟹ m + 1 次</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">空白沿「含它的环」走，每换入一个错位元素就归位一个，末了自动归位</text>
</svg>
