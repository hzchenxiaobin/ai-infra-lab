<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="490" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：入度 2 与成环两种情形</text>

  <!-- ===== Example 1: Case A ===== -->
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">示例 1（情形 A · 入度 2）：edges = [[1,2],[1,3],[2,3]]</text>

  <rect x="30" y="60" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <text x="240" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">操作</text>
  <text x="450" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">结果</text>

  <rect x="30" y="84" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="101" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">入度</text>
  <text x="240" y="101" text-anchor="middle" font-size="10.5" fill="#333">1→0, 2→1, 3→2</text>
  <text x="450" y="101" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">v=3, cand1=[1,3] cand2=[2,3]</text>

  <rect x="30" y="110" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="127" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">删 cand2</text>
  <text x="240" y="127" text-anchor="middle" font-size="10.5" fill="#333">并查集 [[1,2],[1,3]]</text>
  <text x="450" y="127" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">union 全成功，无环</text>

  <rect x="30" y="136" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="70" y="154" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">结论</text>
  <text x="240" y="154" text-anchor="middle" font-size="10.5" fill="#444">后出现且删后成树</text>
  <text x="450" y="154" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 [2,3] ✓</text>

  <!-- ===== Example 2: Case B ===== -->
  <text x="280" y="188" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">示例 2（情形 B · 成环）：edges = [[1,2],[2,3],[3,4],[4,1],[1,5]]</text>

  <rect x="30" y="196" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <text x="240" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">操作</text>
  <text x="450" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">结果</text>

  <rect x="30" y="220" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="237" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">入度</text>
  <text x="240" y="237" text-anchor="middle" font-size="10.5" fill="#333">每点均为 1</text>
  <text x="450" y="237" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">无 v → 情形 B</text>

  <rect x="30" y="246" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="263" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">全边并查集</text>
  <text x="240" y="263" text-anchor="middle" font-size="10.5" fill="#333">(1,2)(2,3)(3,4) ✓</text>
  <text x="450" y="263" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">(4,1) 已同根 → 环</text>

  <rect x="30" y="272" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="70" y="290" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">结论</text>
  <text x="240" y="290" text-anchor="middle" font-size="10.5" fill="#444">环上最后出现的边</text>
  <text x="450" y="290" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 [4,1] ✓</text>

  <!-- ===== Graphs ===== -->
  <text x="145" y="328" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">图示：删 [2,3] 成树</text>
  <!-- ex1 graph: 1 -> {2,3}, remove 2->3 -->
  <circle cx="145" cy="362" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="367" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="95" cy="428" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="433" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="195" cy="428" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="433" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <line x1="132" y1="374" x2="107" y2="412" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="158" y1="374" x2="183" y2="412" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 109 428 Q 145 462 181 428" stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="145" y="455" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">[2,3] 删</text>

  <text x="405" y="328" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">图示：删 [4,1] 破环</text>
  <!-- ex2 graph: cycle 1->2->3->4->1, remove 4->1 -->
  <circle cx="365" cy="368" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="365" y="373" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="465" cy="368" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="465" y="373" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="465" cy="428" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="465" y="433" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <circle cx="365" cy="428" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="365" y="433" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <line x1="380" y1="368" x2="450" y2="368" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="465" y1="383" x2="465" y2="413" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="450" y1="428" x2="380" y2="428" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="365" y1="413" x2="365" y2="383" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="345" y="400" text-anchor="end" font-size="9.5" fill="#b85450" font-weight="bold">[4,1] 删</text>

  <rect x="40" y="460" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="476" text-anchor="middle" font-size="10.5" fill="#444">入度 2 先试后出现的 cand2；纯环按输入顺序抓第一条 union 失败的边</text>
</svg>
