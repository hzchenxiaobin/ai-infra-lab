<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：从 n 条递减等差数列里挑“前 m 大”，只需一条阈值线 g</text>
  <text x="20" y="38" font-size="9.5" fill="#666" filter="url(#rough2)">示例 1：value = [6,5,4]，decay = [2,1,1]，m = 4（每行是一条等差数列）</text>

  <!-- 行 0 -->
  <text x="14" y="62" font-size="9.5" fill="#555" filter="url(#rough2)">idx0 (d=2)</text>
  <rect x="100" y="46" width="38" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="119" y="62" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">6</text>
  <rect x="144" y="46" width="38" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="163" y="62" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <rect x="188" y="46" width="38" height="24" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="207" y="62" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">2</text>
  <rect x="232" y="46" width="38" height="24" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="251" y="62" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">0</text>

  <!-- 行 1 -->
  <text x="14" y="98" font-size="9.5" fill="#555" filter="url(#rough2)">idx1 (d=1)</text>
  <rect x="100" y="82" width="38" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="119" y="98" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">5</text>
  <rect x="144" y="82" width="38" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="163" y="98" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <rect x="188" y="82" width="38" height="24" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="207" y="98" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">3</text>
  <rect x="232" y="82" width="38" height="24" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="251" y="98" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">2</text>
  <rect x="276" y="82" width="38" height="24" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="295" y="98" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">1</text>

  <!-- 行 2 -->
  <text x="14" y="134" font-size="9.5" fill="#555" filter="url(#rough2)">idx2 (d=1)</text>
  <rect x="100" y="118" width="38" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="119" y="134" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <rect x="144" y="118" width="38" height="24" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="163" y="134" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">3</text>
  <rect x="188" y="118" width="38" height="24" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="207" y="134" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">2</text>
  <rect x="232" y="118" width="38" height="24" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="251" y="134" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">1</text>

  <!-- 图例 -->
  <rect x="24" y="154" width="18" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="47" y="165" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">value &gt; g：全拿（cnt(g+1) 个）</text>
  <rect x="200" y="154" width="18" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="223" y="165" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">value = g：补到够 m 为止</text>
  <rect x="350" y="154" width="18" height="14" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="373" y="165" font-size="8.5" fill="#888888" filter="url(#rough2)">value &lt; g：丢弃</text>

  <!-- 阈值线 -->
  <path d="M 20 190 L 500 190" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <text x="260" y="207" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">阈值 g = 4（第 m=4 大的项）：cnt(4)=5 ≥ 4 且 cnt(5)=2 &lt; 4</text>

  <!-- 摊平序列 -->
  <text x="20" y="228" font-size="9.5" fill="#666" filter="url(#rough2)">把所有项摊平降序排开：</text>
  <rect x="60" y="236" width="38" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="79" y="252" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">6</text>
  <rect x="104" y="236" width="38" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="123" y="252" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">5</text>
  <rect x="148" y="236" width="38" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="167" y="252" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <rect x="192" y="236" width="38" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="211" y="252" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <rect x="236" y="236" width="38" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="252" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">4</text>
  <path d="M 238 258 L 272 238" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="286" y="252" font-size="11" fill="#999999" filter="url(#rough2)">…</text>

  <path d="M 62 268 Q 145 280 230 268" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="145" y="288" text-anchor="middle" font-size="9" fill="#2f5527" filter="url(#rough2)">取前 m=4 个：6+5+4+4</text>
  <text x="255" y="288" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">多 1 个 g，退掉</text>

  <!-- 公式框 -->
  <rect x="50" y="298" width="420" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = S(g) − (cnt(g) − m) × g = 23 − 1×4 = 19</text>
  <text x="260" y="335" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">每个下标：k = ⌊(a−g)/d⌋+1 项，这段和 = k·a − d·k(k−1)/2</text>
</svg>
