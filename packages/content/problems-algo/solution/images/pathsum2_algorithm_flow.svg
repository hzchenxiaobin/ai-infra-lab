<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：DFS + 回溯收集</text>

  <!-- start -->
  <rect x="180" y="44" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dfs(node, cur)</text>
  <path d="M 260 76 L 260 92" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- diamond: node == null? -->
  <path d="M 260 96 L 336 134 L 260 172 L 184 134 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="11" fill="#333">node == null ?</text>
  <!-- yes branch -->
  <path d="M 336 134 L 392 134" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="346" y="128" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="392" y="118" width="86" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="435" y="139" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return</text>

  <!-- no branch down -->
  <path d="M 260 172 L 260 188" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="268" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- append + cur -->
  <rect x="150" y="190" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="211" text-anchor="middle" font-size="12" fill="#333">path.append(node.val) ; cur += val</text>
  <path d="M 260 222 L 260 240" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- diamond: leaf && cur==target? -->
  <path d="M 260 244 L 372 288 L 260 332 L 148 288 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="11" fill="#333">叶子节点</text>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#333">且 cur == targetSum ?</text>
  <!-- yes branch -> copy -->
  <path d="M 372 288 L 410 288" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="378" y="282" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="410" y="262" width="96" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="458" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">res.append</text>
  <text x="458" y="300" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(path 拷贝)</text>
  <!-- no branch: skip annotation -->
  <text x="150" y="292" font-size="10" fill="#999">否 → 跳过收集</text>

  <!-- merge down to recurse -->
  <path d="M 260 332 L 260 352" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <rect x="140" y="354" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="375" text-anchor="middle" font-size="12" fill="#333">dfs(node.left, cur) ; dfs(node.right, cur)</text>
  <path d="M 260 386 L 260 404" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- backtrack -->
  <rect x="150" y="406" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="428" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">path.pop()　← 回溯撤销</text>

  <!-- side annotation -->
  <path d="M 410 288 Q 470 288 470 372" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="476" y="330" font-size="10" fill="#8a6a20">无论是否命中</text>
  <text x="476" y="344" font-size="10" fill="#8a6a20">都要走到 pop</text>

  <text x="260" y="458" text-anchor="middle" font-size="10" fill="#888">叶子的 left/right 为空 → dfs(null) 立即 return，故递归子节点无需特判</text>
</svg>
