<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>

  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 行 Activity → 3 个首登 → 按日期分 2 个同期群</text>

  <!-- Stage A: install subquery a -->
  <text x="105" y="52" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">① 首登子查询 a</text>
  <rect x="25" y="58" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="75" font-size="9.5" fill="#333">player_id</text>
  <text x="120" y="75" font-size="9.5" fill="#333">install_dt</text>
  <line x1="90" y1="58" x2="90" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="25" y="84" width="170" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="99" font-size="10" fill="#333">1</text>
  <text x="120" y="99" font-size="9.5" fill="#b85450" font-weight="bold">2016-03-01</text>
  <line x1="90" y1="84" x2="90" y2="106" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="25" y="106" width="170" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="121" font-size="10" fill="#333">2</text>
  <text x="120" y="121" font-size="9.5" fill="#4a7a3a" font-weight="bold">2017-06-25</text>
  <line x1="90" y1="106" x2="90" y2="128" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="25" y="128" width="170" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="143" font-size="10" fill="#333">3</text>
  <text x="120" y="143" font-size="9.5" fill="#d6a040" font-weight="bold">2016-03-01</text>
  <line x1="90" y1="128" x2="90" y2="150" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="105" y="170" text-anchor="middle" font-size="9.5" fill="#888">GROUP BY player_id + MIN</text>

  <!-- arrows A -> B -->
  <path d="M197 95 L222 95" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M197 117 L222 117" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M197 139 L222 139" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Stage B: per-player Day1 -->
  <text x="360" y="52" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">② LEFT JOIN 次日 → Day1 标志</text>
  <rect x="225" y="58" width="280" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="75" font-size="9" fill="#333">player_id</text>
  <text x="315" y="75" font-size="9" fill="#333">install_dt</text>
  <text x="400" y="75" font-size="9" fill="#333">次日目标</text>
  <text x="475" y="75" font-size="9" fill="#333">is_day1</text>
  <line x1="295" y1="58" x2="295" y2="84" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="58" x2="380" y2="84" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="58" x2="460" y2="84" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="225" y="84" width="280" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="248" y="99" font-size="10" fill="#333">1</text>
  <text x="315" y="99" font-size="9" fill="#b85450">2016-03-01</text>
  <text x="400" y="99" font-size="9" fill="#b85450" font-weight="bold">2016-03-02</text>
  <text x="478" y="99" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="295" y1="84" x2="295" y2="106" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="84" x2="380" y2="106" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="84" x2="460" y2="106" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="225" y="106" width="280" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="248" y="121" font-size="10" fill="#333">2</text>
  <text x="315" y="121" font-size="9" fill="#4a7a3a">2017-06-25</text>
  <text x="400" y="121" font-size="9" fill="#333">2017-06-26</text>
  <text x="478" y="121" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <line x1="295" y1="106" x2="295" y2="128" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="106" x2="380" y2="128" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="106" x2="460" y2="128" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="225" y="128" width="280" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="248" y="143" font-size="10" fill="#333">3</text>
  <text x="315" y="143" font-size="9" fill="#d6a040">2016-03-01</text>
  <text x="400" y="143" font-size="9" fill="#333">2016-03-02</text>
  <text x="478" y="143" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <line x1="295" y1="128" x2="295" y2="150" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="128" x2="380" y2="150" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="128" x2="460" y2="150" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="365" y="170" text-anchor="middle" font-size="9.5" fill="#888">玩家 1 命中 2016-03-02 → 1；玩家 2/3 无次日行 → 0</text>

  <!-- funnel B -> C -->
  <path d="M507 95 L545 95" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M507 117 L545 117" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M507 139 L545 139" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="526" y="80" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">GROUP BY</text>
  <text x="526" y="92" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">install_dt</text>

  <!-- Stage C: cohort result -->
  <text x="630" y="52" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">③ 同期群结果</text>
  <rect x="550" y="58" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="572" y="75" font-size="9" fill="#333">install_dt</text>
  <text x="638" y="75" font-size="9" fill="#333">amount</text>
  <text x="680" y="75" font-size="9" fill="#333">Day1</text>
  <line x1="620" y1="58" x2="620" y2="84" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="660" y1="58" x2="660" y2="84" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="550" y="84" width="150" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="575" y="102" font-size="9" fill="#b85450" font-weight="bold">2016-03-01</text>
  <text x="642" y="102" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="682" y="102" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="620" y1="84" x2="620" y2="112" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="660" y1="84" x2="660" y2="112" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="550" y="112" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="575" y="130" font-size="9" fill="#4a7a3a" font-weight="bold">2017-06-25</text>
  <text x="642" y="130" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="682" y="130" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <line x1="620" y1="112" x2="620" y2="140" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="660" y1="112" x2="660" y2="140" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- explanation box -->
  <rect x="30" y="188" width="660" height="206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="212" font-size="11.5" fill="#333" font-weight="bold">分步解读</text>
  <text x="50" y="234" font-size="10.5" fill="#555">① 玩家 1 两行最早 2016-03-01；玩家 2 单行 2017-06-25；玩家 3 两行最早 2016-03-01。</text>
  <text x="50" y="252" font-size="10.5" fill="#555">   → 注意玩家 1 与玩家 3 共用同一首登日期 2016-03-01，这是「同期群」的由来。</text>
  <text x="50" y="274" font-size="10.5" fill="#555">② 各自 install_dt + 1 天得目标日期，LEFT JOIN Activity 判存在性：</text>
  <text x="50" y="292" font-size="10.5" fill="#555">   • 玩家 1 目标 2016-03-02 → Activity 有此行（玩 6 局）→ is_day1 = 1 ✓</text>
  <text x="50" y="310" font-size="10.5" fill="#555">   • 玩家 2 目标 2017-06-26 → 无 → is_day1 = 0 ✗</text>
  <text x="50" y="328" font-size="10.5" fill="#555">   • 玩家 3 目标 2016-03-02 → 玩家 3 仅有 2018-07-03，非次日 → is_day1 = 0 ✗</text>
  <text x="50" y="350" font-size="10.5" fill="#555">③ 按 install_dt 分群：2016-03-01 群含玩家 1、3 → amount=2、Day1=1；2017-06-25 群含玩家 2 → amount=1、Day1=0。</text>
  <text x="50" y="374" font-size="10.5" fill="#b85450">⚠️ 玩家 3 虽与玩家 1 同日安装，但次日未回访——同期群内「安装量」相同、「Day1」可不同，正是分群统计的意义。</text>
</svg>
