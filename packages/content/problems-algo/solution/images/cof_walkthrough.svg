<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三位客户的金额计算</text>

  <!-- ===== Customer 1: Winston ===== -->
  <rect x="20" y="48" width="170" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">客户 1: Winston</text>
  <line x1="30" y1="72" x2="180" y2="72" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="28" y="88" font-size="9" fill="#666">order#1 6/10 p10×1</text>
  <text x="155" y="88" text-anchor="end" font-size="9" fill="#333" font-weight="bold">$300</text>
  <text x="28" y="102" font-size="9" fill="#888">order#2 7/01 p20×1</text>
  <text x="155" y="102" text-anchor="end" font-size="9" fill="#888">$10</text>
  <text x="28" y="116" font-size="9" fill="#888">order#3 7/08 p30×2</text>
  <text x="155" y="116" text-anchor="end" font-size="9" fill="#888">$90</text>
  <line x1="30" y1="124" x2="180" y2="124" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="28" y="140" font-size="10" fill="#444">总计 SUM</text>
  <text x="155" y="140" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">$400</text>
  <text x="28" y="156" font-size="9" fill="#4a7a3a">6月订单? ✓ (6/10)</text>
  <text x="28" y="170" font-size="9" fill="#4a7a3a">≥$100? ✓</text>
  <rect x="55" y="174" width="80" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="187" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">入选 ✓</text>

  <!-- ===== Customer 2: Jonathan ===== -->
  <rect x="200" y="48" width="170" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">客户 2: Jonathan</text>
  <line x1="210" y1="72" x2="360" y2="72" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="208" y="88" font-size="9" fill="#666">order#4 6/15 p10×2</text>
  <text x="335" y="88" text-anchor="end" font-size="9" fill="#333" font-weight="bold">$600</text>
  <text x="208" y="102" font-size="9" fill="#888">order#5 7/01 p40×10</text>
  <text x="335" y="102" text-anchor="end" font-size="9" fill="#888">$20</text>
  <line x1="210" y1="110" x2="360" y2="110" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="208" y="126" font-size="10" fill="#444">总计 SUM</text>
  <text x="335" y="126" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">$620</text>
  <text x="208" y="142" font-size="9" fill="#4a7a3a">6月订单? ✓ (6/15)</text>
  <text x="208" y="156" font-size="9" fill="#4a7a3a">≥$100? ✓</text>
  <rect x="235" y="160" width="80" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="275" y="173" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">入选 ✓</text>

  <!-- ===== Customer 3: Moustafa ===== -->
  <rect x="380" y="48" width="170" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">客户 3: Moustafa</text>
  <line x1="390" y1="72" x2="540" y2="72" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="388" y="88" font-size="9" fill="#666">order#6 6/24 p20×2</text>
  <text x="515" y="88" text-anchor="end" font-size="9" fill="#333" font-weight="bold">$20</text>
  <text x="388" y="102" font-size="9" fill="#666">order#7 6/25 p30×2</text>
  <text x="515" y="102" text-anchor="end" font-size="9" fill="#333" font-weight="bold">$90</text>
  <text x="388" y="116" font-size="9" fill="#888">order#9 5/08 p30×3</text>
  <text x="515" y="116" text-anchor="end" font-size="9" fill="#888">$135</text>
  <line x1="390" y1="124" x2="540" y2="124" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="388" y="140" font-size="10" fill="#444">总计 SUM</text>
  <text x="515" y="140" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">$245</text>
  <text x="388" y="156" font-size="9" fill="#4a7a3a">6月订单? ✓ (6/24,25)</text>
  <text x="388" y="170" font-size="9" fill="#4a7a3a">≥$100? ✓</text>
  <rect x="415" y="174" width="80" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="455" y="187" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">入选 ✓</text>

  <!-- ===== Key insight: May order counts ===== -->
  <rect x="120" y="200" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⚠️ 注意：总金额含非 6 月订单</text>
  <text x="280" y="238" text-anchor="middle" font-size="10" fill="#666">Moustafa 的 5 月 order#9 ($135) 也计入总消费</text>

  <!-- ===== Output table ===== -->
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">最终输出</text>

  <rect x="180" y="284" width="200" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="302" text-anchor="middle" font-size="11" fill="white" font-weight="bold">customer_id</text>
  <text x="330" y="302" text-anchor="middle" font-size="11" fill="white" font-weight="bold">name</text>

  <rect x="180" y="312" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="230" y="328" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="330" y="328" text-anchor="middle" font-size="11" fill="#333">Winston</text>

  <rect x="180" y="336" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="230" y="352" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="330" y="352" text-anchor="middle" font-size="11" fill="#333">Jonathan</text>

  <rect x="180" y="360" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="230" y="376" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="330" y="376" text-anchor="middle" font-size="11" fill="#333">Moustafa</text>

  <!-- Summary -->
  <rect x="60" y="394" width="440" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">三位客户均有 6 月订单且总消费 ≥ $100 → 全部入选</text>
</svg>
