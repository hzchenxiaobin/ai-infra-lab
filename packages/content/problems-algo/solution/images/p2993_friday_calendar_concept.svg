  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">周五列 3 → 10 → 17 → 24，相邻日期之差恰为 7</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">⌈day/7⌉ 依次得 1、2、3、4 —— 正是「当月第几个周五」</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">橙色 ✗ = 有交易但非周五（周二/周四/周日），被 WHERE 整体滤除</text>
