<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次遍历 + 维护前缀最大值 mx</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">每步 O(1)：更新 mx → 与步号比较 → 命中则计数。总 O(n) 时间、O(1) 空间</text>

  <!-- ====== init ====== -->
  <rect x="240" y="62" width="160" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">初始化 ans=0, mx=0</text>
  <path d="M 320 104 L 320 122" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ====== loop header ====== -->
  <rect x="220" y="124" width="200" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="150" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">for i = 0 … n-1 （步号 i+1）</text>
  <path d="M 320 166 L 320 184" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ====== update mx ====== -->
  <rect x="220" y="186" width="200" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="214" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">mx = max(mx, flips[i])</text>
  <path d="M 320 232 L 320 250" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ====== diamond: mx == i+1? ====== -->
  <polygon points="320,252 404,296 320,340 236,296" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="292" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">mx == i+1 ?</text>
  <text x="320" y="308" text-anchor="middle" font-size="10" fill="#a85a56">前缀 [1,i+1] 全 1?</text>

  <!-- yes branch -> ans++ -->
  <path d="M 404 296 L 470 296" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="436" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="472" y="276" width="120" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="532" y="302" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">ans += 1</text>
  <text x="532" y="316" text-anchor="middle" font-size="9" fill="#5a8a5a">命中前缀一致</text>

  <!-- no branch label -->
  <text x="300" y="356" text-anchor="end" font-size="11" fill="#888" font-weight="bold">否</text>
  <path d="M 320 340 L 320 360" stroke="#888" stroke-width="1.4" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>

  <!-- merge: loop back arrow from ans++ and no-branch back to loop header -->
  <!-- from ans++ bottom down then left back up to loop header left side -->
  <path d="M 532 318 L 532 372 L 150 372 L 150 145 L 218 145" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <path d="M 320 360 L 320 372" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="340" y="388" font-size="11" fill="#d6a040" font-weight="bold">i++，处理下一个（回到循环头）</text>

  <!-- ====== end: return ans (after loop) ====== -->
  <rect x="440" y="62" width="170" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="525" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">循环结束 → return ans</text>
  <text x="525" y="102" text-anchor="middle" font-size="9" fill="#5a8a5a">i 走完 0..n-1 即退出</text>
  <!-- dashed exit arrow from loop header right to return box -->
  <path d="M 420 145 L 470 145 L 470 104" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="445" y="138" font-size="10" fill="#4a7a3a">i==n 退出</text>

  <!-- bottom note -->
  <rect x="40" y="404" width="560" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="422" text-anchor="middle" font-size="11" fill="#444">关键：mx 编码「已翻位置的范围上界」，与步号 i+1 比较即知前缀是否归位</text>
</svg>
