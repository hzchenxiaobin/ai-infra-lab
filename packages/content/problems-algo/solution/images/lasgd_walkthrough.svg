<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr=[1,5,7,8,5,3,4,2,1], d = −2</text>

  <!-- Column headers -->
  <rect x="30" y="44" width="40" height="26" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="62" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">i</text>

  <rect x="70" y="44" width="40" height="26" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="62" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">arr[i]</text>

  <rect x="110" y="44" width="50" height="26" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="62" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">prev</text>

  <rect x="160" y="44" width="55" height="26" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="187" y="62" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">dp[prev]</text>

  <rect x="215" y="44" width="55" height="26" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="242" y="62" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">dp[v]</text>

  <rect x="270" y="44" width="40" height="26" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="62" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">ans</text>

  <rect x="310" y="44" width="220" height="26" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="62" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">说明</text>

  <!-- Row 0: i=0, v=1 -->
  <rect x="30" y="72" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="89" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="70" y="72" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="89" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="110" y="72" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="89" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="160" y="72" width="55" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="187" y="89" text-anchor="middle" font-size="11" fill="#b85450">—</text>
  <rect x="215" y="72" width="55" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="242" y="89" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="270" y="72" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="89" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="320" y="89" font-size="10" fill="#888">前驱 3 未出现，新起</text>

  <!-- Row 1: i=1, v=5 -->
  <rect x="30" y="98" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="115" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="70" y="98" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="115" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="110" y="98" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="115" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="160" y="98" width="55" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="187" y="115" text-anchor="middle" font-size="11" fill="#b85450">—</text>
  <rect x="215" y="98" width="55" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="242" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="270" y="98" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="115" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="320" y="115" font-size="10" fill="#888">前驱 7 未出现，新起</text>

  <!-- Row 2: i=2, v=7 -->
  <rect x="30" y="124" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="141" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="70" y="124" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="90" y="141" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <rect x="110" y="124" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="141" text-anchor="middle" font-size="11" fill="#333">9</text>
  <rect x="160" y="124" width="55" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="187" y="141" text-anchor="middle" font-size="11" fill="#b85450">—</text>
  <rect x="215" y="124" width="55" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="242" y="141" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="270" y="124" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="141" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="320" y="141" font-size="10" fill="#888">前驱 9 未出现，新起</text>

  <!-- Row 3: i=3, v=8 -->
  <rect x="30" y="150" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="167" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="70" y="150" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="167" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="110" y="150" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="167" text-anchor="middle" font-size="11" fill="#333">10</text>
  <rect x="160" y="150" width="55" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="187" y="167" text-anchor="middle" font-size="11" fill="#b85450">—</text>
  <rect x="215" y="150" width="55" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="242" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="270" y="150" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="167" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="320" y="167" font-size="10" fill="#888">前驱 10 未出现，新起</text>

  <!-- Row 4: i=4, v=5 (key transition) -->
  <rect x="30" y="176" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="193" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="70" y="176" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="90" y="193" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="110" y="176" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="135" y="193" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <rect x="160" y="176" width="55" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="187" y="193" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="215" y="176" width="55" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="242" y="193" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="270" y="176" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="290" y="193" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="320" y="193" font-size="10" fill="#d6a040">前驱 7 在，接上：7→5</text>

  <!-- Row 5: i=5, v=3 -->
  <rect x="30" y="202" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="219" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="70" y="202" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="90" y="219" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="110" y="202" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="135" y="219" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="160" y="202" width="55" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="187" y="219" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="215" y="202" width="55" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="242" y="219" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="270" y="202" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="290" y="219" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="320" y="219" font-size="10" fill="#d6a040">接上：7→5→3</text>

  <!-- Row 6: i=6, v=4 -->
  <rect x="30" y="228" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="245" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="70" y="228" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="245" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="110" y="228" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="245" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="160" y="228" width="55" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="187" y="245" text-anchor="middle" font-size="11" fill="#b85450">—</text>
  <rect x="215" y="228" width="55" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="242" y="245" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="270" y="228" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="245" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="320" y="245" font-size="10" fill="#888">前驱 6 未出现，新起</text>

  <!-- Row 7: i=7, v=2 -->
  <rect x="30" y="254" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="271" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="70" y="254" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="90" y="271" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="110" y="254" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="135" y="271" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="160" y="254" width="55" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="187" y="271" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="215" y="254" width="55" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="242" y="271" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="270" y="254" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="271" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="320" y="271" font-size="10" fill="#d6a040">接上：4→2</text>

  <!-- Row 8: i=8, v=1 (answer!) -->
  <rect x="30" y="280" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="297" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <rect x="70" y="280" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="297" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="110" y="280" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="135" y="297" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="160" y="280" width="55" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="187" y="297" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="215" y="280" width="55" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="242" y="297" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="270" y="280" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="290" y="297" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="320" y="297" font-size="10" fill="#b85450" font-weight="bold">接上：7→5→3→1 ⭐</text>

  <!-- Result box -->
  <rect x="80" y="330" width="400" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 4，子序列 [7, 5, 3, 1]</text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#888">下标 2→4→5→8，每步差 −2</text>

  <!-- Legend -->
  <rect x="80" y="395" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="406" font-size="10" fill="#555">命中前驱</text>
  <rect x="170" y="395" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="190" y="406" font-size="10" fill="#555">关键转移</text>
  <rect x="260" y="395" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="406" font-size="10" fill="#555">最终答案</text>
  <rect x="350" y="395" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="406" font-size="10" fill="#555">普通行</text>

  <text x="280" y="435" text-anchor="middle" font-size="10" fill="#aaa">i=4 时 dp[5] 被覆盖为 2（原 1），后续 i=5 以 5 为前驱时拿到最新最优值</text>
</svg>
