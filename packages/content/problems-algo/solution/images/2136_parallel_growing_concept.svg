<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：播种串行一条线，生长并行各自走</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">长生长先种 → 漫长生长期藏进后续播种期；短生长先种 → 长生长期裸露顶到末尾</text>

  <!-- ===== BAD ORDER: 短生长优先 ===== -->
  <rect x="64" y="58" width="540" height="116" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="76" y="74" font-size="12" fill="#b85450" font-weight="bold">✗ 短生长优先（按 growTime 升序）：C(g1) → B(g2) → A(g3)</text>

  <!-- planting bar -->
  <rect x="80" y="82" width="72" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="116" y="97" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">播 C</text>
  <rect x="152" y="82" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="164" y="97" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">B</text>
  <rect x="176" y="82" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="224" y="97" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">播 A</text>
  <text x="282" y="97" font-size="10" fill="#888">← 播种串行（共 8 天，恒定）</text>

  <!-- growing rows: A(红), B(橙), C(绿) -->
  <!-- A grows days 8-10, sticks out -->
  <rect x="272" y="114" width="72" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="64" y="125" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">A 生</text>
  <text x="350" y="125" font-size="10" fill="#b85450">长生长裸露在播种期之后！</text>
  <!-- B grows days 4-5 -->
  <rect x="176" y="132" width="48" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="64" y="143" text-anchor="end" font-size="10" fill="#d6a040" font-weight="bold">B 生</text>
  <!-- C grows day 3 -->
  <rect x="152" y="150" width="24" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="64" y="161" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">C 生</text>

  <!-- bloom markers -->
  <circle cx="344" cy="121" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="344" y="112" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">开11</text>
  <circle cx="224" cy="139" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <text x="224" y="175" text-anchor="middle" font-size="9" fill="#d6a040">开6</text>

  <!-- ans bad -->
  <rect x="470" y="110" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="530" y="131" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">ans = 11</text>

  <!-- ===== GOOD ORDER: 长生长优先 ===== -->
  <rect x="64" y="186" width="540" height="124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="76" y="202" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 长生长优先（按 growTime 降序）：A(g3) → B(g2) → C(g1)</text>

  <!-- planting bar -->
  <rect x="80" y="210" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="128" y="225" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">播 A</text>
  <rect x="176" y="210" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="188" y="225" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">B</text>
  <rect x="200" y="210" width="72" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="236" y="225" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">播 C</text>
  <text x="282" y="225" font-size="10" fill="#888">← 播种串行（同样 8 天）</text>

  <!-- overlap highlight: A 的生长期与播 B、C 重叠 -->
  <rect x="176" y="240" width="96" height="60" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="224" y="252" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">重叠区</text>

  <!-- A grows days 4-6 -->
  <rect x="176" y="242" width="72" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="64" y="253" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">A 生</text>
  <text x="252" y="253" font-size="10" fill="#4a7a3a">藏进播 B、C 期内</text>
  <!-- B grows days 5-6 -->
  <rect x="200" y="260" width="48" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="64" y="271" text-anchor="end" font-size="10" fill="#d6a040" font-weight="bold">B 生</text>
  <!-- C grows day 8 -->
  <rect x="272" y="278" width="24" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="64" y="289" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">C 生</text>

  <!-- bloom markers -->
  <circle cx="248" cy="249" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="248" y="240" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">开7</text>
  <circle cx="296" cy="285" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="296" y="302" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">开9</text>

  <!-- ans good -->
  <rect x="470" y="246" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="530" y="267" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">ans = 9</text>

  <!-- ===== day axis ===== -->
  <line x1="80" y1="330" x2="344" y2="330" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="9" fill="#888" text-anchor="middle">
    <text x="80" y="346">0</text>
    <text x="128" y="346">2</text>
    <text x="176" y="346">4</text>
    <text x="224" y="346">6</text>
    <text x="272" y="346">8</text>
    <text x="320" y="346">10</text>
  </g>
  <text x="200" y="362" text-anchor="middle" font-size="10" fill="#888">天</text>

  <!-- footer insight -->
  <rect x="80" y="376" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="397" text-anchor="middle" font-size="11" fill="#d6a040">总播种天数恒为 8（与顺序无关）→ 顺序只决定 growTime 与哪个时刻配对</text>
</svg>
