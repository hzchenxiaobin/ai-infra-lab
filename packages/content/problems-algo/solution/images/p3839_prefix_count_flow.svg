<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="352" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：过滤 → 取前缀 → 计数 → 数桶</text>

  <!-- 起点 -->
  <g filter="url(#rough2)">
    <rect x="185" y="38" width="170" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="270" y="58" text-anchor="middle" font-size="12.5" fill="#333">取下一个单词 w</text>
  </g>

  <path d="M 270 70 L 270 90" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <g filter="url(#rough2)">
    <polygon points="270,94 345,129 270,164 195,129" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="270" y="134" text-anchor="middle" font-size="12" fill="#8a6d1a">len(w) ≥ k ?</text>
  </g>

  <!-- 否：短单词跳过 -->
  <path d="M 195 129 L 152 129" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="173" y="120" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="25" y="111" width="125" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="87" y="133" text-anchor="middle" font-size="12" fill="#b85450">短单词：跳过</text>
  </g>
  <path d="M 87 111 L 87 54 L 183 54" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="122" y="46" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">换下一个</text>

  <!-- 是：取前缀 -->
  <path d="M 270 164 L 270 186" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="185" y="189" width="170" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="270" y="209" text-anchor="middle" font-size="12.5" fill="#333">key = w 的前 k 位</text>
  </g>

  <path d="M 270 221 L 270 243" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计数 -->
  <g filter="url(#rough2)">
    <rect x="185" y="246" width="170" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="270" y="266" text-anchor="middle" font-size="12.5" fill="#2f5d24">cnt[key] += 1</text>
  </g>

  <!-- 循环回路 -->
  <path d="M 355 262 L 470 262 L 470 54 L 357 54" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="468" y="158" text-anchor="middle" font-size="11" fill="#666" transform="rotate(-90 468 158)" filter="url(#rough2)">还有单词，回到开头</text>

  <!-- 扫描结束 -->
  <path d="M 270 278 L 270 296" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="155" y="299" width="230" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="270" y="320" text-anchor="middle" font-size="11.5" fill="#8a6d1a">扫描结束：数出 cnt 中 ≥ 2 的桶</text>
  </g>

  <path d="M 385 316 L 408 316" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="411" y="299" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="461" y="320" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">返回 ans</text>
  </g>
</svg>
