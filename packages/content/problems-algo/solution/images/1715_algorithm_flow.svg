<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：FROM Boxes → LEFT JOIN Chests → IFNULL → SUM</text>

  <!-- Step 1: FROM Boxes -->
  <g filter="url(#rough2)">
    <rect x="60" y="48" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="76" y="70" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① FROM Boxes b</text>
  <text x="76" y="90" font-size="10" fill="#555" filter="url(#rough2)">取出全部盒子行（左表），无论有无箱子都保留</text>
  <!-- mini table -->
  <g filter="url(#rough2)" font-size="8" fill="#888" text-anchor="middle">
    <text x="320" y="68">box_id</text>
    <text x="380" y="68">chest_id</text>
    <text x="448" y="68">apple/orange</text>
    <text x="320" y="84">2</text>
    <text x="380" y="84">NULL</text>
    <text x="448" y="84">6 / 15</text>
    <text x="320" y="98">18</text>
    <text x="380" y="98">14</text>
    <text x="448" y="98">4 / 15</text>
  </g>

  <!-- arrow -->
  <path d="M 290 108 L 290 120" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: LEFT JOIN -->
  <g filter="url(#rough2)">
    <rect x="60" y="124" width="460" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
  </g>
  <text x="76" y="146" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② LEFT JOIN Chests c ON b.chest_id = c.chest_id</text>
  <text x="76" y="166" font-size="10" fill="#555" filter="url(#rough2)">把箱子的水果「挂」到对应盒子旁；chest_id=NULL 的行 c.* 全为 NULL</text>
  <text x="76" y="184" font-size="10" fill="#b85450" filter="url(#rough2)">⚠️ 必须左连接：INNER JOIN 会丢掉无箱子的盒子</text>

  <!-- arrow -->
  <path d="M 290 200 L 290 212" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: IFNULL -->
  <g filter="url(#rough2)">
    <rect x="60" y="216" width="460" height="72" fill="#fff" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="76" y="238" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ IFNULL(c.apple_count, 0) / IFNULL(c.orange_count, 0)</text>
  <text x="76" y="258" font-size="10" fill="#555" filter="url(#rough2)">逐行算每盒子水果 = b.apple + IFNULL(c.apple,0) 、b.orange + IFNULL(c.orange,0)</text>
  <text x="76" y="276" font-size="10" fill="#4a7a3a" filter="url(#rough2)">NULL → 0：无箱子的盒子只计直接存放，不漏不加</text>

  <!-- arrow -->
  <path d="M 290 292 L 290 304" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: SUM -->
  <g filter="url(#rough2)">
    <rect x="60" y="308" width="460" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <text x="76" y="330" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ SUM(...) AS apple_count, SUM(...) AS orange_count</text>
  <text x="76" y="350" font-size="10" fill="#555" filter="url(#rough2)">把所有盒子的水果求和，输出单行结果</text>

  <!-- arrow -->
  <path d="M 290 368 L 290 380" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: Result -->
  <g filter="url(#rough2)">
    <rect x="60" y="384" width="460" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
  </g>
  <text x="76" y="406" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑤ 结果：单行 apple_count=151, orange_count=123</text>
  <text x="76" y="424" font-size="10" fill="#555" filter="url(#rough2)">注意：Chests 中未被任何盒子引用的箱子（如 chest_id=16）不参与统计</text>

  <!-- side note: unreferenced chest -->
  <g filter="url(#rough2)">
    <rect x="430" y="124" width="86" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
  </g>
  <text x="473" y="142" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">Chest 16</text>
  <text x="473" y="156" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">无人引用→不计</text>

  <!-- right margin step labels -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="540" y="80">保留</text>
    <text x="540" y="160">挂载</text>
    <text x="540" y="252">补零</text>
    <text x="540" y="336">聚合</text>
  </g>
</svg>
