<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：已处理集合是连续区间，一条腿按 k × d 计价</text>
    <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">示例 3：n = 10，start = 5，requests = [0, 2, 9] ⇒ P = [0, 2, 5, 9]，图中当前状态 dp[1][2][0]</text>

    <!-- elevator box above P[1] -->
    <rect x="164" y="58" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="190" y="76" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">电梯</text>
    <path d="M 190 86 L 190 140" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" fill="none"/>

    <!-- served interval over floors 2..5 -->
    <rect x="163" y="104" width="190" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="258" y="122" text-anchor="middle" font-size="9.5" fill="#2f5527" font-weight="bold">已处理区间 P[1..2] = {2, 5}</text>
    <text x="258" y="137" text-anchor="middle" font-size="8.5" fill="#4a7a3a">dp = 9（此前 5→2 这腿：k=3, d=3）</text>
    <text x="258" y="150" text-anchor="middle" font-size="8.5" fill="#4a7a3a">区间永远包含 start</text>

    <!-- floor axis -->
    <path d="M 78 152 H 545" stroke="#999" stroke-width="1.6" marker-end="url(#arrG)" fill="none"/>
    <text x="562" y="156" font-size="10" fill="#777">楼层</text>

    <!-- floor points -->
    <circle cx="100" cy="152" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="100" y="174" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">0</text>
    <text x="100" y="187" text-anchor="middle" font-size="8.5" fill="#a87020">P[0] 未处理</text>

    <circle cx="190" cy="152" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="190" y="174" text-anchor="middle" font-size="10" fill="#2f5527" font-weight="bold">2</text>
    <text x="190" y="187" text-anchor="middle" font-size="8.5" fill="#2f5527">P[1] 已处理（左端）</text>

    <circle cx="325" cy="152" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="325" cy="152" r="9" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="325" y="174" text-anchor="middle" font-size="10" fill="#2f5527" font-weight="bold">5</text>
    <text x="325" y="187" text-anchor="middle" font-size="8.5" fill="#2f5527">P[2] = start</text>

    <circle cx="505" cy="152" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="505" y="174" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">9</text>
    <text x="505" y="187" text-anchor="middle" font-size="8.5" fill="#a87020">P[3] 未处理</text>

    <!-- expansion arrows below axis -->
    <path d="M 182 216 L 112 216" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" fill="none"/>
    <text x="145" y="234" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">左扩 → 吃掉 P[0] = 0</text>
    <text x="145" y="248" text-anchor="middle" font-size="9" fill="#8a3a35">d = 2，k = 2 ⇒ 惩罚 +4</text>

    <path d="M 198 216 L 496 216" stroke="#446688" stroke-width="2.2" marker-end="url(#arrB)" fill="none"/>
    <text x="348" y="234" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">右扩 → 吃掉 P[3] = 9</text>
    <text x="348" y="248" text-anchor="middle" font-size="9" fill="#33506b">d = 7，k = 2 ⇒ 惩罚 +14</text>

    <!-- pricing rule box -->
    <rect x="40" y="268" width="540" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="310" y="290" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">计价规则：一条腿 = k × d</text>
    <text x="58" y="310" font-size="9.5" fill="#7a5c1a">移动 d 秒：期间每个未处理请求各计 d 点（含目标——到达那一秒它才被处理，处理时刻 t 本就含到达时刻）</text>
    <text x="58" y="328" font-size="9.5" fill="#7a5c1a">未处理数 k = M − 移动前区间长度（M = m + 1：请求数 + start 占位）</text>
    <text x="58" y="346" font-size="9.5" fill="#7a5c1a">⇒ 每步增量只由前后状态决定：总惩罚 = 各腿 k·d 之和，状态里完全不必记录时刻</text>

    <!-- observations box -->
    <rect x="40" y="380" width="540" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="310" y="402" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">三个观察 ⇒ 区间 DP</text>
    <text x="58" y="424" font-size="9.5" fill="#33506b">① 路过即处理 ⇒ 已处理集合是排序数组（插入 start 后为 P）的连续区间，且恒包含 s</text>
    <text x="58" y="442" font-size="9.5" fill="#33506b">② 最优轨迹每条腿都以「处理新请求」收尾 ⇒ 电梯总停在区间端点：状态 (l, r, side)</text>
    <text x="58" y="460" font-size="9.5" fill="#33506b">③ 惩罚 = Σ k·d = 区间扩张 DAG 的路径边权和 ⇒ 直接 DP 取 min，O(M²) 收工</text>
    <text x="58" y="482" font-size="8.5" fill="#6b7f99">（n ≤ 10⁹ 只定值域；答案 ≤ m²·n ≈ 2.25×10¹⁵，必须 64 位整数；M = m + 1 ≤ 1501）</text>
    <text x="58" y="502" font-size="8.5" fill="#6b7f99">（贪心死刑：start = 4, requests = [2,5,9,10]——最近邻 28，先左吃 2 再右扫 5/9/10 只要 26）</text>
  </g>
</svg>
