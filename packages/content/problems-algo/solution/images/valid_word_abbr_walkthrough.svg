<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：word="internationalization", abbr="i12iz4n" → true</text>

  <!-- word strip header -->
  <text x="30" y="58" font-size="11" fill="#888" font-weight="bold">word:</text>
  <!-- 20 letters: i n t e r n a t i o n a l i z a t i o n ; cell 24 wide -->
  <g font-size="11" fill="#333">
    <!-- row of letters, will color per step -->
    <rect x="70" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="82" y="60" text-anchor="middle">i</text>
    <rect x="94" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="106" y="60" text-anchor="middle">n</text>
    <rect x="118" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="130" y="60" text-anchor="middle">t</text>
    <rect x="142" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="154" y="60" text-anchor="middle">e</text>
    <rect x="166" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="178" y="60" text-anchor="middle">r</text>
    <rect x="190" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="202" y="60" text-anchor="middle">n</text>
    <rect x="214" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="226" y="60" text-anchor="middle">a</text>
    <rect x="238" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="250" y="60" text-anchor="middle">t</text>
    <rect x="262" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="274" y="60" text-anchor="middle">i</text>
    <rect x="286" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="298" y="60" text-anchor="middle">o</text>
    <rect x="310" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="322" y="60" text-anchor="middle">n</text>
    <rect x="334" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="346" y="60" text-anchor="middle">a</text>
    <rect x="358" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="370" y="60" text-anchor="middle">l</text>
    <rect x="382" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="394" y="60" text-anchor="middle">i</text>
    <rect x="406" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="418" y="60" text-anchor="middle">z</text>
    <rect x="430" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="442" y="60" text-anchor="middle">a</text>
    <rect x="454" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="466" y="60" text-anchor="middle">t</text>
    <rect x="478" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="490" y="60" text-anchor="middle">i</text>
    <rect x="502" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="514" y="60" text-anchor="middle">o</text>
    <rect x="526" y="44" width="24" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="538" y="60" text-anchor="middle">n</text>
  </g>

  <!-- index labels -->
  <g font-size="8" fill="#aaa" text-anchor="middle">
    <text x="82" y="80">0</text><text x="106" y="80">1</text><text x="130" y="80">2</text>
    <text x="154" y="80">3</text><text x="178" y="80">4</text><text x="202" y="80">5</text>
    <text x="226" y="80">6</text><text x="250" y="80">7</text><text x="274" y="80">8</text>
    <text x="298" y="80">9</text><text x="322" y="80">10</text><text x="346" y="80">11</text>
    <text x="370" y="80">12</text><text x="394" y="80">13</text><text x="418" y="80">14</text>
    <text x="442" y="80">15</text><text x="466" y="80">16</text><text x="490" y="80">17</text>
    <text x="514" y="80">18</text><text x="538" y="80">19</text>
  </g>

  <!-- Step rows: step | abbr[j] | action | i after | j after -->
  <text x="30" y="110" font-size="11" fill="#888" font-weight="bold">步</text>
  <text x="70" y="110" font-size="11" fill="#888" font-weight="bold">abbr[j]</text>
  <text x="150" y="110" font-size="11" fill="#888" font-weight="bold">动作</text>
  <text x="330" y="110" font-size="11" fill="#888" font-weight="bold">i 后</text>
  <text x="400" y="110" font-size="11" fill="#888" font-weight="bold">j 后</text>

  <!-- divider -->
  <path d="M 24 116 L 540 116" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- Step 1: abbr[0]='i' letter, match word[0]='i', i->1, j->1 -->
  <text x="30" y="138" font-size="11" fill="#333">1</text>
  <rect x="64" y="126" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="76" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="150" y="140" font-size="11" fill="#446688">字母，word[0]='i' ✓ → i++, j++</text>
  <text x="330" y="140" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="400" y="140" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Step 2: abbr[1..2]="12" digit, num=12, i += 12 -> 13, j -> 3 -->
  <text x="30" y="170" font-size="11" fill="#333">2</text>
  <rect x="64" y="158" width="48" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="88" y="172" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">12</text>
  <text x="150" y="172" font-size="11" fill="#d6a040">数字段 num=12 → i += 12（跳过 1..12）</text>
  <text x="330" y="172" font-size="11" fill="#333" font-weight="bold">13</text>
  <text x="400" y="172" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Step 3: abbr[3]='i' letter, word[13]='i' ✓ -->
  <text x="30" y="202" font-size="11" fill="#333">3</text>
  <rect x="64" y="190" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="76" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="150" y="204" font-size="11" fill="#446688">字母，word[13]='i' ✓ → i++, j++</text>
  <text x="330" y="204" font-size="11" fill="#333" font-weight="bold">14</text>
  <text x="400" y="204" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Step 4: abbr[4]='z' letter, word[14]='z' ✓ -->
  <text x="30" y="234" font-size="11" fill="#333">4</text>
  <rect x="64" y="222" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="76" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">z</text>
  <text x="150" y="236" font-size="11" fill="#446688">字母，word[14]='z' ✓ → i++, j++</text>
  <text x="330" y="236" font-size="11" fill="#333" font-weight="bold">15</text>
  <text x="400" y="236" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- Step 5: abbr[5..6]="4" digit, num=4, i += 4 -> 19, j -> 7  (wait abbr="i12iz4n": i(0)12(1-2)i(3)z(4)4(5)n(6). So abbr[5]='4', j->6) -->
  <text x="30" y="266" font-size="11" fill="#333">5</text>
  <rect x="64" y="254" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="76" y="268" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="150" y="268" font-size="11" fill="#d6a040">数字段 num=4 → i += 4（跳过 15..18）</text>
  <text x="330" y="268" font-size="11" fill="#333" font-weight="bold">19</text>
  <text x="400" y="268" font-size="11" fill="#333" font-weight="bold">6</text>

  <!-- Step 6: abbr[6]='n' letter, word[19]='n' ✓ -->
  <text x="30" y="298" font-size="11" fill="#333">6</text>
  <rect x="64" y="286" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="76" y="300" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">n</text>
  <text x="150" y="300" font-size="11" fill="#446688">字母，word[19]='n' ✓ → i++, j++</text>
  <text x="330" y="300" font-size="11" fill="#333" font-weight="bold">20</text>
  <text x="400" y="300" font-size="11" fill="#333" font-weight="bold">7</text>

  <!-- Final: i==20==n, j==7==m → true -->
  <rect x="24" y="316" width="516" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">末态：i==20==len(word) 且 j==7==len(abbr) → 返回 true ✓</text>

  <!-- Negative example panel -->
  <rect x="24" y="360" width="516" height="160" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">反例：word="apple", abbr="a2e" → false</text>

  <!-- apple cells -->
  <g font-size="12" fill="#333">
    <rect x="80" y="396" width="32" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="96" y="415" text-anchor="middle">a</text>
    <text x="96" y="436" text-anchor="middle" font-size="8" fill="#aaa">0</text>
    <rect x="112" y="396" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="128" y="415" text-anchor="middle">p</text>
    <text x="128" y="436" text-anchor="middle" font-size="8" fill="#aaa">1</text>
    <rect x="144" y="396" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="160" y="415" text-anchor="middle">p</text>
    <text x="160" y="436" text-anchor="middle" font-size="8" fill="#aaa">2</text>
    <rect x="176" y="396" width="32" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="192" y="415" text-anchor="middle">l</text>
    <text x="192" y="436" text-anchor="middle" font-size="8" fill="#aaa">3</text>
    <rect x="208" y="396" width="32" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="224" y="415" text-anchor="middle">e</text>
    <text x="224" y="436" text-anchor="middle" font-size="8" fill="#aaa">4</text>
  </g>

  <text x="260" y="408" font-size="11" fill="#555">① 'a'==word[0] ✓ → i=1, j=1</text>
  <text x="260" y="428" font-size="11" fill="#d6a040">② 数字 2 → i=3, j=2</text>
  <text x="260" y="448" font-size="11" fill="#b85450" font-weight="bold">③ 'e' vs word[3]='l' ✗ → 返回 false</text>
  <text x="260" y="468" font-size="10" fill="#888">即使后续长度能对上，字母不匹配也立即失败</text>

  <!-- leading zero mini note -->
  <rect x="40" y="484" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="502" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">边界：abbr 中出现 "0" 或 "01" 等前导零 → 直接 false</text>
</svg>
