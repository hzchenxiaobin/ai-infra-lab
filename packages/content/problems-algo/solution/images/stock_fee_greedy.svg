<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">贪心后悔机制：卖后 buy=p 不加 fee，留撤回余地</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">prices=[1,3,2,8,4,9], fee=2，有效成本 buy=price+fee</text>

  <!-- ===== price line chart ===== -->
  <!-- y mapping: price 0..9 -> y 240..100 ; scale ~15.5 per unit, base 240 -->
  <!-- points: (1,1)(3,3)(5,2)(7,8)(9,4)(11,9) x at 60,130,200,270,340,410 step 70 -->
  <g font-size="10">
    <!-- axes -->
    <line x1="50" y1="100" x2="50" y2="250" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="50" y1="250" x2="430" y2="250" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="42" y="104" text-anchor="end" font-size="9" fill="#888">价</text>
    <text x="434" y="254" font-size="9" fill="#888">天</text>

    <!-- price polyline: p=[1,3,2,8,4,9], y=240-p*15 -->
    <path d="M 80 225 L 150 195 L 220 210 L 290 120 L 360 180 L 430 105"
          stroke="#446688" stroke-width="2" fill="none" stroke-linejoin="round" filter="url(#rough2)"/>

    <!-- price dots + labels -->
    <g fill="#446688">
      <circle cx="80"  cy="225" r="3.5" filter="url(#rough2)"/>
      <circle cx="150" cy="195" r="3.5" filter="url(#rough2)"/>
      <circle cx="220" cy="210" r="3.5" filter="url(#rough2)"/>
      <circle cx="290" cy="120" r="3.5" filter="url(#rough2)"/>
      <circle cx="360" cy="180" r="3.5" filter="url(#rough2)"/>
      <circle cx="430" cy="105" r="3.5" filter="url(#rough2)"/>
    </g>
    <g font-size="9" fill="#446688" font-weight="bold">
      <text x="80"  y="240" text-anchor="middle">1</text>
      <text x="150" y="186" text-anchor="middle">3</text>
      <text x="220" y="225" text-anchor="middle">2</text>
      <text x="290" y="112" text-anchor="middle">8</text>
      <text x="360" y="195" text-anchor="middle">4</text>
      <text x="430" y="98"  text-anchor="middle">9</text>
    </g>

    <!-- buy cost line: buy=3 until i=3 sell -> buy=8; then i=4 reset buy=6; then i=5 sell -->
    <!-- buy=3: y=240-3*15=195 from x80..290 -->
    <line x1="80" y1="195" x2="290" y2="195" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="120" y="188" font-size="8.5" fill="#d6a040">buy=3(=1+2)</text>

    <!-- sell at 8: profit += 8-3 = 5 -->
    <rect x="262" y="92" width="58" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="291" y="106" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">卖 +5</text>

    <!-- undo: buy=8 (no fee) at x290..360 -->
    <line x1="290" y1="120" x2="360" y2="120" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="318" y="135" font-size="8.5" fill="#b85450">buy=8(不加fee)</text>

    <!-- reset buy=6 at x360..430 -->
    <line x1="360" y1="150" x2="430" y2="150" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="388" y="165" font-size="8.5" fill="#d6a040">buy=6(=4+2)</text>

    <!-- sell at 9: profit += 9-6 = 3 -->
    <rect x="402" y="78" width="58" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="431" y="92" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">卖 +3</text>

    <!-- undo arrow from sell@8 to its buy=8 line, indicating "could re-sell higher" -->
    <path d="M 290 120 C 320 70, 360 75, 360 180" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
    <text x="338" y="62" text-anchor="middle" font-size="8.5" fill="#b85450">若次日更高价 q&gt;8 → 再累加 q−8 = 直接卖在 q</text>
  </g>

  <!-- ===== explanation box ===== -->
  <line x1="20" y1="270" x2="520" y2="270" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="10" fill="#333">
    <text x="30" y="290" font-size="11" fill="#444" font-weight="bold">为什么卖后 buy=p 不加 fee 是对的？</text>
    <text x="40" y="308" font-size="9.5" fill="#555">① 卖在 p 时 buy_old 已含一次 fee，利润 p − buy_old 已扣费；</text>
    <text x="40" y="322" font-size="9.5" fill="#555">② 设 buy=p（不加 fee），次日 q&gt;p 再累加 q−p，两段和 = q − buy_old；</text>
    <text x="40" y="336" font-size="9.5" fill="#555">③ 等价于「直接卖在 q」只付一次费 —— 撤回了过早的卖出。</text>
    <text x="40" y="350" font-size="9.5" fill="#888">若次日更低 p′+fee &lt; buy，则重置 buy=p′+fee 开新交易。</text>
  </g>

  <!-- ===== Result ===== -->
  <rect x="30" y="362" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="380" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">profit = 5 + 3 = 8，与 DP 结果一致 · O(n) 时间 O(1) 空间</text>
</svg>
