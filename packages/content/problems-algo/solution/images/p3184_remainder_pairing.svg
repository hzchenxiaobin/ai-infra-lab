<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：只关心「模 24 的余数」，24 个余数桶两两配对</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">(a + b) mod 24 = 0 ⟺ 两个余数的和 ∈ {0, 24} —— 与 hours[i] 本身多大无关</text>

  <path d="M 60 146 Q 269 0 478 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="269" y="66" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1 + 23 = 24</text>

  <path d="M 117 146 Q 269 40 421 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="269" y="86" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">4 + 20 = 24</text>

  <path d="M 250 146 Q 269 78 288 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="269" y="105" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">11 + 13 = 24</text>

  <text x="28" y="171" text-anchor="end" font-size="10" fill="#777" filter="url(#rough2)">r =</text>

  <rect x="32" y="150" width="18" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="41" y="171" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="51" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="70" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="79" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="89" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="98" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="108" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="117" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="127" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="136" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="146" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">6</text>
  <rect x="165" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="174" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">7</text>
  <rect x="184" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="193" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">8</text>
  <rect x="203" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="212" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">9</text>
  <rect x="222" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="231" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">10</text>
  <rect x="241" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">11</text>
  <rect x="260" y="150" width="18" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="269" y="171" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="279" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="288" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">13</text>
  <rect x="298" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">14</text>
  <rect x="317" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="326" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">15</text>
  <rect x="336" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="345" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">16</text>
  <rect x="355" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="364" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">17</text>
  <rect x="374" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="383" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">18</text>
  <rect x="393" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="402" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">19</text>
  <rect x="412" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="421" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">20</text>
  <rect x="431" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="440" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">21</text>
  <rect x="450" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="459" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">22</text>
  <rect x="469" y="150" width="18" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="478" y="171" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">23</text>

  <path d="M 58 220 L 44 190" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <rect x="10" y="222" width="172" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="96" y="243" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">r = 0 自配对：C(cnt[0], 2)</text>

  <path d="M 269 220 L 269 190" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <rect x="196" y="222" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="286" y="243" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">r = 12 自配对：C(cnt[12], 2)</text>

  <path d="M 445 220 L 442 190" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <rect x="392" y="222" width="118" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="451" y="236" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">r ↔ 24 − r 互补</text>
  <text x="451" y="250" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">（r = 1 … 11，只算一半）</text>

  <rect x="16" y="270" width="488" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="297" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans = C(cnt[0], 2) + C(cnt[12], 2) + Σ(r=1…11) cnt[r] · cnt[24 − r]</text>

  <rect x="16" y="326" width="488" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 两个高频错误</text>
  <text x="260" y="366" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">① 漏掉 0、12 两个「自配对」类——它们在桶内两两组合，贡献 C(cnt, 2) 而非与其他桶配对</text>
  <text x="260" y="382" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">② r 只枚举 1 … 11；若把 13 … 23 再各算一遍，每个数对被数两次，答案恰好翻倍</text>
</svg>
