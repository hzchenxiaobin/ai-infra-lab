<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">heightOfTree(root) 递归流程</text>

  <!-- 入口 -->
  <rect x="190" y="46" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">输入 root（非空）</text>
  <line x1="260" y1="80" x2="260" y2="98" stroke="#446688" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,98 392,142 260,186 128,142" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">root.left != null</text>
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">且 left.right == root ?</text>

  <!-- 是 → 叶子 -->
  <line x1="392" y1="142" x2="430" y2="142" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="408" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="430" y="118" width="80" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="470" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">叶子</text>
  <text x="470" y="155" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">return 1</text>

  <!-- 否 → 内部节点处理 -->
  <line x1="260" y1="186" x2="260" y2="206" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="200" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="120" y="208" width="280" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">best = 0</text>
  <text x="260" y="250" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">若 left  → best = max(best, dfs(left))</text>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">若 right → best = max(best, dfs(right))</text>

  <line x1="260" y1="284" x2="260" y2="302" stroke="#446688" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="180" y="304" width="160" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">return 1 + best</text>
</svg>
