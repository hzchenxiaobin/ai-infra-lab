<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：在有序 arr2 上判断邻域 [x-d, x+d] 是否落入元素</text>

  <!-- sorted arr2 label -->
  <text x="30" y="64" font-size="12" fill="#888">arr2 排序后 =</text>

  <!-- Number line 1: for x=4 (counts) -->
  <text x="30" y="104" font-size="12" fill="#4a7a3a" font-weight="bold">x = 4，d = 2 → 窗口 [2, 6]</text>

  <!-- the window rectangle for x=4: [2,6] mapped to x positions -->
  <!-- number line from x=70 (value -2) to x=560 (value 12), scale 32.7 px per unit -->
  <rect x="135.3" y="118" width="131" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)" opacity="0.75"/>
  <text x="200" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口 [2,6]</text>

  <!-- number line axis -->
  <line x1="70" y1="170" x2="570" y2="170" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arr2 elements as circles on the line: values 1,8,9,10 -->
  <!-- value v -> x = 70 + (v - (-2)) * (500/14) = 70 + (v+2)*35.7 -->
  <!-- v=1: 70+3*35.7=177.1 ; v=8: 70+10*35.7=427 ; v=9: 70+11*35.7=462.7 ; v=10: 70+12*35.7=498.4 -->
  <circle cx="177" cy="170" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177" y="174" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <circle cx="427" cy="170" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="174" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">8</text>

  <circle cx="463" cy="170" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="463" y="174" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">9</text>

  <circle cx="498" cy="170" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="498" y="174" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>

  <!-- axis ticks for window bounds 2 and 6 -->
  <!-- v=2: 70+4*35.7=212.8 ; v=6: 70+8*35.7=355.6 -->
  <line x1="213" y1="166" x2="213" y2="156" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="213" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a">2</text>
  <line x1="356" y1="166" x2="356" y2="156" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="356" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a">6</text>

  <!-- lower_bound(2) points to 8, which is > 6 -->
  <text x="427" y="200" text-anchor="middle" font-size="10" fill="#888">↑ lower_bound(2) = 8</text>
  <text x="427" y="214" text-anchor="middle" font-size="10" fill="#888">8 &gt; 6 → 窗口内无元素</text>

  <!-- result for x=4 -->
  <rect x="430" y="100" width="170" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="515" y="123" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 无近邻 → 计数</text>

  <!-- Divider -->
  <line x1="20" y1="238" x2="600" y2="238" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Number line 2: for x=8 (doesn't count) -->
  <text x="30" y="268" font-size="12" fill="#b85450" font-weight="bold">x = 8，d = 2 → 窗口 [6, 10]</text>

  <!-- the window rectangle for x=8: [6,10] -->
  <rect x="355.6" y="282" width="142.8" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)" opacity="0.75"/>
  <text x="427" y="302" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">窗口 [6,10]</text>

  <!-- number line axis -->
  <line x1="70" y1="334" x2="570" y2="334" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arr2 elements: 1,8,9,10 ; highlight 8,9,10 in red as they fall in window -->
  <circle cx="177" cy="334" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177" y="338" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <circle cx="427" cy="334" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="427" y="338" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">8</text>

  <circle cx="463" cy="334" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="463" y="338" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">9</text>

  <circle cx="498" cy="334" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="498" y="338" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">10</text>

  <!-- ticks for 6 and 10 -->
  <line x1="356" y1="330" x2="356" y2="320" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="356" y="316" text-anchor="middle" font-size="10" fill="#b85450">6</text>
  <line x1="498" y1="330" x2="498" y2="320" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="498" y="316" text-anchor="middle" font-size="10" fill="#b85450">10</text>

  <!-- lower_bound(6) points to 8, which is <= 10 -->
  <text x="427" y="362" text-anchor="middle" font-size="10" fill="#888">↑ lower_bound(6) = 8</text>
  <text x="427" y="376" text-anchor="middle" font-size="10" fill="#888">8 ≤ 10 → 窗口内有 8,9,10</text>

  <!-- result for x=8 -->
  <rect x="430" y="264" width="170" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="515" y="287" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 有近邻 → 跳过</text>

  <!-- bottom note -->
  <text x="310" y="394" text-anchor="middle" font-size="11" fill="#888">arr2 排序后，lower_bound(x-d) 命中的首个候选一锤定音：&gt; x+d 则无近邻，≤ x+d 则有近邻</text>
</svg>
