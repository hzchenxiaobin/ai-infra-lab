<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：定位中间元素，一个计数器数到底</text>

  <!-- ① 定位中间元素 -->
  <text x="260" y="46" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 定位：mid = n / 2 = 5 / 2 = 2</text>
  <path d="M260,49 L260,55" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="56" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="128" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="166" y="56" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="194" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="232" y="56" width="56" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="14" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="298" y="56" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="326" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="364" y="56" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="392" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="128" y="108" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="194" y="108" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="260" y="108" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="326" y="108" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="392" y="108" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>

  <text x="260" y="127" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">nums[mid] = 3 —— 只关心这一个值</text>

  <!-- ② 一遍扫描 -->
  <text x="260" y="150" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 一遍扫描：nums 里有多少个 3？</text>

  <rect x="100" y="158" width="56" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="128" y="176" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1≠3</text>
  <rect x="166" y="158" width="56" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="194" y="176" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2≠3</text>
  <rect x="232" y="158" width="56" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="11" fill="#2f5527" font-weight="bold" filter="url(#rough2)">3=3 ✓</text>
  <rect x="298" y="158" width="56" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="326" y="176" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2≠3</text>
  <rect x="364" y="158" width="56" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="392" y="176" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">5≠3</text>

  <text x="260" y="211" text-anchor="middle" font-size="10.5" fill="#2f5527" font-weight="bold" filter="url(#rough2)">cnt = 1（只有中间格自己命中）⇒ true ✓</text>

  <!-- 判定示例 -->
  <rect x="40" y="228" width="222" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="151" y="247" text-anchor="middle" font-size="9.5" fill="#2f5527" filter="url(#rough2)">示例 1 [1,2,3]：中间值 2 出现 1 次</text>
  <text x="151" y="265" text-anchor="middle" font-size="11" fill="#2f5527" font-weight="bold" filter="url(#rough2)">→ 返回 true ✓</text>

  <rect x="285" y="228" width="222" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="396" y="247" text-anchor="middle" font-size="9.5" fill="#8f3a35" filter="url(#rough2)">示例 2 [1,2,2]：中间值 2 出现 2 次</text>
  <text x="396" y="265" text-anchor="middle" font-size="11" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">→ 返回 false ✗</text>

  <!-- 排序陷阱 -->
  <rect x="40" y="292" width="445" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="262" y="312" text-anchor="middle" font-size="9.5" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">⚠️ 排序陷阱：[5,1,5] 原中间是 1 → 答案 true</text>
  <text x="262" y="330" text-anchor="middle" font-size="9.5" fill="#8f3a35" filter="url(#rough2)">排序后 [1,5,5] 中间变 5 → 误判 false：排序挪动了中间元素！</text>
</svg>
