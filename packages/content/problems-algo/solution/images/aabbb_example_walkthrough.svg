<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：合法 "aaabbb" vs 非法 "abab"</text>

  <!-- ===== Example 1: aaabbb (valid) ===== -->
  <text x="310" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">示例 1: s = "aaabbb" → true</text>

  <!-- index labels -->
  <text x="120" y="78" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="170" y="78" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="220" y="78" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="270" y="78" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="320" y="78" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="370" y="78" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- cells: a a a b b b -->
  <rect x="100" y="86" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="109" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="150" y="86" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="109" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="200" y="86" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="109" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="250" y="86" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="109" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="300" y="86" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="109" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="350" y="86" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="370" y="109" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>

  <!-- step trace -->
  <rect x="420" y="88" width="180" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="510" y="108" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">逐步追踪</text>
  <text x="430" y="128" font-size="10" fill="#555">i=0 a: seen_b=F → 继续</text>
  <text x="430" y="144" font-size="10" fill="#555">i=1 a: seen_b=F → 继续</text>
  <text x="430" y="160" font-size="10" fill="#555">i=2 a: seen_b=F → 继续</text>
  <text x="430" y="176" font-size="10" fill="#555">i=3 b: seen_b=T → 继续</text>
  <text x="430" y="192" font-size="10" fill="#555">i=4,5 b: 继续 → 结束</text>

  <!-- result -->
  <rect x="180" y="140" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="159" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">无 "ba" 转移 → return true</text>

  <!-- ===== Example 2: abab (invalid) ===== -->
  <text x="310" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">示例 2: s = "abab" → false</text>

  <!-- index labels -->
  <text x="170" y="218" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="220" y="218" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="270" y="218" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <text x="320" y="218" text-anchor="middle" font-size="9" fill="#aaa">3</text>

  <!-- cells: a b a b -->
  <rect x="150" y="226" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="249" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="200" y="226" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="249" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <!-- the offending 'a' at index 2 - RED highlight -->
  <rect x="250" y="226" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="270" y="249" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">a</text>
  <rect x="300" y="226" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="249" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>

  <!-- arrow pointing to index 2 -->
  <path d="M 270 210 L 270 222" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="214" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">a 出现在 b 之后!</text>

  <!-- step trace -->
  <rect x="420" y="228" width="180" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="510" y="248" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">逐步追踪</text>
  <text x="430" y="268" font-size="10" fill="#555">i=0 a: seen_b=F → 继续</text>
  <text x="430" y="284" font-size="10" fill="#555">i=1 b: seen_b=T → 继续</text>
  <text x="430" y="300" font-size="10" fill="#b85450" font-weight="bold">i=2 a: seen_b=T → false!</text>

  <!-- "ba" pattern highlight -->
  <path d="M 200 270 Q 200 278 206 278 L 284 278 Q 290 278 290 270" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="245" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"ba" 子串 (下标 1-2)</text>

  <!-- result -->
  <rect x="150" y="306" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="325" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">发现 "ba" 转移 → return false</text>

  <!-- ===== Example 3: bbb (valid, no a) ===== -->
  <text x="310" y="358" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">示例 3: s = "bbb" → true（无 a，空真）</text>

  <!-- cells: b b b -->
  <rect x="230" y="372" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="392" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="270" y="372" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="310" y="372" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330" y="392" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <text x="310" y="420" text-anchor="middle" font-size="10" fill="#888">不存在 a，"所有 a 在所有 b 之前" 空真成立</text>

  <!-- Legend -->
  <rect x="40" y="376" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="56" y="386" font-size="9" fill="#888">a</text>
  <rect x="80" y="376" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="96" y="386" font-size="9" fill="#888">b</text>
  <rect x="130" y="376" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="146" y="386" font-size="9" fill="#888">违规 a</text>
</svg>
