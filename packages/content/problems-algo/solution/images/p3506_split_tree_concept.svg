<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#556677"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">方案 = 一棵「分裂树」：答案 = max(深度 × s + t)</text>

  <text x="14" y="90" font-size="11" fill="#999" filter="url(#rough2)">深度 0</text>
  <text x="14" y="172" font-size="11" fill="#999" filter="url(#rough2)">深度 1</text>
  <text x="14" y="262" font-size="11" fill="#999" filter="url(#rough2)">深度 2</text>

  <ellipse cx="280" cy="85" rx="42" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#2f5e23" filter="url(#rough2)">初始白细胞</text>
  <text x="280" y="97" text-anchor="middle" font-size="10" fill="#2f5e23" filter="url(#rough2)">（t = 0）</text>

  <path d="M256,97 Q200,122 172,148" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="122" font-size="11" fill="#4a7a3a" filter="url(#rough2)">分裂 s=2</text>

  <path d="M302,95 Q342,116 372,136" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="110" font-size="11" fill="#4a7a3a" filter="url(#rough2)">分裂 s=2</text>

  <circle cx="165" cy="166" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="170" text-anchor="middle" font-size="10" fill="#2f5e23" filter="url(#rough2)">分裂</text>

  <path d="M150,179 Q118,206 104,228" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="210" font-size="11" fill="#4a7a3a" filter="url(#rough2)">s=2</text>

  <path d="M180,179 Q212,206 234,228" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="218" y="210" font-size="11" fill="#4a7a3a" filter="url(#rough2)">s=2</text>

  <rect x="320" y="140" width="118" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="379" y="159" text-anchor="middle" font-size="12" fill="#8c3a34" filter="url(#rough2)">菌株 t=10</text>
  <text x="379" y="177" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">完成 1×2+10 = 12</text>
  <text x="444" y="167" font-size="11" fill="#b85450" filter="url(#rough2)">← 答案</text>

  <rect x="52" y="232" width="104" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="251" text-anchor="middle" font-size="12" fill="#33445c" filter="url(#rough2)">菌株 t=5</text>
  <text x="104" y="269" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">完成 2×2+5 = 9</text>

  <rect x="196" y="232" width="104" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="248" y="251" text-anchor="middle" font-size="12" fill="#33445c" filter="url(#rough2)">菌株 t=4</text>
  <text x="248" y="269" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">完成 2×2+4 = 8</text>

  <rect x="320" y="205" width="224" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="432" y="227" text-anchor="middle" font-size="12" fill="#7a5b1e" filter="url(#rough2)">每条根→叶路径：分裂串行累加</text>
  <text x="432" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#b8860b" filter="url(#rough2)">答案 = max(12, 9, 8) = 12</text>

  <text x="70" y="290" font-size="12" fill="#666" filter="url(#rough2)">时间轴（同一方案并行执行）</text>

  <text x="64" y="307" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">分裂①</text>
  <rect x="70" y="298" width="70" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="64" y="322" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">分裂②</text>
  <rect x="140" y="313" width="70" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="64" y="337" text-anchor="end" font-size="10.5" fill="#8c3a34" filter="url(#rough2)">菌株10</text>
  <rect x="140" y="328" width="350" height="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="64" y="352" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">菌株5</text>
  <rect x="210" y="343" width="175" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="64" y="367" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">菌株4</text>
  <rect x="210" y="358" width="140" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <line x1="490" y1="292" x2="490" y2="378" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="497" y="292" font-size="11" fill="#b85450" filter="url(#rough2)">答案 12</text>

  <line x1="70" y1="378" x2="530" y2="378" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="374" x2="70" y2="382" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="140" y1="374" x2="140" y2="382" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="210" y1="374" x2="210" y2="382" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="350" y1="374" x2="350" y2="382" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="385" y1="374" x2="385" y2="382" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="490" y1="374" x2="490" y2="382" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="395" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="140" y="395" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="210" y="395" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>
  <text x="350" y="395" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">8</text>
  <text x="385" y="395" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">9</text>
  <text x="490" y="395" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">12</text>
</svg>
