<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">两步贪心：行内裁剪 → 候选池 → 取前 k 大</text>
  <text x="260" y="37" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">示例 2：grid = [[5,3,7],[8,2,6]]，limits = [2,2]，k = 3</text>

  <!-- Row 0 -->
  <text x="60" y="60" font-size="10.5" fill="#55677d" filter="url(#rough2)">第 0 行 [5,3,7] 降序：</text>
  <rect x="60" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="110" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="160" y="66" width="44" height="34" fill="#f0f0f0" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="182" y="88" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">3</text>
  <text x="60" y="116" font-size="10" fill="#b85450" filter="url(#rough2)">limits[0] = 2 → 只留前 2 个，3 被裁掉</text>

  <!-- Row 1 -->
  <text x="60" y="132" font-size="10.5" fill="#55677d" filter="url(#rough2)">第 1 行 [8,2,6] 降序：</text>
  <rect x="60" y="138" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="110" y="138" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="160" y="138" width="44" height="34" fill="#f0f0f0" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="182" y="160" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">2</text>
  <text x="60" y="188" font-size="10" fill="#b85450" filter="url(#rough2)">limits[1] = 2 → 2 被裁掉</text>

  <!-- arrows into pool -->
  <path d="M 208 83 L 284 102" stroke="#446688" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <path d="M 208 155 L 284 143" stroke="#446688" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="240" y="96" font-size="9" fill="#446688" filter="url(#rough2)">入池</text>
  <text x="240" y="156" font-size="9" fill="#446688" filter="url(#rough2)">入池</text>

  <!-- Pool box -->
  <rect x="288" y="62" width="212" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="394" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">候选池 pool（降序）</text>
  <rect x="308" y="92" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="113" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="352" y="92" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="113" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="396" y="92" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="113" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="440" y="92" width="40" height="32" fill="#f0f0f0" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="460" y="113" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">5</text>
  <path d="M 308 130 L 436 130" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="372" y="147" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">k = 3：取 8 + 7 + 6</text>
  <text x="372" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">总和 = 21 ✓</text>

  <!-- bottom note boxes -->
  <g filter="url(#rough2)">
    <rect x="56" y="228" width="216" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="164" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">① 行内裁剪（交换论证）</text>
    <text x="164" y="266" text-anchor="middle" font-size="10" fill="#2f5d24">同行用未取的大数替换已取的小数</text>
    <text x="164" y="282" text-anchor="middle" font-size="10" fill="#2f5d24">每行个数不变，总和只增不减</text>
    <text x="164" y="304" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">⇒ 每行只需前 limits[i] 大</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="288" y="228" width="216" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="396" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">② 跨行合并（取前 k 大）</text>
    <text x="396" y="266" text-anchor="middle" font-size="10" fill="#33506b">元素非负：多取一个不亏</text>
    <text x="396" y="282" text-anchor="middle" font-size="10" fill="#33506b">k ≤ Σlimits：候选永远够取</text>
    <text x="396" y="304" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">⇒ 池内前 k 大之和即答案</text>
  </g>

  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">虚线灰格 = 行内落选者（任何最优解都不含）；绿格 = 池内前 k 大</text>
</svg>
