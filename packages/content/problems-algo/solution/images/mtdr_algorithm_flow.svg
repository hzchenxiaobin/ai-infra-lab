<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">算法流程：容量 DP 状态转移</text>

  <!-- base -->
  <rect x="200" y="50" width="200" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="20" filter="url(#rough2)"/>
  <text x="300" y="76" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">初始 dp[0][0][0] = 0</text>
  <path d="M300 92 L300 120" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="180" y="124" width="240" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="146" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">遍历状态 (i, j, k)</text>
  <text x="300" y="164" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">i=0..n, j=0..m−1, k=0..limit[j]</text>
  <path d="M300 174 L300 196" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- current state box -->
  <rect x="160" y="200" width="280" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="224" text-anchor="middle" font-size="13" fill="#3a5a2a" filter="url(#rough2)">当前状态 dp[i][j][k]</text>
  <text x="300" y="244" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">前 i 个机器人已修；工厂 j 已用 k 个名额</text>

  <!-- branch arrows -->
  <path d="M220 256 L130 290" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M380 256 L470 290" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- option A: assign -->
  <rect x="30" y="296" width="230" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="145" y="318" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">① 分配 robot[i] → 工厂 j</text>
  <text x="145" y="338" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">条件：i &lt; n 且 k &lt; limit[j]</text>
  <text x="145" y="356" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">→ dp[i+1][j][k+1]</text>
  <text x="145" y="374" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">+= |robot[i] − pos[j]|</text>

  <!-- option B: close factory -->
  <rect x="340" y="296" width="230" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="455" y="318" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② 关闭工厂 j，开工厂 j+1</text>
  <text x="455" y="338" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">条件：j+1 &lt; m</text>
  <text x="455" y="356" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">→ dp[i][j+1][0]</text>
  <text x="455" y="374" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">取 min（k 取任意值均可收尾）</text>

  <!-- answer -->
  <path d="M145 384 L145 416 L455 416 L455 384" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M300 416 L300 432" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="436" width="360" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="455" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">答案 = min over j,k  dp[n][j][k]（n 个机器人全修完）</text>
</svg>
