<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：gcd 线段树单点修改 + 长度分支判定，O((n + q log n)·log V)</text>

  <!-- 主流程 -->
  <g filter="url(#rough2)">
    <rect x="60" y="38" width="250" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="185" y="56" text-anchor="middle" font-size="10.5" fill="#33506b">① 预处理：叶 i ← nums[i]/p（p 整除）</text>
    <text x="185" y="72" text-anchor="middle" font-size="10.5" fill="#33506b">否则存 0，自底向上建 gcd 线段树</text>

    <path d="M185 82 L185 98" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="60" y="100" width="250" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="185" y="118" text-anchor="middle" font-size="10.5" fill="#33506b">② 处理查询 [ind, val]：nums[ind] ← val</text>
    <text x="185" y="134" text-anchor="middle" font-size="10.5" fill="#33506b">更新叶 ind，自底向上重算 O(log n) 次 gcd</text>

    <path d="M185 144 L185 156" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <polygon points="185,156 257,186 185,216 113,186" fill="#fafafa" stroke="#b85450" stroke-width="1.8"/>
    <text x="185" y="190" text-anchor="middle" font-size="10.5" fill="#8a3030">n ≥ 8 ？</text>

    <text x="193" y="228" font-size="10" fill="#8a3030" font-weight="bold">是</text>
    <path d="M185 216 L185 230 L140 230 L140 240" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

    <rect x="40" y="240" width="200" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="140" y="260" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">④ n ≥ 8 分支：</text>
    <text x="140" y="277" text-anchor="middle" font-size="10.5" fill="#2f5d24">ok =（线段树根 gcd == 1）</text>
    <text x="140" y="294" text-anchor="middle" font-size="9" fill="#4a6b5a">（m = 0 时根为 0，天然判否）</text>

    <text x="263" y="180" font-size="10" fill="#8a3030" font-weight="bold">否</text>
    <path d="M257 186 L395 186 L395 240" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

    <rect x="290" y="240" width="250" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="415" y="258" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">⑤ n ≤ 7 分支：公式直判 O(n²)</text>
    <text x="415" y="275" text-anchor="middle" font-size="9.5" fill="#8a6d1a">ok = m ≥ 1 ∧ g = 1 ∧</text>
    <text x="415" y="291" text-anchor="middle" font-size="9.5" fill="#8a6d1a">( m &lt; n ∨ ∃i：gcd(S∖{i}) = 1 )</text>

    <path d="M140 304 L140 322 L267 322 L267 332" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M395 304 L395 322 L267 322" stroke="#446688" stroke-width="1.8" fill="none"/>

    <rect x="180" y="334" width="175" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="267" y="356" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">⑥ ans += ok</text>

    <path d="M180 352 L30 352 L30 122 L58 122" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)"/>
    <text x="105" y="346" text-anchor="middle" font-size="9" fill="#446688">下一条查询</text>

    <path d="M355 352 L386 352" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="390" y="334" width="150" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="465" y="356" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">⑦ 返回 ans</text>
  </g>

  <!-- 底部要点 -->
  <g filter="url(#rough2)">
    <rect x="40" y="386" width="245" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="162" y="404" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">gcd(x, 0) = x：非活动叶对 gcd「透明」</text>
    <text x="162" y="420" text-anchor="middle" font-size="9.5" fill="#33506b">无需动态增删叶子；全非活动 ⟹ 根 = 0 ≠ 1</text>
    <text x="162" y="436" text-anchor="middle" font-size="9.5" fill="#33506b">m = 0 的特判被 0 惯例自动吞掉</text>

    <rect x="300" y="386" width="245" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="422" y="404" text-anchor="middle" font-size="9.5" fill="#8a3030" font-weight="bold">复杂度 O((n + q log n)·log V)，V = 5×10⁴</text>
    <text x="422" y="420" text-anchor="middle" font-size="9.5" fill="#8a3030">空间 O(n)；n ≤ 7 每查至多 49 次 gcd</text>
    <text x="422" y="436" text-anchor="middle" font-size="9.5" fill="#8a3030">对照暴力 O(q · 2ⁿ · n) 天文数字</text>
  </g>
</svg>
