<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：LEFT JOIN 补零 + 递归序列填缺口</text>

  <!-- ============ Top half: LEFT JOIN concept ============ -->
  <text x="110" y="50" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Visits 表</text>
  <rect x="35" y="56" width="65" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="67" y="71" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">user_id</text>
  <rect x="100" y="56" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="71" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">visit_date</text>
  <rect x="35" y="78" width="65" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="67" y="92" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">1</text>
  <rect x="100" y="78" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="92" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">D1</text>
  <rect x="35" y="98" width="65" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="67" y="112" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="100" y="98" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="140" y="112" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">D2</text>
  <rect x="35" y="118" width="65" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="67" y="132" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">9</text>
  <rect x="100" y="118" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="140" y="132" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">D3</text>
  <text x="140" y="152" text-anchor="middle" font-size="8.5" fill="#555">3 次访问</text>

  <text x="370" y="50" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Transactions 聚合</text>
  <rect x="300" y="56" width="55" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="327" y="71" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">user</text>
  <rect x="355" y="56" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="71" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">txn_date</text>
  <rect x="415" y="56" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="71" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">cnt</text>
  <rect x="300" y="78" width="55" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="327" y="92" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="355" y="78" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="385" y="92" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">D2</text>
  <rect x="415" y="78" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="435" y="92" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="300" y="98" width="55" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="327" y="112" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">9</text>
  <rect x="355" y="98" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="385" y="112" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">D3</text>
  <rect x="415" y="98" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="435" y="112" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">3</text>
  <rect x="300" y="118" width="155" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="377" y="132" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">user 1 在 D1 无交易 →</text>
  <text x="377" y="152" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">LEFT JOIN 得 NULL</text>

  <path d="M280 168 L280 188" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="155" y="169" width="250" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="9.5" fill="#333">LEFT JOIN + IFNULL(cnt, 0) → 每次访问的交易数</text>

  <text x="280" y="204" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">挑战①：无交易的访问 → IFNULL 补零</text>
  <rect x="155" y="212" width="65" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="227" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">user_id</text>
  <rect x="220" y="212" width="75" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="257" y="227" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">visit_date</text>
  <rect x="295" y="212" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="227" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">cnt</text>
  <rect x="155" y="234" width="65" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="187" y="248" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">1</text>
  <rect x="220" y="234" width="75" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="257" y="248" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">D1</text>
  <rect x="295" y="234" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="315" y="248" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">0</text>
  <text x="345" y="248" font-size="9" fill="#d6a040" font-weight="bold">IFNULL(NULL,0)</text>
  <rect x="155" y="254" width="65" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="187" y="268" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="220" y="254" width="75" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="257" y="268" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">D2</text>
  <rect x="295" y="254" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="315" y="268" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="155" y="274" width="65" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="187" y="288" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">9</text>
  <rect x="220" y="274" width="75" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="257" y="288" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">D3</text>
  <rect x="295" y="274" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="315" y="288" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">3</text>

  <path d="M280 302 L280 322" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="175" y="303" width="210" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="9.5" fill="#333">GROUP BY cnt → 分布有缺口！</text>

  <text x="280" y="338" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">挑战②：输出缺口 → RECURSIVE CTE 补齐</text>
  <rect x="70" y="346" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="361" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">cnt</text>
  <rect x="120" y="346" width="55" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="361" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">visits</text>
  <rect x="70" y="368" width="50" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="95" y="380" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="120" y="368" width="55" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="147" y="380" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="70" y="386" width="50" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="95" y="398" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="120" y="386" width="55" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="147" y="398" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="70" y="404" width="50" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="95" y="416" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <rect x="120" y="404" width="55" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="147" y="416" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">?</text>
  <text x="185" y="416" font-size="8.5" fill="#b85450" font-weight="bold">缺口</text>
  <rect x="70" y="422" width="50" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="95" y="434" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">3</text>
  <rect x="120" y="422" width="55" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="147" y="434" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>

  <path d="M195 415 L235 415" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="215" y="408" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">补齐</text>

  <rect x="240" y="346" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="361" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">RECURSIVE: 0..max(cnt)</text>
  <rect x="240" y="368" width="140" height="18" fill="#ffffff" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="310" y="380" text-anchor="middle" font-size="8.5" fill="#333">SELECT 0 AS n</text>
  <rect x="240" y="386" width="140" height="18" fill="#ffffff" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="310" y="398" text-anchor="middle" font-size="8.5" fill="#333">UNION ALL SELECT n+1</text>
  <rect x="240" y="404" width="140" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="310" y="416" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">n &lt; max → {0,1,2,3}</text>
  <text x="310" y="434" text-anchor="middle" font-size="8.5" fill="#555">LEFT JOIN + GROUP BY</text>

  <path d="M385 415 L420 415" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="475" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">最终输出</text>
  <rect x="425" y="346" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="361" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">txn_cnt</text>
  <rect x="475" y="346" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="361" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">visits</text>
  <rect x="425" y="368" width="50" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="450" y="380" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="475" y="368" width="50" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="500" y="380" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="425" y="386" width="50" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="450" y="398" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="475" y="386" width="50" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="500" y="398" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="425" y="404" width="50" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="450" y="416" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2</text>
  <rect x="475" y="404" width="50" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="500" y="416" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">0</text>
  <rect x="425" y="422" width="50" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="450" y="434" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">3</text>
  <rect x="475" y="422" width="50" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="500" y="434" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <text x="450" y="453" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">cnt=2 补 0</text>

  <rect x="15" y="448" width="540" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="461" text-anchor="middle" font-size="9" fill="#333">两大挑战：① <tspan fill="#d6a040" font-weight="bold">LEFT JOIN + IFNULL(0)</tspan> 把无交易访问计为 0；② <tspan fill="#b85450" font-weight="bold">RECURSIVE CTE</tspan> 生成 0..max 填补输出缺口</text>
</svg>
