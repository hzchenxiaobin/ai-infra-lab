<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">单查询 [l, r]：以 pos 为界拆成「等差段 + 前缀和段」</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">例：s = "010101"，k = 1，查询 [1, 4]（l = 1, r = 4）</text>

  <!-- b 轴格子：b = 1..4，标注 L 值 -->
  <text x="128" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="308" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">r</text>
  <rect x="100" y="64" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="64" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="64" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="64" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="128" y="87" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">L=0</text>
  <text x="188" y="87" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">L=0</text>
  <text x="248" y="87" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">L=1</text>
  <text x="308" y="87" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">L=2</text>
  <text x="128" y="118" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">b=1</text>
  <text x="188" y="118" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">b=2</text>
  <text x="248" y="118" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">b=3</text>
  <text x="308" y="118" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">b=4</text>

  <!-- pos 分界虚线 -->
  <path d="M 218 54 L 218 132" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="240" y="50" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">pos = 3（第一个 L[b] ≥ l 的 b）</text>

  <!-- 引导箭头 -->
  <path d="M 170 124 C 158 136, 150 142, 144 150" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 288 124 C 320 136, 340 142, 356 150" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Part 1 说明框（左，橙） -->
  <rect x="36" y="152" width="216" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="144" y="172" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">Part 1：b ∈ [l, pos−1]</text>
  <text x="144" y="190" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">此段 L[b] &lt; l</text>
  <text x="144" y="207" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">贡献 b − l + 1 = 1, 2, …（等差）</text>
  <text x="144" y="224" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">m = pos − l = 2 项</text>
  <text x="144" y="244" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">和 = m(m+1)/2 = 3</text>

  <!-- Part 2 说明框（右，绿） -->
  <rect x="268" y="152" width="216" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="376" y="172" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">Part 2：b ∈ [pos, r]</text>
  <text x="376" y="190" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">此段 L[b] ≥ l</text>
  <text x="376" y="207" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">贡献 b − L[b] + 1 = 3, 3</text>
  <text x="376" y="224" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">= pre[r+1] − pre[pos]</text>
  <text x="376" y="244" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">= pre[5] − pre[3] = 6</text>

  <!-- 汇总公式框 -->
  <rect x="56" y="268" width="408" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">ans = m(m+1)/2 + pre[r+1] − pre[pos]</text>
  <text x="260" y="308" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">本例：3 + 6 = 9 ✓</text>

  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠️ pos &gt; r（含 pos = n 找不到）时右段为空 → 统一取 pos = r + 1，无需特判</text>
</svg>
