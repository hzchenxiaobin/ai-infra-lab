<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "1000"，k = 2（n = 8）</text>

  <!-- 第一步：f 表 + good 判定 -->
  <text x="36" y="48" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">第一步：f(c) 与「好 c」判定（1 + f(c) ≤ k = 2）</text>
  <g filter="url(#rough2)">
    <rect x="46" y="58" width="52" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="98" y="58" width="52" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="150" y="58" width="52" height="46" fill="#f4f4f4" stroke="#999" stroke-width="1.5" rx="4"/>
    <rect x="202" y="58" width="52" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="72" y="74" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">c=1</text>
    <text x="124" y="74" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">c=2</text>
    <text x="176" y="74" text-anchor="middle" font-size="11" fill="#777" font-weight="bold">c=3</text>
    <text x="228" y="74" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">c=4</text>
    <text x="72" y="90" text-anchor="middle" font-size="9.5" fill="#555">f=0</text>
    <text x="124" y="90" text-anchor="middle" font-size="9.5" fill="#555">f=1</text>
    <text x="176" y="90" text-anchor="middle" font-size="9.5" fill="#555">f=2</text>
    <text x="228" y="90" text-anchor="middle" font-size="9.5" fill="#555">f=1</text>
    <text x="72" y="102" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">1≤2 ✓</text>
    <text x="124" y="102" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">2≤2 ✓</text>
    <text x="176" y="102" text-anchor="middle" font-size="10" fill="#999" font-weight="bold">3&gt;2 ✗</text>
    <text x="228" y="102" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">2≤2 ✓</text>
  </g>
  <text x="384" y="72" font-size="10" fill="#8f3b37" filter="url(#rough2)">（L=4，只需查到 c=4：</text>
  <text x="384" y="86" font-size="10" fill="#8f3b37" filter="url(#rough2)">c=4 即 1111，但 n=1000，</text>
  <text x="384" y="100" font-size="10" fill="#8f3b37" filter="url(#rough2)">计数一步会算出 0 个）</text>

  <!-- 第二步：count 扫描 -->
  <text x="36" y="132" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">第二步：扫 s = 1 0 0 0，唯一 '1' 在 i=0</text>
  <g filter="url(#rough2)">
    <rect x="46" y="142" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="90" y="142" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <rect x="134" y="142" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <rect x="178" y="142" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <text x="68" y="166" text-anchor="middle" font-size="16" font-weight="bold" fill="#8f3b37">0</text>
    <text x="112" y="166" text-anchor="middle" font-size="14" fill="#2f5d24">?</text>
    <text x="156" y="166" text-anchor="middle" font-size="14" fill="#2f5d24">?</text>
    <text x="200" y="166" text-anchor="middle" font-size="14" fill="#2f5d24">?</text>
  </g>
  <text x="330" y="156" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">i=0：m = 3 个自由位，ones = 0</text>
  <text x="330" y="172" font-size="10.5" fill="#33506b" filter="url(#rough2)">count(c) = C(3, c)</text>

  <!-- 第三步：求和表 -->
  <text x="36" y="204" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">第三步：对好 c 逐个求和</text>
  <g filter="url(#rough2)">
    <rect x="46" y="214" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="106" y="232" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">c = 1 ✓</text>
    <text x="186" y="232" font-size="10.5" fill="#555">C(3,1) = 3</text>
    <text x="300" y="232" font-size="10.5" fill="#2f5d24" font-weight="bold">→ {1, 2, 4}</text>

    <rect x="46" y="244" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="106" y="262" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">c = 2 ✓</text>
    <text x="186" y="262" font-size="10.5" fill="#555">C(3,2) = 3</text>
    <text x="300" y="262" font-size="10.5" fill="#2f5d24" font-weight="bold">→ {3, 5, 6}</text>

    <rect x="46" y="274" width="120" height="26" fill="#f4f4f4" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="106" y="292" text-anchor="middle" font-size="10.5" fill="#777" font-weight="bold">c = 4 ✓</text>
    <text x="186" y="292" font-size="10.5" fill="#555">C(3,4) = 0</text>
    <text x="300" y="292" font-size="10.5" fill="#999">→ 自由位不够放 4 个 1</text>
  </g>

  <!-- 结论框 -->
  <rect x="20" y="312" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="12.5" fill="#8f3b37" font-weight="bold" filter="url(#rough2)">ans = 3 + 3 + 0 = 6 ✓（1,2,3,4,5,6；7=111 需 3 步被排除）</text>
  <text x="260" y="346" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">对照示例 1：s="111", k=1，仅 c=1 好，count = C(2,1)+C(1,0) = 3 → {1,2,4}</text>
</svg>
