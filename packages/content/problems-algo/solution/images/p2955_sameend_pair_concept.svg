<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：同端子串 ⇔ 一对相等字符的位置（允许两端重合）</text>

  <text x="40" y="52" font-size="12" fill="#555">查询 [1, 4]：s[1..4] = "bcaa"</text>

  <!-- 配对弧：两个 a 之间 -->
  <path d="M 149 84 Q 178 54 207 84" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 字符格子 -->
  <rect x="64" y="88" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="88" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="88" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="178" y="88" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="83" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="121" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <text x="159" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="197" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>

  <text x="83" y="138" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="121" y="138" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="159" y="138" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <text x="197" y="138" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>

  <!-- 右侧注释 -->
  <text x="232" y="66" font-size="12" fill="#d6a040" filter="url(#rough2)">橙弧：a 与 a 配对 → "aa"</text>
  <text x="232" y="90" font-size="12" fill="#446688" filter="url(#rough2)">每个位置自身 ⇔ 单字符子串</text>
  <text x="232" y="114" font-size="12" fill="#888" filter="url(#rough2)">b、c 只出现 1 次，无配对弧</text>

  <!-- 左：位置对枚举 -->
  <rect x="40" y="160" width="250" height="84" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="52" y="180" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">位置对（允许 i = j）</text>
  <text x="52" y="200" font-size="11.5" fill="#333" filter="url(#rough2)">b：(1,1) → "b"</text>
  <text x="52" y="218" font-size="11.5" fill="#333" filter="url(#rough2)">c：(2,2) → "c"</text>
  <text x="52" y="236" font-size="11.5" fill="#333" filter="url(#rough2)">a：(3,3)、(4,4)、(3,4) → "a"、"a"、"aa"</text>

  <!-- 右：按字符分解贡献表 -->
  <text x="310" y="176" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">按端点字符分解（互不相交）</text>
  <rect x="310" y="184" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="356" y="184" width="72" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="428" y="184" width="102" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="333" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">字母</text>
  <text x="392" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">频次 t</text>
  <text x="479" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">贡献 t(t+1)/2</text>

  <rect x="310" y="208" width="46" height="24" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="356" y="208" width="72" height="24" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="428" y="208" width="102" height="24" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="333" y="224" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">a</text>
  <text x="392" y="224" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="479" y="224" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>

  <rect x="310" y="232" width="46" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="356" y="232" width="72" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="428" y="232" width="102" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="333" y="248" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">b</text>
  <text x="392" y="248" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="479" y="248" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>

  <rect x="310" y="256" width="46" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="356" y="256" width="72" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="428" y="256" width="102" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="333" y="272" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">c</text>
  <text x="392" y="272" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="479" y="272" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>

  <rect x="310" y="280" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="356" y="280" width="72" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="428" y="280" width="102" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="333" y="297" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">合计</text>
  <text x="392" y="297" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="479" y="297" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5 ✓</text>

  <!-- 底部等价改写 -->
  <rect x="40" y="316" width="490" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="285" y="342" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">等价改写：ans = (r − l + 1) + 区间内相等字符对数</text>
  <text x="285" y="364" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">（区间长度补上 i = j 的单字符，剩下数 i &lt; j 的相等对 —— 见 1512 好数对）</text>
</svg>
