<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">解码映射规则：数字串 → 小写字母</text>

  <!-- Row 1: single digit 1~9 -> a~i -->
  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold">单数字（1~9 → a~i）</text>

  <!-- group 1: 1 -> a -->
  <rect x="110" y="70" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <path d="M 160 87 L 188 87" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="192" y="70" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>

  <!-- group 2: 5 -> e -->
  <rect x="290" y="70" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <path d="M 340 87 L 368 87" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="372" y="70" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>

  <!-- group 3: 9 -> i -->
  <rect x="470" y="70" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="493" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <path d="M 520 87 L 548 87" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="552" y="70" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="569" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">i</text>

  <text x="300" y="128" text-anchor="middle" font-size="10" fill="#888">数字 = 字母序号 + 0（'1'→a+0，'9'→a+8）</text>

  <!-- Row 2: two digits + #  10#~26# -> j~z -->
  <text x="40" y="166" font-size="12" fill="#b85450" font-weight="bold">两位数字 + #（10#~26# → j~z）</text>

  <!-- group 1: 10# -> j -->
  <rect x="110" y="178" width="58" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10#</text>
  <path d="M 172 195 L 200 195" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="204" y="178" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">j</text>

  <!-- group 2: 17# -> q -->
  <rect x="290" y="178" width="58" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">17#</text>
  <path d="M 352 195 L 380 195" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="384" y="178" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">q</text>

  <!-- group 3: 26# -> z -->
  <rect x="470" y="178" width="58" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="499" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">26#</text>
  <path d="M 532 195 L 552 195" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="552" y="178" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="569" y="200" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">z</text>

  <text x="300" y="236" text-anchor="middle" font-size="10" fill="#888">数值 = 字母序号 + 9（10#→a+9=j，26#→a+25=z）</text>

  <!-- insight box -->
  <rect x="40" y="256" width="520" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="280" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">核心观察：'#' 是后缀标记</text>
  <text x="60" y="302" font-size="12" fill="#333">• '#' 总在两位数字<strong>之后</strong>，像句号标出一个「10~26」的词</text>
  <text x="60" y="322" font-size="12" fill="#333">• 从右向左扫描：先看到 '#' 就读它左边两位数字 → j~z</text>
  <text x="60" y="342" font-size="12" fill="#333">• 没看到 '#' 就读当前一位数字 → a~i</text>
  <text x="60" y="358" font-size="11" fill="#b85450" font-weight="bold">逆向 = 先见标记再读其修饰的数字，无需向前预读 2 位</text>
</svg>
