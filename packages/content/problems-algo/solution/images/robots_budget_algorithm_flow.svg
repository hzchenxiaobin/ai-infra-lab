<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：滑窗右扩 → 入队弹尾 → 超预算则左缩</text>

  <!-- step 1 -->
  <rect x="190" y="44" width="180" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="13" fill="#224" filter="url(#rough2)">初始化 l=0, sum=0, dq=[], ans=0</text>
  <path d="M280,90 L280,108" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <text x="280" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">for r = 0 … n-1：</text>
  <path d="M280,128 L280,146" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: push back -->
  <rect x="150" y="148" width="260" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="175" text-anchor="middle" font-size="12" fill="#244a14" filter="url(#rough2)">入队弹尾：弹掉队尾所有 ≤ charge[r] 的</text>
  <path d="M280,194 L280,212" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: sum -->
  <rect x="150" y="214" width="260" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="241" text-anchor="middle" font-size="12" fill="#5a4010" filter="url(#rough2)">sum += runCost[r]；dq.push_back(r)</text>
  <path d="M280,260 L280,278" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: cost > budget ? -->
  <path d="M280,278 L280,296 L420,330 L280,364 L140,330 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#7a2a26" filter="url(#rough2)">charge[dq.front]</text>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#7a2a26" filter="url(#rough2)">+ (r-l+1)·sum &gt; budget?</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#7a2a26" filter="url(#rough2)">(队头需先弹掉过期 &lt; l)</text>

  <!-- yes branch: shrink -->
  <text x="436" y="326" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M420,330 L470,330" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="470" y="306" width="80" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="326" text-anchor="middle" font-size="11" fill="#7a2a26" filter="url(#rough2)">若 front==l</text>
  <text x="510" y="342" text-anchor="middle" font-size="11" fill="#7a2a26" filter="url(#rough2)">pop_front</text>
  <text x="510" y="356" text-anchor="middle" font-size="11" fill="#7a2a26" filter="url(#rough2)">sum−=run[l]; l++</text>
  <path d="M470,330 L440,330 L420,330 L280,330" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="448" y="322" font-size="10" fill="#b85450" filter="url(#rough2)">回判</text>

  <!-- no branch -->
  <text x="124" y="326" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M140,330 L80,330" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="306" width="60" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="326" text-anchor="middle" font-size="11" fill="#244a14" filter="url(#rough2)">窗口合法</text>
  <text x="50" y="342" text-anchor="middle" font-size="11" fill="#244a14" filter="url(#rough2)">ans=max</text>
  <text x="50" y="356" text-anchor="middle" font-size="11" fill="#244a14" filter="url(#rough2)">(ans,r-l+1)</text>
  <path d="M50,354 L50,392 L280,392" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- next r -->
  <rect x="190" y="392" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#224" filter="url(#rough2)">r++，进入下一轮（窗口右扩）</text>
</svg>
