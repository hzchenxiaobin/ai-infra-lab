<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：questions = [[3,2],[4,3],[4,4],[2,5]]</text>

  <!-- ===== dp array visualization ===== -->
  <text x="40" y="52" font-size="12" fill="#555" font-weight="bold">dp 数组（从右往左填充）：</text>

  <rect x="40" y="64" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="60" y="80" text-anchor="middle" font-size="10" fill="#888">dp[0]</text>
  <text x="60" y="96" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>

  <rect x="130" y="64" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="80" text-anchor="middle" font-size="10" fill="#888">dp[1]</text>
  <text x="150" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <rect x="220" y="64" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="80" text-anchor="middle" font-size="10" fill="#888">dp[2]</text>
  <text x="240" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <rect x="310" y="64" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="330" y="80" text-anchor="middle" font-size="10" fill="#888">dp[3]</text>
  <text x="330" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="400" y="64" width="80" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="80" text-anchor="middle" font-size="10" fill="#888">dp[4]</text>
  <text x="420" y="96" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>

  <text x="442" y="58" font-size="9.5" fill="#888">哨兵</text>

  <!-- Divider -->
  <path d="M 40 116 L 520 116" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Step table ===== -->
  <text x="280" y="136" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">逐步递推过程</text>

  <!-- Table header -->
  <rect x="40" y="148" width="480" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="164" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">i</text>
  <text x="122" y="164" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">Q[i]</text>
  <text x="202" y="164" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">j=i+bp+1</text>
  <text x="300" y="164" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">跳过 dp[i+1]</text>
  <text x="410" y="164" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">解决 pts+dp[j]</text>
  <text x="500" y="164" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">dp[i]</text>

  <!-- Row i=3 -->
  <rect x="40" y="174" width="480" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="192" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>
  <text x="122" y="192" text-anchor="middle" font-size="10.5" fill="#333">[2,5]</text>
  <text x="202" y="192" text-anchor="middle" font-size="10.5" fill="#888">9→越界</text>
  <text x="300" y="192" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <text x="410" y="192" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2+0=2</text>
  <text x="500" y="192" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2</text>

  <!-- Row i=2 -->
  <rect x="40" y="204" width="480" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="222" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <text x="122" y="222" text-anchor="middle" font-size="10.5" fill="#333">[4,4]</text>
  <text x="202" y="222" text-anchor="middle" font-size="10.5" fill="#888">7→越界</text>
  <text x="300" y="222" text-anchor="middle" font-size="10.5" fill="#555">2</text>
  <text x="410" y="222" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">4+0=4</text>
  <text x="500" y="222" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">4</text>

  <!-- Row i=1 -->
  <rect x="40" y="234" width="480" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="252" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="122" y="252" text-anchor="middle" font-size="10.5" fill="#333">[4,3]</text>
  <text x="202" y="252" text-anchor="middle" font-size="10.5" fill="#888">5→越界</text>
  <text x="300" y="252" text-anchor="middle" font-size="10.5" fill="#555">4</text>
  <text x="410" y="252" text-anchor="middle" font-size="10.5" fill="#555">4+0=4</text>
  <text x="500" y="252" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>

  <!-- Row i=0 (highlighted) -->
  <rect x="40" y="264" width="480" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="62" y="282" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">0</text>
  <text x="122" y="282" text-anchor="middle" font-size="10.5" fill="#333">[3,2]</text>
  <text x="202" y="282" text-anchor="middle" font-size="10.5" fill="#b85450">3</text>
  <text x="300" y="282" text-anchor="middle" font-size="10.5" fill="#555">4</text>
  <text x="410" y="282" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">3+dp[3]=5</text>
  <text x="500" y="282" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">5</text>

  <!-- Divider -->
  <path d="M 40 304 L 520 304" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Decision trace ===== -->
  <text x="280" y="324" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">最优决策回溯</text>

  <rect x="40" y="336" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="358" font-size="11.5" fill="#333">i=0：解决 Q0（得 3 分）→ 跳到 j=3</text>
  <text x="56" y="378" font-size="11.5" fill="#333">i=3：解决 Q3（得 2 分）→ 跳到 j=9（越界，结束）</text>

  <!-- Result -->
  <rect x="40" y="404" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">答案 = dp[0] = 5（解决 Q0 + Q3：3 + 2 = 5）</text>
  <text x="280" y="442" text-anchor="middle" font-size="10.5" fill="#888">反向递推使 dp[3]=2 在计算 dp[0] 时已就绪</text>
</svg>
