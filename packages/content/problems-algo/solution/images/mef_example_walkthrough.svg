<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [2,2,1,1,5,3,3,5]</text>

  <!-- Header -->
  <rect x="30" y="40" width="570" height="28" fill="#446688" filter="url(#rough2)"/>
  <text x="48" y="58" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">i</text>
  <text x="72" y="58" font-size="11" fill="#fff" filter="url(#rough2)">前缀</text>
  <text x="214" y="58" font-size="11" fill="#fff" filter="url(#rough2)">freq 概要</text>
  <text x="479" y="58" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">maxF</text>
  <text x="531" y="58" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">合法?</text>
  <text x="580" y="58" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">ans</text>

  <!-- Row 0 (valid) -->
  <rect x="30" y="68" width="570" height="30" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="72" y="88" font-size="11" fill="#333" filter="url(#rough2)">[2]</text>
  <text x="214" y="88" font-size="11" fill="#333" filter="url(#rough2)">{2:1}</text>
  <text x="479" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="531" y="88" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ ①</text>
  <text x="580" y="88" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- Row 1 (valid) -->
  <rect x="30" y="98" width="570" height="30" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="72" y="118" font-size="11" fill="#333" filter="url(#rough2)">[2,2]</text>
  <text x="214" y="118" font-size="11" fill="#333" filter="url(#rough2)">{2:2}</text>
  <text x="479" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="531" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ ③</text>
  <text x="580" y="118" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- Row 2 (valid) -->
  <rect x="30" y="128" width="570" height="30" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="72" y="148" font-size="11" fill="#333" filter="url(#rough2)">[2,2,1]</text>
  <text x="214" y="148" font-size="11" fill="#333" filter="url(#rough2)">{2:2, 1:1}</text>
  <text x="479" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="531" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ ③</text>
  <text x="580" y="148" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>

  <!-- Row 3 (invalid) -->
  <rect x="30" y="158" width="570" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="72" y="178" font-size="11" fill="#333" filter="url(#rough2)">[2,2,1,1]</text>
  <text x="214" y="178" font-size="11" fill="#333" filter="url(#rough2)">{2:2, 1:2}</text>
  <text x="479" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="531" y="178" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="580" y="178" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>

  <!-- Row 4 (valid) -->
  <rect x="30" y="188" width="570" height="30" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="72" y="208" font-size="11" fill="#333" filter="url(#rough2)">[2,2,1,1,5]</text>
  <text x="214" y="208" font-size="11" fill="#333" filter="url(#rough2)">{2:2, 1:2, 5:1}</text>
  <text x="479" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="531" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ ②</text>
  <text x="580" y="208" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">5</text>

  <!-- Row 5 (invalid) -->
  <rect x="30" y="218" width="570" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="72" y="238" font-size="11" fill="#333" filter="url(#rough2)">[2,2,1,1,5,3]</text>
  <text x="214" y="238" font-size="11" fill="#333" filter="url(#rough2)">{2:2, 1:2, 5:1, 3:1}</text>
  <text x="479" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="531" y="238" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="580" y="238" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>

  <!-- Row 6 (valid, ans=7) -->
  <rect x="30" y="248" width="570" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="72" y="268" font-size="11" fill="#333" filter="url(#rough2)">[2,2,1,1,5,3,3]</text>
  <text x="214" y="268" font-size="11" fill="#333" filter="url(#rough2)">{2:2, 1:2, 5:1, 3:2}</text>
  <text x="479" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="531" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ ②</text>
  <text x="580" y="268" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">7</text>

  <!-- Row 7 (invalid) -->
  <rect x="30" y="278" width="570" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="72" y="298" font-size="11" fill="#333" filter="url(#rough2)">[2,2,1,1,5,3,3,5]</text>
  <text x="214" y="298" font-size="11" fill="#333" filter="url(#rough2)">{2:2, 1:2, 5:2, 3:2}</text>
  <text x="479" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="531" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="580" y="298" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">7</text>

  <!-- vertical separators -->
  <line x1="66" y1="40" x2="66" y2="308" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="206" y1="40" x2="206" y2="308" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="456" y1="40" x2="456" y2="308" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="502" y1="40" x2="502" y2="308" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="560" y1="40" x2="560" y2="308" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="310" y="332" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">最终答案 ans = 7（i=6 处取得最长合法前缀）</text>
</svg>
