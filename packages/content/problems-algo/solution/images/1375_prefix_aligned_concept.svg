<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：前 i 步翻动 i 个不同位置 ⟹ 覆盖 {1..i} ⟺ max == i</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">flips 是 [1,n] 排列 ⟹ 前 i 步翻动 i 个互不相同的位置；要前缀全 1，它们须正好是 {1,…,i}</text>

  <!-- ====== Row 1: bit string at step 4 (example 1) ====== -->
  <text x="120" y="86" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">第 4 步后</text>
  <text x="120" y="100" text-anchor="end" font-size="10" fill="#888">bits (n=5)</text>
  <g font-size="9" fill="#888">
    <text x="168" y="64" text-anchor="middle">下标 1</text>
    <text x="224" y="64" text-anchor="middle">2</text>
    <text x="280" y="64" text-anchor="middle">3</text>
    <text x="336" y="64" text-anchor="middle">4</text>
    <text x="392" y="64" text-anchor="middle">5</text>
  </g>
  <g font-size="16">
    <rect x="140" y="70" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="168" y="98" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="196" y="70" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="224" y="98" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="252" y="70" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="280" y="98" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="308" y="70" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="336" y="98" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="364" y="70" width="56" height="42" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="392" y="98" text-anchor="middle" fill="#bbb">0</text>
  </g>
  <!-- prefix bracket [1,4] -->
  <path d="M 140 120 L 140 128 L 336 128 L 336 120" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="238" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">前缀 [1,4] 全为 1 ✓ 前缀一致</text>

  <!-- arrow down -->
  <path d="M 320 150 L 320 168" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="330" y="162" font-size="10" fill="#666">这 4 个 1 来自前 4 步翻转</text>

  <!-- ====== Row 2: flips[0..3] = [3,2,4,1] ====== -->
  <text x="120" y="192" text-anchor="end" font-size="12" fill="#d6a040" font-weight="bold">前 4 步</text>
  <text x="120" y="206" text-anchor="end" font-size="10" fill="#888">flips[0..3]</text>
  <g font-size="9" fill="#888">
    <text x="196" y="186" text-anchor="middle">步1</text>
    <text x="252" y="186" text-anchor="middle">步2</text>
    <text x="308" y="186" text-anchor="middle">步3</text>
    <text x="364" y="186" text-anchor="middle">步4</text>
  </g>
  <g font-size="15">
    <rect x="168" y="192" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="196" y="218" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="224" y="192" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="252" y="218" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="280" y="192" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="308" y="218" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="336" y="192" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="364" y="218" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
  </g>
  <text x="410" y="218" font-size="11" fill="#666">→ 翻动位置 {3,2,4,1}</text>

  <!-- arrow down -->
  <path d="M 320 240 L 320 258" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="330" y="252" font-size="10" fill="#666">排列 ⟹ 4 个互不相同的正整数</text>

  <!-- ====== Row 3: set equality + max ====== -->
  <rect x="120" y="266" width="200" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="288" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">{3, 2, 4, 1}</text>
  <text x="220" y="306" text-anchor="middle" font-size="10" fill="#5a8a5a">4 个不同值，最大值 = 4</text>

  <text x="332" y="298" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">⟺</text>

  <rect x="346" y="266" width="174" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="433" y="288" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">{1, 2, 3, 4}</text>
  <text x="433" y="306" text-anchor="middle" font-size="10" fill="#a85a56">恰好覆盖前缀 [1, 4]</text>

  <!-- arrow down to conclusion -->
  <path d="M 320 330 L 320 348" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="330" y="342" font-size="10" fill="#666">最大值 == 步号 i ⟺ 前缀一致</text>

  <!-- ====== conclusion box ====== -->
  <rect x="40" y="358" width="560" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="382" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">前缀一致_i  ⟺  max{flips[1..i]} == i</text>
  <text x="320" y="402" text-anchor="middle" font-size="11" fill="#666">i 个互不相同的正整数 + 最大值为 i  ⟹  必为 {1, 2, …, i}</text>
  <text x="320" y="420" text-anchor="middle" font-size="11" fill="#666">（置换保证「前 i 步 = i 个不同位置」，这是 max 判据成立的前提）</text>
  <text x="320" y="436" text-anchor="middle" font-size="10" fill="#888">于是只需一个变量 mx 跟踪前缀最大值，与步号 i 一比即得，O(n)/O(1)</text>
</svg>
