<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">前缀和优化：把「一段的 c 次加法」变成「一次减法」</text>
  <text x="260" y="38" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">示例 1 处理完前 3 组后 f = [0,0,0,1,3,3,1]，现在处理第 4 组（c = 2）</text>

  <!-- ===== j 列标 ===== -->
  <text x="114" y="56" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="162" y="56" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="210" y="56" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">j=2</text>
  <text x="258" y="56" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">j=3</text>
  <text x="306" y="56" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">j=4</text>
  <text x="354" y="56" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">j=5</text>
  <text x="402" y="56" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">j=6</text>

  <!-- ===== f 旧行 ===== -->
  <text x="84" y="82" text-anchor="end" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">f（旧）</text>
  <rect x="91" y="62" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="139" y="62" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="187" y="62" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="235" y="62" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="283" y="62" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <rect x="331" y="62" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <rect x="379" y="62" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="114" y="83" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="162" y="83" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="210" y="83" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="258" y="83" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="306" y="83" text-anchor="middle" font-size="10.5" fill="#a05a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="354" y="83" text-anchor="middle" font-size="10.5" fill="#a05a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="402" y="83" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 窗口括线 -->
  <path d="M 285 100 L 285 104 L 375 104 L 375 100" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="116" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">转移窗口 u ∈ [j−c, j−1] = [4, 5]（j = 6）</text>

  <!-- ===== g 前缀和行 ===== -->
  <text x="84" y="158" text-anchor="end" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">g＝Σf</text>
  <rect x="91" y="138" width="46" height="32" fill="#eef3f8" stroke="#7a8ea6" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="139" y="138" width="46" height="32" fill="#eef3f8" stroke="#7a8ea6" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="187" y="138" width="46" height="32" fill="#eef3f8" stroke="#7a8ea6" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="235" y="138" width="46" height="32" fill="#eef3f8" stroke="#7a8ea6" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="283" y="138" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <rect x="331" y="138" width="46" height="32" fill="#eef3f8" stroke="#7a8ea6" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="379" y="138" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <rect x="427" y="138" width="46" height="32" fill="#eef3f8" stroke="#7a8ea6" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="159" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="162" y="159" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="210" y="159" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="258" y="159" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="306" y="159" text-anchor="middle" font-size="10" fill="#a05a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="354" y="159" text-anchor="middle" font-size="10" fill="#556677" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="402" y="159" text-anchor="middle" font-size="10" fill="#a05a20" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="450" y="159" text-anchor="middle" font-size="10" fill="#556677" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="114" y="134" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">g[0]</text>
  <text x="162" y="134" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">g[1]</text>
  <text x="210" y="134" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">g[2]</text>
  <text x="258" y="134" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">g[3]</text>
  <text x="306" y="134" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">g[4]</text>
  <text x="354" y="134" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">g[5]</text>
  <text x="402" y="134" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">g[6]</text>
  <text x="450" y="134" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">g[7]</text>
  <text x="486" y="158" font-size="7.5" fill="#888" filter="url(#rough2)">g[j] =</text>
  <text x="486" y="168" font-size="7.5" fill="#888" filter="url(#rough2)">f[0..j−1]</text>
  <text x="486" y="178" font-size="7.5" fill="#888" filter="url(#rough2)">之和</text>

  <!-- 减法箭头 -->
  <path d="M 306 172 Q 330 196 392 206" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 402 172 L 402 204" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="326" y="196" text-anchor="middle" font-size="9.5" fill="#a05a20" font-weight="bold" filter="url(#rough2)">g[6] − g[4] = 7 − 1 = 6</text>

  <!-- ===== f' 新行 ===== -->
  <text x="84" y="230" text-anchor="end" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">f′（新）</text>
  <rect x="91" y="210" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="139" y="210" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="187" y="210" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="235" y="210" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="283" y="210" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="331" y="210" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="379" y="210" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="231" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="162" y="231" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="210" y="231" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="258" y="231" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="306" y="231" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="354" y="231" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="402" y="231" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="402" y="256" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">f′[6] = f[4]+f[5] = 3+3 = 6 ✓</text>

  <!-- ===== 底部说明框 ===== -->
  <rect x="40" y="266" width="440" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="9.5" fill="#a05a20" font-weight="bold" filter="url(#rough2)">朴素转移 f′[j] = f[j−1] + f[j−2] + … + f[j−c]：每个状态 O(c)，最坏 O(m·k²)</text>
  <text x="260" y="304" text-anchor="middle" font-size="9" fill="#a05a20" filter="url(#rough2)">前缀和 g[j] = f[0] + … + f[j−1] 之后：f′[j] = g[j] − g[max(0, j−c)]，每组 O(k)，共 O(m·k)</text>
  <text x="260" y="322" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">配合 m &lt; k ≤ 2000 的早退，DP 至多 2000 × 2000 = 4×10⁶ 步；</text>
  <text x="260" y="336" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">c 还可截断为 min(c, k)——反正 t &gt; k 的转移永远轮不到</text>
</svg>
