<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次遍历 + 哈希集合去重</text>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="220" y="44" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始，seen = ∅</text>
  </g>
  <path d="M280 80 L280 96" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop init -->
  <g filter="url(#rough2)">
    <rect x="200" y="100" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="280" y="122" text-anchor="middle" font-size="12" fill="#333">i = 0 ；条件 i ≤ n − 2</text>
  </g>
  <path d="M280 136 L280 152" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute sum -->
  <g filter="url(#rough2)">
    <rect x="180" y="156" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="180" text-anchor="middle" font-size="12" fill="#333">s = nums[i] + nums[i+1]</text>
  </g>
  <path d="M280 196 L280 214" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <g filter="url(#rough2)">
    <polygon points="280,218 360,258 280,298 200,258" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="256" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">s ∈ seen ?</text>
    <text x="280" y="272" text-anchor="middle" font-size="10" fill="#888">（insert 是否失败）</text>
  </g>

  <!-- yes branch -->
  <path d="M360 258 L420 258 L420 332" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="252" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#rough2)">
    <rect x="356" y="336" width="130" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="421" y="361" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return true</text>
  </g>

  <!-- no branch -->
  <path d="M200 258 L120 258 L120 312" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <g filter="url(#rough2)">
    <rect x="60" y="316" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="120" y="338" text-anchor="middle" font-size="12" fill="#333">seen.add(s)</text>
  </g>
  <path d="M120 352 L120 372 L196 372" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="356" width="120" height="0" fill="none" stroke="none"/>
  </g>

  <!-- i++ and loop back -->
  <g filter="url(#rough2)">
    <rect x="196" y="356" width="168" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="280" y="378" text-anchor="middle" font-size="12" fill="#333">i++ ，回到循环条件</text>
  </g>
  <path d="M280 356 L280 332" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- loop end -->
  <path d="M280 134 L460 134 L460 117" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="3,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="468" y="120" font-size="10" fill="#888">循环结束</text>

  <!-- return false -->
  <g filter="url(#rough2)">
    <rect x="74" y="404" width="412" height="0" fill="none" stroke="none"/>
    <rect x="200" y="400" width="160" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="280" y="422" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return false（无重复和）</text>
  </g>
  <path d="M280 390 L280 398" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
