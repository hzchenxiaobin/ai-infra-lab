<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：三个数组各扫一遍，奇偶分桶后组合计数</text>

  <rect x="30" y="44" width="250" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155" y="60" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">扫 a：E_a ← popcount 为偶的元素数</text>
  <text x="155" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">O_a ← |a| − E_a（奇）</text>

  <path d="M 155 84 L 155 100" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="30" y="102" width="250" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155" y="118" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">扫 b：E_b、O_b（同法）</text>
  <text x="155" y="134" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">判奇偶只需 O(1)：看 popcount 末位</text>

  <path d="M 155 142 L 155 158" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="30" y="160" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155" y="182" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">扫 c：E_c、O_c（同法）</text>

  <path d="M 155 196 L 155 212" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="30" y="214" width="250" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="155" y="234" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = E_a·E_b·E_c + E_a·O_b·O_c</text>
  <text x="155" y="250" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+ O_a·E_b·O_c + O_a·O_b·E_c</text>
  <text x="155" y="264" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">「奇的个数为偶」的全部 4 种模式</text>

  <path d="M 155 272 L 155 288" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="30" y="290" width="250" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="155" y="312" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <rect x="310" y="44" width="180" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="400" y="62" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">💡 判奇偶一行搞定</text>
  <text x="400" y="78" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">C++：__builtin_parity(x)</text>
  <text x="400" y="92" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">Python：bin(x).count('1') &amp; 1</text>

  <rect x="310" y="120" width="180" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="400" y="138" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ II 版要 long long</text>
  <text x="400" y="154" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">II 版数组规模到 10^5，</text>
  <text x="400" y="168" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">ans 上限 ~10^15 超 int，</text>
  <text x="400" y="182" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">C++ 用 long long 两题通吃</text>

  <rect x="310" y="202" width="180" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="400" y="220" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">完全不碰异或值</text>
  <text x="400" y="236" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">不需要算出 a⊕b⊕c，</text>
  <text x="400" y="250" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">与值域大小无关；</text>
  <text x="400" y="264" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">O(n+m+l) / O(1)</text>

  <rect x="310" y="276" width="180" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="400" y="294" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">💡 对比暴力</text>
  <text x="400" y="310" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">三重循环 O(n·m·l)：I 版 10^6 能过，</text>
  <text x="400" y="322" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">II 版 10^15 必超时</text>
</svg>
