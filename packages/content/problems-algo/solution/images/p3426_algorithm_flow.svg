<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：建表 O(mn) + 闭式公式 O(1) 合成答案</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">mn ≤ 10⁵ ⇒ 阶乘表规模可控，全程无枚举</text>

  <!-- 主流程 -->
  <g filter="url(#rough2)">
    <rect x="60" y="54" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="180" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b">① 输入 m, n, k → N = m·n（≤ 10⁵）</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 180 90 L 180 102" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="60" y="104" width="240" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="180" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b">② 预处理 fact[0..N] / invFact[0..N]</text>
    <text x="180" y="140" text-anchor="middle" font-size="9.5" fill="#55677d">invFact[N] = fact[N]^(p−2)（费马小定理）</text>
    <text x="180" y="153" text-anchor="middle" font-size="9.5" fill="#55677d">再线性倒推 invFact[i−1] = invFact[i]·i</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 180 160 L 144 182" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)"/>
    <path d="M 180 160 L 376 182" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="186" width="220" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="140" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">③ 行项 mod p</text>
    <text x="140" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">n² · m(m−1)(m+1) / 6</text>
    <text x="140" y="241" text-anchor="middle" font-size="9.5" fill="#4a6a3f">每对行 → n² 个格子对</text>
    <text x="140" y="251" text-anchor="middle" font-size="9.5" fill="#4a6a3f">三连乘先精确 ÷6 再取模</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="270" y="186" width="220" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="380" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">③′ 列项 mod p</text>
    <text x="380" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">m² · n(n−1)(n+1) / 6</text>
    <text x="380" y="241" text-anchor="middle" font-size="9.5" fill="#4a6a3f">每对列 → m² 个格子对</text>
    <text x="380" y="251" text-anchor="middle" font-size="9.5" fill="#4a6a3f">同左：先 ÷6 再取模</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 140 256 L 250 283" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 380 256 L 290 283" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="286" width="420" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="270" y="307" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f">④ ans = C(N−2, k−2) × (行项 + 列项) mod p</text>
    <text x="270" y="327" text-anchor="middle" font-size="10.5" fill="#a07830">C(N−2, k−2) = fact[N−2] · invFact[k−2] · invFact[N−k]</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 270 336 L 270 348" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="200" y="352" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="12"/>
    <text x="270" y="368" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">返回 ans ✓</text>
  </g>

  <!-- 实现备忘 -->
  <g filter="url(#rough2)">
    <rect x="330" y="54" width="172" height="112" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 3" rx="10"/>
    <text x="416" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">实现备忘</text>
    <text x="340" y="92" font-size="9.5" fill="#55677d">· ÷6：整数域先整除再取模</text>
    <text x="340" y="107" font-size="9.5" fill="#55677d">· n²≤10¹⁰、三连乘≤10¹⁵</text>
    <text x="340" y="120" font-size="9.5" fill="#55677d">  → long long 安全</text>
    <text x="340" y="135" font-size="9.5" fill="#55677d">· 模乘链各因子先 % p</text>
    <text x="340" y="150" font-size="9.5" fill="#55677d">· m=1 → 行项自动为 0</text>
    <text x="340" y="161" font-size="9.5" fill="#55677d">· k=2 或 k=mn → C=1</text>
  </g>
</svg>
