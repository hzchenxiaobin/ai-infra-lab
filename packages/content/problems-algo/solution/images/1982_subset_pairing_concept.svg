<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：2ⁿ 个子集和按差 d 配对，保留一侧即剥掉一个元素</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">d = sums[1] − sums[0] = 最小 |元素|；每个「不含 x」的和 s 与「含 x」的和 s+x 成对</text>

  <!-- d badge -->
  <rect x="40" y="58" width="170" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="125" y="76" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">d = −2 −(−3) = 1 = min|元素|</text>

  <!-- 8 sum cells, centers 50,110,170,230,290,350,410,470 ; y=110 -->
  <rect x="28" y="110" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="50" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−3</text>
  <rect x="88" y="110" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="110" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−2</text>
  <rect x="148" y="110" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="170" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−1</text>
  <rect x="208" y="110" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="230" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="268" y="110" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="290" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="328" y="110" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="350" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="388" y="110" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="410" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="448" y="110" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="470" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- pairing arcs above (s, s+d): (50,110),(170,230),(290,350),(410,470) -->
  <path d="M 50 110 Q 80 78 110 110" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="74" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+d</text>
  <path d="M 170 110 Q 200 78 230 110" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="74" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+d</text>
  <path d="M 290 110 Q 320 78 350 110" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="74" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+d</text>
  <path d="M 410 110 Q 440 78 470 110" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="74" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+d</text>

  <!-- arrow down -->
  <path d="M 280 160 L 280 176" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="296" y="172" font-size="10" fill="#888">保留一侧</text>

  <!-- Left box: +d keep small -->
  <rect x="30" y="182" width="245" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="152" y="204" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">取 x = +d（元素为正）</text>
  <text x="152" y="224" text-anchor="middle" font-size="11" fill="#333">保留每对中较小者 s（含 sums[0]）</text>
  <rect x="70" y="234" width="165" height="28" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="152" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">L = [−3, −1, 0, 2]</text>
  <text x="152" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">含 0 ✓ → 合法，记录 +1 并递归</text>

  <!-- Right box: -d keep large -->
  <rect x="285" y="182" width="245" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="407" y="204" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">取 x = −d（元素为负）</text>
  <text x="407" y="224" text-anchor="middle" font-size="11" fill="#333">保留每对中较大者 s+d（含 0）</text>
  <rect x="325" y="234" width="165" height="28" fill="#fafafa" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="407" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">L = [−2, 0, 1, 3]</text>
  <text x="407" y="282" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">含 0 ✓ → 合法，记录 −1 并递归</text>

  <!-- footnote -->
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#888">判据：保留集必含 0（空子集和）；不含 0 的分支必非法，立即剪枝</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#888">两种符号都可能合法 → 对应不同原数组，题目接受任意一个</text>
</svg>
