<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按组大小分桶，桶满即成组</text>

  <!-- ===== Section A: input array ===== -->
  <text x="40" y="52" font-size="11" fill="#888" font-weight="bold">输入 groupSizes = [3,3,3,3,3,1,3]</text>

  <!-- Person IDs row -->
  <text x="100" y="70" font-size="10" fill="#aaa">ID:</text>
  <rect x="120" y="58" width="40" height="22" fill="none" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="73" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <rect x="160" y="58" width="40" height="22" fill="none" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="73" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <rect x="200" y="58" width="40" height="22" fill="none" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="73" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <rect x="240" y="58" width="40" height="22" fill="none" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="10" fill="#aaa">3</text>
  <rect x="280" y="58" width="40" height="22" fill="none" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="73" text-anchor="middle" font-size="10" fill="#aaa">4</text>
  <rect x="320" y="58" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="340" y="73" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <rect x="360" y="58" width="40" height="22" fill="none" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="73" text-anchor="middle" font-size="10" fill="#aaa">6</text>

  <!-- GroupSizes values row -->
  <text x="92" y="100" font-size="10" fill="#aaa">size:</text>
  <rect x="120" y="84" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="160" y="84" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="200" y="84" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="240" y="84" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="260" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="280" y="84" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="300" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="320" y="84" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="340" y="99" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <rect x="360" y="84" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="380" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- arrow down to buckets -->
  <path d="M 270 110 L 270 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="124" font-size="10" fill="#888">按 size 分桶</text>

  <!-- ===== Section B: hash map buckets ===== -->
  <text x="40" y="148" font-size="11" fill="#446688" font-weight="bold">哈希桶：size → 待分组人员列表</text>

  <!-- Bucket size=3 -->
  <rect x="40" y="160" width="460" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="56" y="172" width="56" height="24" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84" y="189" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">size=3</text>

  <!-- people in bucket size=3: 0,1,2 (filled→emitted), then 3,4,6 -->
  <rect x="130" y="172" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="148" y="189" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="168" y="172" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="186" y="189" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="206" y="172" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="224" y="189" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <text x="252" y="189" font-size="10" fill="#4a7a3a" font-weight="bold">满3→出组</text>
  <path d="M 296 184 L 316 184" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="324" y="172" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="189" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="362" y="172" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="189" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="400" y="172" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="189" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="446" y="189" font-size="10" fill="#4a7a3a" font-weight="bold">满3→出组</text>

  <text x="130" y="212" font-size="10" fill="#888">桶满即清空，等待下一批同 size 的人继续入桶</text>

  <!-- Bucket size=1 -->
  <rect x="40" y="238" width="460" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="56" y="250" width="56" height="24" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84" y="267" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">size=1</text>

  <rect x="130" y="250" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="148" y="267" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="180" y="267" font-size="10" fill="#d6a040" font-weight="bold">满1→立即出组</text>

  <!-- arrow down to result -->
  <path d="M 270 288 L 270 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section C: result ===== -->
  <text x="40" y="324" font-size="11" fill="#4a7a3a" font-weight="bold">输出：每组人数恰好等于该组的指定大小</text>

  <rect x="60" y="336" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="355" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">[5]</text>

  <rect x="180" y="336" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="355" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">[0,1,2]</text>

  <rect x="320" y="336" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="355" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">[3,4,6]</text>

  <!-- ===== Section D: key insight ===== -->
  <rect x="40" y="378" width="460" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="398" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键：同 size 的人可互换——桶满即出组，不关心具体是谁</text>
</svg>
