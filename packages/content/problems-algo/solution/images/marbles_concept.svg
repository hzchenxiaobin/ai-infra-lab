<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">切点贡献可加：每个切点 i 贡献 weights[i]+weights[i+1]，首尾固定</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">分数 = weights[0]+weights[n−1] + Σ(切点贡献 p_i)</text>

  <!-- weights array row -->
  <text x="40" y="86" font-size="11" fill="#446688" font-weight="bold">weights =</text>
  <g font-size="13">
    <rect x="120" y="72" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="144" y="93" text-anchor="middle" fill="#333">1</text>
    <rect x="180" y="72" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="204" y="93" text-anchor="middle" fill="#333">3</text>
    <rect x="240" y="72" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="264" y="93" text-anchor="middle" fill="#333">5</text>
    <rect x="300" y="72" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="324" y="93" text-anchor="middle" fill="#333">1</text>
  </g>
  <text x="140" y="122" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">首(固定)</text>
  <text x="324" y="122" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">尾(固定)</text>

  <!-- cut scissors between elements -->
  <text x="170" y="138" text-anchor="middle" font-size="16" fill="#d6a040">✂</text>
  <text x="230" y="138" text-anchor="middle" font-size="16" fill="#d6a040">✂</text>
  <text x="290" y="138" text-anchor="middle" font-size="16" fill="#d6a040">✂</text>
  <text x="170" y="152" text-anchor="middle" font-size="9" fill="#d6a040">切点0</text>
  <text x="230" y="152" text-anchor="middle" font-size="9" fill="#d6a040">切点1</text>
  <text x="290" y="152" text-anchor="middle" font-size="9" fill="#d6a040">切点2</text>

  <!-- pair contributions p -->
  <text x="40" y="186" font-size="11" fill="#4a7a3a" font-weight="bold">配对贡献 p：</text>
  <g font-size="12">
    <rect x="146" y="172" width="88" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="190" y="191" text-anchor="middle" fill="#333">1+3=4</text>
  </g>
  <text x="190" y="216" text-anchor="middle" font-size="9" fill="#4a7a3a">p₀</text>
  <g font-size="12">
    <rect x="206" y="172" width="88" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)" opacity="0.85"/>
    <text x="250" y="191" text-anchor="middle" fill="#333">3+5=8</text>
  </g>
  <text x="250" y="216" text-anchor="middle" font-size="9" fill="#4a7a3a">p₁</text>
  <g font-size="12">
    <rect x="266" y="172" width="88" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)" opacity="0.7"/>
    <text x="310" y="191" text-anchor="middle" fill="#333">5+1=6</text>
  </g>
  <text x="310" y="216" text-anchor="middle" font-size="9" fill="#4a7a3a">p₂</text>

  <!-- arrows from weights to pair contributions -->
  <path d="M 144 108 L 190 170" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <path d="M 204 108 L 250 170" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <path d="M 264 108 L 310 170" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="30" y="248" width="540" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="276" font-size="13" fill="#444" font-weight="bold">分数 = 段首之和 + 段尾之和</text>
  <text x="50" y="300" font-size="12" fill="#555">展开重排：内部下标恰出现两次（前段尾 + 后段首）</text>
  <text x="50" y="322" font-size="12" fill="#b85450" font-weight="bold">score = weights[0] + weights[n−1]   +   Σ p_(切点)</text>
  <text x="50" y="340" font-size="11" fill="#888">            └── 固定项（恒定） ──┘   └── 选 k−1 个切点 ──┘</text>
  <text x="50" y="362" font-size="12" fill="#4a7a3a" font-weight="bold">max − min = (末 k−1 个 p 之和) − (首 k−1 个 p 之和)</text>
  <text x="50" y="382" font-size="10" fill="#888">固定项在两极值里相同，求差时直接抵消 → 只需排序 p 取首末之和</text>
  <text x="50" y="396" font-size="10" fill="#888">每个切点贡献独立可加：把组合级划分搜索压成 O(n log n)</text>
</svg>
