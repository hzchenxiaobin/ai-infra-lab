<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="980" height="430" fill="#fafafa"/>
  <text x="490" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：push(5,1,5) → top / popMax / top / peekMax / pop / top</text>
  <path d="M 300 40 Q 490 48 680 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="90" height="36" rx="4" fill="#fffdf3" stroke="#9e9e9e"/>
    <rect x="130" y="64" width="330" height="36" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="460" y="64" width="300" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b"/>
    <rect x="760" y="64" width="180" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a"/>
  </g>
  <text x="85" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">操作</text>
  <text x="295" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">链表（栈底→栈顶，[cnt] 标序）</text>
  <text x="610" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">大根堆条目 (val,cnt)</text>
  <text x="850" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">返回</text>

  <!-- 行 1 push(5) -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff">
    <rect x="40" y="100" width="90" height="32"/><rect x="130" y="100" width="330" height="32" fill="#f4f8fe"/><rect x="460" y="100" width="300" height="32" fill="#fbf3e0"/><rect x="760" y="100" width="180" height="32" fill="#f3f9f3"/>
  </g></g>
  <text x="85" y="120" text-anchor="middle" font-size="11" fill="#333">push(5)</text>
  <text x="295" y="120" text-anchor="middle" font-size="11" fill="#2b6e9e">[5(0)]</text>
  <text x="610" y="120" text-anchor="middle" font-size="11" fill="#7a5415">(5,0)</text>
  <text x="850" y="120" text-anchor="middle" font-size="11" fill="#999">—</text>

  <!-- 行 2 push(1) -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff">
    <rect x="40" y="132" width="90" height="32"/><rect x="130" y="132" width="330" height="32" fill="#f4f8fe"/><rect x="460" y="132" width="300" height="32" fill="#fbf3e0"/><rect x="760" y="132" width="180" height="32" fill="#f3f9f3"/>
  </g></g>
  <text x="85" y="152" text-anchor="middle" font-size="11" fill="#333">push(1)</text>
  <text x="295" y="152" text-anchor="middle" font-size="11" fill="#2b6e9e">[5(0), 1(1)]</text>
  <text x="610" y="152" text-anchor="middle" font-size="11" fill="#7a5415">(5,0)　(1,1)</text>
  <text x="850" y="152" text-anchor="middle" font-size="11" fill="#999">—</text>

  <!-- 行 3 push(5) -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff">
    <rect x="40" y="164" width="90" height="32"/><rect x="130" y="164" width="330" height="32" fill="#f4f8fe"/><rect x="460" y="164" width="300" height="32" fill="#fbf3e0"/><rect x="760" y="164" width="180" height="32" fill="#f3f9f3"/>
  </g></g>
  <text x="85" y="184" text-anchor="middle" font-size="11" fill="#333">push(5)</text>
  <text x="295" y="184" text-anchor="middle" font-size="11" fill="#2b6e9e">[5(0), 1(1), <tspan fill="#b03a3a" font-weight="bold">5(2)</tspan>]</text>
  <text x="610" y="184" text-anchor="middle" font-size="11" fill="#7a5415">(5,0)　(1,1)　<tspan fill="#b03a3a" font-weight="bold">(5,2)</tspan></text>
  <text x="850" y="184" text-anchor="middle" font-size="11" fill="#999">—</text>

  <!-- 行 4 top() -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff">
    <rect x="40" y="196" width="90" height="32"/><rect x="130" y="196" width="330" height="32" fill="#f4f8fe"/><rect x="460" y="196" width="300" height="32" fill="#fbf3e0"/><rect x="760" y="196" width="180" height="32" fill="#d9f0d9"/>
  </g></g>
  <text x="85" y="216" text-anchor="middle" font-size="11" fill="#333">top()</text>
  <text x="295" y="216" text-anchor="middle" font-size="11" fill="#999">不变（栈顶 = 5(2)）</text>
  <text x="610" y="216" text-anchor="middle" font-size="11" fill="#999">不变</text>
  <text x="850" y="216" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">→ 5　O(1)</text>

  <!-- 行 5 popMax()  重点行 -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff">
    <rect x="40" y="228" width="90" height="32" fill="#fce4ec" stroke="#b85450"/><rect x="130" y="228" width="330" height="32" fill="#fce4ec"/><rect x="460" y="228" width="300" height="32" fill="#fce4ec"/><rect x="760" y="228" width="180" height="32" fill="#d9f0d9"/>
  </g></g>
  <text x="85" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">popMax()</text>
  <text x="295" y="248" text-anchor="middle" font-size="11" fill="#2b6e9e">[5(0), 1(1)]　<tspan fill="#b85450" text-decoration="line-through">（删 5(2)）</tspan></text>
  <text x="610" y="248" text-anchor="middle" font-size="11" fill="#7a5415"><tspan fill="#b85450" text-decoration="line-through">(5,2)</tspan> 出堆 → 顶=<tspan fill="#4a7a3a" font-weight="bold">(5,0)</tspan></text>
  <text x="850" y="248" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">→ 5</text>

  <!-- 行 6 top() -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff">
    <rect x="40" y="260" width="90" height="32"/><rect x="130" y="260" width="330" height="32" fill="#f4f8fe"/><rect x="460" y="260" width="300" height="32" fill="#fbf3e0"/><rect x="760" y="260" width="180" height="32" fill="#d9f0d9"/>
  </g></g>
  <text x="85" y="280" text-anchor="middle" font-size="11" fill="#333">top()</text>
  <text x="295" y="280" text-anchor="middle" font-size="11" fill="#999">不变（栈顶 = 1(1)）</text>
  <text x="610" y="280" text-anchor="middle" font-size="11" fill="#999">不变</text>
  <text x="850" y="280" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">→ 1　O(1)</text>

  <!-- 行 7 peekMax() -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff">
    <rect x="40" y="292" width="90" height="32"/><rect x="130" y="292" width="330" height="32" fill="#f4f8fe"/><rect x="460" y="292" width="300" height="32" fill="#fbf3e0"/><rect x="760" y="292" width="180" height="32" fill="#d9f0d9"/>
  </g></g>
  <text x="85" y="312" text-anchor="middle" font-size="11" fill="#333">peekMax()</text>
  <text x="295" y="312" text-anchor="middle" font-size="11" fill="#999">不变</text>
  <text x="610" y="312" text-anchor="middle" font-size="11" fill="#7a5415">堆顶 (5,0) 未删，直接读</text>
  <text x="850" y="312" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">→ 5</text>

  <!-- 行 8 pop()  重点行 -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff">
    <rect x="40" y="324" width="90" height="32" fill="#fce4ec" stroke="#b85450"/><rect x="130" y="324" width="330" height="32" fill="#fce4ec"/><rect x="460" y="324" width="300" height="32" fill="#fce4ec"/><rect x="760" y="324" width="180" height="32" fill="#d9f0d9"/>
  </g></g>
  <text x="85" y="344" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">pop()</text>
  <text x="295" y="344" text-anchor="middle" font-size="11" fill="#2b6e9e">[5(0)]　<tspan fill="#b85450" text-decoration="line-through">（删 1(1)）</tspan></text>
  <text x="610" y="344" text-anchor="middle" font-size="11" fill="#7a5415"><tspan fill="#b85450" text-decoration="line-through">(1,1)</tspan> 残留 removed=true（待日后清理）</text>
  <text x="850" y="344" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">→ 1</text>

  <!-- 行 9 top() -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff">
    <rect x="40" y="356" width="90" height="32"/><rect x="130" y="356" width="330" height="32" fill="#f4f8fe"/><rect x="460" y="356" width="300" height="32" fill="#fbf3e0"/><rect x="760" y="356" width="180" height="32" fill="#d9f0d9"/>
  </g></g>
  <text x="85" y="376" text-anchor="middle" font-size="11" fill="#333">top()</text>
  <text x="295" y="376" text-anchor="middle" font-size="11" fill="#999">不变（栈顶 = 5(0)）</text>
  <text x="610" y="376" text-anchor="middle" font-size="11" fill="#999">不变</text>
  <text x="850" y="376" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">→ 5　O(1)</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="40" y="396" width="900" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="490" y="413" text-anchor="middle" font-size="11" fill="#4a7a3a">关键：popMax 弹 (5,2) 而非 (5,0) —— cnt 大者优先 → "最靠近栈顶"的最大值；pop 后 (1,1) 残留堆中靠 removed 跳过。</text>
</svg>
