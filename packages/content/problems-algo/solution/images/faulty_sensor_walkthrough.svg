<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：sensor1 = [2,3,4,5], sensor2 = [2,1,3,4]</text>

  <!-- ===== Array display ===== -->
  <!-- index header -->
  <text x="60" y="68" font-size="10" fill="#888">下标</text>
  <text x="150" y="68" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="210" y="68" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="270" y="68" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="330" y="68" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="370" y="68" font-size="10" fill="#d6a040" font-weight="bold">(末位)</text>

  <!-- sensor1 row -->
  <text x="60" y="100" font-size="11" fill="#446688" font-weight="bold">sensor1</text>
  <rect x="120" y="78" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="180" y="78" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="240" y="78" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <!-- last: random (orange dashed) -->
  <rect x="300" y="74" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="332" y="101" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">5</text>

  <!-- sensor2 row -->
  <text x="60" y="148" font-size="11" fill="#4a7a3a" font-weight="bold">sensor2</text>
  <rect x="120" y="126" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="180" y="126" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="240" y="126" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="300" y="126" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="332" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- ===== Step trace ===== -->
  <!-- Step 1: i=0 定位 -->
  <rect x="40" y="184" width="540" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="200" font-size="11" fill="#4a7a3a" font-weight="bold">步骤1 · 定位</text>
  <text x="56" y="216" font-size="11" fill="#333">i=0: sensor1[0]=2 == sensor2[0]=2 ✓ 相等，跳过，i → 1</text>

  <!-- highlight i=0 cells with a ring -->
  <rect x="118" y="76" width="64" height="40" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>

  <!-- Step 2: i=1 定位失配 -->
  <rect x="40" y="232" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="248" font-size="11" fill="#d6a040" font-weight="bold">步骤2 · 定位</text>
  <text x="56" y="264" font-size="11" fill="#333">i=1: sensor1[1]=3 != sensor2[1]=1 ✗ 首个失配！定位结束，掉落点 = 1</text>

  <!-- highlight i=1 cells with red ring -->
  <rect x="178" y="124" width="64" height="40" fill="none" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <rect x="178" y="76" width="64" height="40" fill="none" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>

  <!-- Step 3: 验证 i=1 -->
  <rect x="40" y="280" width="540" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="296" font-size="11" fill="#b85450" font-weight="bold">步骤3 · 验证</text>
  <text x="56" y="312" font-size="11" fill="#333">i=1: 检查 sensor1[2]=4 vs sensor2[1]=1 → 4 != 1</text>
  <text x="56" y="328" font-size="11" fill="#b85450" font-weight="bold">sensor2 不满足「= sensor1 左移」⇒ sensor2 非缺陷 ⇒ 返回 1</text>

  <!-- highlight verification pair: sensor1[2] and sensor2[1] -->
  <rect x="238" y="76" width="64" height="40" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="178" y="124" width="64" height="40" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <!-- dashed link between sensor1[2] and sensor2[1] -->
  <path d="M 270 114 L 210 126" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="120" y="352" width="380" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="372" text-anchor="middle" font-size="11" fill="#555">结论：sensor1 丢弃了位置 1 的值（1），末位 5 为随机值</text>
  <text x="310" y="386" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 1（sensor1 有缺陷）</text>

  <!-- Note -->
  <rect x="40" y="408" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="424" font-size="10" fill="#666">💡 末位 sensor1[3]=5（随机值）自始至终未被访问；验证在 i=1 即停止。</text>
  <text x="56" y="440" font-size="10" fill="#666">    若反过来检查 sensor1[1]=3 vs sensor2[2]=3 → 相等，sensor1 仍可能是缺陷方（未排除），继续向后才会见分晓。</text>
</svg>
