<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：外层切段、内层吃字符，封顶或换字符即输出</text>

  <!-- start -->
  <rect x="190" y="40" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">comp = []；i = 0</text>

  <path d="M 250 72 L 250 82" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- D1: i < n ? -->
  <polygon points="250,86 322,112 250,138 178,112" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="116" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <!-- D1 no -> return -->
  <path d="M 322 112 L 374 112" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="346" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="378" y="95" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="433" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 comp</text>

  <!-- D1 yes -->
  <path d="M 250 138 L 250 152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="151" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- R2 -->
  <rect x="175" y="156" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="177" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c = word[i]；len = 0</text>

  <path d="M 250 190 L 250 202" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- D2 -->
  <polygon points="250,206 340,240 250,274 160,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="236" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">word[i] == c</text>
  <text x="250" y="252" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">且 len &lt; 9 ?</text>

  <!-- D2 yes -> R3 -->
  <path d="M 340 240 L 384 240" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="360" y="232" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="388" y="223" width="104" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="440" y="244" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i++；len++</text>

  <!-- loop R3 back to D2 -->
  <path d="M 440 223 C 440 194, 350 192, 288 215" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- D2 no -> R4 -->
  <path d="M 250 274 L 250 288" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="287" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="155" y="292" width="190" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="314" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">comp += str(len) + c</text>

  <!-- loop R4 back to D1 -->
  <path d="M 155 310 L 60 310 L 60 112 L 172 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="74" y="208" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">下一段</text>

  <text x="380" y="340" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">len ∈ [1,9] 恒成立：</text>
  <text x="380" y="354" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">word 非空 → 内层至少吃 1 个字符</text>
</svg>
