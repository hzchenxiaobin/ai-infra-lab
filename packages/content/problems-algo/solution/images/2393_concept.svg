<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：以 i 结尾的递增子数组数 = 当前递增段长度</text>

  <!-- ===== Row: nums ===== -->
  <text x="62" y="74" font-size="11" fill="#888">nums =</text>
  <g filter="url(#rough2)">
    <rect x="142" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="165" y="77" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
    <rect x="192" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="215" y="77" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">3</text>
    <rect x="242" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="265" y="77" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">5</text>
    <rect x="292" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="315" y="77" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">4</text>
    <rect x="342" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="365" y="77" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">4</text>
    <rect x="392" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="415" y="77" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">6</text>
  </g>

  <!-- comparison symbols + down arrows to len row -->
  <text x="190" y="104" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">&gt;</text>
  <path d="M 190 110 L 190 128" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="190" y="123" font-size="9" fill="#4a7a3a" font-weight="bold" text-anchor="start">+1</text>

  <text x="240" y="104" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">&gt;</text>
  <path d="M 240 110 L 240 128" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="290" y="104" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">&lt;</text>
  <path d="M 290 110 L 290 128" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="290" y="123" font-size="9" fill="#b85450" font-weight="bold" text-anchor="start">归1</text>

  <text x="340" y="104" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">=</text>
  <path d="M 340 110 L 340 128" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="390" y="104" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">&gt;</text>
  <path d="M 390 110 L 390 128" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Row: len[i] ===== -->
  <text x="42" y="150" font-size="11" fill="#888">len[i] =</text>
  <g filter="url(#rough2)">
    <rect x="142" y="132" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="165" y="153" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
    <rect x="192" y="132" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="215" y="153" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="242" y="132" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="265" y="153" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="292" y="132" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="315" y="153" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
    <rect x="342" y="132" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="365" y="153" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
    <rect x="392" y="132" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="415" y="153" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  </g>
  <!-- index labels under len cells -->
  <text x="165" y="178" text-anchor="middle" font-size="10" fill="#999">i=0</text>
  <text x="215" y="178" text-anchor="middle" font-size="10" fill="#999">i=1</text>
  <text x="265" y="178" text-anchor="middle" font-size="10" fill="#999">i=2</text>
  <text x="315" y="178" text-anchor="middle" font-size="10" fill="#999">i=3</text>
  <text x="365" y="178" text-anchor="middle" font-size="10" fill="#999">i=4</text>
  <text x="415" y="178" text-anchor="middle" font-size="10" fill="#999">i=5</text>

  <!-- recurrence text -->
  <text x="290" y="202" text-anchor="middle" font-size="12" fill="#333">len[i] = len[i−1] + 1（<tspan fill="#4a7a3a" font-weight="bold">nums[i] &gt; nums[i−1]</tspan>）　或　1（<tspan fill="#b85450" font-weight="bold">nums[i] ≤ nums[i−1]</tspan>）</text>

  <!-- ===== Insight box 1 ===== -->
  <rect x="30" y="218" width="520" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="46" y="240" font-size="12" fill="#4a7a3a" font-weight="bold">关键一：以 i 结尾的递增子数组 ⟺ 当前递增段的右起前缀</text>
  <text x="46" y="260" font-size="11" fill="#444">若 nums[i] &gt; nums[i−1]，则所有以 i−1 结尾的递增子数组接上 nums[i] 仍递增，再添 [nums[i]] 本身，</text>
  <text x="46" y="276" font-size="11" fill="#444">故个数 = len[i−1] + 1；否则递增链断裂，只剩单元素 [nums[i]]，个数 = 1。</text>

  <!-- ===== Insight box 2 ===== -->
  <rect x="30" y="294" width="520" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="46" y="316" font-size="12" fill="#d6a040" font-weight="bold">关键二：每个子数组按「结尾下标」唯一计数 → 答案 = Σ len[i]</text>
  <text x="46" y="336" font-size="11" fill="#444">任意严格递增子数组 nums[j..i] 必以其右端 i 为结尾，恰被 len[i] 计入一次，不重不漏。</text>
  <text x="46" y="352" font-size="11" fill="#888">等价写法：按递增段计数，长 L 的段贡献 L(L+1)/2 个子数组。</text>

  <!-- ===== Answer line ===== -->
  <rect x="110" y="370" width="360" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="13" fill="#333">答案 = 1 + 2 + 3 + 1 + 1 + 2 = <tspan fill="#4a7a3a" font-weight="bold" font-size="16">10</tspan></text>

  <!-- reset legend -->
  <rect x="40" y="416" width="500" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="434" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠️ 严格递增要求 nums[i] &gt; nums[i−1]，相等也算断裂：i=3（4&lt;5）、i=4（4=4）均 reset</text>
</svg>
