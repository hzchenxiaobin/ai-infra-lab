<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：先打表预处理，再逐个二分查询</text>
  <text x="530" y="44" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">预处理 O(2^13 × 13) ≈ 10^5，单次查询 O(log 190)</text>

  <!-- 阶段一：预处理 -->
  <rect x="36" y="70" width="190" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="131" y="91" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">阶段①：枚举 x = 1 … 8191</text>

  <rect x="246" y="70" width="110" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="301" y="91" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">逐位反转 rev(x)</text>

  <polygon points="432,62 502,96 432,130 362,96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="432" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">rev(x) == x ?</text>

  <path d="M 226 87 L 246 87" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 356 87 L 364 94" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 否：跳过，回到枚举 -->
  <path d="M 432 62 C 432 24, 131 24, 131 70" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="281" y="34" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否（跳过）</text>

  <!-- 是：收进 pals -->
  <path d="M 432 130 L 445 168" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="152" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="368" y="168" width="170" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="453" y="189" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">收进 pals（回文表）</text>

  <!-- 下一个 x：回到枚举 -->
  <path d="M 368 185 C 240 200, 131 160, 131 104" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="240" y="172" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">下一个 x</text>

  <!-- 枚举结束：得到有序回文表 -->
  <path d="M 453 202 L 453 224" fill="none" stroke="#999" stroke-width="1.3" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="462" y="216" font-size="9" fill="#999" filter="url(#rough2)">枚举结束</text>
  <rect x="368" y="224" width="170" height="34" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="453" y="245" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">pals：升序回文表（190 个）</text>

  <!-- 阶段二：逐个查询 -->
  <rect x="36" y="272" width="190" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="131" y="293" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">阶段②：取 x = nums[i]</text>

  <rect x="266" y="272" width="230" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="381" y="293" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">二分找第一个 ≥ x 的回文 pals[j]</text>

  <path d="M 226 289 L 266 289" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 回文表供给查询 -->
  <path d="M 430 258 L 370 272" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <path d="M 381 306 L 381 334" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="266" y="334" width="230" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="381" y="352" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">ans[i] = min(pals[j] - x, x - pals[j-1])</text>
  <text x="381" y="370" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">（越界方向跳过；命中自身则为 0）</text>

  <!-- 下一个查询 -->
  <path d="M 266 357 C 200 384, 131 380, 131 306" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="200" y="390" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">下一个查询</text>
</svg>
