<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：分组提取 → 各组求 LNIS → 累加 (len − LNIS)</text>

  <!-- Step 1: group by mod k -->
  <rect x="160" y="46" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">① 按模 k 分组提取子序列</text>
  <text x="270" y="80" text-anchor="middle" font-size="10.5" fill="#555">S_r = arr[r], arr[r+k], arr[r+2k], …</text>

  <!-- arrow -->
  <path d="M 270 88 L 270 104" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: for each group, LNIS via upper_bound -->
  <rect x="120" y="108" width="300" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">② 对当前组 S_r 求 LNIS（贪心 + 二分）</text>
  <text x="270" y="144" text-anchor="middle" font-size="10.5" fill="#555">维护 tail：x 用 upper_bound 找首个 &gt; x 替换</text>
  <text x="270" y="159" text-anchor="middle" font-size="10.5" fill="#555">找不到则追加；最终 len(tail) = LNIS</text>

  <!-- loop back: next r -->
  <path d="M 420 138 L 470 138 L 470 78 L 380 78" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="478" y="112" font-size="10" fill="#888">r+1</text>
  <text x="478" y="126" font-size="10" fill="#888">下一组</text>

  <!-- arrow down -->
  <path d="M 270 168 L 270 184" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: accumulate -->
  <rect x="140" y="188" width="260" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="208" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">③ 累加该组改动数</text>
  <text x="270" y="225" text-anchor="middle" font-size="11" fill="#555">ans += |S_r| − LNIS(S_r)</text>

  <!-- arrow down -->
  <path d="M 270 236 L 270 252" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: more groups? -->
  <polygon points="270,256 360,296 270,336 180,296" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="292" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">还有</text>
  <text x="270" y="308" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">未处理组？</text>

  <!-- Yes branch: loop back to step 2 -->
  <path d="M 180 296 L 120 296 L 120 138 L 120 138" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 120 296 L 120 138" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="110" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <text x="110" y="234" font-size="9.5" fill="#888">回到 ②</text>

  <!-- No branch: down to return -->
  <path d="M 270 336 L 270 356" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="350" font-size="10" fill="#888">否 ✗</text>

  <!-- Step 4: return ans -->
  <rect x="150" y="360" width="240" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="381" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">④ 返回 ans（总最少操作次数）</text>
</svg>
