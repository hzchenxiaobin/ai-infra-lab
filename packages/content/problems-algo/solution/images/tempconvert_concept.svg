<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：K 是纯平移（单位相同），F 是缩放+平移（仿射映射）</text>

  <!-- ====== reference labels (left margin) ====== -->
  <text x="100" y="68" text-anchor="end" font-size="11" fill="#888">水冰点</text>
  <text x="440" y="68" text-anchor="start" font-size="11" fill="#888">水沸点</text>

  <!-- vertical reference dashed lines (freezing & boiling) -->
  <path d="M 110 60 L 110 232" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <path d="M 430 60 L 430 232" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- ====== Celsius row ====== -->
  <text x="42" y="102" text-anchor="end" font-size="12.5" fill="#446688" font-weight="bold">摄氏 °C</text>
  <rect x="110" y="88" width="320" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="110" y="104" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="190" y="104" text-anchor="middle" font-size="10" fill="#333">25</text>
  <text x="270" y="104" text-anchor="middle" font-size="10" fill="#333">50</text>
  <text x="350" y="104" text-anchor="middle" font-size="10" fill="#333">75</text>
  <text x="430" y="104" text-anchor="middle" font-size="10" fill="#333">100</text>
  <!-- tick marks -->
  <path d="M 110 84 L 110 88 M 190 84 L 190 88 M 270 84 L 270 88 M 350 84 L 350 88 M 430 84 L 430 88" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- arrow C -> K : pure translation -->
  <path d="M 60 114 L 60 138" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="68" y="130" font-size="11" fill="#4a7a3a" font-weight="bold">+273.15</text>
  <text x="68" y="143" font-size="9.5" fill="#888">零点平移，单位不变</text>

  <!-- ====== Kelvin row (same spacing) ====== -->
  <text x="42" y="160" text-anchor="end" font-size="12.5" fill="#4a7a3a" font-weight="bold">开氏 K</text>
  <rect x="110" y="146" width="320" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="110" y="162" text-anchor="middle" font-size="9.5" fill="#333">273.15</text>
  <text x="190" y="162" text-anchor="middle" font-size="9.5" fill="#333">298.15</text>
  <text x="270" y="162" text-anchor="middle" font-size="9.5" fill="#333">323.15</text>
  <text x="350" y="162" text-anchor="middle" font-size="9.5" fill="#333">348.15</text>
  <text x="430" y="162" text-anchor="middle" font-size="9.5" fill="#333">373.15</text>
  <path d="M 110 142 L 110 146 M 190 142 L 190 146 M 270 142 L 270 146 M 350 142 L 350 146 M 430 142 L 430 146" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- arrow C -> F : affine (scale + shift) -->
  <path d="M 60 172 L 60 196" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="68" y="186" font-size="11" fill="#d6a040" font-weight="bold">×1.8 +32</text>
  <text x="68" y="199" font-size="9.5" fill="#888">缩放 9/5 倍再平移</text>

  <!-- ====== Fahrenheit row (same physical span, different labels) ====== -->
  <text x="42" y="218" text-anchor="end" font-size="12.5" fill="#d6a040" font-weight="bold">华氏 °F</text>
  <rect x="110" y="204" width="320" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="110" y="220" text-anchor="middle" font-size="10" fill="#333">32</text>
  <text x="190" y="220" text-anchor="middle" font-size="10" fill="#333">77</text>
  <text x="270" y="220" text-anchor="middle" font-size="10" fill="#333">122</text>
  <text x="350" y="220" text-anchor="middle" font-size="10" fill="#333">167</text>
  <text x="430" y="220" text-anchor="middle" font-size="10" fill="#333">212</text>
  <path d="M 110 200 L 110 204 M 190 200 L 190 204 M 270 200 L 270 204 M 350 200 L 350 204 M 430 200 L 430 204" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- ====== bottom annotation ====== -->
  <rect x="30" y="248" width="480" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="270" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">同一物理区间（水冰点→沸点）在三种刻度上的数值</text>
  <text x="270" y="288" text-anchor="middle" font-size="10.5" fill="#555">K 与 C 刻度间距相同：1K = 1°C，仅零点从「水冰点」平移到「绝对零度」（−273.15°C）</text>
  <text x="270" y="305" text-anchor="middle" font-size="10.5" fill="#555">F 与 C 刻度间距不同：100°C = 180°F ⟹ 1°C = 9/5°F = 1.8°F，故 F = 1.8·C + 32</text>
  <text x="270" y="322" text-anchor="middle" font-size="10" fill="#888">仿射映射 y = a·x + b 由两参考点（水冰点、水沸点）唯一确定</text>
  <text x="270" y="338" text-anchor="middle" font-size="10" fill="#888">绝对零度：0K = −273.15°C = −459.67°F（三刻度的共同下限）</text>
</svg>
