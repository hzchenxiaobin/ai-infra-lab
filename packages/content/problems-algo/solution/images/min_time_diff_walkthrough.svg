<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：["23:59","00:00"] → 最小差 1</text>

  <!-- ===== 左：示例 1 逐步推演 ===== -->

  <!-- ① 输入 -->
  <text x="40" y="62" font-size="11" fill="#888" font-weight="bold">① 输入</text>
  <rect x="120" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">23:59</text>
  <rect x="184" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">00:00</text>

  <path d="M 148 80 L 148 96" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 转分钟 -->
  <text x="40" y="116" font-size="11" fill="#888" font-weight="bold">② 转分钟</text>
  <text x="40" y="130" font-size="9" fill="#888">HH×60+MM</text>
  <rect x="120" y="104" width="56" height="26" fill="#ffffff" stroke="#666" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="148" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1439</text>
  <rect x="184" y="104" width="56" height="26" fill="#ffffff" stroke="#666" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="212" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>

  <path d="M 148 134 L 148 150" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 排序 -->
  <text x="40" y="170" font-size="11" fill="#888" font-weight="bold">③ 排序</text>
  <text x="40" y="184" font-size="9" fill="#888">升序</text>
  <rect x="120" y="158" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="184" y="158" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="212" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1439</text>

  <path d="M 148 188 L 148 204" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 两类候选 -->
  <text x="40" y="222" font-size="11" fill="#888" font-weight="bold">④ 两类候选</text>

  <!-- 相邻差（灰） -->
  <rect x="120" y="212" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="227" text-anchor="middle" font-size="10" fill="#333">0</text>
  <path d="M 162 223 L 184 223" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <rect x="186" y="212" width="46" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="209" y="227" text-anchor="middle" font-size="9" fill="#333">1439</text>
  <rect x="244" y="212" width="66" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="277" y="227" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">相邻=1439</text>

  <!-- 首尾环形（红） -->
  <rect x="120" y="244" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="140" y="259" text-anchor="middle" font-size="10" fill="#333">0</text>
  <path d="M 209 244 C 209 230, 147 230, 147 244" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="178" y="234" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">跨午夜</text>
  <rect x="186" y="244" width="46" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="209" y="259" text-anchor="middle" font-size="9" fill="#333">1439</text>
  <rect x="244" y="244" width="66" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="277" y="259" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">环形=1</text>

  <path d="M 148 276 L 148 292" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 结果 -->
  <text x="40" y="308" font-size="11" fill="#888" font-weight="bold">⑤ 取最小</text>
  <rect x="100" y="296" width="210" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="205" y="315" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">min(1439, 1) = 1 ✓</text>

  <!-- 底部提示 -->
  <rect x="30" y="346" width="340" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="46" y="368" font-size="11" fill="#333" font-weight="bold">关键：相邻差 1439 是「假最远」，首尾跨午夜才</text>
  <text x="46" y="384" font-size="11" fill="#333" font-weight="bold">是真最小 1。</text>
  <text x="46" y="400" font-size="10" fill="#b85450" font-weight="bold">⚠️ 漏算环形会错答 1439</text>

  <!-- ===== 右：示例 2 简版 ===== -->
  <rect x="400" y="50" width="160" height="266" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="480" y="70" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">示例 2（含重复）</text>

  <text x="412" y="92" font-size="10" fill="#888">输入：</text>
  <rect x="412" y="98" width="44" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="434" y="112" text-anchor="middle" font-size="8" fill="#333">00:00</text>
  <rect x="460" y="98" width="44" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="482" y="112" text-anchor="middle" font-size="8" fill="#333">23:59</text>
  <rect x="508" y="98" width="44" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="530" y="112" text-anchor="middle" font-size="8" fill="#333">00:00</text>

  <text x="412" y="140" font-size="10" fill="#888">转分钟：</text>
  <text x="412" y="156" font-size="10" fill="#333">[0, 1439, 0]</text>

  <text x="412" y="178" font-size="10" fill="#888">排序：</text>
  <rect x="412" y="184" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="430" y="198" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="452" y="184" width="36" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="470" y="198" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="492" y="184" width="44" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="514" y="198" text-anchor="middle" font-size="8" fill="#333">1439</text>

  <text x="412" y="224" font-size="10" fill="#888">相邻差：</text>
  <rect x="412" y="230" width="124" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="474" y="245" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0 − 0 = 0</text>

  <text x="412" y="272" font-size="10" fill="#4a7a3a" font-weight="bold">命中重复 → return 0 ✓</text>
  <text x="412" y="290" font-size="9" fill="#888">（与鸽巢原理同源）</text>

  <!-- 右底提示 -->
  <rect x="400" y="346" width="160" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="480" y="368" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">排序后相邻为 0</text>
  <text x="480" y="384" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⇔ 存在重复时间</text>
  <text x="480" y="400" text-anchor="middle" font-size="10" fill="#888">与 n&gt;1440 早退同原理</text>
</svg>
