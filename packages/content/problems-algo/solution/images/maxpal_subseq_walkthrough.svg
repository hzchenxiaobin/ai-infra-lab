<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "cacbcbba"，n1 = 4</text>

  <!-- s string row -->
  <text x="36" y="62" font-size="11" fill="#888">s =</text>
  <!-- word1 green: c a c b (0..3) -->
  <rect x="70"  y="50" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90"  y="70" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="114" y="50" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="134" y="70" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="158" y="50" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="178" y="70" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="202" y="50" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="222" y="70" text-anchor="middle" font-size="13" fill="#333">b</text>
  <!-- word2 blue: c b b a (4..7) -->
  <rect x="246" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="266" y="70" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="290" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="70" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="334" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="354" y="70" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="378" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="398" y="70" text-anchor="middle" font-size="13" fill="#333">a</text>

  <!-- indices -->
  <text x="90"  y="94" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="134" y="94" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="178" y="94" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="222" y="94" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="266" y="94" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="310" y="94" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="354" y="94" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="398" y="94" text-anchor="middle" font-size="9" fill="#aaa">7</text>

  <!-- boundary -->
  <path d="M 244 44 L 244 98" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <text x="244" y="40" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">n1=4</text>

  <!-- highlight pair (1,7) red rings -->
  <rect x="110" y="46" width="48" height="38" fill="none" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <rect x="374" y="46" width="48" height="38" fill="none" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>

  <!-- table header -->
  <text x="300" y="124" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">横跨候选对（s[i]=s[j] 且 i &lt; 4 ≤ j）</text>

  <!-- header row -->
  <rect x="50" y="134" width="500" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90"  y="151" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">i</text>
  <text x="150" y="151" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">j</text>
  <text x="210" y="151" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">s[i]=s[j]</text>
  <text x="300" y="151" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">dp[i+1][j−1]</text>
  <text x="400" y="151" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">dp[i][j]</text>
  <text x="490" y="151" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">ans</text>

  <!-- row 1: (0,4) -->
  <rect x="50" y="160" width="500" height="24" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="90"  y="176" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="150" y="176" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="210" y="176" text-anchor="middle" font-size="10" fill="#333">c=c ✓</text>
  <text x="300" y="176" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="400" y="176" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="490" y="176" text-anchor="middle" font-size="10" fill="#333">3</text>

  <!-- row 2: (1,7) HIGHLIGHTED -->
  <rect x="50" y="184" width="500" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90"  y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="150" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7</text>
  <text x="210" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">a=a ✓</text>
  <text x="300" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="400" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5 ⭐</text>
  <text x="490" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5 ⭐</text>

  <!-- row 3: (2,4) -->
  <rect x="50" y="212" width="500" height="24" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="90"  y="228" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="150" y="228" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="210" y="228" text-anchor="middle" font-size="10" fill="#333">c=c ✓</text>
  <text x="300" y="228" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="400" y="228" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="490" y="228" text-anchor="middle" font-size="10" fill="#333">5</text>

  <!-- row 4: (3,5) -->
  <rect x="50" y="236" width="500" height="24" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="90"  y="252" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="150" y="252" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="210" y="252" text-anchor="middle" font-size="10" fill="#333">b=b ✓</text>
  <text x="300" y="252" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="400" y="252" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="490" y="252" text-anchor="middle" font-size="10" fill="#333">5</text>

  <!-- row 5: (3,6) -->
  <rect x="50" y="260" width="500" height="24" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="90"  y="276" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="150" y="276" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="210" y="276" text-anchor="middle" font-size="10" fill="#333">b=b ✓</text>
  <text x="300" y="276" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="400" y="276" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="490" y="276" text-anchor="middle" font-size="10" fill="#333">5</text>

  <!-- explanation box -->
  <rect x="50" y="300" width="500" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">命中 (i,j) = (1,7)：s[1]=s[7]='a'</text>
  <text x="300" y="340" text-anchor="middle" font-size="10" fill="#555">内部 s[2..6]="cbcbb" 的 LPS = 3（如 "bcb"）</text>
  <text x="300" y="356" text-anchor="middle" font-size="10" fill="#555">回文 = a + "bcb" + a = "abcba"，长度 5</text>

  <!-- result box -->
  <rect x="150" y="376" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="401" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">最终 ans = 5 ⭐</text>

  <!-- footer note -->
  <text x="300" y="430" text-anchor="middle" font-size="9" fill="#aaa">反例 word1="aa", word2="bb"：横跨对 s[i]=s[j] 无解 → ans 保持 0</text>
</svg>
