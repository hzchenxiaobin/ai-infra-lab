<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="490" fill="#fdfcf7"/>

  <text x="370" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">加一条边形成环：环长 = 树上路径 + 新边</text>
  <path d="M 230 40 Q 370 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- depth guide lines -->
  <g stroke="#cfcfcf" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#sk)">
    <line x1="78" y1="100" x2="700" y2="100"/>
    <line x1="78" y1="200" x2="700" y2="200"/>
    <line x1="78" y1="300" x2="700" y2="300"/>
  </g>
  <g font-size="11" fill="#999" filter="url(#sk)">
    <text x="40" y="104">depth 0</text>
    <text x="40" y="204">depth 1</text>
    <text x="40" y="304">depth 2</text>
  </g>

  <!-- faint tree edges not on the cycle -->
  <g stroke="#9aa7b8" stroke-width="1.6" fill="none" filter="url(#sk)">
    <line x1="235" y1="200" x2="170" y2="300"/>
    <line x1="485" y1="200" x2="420" y2="300"/>
    <line x1="485" y1="200" x2="550" y2="300"/>
  </g>

  <!-- cycle path edges (green, directed a -> LCA -> b) -->
  <g stroke="#4a7a3a" stroke-width="2.6" fill="none" filter="url(#sk)">
    <line x1="300" y1="294" x2="240" y2="212" marker-end="url(#arg)"/>
    <line x1="242" y1="192" x2="352" y2="112" marker-end="url(#arg)"/>
    <line x1="378" y1="112" x2="475" y2="192" marker-end="url(#arg)"/>
  </g>
  <text x="258" y="258" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">a 上爬</text>
  <text x="256" y="150" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">至 LCA</text>
  <text x="412" y="150" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">下到 b</text>

  <!-- added edge a-b (red dashed, bowing right) -->
  <path d="M 318 292 Q 645 252 502 206" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="600" y="240" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">新边 a-b</text>

  <!-- node 1 = LCA (orange) -->
  <circle cx="365" cy="100" r="21" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
  <text x="365" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">1</text>
  <text x="365" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#sk)">LCA</text>

  <!-- node 2 -->
  <circle cx="235" cy="200" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="235" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66" filter="url(#sk)">2</text>

  <!-- node 3 = b (red-ish) -->
  <circle cx="485" cy="200" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="485" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a2a26" filter="url(#sk)">3</text>
  <text x="505" y="196" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">b=3</text>

  <!-- nodes 4,6,7 -->
  <circle cx="170" cy="300" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="170" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66" filter="url(#sk)">4</text>
  <circle cx="420" cy="300" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="420" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66" filter="url(#sk)">6</text>
  <circle cx="550" cy="300" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="550" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66" filter="url(#sk)">7</text>

  <!-- node 5 = a (red-ish) -->
  <circle cx="300" cy="300" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="300" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a2a26" filter="url(#sk)">5</text>
  <text x="278" y="332" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">a=5</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="80" y="370" width="580" height="104" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="100" y="394" font-size="13" font-weight="bold" fill="#444" filter="url(#sk)">环长 = (a→LCA 边数) + (b→LCA 边数) + 1（新边）</text>
  <text x="100" y="418" font-size="12" fill="#444" filter="url(#sk)">       = [depth(a) − depth(LCA)] + [depth(b) − depth(LCA)] + 1</text>
  <text x="100" y="440" font-size="12" fill="#444" filter="url(#sk)">本例 [5,3]: (2 − 0) + (1 − 0) + 1 = 2 + 1 + 1 = 4 ✓</text>
  <text x="100" y="462" font-size="11" fill="#7a5415" filter="url(#sk)">注：完全二叉树隐式编号，父(val) = val &gt;&gt; 1，depth(val) = ⌊log₂ val⌋</text>
</svg>
