<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [4,1,5,2,6,2] ， k = 3</text>

  <!-- column headers -->
  <text x="40"   y="58" font-size="10.5" fill="#999">分组</text>
  <text x="120"  y="58" font-size="10.5" fill="#999">子序列 S_r</text>
  <text x="240"  y="58" font-size="10.5" fill="#999">tail 演化（upper_bound）</text>
  <text x="470"  y="58" font-size="10.5" fill="#999">LNIS / 改动</text>

  <!-- ===== Panel r=0 : S=[4,2], center y=100 ===== -->
  <rect x="14" y="74" width="572" height="56" fill="#fff" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="32"  y="108" font-size="12" fill="#335" font-weight="bold">r=0</text>
  <!-- S boxes -->
  <rect x="78"  y="86" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="95"  y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="116" y="86" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="133" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <!-- tail state 1: [4] -->
  <text x="170" y="92" font-size="10" fill="#888">x=4 →</text>
  <rect x="206" y="86" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="223" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <!-- transition arrow -->
  <path d="M 246 102 L 296 102" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="271" y="98" text-anchor="middle" font-size="9.5" fill="#335">x=2</text>
  <text x="271" y="118" text-anchor="middle" font-size="9" fill="#888">ub→0 替换</text>
  <!-- tail state 2: [2] -->
  <rect x="302" y="86" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="319" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <!-- result -->
  <text x="470" y="98"  font-size="11" fill="#555">LNIS = 1</text>
  <text x="470" y="116" font-size="11" fill="#b85450" font-weight="bold">改动 = 2 − 1 = 1</text>

  <!-- ===== Panel r=1 : S=[1,6], center y=190 ===== -->
  <rect x="14" y="146" width="572" height="56" fill="#fff" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="32"  y="198" font-size="12" fill="#3a5a2a" font-weight="bold">r=1</text>
  <rect x="78"  y="176" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="95"  y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="116" y="176" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="133" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="170" y="182" font-size="10" fill="#888">x=1 →</text>
  <rect x="206" y="176" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="223" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <path d="M 246 192 L 296 192" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="271" y="188" text-anchor="middle" font-size="9.5" fill="#3a5a2a">x=6</text>
  <text x="271" y="208" text-anchor="middle" font-size="9" fill="#888">ub→1 追加</text>
  <!-- tail state 2: [1,6] -->
  <rect x="302" y="176" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="319" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="340" y="176" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="357" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="470" y="188" font-size="11" fill="#555">LNIS = 2</text>
  <text x="470" y="206" font-size="11" fill="#4a7a3a" font-weight="bold">改动 = 2 − 2 = 0</text>

  <!-- ===== Panel r=2 : S=[5,2], center y=280 ===== -->
  <rect x="14" y="218" width="572" height="56" fill="#fff" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="32"  y="288" font-size="12" fill="#a87020" font-weight="bold">r=2</text>
  <rect x="78"  y="266" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="95"  y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="116" y="266" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="133" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="170" y="272" font-size="10" fill="#888">x=5 →</text>
  <rect x="206" y="266" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="223" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <path d="M 246 282 L 296 282" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="271" y="278" text-anchor="middle" font-size="9.5" fill="#a87020">x=2</text>
  <text x="271" y="298" text-anchor="middle" font-size="9" fill="#888">ub→0 替换</text>
  <rect x="302" y="266" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="319" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="470" y="278" font-size="11" fill="#555">LNIS = 1</text>
  <text x="470" y="296" font-size="11" fill="#b85450" font-weight="bold">改动 = 2 − 1 = 1</text>

  <!-- divider -->
  <path d="M 40 318 L 560 318" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- summary -->
  <rect x="120" y="338" width="360" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="362" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = Σ (|S_r| − LNIS) = 1 + 0 + 1</text>
  <text x="300" y="382" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">= 2  ✓</text>
</svg>
