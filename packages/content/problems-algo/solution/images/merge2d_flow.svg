<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双指针归并求和（含扫尾）</text>

  <!-- Start -->
  <rect x="200" y="44" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始：i=0, j=0, ans=[]</text>

  <!-- arrow down -->
  <path d="M 270 80 L 270 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i<n 且 j<m ? -->
  <polygon points="270,104 360,148 270,192 180,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="144" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i &lt; n</text>
  <text x="270" y="160" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">且 j &lt; m ?</text>

  <!-- No branch -> right to drain -->
  <path d="M 360 148 L 430 148" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="142" text-anchor="middle" font-size="10.5" fill="#888">否</text>

  <rect x="430" y="120" width="100" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="480" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">扫尾：拷贝</text>
  <text x="480" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">剩余一侧</text>

  <path d="M 480 120 L 480 96 L 340 96" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes branch down -->
  <path d="M 270 192 L 270 212" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="206" font-size="10.5" fill="#888">是</text>

  <!-- Diamond: compare ids -->
  <polygon points="270,216 390,256 270,296 150,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="252" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">比较 id1, id2</text>
  <text x="270" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">= nums1[i][0], nums2[j][0]</text>

  <!-- three branches -->
  <!-- left: id1 < id2 -->
  <path d="M 150 256 L 90 256 L 90 300" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="250" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">id1&lt;id2</text>
  <rect x="28" y="302" width="124" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans.push(nums1[i])</text>
  <text x="90" y="340" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i++</text>

  <!-- middle: id1 == id2 -->
  <path d="M 270 296 L 270 300" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="300" font-size="10" fill="#b85450" font-weight="bold">id1==id2</text>
  <rect x="206" y="302" width="128" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans.push([id,v1+v2])</text>
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i++; j++</text>

  <!-- right: id1 > id2 -->
  <path d="M 390 256 L 450 256 L 450 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">id1&gt;id2</text>
  <rect x="388" y="302" width="124" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="450" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans.push(nums2[j])</text>
  <text x="450" y="340" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j++</text>

  <!-- loop back: all three branches -> up to top diamond -->
  <path d="M 90 350 L 90 380 L 30 380 L 30 148 L 180 148" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 350 L 270 380 L 30 380" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 450 350 L 450 380 L 30 380" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="60" y="374" font-size="10" fill="#888">回到循环</text>

  <!-- End -->
  <rect x="240" y="402" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="421" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>
  <path d="M 480 176 L 480 402 L 360 417" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
