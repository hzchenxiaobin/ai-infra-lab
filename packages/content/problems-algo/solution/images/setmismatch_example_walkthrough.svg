<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, 2, 2, 4]，n = 4</text>

  <!-- index header -->
  <text x="120" y="52" text-anchor="middle" font-size="10" fill="#888">下标 0</text>
  <text x="170" y="52" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="220" y="52" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="270" y="52" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- Row 1: initial -->
  <text x="30" y="80" font-size="11" fill="#446688" font-weight="bold">初始</text>
  <rect x="98" y="60" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="148" y="60" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="198" y="60" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="248" y="60" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="310" y="80" font-size="11" fill="#888">全正</text>

  <!-- Row 2: i=0, v=1 -->
  <text x="30" y="128" font-size="11" fill="#446688" font-weight="bold">i=0, v=1</text>
  <rect x="98" y="108" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="128" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="148" y="108" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="128" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="198" y="108" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="128" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="248" y="108" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="310" y="128" font-size="10.5" fill="#4a7a3a">nums[0] 取负</text>

  <!-- Row 3: i=1, v=2 -->
  <text x="30" y="176" font-size="11" fill="#446688" font-weight="bold">i=1, v=2</text>
  <rect x="98" y="156" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="176" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="148" y="156" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="176" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>
  <rect x="198" y="156" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="176" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="248" y="156" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="176" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="310" y="176" font-size="10.5" fill="#4a7a3a">nums[1] 取负</text>

  <!-- Row 4: i=2, v=2 -> dup! -->
  <text x="30" y="224" font-size="11" fill="#b85450" font-weight="bold">i=2, v=2</text>
  <rect x="98" y="204" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="224" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="148" y="204" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="224" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>
  <rect x="198" y="204" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="224" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="248" y="204" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="224" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="310" y="218" font-size="10.5" fill="#b85450" font-weight="bold">nums[1] 已负</text>
  <text x="310" y="232" font-size="11" fill="#b85450" font-weight="bold">⇒ dup = 2 ★</text>

  <!-- Row 5: i=3, v=4 -->
  <text x="30" y="272" font-size="11" fill="#446688" font-weight="bold">i=3, v=4</text>
  <rect x="98" y="252" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="272" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="148" y="252" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="272" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>
  <rect x="198" y="252" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="248" y="252" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−4</text>
  <text x="310" y="272" font-size="10.5" fill="#4a7a3a">nums[3] 取负</text>

  <!-- divider -->
  <path d="M 30 300 L 530 300" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Row 6: scan -> miss -->
  <text x="30" y="338" font-size="11" fill="#4a7a3a" font-weight="bold">扫描</text>
  <rect x="98" y="318" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="338" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="148" y="318" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="338" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>
  <rect x="198" y="318" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="338" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="248" y="318" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−4</text>
  <text x="310" y="332" font-size="10.5" fill="#4a7a3a" font-weight="bold">nums[2] &gt; 0</text>
  <text x="310" y="346" font-size="11" fill="#4a7a3a" font-weight="bold">⇒ miss = 3 ★</text>

  <!-- result -->
  <rect x="120" y="386" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">dup = 2, miss = 3</text>
  <text x="280" y="430" text-anchor="middle" font-size="12" fill="#333">返回 [2, 3] ✓</text>
</svg>
