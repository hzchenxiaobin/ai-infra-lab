<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="490" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">数组中两个数的最大异或值 · 算法流程</text>

  <!-- Step 1: build trie -->
  <rect x="90" y="44" width="280" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">第一步：建二进制 Trie</text>
  <text x="230" y="86" text-anchor="middle" font-size="10.5" fill="#555">遍历每个 num，按 bit30→bit0 插入</text>
  <text x="230" y="98" text-anchor="middle" font-size="9.5" fill="#888">每个节点 children[0] / children[1]</text>

  <path d="M 230 104 L 230 122" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Step 2: init max -->
  <rect x="120" y="126" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">maxXOR = 0</text>

  <path d="M 230 170 L 230 188" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Step 3: for each num -->
  <rect x="100" y="192" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="212" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for each num in nums</text>
  <text x="230" y="228" text-anchor="middle" font-size="10.5" fill="#555">node = root, curXOR = 0</text>

  <path d="M 230 240 L 230 258" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Step 4: for each bit -->
  <rect x="80" y="262" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="282" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for i = 30 down to 0</text>
  <text x="230" y="298" text-anchor="middle" font-size="10.5" fill="#555">bit = (num &gt;&gt; i) &amp; 1,  want = 1 − bit</text>

  <path d="M 230 310 L 230 326" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="230,330 350,372 230,414 110,372" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="366" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">children[want]</text>
  <text x="230" y="382" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">存在 ?</text>
  <text x="230" y="398" text-anchor="middle" font-size="9.5" fill="#777">能否取到相反位</text>

  <!-- Yes branch -->
  <path d="M 110 372 L 44 372 L 44 332" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="58" y="364" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>

  <rect x="8" y="296" width="74" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="45" y="314" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">走相反位</text>
  <text x="45" y="328" text-anchor="middle" font-size="9" fill="#555">curXOR |= 1&lt;&lt;i</text>

  <!-- No branch -->
  <path d="M 350 372 L 416 372 L 416 332" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="376" y="364" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <rect x="380" y="296" width="74" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="417" y="314" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">走相同位</text>
  <text x="417" y="328" text-anchor="middle" font-size="9" fill="#555">该位异或=0</text>

  <!-- merge back to bit loop -->
  <path d="M 45 296 L 45 284 L 80 284" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 417 296 L 417 284 L 380 284" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="230" y="276" text-anchor="middle" font-size="9" fill="#888">node = 走到的子节点；继续下一位</text>

  <!-- after bit loop -->
  <path d="M 230 414 L 230 432" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <rect x="100" y="436" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="460" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">maxXOR = max(maxXOR, curXOR)</text>

  <path d="M 100 456 L 70 456 L 70 214 L 100 214" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="64" y="340" font-size="9" fill="#888" transform="rotate(-90 64 340)">处理下一个 num</text>

  <text x="230" y="486" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">所有 num 处理完 → return maxXOR　O(n·31) 时间 / O(n·31) 空间</text>
</svg>
