<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：前后缀最大值 —— 打赢任意一边的所有人即有效</text>

  <!-- 列高亮：i=3 无效（红）、i=4 右侧赢（绿） -->
  <rect x="278" y="40" width="56" height="178" fill="#fce4ec" opacity="0.55" filter="url(#rough2)"/>
  <rect x="334" y="40" width="56" height="178" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>

  <!-- 行标签 -->
  <text x="106" y="67" text-anchor="end" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">nums</text>
  <text x="106" y="127" text-anchor="end" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">leftMax</text>
  <text x="106" y="163" text-anchor="end" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">rightMax</text>
  <text x="106" y="204" text-anchor="end" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">有效?</text>

  <!-- nums 行 -->
  <g filter="url(#rough2)">
    <rect x="116" y="46" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="140" y="67" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">1</text>
    <rect x="172" y="46" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="196" y="67" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">2</text>
    <rect x="228" y="46" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="252" y="67" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">4</text>
    <rect x="284" y="46" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="308" y="67" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">2</text>
    <rect x="340" y="46" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="364" y="67" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">3</text>
    <rect x="396" y="46" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="420" y="67" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">2</text>
  </g>

  <!-- 下标 -->
  <g filter="url(#rough2)" font-size="9" fill="#888" text-anchor="middle">
    <text x="140" y="92">i=0</text>
    <text x="196" y="92">i=1</text>
    <text x="252" y="92">i=2</text>
    <text x="308" y="92">i=3</text>
    <text x="364" y="92">i=4</text>
    <text x="420" y="92">i=5</text>
  </g>

  <!-- leftMax 行 -->
  <g filter="url(#rough2)">
    <rect x="116" y="110" width="48" height="26" rx="4" fill="#f0f6ff" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="140" y="127" text-anchor="middle" font-size="11" fill="#33506b">−∞</text>
    <rect x="172" y="110" width="48" height="26" rx="4" fill="#f0f6ff" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="196" y="127" text-anchor="middle" font-size="11" fill="#33506b">1</text>
    <rect x="228" y="110" width="48" height="26" rx="4" fill="#f0f6ff" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="252" y="127" text-anchor="middle" font-size="11" fill="#33506b">2</text>
    <rect x="284" y="110" width="48" height="26" rx="4" fill="#f0f6ff" stroke="#446688" stroke-width="1.8"/>
    <text x="308" y="127" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">4</text>
    <rect x="340" y="110" width="48" height="26" rx="4" fill="#f0f6ff" stroke="#446688" stroke-width="1.8"/>
    <text x="364" y="127" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">4</text>
    <rect x="396" y="110" width="48" height="26" rx="4" fill="#f0f6ff" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="420" y="127" text-anchor="middle" font-size="11" fill="#33506b">4</text>
  </g>

  <!-- rightMax 行 -->
  <g filter="url(#rough2)">
    <rect x="116" y="146" width="48" height="26" rx="4" fill="#fffdf4" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="140" y="163" text-anchor="middle" font-size="11" fill="#8a6d1a">4</text>
    <rect x="172" y="146" width="48" height="26" rx="4" fill="#fffdf4" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="196" y="163" text-anchor="middle" font-size="11" fill="#8a6d1a">4</text>
    <rect x="228" y="146" width="48" height="26" rx="4" fill="#fffdf4" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="252" y="163" text-anchor="middle" font-size="11" fill="#8a6d1a">3</text>
    <rect x="284" y="146" width="48" height="26" rx="4" fill="#fffdf4" stroke="#d6a040" stroke-width="1.8"/>
    <text x="308" y="163" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">3</text>
    <rect x="340" y="146" width="48" height="26" rx="4" fill="#fffdf4" stroke="#d6a040" stroke-width="1.8"/>
    <text x="364" y="163" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">2</text>
    <rect x="396" y="146" width="48" height="26" rx="4" fill="#fffdf4" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="420" y="163" text-anchor="middle" font-size="11" fill="#8a6d1a">−∞</text>
  </g>

  <!-- 判定行 -->
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="140" y="204" font-size="9.5" fill="#4a7a3a">✓ 白送</text>
    <text x="196" y="204" font-size="9.5" fill="#4a7a3a">✓ 左赢</text>
    <text x="252" y="204" font-size="9.5" fill="#4a7a3a">✓ 左赢</text>
    <text x="308" y="205" font-size="13" fill="#b85450" font-weight="bold">✗</text>
    <text x="364" y="204" font-size="9.5" fill="#4a7a3a">✓ 右赢</text>
    <text x="420" y="204" font-size="9.5" fill="#4a7a3a">✓ 白送</text>
  </g>

  <!-- 判定公式横幅 -->
  <g filter="url(#rough2)">
    <rect x="20" y="222" width="520" height="36" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
    <text x="280" y="237" text-anchor="middle" font-size="10.5" fill="#8a3030" font-weight="bold">nums[i] 有效 ⇔ nums[i] &gt; leftMax[i] 或 nums[i] &gt; rightMax[i]</text>
    <text x="280" y="252" text-anchor="middle" font-size="9.5" fill="#8a3030">空侧（没有对手）记为 −∞ ⇒ 「首尾始终有效」被哨兵自动吸收，无需特判</text>
  </g>

  <!-- 底部左：三个要点 -->
  <g filter="url(#rough2)">
    <rect x="20" y="268" width="336" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="188" y="286" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">三个要点</text>
    <text x="32" y="305" font-size="9.5" fill="#2f5d24">① 信息压缩：打赢左边所有人 ⟺ 赢过 leftMax[i] 一个数——</text>
    <text x="32" y="320" font-size="9.5" fill="#2f5d24">　　「集合比较」坍缩成「单值比较」，右侧对称</text>
    <text x="32" y="338" font-size="9.5" fill="#2f5d24">② 递推 O(1)：leftMax[i]=max(leftMax[i−1], nums[i−1])，</text>
    <text x="32" y="353" font-size="9.5" fill="#2f5d24">　　右侧对称倒序，两趟线性扫完</text>
    <text x="32" y="371" font-size="9.5" fill="#2f5d24">③ 严格大于：相等不算赢 ⇒ [5,5,5,5] 中间的 5 两边全打平</text>
  </g>

  <!-- 底部右：常见翻车点 -->
  <g filter="url(#rough2)">
    <rect x="372" y="268" width="168" height="120" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="456" y="286" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">常见翻车点</text>
    <text x="384" y="305" font-size="9.5" fill="#8a3030">① 把「或」写成「且」：</text>
    <text x="384" y="320" font-size="9.5" fill="#8a3030">　　只赢一边的元素被漏掉</text>
    <text x="384" y="338" font-size="9.5" fill="#8a3030">② 手写首尾特判忘了某端</text>
    <text x="384" y="353" font-size="9.5" fill="#8a3030">　　—— 用 −∞ 哨兵一步到位</text>
    <text x="384" y="371" font-size="9.5" fill="#8a3030">③ −∞ 用 0 代替：值域含</text>
    <text x="384" y="386" font-size="9.5" fill="#8a3030">　　负数时会翻车</text>
  </g>
</svg>
