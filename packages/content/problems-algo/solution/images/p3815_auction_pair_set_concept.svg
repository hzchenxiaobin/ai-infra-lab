<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：(bidAmount, userId) 二元组有序集合，最大元直接作答</text>
  <text x="260" y="38" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">平局规则「金额相同取 userId 大者」恰好就是二元组字典序 —— 排序规则白送，无需任何特判</text>

  <!-- bids of item 7 -->
  <text x="58" y="68" font-size="10.5" fill="#666" filter="url(#rough2)">商品 7 的出价</text>
  <rect x="60" y="56" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 → 8</text>
  <rect x="152" y="56" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 → 6</text>
  <rect x="244" y="56" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5 → 8</text>

  <rect x="348" y="52" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="428" y="68" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">哈希表 amt[7]：O(1) 查旧出价</text>
  <text x="428" y="82" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">用户 1、5 并列最高价 8</text>

  <!-- arrow down -->
  <path d="M 190 88 L 190 116" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="196" y="106" font-size="9" fill="#446688" filter="url(#rough2)">按 (金额, userId) 排序</text>

  <!-- sorted set -->
  <text x="52" y="148" font-size="10.5" fill="#666" filter="url(#rough2)">bids[7]</text>
  <rect x="60" y="126" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(6, 2)</text>
  <text x="162" y="147" font-size="12" fill="#999" filter="url(#rough2)">&lt;</text>
  <rect x="174" y="126" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(8, 1)</text>
  <text x="276" y="147" font-size="12" fill="#999" filter="url(#rough2)">&lt;</text>
  <rect x="288" y="126" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="147" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">(8, 5)</text>

  <text x="400" y="138" font-size="9" fill="#d6a040" filter="url(#rough2)">字典序：金额并列</text>
  <text x="400" y="152" font-size="9" fill="#d6a040" filter="url(#rough2)">⇒ userId 大者排最后</text>

  <!-- arrow to result -->
  <path d="M 333 160 L 333 186" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="340" y="178" font-size="9" fill="#b85450" filter="url(#rough2)">最大元</text>

  <rect x="170" y="190" width="280" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="214" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">getHighestBidder(7) = 5</text>

  <!-- bottom notes -->
  <rect x="50" y="248" width="440" height="112" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="70" y="272" font-size="10.5" fill="#333" filter="url(#rough2)">① 平局规则零成本：max{(6,2),(8,1),(8,5)} = (8,5)，金额并列时 userId 大者</text>
  <text x="86" y="290" font-size="10.5" fill="#333" filter="url(#rough2)">天然排最后，rbegin()/[-1] 直接返回 5 ✓</text>
  <text x="70" y="312" font-size="10.5" fill="#333" filter="url(#rough2)">② 哈希表负责「定位」：改价先 O(1) 查到旧金额，才知道要删集合里哪个旧键</text>
  <text x="70" y="334" font-size="10.5" fill="#333" filter="url(#rough2)">③ 有序集合负责「排名次」：换键 = 删 (旧额,u) + 插 (新额,u)，各 O(log n)</text>
  <text x="70" y="352" font-size="9.5" fill="#888" filter="url(#rough2)">（本图在官方示例基础上给商品 7 补了一条 addBid(5,7,8)，制造并列最高价）</text>
</svg>
