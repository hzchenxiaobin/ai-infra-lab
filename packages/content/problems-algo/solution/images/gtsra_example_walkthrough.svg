<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：UserActivity → 加 rn/cnt 两列 → 筛选 → 结果</text>

  <!-- ===== Step 1: UserActivity + window columns ===== -->
  <text x="20" y="52" font-size="11" fill="#446688" font-weight="bold">① UserActivity 加窗口列（按 username 分组、startDate 降序）</text>

  <!-- header -->
  <rect x="20" y="60" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="74" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">username</text>
  <rect x="100" y="60" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="74" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">activity</text>
  <rect x="180" y="60" width="90" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="225" y="74" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">startDate</text>
  <rect x="270" y="60" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="310" y="74" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">endDate</text>
  <rect x="350" y="60" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="375" y="74" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">rn</text>
  <rect x="400" y="60" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="425" y="74" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">cnt</text>

  <!-- Alice Travel 02-24 rn1 cnt3 -->
  <rect x="20" y="80" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="60" y="94" text-anchor="middle" font-size="9" fill="#333">Alice</text>
  <rect x="100" y="80" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="140" y="94" text-anchor="middle" font-size="9" fill="#333">Travel</text>
  <rect x="180" y="80" width="90" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="225" y="94" text-anchor="middle" font-size="9" fill="#333">2020-02-24</text>
  <rect x="270" y="80" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="310" y="94" text-anchor="middle" font-size="9" fill="#333">2020-02-28</text>
  <rect x="350" y="80" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="375" y="94" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">1</text>
  <rect x="400" y="80" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="425" y="94" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">3</text>

  <!-- Alice Dancing 02-21 rn2 cnt3 SELECT -->
  <rect x="20" y="100" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="114" text-anchor="middle" font-size="9" fill="#333">Alice</text>
  <rect x="100" y="100" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="140" y="114" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Dancing</text>
  <rect x="180" y="100" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="225" y="114" text-anchor="middle" font-size="9" fill="#333">2020-02-21</text>
  <rect x="270" y="100" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="310" y="114" text-anchor="middle" font-size="9" fill="#333">2020-02-23</text>
  <rect x="350" y="100" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="375" y="114" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="400" y="100" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="425" y="114" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- Alice Travel 02-12 rn3 cnt3 -->
  <rect x="20" y="120" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="60" y="134" text-anchor="middle" font-size="9" fill="#333">Alice</text>
  <rect x="100" y="120" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="140" y="134" text-anchor="middle" font-size="9" fill="#333">Travel</text>
  <rect x="180" y="120" width="90" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="225" y="134" text-anchor="middle" font-size="9" fill="#333">2020-02-12</text>
  <rect x="270" y="120" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="310" y="134" text-anchor="middle" font-size="9" fill="#333">2020-02-20</text>
  <rect x="350" y="120" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="375" y="134" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">3</text>
  <rect x="400" y="120" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="425" y="134" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">3</text>

  <!-- Bob Travel 02-11 rn1 cnt1 SELECT -->
  <rect x="20" y="146" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="160" text-anchor="middle" font-size="9" fill="#333">Bob</text>
  <rect x="100" y="146" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="140" y="160" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Travel</text>
  <rect x="180" y="146" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="225" y="160" text-anchor="middle" font-size="9" fill="#333">2020-02-11</text>
  <rect x="270" y="146" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="310" y="160" text-anchor="middle" font-size="9" fill="#333">2020-02-18</text>
  <rect x="350" y="146" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="375" y="160" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="400" y="146" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="425" y="160" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- arrow to filter -->
  <path d="M470 133 L510 133" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="490" y="124" text-anchor="middle" font-size="9" fill="#446688">WHERE</text>
  <text x="490" y="148" text-anchor="middle" font-size="9" fill="#446688">rn=2 OR cnt=1</text>

  <!-- ===== Step 2: result ===== -->
  <text x="525" y="90" font-size="11" fill="#4a7a3a" font-weight="bold">② 结果</text>
  <rect x="525" y="100" width="180" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="615" y="114" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">username | activity | 日期</text>
  <rect x="525" y="120" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="615" y="135" text-anchor="middle" font-size="9" fill="#333">Alice | Dancing | 02-21~23</text>
  <rect x="525" y="142" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="615" y="157" text-anchor="middle" font-size="9" fill="#333">Bob | Travel | 02-11~18</text>

  <!-- ===== bottom: edge cases + selection rule ===== -->
  <rect x="20" y="184" width="680" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="206" font-size="11" fill="#333" font-weight="bold">筛选规则与边界：</text>
  <text x="40" y="226" font-size="10.5" fill="#333">• rn=2（多活动次近）：Alice 的 Dancing，rn=2 且 cnt=3&gt;1 → 命中 rn=2 分支 ✓</text>
  <text x="40" y="246" font-size="10.5" fill="#333">• cnt=1（单活动兜底）：Bob 仅 1 条，rn=1 但 cnt=1 → 命中 cnt=1 分支 ✓（rn=2 分支 false）</text>
  <text x="40" y="266" font-size="10.5" fill="#333">• 两支用 OR 合并，无交集：cnt=1 时唯一行 rn 必为 1（≠2），故不会重复输出</text>
  <text x="40" y="286" font-size="10.5" fill="#b85450">⚠ Alice 最新 Travel（rn=1,cnt=3）两支都不命中 → 正确丢弃；最旧 Travel（rn=3,cnt=3）同理丢弃</text>
  <text x="40" y="298" font-size="10" fill="#888">等价写法：WHERE rn = IF(cnt = 1, 1, 2) ——「单活动取第 1，多活动取第 2」语义最直观</text>

  <!-- ===== bottom summary ===== -->
  <rect x="20" y="312" width="680" height="116" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="334" font-size="11" fill="#446688" font-weight="bold">解法对照：</text>
  <text x="40" y="354" font-size="10.5" fill="#333">① 窗口函数（推荐）：ROW_NUMBER() OVER(PARTITION BY username ORDER BY startDate DESC) AS rn</text>
  <text x="60" y="368" font-size="10" fill="#666">+ COUNT(*) OVER(PARTITION BY username) AS cnt → 外层 WHERE rn=2 OR cnt=1</text>
  <text x="40" y="386" font-size="10.5" fill="#333">② 自连接数「更近」（不用窗口）：LEFT JOIN 数同用户中 startDate 更大者，HAVING COUNT=1 取次近</text>
  <text x="60" y="400" font-size="10" fill="#666">UNION 单活动用户（总数=1）—— O(n²) 但兼容老版本 MySQL 5.7</text>
  <text x="40" y="418" font-size="10" fill="#d6a040">排序键用 startDate：题目保证同用户活动区间不重叠，startDate 降序即「由近到远」无歧义</text>
</svg>
