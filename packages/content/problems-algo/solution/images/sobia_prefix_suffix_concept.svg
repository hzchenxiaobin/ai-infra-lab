<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：left_max[i] 与 right_min[i] 一次预处理，O(1) 判定</text>

  <!-- nums row label -->
  <text x="44" y="74" font-size="12" fill="#888">nums</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="92" y="58" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="117" y="79">2</text>
    <rect x="146" y="58" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="171" y="79">4</text>
    <rect x="200" y="58" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="225" y="79">6</text>
    <rect x="254" y="58" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="279" y="79">4</text>
  </g>

  <!-- index ticks -->
  <g font-size="10" fill="#aaa" text-anchor="middle">
    <text x="117" y="104">i=0</text>
    <text x="171" y="104">i=1</text>
    <text x="225" y="104">i=2</text>
    <text x="279" y="104">i=3</text>
  </g>

  <!-- left_max row -->
  <text x="44" y="158" font-size="12" fill="#446688">left_max</text>
  <text x="44" y="172" font-size="9.5" fill="#888">(左侧最大)</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="92" y="142" width="50" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="117" y="163" fill="#aaa">—</text>
    <rect x="146" y="142" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="171" y="163">2</text>
    <rect x="200" y="142" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="225" y="163">4</text>
    <rect x="254" y="142" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="279" y="163">6</text>
  </g>

  <!-- arrow: left_max comes from scanning left to right -->
  <path d="M 110 116 L 110 138" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <path d="M 290 116 L 290 138" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="300" y="128" font-size="10.5" fill="#446688" font-weight="bold">← 从左扫</text>

  <!-- right_min row -->
  <text x="44" y="232" font-size="12" fill="#4a7a3a">right_min</text>
  <text x="44" y="246" font-size="9.5" fill="#888">(右侧最小)</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="92" y="216" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="117" y="237">4</text>
    <rect x="146" y="216" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="171" y="237">4</text>
    <rect x="200" y="216" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="225" y="237">4</text>
    <rect x="254" y="216" width="50" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="279" y="237" fill="#aaa">—</text>
  </g>

  <!-- arrow: right_min comes from scanning right to left -->
  <path d="M 290 268 L 290 290" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="284" font-size="10.5" fill="#4a7a3a" font-weight="bold">从右扫 →</text>

  <!-- Divider -->
  <path d="M 40 300 L 520 300" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Take i=2 as highlight example: nums[2]=6, left_max=4, right_min=4 -->
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">以 i=2（nums[2]=6）为例</text>

  <rect x="60" y="332" width="440" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11.5" fill="#333">beauty=2 ⟺ left_max[2] &lt; nums[2] &lt; right_min[2]</text>

  <text x="280" y="372" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">4 &lt; 6 ✓，但 6 &lt; 4 ✗ → 不满足 beauty=2</text>

  <text x="280" y="390" text-anchor="middle" font-size="10.5" fill="#888">退而判定 beauty=1：仅需 nums[i−1] &lt; nums[i] &lt; nums[i+1]</text>
</svg>
