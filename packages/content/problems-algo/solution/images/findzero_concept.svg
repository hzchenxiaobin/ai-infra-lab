<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：到 0 的距离 = |num|，等距时取较大值</text>

  <!-- ===== Input array ===== -->
  <text x="44" y="58" font-size="12" fill="#446688" font-weight="bold">nums</text>
  <rect x="80" y="44" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="104" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−4</text>
  <rect x="132" y="44" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="156" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−2</text>
  <rect x="184" y="44" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="64" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="236" y="44" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="288" y="44" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="312" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <text x="346" y="64" font-size="11" fill="#4a7a3a" font-weight="bold">↑ 1 最近 ✓</text>

  <!-- ===== Number line ===== -->
  <line x1="120" y1="170" x2="480" y2="170" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 480 170 L 470 165 L 470 175 z" fill="#888" filter="url(#rough2)"/>
  <text x="492" y="174" font-size="11" fill="#888">数轴</text>

  <!-- origin 0 -->
  <circle cx="270" cy="170" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- ticks: -4 @174, -2 @222, 1 @294, 4 @366, 8 @462 -->
  <!-- -4 -->
  <line x1="174" y1="164" x2="174" y2="176" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="174" cy="170" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="174" y="196" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">−4</text>
  <!-- -2 -->
  <line x1="222" y1="164" x2="222" y2="176" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="222" cy="170" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="222" y="196" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">−2</text>
  <!-- 1 winner -->
  <line x1="294" y1="164" x2="294" y2="176" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="294" cy="170" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="294" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <!-- 4 -->
  <line x1="366" y1="164" x2="366" y2="176" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="366" cy="170" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="366" y="196" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <!-- 8 -->
  <line x1="462" y1="164" x2="462" y2="176" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="462" cy="170" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="462" y="196" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">8</text>

  <!-- distance brackets above the line, from each num to 0 -->
  <!-- -4 to 0 : distance 4 -->
  <path d="M 174 150 Q 222 138 270 150" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="222" y="134" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">|−4|=4</text>
  <!-- -2 to 0 : distance 2 -->
  <path d="M 222 150 Q 246 140 270 150" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="246" y="134" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">|−2|=2</text>
  <!-- 1 to 0 : distance 1 (winner, green) -->
  <path d="M 270 150 Q 282 142 294 150" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="282" y="134" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">|1|=1</text>
  <!-- 4 to 0 -->
  <path d="M 270 150 Q 318 138 366 150" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="318" y="134" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">|4|=4</text>
  <!-- 8 to 0 -->
  <path d="M 270 150 Q 366 132 462 150" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="366" y="128" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">|8|=8</text>

  <!-- ===== Tie-break illustration ===== -->
  <rect x="40" y="224" width="460" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="246" font-size="12.5" fill="#d6a040" font-weight="bold">平局规则：两个数等距时，取较大值（正胜负）</text>

  <!-- -1 and 1 both distance 1 -->
  <text x="60" y="276" font-size="12" fill="#333" font-weight="bold">−1</text>
  <rect x="92" y="260" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="281" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−1</text>
  <text x="158" y="281" font-size="11" fill="#b85450" font-weight="bold">|−1|=1</text>

  <text x="220" y="281" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">vs</text>

  <text x="252" y="276" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="284" y="260" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="281" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="350" y="281" font-size="11" fill="#4a7a3a" font-weight="bold">|1|=1</text>

  <!-- arrow to winner -->
  <path d="M 312 296 Q 312 306 312 314" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="246" y="316" width="132" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="312" y="332" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">取 max(−1, 1) = 1</text>

  <!-- ===== Two rule boxes ===== -->
  <rect x="40" y="358" width="460" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="380" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">① 距离定义：dist(num) = |num|（绝对值，与正负无关）</text>

  <rect x="40" y="400" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="422" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">② 平局规则：|a| = |b| 时取 max(a, b)（正数胜负数）</text>

  <rect x="40" y="442" width="460" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270" y="453" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">一次遍历维护最小 |num|，等距时取较大值即可</text>
</svg>
