<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,2,1,3,5,6,4]</text>

  <!-- shared chart geometry: 7 points, x spacing 36, start x=150, baseline y=210 -->
  <!-- val-> y: y = 210 - (val-1)*16 ; v1=210 v2=194 v3=178 v4=162 v5=146 v6=130 -->
  <!-- positions: idx0=150 idx1=186 idx2=222 idx3=258 idx4=294 idx5=330 idx6=366 -->

  <!-- ============ Panel 1 ============ -->
  <rect x="14" y="40" width="180" height="380" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="14" y="40" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="104" y="59" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">第 1 轮：left=0 right=6</text>

  <!-- baseline -->
  <line x1="146" y1="232" x2="370" y2="232" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <!-- polyline (dim outside range) -->
  <path d="M150,210 L186,194 L222,210 L258,178 L294,146 L330,130 L366,162" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <!-- dots -->
  <circle cx="150" cy="210" r="3.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="186" cy="194" r="3.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="222" cy="210" r="3.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="258" cy="178" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="294" cy="146" r="3.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="330" cy="130" r="3.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="366" cy="162" r="3.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- value labels -->
  <text x="150" y="226" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="186" y="186" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="222" y="226" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="258" y="170" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="294" y="138" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="330" y="122" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="366" y="154" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <!-- index labels -->
  <text x="150" y="246" text-anchor="middle" font-size="8.5" fill="#82b366" font-weight="bold">0</text>
  <text x="186" y="246" text-anchor="middle" font-size="8.5" fill="#aaa">1</text>
  <text x="222" y="246" text-anchor="middle" font-size="8.5" fill="#aaa">2</text>
  <text x="258" y="246" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="294" y="246" text-anchor="middle" font-size="8.5" fill="#aaa">4</text>
  <text x="330" y="246" text-anchor="middle" font-size="8.5" fill="#aaa">5</text>
  <text x="366" y="246" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">6</text>
  <!-- range bracket -->
  <path d="M150 256 L150 262 L366 262 L366 256" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="258" y="276" text-anchor="middle" font-size="9" fill="#888">搜索区间 [0,6]</text>
  <!-- mid vs mid+1 annotation -->
  <rect x="26" y="300" width="156" height="104" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="104" y="318" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">mid=3</text>
  <text x="104" y="336" text-anchor="middle" font-size="9.5" fill="#888">nums[3]=3, nums[4]=5</text>
  <text x="104" y="354" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">3 &lt; 5 → 上升 ↑</text>
  <rect x="40" y="366" width="128" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="104" y="384" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">left = mid+1 = 4</text>
  <text x="104" y="414" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">峰值在右半 [4,6]</text>

  <!-- ============ Panel 2 ============ -->
  <rect x="200" y="40" width="180" height="380" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="200" y="40" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="59" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">第 2 轮：left=4 right=6</text>

  <line x1="146" y1="232" x2="370" y2="232" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <!-- dim out-of-range portion (0..3) -->
  <path d="M150,210 L186,194 L222,210 L258,178" stroke="#cfd8e3" stroke-width="1.6" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <!-- active portion (4..6) -->
  <path d="M258,178 L294,146 L330,130 L366,162" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="150" cy="210" r="3" fill="#ddd" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="186" cy="194" r="3" fill="#ddd" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="222" cy="210" r="3" fill="#ddd" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="258" cy="178" r="3" fill="#ddd" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="294" cy="146" r="3.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="330" cy="130" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="366" cy="162" r="3.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="226" text-anchor="middle" font-size="9" fill="#ccc">1</text>
  <text x="186" y="186" text-anchor="middle" font-size="9" fill="#ccc">2</text>
  <text x="222" y="226" text-anchor="middle" font-size="9" fill="#ccc">1</text>
  <text x="258" y="170" text-anchor="middle" font-size="9" fill="#ccc">3</text>
  <text x="294" y="138" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="330" y="122" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">6</text>
  <text x="366" y="154" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="150" y="246" text-anchor="middle" font-size="8.5" fill="#ccc">0</text>
  <text x="186" y="246" text-anchor="middle" font-size="8.5" fill="#ccc">1</text>
  <text x="222" y="246" text-anchor="middle" font-size="8.5" fill="#ccc">2</text>
  <text x="258" y="246" text-anchor="middle" font-size="8.5" fill="#ccc">3</text>
  <text x="294" y="246" text-anchor="middle" font-size="8.5" fill="#82b366" font-weight="bold">4</text>
  <text x="330" y="246" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">5</text>
  <text x="366" y="246" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">6</text>
  <path d="M294 256 L294 262 L366 262 L366 256" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="330" y="276" text-anchor="middle" font-size="9" fill="#888">搜索区间 [4,6]</text>
  <rect x="212" y="300" width="156" height="104" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="318" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">mid=5</text>
  <text x="290" y="336" text-anchor="middle" font-size="9.5" fill="#888">nums[5]=6, nums[6]=4</text>
  <text x="290" y="354" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">6 &gt; 4 → 下降 ↓</text>
  <rect x="226" y="366" width="128" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="384" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">right = mid = 5</text>
  <text x="290" y="414" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">峰值在左半 [4,5]</text>

  <!-- ============ Panel 3 ============ -->
  <rect x="386" y="40" width="180" height="380" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="386" y="40" width="180" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="476" y="59" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">第 3 轮：left=4 right=5 ★</text>

  <line x1="146" y1="232" x2="370" y2="232" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M150,210 L186,194 L222,210 L258,178 L294,146" stroke="#cfd8e3" stroke-width="1.6" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M294,146 L330,130 L366,162" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="150" cy="210" r="3" fill="#ddd" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="186" cy="194" r="3" fill="#ddd" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="222" cy="210" r="3" fill="#ddd" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="258" cy="178" r="3" fill="#ddd" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="294" cy="146" r="4.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="330" cy="130" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="366" cy="162" r="3" fill="#ddd" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="150" y="226" text-anchor="middle" font-size="9" fill="#ccc">1</text>
  <text x="186" y="186" text-anchor="middle" font-size="9" fill="#ccc">2</text>
  <text x="222" y="226" text-anchor="middle" font-size="9" fill="#ccc">1</text>
  <text x="258" y="170" text-anchor="middle" font-size="9" fill="#ccc">3</text>
  <text x="294" y="138" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">5</text>
  <text x="330" y="122" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="366" y="154" text-anchor="middle" font-size="9" fill="#ccc">4</text>
  <text x="150" y="246" text-anchor="middle" font-size="8.5" fill="#ccc">0</text>
  <text x="186" y="246" text-anchor="middle" font-size="8.5" fill="#ccc">1</text>
  <text x="222" y="246" text-anchor="middle" font-size="8.5" fill="#ccc">2</text>
  <text x="258" y="246" text-anchor="middle" font-size="8.5" fill="#ccc">3</text>
  <text x="294" y="246" text-anchor="middle" font-size="8.5" fill="#82b366" font-weight="bold">4</text>
  <text x="330" y="246" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">5</text>
  <text x="366" y="246" text-anchor="middle" font-size="8.5" fill="#ccc">6</text>
  <path d="M294 256 L294 262 L330 262 L330 256" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="312" y="276" text-anchor="middle" font-size="9" fill="#888">搜索区间 [4,5]</text>
  <rect x="398" y="300" width="156" height="104" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="476" y="318" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">mid=4</text>
  <text x="476" y="336" text-anchor="middle" font-size="9.5" fill="#888">nums[4]=5, nums[5]=6</text>
  <text x="476" y="354" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">5 &lt; 6 → 上升 ↑</text>
  <rect x="412" y="366" width="128" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="476" y="384" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">left = mid+1 = 5</text>
  <text x="476" y="414" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">left==right，收敛</text>

  <!-- bottom summary -->
  <rect x="14" y="432" width="552" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="452" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">返回 left = 5 → nums[5] = 6 &gt; 左(5) 且 &gt; 右(4)，是峰值 ✓</text>
</svg>
