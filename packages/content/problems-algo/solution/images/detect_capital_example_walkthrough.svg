<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：四个词逐个判定</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">cnt = 大写字母个数，n = 词长</text>

  <!-- legend -->
  <rect x="410" y="32" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="428" y="43" font-size="10" fill="#555">大写</text>
  <rect x="466" y="32" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="484" y="43" font-size="10" fill="#555">小写</text>
  <rect x="522" y="32" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="540" y="43" font-size="10" fill="#555">非法位</text>

  <!-- Table header -->
  <text x="30" y="74" font-size="11" fill="#444" font-weight="bold">词</text>
  <text x="200" y="74" font-size="11" fill="#444" font-weight="bold">字符着色</text>
  <text x="380" y="74" font-size="11" fill="#444" font-weight="bold">cnt</text>
  <text x="430" y="74" font-size="11" fill="#444" font-weight="bold">命中规则</text>
  <text x="560" y="74" font-size="11" fill="#444" font-weight="bold">结果</text>

  <line x1="20" y1="82" x2="590" y2="82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 1: USA ===== -->
  <text x="30" y="108" font-size="13" fill="#333" font-weight="bold">USA</text>
  <text x="30" y="124" font-size="10" fill="#888">n = 3</text>

  <rect x="200" y="92" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="217" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">U</text>
  <rect x="236" y="92" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="253" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">S</text>
  <rect x="272" y="92" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="289" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>

  <text x="380" y="112" font-size="13" fill="#446688" font-weight="bold">3</text>
  <text x="430" y="108" font-size="10.5" fill="#4a7a3a" font-weight="bold">cnt == n</text>
  <text x="430" y="122" font-size="10" fill="#888">(全大写)</text>
  <text x="560" y="112" font-size="13" fill="#4a7a3a" font-weight="bold">true ✓</text>

  <!-- ===== Row 2: leetcode ===== -->
  <text x="30" y="160" font-size="13" fill="#333" font-weight="bold">leetcode</text>
  <text x="30" y="176" font-size="10" fill="#888">n = 8</text>

  <!-- 8 cells, 30px each -->
  <rect x="200" y="144" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="215" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">l</text>
  <rect x="232" y="144" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="247" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <rect x="264" y="144" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="279" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <rect x="296" y="144" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="311" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t</text>
  <rect x="328" y="144" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="343" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <text x="362" y="164" font-size="10" fill="#888">…</text>

  <text x="380" y="164" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="430" y="160" font-size="10.5" fill="#4a7a3a" font-weight="bold">cnt == 0</text>
  <text x="430" y="174" font-size="10" fill="#888">(全小写)</text>
  <text x="560" y="164" font-size="13" fill="#4a7a3a" font-weight="bold">true ✓</text>

  <!-- ===== Row 3: Google ===== -->
  <text x="30" y="212" font-size="13" fill="#333" font-weight="bold">Google</text>
  <text x="30" y="228" font-size="10" fill="#888">n = 6</text>

  <rect x="200" y="196" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="217" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">G</text>
  <rect x="236" y="196" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="253" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">o</text>
  <rect x="272" y="196" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="289" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">o</text>
  <rect x="308" y="196" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="325" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g</text>
  <text x="346" y="216" font-size="10" fill="#888">…</text>

  <text x="380" y="216" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <text x="430" y="212" font-size="10.5" fill="#4a7a3a" font-weight="bold">cnt==1 &amp; 首大</text>
  <text x="430" y="226" font-size="10" fill="#888">(首字母大写)</text>
  <text x="560" y="216" font-size="13" fill="#4a7a3a" font-weight="bold">true ✓</text>

  <!-- separator -->
  <line x1="20" y1="246" x2="590" y2="246" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="300" y="242" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↓ 以下不命中任何规则</text>

  <!-- ===== Row 4: FlaG ===== -->
  <text x="30" y="278" font-size="13" fill="#333" font-weight="bold">FlaG</text>
  <text x="30" y="294" font-size="10" fill="#888">n = 4</text>

  <rect x="200" y="262" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="217" y="282" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">F</text>
  <rect x="236" y="262" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="253" y="282" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">l</text>
  <rect x="272" y="262" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="289" y="282" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="308" y="262" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="282" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">G</text>

  <text x="380" y="282" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="430" y="278" font-size="10.5" fill="#b85450" font-weight="bold">cnt≠n, ≠0,</text>
  <text x="430" y="292" font-size="10.5" fill="#b85450" font-weight="bold">≠1&amp;首 → 不命中</text>
  <text x="560" y="282" font-size="13" fill="#b85450" font-weight="bold">false ✗</text>

  <!-- ===== result summary ===== -->
  <line x1="20" y1="312" x2="590" y2="312" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <rect x="60" y="328" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="350" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：cnt=2 既不是 0/n，也不满足「恰好 1 且在首位」</text>
  <text x="300" y="368" text-anchor="middle" font-size="11" fill="#888">非首位的 G 破坏了「首字母大写」模式 → 判 false</text>

  <!-- bottom takeaway -->
  <rect x="60" y="388" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="406" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">只需一趟扫描统计 cnt，再至多三次比较即可定论</text>
  <text x="300" y="422" text-anchor="middle" font-size="10.5" fill="#888">单字符词：cnt 必为 0 或 1，两种都合法，恒返回 true</text>
</svg>
