<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">consec(num) 判定流程</text>

  <!-- Start: 调用 consec(num) -->
  <rect x="190" y="48" width="180" height="38" rx="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">调用 consec(num)</text>
  <path d="M 280 86 L 280 100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: num == value? -->
  <polygon points="280,104 360,150 280,196 200,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="155" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">num == value ?</text>

  <!-- Yes branch (left) -->
  <path d="M 200 150 L 150 150 L 150 224" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="80" y="226" width="140" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="251" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">cnt = cnt + 1</text>

  <!-- No branch (right) -->
  <path d="M 360 150 L 410 150 L 410 224" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="144" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="340" y="226" width="140" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="251" text-anchor="middle" font-size="13" fill="#7a2230" filter="url(#rough2)">cnt = 0</text>

  <!-- merge to Decision 2 -->
  <path d="M 150 266 L 150 300 L 280 300" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 410 266 L 410 300 L 280 300" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 280 300 L 280 312" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: cnt >= k? -->
  <polygon points="280,316 360,360 280,404 200,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="365" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">cnt >= k ?</text>

  <!-- Yes -> return true (left) -->
  <path d="M 200 360 L 110 360" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="354" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="30" y="336" width="80" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="363" text-anchor="middle" font-size="13" fill="#2c4a22" font-weight="bold" filter="url(#rough2)">return</text>
  <text x="70" y="378" text-anchor="middle" font-size="13" fill="#2c4a22" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- No -> return false (right) -->
  <path d="M 360 360 L 450 360" stroke="#9aa8b4" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="354" text-anchor="middle" font-size="12" fill="#9aa8b4" filter="url(#rough2)">否</text>
  <rect x="450" y="336" width="80" height="44" rx="6" fill="#f0f4f8" stroke="#9aa8b4" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="363" text-anchor="middle" font-size="13" fill="#445" font-weight="bold" filter="url(#rough2)">return</text>
  <text x="490" y="378" text-anchor="middle" font-size="13" fill="#445" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- side note -->
  <rect x="318" y="92" width="226" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="431" y="110" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">失配必归零（cnt=0），不能 cnt-1：</text>
  <text x="431" y="126" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">失配格打断尾部连续命中段</text>
</svg>
