<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arblue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arred" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arorange" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="420" fill="#fdfcf7"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">正向构造（难） vs 逆向还原（易）</text>
  <path d="M 150 38 Q 280 46 410 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Forward row ===== -->
  <text x="48" y="78" font-size="12" fill="#446688" font-weight="bold">正向</text>
  <!-- state 0: [1,1,1] -->
  <g filter="url(#sk)">
    <rect x="78" y="64" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="112" y="64" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="146" y="64" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="95" y="84" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="129" y="84" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="163" y="84" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="129" y="112" text-anchor="middle" font-size="10" fill="#888">和 = 3</text>
  <!-- arrow -->
  <path d="M 188 79 L 226 79" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arblue)" filter="url(#sk)"/>
  <text x="207" y="72" text-anchor="middle" font-size="9.5" fill="#446688">选下标1</text>

  <!-- state 1: [1,3,1] -->
  <g filter="url(#sk)">
    <rect x="232" y="64" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="266" y="64" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="300" y="64" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="249" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="283" y="84" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">3</text>
  <text x="317" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="283" y="112" text-anchor="middle" font-size="10" fill="#888">和 = 5</text>
  <path d="M 342 79 L 380 79" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arblue)" filter="url(#sk)"/>
  <text x="361" y="72" text-anchor="middle" font-size="9.5" fill="#446688">选下标2</text>

  <!-- state 2: [1,3,5] -->
  <g filter="url(#sk)">
    <rect x="386" y="64" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="420" y="64" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="454" y="64" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="403" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="437" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="471" y="84" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">5</text>
  <text x="437" y="112" text-anchor="middle" font-size="10" fill="#888">和 = 9 → 选下标0 得 [9,3,5]</text>

  <!-- separator -->
  <path d="M 60 140 Q 280 148 500 140" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>

  <!-- ===== Reverse row ===== -->
  <text x="48" y="178" font-size="12" fill="#b85450" font-weight="bold">逆向</text>
  <!-- state: [9,3,5] target -->
  <g filter="url(#sk)">
    <rect x="78" y="164" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="112" y="164" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="146" y="164" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="95" y="184" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">9</text>
  <text x="129" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="163" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="129" y="212" text-anchor="middle" font-size="10" fill="#b03a3a">max=9, rest=3+5=8 → 还原 9−8=1</text>
  <path d="M 188 179 L 226 179" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arred)" filter="url(#sk)"/>
  <text x="207" y="172" text-anchor="middle" font-size="9.5" fill="#b85450">替换max</text>

  <!-- state: [1,3,5] -->
  <g filter="url(#sk)">
    <rect x="232" y="164" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="266" y="164" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="300" y="164" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="249" y="184" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="283" y="184" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">3</text>
  <text x="317" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="283" y="212" text-anchor="middle" font-size="10" fill="#b03a3a">max=5, rest=1+3=4 → 还原 5−4=1</text>
  <path d="M 342 179 L 380 179" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arred)" filter="url(#sk)"/>

  <!-- state: [1,1,1] done -->
  <g filter="url(#sk)">
    <rect x="386" y="164" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="420" y="164" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="454" y="164" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="403" y="184" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="437" y="184" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="471" y="184" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="437" y="212" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">全 1 ✓ 可达！</text>

  <!-- key insight box -->
  <g filter="url(#sk)">
    <rect x="40" y="240" width="480" height="160" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="280" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">核心观察：最大值 = 上一步的总和</text>
  <path d="M 90 274 Q 280 280 470 274" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <g font-size="12" fill="#444">
    <text x="58" y="298">· 正向：选某下标 i，令 A[i] = 当前总和。总和单调递增、值可达 10⁹，正向搜索爆炸</text>
    <text x="58" y="320">· 逆向：每步总有一个元素 = 上一步的总和，它必然是当前数组的 <tspan font-weight="bold" fill="#b03a3a">最大值</tspan></text>
    <text x="58" y="342" fill="#7a5415">· 设当前最大值 M，其余元素之和 rest = total − M，则 M 被替换前持有：</text>
    <text x="74" y="362" fill="#b03a3a" font-weight="bold">  prev = M − rest （因为正向时 M = prev + rest）</text>
    <text x="58" y="386" fill="#4a7a3a">· 反复用最大堆取出 M 还原为 prev，直到全部变为 1 → 可达；出现矛盾 → 不可达</text>
  </g>
</svg>
