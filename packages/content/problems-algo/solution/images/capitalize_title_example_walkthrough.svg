<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算："capiTalIze THe titLe" → "Capitalize The Title"</text>

  <!-- ===== Input row ===== -->
  <text x="60" y="56" font-size="11" fill="#888" font-weight="bold">输入</text>
  <!-- word cells: capiTalIze | THe | titLe -->
  <rect x="90" y="64" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">capiTalIze</text>
  <text x="165" y="112" text-anchor="middle" font-size="9" fill="#aaa">len=10</text>

  <rect x="250" y="64" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">THe</text>
  <text x="280" y="112" text-anchor="middle" font-size="9" fill="#aaa">len=3</text>

  <rect x="320" y="64" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">titLe</text>
  <text x="355" y="112" text-anchor="middle" font-size="9" fill="#aaa">len=5</text>

  <!-- ===== Rule arrows ===== -->
  <!-- arrow 1: len=10 >= 3 -->
  <path d="M 165 122 L 165 140" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="142" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="165" y="158" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">≥3 → 首大余小</text>

  <!-- arrow 2: len=3 >= 3 -->
  <path d="M 280 122 L 280 140" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="235" y="142" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="158" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">≥3 → 首大余小</text>

  <!-- arrow 3: len=5 >= 3 -->
  <path d="M 355 122 L 355 140" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="310" y="142" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="355" y="158" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">≥3 → 首大余小</text>

  <!-- ===== Transform detail ===== -->
  <path d="M 165 166 L 165 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 166 L 280 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 355 166 L 355 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- transformed words -->
  <rect x="90" y="188" width="150" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="211" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Capitalize</text>
  <text x="165" y="236" text-anchor="middle" font-size="9" fill="#4a7a3a">C + apitalize</text>

  <rect x="250" y="188" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="211" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">The</text>
  <text x="280" y="236" text-anchor="middle" font-size="9" fill="#4a7a3a">T + he</text>

  <rect x="320" y="188" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="211" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Title</text>
  <text x="355" y="236" text-anchor="middle" font-size="9" fill="#4a7a3a">T + itle</text>

  <!-- ===== Join step ===== -->
  <text x="60" y="266" font-size="11" fill="#888" font-weight="bold">拼接</text>
  <path d="M 165 248 L 165 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 248 L 280 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 355 248 L 355 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- join box -->
  <rect x="160" y="274" width="220" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="295" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">' '.join([...])</text>

  <!-- arrow to output -->
  <path d="M 270 306 L 270 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Output row ===== -->
  <text x="60" y="350" font-size="11" fill="#888" font-weight="bold">输出</text>
  <rect x="120" y="332" width="340" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="358" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">"Capitalize The Title"</text>

  <!-- ===== Example 3: short words ===== -->
  <text x="320" y="402" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">对照示例 3: "i lOve leetcode" → "i Love Leetcode"</text>

  <!-- short word "i" len=1 → lowercase -->
  <rect x="150" y="414" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="434" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i</text>
  <text x="168" y="460" text-anchor="middle" font-size="9" fill="#d6a040">len=1→小写</text>

  <text x="210" y="434" font-size="14" fill="#888">→</text>

  <rect x="230" y="414" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="434" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i</text>

  <!-- "lOve" len=4 → Love -->
  <rect x="290" y="414" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="434" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lOve</text>
  <text x="318" y="460" text-anchor="middle" font-size="9" fill="#446688">len=4→首大</text>

  <text x="366" y="434" font-size="14" fill="#888">→</text>

  <rect x="386" y="414" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="414" y="434" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Love</text>
</svg>
