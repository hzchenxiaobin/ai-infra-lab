<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 555"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="555" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="260" y="16" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">算法流程：双指针在"虚拟位串"上逐位比对</text>

    <!-- step 1 -->
    <rect x="105" y="30" width="190" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="200" y="52" text-anchor="middle" font-size="10.5" fill="#333">① n = |s|，l = 0，r = 8n − 1</text>

    <path d="M 200 66 L 200 80" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <!-- diamond 1 -->
    <polygon points="200,84 292,118 200,152 108,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="200" y="113" text-anchor="middle" font-size="11" fill="#333">还有位可比？</text>
    <text x="200" y="128" text-anchor="middle" font-size="11" fill="#333">(l &lt; r)</text>

    <!-- no: right to true -->
    <path d="M 292 118 L 312 118" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <text x="300" y="111" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
    <rect x="316" y="96" width="192" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="412" y="113" text-anchor="middle" font-size="10.5" fill="#2f5527" font-weight="bold">✓ 返回 true</text>
    <text x="412" y="130" text-anchor="middle" font-size="9" fill="#2f5527">（全部镜像位相等）</text>

    <!-- yes: down -->
    <path d="M 200 152 L 200 166" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <text x="208" y="164" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

    <!-- step 2 -->
    <rect x="92" y="170" width="216" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="200" y="190" text-anchor="middle" font-size="10.5" fill="#333">② 现场取位：bl = bit(l)，br = bit(r)</text>
    <text x="200" y="207" text-anchor="middle" font-size="9" fill="#555">bit(i) = 字符 s[i÷8] 的第 7−(i mod 8) 位</text>

    <path d="M 200 222 L 200 236" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <!-- diamond 2 -->
    <polygon points="200,240 288,272 200,304 112,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="200" y="276" text-anchor="middle" font-size="11" fill="#333">bl == br ？</text>

    <!-- no: right to false -->
    <path d="M 288 272 L 308 272" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <text x="296" y="265" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
    <rect x="312" y="250" width="196" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="410" y="267" text-anchor="middle" font-size="10.5" fill="#8a3a35" font-weight="bold">✗ 返回 false</text>
    <text x="410" y="284" text-anchor="middle" font-size="9" fill="#8a3a35">（发现首对不等镜像位）</text>

    <!-- yes: down -->
    <path d="M 200 304 L 200 318" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <text x="208" y="316" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

    <!-- step 3 -->
    <rect x="105" y="322" width="190" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="200" y="344" text-anchor="middle" font-size="10.5" fill="#333">③ l++，r −−，回到上方判断</text>

    <!-- loop back -->
    <path d="M 105 340 H 52 V 118 H 104" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)"/>
    <text x="44" y="229" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" transform="rotate(-90 44 229)">继续下一对</text>

    <!-- complexity -->
    <rect x="316" y="180" width="192" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="412" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f">复杂度</text>
    <text x="412" y="215" text-anchor="middle" font-size="9" fill="#7a5c1a">时间 O(8n) = O(n)：至多 4n 次取位</text>
    <text x="412" y="229" text-anchor="middle" font-size="9" fill="#7a5c1a">空间 O(1)：位串只是想象</text>

    <!-- pitfalls -->
    <rect x="50" y="380" width="440" height="158" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="270" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">五个免踩的坑</text>
    <text x="68" y="420" font-size="9.5" fill="#8a3a35">① 8 位必须含前导零：'a' 是 01100001，不是 1100001（format(ord(c), '08b')）</text>
    <text x="68" y="438" font-size="9.5" fill="#8a3a35">② 位串回文 ≠ 字符回文："vv" 字符回文但位串不是；"nv" 恰好反过来——是</text>
    <text x="68" y="456" font-size="9.5" fill="#8a3a35">③ 字节内高位在前：虚拟位串的第 0 位是首字符字节的最高位</text>
    <text x="68" y="474" font-size="9.5" fill="#8a3a35">④ 偷懒写法：拼接出 t 后比较 t == t[::-1]，n ≤ 100 时 O(n) 空间毫无压力</text>
    <text x="68" y="492" font-size="9.5" fill="#8a3a35">⑤ 单字符边界：只有 'f'（01100110 自身即回文）返回 true，其余 25 个字母都 false</text>
  </g>
</svg>
