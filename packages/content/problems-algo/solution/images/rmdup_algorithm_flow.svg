<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次扫描 + 栈</text>

  <!-- Start -->
  <rect x="210" y="44" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化空栈 st</text>

  <line x1="270" y1="74" x2="270" y2="96" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="180" y="96" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="116" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">遍历每个字符 c ∈ s</text>

  <line x1="270" y1="126" x2="270" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="270,150 380,200 270,250 160,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">栈非空 且</text>
  <text x="270" y="212" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">st.top() == c ?</text>

  <!-- Yes branch (left): pop -->
  <line x1="160" y1="200" x2="120" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="36" y="186" width="84" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="206" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">st.pop() 弹出</text>

  <!-- No branch (right): push -->
  <line x1="380" y1="200" x2="420" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="420" y="186" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="462" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">st.push(c)</text>

  <!-- Merge back to loop -->
  <path d="M 78 216 L 78 270 L 270 270" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 462 216 L 462 270 L 270 270" fill="none" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="288" text-anchor="middle" font-size="11" fill="#888">处理完 c，继续下一字符</text>

  <line x1="270" y1="120" x2="430" y2="120" stroke="#888" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="430" y1="120" x2="430" y2="270" stroke="#888" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- End: join stack -->
  <line x1="270" y1="300" x2="270" y2="324" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="324" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">扫描结束：将栈内字符拼接为结果</text>

  <line x1="270" y1="354" x2="270" y2="378" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="378" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="270" y="398" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回拼接字符串</text>

  <text x="270" y="422" text-anchor="middle" font-size="11" fill="#888">注：栈底→栈顶的顺序即为结果字符顺序</text>
</svg>
