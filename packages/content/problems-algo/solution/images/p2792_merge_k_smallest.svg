<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">归并机制：孩子列表 → 后代最小 k 个 → 纳入自身</text>

  <!-- 当前节点 v -->
  <circle cx="260" cy="62" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">v</text>

  <!-- 左孩子列表 -->
  <rect x="60" y="104" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="135" y="124" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">dfs(v.left)</text>
  <text x="135" y="146" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">L = [a₁ ≤ a₂ ≤ …]</text>

  <!-- 右孩子列表 -->
  <rect x="310" y="104" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="385" y="124" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">dfs(v.right)</text>
  <text x="385" y="146" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">R = [b₁ ≤ b₂ ≤ …]</text>

  <!-- 连线到归并 -->
  <line x1="135" y1="162" x2="200" y2="186" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="385" y1="162" x2="320" y2="186" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 归并框 -->
  <rect x="110" y="188" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="215" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">两指针归并 L + R，取前 k 小 → desc</text>

  <!-- 判定菱形 -->
  <polygon points="260,246 360,276 260,306 160,276" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">len(desc)==k</text>
  <text x="260" y="286" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">且 v.val &gt; desc[-1] ?</text>

  <!-- 是分支 → ans++ -->
  <line x1="360" y1="276" x2="416" y2="276" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="270" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="420" y="262" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="463" y="282" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">ans += 1 ✓</text>

  <!-- 否/继续 → 纳入自身 -->
  <line x1="260" y1="306" x2="260" y2="322" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="324" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">插入 v.val、截断到 k → 返回 dfs(v)</text>
</svg>
