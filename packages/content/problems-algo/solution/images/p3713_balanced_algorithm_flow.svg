<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：定右端点 j，向左生长 + O(1) 判定</text>

  <rect x="215" y="30" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 260 54 L 260 64" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="135" y="66" width="250" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">外层：枚举右端点 j = 0 … n−1</text>

  <path d="M 260 92 L 260 102" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="104" width="280" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[26] 清零，distinct = maxFreq = 0</text>

  <path d="M 260 130 L 260 140" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="142" width="280" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① i 从 j 向左扩一格：cnt[s[i]]++</text>

  <path d="M 260 168 L 260 178" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="180" width="340" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② cnt[c] == 1 → distinct++</text>
  <text x="260" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[c] &gt; maxFreq → maxFreq = cnt[c]</text>

  <path d="M 260 212 L 260 222" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 260 222 L 352 249 L 260 276 L 168 249 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">maxFreq × distinct</text>
  <text x="260" y="262" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">== len ?</text>

  <path d="M 260 276 L 260 288" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="286" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="145" y="290" width="230" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = max(ans, j−i+1)</text>

  <path d="M 260 316 L 260 326" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="328" width="170" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="260" y="345" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return ans</text>

  <!-- 否：右侧回环，i−− 继续内层 -->
  <path d="M 352 249 L 488 249 L 488 155 L 404 155" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="366" y="241" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="448" y="148" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i−− 继续</text>

  <!-- ans 更新后同样回到内层 -->
  <path d="M 375 303 L 508 303 L 508 144 L 404 144" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="442" y="318" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">更新后继续 i−−</text>

  <!-- i 走完：j++ 进入下一轮外层 -->
  <path d="M 120 155 L 30 155 L 30 117 L 116 117" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="73" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i &lt; 0 → j++</text>

  <text x="16" y="352" font-size="10" fill="#999" filter="url(#rough2)">O(n²)：n ≤ 1000 稳过</text>
</svg>
