<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [5,7,7,8,8,10], target = 8</text>

  <!-- shared array header (always show indices + values) -->
  <text x="20" y="56" font-size="11" fill="#888">下标：</text>
  <text x="92" y="56" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="140" y="56" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="188" y="56" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="236" y="56" text-anchor="middle" font-size="10" fill="#aaa">3</text>
  <text x="284" y="56" text-anchor="middle" font-size="10" fill="#aaa">4</text>
  <text x="332" y="56" text-anchor="middle" font-size="10" fill="#aaa">5</text>

  <!-- ============ Panel: find first ============ -->
  <rect x="10" y="66" width="540" height="170" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="10" y="66" width="540" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">找 first（命中 → 往左收缩）</text>

  <!-- row r1: mid=2 -->
  <text x="20" y="112" font-size="10.5" fill="#888">r1: L=0 R=5 mid=2 → 7</text>
  <rect x="68" y="100" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="90" y="118" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="116" y="100" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="138" y="118" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="164" y="100" width="44" height="26" fill="#f0f0f0" stroke="#888" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <rect x="212" y="100" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="234" y="118" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="260" y="100" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="282" y="118" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="308" y="100" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="118" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="360" y="116" font-size="10.5" fill="#446688" font-weight="bold">&lt;8 → L=3</text>

  <!-- row r2: mid=4 hit -->
  <text x="20" y="150" font-size="10.5" fill="#888">r2: L=3 R=5 mid=4 → 8</text>
  <rect x="68" y="138" width="44" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="156" text-anchor="middle" font-size="10.5" fill="#bbb">5</text>
  <rect x="116" y="138" width="44" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="138" y="156" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <rect x="164" y="138" width="44" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="186" y="156" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <rect x="212" y="138" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="234" y="156" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="260" y="138" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <rect x="308" y="138" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="156" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="360" y="154" font-size="10.5" fill="#d6a040" font-weight="bold">==8 记录 ans=4, R=3</text>

  <!-- row r3: mid=3 hit -->
  <text x="20" y="188" font-size="10.5" fill="#888">r3: L=3 R=3 mid=3 → 8</text>
  <rect x="68" y="176" width="44" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="194" text-anchor="middle" font-size="10.5" fill="#bbb">5</text>
  <rect x="116" y="176" width="44" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="138" y="194" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <rect x="164" y="176" width="44" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="186" y="194" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <rect x="212" y="176" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <rect x="260" y="176" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="282" y="194" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="308" y="176" width="44" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="330" y="194" text-anchor="middle" font-size="10.5" fill="#bbb">10</text>
  <text x="360" y="192" font-size="10.5" fill="#d6a040" font-weight="bold">==8 记录 ans=3, R=2</text>

  <!-- first result -->
  <text x="20" y="222" font-size="11.5" fill="#4a7a3a" font-weight="bold">L&gt;R 收敛 → first = 3 ✓</text>

  <!-- ============ Panel: find last ============ -->
  <rect x="10" y="246" width="540" height="170" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="10" y="246" width="540" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">找 last（命中 → 往右收缩）</text>

  <!-- row r1: mid=2 -->
  <text x="20" y="292" font-size="10.5" fill="#888">r1: L=0 R=5 mid=2 → 7</text>
  <rect x="68" y="280" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="90" y="298" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="116" y="280" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="138" y="298" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="164" y="280" width="44" height="26" fill="#f0f0f0" stroke="#888" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <rect x="212" y="280" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="234" y="298" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="260" y="280" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="282" y="298" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="308" y="280" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="298" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="360" y="296" font-size="10.5" fill="#446688" font-weight="bold">&lt;8 → L=3</text>

  <!-- row r2: mid=4 hit -->
  <text x="20" y="330" font-size="10.5" fill="#888">r2: L=3 R=5 mid=4 → 8</text>
  <rect x="68" y="318" width="44" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="336" text-anchor="middle" font-size="10.5" fill="#bbb">5</text>
  <rect x="116" y="318" width="44" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="138" y="336" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <rect x="164" y="318" width="44" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="186" y="336" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <rect x="212" y="318" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="234" y="336" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="260" y="318" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="336" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <rect x="308" y="318" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="336" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="360" y="334" font-size="10.5" fill="#d6a040" font-weight="bold">==8 记录 ans=4, L=5</text>

  <!-- row r3: mid=5 -->
  <text x="20" y="368" font-size="10.5" fill="#888">r3: L=5 R=5 mid=5 → 10</text>
  <rect x="68" y="356" width="44" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="374" text-anchor="middle" font-size="10.5" fill="#bbb">5</text>
  <rect x="116" y="356" width="44" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="138" y="374" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <rect x="164" y="356" width="44" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="186" y="374" text-anchor="middle" font-size="10.5" fill="#bbb">7</text>
  <rect x="212" y="356" width="44" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="234" y="374" text-anchor="middle" font-size="10.5" fill="#bbb">8</text>
  <rect x="260" y="356" width="44" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="282" y="374" text-anchor="middle" font-size="10.5" fill="#bbb">8</text>
  <rect x="308" y="356" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="374" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="360" y="372" font-size="10.5" fill="#b85450" font-weight="bold">&gt;8 → R=4</text>

  <!-- last result -->
  <text x="20" y="402" font-size="11.5" fill="#b85450" font-weight="bold">L&gt;R 收敛 → last = 4 ✓</text>

  <!-- footer -->
  <rect x="10" y="418" width="540" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="433" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回 [first, last] = [3, 4]  ✓</text>
</svg>
