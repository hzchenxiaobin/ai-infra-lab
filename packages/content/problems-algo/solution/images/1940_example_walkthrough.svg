<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：三个严格递增数组</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888">arrays = [[2,3,6,8],[1,2,3,5,6,7,10],[2,3,4,6,9]]</text>

  <!-- Array rows -->
  <text x="40" y="84" font-size="12" fill="#446688" font-weight="bold">A0</text>
  <g font-size="12">
    <rect x="76" y="66" width="40" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="96" y="85" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="118" y="66" width="40" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="138" y="85" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="160" y="66" width="40" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="180" y="85" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <rect x="202" y="66" width="40" height="28" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="222" y="85" text-anchor="middle" fill="#888">8</text>
  </g>

  <text x="40" y="124" font-size="12" fill="#d6a040" font-weight="bold">A1</text>
  <g font-size="12">
    <rect x="76" y="106" width="40" height="28" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="96" y="125" text-anchor="middle" fill="#888">1</text>
    <rect x="118" y="106" width="40" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="138" y="125" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="160" y="106" width="40" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="180" y="125" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="202" y="106" width="40" height="28" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="222" y="125" text-anchor="middle" fill="#888">5</text>
    <rect x="244" y="106" width="40" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="264" y="125" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <rect x="286" y="106" width="40" height="28" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="306" y="125" text-anchor="middle" fill="#888">7</text>
    <rect x="328" y="106" width="40" height="28" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="348" y="125" text-anchor="middle" fill="#888">10</text>
  </g>

  <text x="40" y="164" font-size="12" fill="#b85450" font-weight="bold">A2</text>
  <g font-size="12">
    <rect x="76" y="146" width="40" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="96" y="165" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="118" y="146" width="40" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="138" y="165" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="160" y="146" width="40" height="28" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="180" y="165" text-anchor="middle" fill="#888">4</text>
    <rect x="202" y="146" width="40" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="222" y="165" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <rect x="244" y="146" width="40" height="28" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="264" y="165" text-anchor="middle" fill="#888">9</text>
  </g>

  <text x="400" y="100" font-size="11" fill="#b85450">蓝色 = 三个数组都含的元素</text>
  <text x="400" y="118" font-size="11" fill="#888">灰色 = 仅部分数组含有</text>

  <!-- cnt table -->
  <text x="40" y="206" font-size="13" fill="#444" font-weight="bold">计数表 cnt[x]（k = 3）</text>

  <!-- header: values 1..6, then ... -->
  <g font-size="11">
    <rect x="40" y="216" width="42" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="61" y="232" text-anchor="middle" fill="#446688" font-weight="bold">x</text>
    <rect x="82" y="216" width="42" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="103" y="232" text-anchor="middle" fill="#666">1</text>
    <rect x="124" y="216" width="42" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="145" y="232" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="166" y="216" width="42" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="187" y="232" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="208" y="216" width="42" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="229" y="232" text-anchor="middle" fill="#666">4</text>
    <rect x="250" y="216" width="42" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="271" y="232" text-anchor="middle" fill="#666">5</text>
    <rect x="292" y="216" width="42" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="313" y="232" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <rect x="334" y="216" width="42" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="355" y="232" text-anchor="middle" fill="#888">…</text>
  </g>

  <!-- cnt row -->
  <g font-size="11">
    <rect x="40" y="240" width="42" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="61" y="256" text-anchor="middle" fill="#d6a040" font-weight="bold">cnt</text>
    <rect x="82" y="240" width="42" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="103" y="256" text-anchor="middle" fill="#666">1</text>
    <rect x="124" y="240" width="42" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="145" y="256" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="166" y="240" width="42" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="187" y="256" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="208" y="240" width="42" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="229" y="256" text-anchor="middle" fill="#666">1</text>
    <rect x="250" y="240" width="42" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="271" y="256" text-anchor="middle" fill="#666">1</text>
    <rect x="292" y="240" width="42" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="313" y="256" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="334" y="240" width="42" height="24" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="355" y="256" text-anchor="middle" fill="#888">…</text>
  </g>

  <text x="400" y="232" font-size="11" fill="#4a7a3a">绿色格 = cnt == k = 3</text>
  <text x="400" y="250" font-size="11" fill="#888">其余 cnt &lt; 3，丢弃</text>

  <!-- result -->
  <path d="M 145 270 Q 160 296 176 318" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 313 270 Q 300 296 240 318" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="324" width="220" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="350" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">ans = [2, 3, 6]</text>

  <!-- takeaway -->
  <rect x="40" y="378" width="580" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="402" font-size="12" fill="#444" font-weight="bold">观察要点</text>
  <text x="60" y="420" font-size="11" fill="#555">• 严格递增保证 cnt[x] 即「含 x 的数组数」；• 按值升序收集，结果天然有序，无需再排序</text>
</svg>
