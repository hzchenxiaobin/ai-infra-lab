<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：操作被题目强制取最大 → 大顶堆模拟，k 步后求和剩余</text>

  <!-- ① 操作语义 -->
  <text x="30" y="52" font-size="12" fill="#d6a040" font-weight="bold">① 每秒必须选「数量最多」的一堆，降为 ⌊√v⌋，差额即取走</text>

  <rect x="40" y="64" width="64" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="85" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">100</text>
  <text x="72" y="60" text-anchor="middle" font-size="10" fill="#b85450">max</text>

  <path d="M 108 80 L 168 80" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="72" text-anchor="middle" font-size="10.5" fill="#446688">⌊√100⌋=10</text>

  <rect x="172" y="64" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="198" y="85" text-anchor="middle" font-size="13" fill="#446688">10</text>

  <path d="M 228 80 L 286 80" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="258" y="72" text-anchor="middle" font-size="10.5" fill="#b85450">取走 90</text>

  <rect x="290" y="64" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="320" y="85" text-anchor="middle" font-size="11" fill="#b85450">已移除</text>

  <text x="30" y="112" font-size="10.5" fill="#666">每步必须挑最大堆（并列任选其一，结果相同）；削弱算子 v→⌊√v⌋ 严格收缩（v≥2 时减小）</text>

  <!-- ② 大顶堆模拟 -->
  <text x="30" y="142" font-size="12" fill="#d6a040" font-weight="bold">② 大顶堆：每步 pop 当前最大 v → push ⌊√v⌋ 回堆，sum 累减 (v−⌊√v⌋)</text>

  <rect x="70" y="154" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="102" y="174" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">max</text>
  <rect x="50" y="188" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="74" y="206" text-anchor="middle" font-size="11" fill="#446688">…</text>
  <rect x="102" y="188" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="126" y="206" text-anchor="middle" font-size="11" fill="#446688">…</text>
  <text x="102" y="226" text-anchor="middle" font-size="10" fill="#888">大顶堆 O(n)</text>

  <path d="M 134 169 L 220 169" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="178" y="162" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">pop v</text>

  <rect x="224" y="154" width="96" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="272" y="174" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">sum −= v−⌊√v⌋</text>

  <path d="M 320 169 L 388 169" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="354" y="162" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">push ⌊√v⌋</text>

  <rect x="392" y="154" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="422" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a">回堆</text>

  <!-- loop back to heap -->
  <path d="M 392 184 C 300 234 200 234 134 184" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="263" y="222" text-anchor="middle" font-size="10.5" fill="#888">循环 k 次（v=1 时 ⌊√1⌋=1，移走 0，不变）</text>

  <!-- ③ 收尾 -->
  <rect x="30" y="250" width="500" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="40" y="270" font-size="12" fill="#4a7a3a" font-weight="bold">③ 返回 sum（= 初始总量 − Σ 各步移走量 = 剩余礼物总数）</text>
  <text x="40" y="290" font-size="11" fill="#333">区别于 2530（可任选下标、需贪心证明、最大化「取走」之和）：本题操作被题目强制，纯模拟</text>
  <text x="40" y="306" font-size="11" fill="#333">并列最大任选结果相同 → 无优化决策，难度由此降一档</text>

  <!-- result -->
  <rect x="150" y="328" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">return sum（long long，可达 n·1e⁹）</text>

  <rect x="30" y="376" width="500" height="14" fill="none" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)" stroke-dasharray="3,2"/>
</svg>
