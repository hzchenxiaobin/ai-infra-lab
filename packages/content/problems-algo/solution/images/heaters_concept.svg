<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：答案 = max(每个房屋到最近供暖器的距离)</text>

  <!-- ===== Horizontal number line ===== -->
  <line x1="60" y1="170" x2="440" y2="170" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Position ticks: 1→x=120, 2→x=200, 3→x=280, 4→x=360 -->
  <line x1="120" y1="165" x2="120" y2="175" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="190" text-anchor="middle" font-size="10" fill="#888">1</text>
  <line x1="200" y1="165" x2="200" y2="175" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="200" y="190" text-anchor="middle" font-size="10" fill="#888">2</text>
  <line x1="280" y1="165" x2="280" y2="175" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="10" fill="#888">3</text>
  <line x1="360" y1="165" x2="360" y2="175" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="190" text-anchor="middle" font-size="10" fill="#888">4</text>

  <!-- Houses (blue circles) on the line -->
  <circle cx="120" cy="170" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="174" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">屋</text>
  <circle cx="200" cy="170" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="174" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">屋</text>
  <circle cx="280" cy="170" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">屋</text>
  <circle cx="360" cy="170" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="174" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">屋</text>

  <!-- Heaters (orange diamonds) above the line -->
  <polygon points="120,138 132,150 120,162 108,150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="153" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">暖</text>
  <polygon points="360,138 372,150 360,162 348,150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="153" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">暖</text>

  <text x="120" y="128" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">供暖器</text>
  <text x="360" y="128" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">供暖器</text>

  <!-- ===== Distance arrows below the line ===== -->
  <!-- House 1 -> heater 1: d=0 -->
  <text x="120" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">d=0</text>

  <!-- House 2 -> heater 1: d=1 (arrow left) -->
  <path d="M 196 200 L 128 200" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d=1</text>

  <!-- House 3 -> heater 4: d=1 (arrow right) -->
  <path d="M 284 200 L 352 200" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d=1</text>

  <!-- House 4 -> heater 4: d=0 -->
  <text x="360" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">d=0</text>

  <!-- ===== Answer formula box ===== -->
  <rect x="100" y="248" width="360" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">radius = max(0, 1, 1, 0) = 1</text>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#666">最远的「最近距离」决定统一半径</text>

  <!-- ===== Method note ===== -->
  <rect x="40" y="324" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="349" text-anchor="middle" font-size="11" fill="#446688">排序 heaters → 每个房屋 lower_bound 定位 → 比较左右两个候选供暖器取最小距离</text>
</svg>
