<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#556677"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：逆先序自底向上，小并大合并（迭代 DFS 防爆栈）</text>

  <!-- ① -->
  <rect x="110" y="30" width="300" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="51" text-anchor="middle" font-size="10" fill="#2b4460" filter="url(#rough2)">① 建邻接表，从节点 0 迭代 DFS 得 parent / depth / 先序 order</text>
  <path d="M 260 64 L 260 76" fill="none" stroke="#556677" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② -->
  <rect x="110" y="80" width="300" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="10" fill="#2b4460" filter="url(#rough2)">② 逆先序取 u：先序中父必先于子 ⇒ 逆序即孩子先就绪</text>
  <path d="M 260 114 L 260 126" fill="none" stroke="#556677" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ③ -->
  <rect x="85" y="130" width="350" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="151" text-anchor="middle" font-size="10" fill="#2f5527" filter="url(#rough2)">③ base ← { group[u] : (1, depth[u]) }，逐个取 u 的孩子 c</text>
  <path d="M 260 164 L 260 174" fill="none" stroke="#556677" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,176 340,208 260,240 180,208" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">孩子表比 base 大？</text>

  <text x="296" y="202" font-size="9.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">是</text>
  <path d="M 342 208 L 378 208" fill="none" stroke="#556677" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="382" y="192" width="116" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="212" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">swap：大表作 base</text>
  <path d="M 440 226 L 440 262 L 412 262" fill="none" stroke="#556677" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="268" y="252" font-size="9.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">否</text>
  <path d="M 260 242 L 260 252" fill="none" stroke="#556677" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ④ 合并 -->
  <rect x="58" y="254" width="350" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="233" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">④ 逐项小并大：公共组 g ⇒</text>
  <text x="233" y="287" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">ans += c₁·S₂ + c₂·S₁ − 2·depth(u)·c₁·c₂</text>
  <text x="233" y="301" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">表项合并为 (c₁+c₂, S₁+S₂)；非公共组直接搬入</text>

  <!-- 回到 ③ 的循环 -->
  <path d="M 58 282 L 36 282 L 36 147 L 81 147" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="20" y="215" transform="rotate(-90 20 215)" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">对每个孩子 c</text>

  <path d="M 233 310 L 233 322" fill="none" stroke="#556677" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ⑤ -->
  <rect x="85" y="324" width="350" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a3b36" filter="url(#rough2)">⑤ maps[u] ← base；全部节点处理完 ⇒ 返回 ans（O(n log n)）</text>
</svg>
