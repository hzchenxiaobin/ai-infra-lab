<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">算法流程：差分建表 + 一趟扫描，逐怪取下界</text>

  <!-- 主流程 -->
  <rect x="36" y="34" width="260" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="166" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">① 差分建表</text>
  <text x="166" y="64" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">diff[l] += v；diff[r+1] −= v（开 n+1 长）</text>

  <path d="M 166 72 L 166 86" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="88" width="260" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="166" y="104" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">② 扫描 i = 0 … n−1</text>
  <text x="166" y="120" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">bonus += diff[i]（前缀和还原加成）</text>

  <path d="M 166 132 L 166 138" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="166,140 262,164 166,188 70,164" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="166" y="168" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">bonus &lt; m_i ?</text>

  <text x="176" y="200" text-anchor="start" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 166 188 L 166 204" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="206" width="260" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="166" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans ← max(ans, P + m_i − bonus)</text>
  <text x="166" y="238" text-anchor="middle" font-size="8.5" fill="#7a3a36" filter="url(#rough2)">该怪真正施加下界 S ≥ P_i + m_i − b_i</text>

  <path d="M 166 254 L 166 270" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="272" width="260" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="166" y="291" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">P += m_i（前缀和推进）</text>

  <!-- 否分支：绕过 ans 更新，直接汇入前缀和推进 -->
  <text x="272" y="157" text-anchor="middle" font-size="9" fill="#2f5527" filter="url(#rough2)">否</text>
  <path d="M 262 164 L 314 164 L 314 287 L 300 287" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="318" y="244" text-anchor="start" font-size="8.5" fill="#2f5527" filter="url(#rough2)">b_i ≥ m_i，免检</text>

  <path d="M 166 302 L 166 316" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="318" width="260" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="166" y="337" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">⑥ 扫描结束，返回 ans</text>

  <!-- 回到下一只怪 -->
  <path d="M 36 287 L 22 287 L 22 104 L 34 104" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="16" y="196" text-anchor="middle" font-size="8.5" fill="#666" transform="rotate(-90 16 196)" filter="url(#rough2)">下一只 i</text>

  <!-- 侧注 1：钳位 -->
  <rect x="336" y="34" width="172" height="106" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="422" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">钳位是闭式的灵魂</text>
  <text x="422" y="68" text-anchor="middle" font-size="8.5" fill="#7a3a36" filter="url(#rough2)">打怪 i 前强度</text>
  <text x="422" y="81" text-anchor="middle" font-size="8.5" fill="#7a3a36" filter="url(#rough2)">= max(0, S − P_i)</text>
  <text x="422" y="94" text-anchor="middle" font-size="8.5" fill="#7a3a36" filter="url(#rough2)">b_i ≥ m_i 时 0 + b_i 已够</text>
  <text x="422" y="107" text-anchor="middle" font-size="8.5" fill="#7a3a36" filter="url(#rough2)">⇒ 任何 S 都过（免检）</text>
  <text x="422" y="120" text-anchor="middle" font-size="8.5" fill="#7a3a36" filter="url(#rough2)">漏掉免检判定会 WA</text>

  <!-- 侧注 2：溢出 -->
  <rect x="336" y="152" width="172" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="422" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">溢出提醒</text>
  <text x="422" y="184" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">P、bonus ≤ 5×10⁴ × 10⁹</text>
  <text x="422" y="197" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">= 5×10¹³ → 必须 long long</text>
  <text x="422" y="210" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">ans 同量级，Python 无忧</text>

  <text x="260" y="356" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">时间 O(n + m)｜空间 O(n)｜n、m ≤ 5×10⁴，值域 10⁹</text>
</svg>
