<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="880" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="440" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：成功染色 vs 奇环冲突</text>

  <!-- ============ Left panel: example 1 (true, 4-cycle) ============ -->
  <rect x="24" y="44" width="392" height="316" rx="10" fill="#f4faf6" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="220" y="66" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">示例 1：[[1,3],[0,2],[1,3],[0,2]] → true（4-环）</text>

  <!-- edges: 0-1, 1-2, 2-3, 3-0 -->
  <path d="M 132 142 L 308 142" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 308 142 L 308 242" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 308 242 L 132 242" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 132 242 L 132 142" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- nodes: 0蓝 1绿 2蓝 3绿 -->
  <circle cx="132" cy="142" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="132" y="148" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <circle cx="308" cy="142" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="308" y="148" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <circle cx="308" cy="242" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="308" y="248" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <circle cx="132" cy="242" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="132" y="248" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>

  <!-- legend -->
  <rect x="150" y="284" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="172" y="297" font-size="10" fill="#555">颜色 1（蓝）</text>
  <rect x="262" y="284" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="284" y="297" font-size="10" fill="#555">颜色 −1（绿）</text>

  <!-- steps -->
  <text x="220" y="326" text-anchor="middle" font-size="11" fill="#444">染 0=蓝 → 邻居 1,3=绿 → 2=蓝</text>
  <text x="220" y="344" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">所有边两端异色 ✓</text>
  <text x="220" y="360" text-anchor="middle" font-size="11" fill="#2e6e2e">→ 无奇环，是二分图</text>

  <!-- ============ Right panel: example 2 (false, triangle) ============ -->
  <rect x="448" y="44" width="392" height="316" rx="10" fill="#fdf3f4" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="644" y="66" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">示例 2：[[1,2,3],[0,2],[0,1,3],[0,2]] → false（3-环）</text>

  <!-- edges: 0-1, 0-2, 0-3, 1-2(conflict), 2-3(conflict) -->
  <path d="M 644 120 L 556 214" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 644 120 L 732 214" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 644 120 L 644 300" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 556 214 L 732 214" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M 732 214 L 644 300" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- nodes: 0蓝 1绿 2绿 3绿 -->
  <circle cx="644" cy="120" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="644" y="126" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <circle cx="556" cy="214" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="556" y="220" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <circle cx="732" cy="214" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="732" y="220" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <circle cx="644" cy="300" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="644" y="306" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>

  <!-- conflict callout -->
  <text x="644" y="338" text-anchor="middle" font-size="11" fill="#444">染 0=蓝 → 邻居 1,2,3=绿</text>
  <text x="644" y="354" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">检查 1–2：同为绿 ✗ 冲突</text>
  <text x="644" y="370" text-anchor="middle" font-size="11" fill="#b03a3a">→ 含奇环 0-1-2-0，非二分图</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="392" width="800" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="415" text-anchor="middle" font-size="11" fill="#444">BFS/DFS 染色遇同色相邻立即返回 false；全部染完无冲突才返回 true</text>
</svg>
