<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：构造基串 → 扫描 pattern → 遇 D 段则翻转</text>

  <!-- 1. init box -->
  <rect x="190" y="40" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">num ← "1…n+1"（最小 n+1 个数字升序）</text>
  <text x="280" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i ← 0</text>

  <!-- arrow 1 -> diamond2 -->
  <path d="M 280 84 L 280 104" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. diamond i<n? -->
  <polygon points="280,106 372,140 280,174 188,140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">i &lt; n ?</text>

  <!-- return box (No branch, right) -->
  <rect x="392" y="124" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="452" y="144" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 num</text>
  <path d="M 372 140 L 392 140" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="116" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">否(扫描完)</text>

  <!-- arrow Yes down to diamond3 -->
  <path d="M 280 174 L 280 196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="190" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 3. diamond pattern[i]=='D'? -->
  <polygon points="280,196 376,230 280,264 184,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">pattern[i] == 'D' ?</text>

  <!-- box6 i=i+1 (No / I branch, left) -->
  <rect x="40" y="214" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="95" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i ← i + 1</text>
  <path d="M 184 230 L 150 230" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否(I)</text>

  <!-- box6 loop back up to diamond2 left point (188,140) -->
  <path d="M 95 214 L 95 140 L 184 140" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="180" font-size="10" fill="#888" font-weight="bold">回判定</text>

  <!-- box7 process (Yes / D branch, down) -->
  <rect x="120" y="288" width="320" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j ← i</text>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">while j&lt;n 且 pattern[j]=='D'：j ← j+1</text>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">reverse(num[i…j])；i ← j</text>
  <path d="M 280 264 L 280 288" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="280" font-size="10" fill="#b85450" font-weight="bold">是(D)</text>

  <!-- box7 loop back up to diamond2 top (280,106) via far right -->
  <path d="M 440 320 L 500 320 L 500 96 L 280 96 L 280 106" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="506" y="210" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" transform="rotate(-90 506 210)">回判定</text>
</svg>
