<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="540" height="370" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="200" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    两点为对角 → 轴对齐矩形
  </text>

  <!-- ===== 左侧主图：有效矩形 ===== -->
  <!-- 坐标轴 -->
  <line x1="70" y1="300" x2="330" y2="300" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="70" y1="300" x2="70" y2="110" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="304" font-size="11" fill="#446688" filter="url(#rough2)">x</text>
  <text x="64" y="106" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">y</text>

  <!-- 矩形主体 (x1=100,y1=270) -> (x2=290,y2=130) -->
  <rect x="100" y="130" width="190" height="140" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" rx="2" filter="url(#rough2)"/>

  <!-- 对角线（虚线） -->
  <line x1="100" y1="270" x2="290" y2="130" stroke="#b85450" stroke-width="1.6"
        stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 另外两个角（空心点） -->
  <circle cx="290" cy="270" r="3.5" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="100" cy="130" r="3.5" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 给定的两个对角点 P1 / P2 -->
  <circle cx="100" cy="270" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="290" cy="130" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="92" y="288" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)">P₁(x₁,y₁)</text>
  <text x="298" y="124" font-size="12" fill="#b85450" filter="url(#rough2)">P₂(x₂,y₂)</text>

  <!-- 宽度标注 -->
  <line x1="100" y1="320" x2="290" y2="320" stroke="#4a7a3a" stroke-width="1.4"
        marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="100" y1="305" x2="100" y2="325" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="290" y1="305" x2="290" y2="325" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="195" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">宽 = |x₂ − x₁|</text>

  <!-- 高度标注 -->
  <line x1="50" y1="130" x2="50" y2="270" stroke="#4a7a3a" stroke-width="1.4"
        marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="45" y1="130" x2="55" y2="130" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="45" y1="270" x2="55" y2="270" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="44" y="204" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">高 = |y₂ − y₁|</text>

  <!-- 面积公式框 -->
  <rect x="150" y="70" width="180" height="40" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="95" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    面积 = |Δx| · |Δy|
  </text>

  <!-- ===== 右侧：退化情况 ===== -->
  <line x1="370" y1="300" x2="510" y2="300" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="370" y1="300" x2="370" y2="150" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 同 x → 竖直线段 -->
  <circle cx="410" cy="180" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="410" cy="270" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <line x1="410" y1="180" x2="410" y2="270" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="418" y="178" font-size="11" fill="#b85450" filter="url(#rough2)">x₁ = x₂</text>
  <text x="430" y="228" font-size="11" fill="#b85450" filter="url(#rough2)">退化线段</text>

  <!-- 同 y → 水平线段 -->
  <circle cx="455" cy="240" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="500" cy="240" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <line x1="455" y1="240" x2="500" y2="240" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="258" font-size="11" fill="#b85450" filter="url(#rough2)">y₁ = y₂</text>

  <!-- 退化结论框 -->
  <rect x="372" y="118" width="148" height="32" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="446" y="138" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    任一相等 ⇒ 面积 0
  </text>
</svg>
