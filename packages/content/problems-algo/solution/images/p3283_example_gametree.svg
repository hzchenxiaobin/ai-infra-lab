<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：三个兵离起点都是 2 步，Alice 先吃谁？</text>

  <!-- 根节点 -->
  <rect x="60" y="34" width="400" height="30" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="11" fill="#2e4460" filter="url(#rough2)">Alice @ 起点 (0,2)：到兵0(1,1) / 兵1(2,2) / 兵2(3,3) 恰好都是 2 步</text>

  <path d="M 200 64 Q 140 74 104 84" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 64 L 260 84" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 64 Q 380 74 416 84" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 三个第一跳 -->
  <rect x="30" y="88" width="140" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="105" text-anchor="middle" font-size="10" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">先吃兵0 (1,1)：+2 步</text>

  <rect x="190" y="88" width="140" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="10" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">先吃兵1 (2,2)：+2 步</text>

  <rect x="350" y="88" width="140" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="105" text-anchor="middle" font-size="10" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">先吃兵2 (3,3)：+2 步</text>

  <path d="M 100 114 L 100 126" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 114 L 260 126" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 114 L 420 126" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Bob 的选择 -->
  <rect x="22" y="130" width="156" height="88" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="147" text-anchor="middle" font-size="9.5" fill="#2e4460" font-weight="bold" filter="url(#rough2)">Bob @ (1,1) 挑最省：</text>
  <text x="100" y="164" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">· 吃兵1 +2，末跳 +2 ⇒ 4</text>
  <text x="100" y="181" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">· 吃兵2 +4，末跳 +2 ⇒ 6</text>
  <text x="100" y="204" text-anchor="middle" font-size="10" fill="#2e4460" font-weight="bold" filter="url(#rough2)">→ Bob 取 min = 4</text>

  <rect x="182" y="130" width="156" height="88" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="147" text-anchor="middle" font-size="9.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">Bob @ (2,2) 无路可逃：</text>
  <text x="260" y="164" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">· 吃兵0 +2，末跳 +4 ⇒ 6</text>
  <text x="260" y="181" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">· 吃兵2 +2，末跳 +4 ⇒ 6</text>
  <text x="260" y="204" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">→ Bob 被迫取 6</text>

  <rect x="342" y="130" width="156" height="88" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="147" text-anchor="middle" font-size="9.5" fill="#2e4460" font-weight="bold" filter="url(#rough2)">Bob @ (3,3) 挑最省：</text>
  <text x="420" y="164" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">· 吃兵0 +4，末跳 +2 ⇒ 6</text>
  <text x="420" y="181" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">· 吃兵1 +2，末跳 +2 ⇒ 4</text>
  <text x="420" y="204" text-anchor="middle" font-size="10" fill="#2e4460" font-weight="bold" filter="url(#rough2)">→ Bob 取 min = 4</text>

  <path d="M 100 218 L 100 230" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 218 L 260 230" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 218 L 420 230" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 小计 -->
  <rect x="40" y="234" width="120" height="26" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="251" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">小计 = 2+4 = 6</text>

  <rect x="200" y="234" width="120" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="251" text-anchor="middle" font-size="10.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">小计 = 2+6 = 8</text>

  <rect x="360" y="234" width="120" height="26" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="251" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">小计 = 2+4 = 6</text>

  <path d="M 160 247 L 236 270" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 260 L 260 268" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 247 L 284 270" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Alice 取 max -->
  <rect x="130" y="272" width="260" height="30" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">Alice 取 max(6, 8, 6) = 8 ← 答案</text>

  <!-- 点评 -->
  <rect x="30" y="312" width="460" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#rough2)">三个第一跳代价全同，但只有吃掉「中间」的 (2,2)，剩下两兵才互距 4 步——</text>
  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#rough2)">Bob 无论先吃哪个，最后一跳都得花 4 步。Alice 赢在看得远，不是跳得远。</text>
</svg>
