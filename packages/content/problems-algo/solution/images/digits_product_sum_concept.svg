<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：各位数字分别「求积」与「求和」，再相减</text>

  <!-- original number n = 234 -->
  <text x="44" y="78" font-size="12" fill="#888">原数 n</text>
  <rect x="150" y="58" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="196" y="58" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="242" y="58" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <text x="172" y="108" text-anchor="middle" font-size="10" fill="#888">位1</text>
  <text x="218" y="108" text-anchor="middle" font-size="10" fill="#888">位2</text>
  <text x="264" y="108" text-anchor="middle" font-size="10" fill="#888">位3</text>

  <!-- arrow down to product path -->
  <path d="M 172 110 L 172 134" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 218 110 L 218 134" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 264 110 L 264 134" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- Product path -->
  <rect x="60" y="138" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="160" font-size="12" fill="#4a7a3a" font-weight="bold">积 product</text>
  <text x="170" y="162" font-size="13" fill="#333" font-weight="bold">2 × 3 × 4 = 24</text>
  <text x="380" y="160" font-size="11" fill="#666">初始 product = 1，逐位 ×digit</text>

  <!-- arrow down to sum path (from digits, longer) -->
  <path d="M 172 96 Q 410 96 410 134" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)" stroke-dasharray="3 3"/>
  <path d="M 218 96 Q 430 110 430 134" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)" stroke-dasharray="3 3"/>
  <path d="M 264 96 Q 450 124 450 134" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)" stroke-dasharray="3 3"/>

  <!-- Sum path -->
  <rect x="60" y="192" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="214" font-size="12" fill="#446688" font-weight="bold">和 sum</text>
  <text x="170" y="216" font-size="13" fill="#333" font-weight="bold">2 + 3 + 4 = 9</text>
  <text x="380" y="214" font-size="11" fill="#666">初始 sum = 0，逐位 +digit</text>

  <!-- arrows from product and sum to final -->
  <path d="M 200 182 L 200 248" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 200 236 L 200 248" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- final result -->
  <rect x="60" y="252" width="440" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">结果 = product − sum</text>
  <text x="280" y="298" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">24 − 9 = 15</text>

  <!-- footer note -->
  <text x="280" y="338" text-anchor="middle" font-size="10" fill="#888">逐位取模 n%10 取出末位，n/10 截短原数，一遍循环同时维护积与和</text>
</svg>
