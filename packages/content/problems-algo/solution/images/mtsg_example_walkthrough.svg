<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="350" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "leEeetcode"</text>

  <!-- Header row -->
  <rect x="30" y="34" width="480" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="52" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步骤</text>
  <text x="105" y="52" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">输入</text>
  <text x="200" y="52" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">栈(操作前)</text>
  <text x="330" y="52" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">动作</text>
  <text x="455" y="52" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">栈(操作后)</text>

  <!-- Row 1 -->
  <text x="58" y="76" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="105" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">l</text>
  <text x="200" y="76" text-anchor="middle" font-size="11" fill="#888">[ ]</text>
  <text x="330" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a">push</text>
  <text x="455" y="76" text-anchor="middle" font-size="11" fill="#333">[l]</text>

  <!-- Row 2 -->
  <text x="58" y="98" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="105" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <text x="200" y="98" text-anchor="middle" font-size="11" fill="#888">[l]</text>
  <text x="330" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a">push</text>
  <text x="455" y="98" text-anchor="middle" font-size="11" fill="#333">[l, e]</text>

  <!-- Row 3 - highlighted (the cancel step) -->
  <rect x="30" y="108" width="480" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="124" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="105" y="124" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">E</text>
  <text x="200" y="124" text-anchor="middle" font-size="11" fill="#333">[l, e]</text>
  <text x="330" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">pop (e~E 抵消)</text>
  <text x="455" y="124" text-anchor="middle" font-size="11" fill="#333">[l]</text>

  <!-- Row 4 -->
  <text x="58" y="146" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="105" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <text x="200" y="146" text-anchor="middle" font-size="11" fill="#888">[l]</text>
  <text x="330" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a">push</text>
  <text x="455" y="146" text-anchor="middle" font-size="11" fill="#333">[l, e]</text>

  <!-- Row 5 -->
  <text x="58" y="168" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="105" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <text x="200" y="168" text-anchor="middle" font-size="11" fill="#888">[l, e]</text>
  <text x="330" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a">push</text>
  <text x="455" y="168" text-anchor="middle" font-size="11" fill="#333">[l, e, e]</text>

  <!-- Row 6 -->
  <text x="58" y="190" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="105" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t</text>
  <text x="200" y="190" text-anchor="middle" font-size="11" fill="#888">[l, e, e]</text>
  <text x="330" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a">push</text>
  <text x="455" y="190" text-anchor="middle" font-size="11" fill="#333">[l, e, e, t]</text>

  <!-- Row 7 -->
  <text x="58" y="212" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="105" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <text x="200" y="212" text-anchor="middle" font-size="11" fill="#888">[l, e, e, t]</text>
  <text x="330" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a">push</text>
  <text x="455" y="212" text-anchor="middle" font-size="11" fill="#333">[l, e, e, t, c]</text>

  <!-- Row 8 -->
  <text x="58" y="234" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="105" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">o</text>
  <text x="200" y="234" text-anchor="middle" font-size="11" fill="#888">[l, e, e, t, c]</text>
  <text x="330" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a">push</text>
  <text x="455" y="234" text-anchor="middle" font-size="11" fill="#333">[l, e, e, t, c, o]</text>

  <!-- Row 9 -->
  <text x="58" y="256" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="105" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <text x="200" y="256" text-anchor="middle" font-size="11" fill="#888">[l, e, e, t, c, o]</text>
  <text x="330" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a">push</text>
  <text x="455" y="256" text-anchor="middle" font-size="11" fill="#333">[l, e, e, t, c, o, d]</text>

  <!-- Row 10 -->
  <text x="58" y="278" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="105" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <text x="200" y="278" text-anchor="middle" font-size="11" fill="#888">[l, e, e, t, c, o, d]</text>
  <text x="330" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a">push</text>
  <text x="455" y="278" text-anchor="middle" font-size="11" fill="#333">[l, e, e, t, c, o, d, e]</text>

  <!-- Result -->
  <rect x="140" y="296" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">结果: "leetcode"</text>
</svg>
