<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：左叶子 = 某节点的左孩子 + 本身是叶子</text>

  <!-- ===== tree (left half) ===== -->

  <!-- node 3 (root) -->
  <circle cx="210" cy="76" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="81" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- edge 3 -> 9 (left, to left leaf) -->
  <path d="M 197 89 L 170 116" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <!-- edge 3 -> 20 (right) -->
  <path d="M 223 89 L 250 116" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- node 9 (left leaf of 3) -->
  <circle cx="160" cy="132" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="160" y="137" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <!-- node 20 -->
  <circle cx="260" cy="132" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="137" text-anchor="middle" font-size="13" fill="#333">20</text>

  <!-- edge 20 -> 15 (left, to left leaf) -->
  <path d="M 247 145 L 220 172" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <!-- edge 20 -> 7 (right) -->
  <path d="M 273 145 L 300 172" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- node 15 (left leaf of 20) -->
  <circle cx="210" cy="188" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="210" y="193" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">15</text>

  <!-- node 7 (right leaf of 20, NOT a left leaf) -->
  <circle cx="310" cy="188" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="193" text-anchor="middle" font-size="13" fill="#333">7</text>

  <!-- labels under leaves -->
  <text x="160" y="166" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">左叶子 ✓</text>
  <text x="210" y="222" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">左叶子 ✓</text>
  <text x="310" y="222" text-anchor="middle" font-size="9" fill="#b85450">右叶子 ✗</text>

  <!-- ===== right panel ===== -->
  <path d="M 360 50 L 360 300" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <text x="440" y="64" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">判定要点</text>

  <!-- left leaf def -->
  <rect x="374" y="78" width="132" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="440" y="96" text-anchor="middle" font-size="10" fill="#333">9：3 的左孩子 + 叶子</text>
  <text x="440" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 计入，+9</text>

  <rect x="374" y="132" width="132" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="440" y="150" text-anchor="middle" font-size="10" fill="#333">15：20 的左孩子 + 叶子</text>
  <text x="440" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 计入，+15</text>

  <rect x="374" y="186" width="132" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="440" y="204" text-anchor="middle" font-size="10" fill="#333">7：20 的右孩子</text>
  <text x="440" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">虽是叶子，不计入</text>

  <rect x="374" y="240" width="132" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="258" text-anchor="middle" font-size="10" fill="#333">所有左叶子之和</text>
  <text x="440" y="274" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">9 + 15 = 24</text>

  <text x="210" y="280" text-anchor="middle" font-size="10" fill="#888">叶子 = 无左右孩子</text>
  <text x="210" y="296" text-anchor="middle" font-size="10" fill="#888">「是不是左孩子」由父节点决定</text>
</svg>
