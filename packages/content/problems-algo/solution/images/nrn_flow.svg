<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：BFS 逐层扫描找 u 的右侧邻居</text>

  <!-- Step 1: init -->
  <rect x="190" y="46" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="290" y="78" text-anchor="middle" font-size="10" fill="#555">queue = [root]</text>
  <line x1="290" y1="88" x2="290" y2="100" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: while loop -->
  <rect x="160" y="102" width="260" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">while 队列非空</text>
  <text x="290" y="136" text-anchor="middle" font-size="10" fill="#555">size = len(queue)　← 本层节点数</text>
  <line x1="290" y1="148" x2="290" y2="160" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: for loop -->
  <rect x="160" y="162" width="260" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for i in 0..size-1</text>
  <text x="290" y="196" text-anchor="middle" font-size="10" fill="#555">node = queue.pop_left()</text>
  <line x1="290" y1="208" x2="290" y2="220" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: node == u? -->
  <polygon points="290,222 380,260 290,298 200,260" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">node == u ?</text>
  <text x="290" y="272" text-anchor="middle" font-size="10" fill="#888">（指针比较）</text>

  <!-- Yes branch -->
  <line x1="380" y1="260" x2="440" y2="260" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="392" y="252" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- Decision: i == size-1? (last in level) -->
  <polygon points="500,230 560,260 500,290 440,260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="256" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">本层</text>
  <text x="500" y="268" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">最后?</text>

  <!-- Yes: return null -->
  <line x1="500" y1="290" x2="500" y2="320" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="310" font-size="10" fill="#888">是</text>
  <rect x="450" y="322" width="100" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="342" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return null</text>

  <!-- No: return queue.front() -->
  <line x1="560" y1="260" x2="560" y2="226" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="560" y1="226" x2="560" y2="210" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="568" y="220" font-size="10" fill="#888">否</text>
  <rect x="490" y="186" width="140" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="560" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">return queue.front()</text>

  <!-- No branch: push children -->
  <line x1="200" y1="260" x2="140" y2="260" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="252" font-size="11" fill="#888" font-weight="bold">否</text>
  <rect x="40" y="238" width="100" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="256" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">推入孩子</text>
  <text x="90" y="272" text-anchor="middle" font-size="9" fill="#555">left → right</text>

  <!-- Loop back -->
  <line x1="90" y1="238" x2="90" y2="184" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="90" y1="184" x2="160" y2="184" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="178" font-size="9" fill="#aaa">继续 for 循环</text>

  <!-- End of for loop, back to while -->
  <line x1="160" y1="206" x2="120" y2="206" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="120" y1="206" x2="120" y2="124" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="120" y1="124" x2="160" y2="124" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="200" font-size="9" fill="#aaa">for 结束</text>

  <!-- While ends: return null -->
  <line x1="160" y1="124" x2="80" y2="124" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="80" y1="124" x2="80" y2="390" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="80" y1="390" x2="180" y2="390" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="250" font-size="9" fill="#aaa" transform="rotate(-90 60 250)">while 结束</text>

  <rect x="180" y="374" width="220" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return null</text>
  <text x="290" y="408" text-anchor="middle" font-size="10" fill="#888">（u 不在树中，题目保证不会发生）</text>

  <!-- Note -->
  <rect x="180" y="424" width="220" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="442" text-anchor="middle" font-size="10" fill="#7a5a20">用指针/引用比较 node == u，不用 val</text>
</svg>
