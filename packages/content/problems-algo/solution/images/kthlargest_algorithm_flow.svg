<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="520" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">快速选择算法流程</text>

  <!-- Init -->
  <rect x="80" y="42" width="300" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="84" text-anchor="middle" font-size="11" fill="#555">target = n − k,  lo = 0,  hi = n − 1</text>

  <path d="M 230 102 L 230 120" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop check -->
  <polygon points="230,124 350,168 230,212 110,168" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lo &lt; hi ?</text>
  <text x="230" y="182" text-anchor="middle" font-size="10.5" fill="#777">区间还没收敛？</text>

  <!-- No branch -> return -->
  <path d="M 350 168 L 410 168 L 410 250" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="372" y="160" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="318" y="254" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="378" y="278" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return nums[lo]</text>

  <!-- Yes branch down -->
  <path d="M 230 212 L 230 230" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="240" y="226" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- partition box -->
  <rect x="80" y="234" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="254" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">p = partition(lo, hi)</text>
  <text x="230" y="270" text-anchor="middle" font-size="10.5" fill="#555">随机 pivot 划分，返回归位下标</text>

  <path d="M 230 278 L 230 296" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- compare diamond: p vs target -->
  <polygon points="230,300 360,352 230,404 100,352" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">比较 p 与 target</text>
  <text x="230" y="364" text-anchor="middle" font-size="10.5" fill="#777">p ? (n − k)</text>

  <!-- p == target: middle bottom -->
  <path d="M 230 404 L 230 422" stroke="#82b366" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="250" y="416" font-size="11" fill="#4a7a3a" font-weight="bold">==</text>
  <rect x="150" y="426" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="450" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return nums[p]</text>

  <!-- p < target: right side, lo = p+1 -->
  <path d="M 360 352 L 410 352 L 410 446" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="372" y="344" font-size="10.5" fill="#d6a040" font-weight="bold">&lt;</text>
  <rect x="338" y="426" width="118" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="397" y="442" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">答案在右段</text>
  <text x="397" y="458" text-anchor="middle" font-size="10.5" fill="#555">lo = p + 1</text>

  <!-- p > target: left side, hi = p-1 -->
  <path d="M 100 352 L 40 352 L 40 446" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="64" y="344" font-size="10.5" fill="#b85450" font-weight="bold">&gt;</text>
  <rect x="4" y="426" width="118" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="63" y="442" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">答案在左段</text>
  <text x="63" y="458" text-anchor="middle" font-size="10.5" fill="#555">hi = p − 1</text>

  <!-- loop back arrows from both side boxes up to loop check -->
  <path d="M 63 426 L 63 168 L 110 168" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 397 426 L 397 168 L 350 168" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowL)" filter="url(#rough2)"/>

  <!-- footer -->
  <text x="230" y="500" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">每轮只进一侧 → 平均 O(n)，空间 O(1)</text>
</svg>
