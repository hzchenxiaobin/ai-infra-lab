<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 465"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="465" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：后序 DFS + 数位掩码树上背包</text>

  <!-- 开始 -->
  <ellipse cx="150" cy="48" rx="38" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="53" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M150,64 L150,78" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- P1 预处理 -->
  <rect x="48" y="78" width="204" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="99" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">预处理：vals[i] → 数位掩码</text>
  <text x="150" y="117" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">数位重复 ⇒ 无效；建孩子表 + 后序定序</text>

  <path d="M150,132 L150,146" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 循环容器 -->
  <rect x="36" y="146" width="228" height="232" rx="10" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="150" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">对每个节点 u（孩子先于父亲）</text>

  <!-- P2 初始化 -->
  <rect x="48" y="176" width="204" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="196" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp ← {∅:0, mask_u : vals[u]}</text>
  <text x="150" y="214" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">mask_u 无效 ⇒ 只剩空集</text>

  <path d="M150,224 L150,238" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- P3 合并 -->
  <rect x="48" y="238" width="204" height="64" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">逐个子节点 v：dp_u ⊗ dp_v</text>
  <text x="150" y="276" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">只用 dp_u 合并前的快照！</text>
  <text x="150" y="294" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">m1 &amp; m2 = 0 ⇒ dp[m1|m2] ← max</text>

  <path d="M150,302 L150,316" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- P4 记录答案 -->
  <rect x="48" y="316" width="204" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">maxScore[u] = max(dp 值)</text>
  <text x="150" y="354" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">ans 累加（存真实值）</text>

  <path d="M150,364 L150,386" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="48" y="386" width="204" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">return Σ maxScore mod 10⁹+7</text>

  <!-- 右侧坑点面板 -->
  <rect x="300" y="78" width="196" height="300" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">⚠ 四个必须绕开的坑</text>
  <text x="398" y="126" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">① 合并只能用「合并前」的快照</text>
  <text x="398" y="142" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">——新状态掺入会让同一子树</text>
  <text x="398" y="158" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">的节点被重复选用</text>
  <text x="398" y="184" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">② dp 存真实值再取 max</text>
  <text x="398" y="200" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">（≤ 5×10¹¹，long long 够用）</text>
  <text x="398" y="216" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">取模后的数没法比大小</text>
  <text x="398" y="242" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">③ 空集 ∅:0 要保留</text>
  <text x="398" y="258" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">子树可能没有合法节点</text>
  <text x="398" y="284" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">④ m2 = ∅ 的组合是 no-op</text>
  <text x="398" y="300" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">直接跳过，白捡一倍加速</text>
  <text x="398" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">状态上界 2¹⁰ = 1024 种</text>
  <text x="398" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">n ≤ 500：C++ 毫秒级通过</text>
  <text x="398" y="368" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">每棵子树的 dp 只是一张小表</text>
</svg>
