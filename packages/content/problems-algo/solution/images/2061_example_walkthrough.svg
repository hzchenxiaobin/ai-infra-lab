<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">逐步演算：room = [[0,0,0],[1,1,0],[0,0,0]]</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">每步：标记清扫 → 看下一格 → 能走则前进，否则顺时针转 90°</text>

  <!-- Table outer frame -->
  <rect x="40" y="62" width="460" height="246" fill="none" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Column dividers: 步骤|位置|朝向|下一格|动作 -->
  <line x1="86" y1="62" x2="86" y2="308" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="178" y1="62" x2="178" y2="308" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="246" y1="62" x2="246" y2="308" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="354" y1="62" x2="354" y2="308" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Header divider -->
  <line x1="40" y1="92" x2="500" y2="92" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="41" y="63" width="458" height="28" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <text x="63" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <text x="132" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">位置 (i,j)</text>
  <text x="212" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">朝向</text>
  <text x="300" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">下一格判定</text>
  <text x="427" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">动作</text>

  <!-- Row 1: (0,0) right -> move -->
  <rect x="41" y="93" width="458" height="26" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="119" x2="500" y2="119" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="110" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="132" y="110" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">(0,0)</text>
  <text x="212" y="110" text-anchor="middle" font-size="11.5" fill="#333">→ 右</text>
  <text x="300" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a">(0,1)=0 空格</text>
  <text x="427" y="110" text-anchor="middle" font-size="10.5" fill="#4a7a3a">前进，ans=1</text>

  <!-- Row 2: (0,1) right -> move -->
  <rect x="41" y="119" width="458" height="26" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="145" x2="500" y2="145" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="136" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="132" y="136" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">(0,1)</text>
  <text x="212" y="136" text-anchor="middle" font-size="11.5" fill="#333">→ 右</text>
  <text x="300" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a">(0,2)=0 空格</text>
  <text x="427" y="136" text-anchor="middle" font-size="10.5" fill="#4a7a3a">前进，ans=2</text>

  <!-- Row 3: (0,2) right -> boundary -> turn -->
  <rect x="41" y="145" width="458" height="26" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="171" x2="500" y2="171" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="162" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="132" y="162" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">(0,2)</text>
  <text x="212" y="162" text-anchor="middle" font-size="11.5" fill="#333">→ 右</text>
  <text x="300" y="162" text-anchor="middle" font-size="11" fill="#b85450">(0,3) 越界</text>
  <text x="427" y="162" text-anchor="middle" font-size="10.5" fill="#d6a040">转90°→朝下</text>

  <!-- Row 4: (0,2) down -> move -->
  <rect x="41" y="171" width="458" height="26" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="197" x2="500" y2="197" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="188" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="132" y="188" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">(0,2)</text>
  <text x="212" y="188" text-anchor="middle" font-size="11.5" fill="#333">↓ 下</text>
  <text x="300" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a">(1,2)=0 空格</text>
  <text x="427" y="188" text-anchor="middle" font-size="10.5" fill="#4a7a3a">前进，ans=3</text>

  <!-- Row 5: (1,2) down -> move -->
  <rect x="41" y="197" width="458" height="26" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="223" x2="500" y2="223" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="214" text-anchor="middle" font-size="11" fill="#555">5</text>
  <text x="132" y="214" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">(1,2)</text>
  <text x="212" y="214" text-anchor="middle" font-size="11.5" fill="#333">↓ 下</text>
  <text x="300" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a">(2,2)=0 空格</text>
  <text x="427" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a">前进，ans=4</text>

  <!-- Row 6: (2,2) down -> boundary -> turn -->
  <rect x="41" y="223" width="458" height="26" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="249" x2="500" y2="249" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="240" text-anchor="middle" font-size="11" fill="#555">6</text>
  <text x="132" y="240" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">(2,2)</text>
  <text x="212" y="240" text-anchor="middle" font-size="11.5" fill="#333">↓ 下</text>
  <text x="300" y="240" text-anchor="middle" font-size="11" fill="#b85450">(3,2) 越界</text>
  <text x="427" y="240" text-anchor="middle" font-size="10.5" fill="#d6a040">转90°→朝左</text>

  <!-- Row 7: (2,2) left -> move ans=5 ... -->
  <rect x="41" y="249" width="458" height="26" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="275" x2="500" y2="275" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="266" text-anchor="middle" font-size="11" fill="#555">7</text>
  <text x="132" y="266" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">(2,2)</text>
  <text x="212" y="266" text-anchor="middle" font-size="11.5" fill="#333">← 左</text>
  <text x="300" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a">(2,1)=0 空格</text>
  <text x="427" y="266" text-anchor="middle" font-size="10.5" fill="#4a7a3a">前进，ans=5</text>

  <!-- Row 8: continue to (2,1)->(2,0) ans=6,7 then cycle -->
  <rect x="41" y="275" width="458" height="33" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <text x="63" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">…</text>
  <text x="270" y="290" text-anchor="middle" font-size="10.5" fill="#b85450">继续：(2,1)→(2,0)，ans=6,7</text>
  <text x="270" y="304" text-anchor="middle" font-size="10.5" fill="#b85450">之后在 (2,2,朝下) 状态重复 → 停止</text>

  <!-- Result box -->
  <rect x="120" y="324" width="300" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="343" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">答案 = 7（全部空格被清扫）</text>
  <text x="270" y="358" text-anchor="middle" font-size="10.5" fill="#555">机器人最终在环里绕圈，但不再访问新格子</text>
</svg>
