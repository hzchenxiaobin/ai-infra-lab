<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#555"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单球模拟流程：逐行判定 col 去向</text>

  <rect x="120" y="38" width="160" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="57" text-anchor="middle" font-size="11" fill="#446688">开始：球在列 col，r = 0</text>

  <path d="M 200 68 L 200 86" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="110" y="88" width="180" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="109" text-anchor="middle" font-size="11" fill="#444">d = grid[r][col]；next = col + d</text>

  <path d="M 200 122 L 200 142" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <polygon points="200,144 282,180 200,216 118,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="178" text-anchor="middle" font-size="11" fill="#444">next 越界？</text>
  <text x="200" y="194" text-anchor="middle" font-size="10" fill="#888">&lt;0 或 ≥n</text>

  <path d="M 282 180 L 360 180" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="172" font-size="10" fill="#b85450">是</text>
  <rect x="360" y="164" width="140" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="185" text-anchor="middle" font-size="11" fill="#b85450">返回 -1（撞边墙）</text>

  <path d="M 200 216 L 200 236" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="208" y="232" font-size="10" fill="#4a7a3a">否</text>

  <polygon points="200,238 290,274 200,310 110,274" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="272" text-anchor="middle" font-size="11" fill="#444">grid[r][next] ≠ d？</text>
  <text x="200" y="288" text-anchor="middle" font-size="10" fill="#888">异向成V</text>

  <path d="M 290 274 L 360 274" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="308" y="266" font-size="10" fill="#b85450">是</text>
  <rect x="360" y="258" width="140" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="279" text-anchor="middle" font-size="11" fill="#b85450">返回 -1（V形卡住）</text>

  <path d="M 200 310 L 200 330" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="208" y="326" font-size="10" fill="#4a7a3a">否</text>

  <rect x="110" y="332" width="180" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="353" text-anchor="middle" font-size="11" fill="#4a7a3a">col ← next；r ← r + 1</text>

  <path d="M 200 366 L 200 386" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <polygon points="200,388 275,418 200,448 125,418" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="416" text-anchor="middle" font-size="11" fill="#444">r == m？</text>
  <text x="200" y="432" text-anchor="middle" font-size="10" fill="#888">走完所有行</text>

  <path d="M 275 418 L 360 418" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="296" y="410" font-size="10" fill="#4a7a3a">是</text>
  <rect x="360" y="402" width="140" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="423" text-anchor="middle" font-size="11" fill="#4a7a3a">返回 col（底部掉出）</text>

  <path d="M 125 418 L 56 418 L 56 105 L 110 105" stroke="#555" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="40" y="260" font-size="10" fill="#888" transform="rotate(-90 40 260)">否：继续下一行</text>
</svg>
