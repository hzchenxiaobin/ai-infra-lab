<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">平方数组：相邻元素之和 = 完全平方数</text>

  <!-- Valid example: [1, 8, 17] -->
  <text x="44" y="74" font-size="13" fill="#4a7a3a" filter="url(#rough2)">有效排列 [1, 8, 17]</text>

  <rect x="62" y="88" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="92" y="116" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <rect x="192" y="88" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="222" y="116" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">8</text>

  <rect x="322" y="88" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="352" y="116" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">17</text>

  <path d="M126,110 L188,110" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="157" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">9 = 3²</text>

  <path d="M256,110 L318,110" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="287" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">25 = 5²</text>

  <!-- Invalid example: [1, 17, 8] -->
  <text x="44" y="178" font-size="13" fill="#b85450" filter="url(#rough2)">无效排列 [1, 17, 8]</text>

  <rect x="62" y="192" width="60" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="92" y="220" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <rect x="192" y="192" width="60" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="222" y="220" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">17</text>

  <rect x="322" y="192" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="352" y="220" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">8</text>

  <path d="M126,214 L188,214" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="157" y="206" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">18 (非平方)</text>

  <path d="M256,214 L318,214" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="287" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">25 = 5²</text>

  <!-- Two pruning conditions box -->
  <rect x="50" y="276" width="460" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="13" fill="#7a5a20" filter="url(#rough2)">回溯两道剪枝关卡</text>
  <text x="72" y="322" font-size="12" fill="#555" filter="url(#rough2)">① 去重剪枝：同层同值只选首个（nums[i]==nums[i-1] 且 !used[i-1]）</text>
  <text x="72" y="344" font-size="12" fill="#555" filter="url(#rough2)">② 合法剪枝：相邻和须为完全平方数 isSquare(path.back() + nums[i])</text>
</svg>
