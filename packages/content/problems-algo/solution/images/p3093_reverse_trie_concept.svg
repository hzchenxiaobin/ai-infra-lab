<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：反转字符串——后缀匹配变前缀匹配</text>

  <!-- part 1: reverse -->
  <text x="56" y="52" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 全部反转：后缀匹配 ⇒ 前缀匹配（查询串同样反转）</text>

  <rect x="56" y="60" width="58" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="78" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">abcd</text>
  <path d="M 120 73 L 138 73" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="142" y="60" width="58" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="171" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">dcba</text>

  <rect x="232" y="60" width="44" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="254" y="78" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">bcd</text>
  <path d="M 282 73 L 300 73" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="304" y="60" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="326" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">dcb</text>

  <rect x="378" y="60" width="58" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="407" y="78" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">xbcd</text>
  <path d="M 442 73 L 458 73" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="462" y="60" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="488" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">dcbx</text>

  <!-- part 2: trie -->
  <text x="56" y="116" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 对反转串建前缀 Trie，每个节点缓存 best（最短单词下标）</text>

  <!-- edges -->
  <path d="M 124 200 L 175 200" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 209 200 L 263 200" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 297 200 L 351 200" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 382 189 C 410 172 425 164 441 156" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 382 211 C 410 228 425 236 441 244" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- nodes -->
  <circle cx="104" cy="200" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="104" y="204" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">root</text>
  <circle cx="192" cy="200" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="192" y="205" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">d</text>
  <circle cx="280" cy="200" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="205" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <circle cx="368" cy="200" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="368" y="205" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <circle cx="456" cy="150" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="155" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <circle cx="456" cy="250" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="255" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>

  <!-- best labels -->
  <rect x="76" y="232" width="56" height="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="104" y="245" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">best=1</text>
  <rect x="164" y="232" width="56" height="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="192" y="245" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">best=1</text>
  <rect x="252" y="232" width="56" height="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="280" y="245" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">best=1</text>
  <rect x="340" y="232" width="56" height="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="368" y="245" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">best=1</text>
  <rect x="428" y="176" width="56" height="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="456" y="189" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">best=0</text>
  <rect x="428" y="276" width="56" height="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="456" y="289" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">best=2</text>

  <text x="104" y="264" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(全局最短)</text>
  <text x="456" y="130" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">仅"abcd"路过</text>
  <text x="456" y="312" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">仅"xbcd"路过</text>
  <text x="310" y="274" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">插入"bcd"（更短）⇒ d、c、b 的 best: 0 → 1</text>

  <!-- query highlight -->
  <path d="M 126 192 L 172 192" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 210 192 L 258 192" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <ellipse cx="280" cy="200" rx="25" ry="24" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="56" y="152" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">查询"cd" ⇒ "dc"</text>
  <path d="M 158 156 C 175 162 184 170 189 180" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- bottom insight -->
  <rect x="44" y="336" width="432" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="357" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">节点 best = 路过该节点的最短单词下标；按下标升序插入、</text>
  <text x="260" y="376" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">仅严格更短才更新 ⇒ 平局自动取更早下标；根节点兜底空后缀</text>
</svg>
