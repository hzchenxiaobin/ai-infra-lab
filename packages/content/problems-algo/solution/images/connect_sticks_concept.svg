<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：每次合并最短两根 = 哈夫曼编码</text>

  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">合并成本 = 新棒长度，会被后续反复累加 → 短棒应早合并、深埋底层</text>

  <text x="60" y="86" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">初始 4 根：[1, 8, 3, 5]</text>

  <rect x="60" y="94" width="64" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="92" y="119" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="132" y="94" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="119" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>

  <rect x="204" y="94" width="64" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="236" y="119" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="276" y="94" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="119" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="58" y="88" width="212" height="52" rx="6" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="164" y="82" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">取最短两根：1 + 3</text>

  <path d="M 164 140 Q 164 158 164 176" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="200" y="162" font-size="10" fill="#b85450" filter="url(#rough2)">成本 = 4</text>

  <text x="60" y="186" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 1 次合并后：[4, 8, 5]</text>

  <rect x="60" y="194" width="76" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="98" y="219" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="148" y="194" width="76" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="219" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>

  <rect x="236" y="194" width="76" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="274" y="219" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="58" y="188" width="100" height="52" rx="6" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="108" y="182" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">4 + 5</text>

  <path d="M 108 240 Q 108 256 108 272" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="146" y="260" font-size="10" fill="#b85450" filter="url(#rough2)">成本 = 9</text>

  <text x="60" y="282" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 2 次合并后：[9, 8]</text>

  <rect x="60" y="290" width="76" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="98" y="315" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>

  <rect x="148" y="290" width="76" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="315" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>

  <path d="M 142 332 Q 142 346 142 360" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="180" y="350" font-size="10" fill="#b85450" filter="url(#rough2)">成本 = 17</text>

  <rect x="60" y="358" width="180" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="386" text-anchor="middle" font-size="16" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">17  ✓ 剩 1 根</text>

  <rect x="300" y="94" width="244" height="308" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="422" y="118" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">为什么「最短两根」最优？</text>

  <text x="316" y="146" font-size="11" fill="#4a7a3a" filter="url(#rough2)">总成本 = 每根棒 × 被累加次数</text>
  <text x="316" y="166" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= ∑ length × 深度（哈夫曼树）</text>

  <text x="316" y="196" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 反例：先合并大的</text>
  <text x="316" y="216" font-size="10.5" fill="#b85450" filter="url(#rough2)">若先 8+5=13，得 [1,3,13]</text>
  <text x="316" y="234" font-size="10.5" fill="#b85450" filter="url(#rough2)">再 1+3=4，得 [13,4]</text>
  <text x="316" y="252" font-size="10.5" fill="#b85450" filter="url(#rough2)">再 13+4=17，总 13+4+17=34</text>
  <text x="316" y="270" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">34 &gt; 30 ✗ 更差！</text>

  <text x="316" y="300" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 交换论证：</text>
  <text x="316" y="318" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">长棒早合并 → 深度大 → 被多累加</text>
  <text x="316" y="336" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">把长棒和短棒位置对换</text>
  <text x="316" y="354" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">总成本只会变小或不变</text>

  <rect x="312" y="368" width="220" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="422" y="386" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">总成本 4+9+17 = 30 ✓ 最优</text>
</svg>
