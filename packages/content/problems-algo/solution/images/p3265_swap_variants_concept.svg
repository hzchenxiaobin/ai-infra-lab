<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：一次交换是自逆的 —— 换过去 ⇔ 换回来</text>
  <text x="260" y="37" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">补前导 0 对齐位数后，双向判定塌缩成单向</text>

  <!-- 行 A：30 swap → 03 = 3 -->
  <rect x="56" y="54" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="94" y="54" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="73" y="76" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="111" y="76" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <path d="M 138 71 L 180 71" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="159" y="63" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">swap</text>
  <rect x="188" y="54" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="226" y="54" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="205" y="76" text-anchor="middle" font-size="13" fill="#a07830" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="243" y="76" text-anchor="middle" font-size="13" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="276" y="76" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 3</text>
  <text x="56" y="106" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">「03」有前导 0 —— 数值上就是 3，照样算变体！</text>
  <rect x="312" y="48" width="178" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="401" y="68" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">3 只有一位，换不动；</text>
  <text x="401" y="84" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">30 却能一步变成 3 ——</text>
  <text x="401" y="100" text-anchor="middle" font-size="10" fill="#8a3833" font-weight="bold" filter="url(#rough2)">看起来必须双向查？往下看 ↓</text>

  <!-- 行 B：等长对齐 -->
  <text x="56" y="126" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">补前导 0 到等长（7 位）：</text>
  <rect x="56" y="132" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="80" y="132" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="132" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="128" y="132" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="152" y="132" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="132" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="132" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="149" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="92" y="149" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="116" y="149" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="140" y="149" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="164" y="149" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="188" y="149" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="212" y="149" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <path d="M 236 144 C 260 144, 260 176, 236 176" fill="none" stroke="#d6a040" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="166" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">swap</text>
  <text x="266" y="163" font-size="10" fill="#a07830" filter="url(#rough2)">同两位交换 = 自逆</text>
  <rect x="56" y="168" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="80" y="168" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="168" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="128" y="168" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="152" y="168" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="168" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="168" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="185" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="92" y="185" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="116" y="185" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="140" y="185" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="164" y="185" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="188" y="185" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="212" y="185" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="340" y="140" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">等长之后完全对称：</text>
  <text x="340" y="157" font-size="10" fill="#33506b" filter="url(#rough2)">0000030 → 0000003 一步</text>
  <text x="340" y="174" font-size="10" fill="#33506b" filter="url(#rough2)">0000003 → 0000030 同样一步</text>

  <!-- 洞察框 -->
  <rect x="36" y="200" width="448" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">「x 变 y」或「y 变 x」⇔ 单向判定：y ∈ S(x)</text>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">S(x) = { x } ∪ { x 的一次交换变体 }，统一补零到 7 位</text>

  <!-- 公式框 -->
  <rect x="36" y="262" width="448" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">一次遍历哈希计数（先查后插，两数之和同款模板）</text>
  <text x="260" y="304" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">for x in nums:  ans += Σ seen[v]（v ∈ S(x)）;  seen[x] += 1</text>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">时间 O(n·d²)：d = 7，n = 100 → 约 2200 次查插</text>
</svg>
