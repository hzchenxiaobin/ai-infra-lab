<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：copy = original + d，一切约束都落到 d 的区间交集上</text>

  <!-- 上半：original 平移到 copy -->
  <text x="60" y="46" font-size="11" fill="#446688" font-weight="bold">original</text>
  <rect x="50" y="52" width="45" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="71" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="95" y="52" width="45" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="71" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="140" y="52" width="45" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="162" y="71" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="185" y="52" width="45" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="71" text-anchor="middle" font-size="12" fill="#333">4</text>

  <path d="M 235 67 L 290 67" stroke="#d6a040" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="58" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">+ d</text>

  <rect x="300" y="52" width="45" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="71" text-anchor="middle" font-size="11" fill="#333">1+d</text>
  <rect x="345" y="52" width="45" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="367" y="71" text-anchor="middle" font-size="11" fill="#333">2+d</text>
  <rect x="390" y="52" width="45" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="71" text-anchor="middle" font-size="11" fill="#333">3+d</text>
  <rect x="435" y="52" width="45" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="457" y="71" text-anchor="middle" font-size="11" fill="#333">4+d</text>

  <text x="260" y="104" text-anchor="middle" font-size="10.5" fill="#555">相邻差分全部相同 ⇒ 一个平移量 d 唯一确定整个 copy 数组</text>

  <!-- 下半：d 的约束区间逐个相交（以示例 2 为例） -->
  <text x="60" y="132" font-size="11" fill="#555" font-weight="bold">每个下标 i 给出 d 的一个约束区间 [uᵢ−oᵢ, vᵢ−oᵢ]，全部取交集：</text>

  <!-- 数轴：d = 0..9，单位 40px，x0 = 80 -->
  <path d="M 70 168 L 452 168" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="172" font-size="10" fill="#888">d</text>
  <line x1="80" y1="164" x2="80" y2="172" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="182" text-anchor="middle" font-size="9.5" fill="#666">0</text>
  <line x1="160" y1="164" x2="160" y2="172" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="182" text-anchor="middle" font-size="9.5" fill="#666">2</text>
  <line x1="240" y1="164" x2="240" y2="172" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="182" text-anchor="middle" font-size="9.5" fill="#666">4</text>
  <line x1="320" y1="164" x2="320" y2="172" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="182" text-anchor="middle" font-size="9.5" fill="#666">6</text>
  <line x1="400" y1="164" x2="400" y2="172" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="400" y="182" text-anchor="middle" font-size="9.5" fill="#666">8</text>
  <line x1="440" y1="164" x2="440" y2="172" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="440" y="182" text-anchor="middle" font-size="9.5" fill="#666">9</text>

  <!-- 四个约束区间条 -->
  <text x="42" y="204" font-size="9.5" fill="#666">i=0</text>
  <rect x="80" y="192" width="360" height="16" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="466" y="204" font-size="9.5" fill="#666">[0,9]</text>

  <text x="42" y="228" font-size="9.5" fill="#666">i=1</text>
  <rect x="80" y="216" width="280" height="16" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="386" y="228" font-size="9.5" fill="#666">[0,7]</text>

  <text x="42" y="252" font-size="9.5" fill="#666">i=2</text>
  <rect x="80" y="240" width="200" height="16" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="306" y="252" font-size="9.5" fill="#666">[0,5]</text>

  <text x="42" y="276" font-size="9.5" fill="#666">i=3</text>
  <rect x="80" y="264" width="120" height="16" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="226" y="276" font-size="9.5" fill="#666">[0,3]</text>

  <!-- 交集高亮 -->
  <rect x="74" y="188" width="132" height="96" rx="8" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <text x="140" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">交集 [0,3]</text>

  <rect x="240" y="308" width="240" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="323" text-anchor="middle" font-size="11" fill="#333">答案 = 交集大小</text>
  <text x="360" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">= 3 − 0 + 1 = 4</text>
</svg>
