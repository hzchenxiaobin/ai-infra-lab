<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="260" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：3×3 全 1 块 → 标记分量 → 判边界 → 上色</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">起点 (1,1)，orig=1，color=2；仅中心内部格保留 1，外圈 8 格涂 2</text>

  <g filter="url(#rough2)" font-size="14" font-weight="bold">
    <!-- ============ Grid A: original ============ -->
    <text x="85" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 原始</text>
    <!-- all 1, blue; center (1,1) red stroke = start -->
    <rect x="40" y="70" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="55" y="90" text-anchor="middle" fill="#446688">1</text>
    <rect x="70" y="70" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="85" y="90" text-anchor="middle" fill="#446688">1</text>
    <rect x="100" y="70" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="115" y="90" text-anchor="middle" fill="#446688">1</text>

    <rect x="40" y="100" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="55" y="120" text-anchor="middle" fill="#446688">1</text>
    <rect x="70" y="100" width="30" height="30" fill="#e8f0fe" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <text x="85" y="120" text-anchor="middle" fill="#b85450">1</text>
    <rect x="100" y="100" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="115" y="120" text-anchor="middle" fill="#446688">1</text>

    <rect x="40" y="130" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="55" y="150" text-anchor="middle" fill="#446688">1</text>
    <rect x="70" y="130" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="85" y="150" text-anchor="middle" fill="#446688">1</text>
    <rect x="100" y="130" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="115" y="150" text-anchor="middle" fill="#446688">1</text>

    <!-- arrow A -> B -->
    <path d="M 134 115 L 231 115" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="182" y="108" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">DFS 取负</text>

    <!-- ============ Grid B: marked + classify ============ -->
    <text x="280" y="62" text-anchor="middle" font-size="12" fill="#a06820" font-weight="bold">② 标记 + 判边界</text>
    <!-- perimeter orange (border), center green (interior), all text -1 -->
    <rect x="235" y="70" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="250" y="90" text-anchor="middle" fill="#a06820" font-size="12">-1</text>
    <rect x="265" y="70" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="280" y="90" text-anchor="middle" fill="#a06820" font-size="12">-1</text>
    <rect x="295" y="70" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="310" y="90" text-anchor="middle" fill="#a06820" font-size="12">-1</text>

    <rect x="235" y="100" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="250" y="120" text-anchor="middle" fill="#a06820" font-size="12">-1</text>
    <rect x="265" y="100" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="4"/>
    <text x="280" y="120" text-anchor="middle" fill="#4a7a3a" font-size="12">-1</text>
    <rect x="295" y="100" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="310" y="120" text-anchor="middle" fill="#a06820" font-size="12">-1</text>

    <rect x="235" y="130" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="250" y="150" text-anchor="middle" fill="#a06820" font-size="12">-1</text>
    <rect x="265" y="130" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="280" y="150" text-anchor="middle" fill="#a06820" font-size="12">-1</text>
    <rect x="295" y="130" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="310" y="150" text-anchor="middle" fill="#a06820" font-size="12">-1</text>

    <!-- arrow B -> C -->
    <path d="M 329 115 L 427 115" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="378" y="108" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">涂 2 / 恢复 1</text>

    <!-- ============ Grid C: result ============ -->
    <text x="475" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 上色 + 恢复</text>
    <!-- perimeter = 2 (orange), center = 1 (green) -->
    <rect x="430" y="70" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="445" y="90" text-anchor="middle" fill="#a06820">2</text>
    <rect x="460" y="70" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="475" y="90" text-anchor="middle" fill="#a06820">2</text>
    <rect x="490" y="70" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="505" y="90" text-anchor="middle" fill="#a06820">2</text>

    <rect x="430" y="100" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="445" y="120" text-anchor="middle" fill="#a06820">2</text>
    <rect x="460" y="100" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="4"/>
    <text x="475" y="120" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="490" y="100" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="505" y="120" text-anchor="middle" fill="#a06820">2</text>

    <rect x="430" y="130" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="445" y="150" text-anchor="middle" fill="#a06820">2</text>
    <rect x="460" y="130" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="475" y="150" text-anchor="middle" fill="#a06820">2</text>
    <rect x="490" y="130" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="505" y="150" text-anchor="middle" fill="#a06820">2</text>
  </g>

  <!-- per-grid annotations -->
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="85" y="178" text-anchor="middle" font-weight="bold" fill="#446688">全 1，9 格连通</text>
    <text x="85" y="192" text-anchor="middle">红框 = 起点 (1,1)</text>

    <text x="280" y="178" text-anchor="middle" font-weight="bold" fill="#a06820">9 格全 -1</text>
    <text x="280" y="192" text-anchor="middle">中心四邻均 -1 → 内部</text>
    <text x="280" y="206" text-anchor="middle">外圈 cnt&lt;4 → 边界</text>

    <text x="475" y="178" text-anchor="middle" font-weight="bold" fill="#4a7a3a">外圈 8 格涂 2</text>
    <text x="475" y="192" text-anchor="middle">中心恢复 1</text>
    <text x="475" y="206" text-anchor="middle" fill="#b85450" font-weight="bold">= 答案 ✓</text>
  </g>

  <text x="280" y="238" text-anchor="middle" font-size="10" fill="#aaa">橙=边界格(涂 color)｜绿=内部格(保留原色)｜蓝=异色/原态｜红框=起点</text>
</svg>
