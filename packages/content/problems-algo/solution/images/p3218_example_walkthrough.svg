<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 1 演算：m=3, n=2，h=[1,3]→降序[3,1]，v=[5]</text>

  <!-- 归并表头 -->
  <rect x="24" y="38" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="50" y="38" width="78" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="128" y="38" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="224" y="38" width="108" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="332" y="38" width="108" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="440" y="38" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="37" y="53" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">步</text>
  <text x="89" y="53" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">比较</text>
  <text x="176" y="53" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">选谁</text>
  <text x="278" y="53" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">乘数（对侧+1）</text>
  <text x="386" y="53" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">本步开销</text>
  <text x="468" y="53" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">累计</text>

  <!-- 行 1 -->
  <rect x="24" y="60" width="472" height="30" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="37" y="79" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="89" y="79" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 vs 5</text>
  <text x="176" y="79" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">竖切 v=5</text>
  <text x="278" y="79" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0+1=1（水平未切）</text>
  <text x="386" y="79" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5 × 1 = 5</text>
  <text x="468" y="79" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <!-- 行 2 -->
  <rect x="24" y="90" width="472" height="30" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="37" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="89" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v 用尽</text>
  <text x="176" y="109" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">横切 h=3</text>
  <text x="278" y="109" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1+1=2（断成 2 段）</text>
  <text x="386" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 × 2 = 6</text>
  <text x="468" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>

  <!-- 行 3 -->
  <rect x="24" y="120" width="472" height="30" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="37" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="89" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v 用尽</text>
  <text x="176" y="139" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">横切 h=1</text>
  <text x="278" y="139" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1+1=2（断成 2 段）</text>
  <text x="386" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 × 2 = 2</text>
  <text x="468" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">13</text>

  <!-- 蛋糕块演变 -->
  <text x="260" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">蛋糕块的演变：</text>

  <!-- 图 A：初始 3x2 -->
  <rect x="61" y="180" width="40" height="60" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="81" y1="180" x2="81" y2="240" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="61" y1="200" x2="101" y2="200" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="61" y1="220" x2="101" y2="220" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="81" y="256" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">初始 3×2 整块</text>

  <!-- 图 B：竖切后 -->
  <rect x="179" y="180" width="40" height="60" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="199" y1="180" x2="199" y2="240" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="179" y1="200" x2="219" y2="200" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="179" y1="220" x2="219" y2="220" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="199" y="256" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">竖切 5×1：2 个竖条</text>

  <!-- 图 C：横切 h=3 后 -->
  <rect x="297" y="180" width="40" height="60" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="317" y1="180" x2="317" y2="240" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="297" y1="220" x2="337" y2="220" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="317" y="256" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">横切 3×2：4 块</text>

  <!-- 图 D：全部 1x1 -->
  <rect x="415" y="180" width="18" height="18" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="436" y="180" width="18" height="18" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="415" y="201" width="18" height="18" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="436" y="201" width="18" height="18" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="415" y="222" width="18" height="18" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="436" y="222" width="18" height="18" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="435" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">横切 1×2：6 个 1×1 ✓</text>

  <!-- 底部对照 -->
  <rect x="40" y="272" width="456" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">对照官方 5 步操作：5 + 1 + 1 + 3 + 3 = 13 ✓</text>
  <text x="268" y="318" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">两刀 h₁=3（各竖条一刀）与两刀 h₀=1（各竖条一刀）</text>
  <text x="268" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">正是「每条水平线在每个竖条里各切一刀」的现场演示</text>
</svg>
