<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">「两极分化」= 高、低分同时出现，且极端占多数</text>

  <!-- zone captions -->
  <text x="122" y="72" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">低分区 ≤ 2</text>
  <text x="218" y="72" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">中立 = 3</text>
  <text x="314" y="72" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">高分区 ≥ 4</text>

  <!-- rating cells 1..5 -->
  <rect x="60" y="84" width="60" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="84" width="60" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="188" y="84" width="60" height="58" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="252" y="84" width="60" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="84" width="60" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>

  <text x="90" y="134" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="154" y="134" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <text x="218" y="134" text-anchor="middle" font-size="16" fill="#777" filter="url(#rough2)">3</text>
  <text x="282" y="134" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <text x="346" y="134" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>

  <!-- book1 ratings as dots: 5,1,4,2,5 -->
  <circle cx="90" cy="102" r="5" fill="#d6a040" stroke="#8a6a20" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="154" cy="102" r="5" fill="#d6a040" stroke="#8a6a20" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="282" cy="102" r="5" fill="#d6a040" stroke="#8a6a20" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="338" cy="99" r="5" fill="#d6a040" stroke="#8a6a20" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="352" cy="108" r="5" fill="#d6a040" stroke="#8a6a20" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="392" y="105" font-size="11" fill="#8a6a20" filter="url(#rough2)">● 书1 的</text>
  <text x="392" y="120" font-size="11" fill="#8a6a20" filter="url(#rough2)">5 次评分</text>

  <!-- spread double arrow -->
  <path d="M 92 168 L 344 168" stroke="#b85450" stroke-width="1.8" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="218" y="190" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">rating_spread = max − min = 5 − 1 = 4</text>

  <!-- neutral note -->
  <rect x="398" y="150" width="112" height="58" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="454" y="172" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">只有 3 分是中立派</text>
  <text x="454" y="190" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">不算极端评分</text>
  <path d="M 396 176 L 254 150" stroke="#999999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="40" y="224" width="440" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="14" fill="#2a4a20" filter="url(#rough2)">极化得分 = 极端评分次数 ÷ 总评分次数</text>
  <text x="260" y="278" text-anchor="middle" font-size="13" fill="#2a4a20" filter="url(#rough2)">书1：极端 5 次 ÷ 总 5 次 = 1.00</text>
  <text x="260" y="304" text-anchor="middle" font-size="13" fill="#2a4a20" filter="url(#rough2)">1.00 ≥ 0.6 ✓ 保留（3÷5 = 0.60 也恰好压线通过）</text>
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">别忘了：总次数 ≥ 5，且 max ≥ 4 与 min ≤ 2 同时成立</text>
</svg>
