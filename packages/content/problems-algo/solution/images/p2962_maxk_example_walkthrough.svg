<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,3,2,3,3]，k = 2（M = 3）</text>

  <!-- highlight rows (draw first) -->
  <rect x="20" y="188" width="480" height="36" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="20" y="224" width="480" height="36" fill="#fff8e1" filter="url(#rough2)"/>

  <!-- header -->
  <rect x="20" y="44" width="480" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="58" y="66" text-anchor="middle" font-size="11.5" fill="#335" font-weight="bold">right</text>
  <text x="136" y="66" text-anchor="middle" font-size="11.5" fill="#335" font-weight="bold">nums[right]</text>
  <text x="234" y="66" text-anchor="middle" font-size="11.5" fill="#335" font-weight="bold">cnt 入窗→收缩</text>
  <text x="344" y="66" text-anchor="middle" font-size="11.5" fill="#335" font-weight="bold">left（收缩后）</text>
  <text x="424" y="66" text-anchor="middle" font-size="11.5" fill="#335" font-weight="bold">ans += left</text>
  <text x="476" y="66" text-anchor="middle" font-size="11.5" fill="#335" font-weight="bold">ans</text>

  <!-- grid lines -->
  <path d="M 96 44 L 96 260 M 176 44 L 176 260 M 292 44 L 292 260 M 396 44 L 396 260 M 452 44 L 452 260" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 80 80 L 500 80 M 80 116 L 500 116 M 80 152 L 500 152 M 80 188 L 500 188 M 80 224 L 500 224" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="20" y="44" width="480" height="216" fill="none" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>

  <!-- rows -->
  <text x="58" y="103" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="136" y="103" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="234" y="103" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="344" y="103" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="424" y="103" text-anchor="middle" font-size="11.5" fill="#333">+0</text>
  <text x="476" y="103" text-anchor="middle" font-size="11.5" fill="#333">0</text>

  <text x="58" y="139" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="136" y="139" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="234" y="139" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="344" y="139" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="424" y="139" text-anchor="middle" font-size="11.5" fill="#333">+0</text>
  <text x="476" y="139" text-anchor="middle" font-size="11.5" fill="#333">0</text>

  <text x="58" y="175" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="136" y="175" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="234" y="175" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="344" y="175" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="424" y="175" text-anchor="middle" font-size="11.5" fill="#333">+0</text>
  <text x="476" y="175" text-anchor="middle" font-size="11.5" fill="#333">0</text>

  <text x="58" y="211" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <text x="136" y="211" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <text x="234" y="211" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">2 → 1</text>
  <text x="344" y="211" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <text x="424" y="211" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">+2</text>
  <text x="476" y="211" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>

  <text x="58" y="247" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <text x="136" y="247" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <text x="234" y="247" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">2 → 1</text>
  <text x="344" y="247" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <text x="424" y="247" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">+4</text>
  <text x="476" y="247" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">6</text>

  <!-- annotations -->
  <text x="36" y="292" font-size="11" fill="#555" font-weight="bold">right=3：</text>
  <text x="102" y="292" font-size="11" fill="#555">弹出 1（cnt 仍 2）→ 弹出 3（cnt=1），left 0→2</text>
  <text x="102" y="310" font-size="11" fill="#4a7a3a">合法起点 l∈{0,1}：[1,3,2,3]、[3,2,3]</text>

  <text x="36" y="340" font-size="11" fill="#555" font-weight="bold">right=4：</text>
  <text x="102" y="340" font-size="11" fill="#555">弹出 2（cnt 仍 2）→ 弹出 3（cnt=1），left 2→4</text>
  <text x="102" y="358" font-size="11" fill="#4a7a3a">合法起点 l∈{0,1,2,3}：[1,3,2,3,3]、[3,2,3,3]、[2,3,3]、[3,3]</text>

  <!-- final note -->
  <rect x="140" y="386" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="411" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">最终 ans = 2 + 4 = 6 ✓</text>
</svg>
