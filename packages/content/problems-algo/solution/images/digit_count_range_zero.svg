<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">d = 0 的特殊性：前导零不计入（最高位为 0 不是真正的 0）</text>

  <!-- Left example: 107, interior 0 counted -->
  <text x="146" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">数字 107：内部的 0 计入 ✓</text>
  <rect x="78" y="68" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="93" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">1</text>
  <rect x="124" y="68" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="93" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="170" y="68" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="93" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">7</text>
  <text x="146" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">0 左侧 high=1 ≥ 1 → 真实数字</text>

  <!-- Right example: 017 = 17, leading 0 not counted -->
  <text x="426" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">数字 17（若写作 017）：前导 0 不计 ✗</text>
  <rect x="358" y="68" width="44" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="380" y="93" text-anchor="middle" font-size="17" fill="#bbb" font-weight="bold">0</text>
  <rect x="404" y="68" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="426" y="93" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">1</text>
  <rect x="450" y="68" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="93" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">7</text>
  <text x="426" y="124" text-anchor="middle" font-size="10" fill="#b85450">0 左侧 high=0 → 最高位前导零</text>

  <!-- Rule -->
  <rect x="40" y="142" width="540" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="164" font-size="12" fill="#333" font-weight="bold">规则：某位为 0 是否计入，取决于左侧高位 high 是否 ≥ 1</text>
  <text x="60" y="182" font-size="11" fill="#555">• high = 0：该位是最高位，0 即前导零，跳过（贡献 0）</text>
  <text x="60" y="196" font-size="11" fill="#555">• high ≥ 1：该位 0 是真实数字，计入；高位 free 取值 1..high（排除 0），故用 (high−1) 而非 high</text>

  <!-- d=0 formula three sub-cases -->
  <text x="40" y="224" font-size="12" fill="#b85450" font-weight="bold">d = 0 的按位公式（三情况）</text>
  <rect x="40" y="238" width="170" height="74" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="260" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">high = 0</text>
  <text x="125" y="282" text-anchor="middle" font-size="13" fill="#888">0（跳过）</text>
  <text x="125" y="300" text-anchor="middle" font-size="9" fill="#aaa">最高位前导零</text>

  <rect x="225" y="238" width="170" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="260" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">high≥1, cur=0</text>
  <text x="310" y="282" text-anchor="middle" font-size="11" fill="#333">(high−1)×factor</text>
  <text x="310" y="298" text-anchor="middle" font-size="11" fill="#333">+ low + 1</text>

  <rect x="410" y="238" width="170" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="495" y="260" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">high≥1, cur&gt;0</text>
  <text x="495" y="282" text-anchor="middle" font-size="13" fill="#333">high × factor</text>
  <text x="495" y="300" text-anchor="middle" font-size="9" fill="#888">cur&gt;d=0 恒成立</text>

  <!-- comparison with d!=0 -->
  <rect x="40" y="326" width="540" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="348" font-size="12" fill="#446688" font-weight="bold">对比 d ≠ 0：仅差「扣除 high_part = 0 那一组前导零」</text>
  <text x="60" y="370" font-size="11" fill="#333">d ≠ 0, cur &gt; d：(high + 1) × factor　→　d = 0, cur &gt; 0：high × factor　（少一个 factor）</text>
  <text x="60" y="390" font-size="11" fill="#333">d ≠ 0, cur = d：high × factor + low + 1　→　d = 0, cur = 0：(high−1) × factor + low + 1</text>
  <text x="60" y="410" font-size="11" fill="#555">本质：d = 0 时高位不能取 0（否则该 0 变前导零），故 free 高位范围 1..high 而非 0..high</text>
</svg>
