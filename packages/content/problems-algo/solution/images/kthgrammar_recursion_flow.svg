<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">递归分治流程：只追踪 k 所在的半段</text>

  <!-- Start node -->
  <rect x="200" y="44" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">调用 kthGrammar(n, k)</text>

  <!-- arrow down to decision 1 -->
  <path d="M 270 80 L 270 100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: n == 1 ? -->
  <polygon points="270,100 360,140 270,180 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="138" text-anchor="middle" font-size="12" fill="#333">n == 1 ?</text>
  <text x="270" y="154" text-anchor="middle" font-size="11" fill="#666">(基准)</text>

  <!-- Yes branch: return 0 -->
  <path d="M 180 140 L 110 140" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="132" font-size="11" fill="#4a7a3a">是</text>
  <rect x="36" y="124" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="71" y="145" text-anchor="middle" font-size="12" fill="#333">return 0</text>

  <!-- No branch: down -->
  <path d="M 270 180 L 270 200" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="194" font-size="11" fill="#446688">否</text>

  <!-- compute mid -->
  <rect x="180" y="202" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="223" text-anchor="middle" font-size="12" fill="#333">mid = 2^(n−2)（行中点）</text>

  <!-- arrow down to decision 2 -->
  <path d="M 270 236 L 270 256" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: k <= mid ? -->
  <polygon points="270,256 360,296 270,336 180,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="12" fill="#333">k ≤ mid ?</text>
  <text x="270" y="310" text-anchor="middle" font-size="11" fill="#666">(落前半?)</text>

  <!-- Yes branch: recurse same -->
  <path d="M 180 296 L 110 296" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="288" font-size="11" fill="#446688">是</text>
  <rect x="20" y="278" width="92" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="66" y="295" text-anchor="middle" font-size="10" fill="#333">return</text>
  <text x="66" y="309" text-anchor="middle" font-size="10" fill="#333">kthGrammar(n−1, k)</text>
  <text x="66" y="332" text-anchor="middle" font-size="9" fill="#446688">前半=父行原样</text>

  <!-- No branch: recurse flip -->
  <path d="M 360 296 L 430 296" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="288" font-size="11" fill="#b85450">否</text>
  <rect x="430" y="278" width="96" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="478" y="295" text-anchor="middle" font-size="10" fill="#333">return 1 ^</text>
  <text x="478" y="309" text-anchor="middle" font-size="10" fill="#333">kthGrammar(n−1, k−mid)</text>
  <text x="478" y="332" text-anchor="middle" font-size="9" fill="#b85450">后半=父行取反</text>

  <!-- bottom insight -->
  <rect x="40" y="346" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="365" text-anchor="middle" font-size="11" fill="#4a7a3a">每层只递归一次（非二路分叉），深度 ≤ n，总调用 O(n)</text>
</svg>
