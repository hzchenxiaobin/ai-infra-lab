<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按下标 mod k 把数组切成 k 条独立子序列</text>

  <!-- input note -->
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">arr = [4,1,5,2,6,2] ， k = 3</text>

  <!-- Arcs above boxes: same-group links (i-k <= i) -->
  <!-- r=2 (orange): idx 2 -> 5, peak highest -->
  <path d="M 249 92 Q 342 34 435 92" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="342" y="38" text-anchor="middle" font-size="10" fill="#a87020">r=2: i−k ≤ i</text>
  <!-- r=1 (green): idx 1 -> 4 -->
  <path d="M 187 92 Q 280 50 373 92" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="54" text-anchor="middle" font-size="10" fill="#3a5a2a">r=1</text>
  <!-- r=0 (blue): idx 0 -> 3 -->
  <path d="M 125 92 Q 218 66 311 92" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="218" y="70" text-anchor="middle" font-size="10" fill="#335">r=0</text>

  <!-- Array boxes: centers 125,187,249,311,373,435 ; width 52 height 40 ; y 92..132 -->
  <rect x="99"  y="92" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="161" y="92" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="223" y="92" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="285" y="92" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="347" y="92" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="409" y="92" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>

  <!-- values inside boxes -->
  <text x="125" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="187" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="249" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <text x="311" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="373" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="435" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- index labels below -->
  <text x="125" y="150" text-anchor="middle" font-size="10" fill="#888">idx 0</text>
  <text x="187" y="150" text-anchor="middle" font-size="10" fill="#888">idx 1</text>
  <text x="249" y="150" text-anchor="middle" font-size="10" fill="#888">idx 2</text>
  <text x="311" y="150" text-anchor="middle" font-size="10" fill="#888">idx 3</text>
  <text x="373" y="150" text-anchor="middle" font-size="10" fill="#888">idx 4</text>
  <text x="435" y="150" text-anchor="middle" font-size="10" fill="#888">idx 5</text>

  <!-- divider + downward arrow -->
  <path d="M 280 162 L 280 184" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="296" y="178" font-size="10" fill="#888">提取同余子序列</text>

  <!-- Three extracted subsequence rows -->
  <!-- r=0 row: y 196..232 ; label x=40 -->
  <text x="48" y="222" font-size="12" fill="#335" font-weight="bold">r=0</text>
  <text x="80" y="222" font-size="11" fill="#666">S₀ =</text>
  <rect x="120" y="196" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="143" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="172" y="196" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="232" y="222" font-size="11" fill="#888">→ 组内需非递减</text>

  <!-- r=1 row: y 248..284 -->
  <text x="48" y="274" font-size="12" fill="#3a5a2a" font-weight="bold">r=1</text>
  <text x="80" y="274" font-size="11" fill="#666">S₁ =</text>
  <rect x="120" y="248" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="143" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="172" y="248" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <text x="232" y="274" font-size="11" fill="#888">→ 已非递减，0 操作</text>

  <!-- r=2 row: y 300..336 -->
  <text x="48" y="326" font-size="12" fill="#a87020" font-weight="bold">r=2</text>
  <text x="80" y="326" font-size="11" fill="#666">S₂ =</text>
  <rect x="120" y="300" width="46" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="143" y="324" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="172" y="300" width="46" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="324" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="232" y="326" font-size="11" fill="#888">→ 组内需非递减</text>

  <!-- bottom takeaway -->
  <rect x="50" y="360" width="460" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">每条子序列独立求 LNIS → 最少改动 = |S_r| − LNIS(S_r)</text>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#777">不同余数的链互无约束，答案可加 = Σ (|S_r| − LNIS(S_r))</text>
</svg>
