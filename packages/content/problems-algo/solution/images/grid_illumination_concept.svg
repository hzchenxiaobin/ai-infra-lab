<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：四方向计数哈希表 + 灯位集合</text>

  <!-- 左侧：5x5 网格，灯在 (0,0)，照亮范围 -->
  <text x="130" y="56" text-anchor="middle" font-size="11.5" fill="#888">一盏灯 (0,0) 照亮 4 个方向</text>

  <!-- 网格 5x5，每格 40px，起点 (30, 66) -->
  <!-- 照亮底色：行0、列0、主对角 r-c=0、副对角 r+c=0 -->
  <!-- 行 0 -->
  <rect x="30" y="66" width="40" height="40" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="70" y="66" width="40" height="40" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="110" y="66" width="40" height="40" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="150" y="66" width="40" height="40" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="190" y="66" width="40" height="40" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- 行 1: 列0 + 副对角 r+c=0 无 / 主对角 r-c=0 即 (1,1) -->
  <rect x="30" y="106" width="40" height="40" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="70" y="106" width="40" height="40" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="110" y="106" width="40" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="150" y="106" width="40" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="190" y="106" width="40" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- 行 2: 列0 + 主对角 (2,2) -->
  <rect x="30" y="146" width="40" height="40" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="70" y="146" width="40" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="110" y="146" width="40" height="40" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="150" y="146" width="40" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="190" y="146" width="40" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- 行 3: 列0 + 主对角 (3,3) -->
  <rect x="30" y="186" width="40" height="40" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="70" y="186" width="40" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="110" y="186" width="40" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="150" y="186" width="40" height="40" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="190" y="186" width="40" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- 行 4: 列0 + 主对角 (4,4) -->
  <rect x="30" y="226" width="40" height="40" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="70" y="226" width="40" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="110" y="226" width="40" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="150" y="226" width="40" height="40" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="190" y="226" width="40" height="40" fill="#e6f4ea" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- 灯 (0,0) 用橙色圆 -->
  <circle cx="50" cy="86" r="9" fill="#d6a040" stroke="#8a5a10" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="90" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">灯</text>

  <!-- 坐标标注 -->
  <text x="20" y="90" text-anchor="end" font-size="9" fill="#888">r=0</text>
  <text x="20" y="130" text-anchor="end" font-size="9" fill="#888">r=1</text>
  <text x="20" y="170" text-anchor="end" font-size="9" fill="#888">r=2</text>
  <text x="20" y="210" text-anchor="end" font-size="9" fill="#888">r=3</text>
  <text x="20" y="250" text-anchor="end" font-size="9" fill="#888">r=4</text>
  <text x="50" y="280" text-anchor="middle" font-size="9" fill="#888">c=0</text>
  <text x="90" y="280" text-anchor="middle" font-size="9" fill="#888">c=1</text>
  <text x="130" y="280" text-anchor="middle" font-size="9" fill="#888">c=2</text>
  <text x="170" y="280" text-anchor="middle" font-size="9" fill="#888">c=3</text>
  <text x="210" y="280" text-anchor="middle" font-size="9" fill="#888">c=4</text>

  <!-- 图例 -->
  <rect x="30" y="296" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="307" font-size="10" fill="#555">行/列照亮</text>
  <rect x="115" y="296" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="135" y="307" font-size="10" fill="#555">对角线照亮</text>

  <!-- 右侧：四个哈希表 -->
  <path d="M 250 170 L 270 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="164" text-anchor="middle" font-size="9.5" fill="#888">压缩</text>

  <text x="430" y="56" text-anchor="middle" font-size="11.5" fill="#888">用 4 个哈希表计数亮灯数</text>

  <!-- rowCnt -->
  <rect x="280" y="66" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="89" font-size="11.5" fill="#333" font-weight="bold">rowCnt</text>
  <text x="360" y="89" font-size="11" fill="#333">{ 0: 1 }   ← 第 0 行有 1 盏</text>

  <!-- colCnt -->
  <rect x="280" y="112" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="135" font-size="11.5" fill="#333" font-weight="bold">colCnt</text>
  <text x="360" y="135" font-size="11" fill="#333">{ 0: 1 }   ← 第 0 列有 1 盏</text>

  <!-- diag1Cnt -->
  <rect x="280" y="158" width="300" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="181" font-size="11.5" fill="#333" font-weight="bold">diag1Cnt</text>
  <text x="360" y="181" font-size="11" fill="#333">{ 0: 1 }   ← r−c=0 主对角</text>

  <!-- diag2Cnt -->
  <rect x="280" y="204" width="300" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="227" font-size="11.5" fill="#333" font-weight="bold">diag2Cnt</text>
  <text x="360" y="227" font-size="11" fill="#333">{ 0: 1 }   ← r+c=0 副对角</text>

  <!-- 灯位集合 -->
  <rect x="280" y="258" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="275" font-size="11.5" fill="#333" font-weight="bold">lampSet</text>
  <text x="360" y="275" font-size="11" fill="#333">{ (0,0) }</text>
  <text x="360" y="292" font-size="10" fill="#888">去重：开灯/关灯都先查它</text>

  <!-- 判定公式 -->
  <rect x="40" y="324" width="540" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="343" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">判定 (r,c) 被照亮：</text>
  <text x="310" y="360" text-anchor="middle" font-size="11" fill="#333">rowCnt[r]&gt;0 或 colCnt[c]&gt;0 或 diag1[r−c]&gt;0 或 diag2[r+c]&gt;0</text>

  <!-- 底部备注 -->
  <text x="300" y="392" text-anchor="middle" font-size="10" fill="#888">n≤10⁹ 不能开网格 → 哈希压缩到 O(L) 空间</text>
  <rect x="40" y="408" width="540" height="6" fill="#f5f5f5" stroke="none" rx="4" filter="url(#rough2)"/>
</svg>
