<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两趟聚合 — ① 按订单算 max/avg ② 取 MAX(avg) 作阈值过滤</text>

  <!-- ===== Stage 1: OrdersDetails ===== -->
  <text x="70" y="52" text-anchor="middle" font-size="10" fill="#888">OrdersDetails（原始行）</text>
  <rect x="14" y="58" width="112" height="148" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="22" y="74" font-size="9" fill="#446688" font-weight="bold">oid prod qty</text>
  <line x1="14" y1="80" x2="126" y2="80" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="22" y="94" font-size="9" fill="#666">1   1   12</text>
  <text x="22" y="108" font-size="9" fill="#666">1   2   10</text>
  <text x="22" y="122" font-size="9" fill="#666">1   3   15</text>
  <text x="22" y="136" font-size="9" fill="#666">2   1   8</text>
  <text x="22" y="150" font-size="9" fill="#666">2   4   4</text>
  <text x="22" y="164" font-size="9" fill="#666">3   4   18</text>
  <text x="22" y="178" font-size="9" fill="#666">3   9   20</text>
  <text x="22" y="196" font-size="8" fill="#999">… 14 行</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 128 132 L 174 132" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="151" y="120" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">GROUP BY</text>
  <text x="151" y="148" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">order_id</text>

  <!-- ===== Stage 2: per-order max & avg ===== -->
  <text x="262" y="52" text-anchor="middle" font-size="10" fill="#888">每订单：MAX(qty) 与 AVG(qty)</text>
  <rect x="178" y="58" width="168" height="148" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="186" y="74" font-size="9" fill="#446688" font-weight="bold">oid  max_q  avg_q</text>
  <line x1="178" y1="80" x2="346" y2="80" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="186" y="94" font-size="9" fill="#666">1    15      12.33</text>
  <text x="186" y="108" font-size="9" fill="#666">2    8       5.5</text>
  <text x="186" y="122" font-size="9" fill="#b85450" font-weight="bold">3    20      14.33</text>
  <text x="186" y="136" font-size="9" fill="#666">4    8       5</text>
  <text x="186" y="150" font-size="9" fill="#666">5    9       9</text>
  <text x="186" y="172" font-size="8" fill="#888">一趟 GROUP BY 同时</text>
  <text x="186" y="184" font-size="8" fill="#888">产出 MAX 与 AVG</text>
  <text x="186" y="200" font-size="8" fill="#d6a040" font-weight="bold">AVG = SUM/COUNT</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 348 110 L 394 110" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="371" y="100" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">MAX</text>
  <text x="371" y="124" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">(avg_q)</text>

  <!-- Arrow 2 -> 3 (lower: max_q flows) -->
  <path d="M 348 156 L 394 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="371" y="148" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">max_q</text>

  <!-- ===== Stage 3: threshold + filter ===== -->
  <text x="486" y="52" text-anchor="middle" font-size="10" fill="#888">阈值与过滤</text>
  <rect x="398" y="88" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="458" y="104" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">阈值 = MAX(avg_q)</text>
  <text x="458" y="118" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">= 14.33</text>

  <rect x="398" y="140" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="458" y="156" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">WHERE max_q &gt; 阈值</text>
  <text x="458" y="170" text-anchor="middle" font-size="8" fill="#4a7a3a">（严格大于）</text>

  <!-- Arrow to result -->
  <path d="M 458 182 L 458 216" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <rect x="398" y="220" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="458" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">输出 order_id</text>
  <line x1="408" y1="244" x2="508" y2="244" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="458" y="258" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="458" y="270" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- ===== SQL snippet ===== -->
  <rect x="14" y="300" width="592" height="68" fill="#fff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="24" y="318" font-size="10" fill="#446688" font-weight="bold">SQL 骨架：</text>
  <text x="24" y="336" font-size="10" fill="#333" font-family="monospace">WITH t AS (SELECT order_id, MAX(quantity) max_q, AVG(quantity) avg_q FROM OrdersDetails GROUP BY order_id)</text>
  <text x="24" y="354" font-size="10" fill="#333" font-family="monospace">SELECT order_id FROM t WHERE max_q &gt; (SELECT MAX(avg_q) FROM t);</text>
  <text x="430" y="364" font-size="8" fill="#888">两趟聚合，无自连接</text>
</svg>
