<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：阈值 d 越大 → need(d) 越小（单调递减 ⇒ 二段性）</text>

  <!-- ===== number line with gaps ===== -->
  <text x="30" y="52" font-size="12" fill="#888">示例 stations = [0, 10, 30]，两个 gap：g₁=10、g₂=20，maxgap = 20</text>

  <!-- number line -->
  <line x1="70" y1="74" x2="430" y2="74" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- station dots -->
  <circle cx="70" cy="74" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="94" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">0</text>
  <circle cx="250" cy="74" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="94" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">10</text>
  <circle cx="430" cy="74" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="94" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">30</text>

  <!-- gap labels -->
  <rect x="140" y="60" width="44" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="162" y="73" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">g₁=10</text>
  <rect x="320" y="60" width="44" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="342" y="73" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">g₂=20</text>

  <!-- formula -->
  <rect x="120" y="104" width="340" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">need(d) = Σ ( ⌈ gᵢ / d ⌉ − 1 ) ，每个 gap 独立贪心计数</text>

  <!-- arrow down -->
  <path d="M 290 130 L 290 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="142" font-size="10" fill="#888">need(d) 单调递减</text>

  <!-- ===== Monotonic decreasing curve ===== -->
  <line x1="70" y1="160" x2="70" y2="330" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="330" x2="450" y2="330" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="166" text-anchor="end" font-size="10" fill="#888">need</text>
  <text x="454" y="334" font-size="10" fill="#888">d →</text>
  <text x="64" y="334" text-anchor="end" font-size="9" fill="#999">0</text>

  <!-- y axis ticks -->
  <text x="64" y="298" text-anchor="end" font-size="9" fill="#aaa">3</text>
  <text x="64" y="254" text-anchor="end" font-size="9" fill="#aaa">6</text>
  <text x="64" y="218" text-anchor="end" font-size="9" fill="#aaa">9</text>

  <!-- x: d 0..20 mapped to 90..430 (17px/unit); y: need 0..14 mapped to 330..160 (12.14px/unit) -->
  <!-- descending step curve through key points -->
  <path d="M 90 172 L 141 172 L 141 221 L 158 221 L 158 257 L 175 257 L 175 281 L 203 281 L 203 294 L 260 294 L 260 318 L 430 318 L 430 330" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="110" y="166" font-size="10" fill="#446688" font-weight="bold">d ↑ ⇒ need ↓</text>

  <!-- key point dots -->
  <circle cx="124" cy="172" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="124" y="166" text-anchor="middle" font-size="8" fill="#888">(2,13)</text>
  <circle cx="175" cy="281" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="180" y="276" font-size="8" fill="#888">(5,4)</text>
  <circle cx="260" cy="318" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="266" y="314" font-size="8" fill="#888">(10,1)</text>

  <!-- d axis labels -->
  <text x="90" y="346" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="175" y="346" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="260" y="346" text-anchor="middle" font-size="9" fill="#aaa">10</text>
  <text x="350" y="346" text-anchor="middle" font-size="9" fill="#aaa">15</text>
  <text x="430" y="346" text-anchor="middle" font-size="9" fill="#aaa">20</text>

  <!-- k threshold line -->
  <line x1="70" y1="294" x2="450" y2="294" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="454" y="298" font-size="11" fill="#b85450" font-weight="bold">k = 3</text>

  <!-- answer point at d* = 20/3 ≈ 6.67 (need drops to 3) -->
  <circle cx="203" cy="294" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="203" y1="294" x2="203" y2="330" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="203" y="362" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d* = 20/3 ≈ 6.67</text>

  <!-- feasible / infeasible labels -->
  <text x="120" y="288" font-size="10" fill="#b85450">need &gt; k ✗</text>
  <text x="300" y="288" font-size="10" fill="#4a7a3a">need ≤ k ✓</text>

  <!-- right summary note -->
  <rect x="468" y="160" width="104" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="520" y="184" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="520" y="206" text-anchor="middle" font-size="10" fill="#666">d ∈ [0, maxgap]</text>
  <text x="520" y="226" text-anchor="middle" font-size="10" fill="#666">求最小的 d</text>
  <text x="520" y="244" text-anchor="middle" font-size="10" fill="#666">使 need(d) ≤ k</text>
  <text x="520" y="266" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分！</text>

  <!-- note about formula -->
  <rect x="70" y="372" width="440" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a">gap 长度 g 切成每段 ≤ d：段数 ⌈g/d⌉，新增站点 = 段数 − 1</text>
</svg>
