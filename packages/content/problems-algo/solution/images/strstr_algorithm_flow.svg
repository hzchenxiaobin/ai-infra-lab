<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">KMP 匹配算法流程（主串指针 i 只增不减）</text>

  <ellipse cx="300" cy="54" rx="78" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#333">开始: i=0, j=0</text>

  <path d="M 300 72 L 300 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,92 372,128 300,164 228,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="124" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="300" y="140" text-anchor="middle" font-size="10" fill="#666">(主串未遍历完)</text>

  <path d="M 372 128 L 420 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="120" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="470" cy="128" rx="54" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="132" text-anchor="middle" font-size="12" fill="#333">返回 −1</text>

  <path d="M 300 164 L 300 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="178" font-size="11" fill="#82b366">是</text>

  <polygon points="300,188 392,224 300,260 208,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="220" text-anchor="middle" font-size="12" fill="#333">txt[i] == pat[j] ?</text>
  <text x="300" y="236" text-anchor="middle" font-size="10" fill="#666">(当前字符是否相等)</text>

  <path d="M 208 224 L 184 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="216" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <path d="M 300 260 L 300 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="274" font-size="11" fill="#82b366">是</text>

  <rect x="258" y="284" width="84" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="306" text-anchor="middle" font-size="12" fill="#333">i++; j++</text>

  <path d="M 300 318 L 300 338" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,342 376,378 300,414 224,378" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="374" text-anchor="middle" font-size="12" fill="#333">j == m ?</text>
  <text x="300" y="390" text-anchor="middle" font-size="10" fill="#666">(整串匹配成功)</text>

  <path d="M 300 414 L 300 432" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="428" font-size="11" fill="#82b366">是</text>
  <ellipse cx="300" cy="452" rx="72" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="456" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 i − m</text>

  <polygon points="130,188 190,224 130,260 70,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="220" text-anchor="middle" font-size="12" fill="#333">j &gt; 0 ?</text>
  <text x="130" y="236" text-anchor="middle" font-size="10" fill="#666">(已有匹配进度)</text>

  <path d="M 130 260 L 130 284" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="278" font-size="11" fill="#82b366">是</text>

  <rect x="84" y="288" width="92" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="310" text-anchor="middle" font-size="11" fill="#333">j = lps[j−1]</text>

  <path d="M 130 288 L 130 168 L 300 168 L 300 184" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="215" y="160" text-anchor="middle" font-size="10.5" fill="#b85450">i 不动, 重新比较</text>

  <path d="M 70 224 L 44 224 L 44 128 L 228 128" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="56" y="176" text-anchor="middle" font-size="10.5" fill="#888" transform="rotate(-90 56 176)">否: j==0 → i++</text>

  <path d="M 224 378 L 44 378 L 44 130" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="44" y="300" text-anchor="middle" font-size="10.5" fill="#888" transform="rotate(-90 44 300)">否: 继续循环</text>
</svg>
