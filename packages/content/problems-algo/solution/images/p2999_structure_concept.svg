<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：强大整数 = 「自由前缀」+「固定后缀 s」</text>
  <text x="280" y="40" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">例：limit = 4，s = "124" —— 末 3 位锁死为 124，其余位只能填 0..4</text>

  <!-- structure cells -->
  <text x="192" y="60" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">前缀 p：每位 0..limit</text>
  <text x="306" y="60" text-anchor="middle" font-size="11" fill="#2e5c22" filter="url(#rough2)">后缀：固定 = s</text>

  <rect x="170" y="66" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="214" y="66" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="262" y="66" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="306" y="66" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="350" y="66" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="190" y="91" text-anchor="middle">2</text>
    <text x="234" y="91" text-anchor="middle">4</text>
    <text x="282" y="91" text-anchor="middle">1</text>
    <text x="326" y="91" text-anchor="middle">2</text>
    <text x="370" y="91" text-anchor="middle">4</text>
  </g>
  <text x="192" y="122" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">可自由变化</text>
  <text x="306" y="122" text-anchor="middle" font-size="10.5" fill="#2e5c22" filter="url(#rough2)">一字不改</text>

  <path d="M 398 86 L 416 86" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="84" font-size="12" fill="#8c3a36" filter="url(#rough2)">拼出 24124</text>
  <text x="424" y="100" font-size="12" fill="#8c3a36" filter="url(#rough2)">是强大整数 ✓</text>

  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">124、1124、2124、4124 —— 前缀随便换，尾巴不许动</text>

  <!-- three length classes -->
  <rect x="20" y="160" width="164" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="102" y="184" font-size="12.5" fill="#8c3a36" font-weight="bold">位数 m &lt; L</text>
    <text x="102" y="206" font-size="11.5" fill="#8c3a36">0 个</text>
    <text x="102" y="224" font-size="10.5" fill="#8c3a36">数比后缀还短，装不下</text>
  </g>

  <rect x="198" y="160" width="164" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="280" y="184" font-size="12.5" fill="#33507a" font-weight="bold">位数 m = L</text>
    <text x="280" y="206" font-size="11.5" fill="#33507a">至多 1 个</text>
    <text x="280" y="224" font-size="10.5" fill="#33507a">就是 s 本身（x ≥ s 才算）</text>
  </g>

  <rect x="376" y="160" width="164" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="458" y="184" font-size="12.5" fill="#2e5c22" font-weight="bold">位数 m &gt; L</text>
    <text x="458" y="206" font-size="11.5" fill="#2e5c22">前缀自由组合</text>
    <text x="458" y="224" font-size="10.5" fill="#2e5c22">逐位独立 → 乘法计数</text>
  </g>

  <!-- padded alignment trick -->
  <rect x="20" y="250" width="520" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle" fill="#b07818">
    <text x="280" y="272" font-size="12">实现技巧：把候选 y 统一补前导 0 到 n 位再比较</text>
    <text x="280" y="292" font-size="10.5">"0…0"+s 去掉前导 0 后仍以 s 结尾（s 无前导 0）→ 更短位数自动覆盖</text>
  </g>

  <!-- prefix sum -->
  <rect x="20" y="318" width="520" height="82" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="280" y="348" font-size="15" fill="#8c3a36" font-weight="bold">ans = count(finish) − count(start − 1)</text>
    <text x="280" y="376" font-size="11.5" fill="#8c3a36">count(N)：[1..N] 内强大整数的个数 —— 双边区间化成单边上界</text>
  </g>
</svg>
