<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 424" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="424" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "xaxcd"，k = 4</text>

  <!-- header -->
  <rect x="40" y="46" width="440" height="30" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="59" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="97" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">s[i]</text>
  <text x="133" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">o</text>
  <text x="206" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">到 'a' 代价</text>
  <text x="284" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">rem</text>
  <text x="359" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">决策</text>
  <text x="446" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">t[i]</text>

  <!-- row highlights -->
  <rect x="40" y="76" width="440" height="36" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="40" y="112" width="440" height="36" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="40" y="148" width="440" height="36" fill="#fff8e1" filter="url(#rough2)"/>

  <!-- grid lines -->
  <path d="M 40 76 H 480" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 40 112 H 480" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 40 148 H 480" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 40 184 H 480" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 40 220 H 480" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 78 46 V 256" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 116 46 V 256" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 150 46 V 256" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 262 46 V 256" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 306 46 V 256" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 412 46 V 256" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="46" width="440" height="210" fill="none" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- row 0 -->
  <text x="59" y="99" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="97" y="99" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">x</text>
  <text x="133" y="99" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">23</text>
  <text x="206" y="99" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">min(23, 3) = 3</text>
  <text x="284" y="99" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4 → 1</text>
  <text x="359" y="99" text-anchor="middle" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">✓ 变 'a'（花 3）</text>
  <text x="446" y="100" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>

  <!-- row 1 -->
  <text x="59" y="135" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="97" y="135" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a</text>
  <text x="133" y="135" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="206" y="135" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="284" y="135" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1 → 1</text>
  <text x="359" y="135" text-anchor="middle" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">✓ 白嫖 'a'（花 0）</text>
  <text x="446" y="136" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>

  <!-- row 2 -->
  <text x="59" y="171" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="97" y="171" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">x</text>
  <text x="133" y="171" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">23</text>
  <text x="206" y="171" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="284" y="171" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1 → 0</text>
  <text x="359" y="171" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">✗ 退 1 步变 'w'（花 1）</text>
  <text x="446" y="172" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">w</text>

  <!-- row 3 -->
  <text x="59" y="207" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="97" y="207" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">c</text>
  <text x="133" y="207" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="206" y="207" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="284" y="207" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="359" y="207" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">预算空，原样保留</text>
  <text x="446" y="208" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">c</text>

  <!-- row 4 -->
  <text x="59" y="243" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="97" y="243" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d</text>
  <text x="133" y="243" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="206" y="243" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="284" y="243" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="359" y="243" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">预算空，原样保留</text>
  <text x="446" y="244" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">d</text>

  <!-- verify box -->
  <rect x="48" y="268" width="424" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">验证：distance(xaxcd, aawcd) = 3 + 0 + 1 + 0 + 0 = 4 ≤ k ✓</text>

  <!-- example 1 box -->
  <rect x="48" y="308" width="424" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">示例 1：zbbz, k = 3 → z 花 1 + b 花 1 + b 花 1 = 3，末位 z 保留 → aaaz</text>

  <!-- example 3 box -->
  <rect x="48" y="348" width="424" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">示例 3：lol, k = 0 → 动任何一位距离都会 &gt; 0，原样返回 lol</text>

  <!-- conclusion box -->
  <rect x="48" y="388" width="424" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="408" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一句话：能变 'a' 就变 'a'；变不到就朝 'a' 退 rem 步</text>
</svg>
