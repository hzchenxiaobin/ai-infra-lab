<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例演算：arr = [2, 1, 3, 4, 4]
  </text>

  <!-- Header row -->
  <rect x="30" y="48" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="67" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i</text>
  <rect x="100" y="48" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="67" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">prefixMax[i]</text>
  <rect x="200" y="48" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="67" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">suffixMin[i+1]</text>
  <rect x="300" y="48" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="67" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">比较</text>
  <rect x="390" y="48" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="67" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">操作 / count</text>

  <!-- Row i=0: prefixMax[0]=2, suffixMin[1]=1, 2≤1? ✗ -->
  <rect x="30" y="80" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="100" y="80" width="100" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="80" width="100" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="250" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="300" y="80" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="345" y="99" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2≤1? ✗</text>
  <rect x="390" y="80" width="120" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="99" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">不切 / 0</text>

  <!-- Row i=1: prefixMax[1]=2, suffixMin[2]=3, 2≤3? ✓ -->
  <rect x="30" y="112" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="100" y="112" width="100" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="112" width="100" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="250" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="300" y="112" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="345" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2≤3? ✓</text>
  <rect x="390" y="112" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="131" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">切！→ [2,1]</text>

  <!-- Row i=2: prefixMax[2]=3, suffixMin[3]=4, 3≤4? ✓ -->
  <rect x="30" y="144" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="100" y="144" width="100" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="200" y="144" width="100" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="250" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="300" y="144" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="345" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3≤4? ✓</text>
  <rect x="390" y="144" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="163" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">切！→ [3]</text>

  <!-- Row i=3: prefixMax[3]=4, suffixMin[4]=4, 4≤4? ✓ -->
  <rect x="30" y="176" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="100" y="176" width="100" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="200" y="176" width="100" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="250" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="300" y="176" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="345" y="195" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4≤4? ✓</text>
  <rect x="390" y="176" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="195" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">切！→ [4]</text>

  <!-- Divider -->
  <line x1="30" y1="220" x2="510" y2="220" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- Result section -->
  <text x="270" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    count = 3（切了 3 刀）→ 答案 = count + 1 = 4
  </text>

  <!-- Chunk visualization -->
  <text x="270" y="270" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    块的划分（最后一刀后 [4] 自动成为第 4 块）：
  </text>

  <!-- Chunk boxes -->
  <rect x="100" y="285" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="308" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2, 1]</text>
  <text x="140" y="350" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">排序→[1,2]</text>

  <rect x="195" y="285" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="308" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3]</text>
  <text x="220" y="350" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">排序→[3]</text>

  <rect x="260" y="285" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="308" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[4]</text>
  <text x="285" y="350" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">排序→[4]</text>

  <rect x="325" y="285" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="350" y="308" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[4]</text>
  <text x="350" y="350" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">排序→[4]</text>

  <!-- Concatenation result -->
  <line x1="100" y1="362" x2="375" y2="362" stroke="#999" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <rect x="130" y="370" width="220" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="387" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    拼接 = [1, 2, 3, 4, 4] = 升序 ✓
  </text>
</svg>
