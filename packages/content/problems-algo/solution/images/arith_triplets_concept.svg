<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：以中项 x 为锚，x−diff 与 x+diff 同时存在即成三元组</text>

  <!-- arithmetic progression: three boxes -->
  <rect x="65" y="56" width="110" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="80" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">x − diff</text>
  <text x="120" y="98" text-anchor="middle" font-size="11" fill="#888">nums[i]</text>

  <path d="M 178 83 L 220 83" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="199" y="76" text-anchor="middle" font-size="10.5" fill="#888">+diff</text>

  <rect x="225" y="56" width="110" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">x</text>
  <text x="280" y="98" text-anchor="middle" font-size="11" fill="#888">nums[j]（锚）</text>

  <path d="M 338 83 L 380 83" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="359" y="76" text-anchor="middle" font-size="10.5" fill="#888">+diff</text>

  <rect x="385" y="56" width="110" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="440" y="80" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">x + diff</text>
  <text x="440" y="98" text-anchor="middle" font-size="11" fill="#888">nums[k]</text>

  <!-- concrete instance -->
  <text x="280" y="134" text-anchor="middle" font-size="11.5" fill="#555">例：x = 4，diff = 3 → 1, 4, 7 三项成等差</text>

  <!-- divider -->
  <path d="M 40 150 L 520 150" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- hash set box -->
  <rect x="40" y="162" width="480" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">哈希集合 S = {0, 1, 4, 6, 7, 10}</text>
  <text x="280" y="204" text-anchor="middle" font-size="11" fill="#333">对每个 x：查 (x−diff) ∈ S 且 (x+diff) ∈ S</text>
  <text x="280" y="222" text-anchor="middle" font-size="10.5" fill="#888">两端都在 → 计一组；任一缺失 → 跳过</text>

  <!-- guarantee box -->
  <rect x="40" y="246" width="480" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">为何「存在」即可保证 i &lt; j &lt; k？</text>
  <text x="56" y="290" font-size="11" fill="#555">• 严格递增 + diff &gt; 0 ⟹ x−diff &lt; x &lt; x+diff（三值严格递增）</text>
  <text x="56" y="308" font-size="11" fill="#555">• 三值若都在数组中，其下标天然有序 i &lt; j &lt; k，无需额外排序</text>

  <!-- footer -->
  <text x="40" y="348" font-size="10.5" fill="#888">注：严格递增还保证每个值唯一，故每个中项 x 至多贡献一组，计数不重不漏</text>
  <text x="40" y="366" font-size="10.5" fill="#888">      枚举中项一次 O(n)，配合集合 O(1) 查询 → 总 O(n)</text>
</svg>
