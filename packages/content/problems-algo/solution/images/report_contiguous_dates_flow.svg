<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">SQL 执行流程：六步完成 Gaps &amp; Islands</text>

  <!-- Step 1: UNION ALL -->
  <rect x="80" y="50" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="68" font-size="11" fill="#446688" font-weight="bold">① UNION ALL</text>
  <text x="100" y="84" font-size="10" fill="#555">Failed.fail_date → 'failed'  ∪  Succeeded.success_date → 'succeeded'</text>
  <circle cx="50" cy="72" r="14" fill="#446688" filter="url(#rough2)"/>
  <text x="50" y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">1</text>

  <path d="M 280 94 L 280 104" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: WHERE filter -->
  <rect x="80" y="108" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="126" font-size="11" fill="#4a7a3a" font-weight="bold">② WHERE 过滤</text>
  <text x="100" y="142" font-size="10" fill="#555">dt BETWEEN '2019-01-01' AND '2019-12-31'（只保留 2019 年记录）</text>
  <circle cx="50" cy="130" r="14" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="50" y="134" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">2</text>

  <path d="M 280 152 L 280 162" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: ROW_NUMBER -->
  <rect x="80" y="166" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="184" font-size="11" fill="#d6a040" font-weight="bold">③ ROW_NUMBER() 窗口函数</text>
  <text x="100" y="200" font-size="10" fill="#555">rn = ROW_NUMBER() OVER (PARTITION BY st ORDER BY dt) — 按 st 分区内编号</text>
  <circle cx="50" cy="188" r="14" fill="#d6a040" filter="url(#rough2)"/>
  <text x="50" y="192" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">3</text>

  <path d="M 280 210 L 280 220" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: DATE_SUB -->
  <rect x="80" y="224" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="242" font-size="11" fill="#d6a040" font-weight="bold">④ 计算岛屿标识 pt</text>
  <text x="100" y="258" font-size="10" fill="#555">pt = DATE_SUB(dt, INTERVAL rn DAY) — 连续日期 pt 相同，断点处 pt 不同</text>
  <circle cx="50" cy="246" r="14" fill="#d6a040" filter="url(#rough2)"/>
  <text x="50" y="250" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">4</text>

  <path d="M 280 268 L 280 278" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: GROUP BY -->
  <rect x="80" y="282" width="400" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="300" font-size="11" fill="#b85450" font-weight="bold">⑤ GROUP BY st, pt → 聚合</text>
  <text x="100" y="316" font-size="10" fill="#555">st AS period_state, MIN(dt) AS start_date, MAX(dt) AS end_date</text>
  <circle cx="50" cy="304" r="14" fill="#b85450" filter="url(#rough2)"/>
  <text x="50" y="308" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">5</text>

  <path d="M 280 326 L 280 336" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 6: ORDER BY -->
  <rect x="80" y="340" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="358" font-size="11" fill="#446688" font-weight="bold">⑥ ORDER BY start_date</text>
  <text x="100" y="374" font-size="10" fill="#555">按起始日期升序排列，输出最终结果</text>
  <circle cx="50" cy="362" r="14" fill="#446688" filter="url(#rough2)"/>
  <text x="50" y="366" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">6</text>

  <!-- Summary -->
  <rect x="80" y="394" width="400" height="20" fill="none" stroke="none"/>
  <text x="280" y="408" text-anchor="middle" font-size="10" fill="#888">③④ 是 Gaps &amp; Islands 的核心：行号差识别连续段</text>
</svg>
