<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">「有效序列号」= SN + 恰好4位数字 + '-' + 恰好4位数字 + 右边界断言</text>

  <!-- decomposition row: SN1234-5678 + boundary -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <rect x="70" y="42" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="82" y="60" text-anchor="middle">S</text>
    <rect x="94" y="42" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="106" y="60" text-anchor="middle">N</text>
    <rect x="118" y="42" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="130" y="60" text-anchor="middle">1</text>
    <rect x="142" y="42" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="154" y="60" text-anchor="middle">2</text>
    <rect x="166" y="42" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="178" y="60" text-anchor="middle">3</text>
    <rect x="190" y="42" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="202" y="60" text-anchor="middle">4</text>
    <rect x="214" y="42" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="226" y="60" text-anchor="middle">-</text>
    <rect x="238" y="42" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="250" y="60" text-anchor="middle">5</text>
    <rect x="262" y="42" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="274" y="60" text-anchor="middle">6</text>
    <rect x="286" y="42" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="298" y="60" text-anchor="middle">7</text>
    <rect x="310" y="42" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="322" y="60" text-anchor="middle">8</text>
  </g>
  <rect x="340" y="42" width="84" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="382" y="60" text-anchor="middle" font-size="10.5" fill="#7a4a2b" filter="url(#rough2)">非数字/结尾</text>

  <!-- group labels -->
  <g filter="url(#rough2)" font-size="10.5" fill="#666">
    <text x="106" y="84" text-anchor="middle">字面量·区分大小写</text>
    <text x="166" y="84" text-anchor="middle">恰好 4 位</text>
    <text x="226" y="84" text-anchor="middle">短横</text>
    <text x="286" y="84" text-anchor="middle">恰好 4 位</text>
    <text x="382" y="84" text-anchor="middle">右边界</text>
  </g>

  <!-- regex pieces -->
  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <text x="106" y="102" text-anchor="middle">SN</text>
    <text x="166" y="102" text-anchor="middle">[0-9]{4}</text>
    <text x="226" y="102" text-anchor="middle">-</text>
    <text x="286" y="102" text-anchor="middle">[0-9]{4}</text>
    <text x="382" y="102" text-anchor="middle">([^0-9]|$)</text>
  </g>

  <!-- trap row: SN1234-56789 -->
  <text x="260" y="128" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">陷阱：SN1234-56789 —— 短横后是 5 位数字</text>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <rect x="104" y="136" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="116" y="154" text-anchor="middle">S</text>
    <rect x="128" y="136" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="140" y="154" text-anchor="middle">N</text>
    <rect x="152" y="136" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="164" y="154" text-anchor="middle">1</text>
    <rect x="176" y="136" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="188" y="154" text-anchor="middle">2</text>
    <rect x="200" y="136" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="212" y="154" text-anchor="middle">3</text>
    <rect x="224" y="136" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="236" y="154" text-anchor="middle">4</text>
    <rect x="248" y="136" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="154" text-anchor="middle">-</text>
    <rect x="272" y="136" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="284" y="154" text-anchor="middle">5</text>
    <rect x="296" y="136" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="308" y="154" text-anchor="middle">6</text>
    <rect x="320" y="136" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="332" y="154" text-anchor="middle">7</text>
    <rect x="344" y="136" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="356" y="154" text-anchor="middle">8</text>
    <rect x="368" y="136" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="380" y="154" text-anchor="middle">9</text>
  </g>
  <text x="414" y="150" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="414" y="166" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">第 5 位</text>

  <!-- bracket under naive substring -->
  <path d="M 104 168 L 104 176 L 367 176 L 367 168" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236" y="192" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">朴素模式命中的子串 SN1234-5678 → 误判有效 ✗</text>
  <text x="260" y="209" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">带断言：吃掉 5678 后下一字符是 9（数字）→ 失配 → 正确丢弃 ✓</text>

  <!-- valid row: SN1234-5678 at end of string -->
  <text x="260" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">合法：序列号在串尾（$ 分支）或后随空格/字母（[^0-9] 分支）</text>
  <text x="126" y="262" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">…</text>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <rect x="140" y="240" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="152" y="258" text-anchor="middle">S</text>
    <rect x="164" y="240" width="24" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="176" y="258" text-anchor="middle">N</text>
    <rect x="188" y="240" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="200" y="258" text-anchor="middle">1</text>
    <rect x="212" y="240" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="224" y="258" text-anchor="middle">2</text>
    <rect x="236" y="240" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="248" y="258" text-anchor="middle">3</text>
    <rect x="260" y="240" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="272" y="258" text-anchor="middle">4</text>
    <rect x="284" y="240" width="24" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="296" y="258" text-anchor="middle">-</text>
    <rect x="308" y="240" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="320" y="258" text-anchor="middle">5</text>
    <rect x="332" y="240" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="344" y="258" text-anchor="middle">6</text>
    <rect x="356" y="240" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="368" y="258" text-anchor="middle">7</text>
    <rect x="380" y="240" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="392" y="258" text-anchor="middle">8</text>
  </g>
  <rect x="410" y="240" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="422" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">$</text>
  <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#2d5523" filter="url(#rough2)">✓ 后面没有字符 → $ 命中；后面是空格/字母/标点 → [^0-9] 命中——都算「恰好 4 位」</text>

  <!-- warning box -->
  <rect x="40" y="294" width="440" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="260" y="309" text-anchor="middle" font-size="10.5" fill="#7a4a2b" filter="url(#rough2)">⚠ 朴素模式 SN[0-9]{4}-[0-9]{4} 缺右边界；_ci collation 下还会放过小写 sn…</text>
  <text x="260" y="323" text-anchor="middle" font-size="10.5" fill="#7a4a2b" filter="url(#rough2)">（需 REGEXP_LIKE(…, 'c') 或 REGEXP BINARY 显式声明大小写敏感）</text>

  <!-- bottom note -->
  <rect x="40" y="332" width="440" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#2d5523" filter="url(#rough2)">左侧无需边界：「以 SN 开头」指序列号自身；前段恰好 4 位由后随 '-' 天然保证</text>
</svg>
