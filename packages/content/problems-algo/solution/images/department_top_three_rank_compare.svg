<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三种排名函数 Top-3 对比（IT 部门，WHERE rk ≤ 3）</text>
  <text x="320" y="44" text-anchor="middle" font-size="10" fill="#888">工资降序：90k, 85k, 85k, 70k, 69k（Joe/Randy 同 85k 并列）</text>

  <!-- ===== Header row ===== -->
  <rect x="40" y="60" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="76" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">员工 / 工资</text>

  <rect x="170" y="60" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="76" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">DENSE_RANK ✓</text>

  <rect x="320" y="60" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="76" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">RANK ✗</text>

  <rect x="470" y="60" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="540" y="76" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">ROW_NUMBER ✗</text>

  <!-- ===== Row: Max 90k ===== -->
  <rect x="40" y="88" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="58" y="104" font-size="10" fill="#4a7a3a" font-weight="bold">Max</text>
  <text x="120" y="104" font-size="10" fill="#4a7a3a" font-weight="bold">90k</text>

  <rect x="170" y="88" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="240" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 ✓</text>

  <rect x="320" y="88" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="390" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 ✓</text>

  <rect x="470" y="88" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="540" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 ✓</text>

  <!-- ===== Row: Joe 85k ===== -->
  <rect x="40" y="114" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="58" y="130" font-size="10" fill="#333">Joe</text>
  <text x="120" y="130" font-size="10" fill="#333">85k</text>

  <rect x="170" y="114" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="240" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 ✓</text>

  <rect x="320" y="114" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="390" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 ✓</text>

  <rect x="470" y="114" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="540" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 ✓</text>

  <!-- ===== Row: Randy 85k (tie) ===== -->
  <rect x="40" y="140" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="58" y="156" font-size="10" fill="#333">Randy</text>
  <text x="120" y="156" font-size="10" fill="#333">85k</text>

  <rect x="170" y="140" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="240" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 ✓</text>

  <rect x="320" y="140" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="390" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 ✓</text>

  <rect x="470" y="140" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="540" y="156" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 ✓</text>

  <!-- ===== Row: Will 70k (THE critical row) ===== -->
  <rect x="40" y="166" width="120" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="58" y="182" font-size="10" fill="#d6a040" font-weight="bold">Will</text>
  <text x="120" y="182" font-size="10" fill="#d6a040" font-weight="bold">70k</text>

  <rect x="170" y="166" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="240" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 ✓ 入选</text>

  <rect x="320" y="166" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="390" y="182" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 ✗ 漏掉</text>

  <rect x="470" y="166" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="540" y="182" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 ✗ 漏掉</text>

  <!-- ===== Row: Janet 69k (excluded) ===== -->
  <rect x="40" y="192" width="120" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="58" y="208" font-size="10" fill="#888">Janet</text>
  <text x="120" y="208" font-size="10" fill="#888">69k</text>

  <rect x="170" y="192" width="140" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="240" y="208" text-anchor="middle" font-size="11" fill="#888">4 ✗</text>

  <rect x="320" y="192" width="140" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="390" y="208" text-anchor="middle" font-size="11" fill="#888">5 ✗</text>

  <rect x="470" y="192" width="140" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="540" y="208" text-anchor="middle" font-size="11" fill="#888">5 ✗</text>

  <!-- vertical separators -->
  <line x1="170" y1="84" x2="170" y2="216" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="320" y1="84" x2="320" y2="216" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="470" y1="84" x2="470" y2="216" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- ===== result summary row ===== -->
  <rect x="40" y="226" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="241" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">rk≤3 入选数</text>

  <rect x="170" y="226" width="140" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="241" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4 人 ✓ 正确</text>

  <rect x="320" y="226" width="140" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="241" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3 人 ✗ 少 1</text>

  <rect x="470" y="226" width="140" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="540" y="241" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3 人 ✗ 少 1</text>

  <!-- ===== Annotations: why each fails ===== -->
  <rect x="40" y="268" width="570" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="286" font-size="10" fill="#4a7a3a" font-weight="bold">DENSE_RANK ✓（按「不同值」计数、不跳号）</text>
  <text x="60" y="302" font-size="9" fill="#555">• Joe/Randy 同 85k → 共用 rk=2，Will 是第 3 个不同值 → rk=3</text>
  <text x="60" y="316" font-size="9" fill="#555">• 前 3 档不同工资（90k/85k/70k）全部入选，含并列 → 4 人，与题意完全吻合</text>

  <rect x="40" y="338" width="570" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="356" font-size="10" fill="#b85450" font-weight="bold">RANK ✗（按「行」计数后跳号）</text>
  <text x="60" y="372" font-size="9" fill="#555">• Joe/Randy 并列第 2 后，RANK 跳过被占的行位 → Will 被推到 rk=4</text>
  <text x="60" y="386" font-size="9" fill="#555">• rk≤3 漏掉 Will（本该是第三档 70k）→ 只取 3 人，少 1 档 ✗</text>

  <rect x="40" y="408" width="570" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="426" font-size="10" fill="#b85450" font-weight="bold">ROW_NUMBER ✗（强制每行唯一号）</text>
  <text x="60" y="442" font-size="9" fill="#555">• Joe/Randy 被分 2、3（破坏并列），Will 是 4 → rk≤3 只取 3 人，既砍并列又漏档 ✗</text>
</svg>
