<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Minimax：对手选更糟分支（max），你选 k 让最坏最小（min）</text>

  <!-- ===== interval [i, j] with guessed k ===== -->
  <text x="40" y="74" font-size="12" fill="#888">区间 [i, j] 内选 k 来猜：</text>

  <!-- left boundary i -->
  <rect x="96" y="60" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">i</text>
  <!-- gap dots -->
  <text x="158" y="84" font-size="14" fill="#888">…</text>
  <!-- k : guessed -->
  <rect x="180" y="56" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">k</text>
  <text x="202" y="48" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">猜 k</text>
  <!-- gap dots -->
  <text x="246" y="84" font-size="14" fill="#888">…</text>
  <!-- right boundary j -->
  <rect x="268" y="60" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">j</text>

  <!-- indices -->
  <text x="116" y="112" text-anchor="middle" font-size="10" fill="#aaa">左端</text>
  <text x="202" y="112" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">本轮猜</text>
  <text x="288" y="112" text-anchor="middle" font-size="10" fill="#aaa">右端</text>

  <!-- pay k box -->
  <rect x="340" y="62" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="425" y="88" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">猜错 → 付出 k</text>

  <!-- ===== two branches ===== -->
  <!-- branch arrows down -->
  <path d="M 170 130 L 110 160" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 234 130 L 294 160" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="120" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a">猜大了 → 更小</text>
  <text x="284" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a">猜小了 → 更大</text>

  <!-- left subproblem [i, k-1] -->
  <rect x="50" y="166" width="170" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">子问题 [i, k-1]</text>
  <text x="135" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a">代价 dp[i][k-1]</text>

  <!-- right subproblem [k+1, j] -->
  <rect x="250" y="166" width="170" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="335" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">子问题 [k+1, j]</text>
  <text x="335" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a">代价 dp[k+1][j]</text>

  <!-- opponent picks worse -->
  <rect x="430" y="176" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="196" text-anchor="middle" font-size="11" fill="#b85450">对手选更糟</text>

  <!-- max box -->
  <rect x="120" y="232" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">最坏 = max( dp[i][k-1], dp[k+1][j] )</text>

  <!-- arrow down -->
  <path d="M 280 276 L 280 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- plus k -->
  <rect x="160" y="300" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#444">猜 k 的最坏总代价 = k + max(…)</text>

  <!-- arrow down -->
  <path d="M 280 340 L 280 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- min over k -->
  <rect x="80" y="364" width="400" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">dp[i][j] = min over k { k + max(dp[i][k-1], dp[k+1][j]) }</text>
  <text x="280" y="402" text-anchor="middle" font-size="10" fill="#888">你主动选 k 让最坏代价最小</text>
</svg>
