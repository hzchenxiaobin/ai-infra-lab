<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">统计不同回文子序列 —— S[i]==S[j]==c 时的去重三分支</text>
  <path d="M 120 40 Q 280 48 440 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- string row: c . . . c  with i, j markers -->
  <text x="44" y="80" font-size="12" fill="#888" font-weight="bold">S</text>
  <g filter="url(#rough2)">
    <rect x="86" y="64" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="126" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="166" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="206" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="246" y="64" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
  </g>
  <text x="106" y="84" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">c</text>
  <text x="146" y="84" text-anchor="middle" font-size="12" fill="#888">·</text>
  <text x="186" y="84" text-anchor="middle" font-size="12" fill="#888">·</text>
  <text x="226" y="84" text-anchor="middle" font-size="12" fill="#888">·</text>
  <text x="266" y="84" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">c</text>
  <text x="106" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i</text>
  <text x="266" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j</text>
  <path d="M 290 79 L 318 79" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="84" font-size="12" fill="#4a7a3a" font-weight="bold">端点字符相同 ⇒ 内部回文可「外包 c…c」</text>

  <!-- formula box -->
  <g filter="url(#rough2)">
    <rect x="60" y="108" width="440" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="280" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">朴素：每个内部回文 p 可作 p 或 c+p+c ⇒ 2·dp[i+1][j−1]</text>
  <text x="280" y="146" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">但「c」「cc」是否已被内部计入 ⇒ 看 (i,j) 内有几个 c</text>

  <text x="280" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">按 (i,j) 内部字符 c 的出现次数分三种情形</text>
  <path d="M 150 188 Q 280 194 410 188" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- Case A: no c inside -->
  <g filter="url(#rough2)">
    <rect x="36" y="200" width="160" height="180" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,3"/>
  </g>
  <text x="116" y="222" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">A. 内部无 c</text>
  <g filter="url(#rough2)">
    <rect x="60" y="232" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <rect x="84" y="232" width="22" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="108" y="232" width="22" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="132" y="232" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
  </g>
  <text x="71" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c</text>
  <text x="143" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c</text>
  <text x="116" y="282" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">+2</text>
  <text x="50" y="304" font-size="11" fill="#666">「c」「cc」均全新</text>
  <text x="50" y="324" font-size="11" fill="#888">内部无 c 故单字符</text>
  <text x="50" y="340" font-size="11" fill="#888">c 与 c c 未被计入</text>
  <text x="50" y="362" font-size="11.5" fill="#d6a040" font-weight="bold">2·dp[i+1][j−1] + 2</text>

  <!-- Case B: exactly one c inside -->
  <g filter="url(#rough2)">
    <rect x="204" y="200" width="160" height="180" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5,3"/>
  </g>
  <text x="284" y="222" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">B. 内部恰 1 个 c</text>
  <g filter="url(#rough2)">
    <rect x="228" y="232" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <rect x="252" y="232" width="22" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="276" y="232" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="300" y="232" width="22" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
  </g>
  <text x="239" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c</text>
  <text x="287" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c</text>
  <text x="311" y="248" text-anchor="middle" font-size="10" fill="#888">c</text>
  <text x="284" y="282" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">+1</text>
  <text x="218" y="304" font-size="11" fill="#666">「c」已被内部计入</text>
  <text x="218" y="324" font-size="11" fill="#666">「cc」是全新的</text>
  <text x="218" y="340" font-size="11" fill="#888">(用 i 与内部 c)</text>
  <text x="218" y="362" font-size="11.5" fill="#4a7a3a" font-weight="bold">2·dp[i+1][j−1] + 1</text>

  <!-- Case C: two or more c inside -->
  <g filter="url(#rough2)">
    <rect x="372" y="200" width="160" height="180" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3"/>
  </g>
  <text x="452" y="222" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">C. 内部 ≥2 个 c</text>
  <g filter="url(#rough2)">
    <rect x="396" y="232" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <rect x="420" y="232" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="444" y="232" width="22" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="468" y="232" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
  </g>
  <text x="407" y="248" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">c</text>
  <text x="431" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c</text>
  <text x="479" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c</text>
  <text x="431" y="266" text-anchor="middle" font-size="10" fill="#888">low</text>
  <text x="479" y="266" text-anchor="middle" font-size="10" fill="#888">high</text>
  <text x="452" y="288" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">−dp[low+1][high−1]</text>
  <text x="386" y="312" font-size="11" fill="#666">「c」「cc」已在内部</text>
  <text x="386" y="330" font-size="11" fill="#b85450" font-weight="bold">但 c+p+c 会与内部</text>
  <text x="386" y="346" font-size="11" fill="#b85450" font-weight="bold">c+q+c 重复 ⇒ 去重</text>
  <text x="386" y="368" font-size="11" fill="#888">2·dp[i+1][j−1] − …</text>

  <text x="280" y="406" text-anchor="middle" font-size="11.5" fill="#888" font-style="italic">口诀：端点同字符，外包翻倍；内部 c 的个数决定 +2 / +1 / −去重</text>
</svg>
