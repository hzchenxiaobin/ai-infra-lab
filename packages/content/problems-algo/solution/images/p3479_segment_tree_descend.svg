<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">核心观察：最大值线段树上自顶向下走，天然命中最左侧可用篮子</text>

  <!-- fruit box -->
  <rect x="28" y="34" width="104" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="50" text-anchor="middle" font-size="11" fill="#7a4a2b" filter="url(#rough2)">当前水果 f = 4</text>

  <!-- invariant note -->
  <text x="430" y="44" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">结点存：区间内未用篮子的最大容量</text>

  <!-- arrow fruit -> root -->
  <path d="M132,46 C 190,26 262,30 316,52" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- grey edges -->
  <path d="M330,87 L205,140" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M330,87 L415,140" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M205,170 L140,230" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M205,170 L270,230" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M415,170 L350,230" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M415,170 L480,230" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- descend path -->
  <path d="M330,87 L208,137" stroke="#d6a040" stroke-width="2.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M205,170 L267,227" stroke="#d6a040" stroke-width="2.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- root -->
  <rect x="306" y="57" width="48" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="72" text-anchor="middle" font-size="14" fill="#33506e" filter="url(#rough2)">5</text>
  <text x="330" y="83" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">[0,3]</text>

  <!-- level 2 -->
  <rect x="181" y="140" width="48" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="155" text-anchor="middle" font-size="14" fill="#33506e" filter="url(#rough2)">5</text>
  <text x="205" y="166" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">[0,1]</text>

  <rect x="391" y="140" width="48" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="155" text-anchor="middle" font-size="14" fill="#33506e" filter="url(#rough2)">4</text>
  <text x="415" y="166" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">[2,3]</text>

  <!-- leaves -->
  <rect x="116" y="230" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="249" text-anchor="middle" font-size="13" fill="#33506e" filter="url(#rough2)">3</text>
  <text x="140" y="276" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">baskets[0]</text>

  <rect x="246" y="230" width="48" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="270" y="249" text-anchor="middle" font-size="13" fill="#7a2f2b" filter="url(#rough2)">5</text>
  <text x="270" y="276" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">baskets[1] ← 命中</text>

  <rect x="326" y="230" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="249" text-anchor="middle" font-size="13" fill="#33506e" filter="url(#rough2)">4</text>
  <text x="350" y="276" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">baskets[2]</text>

  <rect x="456" y="230" width="48" height="30" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="480" y="249" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="480" y="276" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">补位叶（恒 0）</text>

  <!-- rejected marks -->
  <text x="378" y="116" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="452" y="122" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">左子满足 → 整棵跳过</text>
  <text x="170" y="200" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="148" y="214" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">3 &lt; 4</text>

  <!-- hit callout -->
  <text x="270" y="222" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">最左满足者 = 它</text>

  <!-- separator -->
  <path d="M30,292 L490,292" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- legend -->
  <text x="40" y="308" font-size="10" fill="#333" filter="url(#rough2)">① 先看根：max = 5 ≥ 4，树里存在装得下的篮子，从根出发</text>
  <text x="40" y="328" font-size="10" fill="#333" filter="url(#rough2)">② 每层先试左子树：左子 max ≥ f 就往左——更左的优先，右子整棵跳过</text>
  <text x="40" y="348" font-size="10" fill="#333" filter="url(#rough2)">③ 到叶子层：左叶 3 &lt; 4 ✗，换右叶 5 ≥ 4 ✓，落在 baskets[1]</text>
  <text x="40" y="368" font-size="10" fill="#333" filter="url(#rough2)">④ 占用后叶子置 0（恒小于任何 f ≥ 1），祖先回溯：[0,1] 的 max 5 → 3</text>
</svg>
