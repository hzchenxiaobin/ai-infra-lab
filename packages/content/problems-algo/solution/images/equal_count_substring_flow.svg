<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 720" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="720" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：枚举种类数 i → 定长 k → 滑窗维护 t</text>

  <ellipse cx="240" cy="62" rx="55" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 240 80 L 240 98" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="100" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i ← 1</text>
  <path d="M 240 130 L 240 148" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="150" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k ← i × count</text>
  <path d="M 240 180 L 240 198" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="240,200 312,232 240,264 168,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="236" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">k &gt; n ?</text>
  <text x="318" y="228" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="248" y="278" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 312 232 L 380 232" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="470" cy="232" rx="78" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="237" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">break → 返回 ans</text>
  <path d="M 240 264 L 240 288" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="290" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="310" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">j ← 0;  cnt ← 0;  t ← 0</text>
  <path d="M 240 320 L 240 338" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="118" y="340" width="244" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="360" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">加入 s[j]: cnt[c]++, 更新 t</text>
  <text x="240" y="378" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">若 j ≥ k: 移出 s[j−k], 更新 t</text>
  <text x="240" y="396" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">若 j ≥ k−1 且 t = i:  ans++</text>
  <path d="M 240 402 L 240 420" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="422" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="442" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j ← j + 1</text>
  <path d="M 240 452 L 240 470" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="240,472 312,504 240,536 168,504" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="508" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">j &lt; n ?</text>
  <text x="160" y="500" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="248" y="550" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 168 504 L 70 504 L 70 371 L 118 371" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="74" y="438" font-size="10" fill="#4a7a3a" filter="url(#rough2)">内层循环</text>
  <path d="M 240 536 L 240 558" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="560" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="580" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i ← i + 1</text>
  <path d="M 240 590 L 240 608" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="240,610 312,642 240,674 168,642" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="646" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">i ≤ 26 ?</text>
  <text x="318" y="638" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="248" y="690" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 312 642 L 510 642 L 510 165 L 350 165" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="400" font-size="10" fill="#4a7a3a" filter="url(#rough2)">外层循环</text>
  <path d="M 240 674 L 240 696" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="240" cy="708" rx="70" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="713" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
