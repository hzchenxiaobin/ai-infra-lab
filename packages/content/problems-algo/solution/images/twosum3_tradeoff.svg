<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#fafafa"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">两数之和 III：add / find 的复杂度权衡</text>
  <path d="M 280 42 Q 450 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="450" y="68" text-anchor="middle" font-size="12" fill="#666">核心矛盾：add 和 find 不能同时 O(1)，必须根据调用频率做取舍</text>

  <!-- 左侧：HashMap 方案 -->
  <g filter="url(#sk)">
    <rect x="30" y="88" width="390" height="330" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="225" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">方案 A：HashMap 计数</text>
  <text x="225" y="132" text-anchor="middle" font-size="11" fill="#555">适合 add 频繁、find 较少</text>

  <g filter="url(#sk2)">
    <rect x="55" y="150" width="140" height="36" rx="6" fill="#fff" stroke="#446688"/>
  </g>
  <text x="125" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">add: O(1)</text>
  <text x="225" y="173" font-size="10" fill="#666">map[num]++</text>

  <g filter="url(#sk2)">
    <rect x="55" y="196" width="140" height="36" rx="6" fill="#fff" stroke="#446688"/>
  </g>
  <text x="125" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">find: O(n)</text>
  <text x="225" y="219" font-size="10" fill="#666">遍历 map 查 complement</text>

  <g filter="url(#sk2)">
    <rect x="55" y="248" width="340" height="76" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-dasharray="4 3"/>
  </g>
  <text x="225" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">find 逻辑</text>
  <text x="72" y="290" font-size="11" fill="#444">for key in map:</text>
  <text x="90" y="306" font-size="11" fill="#444">comp = value - key</text>
  <text x="90" y="320" font-size="11" fill="#444">comp in map &amp;&amp; (comp≠key || map[key]&gt;1)</text>

  <g filter="url(#sk2)">
    <rect x="55" y="336" width="340" height="66" rx="6" fill="#eaf6ee" stroke="#4a8e4a"/>
  </g>
  <text x="72" y="358" font-size="11" font-weight="bold" fill="#2e6e2e">优点</text>
  <text x="72" y="376" font-size="10" fill="#444">• add 只做一次哈希自增，极快</text>
  <text x="72" y="392" font-size="10" fill="#444">• 不预计算，空间 O(n) 不膨胀</text>

  <!-- 右侧：预计算 sums 方案 -->
  <g filter="url(#sk)">
    <rect x="470" y="88" width="390" height="330" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="665" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">方案 B：预计算所有两数和</text>
  <text x="665" y="132" text-anchor="middle" font-size="11" fill="#555">适合 find 频繁、add 较少</text>

  <g filter="url(#sk2)">
    <rect x="495" y="150" width="140" height="36" rx="6" fill="#fff" stroke="#c98a2b"/>
  </g>
  <text x="565" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">add: O(n)</text>
  <text x="665" y="173" font-size="10" fill="#666">与所有已有数配对入 sum_set</text>

  <g filter="url(#sk2)">
    <rect x="495" y="196" width="140" height="36" rx="6" fill="#fff" stroke="#c98a2b"/>
  </g>
  <text x="565" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">find: O(1)</text>
  <text x="665" y="219" font-size="10" fill="#666">value in sum_set</text>

  <g filter="url(#sk2)">
    <rect x="495" y="248" width="340" height="76" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-dasharray="4 3"/>
  </g>
  <text x="665" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">add 逻辑</text>
  <text x="512" y="290" font-size="11" fill="#444">for x in nums:</text>
  <text x="530" y="306" font-size="11" fill="#444">sum_set.add(x + number)</text>
  <text x="530" y="320" font-size="11" fill="#444">nums.append(number)</text>

  <g filter="url(#sk2)">
    <rect x="495" y="336" width="340" height="66" rx="6" fill="#eaf6ee" stroke="#4a8e4a"/>
  </g>
  <text x="512" y="358" font-size="11" font-weight="bold" fill="#2e6e2e">优点</text>
  <text x="512" y="376" font-size="10" fill="#444">• find 只查一次 set，极快</text>
  <text x="512" y="392" font-size="10" fill="#444">• 预计算换查询，适合 find 占主导</text>

  <!-- 中间箭头 -->
  <text x="450" y="250" text-anchor="middle" font-size="28" fill="#999">⇄</text>
  <text x="450" y="270" text-anchor="middle" font-size="10" fill="#999">权衡</text>

  <!-- 底部总结 -->
  <g filter="url(#sk2)">
    <rect x="30" y="432" width="830" height="20" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
  </g>
  <text x="445" y="446" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a2828">面试默认选方案 A（HashMap），因为它 add O(1) 且不膨胀空间；只在「find 远多于 add」时才切换到方案 B</text>
</svg>
