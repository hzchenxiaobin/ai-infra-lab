<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：逐位取两个方向代价的较小者</text>

  <!-- 示例 1 表格 -->
  <text x="40" y="52" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：s = "abab" → t = "baba"（nextCost[0]=100，prevCost=[1,100,0,…]）</text>

  <rect x="36" y="62" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="70" y="62" width="72" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">s→t</text>
  <rect x="142" y="62" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="80" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">next 顺时针</text>
  <rect x="262" y="62" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="80" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">prev 逆时针</text>
  <rect x="382" y="62" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="432" y="80" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">取 min</text>

  <rect x="36" y="92" width="34" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="53" y="111" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="70" y="92" width="72" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="111" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">a → b</text>
  <rect x="142" y="92" width="120" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="111" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">100（1 步）</text>
  <rect x="262" y="92" width="120" height="30" fill="#ffffff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="111" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1（25 步）✓</text>
  <rect x="382" y="92" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="111" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="36" y="124" width="34" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="53" y="143" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="70" y="124" width="72" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="143" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">b → a</text>
  <rect x="142" y="124" width="120" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="143" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0（25 步）✓</text>
  <rect x="262" y="124" width="120" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="143" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">100（1 步）</text>
  <rect x="382" y="124" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="143" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="36" y="156" width="34" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="53" y="175" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="70" y="156" width="72" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="175" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">a → b</text>
  <rect x="142" y="156" width="120" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="175" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">100（1 步）</text>
  <rect x="262" y="156" width="120" height="30" fill="#ffffff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="175" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1（25 步）✓</text>
  <rect x="382" y="156" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="175" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="36" y="188" width="34" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="53" y="207" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="70" y="188" width="72" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="207" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">b → a</text>
  <rect x="142" y="188" width="120" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="207" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0（25 步）✓</text>
  <rect x="262" y="188" width="120" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="207" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">100（1 步）</text>
  <rect x="382" y="188" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="207" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="36" y="222" width="446" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="432" y="241" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = 2</text>
  <text x="106" y="241" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">合计：短的不一定便宜！</text>
  <text x="322" y="241" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">1 + 0 + 1 + 0</text>

  <!-- 示例 2 -->
  <text x="40" y="282" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：s = "leet" → t = "code"（所有代价为 1，代价 = 步数）</text>

  <rect x="36" y="294" width="100" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="86" y="314" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">l → c</text>
  <text x="86" y="330" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">min(17, 9) = 9</text>
  <text x="86" y="343" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">（逆 9 步更短）</text>

  <rect x="148" y="294" width="100" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="198" y="314" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">e → o</text>
  <text x="198" y="330" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">min(10, 16) = 10</text>
  <text x="198" y="343" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">（顺 10 步更短）</text>

  <rect x="260" y="294" width="100" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="310" y="314" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">e → d</text>
  <text x="310" y="330" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">min(25, 1) = 1</text>
  <text x="310" y="343" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">（退 1 步就到）</text>

  <rect x="372" y="294" width="100" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="422" y="314" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">t → e</text>
  <text x="422" y="330" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">min(11, 15) = 11</text>
  <text x="422" y="343" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">（顺 11 步更短）</text>

  <rect x="36" y="354" width="446" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="259" y="375" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = 9 + 10 + 1 + 11 = 31</text>
</svg>
