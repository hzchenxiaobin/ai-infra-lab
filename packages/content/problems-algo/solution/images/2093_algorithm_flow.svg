<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">分层 Dijkstra 算法流程</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">状态 (d, u, k) = (累计费用, 当前城市, 已用券数)</text>

  <!-- 1. init -->
  <rect x="50" y="58" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="170" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">建邻接表 adj</text>
  <text x="170" y="94" text-anchor="middle" font-size="11" fill="#446688">dist[0][0]=0；堆压入 (0,0,0)</text>

  <path d="M 170 104 L 170 128" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. heap empty? -->
  <polygon points="170,132 246,166 170,200 94,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="170" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">堆空？</text>

  <!-- Yes -> return -1 -->
  <path d="M 246 166 L 350 166" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="296" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="350" y="148" width="180" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="440" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 -1（不可达）</text>

  <!-- No down -->
  <path d="M 170 200 L 170 224" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="216" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 3. pop -->
  <rect x="50" y="228" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="170" y="250" text-anchor="middle" font-size="11" fill="#446688">弹出堆顶 (d, u, k)</text>

  <path d="M 170 262 L 170 286" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. prune -->
  <polygon points="170,290 258,324 170,358 82,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="320" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">d &gt; dist[u][k]?</text>
  <text x="170" y="336" text-anchor="middle" font-size="9" fill="#888">（已有更优途径）</text>

  <!-- Yes -> skip, loop back via far left -->
  <path d="M 82 324 Q 24 324 24 166 Q 24 132 94 166" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="34" y="248" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <text x="34" y="262" font-size="9" fill="#888">跳过</text>

  <!-- No down -->
  <path d="M 170 358 L 170 382" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="374" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 5. goal? -->
  <polygon points="170,386 246,418 170,450 94,418" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="414" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">u == n-1?</text>
  <text x="170" y="430" text-anchor="middle" font-size="9" fill="#888">（到达终点）</text>

  <!-- Yes -> return d -->
  <path d="M 246 418 L 350 418" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="296" y="410" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="350" y="400" width="180" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="424" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 d ✓ 最优解</text>

  <!-- No down to expand -->
  <path d="M 170 450 L 170 472" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="466" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 6. expand -->
  <rect x="50" y="474" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="170" y="490" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">∀(v,w)∈adj[u]：</text>
  <text x="170" y="506" text-anchor="middle" font-size="9" fill="#666">不用券→(v,k)；用券→(v,k+1)</text>

  <!-- loop back from expand right up to heap-empty -->
  <path d="M 290 494 Q 540 494 540 166 Q 540 132 246 150" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="548" y="330" font-size="9" fill="#888" transform="rotate(-90 548 330)">更新 dist、压堆，回循环</text>
</svg>
