<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#666" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">状压 DP 流程：子集枚举求最少结算笔数</text>

  <!-- Step 1: compute balance -->
  <rect x="170" y="46" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="68" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">遍历 transactions，累加每人净额 balance</text>
  <path d="M 310 80 L 310 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: collect debts -->
  <rect x="170" y="100" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="122" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">收集非零净额 → debts[]，记 n = |debts|</text>
  <path d="M 310 134 L 310 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: precompute sum[mask] -->
  <rect x="170" y="154" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="176" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">预处理 sum[mask]：子集净额之和</text>
  <path d="M 310 188 L 310 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: sum == 0? -->
  <polygon points="310,208 400,240 310,272 220,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="237" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">sum[mask]</text>
  <text x="310" y="253" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">== 0 ?</text>

  <!-- No branch -->
  <path d="M 400 240 L 460 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="234" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="462" y="224" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="522" y="246" text-anchor="middle" font-size="11" fill="#b85450">跳过（不可结清）</text>

  <!-- Yes branch -->
  <path d="M 310 272 L 310 290" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="286" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 4: init dp -->
  <rect x="170" y="292" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="314" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">dp[mask] = popcount(mask) − 1</text>
  <path d="M 310 326 L 310 344" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: enumerate submasks -->
  <rect x="120" y="346" width="380" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="366" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">枚举 mask 的归零真子集 sub</text>
  <text x="310" y="382" text-anchor="middle" font-size="10.8" fill="#666">dp[mask] = min(dp[mask], dp[sub] + dp[mask∖sub])</text>
  <path d="M 310 390 L 310 408" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="170" y="410" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="432" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 dp[(1&lt;&lt;n) − 1]</text>

  <!-- side note -->
  <rect x="40" y="292" width="110" height="60" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="95" y="310" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">子集枚举</text>
  <text x="95" y="326" text-anchor="middle" font-size="10" fill="#888">sub=(mask-1)</text>
  <text x="95" y="340" text-anchor="middle" font-size="10" fill="#888">&amp; mask</text>
  <text x="95" y="354" text-anchor="middle" font-size="9.5" fill="#888">遍历真子集</text>
</svg>
