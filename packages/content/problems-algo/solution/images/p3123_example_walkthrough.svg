<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 535" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="535" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1：d0 = [0,4,1,2,7,5]，d1 = [5,1,4,3,2,0]，D = 5（绿色实线 = 在最短路上）</text>

  <!-- ===== graph ===== -->
  <!-- true edges: green solid -->
  <line x1="50" y1="145" x2="160" y2="80" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="103" y="106" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <line x1="50" y1="145" x2="160" y2="220" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="98" y="192" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <line x1="160" y1="80" x2="280" y2="155" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="222" y="112" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>

  <line x1="160" y1="220" x2="280" y2="155" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="198" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <line x1="160" y1="80" x2="435" y2="110" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="88" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <line x1="280" y1="155" x2="435" y2="110" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="146" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- false edges: red dashed -->
  <line x1="160" y1="80" x2="305" y2="50" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="235" y="58" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <line x1="305" y1="50" x2="435" y2="110" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="372" y="72" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- nodes -->
  <circle cx="50" cy="145" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="50" y="150" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="50" y="180" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">d0=0 d1=5</text>

  <circle cx="160" cy="80" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="150" y="56" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">d0=4 d1=1</text>

  <circle cx="160" cy="220" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="225" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="160" y="252" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">d0=1 d1=4</text>

  <circle cx="280" cy="155" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="160" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="280" y="188" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">d0=2 d1=3</text>

  <circle cx="305" cy="50" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="305" y="55" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="328" y="42" text-anchor="start" font-size="9" fill="#666" filter="url(#rough2)">d0=7 d1=2</text>

  <circle cx="435" cy="110" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="435" y="115" text-anchor="middle" font-size="12" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="435" y="142" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">d0=5 d1=0</text>

  <!-- three shortest paths -->
  <rect x="30" y="254" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">三条最短路（总长均为 5）：0→1→5 ／ 0→2→3→5 ／ 0→2→3→1→5；红色虚线不在其上</text>

  <!-- ===== check table ===== -->
  <rect x="30" y="292" width="460" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="48" y="306" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="112" y="306" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">边 (a,b,w)</text>
  <text x="295" y="306" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">判定：d0[·]+w+d1[·] 对比 D=5</text>
  <text x="462" y="306" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">answer</text>

  <line x1="75" y1="292" x2="75" y2="488" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="292" x2="160" y2="488" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="420" y1="292" x2="420" y2="488" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0 -->
  <rect x="31" y="312" width="458" height="21" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="48" y="326" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="112" y="326" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(0,1,4)</text>
  <text x="295" y="326" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">0+4+1 = 5 ✓</text>
  <text x="462" y="326" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T</text>

  <!-- row 1 -->
  <rect x="31" y="333" width="458" height="21" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="48" y="347" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="112" y="347" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(0,2,1)</text>
  <text x="295" y="347" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">0+1+4 = 5 ✓</text>
  <text x="462" y="347" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T</text>

  <!-- row 2 -->
  <rect x="31" y="354" width="458" height="21" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="48" y="368" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="112" y="368" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(1,3,2)</text>
  <text x="295" y="368" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">4+2+3=9 ✗ ／ 2+2+1=5 ✓</text>
  <text x="462" y="368" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T</text>

  <!-- row 3 -->
  <rect x="31" y="375" width="458" height="21" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="48" y="389" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="112" y="389" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(1,4,3)</text>
  <text x="295" y="389" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">4+3+2=9 ✗ ／ 7+3+1=11 ✗</text>
  <text x="462" y="389" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">F</text>

  <!-- row 4 -->
  <rect x="31" y="396" width="458" height="21" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="48" y="410" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="112" y="410" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(1,5,1)</text>
  <text x="295" y="410" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">4+1+0 = 5 ✓</text>
  <text x="462" y="410" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T</text>

  <!-- row 5 -->
  <rect x="31" y="417" width="458" height="21" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="48" y="431" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="112" y="431" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(2,3,1)</text>
  <text x="295" y="431" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">1+1+3 = 5 ✓</text>
  <text x="462" y="431" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T</text>

  <!-- row 6 -->
  <rect x="31" y="438" width="458" height="21" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="48" y="452" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="112" y="452" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(3,5,3)</text>
  <text x="295" y="452" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">2+3+0 = 5 ✓</text>
  <text x="462" y="452" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T</text>

  <!-- row 7 -->
  <rect x="31" y="459" width="458" height="21" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="48" y="473" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="112" y="473" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(4,5,2)</text>
  <text x="295" y="473" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">7+2+0=9 ✗ ／ 5+2+2=9 ✗</text>
  <text x="462" y="473" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">F</text>

  <rect x="30" y="480" width="460" height="8" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="260" y="514" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">两个方向都拼不出 5 的只有 e3、e7 ⇒ [true,true,true,false,true,true,true,false]</text>
</svg>
