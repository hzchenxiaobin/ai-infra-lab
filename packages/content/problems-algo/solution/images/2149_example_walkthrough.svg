<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：nums = [3, 1, −2, −5, 2, −4]</text>

  <!-- ===== Step table ===== -->
  <text x="40" y="52" font-size="12" fill="#555" font-weight="bold">逐步扫描（posIdx / negIdx 为下次落点）：</text>

  <!-- Table header -->
  <rect x="40" y="62" width="480" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="78" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">步</text>
  <text x="120" y="78" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">x</text>
  <text x="170" y="78" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">符号</text>
  <text x="250" y="78" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">写入</text>
  <text x="340" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">posIdx→</text>
  <text x="450" y="78" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">negIdx→</text>

  <!-- Step 1: x=3 -->
  <rect x="40" y="88" width="480" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="106" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="120" y="106" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="170" y="106" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">+</text>
  <text x="250" y="106" text-anchor="middle" font-size="10.5" fill="#446688" font-family="'Comic Sans MS', monospace">ans[0]=3</text>
  <text x="340" y="106" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">0 → 2</text>
  <text x="450" y="106" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>

  <!-- Step 2: x=1 -->
  <rect x="40" y="118" width="480" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="136" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <text x="120" y="136" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="170" y="136" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">+</text>
  <text x="250" y="136" text-anchor="middle" font-size="10.5" fill="#446688" font-family="'Comic Sans MS', monospace">ans[2]=1</text>
  <text x="340" y="136" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">2 → 4</text>
  <text x="450" y="136" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>

  <!-- Step 3: x=-2 -->
  <rect x="40" y="148" width="480" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="166" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>
  <text x="120" y="166" text-anchor="middle" font-size="10.5" fill="#333">−2</text>
  <text x="170" y="166" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">−</text>
  <text x="250" y="166" text-anchor="middle" font-size="10.5" fill="#b85450" font-family="'Comic Sans MS', monospace">ans[1]=−2</text>
  <text x="340" y="166" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">4</text>
  <text x="450" y="166" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1 → 3</text>

  <!-- Step 4: x=-5 -->
  <rect x="40" y="178" width="480" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="196" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <text x="120" y="196" text-anchor="middle" font-size="10.5" fill="#333">−5</text>
  <text x="170" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">−</text>
  <text x="250" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" font-family="'Comic Sans MS', monospace">ans[3]=−5</text>
  <text x="340" y="196" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">4</text>
  <text x="450" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">3 → 5</text>

  <!-- Step 5: x=2 -->
  <rect x="40" y="208" width="480" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="226" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">5</text>
  <text x="120" y="226" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="170" y="226" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">+</text>
  <text x="250" y="226" text-anchor="middle" font-size="10.5" fill="#446688" font-family="'Comic Sans MS', monospace">ans[4]=2</text>
  <text x="340" y="226" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">4 → 6</text>
  <text x="450" y="226" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">5</text>

  <!-- Step 6: x=-4 (highlighted) -->
  <rect x="40" y="238" width="480" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">6</text>
  <text x="120" y="256" text-anchor="middle" font-size="10.5" fill="#333">−4</text>
  <text x="170" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">−</text>
  <text x="250" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" font-family="'Comic Sans MS', monospace">ans[5]=−4</text>
  <text x="340" y="256" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">6</text>
  <text x="450" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">5 → 7</text>

  <!-- Divider -->
  <path d="M 40 278 L 520 278" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Final result array ===== -->
  <text x="280" y="302" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">结果数组 ans（填满）</text>

  <rect x="60" y="314" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="92" y="340" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="92" y="368" text-anchor="middle" font-size="8.5" fill="#446688">0</text>

  <rect x="132" y="314" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="164" y="340" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−2</text>
  <text x="164" y="368" text-anchor="middle" font-size="8.5" fill="#b85450">1</text>

  <rect x="204" y="314" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="236" y="340" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="236" y="368" text-anchor="middle" font-size="8.5" fill="#446688">2</text>

  <rect x="276" y="314" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="308" y="340" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−5</text>
  <text x="308" y="368" text-anchor="middle" font-size="8.5" fill="#b85450">3</text>

  <rect x="348" y="314" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="380" y="340" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="380" y="368" text-anchor="middle" font-size="8.5" fill="#446688">4</text>

  <rect x="420" y="314" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="452" y="340" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−4</text>
  <text x="452" y="368" text-anchor="middle" font-size="8.5" fill="#b85450">5</text>

  <!-- Divider -->
  <path d="M 40 386 L 520 386" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Invariant note ===== -->
  <rect x="40" y="398" width="480" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="420" font-size="11.5" fill="#333" font-weight="bold">保序不变式：同号元素按扫描顺序依次落位</text>
  <text x="56" y="440" font-size="11" fill="#555">• 正数依次写入 idx 0, 2, 4 → 正序 3, 1, 2 ✓</text>
  <text x="300" y="440" font-size="11" fill="#555">• 负数依次写入 idx 1, 3, 5 → 正序 −2, −5, −4 ✓</text>

  <!-- Result -->
  <rect x="40" y="472" width="480" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="494" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">答案 = [3, −2, 1, −5, 2, −4]</text>
  <text x="280" y="512" text-anchor="middle" font-size="10.5" fill="#888">posIdx=negIdx 同步到 n，正负各 n/2 个恰好填满</text>
</svg>
