<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "00110011"，逐字符推进 prev/cur</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">三次跳变各贡献 min(2,2)=2，收尾再补 min(2,2)=2，合计 0+2+2+2 = 6</text>

  <!-- ===== Header row ===== -->
  <rect x="40" y="58" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="90"  y1="58" x2="90"  y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="140" y1="58" x2="140" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="340" y1="58" x2="340" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="400" y1="58" x2="400" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="460" y1="58" x2="460" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#3a4a66" font-weight="bold">
    <text x="65"  y="78" text-anchor="middle">i</text>
    <text x="115" y="78" text-anchor="middle">s[i]</text>
    <text x="240" y="78" text-anchor="middle">事件</text>
    <text x="370" y="78" text-anchor="middle">prev</text>
    <text x="430" y="78" text-anchor="middle">cur</text>
    <text x="500" y="78" text-anchor="middle">ans</text>
  </g>

  <!-- ===== Data rows (9 rows, 32 tall, start y=88) ===== -->
  <!-- init -->
  <rect x="40" y="88" width="500" height="32" fill="#f7f9fc" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65"  y="109" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="115" y="109" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="240" y="109" text-anchor="middle" font-size="10.5" fill="#555">初始：prev=0, cur=1</text>
  <text x="370" y="109" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="430" y="109" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="500" y="109" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- i=1 -->
  <rect x="40" y="120" width="500" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65"  y="141" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="115" y="141" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="240" y="141" text-anchor="middle" font-size="10.5" fill="#555">同段延续 cur++</text>
  <text x="370" y="141" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="430" y="141" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="500" y="141" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- i=2 jump (contributes 0) -->
  <rect x="40" y="152" width="500" height="32" fill="#f7f9fc" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65"  y="173" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="115" y="173" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="240" y="173" text-anchor="middle" font-size="10" fill="#555">跳变：ans+=min(0,2)=0；prev=2,cur=1</text>
  <text x="370" y="173" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="430" y="173" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="500" y="173" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- i=3 -->
  <rect x="40" y="184" width="500" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65"  y="205" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="115" y="205" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="240" y="205" text-anchor="middle" font-size="10.5" fill="#555">同段延续 cur++</text>
  <text x="370" y="205" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="430" y="205" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="500" y="205" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- i=4 jump (contributes 2) highlight -->
  <rect x="40" y="216" width="500" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="65"  y="237" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="115" y="237" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="240" y="237" text-anchor="middle" font-size="10" fill="#555">跳变：ans+=min(2,2)=2；prev=2,cur=1</text>
  <text x="370" y="237" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="430" y="237" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="500" y="237" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- i=5 -->
  <rect x="40" y="248" width="500" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65"  y="269" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="115" y="269" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="240" y="269" text-anchor="middle" font-size="10.5" fill="#555">同段延续 cur++</text>
  <text x="370" y="269" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="430" y="269" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="500" y="269" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- i=6 jump (contributes 2) highlight -->
  <rect x="40" y="280" width="500" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="65"  y="301" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="115" y="301" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="240" y="301" text-anchor="middle" font-size="10" fill="#555">跳变：ans+=min(2,2)=2；prev=2,cur=1</text>
  <text x="370" y="301" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="430" y="301" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="500" y="301" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>

  <!-- i=7 -->
  <rect x="40" y="312" width="500" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65"  y="333" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="115" y="333" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="240" y="333" text-anchor="middle" font-size="10.5" fill="#555">同段延续 cur++</text>
  <text x="370" y="333" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="430" y="333" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="500" y="333" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- 终止 收尾 highlight green -->
  <rect x="40" y="344" width="500" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="65"  y="365" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="115" y="365" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="240" y="365" text-anchor="middle" font-size="10" fill="#3a5a2a">收尾：ans+=min(2,2)=2</text>
  <text x="370" y="365" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="430" y="365" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="500" y="365" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6 ✓</text>

  <!-- column separators for data rows -->
  <g stroke="#dddddd" stroke-width="1">
    <line x1="90"  y1="88" x2="90"  y2="376" filter="url(#rough2)"/>
    <line x1="140" y1="88" x2="140" y2="376" filter="url(#rough2)"/>
    <line x1="340" y1="88" x2="340" y2="376" filter="url(#rough2)"/>
    <line x1="400" y1="88" x2="400" y2="376" filter="url(#rough2)"/>
    <line x1="460" y1="88" x2="460" y2="376" filter="url(#rough2)"/>
  </g>

  <!-- ===== Summary ===== -->
  <rect x="40" y="388" width="500" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="408" font-size="10.5" fill="#555">• i=2 首次跳变 min(0,2)=0（prev=0 不贡献）；i=4、i=6 各 +2；收尾再 +2</text>
  <text x="60" y="424" font-size="10.5" fill="#4a7a3a" font-weight="bold">• 累计 ans = 0 + 2 + 2 + 2 = 6 ✓   关键：收尾补刀贡献了最后的 min(2,2)=2</text>
</svg>
