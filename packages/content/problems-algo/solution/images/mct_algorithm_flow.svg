<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.2"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="490" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="330" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">叶值最小代价生成树：算法流程</text>
  <path d="M 200 34 Q 330 42 460 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Node 1: Start -->
  <g filter="url(#sk2)"><ellipse cx="220" cy="56" rx="50" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="220" y="60" text-anchor="middle" font-size="12" fill="#2b2b2b">开始</text>
  <path d="M 220 70 L 220 80" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Node 2: Init maxLeaf & dp -->
  <g filter="url(#sk2)"><rect x="110" y="82" width="220" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="220" y="100" text-anchor="middle" font-size="11" fill="#2b2b2b">maxLeaf[i][i] = arr[i], dp[i][i] = 0</text>
  <text x="220" y="116" text-anchor="middle" font-size="10" fill="#666">dp 其余置 ∞</text>
  <path d="M 220 126 L 220 136" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Node 3: len <= n? (diamond) -->
  <g filter="url(#sk2)"><polygon points="220,138 270,168 220,198 170,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="220" y="172" text-anchor="middle" font-size="11" fill="#5a4a1a" font-weight="bold">len ≤ n ?</text>

  <!-- Node 3 No -> Return -->
  <path d="M 270 168 L 468 168" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="366" y="162" text-anchor="middle" font-size="10" fill="#888">否</text>
  <g filter="url(#sk2)"><rect x="468" y="151" width="130" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="533" y="173" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">返回 dp[0][n-1]</text>

  <!-- Node 3 Yes -> down -->
  <path d="M 220 198 L 220 208" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="234" y="206" font-size="10" fill="#888">是</text>

  <!-- Node 4: i loop + j = i+len-1 + update maxLeaf -->
  <g filter="url(#sk2)"><rect x="100" y="210" width="240" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="220" y="228" text-anchor="middle" font-size="11" fill="#2b2b2b">j = i + len - 1</text>
  <text x="220" y="244" text-anchor="middle" font-size="10" fill="#666">maxLeaf[i][j] = max(maxLeaf[i][j-1], arr[j])</text>
  <path d="M 220 254 L 220 264" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Node 5: k < j? (diamond) -->
  <g filter="url(#sk2)"><polygon points="220,266 268,294 220,322 172,294" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="220" y="298" text-anchor="middle" font-size="11" fill="#5a4a1a" font-weight="bold">k &lt; j ?</text>

  <!-- Node 5 No -> i++ / len++ -->
  <path d="M 268 294 L 390 294" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="326" y="288" text-anchor="middle" font-size="10" fill="#888">否</text>
  <g filter="url(#sk2)"><rect x="390" y="277" width="100" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="440" y="299" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">i++; len++</text>

  <!-- loop back up -->
  <path d="M 440 277 L 600 277 L 600 148 L 242 148" stroke="#4a8e4a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="596" y="215" text-anchor="end" font-size="9" fill="#4a8e4a">回外层循环</text>

  <!-- Node 5 Yes -> down -->
  <path d="M 220 322 L 220 332" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="234" y="330" font-size="10" fill="#888">是</text>

  <!-- Node 6: compute cost -->
  <g filter="url(#sk2)"><rect x="80" y="334" width="280" height="50" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="220" y="352" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">cost = dp[i][k] + dp[k+1][j]</text>
  <text x="220" y="370" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">+ maxLeaf[i][k] × maxLeaf[k+1][j]</text>

  <!-- Node 7: dp[i][j] = min -->
  <path d="M 220 384 L 220 394" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="120" y="396" width="200" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="220" y="417" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">dp[i][j] = min(dp[i][j], cost)</text>

  <!-- k++ loop back to k<j -->
  <path d="M 220 428 L 220 440 L 78 440 L 78 294 L 172 294" stroke="#4a8e4a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="92" y="370" font-size="9" fill="#4a8e4a">k++ 继续</text>

  <!-- Legend -->
  <g filter="url(#sk)"><rect x="470" y="340" width="160" height="88" rx="6" fill="#fffdf3" stroke="#bbb" stroke-width="1" stroke-dasharray="5 3"/></g>
  <text x="550" y="360" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">循环层次</text>
  <text x="482" y="378" font-size="9" fill="#446688">━ 外层：len = 2..n</text>
  <text x="482" y="392" font-size="9" fill="#2b6e9e">━ 中层：i = 0..n-len</text>
  <text x="482" y="406" font-size="9" fill="#d6a040">◇ 条件判定</text>
  <text x="482" y="420" font-size="9" fill="#4a8e4a">┄ 内层：k = i..j-1</text>
</svg>
