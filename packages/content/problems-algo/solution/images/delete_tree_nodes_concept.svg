<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：子树和为 0 → 整棵子树删除</text>

  <!-- ===== enclosing dashed boundary around node-2 subtree (to be deleted) ===== -->
  <rect x="262" y="118" width="218" height="148" fill="#fce4ec" fill-opacity="0.35" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4" rx="10" filter="url(#rough2)"/>
  <text x="371" y="112" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">子树和 = 4+(-2)+(-1)+(-1) = 0</text>

  <!-- ===== Tree edges ===== -->
  <line x1="270" y1="78" x2="166" y2="138" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="270" y1="78" x2="374" y2="138" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="166" y1="168" x2="166" y2="222" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="374" y1="168" x2="300" y2="222" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="374" y1="168" x2="374" y2="222" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="374" y1="168" x2="448" y2="222" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- ===== Tree nodes ===== -->
  <!-- node 0 (kept, green) -->
  <circle cx="270" cy="64" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="270" y="69" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="300" y="60" font-size="11" fill="#4a7a3a" font-weight="bold">val=1</text>

  <!-- node 1 (kept, green) -->
  <circle cx="166" cy="152" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="166" y="157" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="118" y="148" font-size="11" fill="#4a7a3a" font-weight="bold">val=-2</text>

  <!-- node 2 (deleted, red) -->
  <circle cx="374" cy="152" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="374" y="157" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="394" y="148" font-size="11" fill="#b85450" font-weight="bold">val=4</text>

  <!-- node 3 (deleted, red) -->
  <circle cx="166" cy="238" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="166" y="243" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="128" y="234" font-size="11" fill="#b85450" font-weight="bold">val=0</text>
  <text x="128" y="276" font-size="10" fill="#b85450">和=0 → 删</text>

  <!-- node 4 (deleted, red) -->
  <circle cx="300" cy="238" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="300" y="243" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="276" y="276" font-size="10" fill="#b85450">val=-2</text>

  <!-- node 5 (deleted, red) -->
  <circle cx="374" cy="238" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="374" y="243" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="354" y="276" font-size="10" fill="#b85450">val=-1</text>

  <!-- node 6 (deleted, red) -->
  <circle cx="448" cy="238" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="448" y="243" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="428" y="276" font-size="10" fill="#b85450">val=-1</text>

  <!-- ===== deletion cross marks ===== -->
  <path d="M 300 222 L 318 256 M 318 222 L 300 256" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 374 222 L 392 256 M 392 222 L 374 256" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 448 222 L 466 256 M 466 222 L 448 256" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- ===== Summary box ===== -->
  <rect x="48" y="320" width="444" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">删除子树 {3} 与 {2,4,5,6} 共 5 个节点</text>
  <text x="270" y="362" text-anchor="middle" font-size="12" fill="#446688">剩余节点 {0, 1} → 答案 = 2</text>
</svg>
