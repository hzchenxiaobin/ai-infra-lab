<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "100"——每换一步，恰好消灭一个逆序对</text>

  <!-- part A: simulate swaps -->
  <text x="40" y="52" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 模拟交换（K = 逆序对个数）：</text>

  <!-- row 1: 100 -->
  <circle cx="60" cy="76" r="15" fill="#446688" stroke="#2f4860" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="81" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="96" cy="76" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="96" y="81" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="132" cy="76" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="132" y="81" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="170" y="81" font-size="11" fill="#555" filter="url(#rough2)">K = 2：( (0,1), (0,2) )</text>

  <path d="M 96 93 L 96 106" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="114" y="105" font-size="10" fill="#888" filter="url(#rough2)">swap(0,1)：消 1 对</text>

  <!-- row 2: 010 -->
  <circle cx="60" cy="124" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="129" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="96" cy="124" r="15" fill="#446688" stroke="#2f4860" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="129" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="132" cy="124" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="132" y="129" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="170" y="129" font-size="11" fill="#555" filter="url(#rough2)">K = 1：(1,2)</text>

  <path d="M 132 141 L 132 154" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="153" font-size="10" fill="#888" filter="url(#rough2)">swap(1,2)：消 1 对</text>

  <!-- row 3: 001 -->
  <circle cx="60" cy="172" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="177" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="96" cy="172" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="96" y="177" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="132" cy="172" r="15" fill="#446688" stroke="#2f4860" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="177" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="170" y="177" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">K = 0 ✓ 共 2 步，与答案一致</text>

  <!-- part B: counting table -->
  <text x="40" y="216" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 一遍扫描直接数（不用真交换，ones = 左边 1 的累计数）：</text>

  <!-- table header -->
  <rect x="90" y="226" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="170" y="226" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="250" y="226" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="350" y="226" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="245" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="210" y="245" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">s[i]</text>
  <text x="300" y="245" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ones</text>
  <text x="390" y="245" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row 1 -->
  <rect x="90" y="254" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="170" y="254" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="250" y="254" width="100" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="350" y="254" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="210" y="272" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="300" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="390" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- row 2 -->
  <rect x="90" y="280" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="170" y="280" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="250" y="280" width="100" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="350" y="280" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="210" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="300" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="390" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0+1 = 1</text>

  <!-- row 3 -->
  <rect x="90" y="306" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="170" y="306" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="250" y="306" width="100" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="350" y="306" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="210" y="324" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="300" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="390" y="324" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1+1 = 2</text>

  <!-- part C: official examples -->
  <rect x="40" y="344" width="440" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">官方示例速验："101" → 遇 0 时 ones=1，ans = 1</text>
  <text x="260" y="382" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"0111" → 任何 1 的右边都没有 0，ans = 0</text>
  <text x="260" y="400" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">口诀：0 左边有几个 1 就加几，加完即为最少步数</text>
</svg>
