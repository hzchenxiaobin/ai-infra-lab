<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="450" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：操作 = 相邻合并成 AND，终态 = 连续段划分</text>
  <text x="310" y="44" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">一次操作：把 nums[i] 和 nums[i+1] 替换为 nums[i] &amp; nums[i+1]，数组长度恰好 −1</text>

  <!-- Section 1: single operation -->
  <text x="44" y="72" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">① 一次操作的复合效果</text>

  <rect x="56" y="84" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a_i</text>
  <text x="124" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">&amp;</text>
  <rect x="134" y="84" width="66" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a_{i+1}</text>

  <path d="M212,99 L258,99" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="235" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1 次操作</text>

  <rect x="266" y="84" width="118" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">a_i &amp; a_{i+1}</text>

  <text x="410" y="98" font-size="11" fill="#333" filter="url(#rough2)">例：5 &amp; 3 = 1（位只减不增）</text>
  <text x="410" y="114" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合并越多次，段值位越少</text>

  <!-- Section 2: partition -->
  <text x="44" y="150" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">② 终态：原数组被切成连续段，每段缩成段内 AND</text>

  <rect x="60" y="162" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="112" y="162" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="164" y="162" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="216" y="162" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="268" y="162" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <text x="86" y="208" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">下标 0</text>
  <text x="294" y="208" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>

  <!-- group brackets -->
  <path d="M60,218 v8 h52 v-8" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M114,218 v8 h100 v-8" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M218,218 v8 h100 v-8" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <text x="86" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="164" y="244" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5&amp;3=1</text>
  <text x="268" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2&amp;7=2</text>

  <path d="M340,196 L378,196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="386" y="164" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="436" y="185" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">终态 [3,1,2]</text>
  <text x="500" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">→</text>
  <rect x="514" y="164" width="76" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="552" y="185" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">OR=3</text>

  <text x="60" y="272" font-size="11" fill="#333" filter="url(#rough2)">段数 m = 3 ⟹ 操作数 = n − m = 5 − 3 = 2 ≤ k ✓（本题 k = 2，恰好用满）</text>

  <!-- Section 3: formulas -->
  <text x="44" y="304" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">③ 问题改写</text>

  <rect x="40" y="316" width="272" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="176" y="338" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">任何操作序列 ⟺ 一种连续段划分</text>
  <text x="176" y="358" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">终态元素 = 段内所有数的 AND</text>

  <rect x="328" y="316" width="252" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="454" y="338" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">操作次数 = n − 段数 m</text>
  <text x="454" y="358" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">至多 k 次操作 ⟺ 至少 n − k 段</text>

  <rect x="40" y="386" width="540" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="407" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">求：至少 n−k 段的划分中，min{ 各段 AND 的按位 OR }</text>
  <text x="310" y="427" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">答案 ⊆ OR(nums) 的位 → 从高位到低位逐位贪心清零（见下一张图）</text>
</svg>
