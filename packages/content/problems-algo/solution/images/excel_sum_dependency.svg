<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单元格依赖图：直接值 vs 求和公式</text>

  <!-- Left: grid with cells -->
  <text x="160" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Excel 网格（3行 × A~C 列）</text>

  <!-- column headers -->
  <text x="110" y="76" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">A</text>
  <text x="150" y="76" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">B</text>
  <text x="190" y="76" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">C</text>
  <text x="86" y="96" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">1</text>
  <text x="86" y="126" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">2</text>
  <text x="86" y="156" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">3</text>

  <!-- A1: direct value cell (blue) -->
  <rect x="90" y="82" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="110" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="110" y="124" text-anchor="middle" font-size="8" fill="#446688">A1 直接值</text>

  <!-- B1: empty cell -->
  <rect x="130" y="82" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="100" text-anchor="middle" font-size="11" fill="#bbb">0</text>

  <!-- A2: empty cell -->
  <rect x="90" y="112" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="130" text-anchor="middle" font-size="11" fill="#bbb">0</text>

  <!-- B2: direct value cell (will be set later, show as orange) -->
  <rect x="130" y="112" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="130" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="150" y="154" text-anchor="middle" font-size="8" fill="#d6a040">B2 直接值</text>

  <!-- C3: sum formula cell (red) -->
  <rect x="170" y="142" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">公式</text>
  <text x="190" y="184" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">C3 = sum(...)</text>

  <!-- Right: formula expanded as refs list -->
  <text x="400" y="54" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">C3 的 refs（展开后）</text>

  <rect x="300" y="62" width="200" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <text x="330" y="82" font-size="10" fill="#555" font-weight="bold">引用</text>
  <text x="430" y="82" font-size="10" fill="#555" font-weight="bold">值</text>
  <line x1="400" y1="68" x2="400" y2="158" stroke="#b85450" stroke-width="0.6" stroke-dasharray="2,2" filter="url(#rough2)"/>

  <rect x="310" y="88" width="70" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="345" y="101" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">A1</text>
  <text x="440" y="101" font-size="10" fill="#446688" font-weight="bold">2</text>

  <rect x="310" y="108" width="70" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="345" y="121" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">A1</text>
  <text x="440" y="121" font-size="10" fill="#446688" font-weight="bold">2</text>

  <rect x="310" y="128" width="70" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="345" y="141" text-anchor="middle" font-size="10" fill="#888">B1</text>
  <text x="440" y="141" font-size="10" fill="#888">0</text>

  <rect x="390" y="88" width="70" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="425" y="101" text-anchor="middle" font-size="10" fill="#888">A2</text>
  <text x="475" y="101" font-size="10" fill="#888">0</text>

  <rect x="390" y="108" width="70" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="425" y="121" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">B2</text>
  <text x="475" y="121" font-size="10" fill="#d6a040" font-weight="bold">2</text>

  <text x="400" y="180" text-anchor="middle" font-size="9" fill="#b85450">A1 出现 2 次 → 累加 2 遍</text>

  <!-- Arrows: C3 refs pointing back to grid cells -->
  <!-- C3 -> A1 (appears twice, show one curved arrow) -->
  <path d="M295 95 C 260 70, 240 70, 200 95" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- C3 -> B2 -->
  <path d="M295 120 C 260 130, 230 130, 200 128" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Bottom: memo box -->
  <text x="280" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">懒求值 + 记忆化：get(C3) 的递归过程</text>

  <!-- memo table -->
  <rect x="40" y="220" width="480" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="240" font-size="10" fill="#4a7a3a" font-weight="bold">memo 哈希表（每次 get 清空，只活在一次调用内）</text>

  <rect x="60" y="248" width="80" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="263" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">A1=2</text>

  <rect x="155" y="248" width="80" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="195" y="263" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">B2=2</text>

  <rect x="250" y="248" width="80" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="263" text-anchor="middle" font-size="10" fill="#888">B1=0</text>

  <rect x="345" y="248" width="80" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="263" text-anchor="middle" font-size="10" fill="#888">A2=0</text>

  <rect x="440" y="248" width="70" height="22" fill="#fff8e1" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="475" y="263" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">C3=6</text>

  <!-- bottom note -->
  <rect x="40" y="302" width="480" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="60" y="324" font-size="10" fill="#333">① <tspan fill="#446688" font-weight="bold">直接值格</tspan>（蓝/橙）：get 直接返回 val，O(1)</text>
  <text x="60" y="342" font-size="10" fill="#333">② <tspan fill="#b85450" font-weight="bold">公式格</tspan>（红）：沿 refs 递归求和，memo 保证每格只算一次</text>
  <text x="60" y="360" font-size="10" fill="#333">③ <tspan fill="#4a7a3a" font-weight="bold">set 只改自己一格</tspan>，不传播 → 下次 get 自动看到新值（懒求值）</text>
  <text x="60" y="376" font-size="10" fill="#333">④ A1 被引用 2 次：第一次算完存 memo，第二次直接查表 → 避免指数爆炸</text>
</svg>
