<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,1,2,4,9]，k = 20</text>

  <!-- termination row background -->
  <rect x="45" y="228" width="430" height="38" fill="#e6f4ea" filter="url(#rough2)"/>

  <!-- grid -->
  <rect x="45" y="48" width="430" height="218" fill="none" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="45" y1="76" x2="475" y2="76" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="45" y1="114" x2="475" y2="114" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="45" y1="152" x2="475" y2="152" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="45" y1="190" x2="475" y2="190" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="45" y1="228" x2="475" y2="228" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="100" y1="48" x2="100" y2="266" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="185" y1="48" x2="185" y2="266" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="260" y1="48" x2="260" y2="266" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="425" y1="48" x2="425" y2="266" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <!-- header -->
  <text x="72" y="65" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">操作</text>
  <text x="142" y="65" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">弹出 x,y</text>
  <text x="222" y="65" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">压入 2x+y</text>
  <text x="342" y="65" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">堆中剩余（红=堆顶）</text>
  <text x="450" y="65" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row 0: initial -->
  <text x="72" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">初始</text>
  <text x="142" y="99" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">—</text>
  <text x="222" y="99" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">—</text>
  <text x="282" y="99" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="312" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="342" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="372" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="402" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="450" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- row 1 -->
  <text x="72" y="137" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="142" y="137" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1, 1</text>
  <text x="222" y="137" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="297" y="137" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="327" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="357" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="387" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="450" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- row 2 -->
  <text x="72" y="175" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="142" y="175" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2, 3</text>
  <text x="222" y="175" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="312" y="175" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="342" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="372" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="450" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- row 3 -->
  <text x="72" y="213" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="142" y="213" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4, 7</text>
  <text x="222" y="213" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">15</text>
  <text x="327" y="213" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="357" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15</text>
  <text x="450" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- row 4 -->
  <text x="72" y="251" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">④</text>
  <text x="142" y="251" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">9, 15</text>
  <text x="222" y="251" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">33</text>
  <text x="342" y="251" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">33</text>
  <text x="450" y="251" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- conclusion banner -->
  <rect x="45" y="274" width="430" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">堆顶 33 ≥ 20 ⇒ 全体达标，停止操作，返回 4</text>

  <!-- notes -->
  <rect x="60" y="316" width="400" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">①②③ 产出的 3、7、15 都被后续轮次再次消费——合并值重新入局；</text>
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">单次合并最大 2×10⁹ + 10⁹ = 3×10⁹，超 int32，C++ 用 long long。</text>

  <!-- example 1 footer -->
  <text x="260" y="384" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">示例 1（k=10）：① 弹 1,2 压 4；② 弹 3,4 压 10；堆顶 10 ≥ 10 → 答案 2</text>
</svg>
