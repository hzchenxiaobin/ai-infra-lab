<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：遍历链表，数「分量起点」</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">一遍遍历 O(n)，哈希集合 O(m) 空间</text>

  <!-- Start: 建集合 -->
  <rect x="170" y="60" width="220" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">set = set(nums), count = 0, prev_in = False</text>

  <path d="M 280 92 L 280 108" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断是否有下一个节点 -->
  <polygon points="280,110 400,152 280,194 160,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">还有节点吗？</text>
  <text x="280" y="162" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">(node != null)</text>

  <!-- No branch (right) -->
  <text x="412" y="156" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 400 152 L 460 152" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="460" y="136" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="14" filter="url(#rough2)"/>
  <text x="500" y="156" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">return count</text>

  <!-- Yes branch (down) -->
  <text x="296" y="210" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 280 194 L 280 216" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断当前值是否在集合 -->
  <polygon points="280,218 400,258 280,298 160,258" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">node.val 在 set 中？</text>
  <text x="280" y="268" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">(cur_in = val ∈ set)</text>

  <!-- Yes: 判断 prev_in -->
  <text x="296" y="314" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 280 298 L 280 320" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,322 390,356 280,390 170,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">prev_in == False？</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">(前驱不在 nums)</text>

  <!-- Yes: count++ -->
  <text x="296" y="404" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 280 390 L 280 410" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="406" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="225" y="425" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">count += 1（新起点）</text>

  <!-- No: 继续当前分量 -->
  <text x="148" y="360" font-size="10" fill="#888" font-weight="bold">否</text>
  <path d="M 170 356 L 120 356 L 120 420" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="64" y="415" font-size="9" fill="#888">续接当前分量</text>

  <!-- 汇合：prev_in = cur_in, node = node.next -->
  <path d="M 300 420 L 330 420" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="406" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="425" y="425" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">prev_in = cur_in; node = node.next</text>

  <!-- 回到顶部循环 -->
  <path d="M 425 406 L 425 130 L 400 130" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="270" font-size="9" fill="#888">继续下一节点</text>
</svg>
