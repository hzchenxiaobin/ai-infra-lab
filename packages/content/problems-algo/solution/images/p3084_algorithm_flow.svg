<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟计数 + 套公式（O(n) 时间 / O(1) 空间）</text>

  <!-- start -->
  <rect x="150" y="40" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="200" y="59" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始 (s, c)</text>
  <path d="M 200 68 L 200 84" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- step 1: count -->
  <rect x="95" y="88" width="210" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="106" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">一趟扫描 s</text>
  <text x="200" y="124" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">统计 c 的出现次数 m</text>
  <path d="M 200 132 L 200 148" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2: formula -->
  <rect x="95" y="152" width="210" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="170" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">res = m × (m + 1) / 2</text>
  <text x="200" y="188" text-anchor="middle" font-size="10.5" fill="#7a8ba6" filter="url(#rough2)">（第 j 个 c 结尾贡献 j，求和）</text>
  <path d="M 200 196 L 200 212" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- end -->
  <rect x="140" y="216" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="200" y="235" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 res</text>

  <!-- alternative: streaming accumulation -->
  <path d="M 307 110 L 328 110" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="332" y="88" width="168" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="416" y="106" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">替代：边扫边累加</text>
  <text x="416" y="123" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">遇 c：m+1 ⟹ ans+m</text>

  <!-- overflow warning -->
  <rect x="318" y="152" width="188" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="412" y="171" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">溢出警报：m ≤ 10⁵</text>
  <text x="412" y="187" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">res ≈ 5×10⁹ &gt; int 上限</text>
  <text x="412" y="203" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">C++ 用 long long</text>

  <!-- bottom notes -->
  <rect x="95" y="262" width="330" height="48" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">m = 0（c 未出现）时公式自然得 0，无需特判</text>
  <text x="260" y="299" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">子串中间的字符不影响合法性</text>
</svg>
