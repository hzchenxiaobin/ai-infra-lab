<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrY" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">猜数字大小：闭区间二分查找流程图</text>

  <!-- start -->
  <rect x="220" y="46" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <!-- init: left=1, right=n -->
  <rect x="170" y="92" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="113" text-anchor="middle" font-size="12" fill="#333">left = 1, right = n</text>

  <!-- diamond: left <= right ? -->
  <polygon points="280,140 400,185 280,230 160,185" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="12" fill="#444">left &lt;= right ?</text>

  <!-- no branch -> not found (problem guarantees pick in [1,n], so unreachable) -->
  <text x="296" y="248" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="170" y="262" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="11.5" fill="#b85450">返回 −1（题面保证不会走到）</text>

  <!-- yes label -->
  <text x="412" y="176" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- mid box: 防溢出写法 -->
  <rect x="406" y="168" width="134" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="473" y="185" text-anchor="middle" font-size="10.5" fill="#333">mid = left +</text>
  <text x="473" y="198" text-anchor="middle" font-size="10.5" fill="#333">(right−left)/2</text>

  <!-- overflow warning note -->
  <rect x="406" y="138" width="134" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="473" y="156" text-anchor="middle" font-size="9.5" fill="#b85450">⚠ 防溢出写法</text>

  <!-- inner diamond: guess(mid) ? -->
  <polygon points="473,222 560,272 473,322 386,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="473" y="266" text-anchor="middle" font-size="10.5" fill="#444">guess(mid)</text>
  <text x="473" y="282" text-anchor="middle" font-size="10.5" fill="#444">? 三段式</text>

  <!-- == 0 -> return mid (found) -->
  <rect x="380" y="344" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="455" y="366" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">return mid ✓</text>
  <text x="430" y="334" font-size="11" fill="#d6a040" font-weight="bold">== 0</text>
  <text x="470" y="334" font-size="9.5" fill="#888">(命中)</text>

  <!-- < 0 (higher): right = mid - 1 -->
  <rect x="220" y="344" width="150" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="295" y="366" text-anchor="middle" font-size="11.5" fill="#b85450">right = mid − 1</text>
  <text x="265" y="334" font-size="11" fill="#b85450" font-weight="bold">&lt; 0</text>
  <text x="300" y="334" font-size="9.5" fill="#888">(猜大了)</text>

  <!-- > 0 (lower): left = mid + 1 -->
  <rect x="48" y="344" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="128" y="366" text-anchor="middle" font-size="11.5" fill="#4a7a3a">left = mid + 1</text>
  <text x="88" y="334" font-size="11" fill="#4a7a3a" font-weight="bold">&gt; 0</text>
  <text x="120" y="334" font-size="9.5" fill="#888">(猜小了)</text>

  <!-- arrows: start -> init -> diamond -->
  <path d="M 280 74 L 280 90" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 124 L 280 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond yes -> mid -->
  <path d="M 400 185 L 404 185" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- mid -> inner diamond -->
  <path d="M 473 202 L 473 220" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond no -> return -1 -->
  <path d="M 280 230 L 280 260" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- inner diamond == 0 -> return mid -->
  <path d="M 460 322 L 455 342" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrY)" filter="url(#rough2)"/>
  <!-- inner diamond < 0 -> right=mid-1 -->
  <path d="M 410 300 L 360 300 L 295 342" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- inner diamond > 0 -> left=mid+1 -->
  <path d="M 386 272 L 200 272 L 128 342" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- loop back: left=mid+1 and right=mid-1 -> up to outer diamond top (280,140) -->
  <path d="M 128 378 L 128 410 L 480 410 L 480 200 L 410 200" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 295 378 L 295 422 L 480 422 L 480 200" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="300" y="402" font-size="9.5" fill="#888">区间折半后继续</text>

  <!-- side note: invariant -->
  <rect x="30" y="92" width="116" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="88" y="112" text-anchor="middle" font-size="10" fill="#444">不变量：</text>
  <text x="88" y="127" text-anchor="middle" font-size="10" fill="#444">pick 始终落在</text>
  <text x="88" y="142" text-anchor="middle" font-size="10" fill="#d6a040">[left, right] 内</text>

  <!-- side note: contrast with 278 -->
  <rect x="30" y="200" width="120" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="90" y="220" text-anchor="middle" font-size="10" fill="#446688">对照 278：</text>
  <text x="90" y="235" text-anchor="middle" font-size="9.5" fill="#446688">命中即返回</text>
  <text x="90" y="250" text-anchor="middle" font-size="9.5" fill="#446688">left &lt;= right</text>
</svg>
