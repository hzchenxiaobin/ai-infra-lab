<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三个示例覆盖两种情况</text>

  <!-- legend -->
  <rect x="380" y="36" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="398" y="47" font-size="10" fill="#555">糖果</text>
  <rect x="428" y="36" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="446" y="47" font-size="10" fill="#555">去重后种类</text>

  <!-- ===== Example 1: [1,1,2,2,3,3] ===== -->
  <text x="40" y="88" font-size="11.5" fill="#446688" font-weight="bold">示例 ①</text>
  <text x="40" y="104" font-size="10" fill="#888">n=6, n/2=3</text>

  <!-- 6 candy cells -->
  <rect x="120" y="72" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="137" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="156" y="72" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="173" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="192" y="72" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="209" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="228" y="72" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="245" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="264" y="72" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="281" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="300" y="72" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="317" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- arrow -->
  <path d="M 360 88 L 384 88" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="80" text-anchor="middle" font-size="9.5" fill="#888">去重</text>

  <!-- unique set {1,2,3} -->
  <rect x="388" y="72" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="424" y="72" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="441" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="460" y="72" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="477" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- result line -->
  <text x="498" y="88" font-size="11.5" fill="#666">|U|=3, n/2=3</text>
  <rect x="498" y="98" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="524" y="113" text-anchor="middle" font-size="11" fill="#7a4a10" font-weight="bold">min=3</text>

  <!-- ===== Example 2: [1,1,2,3] ===== -->
  <text x="40" y="168" font-size="11.5" fill="#446688" font-weight="bold">示例 ②</text>
  <text x="40" y="184" font-size="10" fill="#888">n=4, n/2=2</text>

  <rect x="120" y="152" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="137" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="156" y="152" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="173" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="192" y="152" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="209" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="228" y="152" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="245" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <path d="M 360 168 L 384 168" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="160" text-anchor="middle" font-size="9.5" fill="#888">去重</text>

  <rect x="388" y="152" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="424" y="152" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="441" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="460" y="152" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="477" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <text x="498" y="168" font-size="11.5" fill="#666">|U|=3, n/2=2</text>
  <rect x="498" y="178" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="524" y="193" text-anchor="middle" font-size="11" fill="#7a4a10" font-weight="bold">min=2</text>

  <!-- ===== Example 3: [6,6,6,6] ===== -->
  <text x="40" y="248" font-size="11.5" fill="#446688" font-weight="bold">示例 ③</text>
  <text x="40" y="264" font-size="10" fill="#888">n=4, n/2=2</text>

  <rect x="120" y="232" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="137" y="252" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="156" y="232" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="173" y="252" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="192" y="232" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="209" y="252" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="228" y="232" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="245" y="252" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <path d="M 360 248 L 384 248" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="240" text-anchor="middle" font-size="9.5" fill="#888">去重</text>

  <rect x="388" y="232" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="252" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="424" y="232" width="34" height="30" fill="#e8f0fe" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="441" y="252" text-anchor="middle" font-size="11" fill="#bbb">∅</text>

  <text x="498" y="248" font-size="11.5" fill="#666">|U|=1, n/2=2</text>
  <rect x="498" y="258" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="524" y="273" text-anchor="middle" font-size="11" fill="#7a4a10" font-weight="bold">min=1</text>

  <!-- ===== bottom note ===== -->
  <rect x="24" y="300" width="512" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">两种情况对照</text>
  <text x="40" y="346" font-size="11" fill="#444">①② |unique| ≥ n/2：受「容量」卡住，答案 = n/2（种类够多但吃不下了）</text>
  <text x="40" y="364" font-size="11" fill="#444">③ |unique| &lt; n/2：受「种类」卡住，答案 = |unique|（吃光了也就这么多类）</text>
  <text x="40" y="378" font-size="11" fill="#b85450" font-weight="bold">两个上界独立成立，取 min 即可，无需搜索枚举组合。</text>
</svg>
