<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心 + 反悔栈：用新类别项替换最小利润重复项</text>

  <!-- sorted items label -->
  <text x="30" y="58" font-size="11" fill="#888">按 profit 降序排序后：</text>

  <!-- ===== sorted item strip: 6 items ===== -->
  <!-- top-k bracket label -->
  <text x="30" y="92" font-size="11" fill="#446688" font-weight="bold">前 k 项（骨架）</text>
  <path d="M 30 98 L 30 104 L 305 104 L 305 98" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="312" y="106" font-size="10" fill="#888">剩余 n−k 项</text>
  <path d="M 318 98 L 318 104 L 540 104 L 540 98" stroke="#bbb" stroke-width="1" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- item 1: new category -->
  <rect x="30" y="112" width="42" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="51" y="129" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p₁</text>
  <text x="51" y="144" text-anchor="middle" font-size="9" fill="#4a7a3a">类别A</text>

  <!-- item 2: new category -->
  <rect x="80" y="112" width="42" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="101" y="129" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p₂</text>
  <text x="101" y="144" text-anchor="middle" font-size="9" fill="#4a7a3a">类别B</text>

  <!-- item 3: DUPLICATE (removable) -->
  <rect x="130" y="112" width="42" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="151" y="129" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p₃</text>
  <text x="151" y="144" text-anchor="middle" font-size="9" fill="#b85450">类别B</text>
  <text x="151" y="168" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">重复→入栈</text>

  <!-- item 4: new category -->
  <rect x="180" y="112" width="42" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="201" y="129" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p₄</text>
  <text x="201" y="144" text-anchor="middle" font-size="9" fill="#4a7a3a">类别C</text>

  <!-- item 5: DUPLICATE -->
  <rect x="230" y="112" width="42" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="251" y="129" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p₅</text>
  <text x="251" y="144" text-anchor="middle" font-size="9" fill="#b85450">类别A</text>
  <text x="251" y="168" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">重复→入栈</text>

  <!-- item 6 (beyond k): NEW category item -->
  <rect x="320" y="112" width="42" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="341" y="129" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">q₁</text>
  <text x="341" y="144" text-anchor="middle" font-size="9" fill="#d6a040">类别D</text>
  <text x="341" y="168" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">新类别！</text>

  <!-- item 7 -->
  <rect x="370" y="112" width="42" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="391" y="129" text-anchor="middle" font-size="11" fill="#999">q₂</text>

  <!-- ===== Stack (dup) ===== -->
  <text x="475" y="92" font-size="11" fill="#b85450" font-weight="bold">反悔栈</text>
  <text x="475" y="106" font-size="9" fill="#888">栈顶=最小利润</text>
  <rect x="455" y="112" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="127" text-anchor="middle" font-size="10" fill="#333">p₅</text>
  <rect x="455" y="136" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="151" text-anchor="middle" font-size="10" fill="#333">p₃</text>
  <text x="455" y="172" font-size="9" fill="#b85450">↑ 栈顶最小</text>

  <!-- ===== Replacement arrow ===== -->
  <!-- q1 replaces stack top -->
  <path d="M 341 178 L 341 188 L 480 188 L 480 158" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="410" y="184" text-anchor="middle" font-size="9" fill="#b85450">用 q₁ 替换栈顶</text>

  <!-- effect formula box -->
  <rect x="30" y="208" width="510" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="285" y="230" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">替换后：total += q₁ − p₅   （q₁ ≤ p₅，利润↓）</text>
  <text x="285" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">distinct += 1   →   优雅度增量 = (2d+1) − (p₅−q₁)，可能↑</text>

  <!-- ===== elegance formula ===== -->
  <rect x="80" y="288" width="400" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">elegance = total_profit + distinct²</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#888">利润之和 + 不同类别数平方（类别数被平方放大）</text>

  <!-- bottom takeaway -->
  <rect x="40" y="368" width="480" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="383" text-anchor="middle" font-size="11" fill="#4a7a3a">核心：高利润做骨架，重复项留作「反悔额度」，新类别项来消费额度</text>
</svg>
