<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=4, left=[1,-1,3,-1], right=[2,-1,-1,-1]</text>

  <!-- ===== Part A: indeg table ===== -->
  <text x="60" y="50" font-size="12" fill="#446688" font-weight="bold">① 入度统计 → indeg = [0,1,1,1]，根 = 0</text>

  <!-- header -->
  <rect x="20" y="58" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <rect x="76" y="58" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left[i]</text>
  <rect x="152" y="58" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right[i]</text>
  <rect x="228" y="58" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">入度影响</text>
  <rect x="368" y="58" width="152" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="444" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">indeg 累积</text>

  <!-- row 0 -->
  <rect x="20" y="82" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="98" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">0</text>
  <rect x="76" y="82" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="114" y="98" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <rect x="152" y="82" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="98" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <rect x="228" y="82" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="298" y="98" text-anchor="middle" font-size="10.5" fill="#4a7a3a">indeg[1]++, indeg[2]++</text>
  <rect x="368" y="82" width="152" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="444" y="98" text-anchor="middle" font-size="11.5" fill="#333">[0,<tspan fill="#b85450" font-weight="bold">1,1</tspan>,0]</text>

  <!-- row 1 -->
  <rect x="20" y="106" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="122" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <rect x="76" y="106" width="76" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="114" y="122" text-anchor="middle" font-size="11.5" fill="#888">−1</text>
  <rect x="152" y="106" width="76" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="122" text-anchor="middle" font-size="11.5" fill="#888">−1</text>
  <rect x="228" y="106" width="140" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="298" y="122" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <rect x="368" y="106" width="152" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="444" y="122" text-anchor="middle" font-size="11.5" fill="#333">[0,1,1,0]</text>

  <!-- row 2 -->
  <rect x="20" y="130" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="146" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <rect x="76" y="130" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="114" y="146" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <rect x="152" y="130" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="146" text-anchor="middle" font-size="11.5" fill="#888">−1</text>
  <rect x="228" y="130" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="298" y="146" text-anchor="middle" font-size="10.5" fill="#4a7a3a">indeg[3]++</text>
  <rect x="368" y="130" width="152" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="444" y="146" text-anchor="middle" font-size="11.5" fill="#333">[0,1,1,<tspan fill="#b85450" font-weight="bold">1</tspan>]</text>

  <!-- row 3 -->
  <rect x="20" y="154" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="170" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <rect x="76" y="154" width="76" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="114" y="170" text-anchor="middle" font-size="11.5" fill="#888">−1</text>
  <rect x="152" y="154" width="76" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="170" text-anchor="middle" font-size="11.5" fill="#888">−1</text>
  <rect x="228" y="154" width="140" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="298" y="170" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <rect x="368" y="154" width="152" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="444" y="170" text-anchor="middle" font-size="11.5" fill="#333">[0,1,1,1]</text>

  <!-- root conclusion -->
  <rect x="20" y="184" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="203" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">无 indeg &gt; 1；indeg==0 仅节点 0 → root = 0 ✓</text>

  <!-- ===== Part B: BFS table ===== -->
  <text x="60" y="234" font-size="12" fill="#446688" font-weight="bold">② BFS 从 root=0 出发 → cnt = 4 = n ✓</text>

  <!-- header -->
  <rect x="20" y="242" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步</text>
  <rect x="76" y="242" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">出队 u</text>
  <rect x="152" y="242" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">入队孩子</text>
  <rect x="252" y="242" width="160" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">visited</text>
  <rect x="412" y="242" width="108" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="466" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt</text>

  <!-- init -->
  <rect x="20" y="266" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="282" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">init</text>
  <rect x="76" y="266" width="76" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="114" y="282" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <rect x="152" y="266" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="202" y="282" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">0</text>
  <rect x="252" y="266" width="160" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="332" y="282" text-anchor="middle" font-size="11" fill="#333">{0}</text>
  <rect x="412" y="266" width="108" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="466" y="282" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>

  <!-- step 1: pop 0 -->
  <rect x="20" y="290" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="306" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">①</text>
  <rect x="76" y="290" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="306" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">0</text>
  <rect x="152" y="290" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="202" y="306" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1, 2</text>
  <rect x="252" y="290" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="332" y="306" text-anchor="middle" font-size="11" fill="#333">{0,1,2}</text>
  <rect x="412" y="290" width="108" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="466" y="306" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>

  <!-- step 2: pop 1 -->
  <rect x="20" y="314" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="330" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">②</text>
  <rect x="76" y="314" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="330" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <rect x="152" y="314" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="202" y="330" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <rect x="252" y="314" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="332" y="330" text-anchor="middle" font-size="11" fill="#333">{0,1,2}</text>
  <rect x="412" y="314" width="108" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="466" y="330" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>

  <!-- step 3: pop 2 -->
  <rect x="20" y="338" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="354" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③</text>
  <rect x="76" y="338" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="354" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <rect x="152" y="338" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="202" y="354" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <rect x="252" y="338" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="332" y="354" text-anchor="middle" font-size="11" fill="#333">{0,1,2,3}</text>
  <rect x="412" y="338" width="108" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="466" y="354" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>

  <!-- step 4: pop 3 -->
  <rect x="20" y="362" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="378" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">④</text>
  <rect x="76" y="362" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="378" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <rect x="152" y="362" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="202" y="378" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <rect x="252" y="362" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="332" y="378" text-anchor="middle" font-size="11" fill="#333">{0,1,2,3}</text>
  <rect x="412" y="362" width="108" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="466" y="378" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>

  <!-- result -->
  <rect x="20" y="392" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="412" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">cnt = 4 = n → 返回 true ⭐</text>

  <!-- tree sketch -->
  <line x1="252" y1="438" x2="222" y2="448" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="268" y1="438" x2="298" y2="448" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="308" y1="448" x2="308" y2="448" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="260" cy="432" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="435" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">0</text>
  <circle cx="216" cy="452" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="216" y="455" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>
  <circle cx="304" cy="452" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="304" y="455" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <circle cx="304" cy="455" r="0" fill="none"/>
  <text x="120" y="448" font-size="10.5" fill="#666">最终树形：0→{1,2}, 2→3</text>
</svg>
