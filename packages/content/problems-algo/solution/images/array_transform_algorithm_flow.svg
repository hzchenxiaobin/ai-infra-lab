<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：快照模拟，逐日迭代直到稳定</text>

  <!-- Step 1: input -->
  <rect x="180" y="40" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333">输入 arr</text>
  <path d="M 260 74 L 260 88" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: snapshot copy -->
  <rect x="150" y="90" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="12" fill="#333">new = arr[:]  （复制快照）</text>
  <path d="M 260 124 L 260 138" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3: scan loop (highlighted) -->
  <rect x="80" y="140" width="360" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">for i = 1 to n − 2:</text>
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace">arr[i]&gt;arr[i−1] &amp;&amp; arr[i]&gt;arr[i+1] → new[i]−−</text>
  <text x="260" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-family="monospace">arr[i]&lt;arr[i−1] &amp;&amp; arr[i]&lt;arr[i+1] → new[i]++</text>
  <path d="M 260 214 L 260 228" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 4: assign -->
  <rect x="170" y="230" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="12" fill="#333">arr = new  （更新数组）</text>
  <path d="M 260 264 L 260 278" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 5: decision diamond -->
  <polygon points="260,278 320,308 260,338 200,308" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">有变化?</text>

  <!-- Yes: loop back (right side, dashed) -->
  <path d="M 320 308 Q 400 308 400 106 Q 400 90 372 106" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="410" y="200" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="410" y="214" font-size="9" fill="#4a7a3a">继续迭代</text>

  <!-- No: return (down) -->
  <path d="M 260 338 L 260 352" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="278" y="330" font-size="10" fill="#d6a040" font-weight="bold">否</text>

  <!-- Step 6: return -->
  <rect x="180" y="354" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="369" text-anchor="middle" font-size="11" fill="#333">return arr</text>

  <!-- Side note: complexity -->
  <rect x="30" y="354" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="95" y="369" text-anchor="middle" font-size="9.5" fill="#666">O(D×N), D≤100</text>
</svg>
