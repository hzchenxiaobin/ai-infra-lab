<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：值 v → 下标 v−1，取负标记「v 存在」</text>

  <!-- Step 1: value v maps to index v-1 -->
  <text x="40" y="64" font-size="12" fill="#446688" font-weight="bold">① 值与下标的天然映射</text>

  <!-- value box v=4 -->
  <rect x="40" y="76" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="64" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="100" y="100" font-size="11" fill="#888">值 v = 4</text>

  <!-- arrow to index -->
  <text x="130" y="96" font-size="11" fill="#d6a040" font-weight="bold">v − 1</text>
  <path d="M 152 94 L 186 94" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- index box v-1=3 -->
  <rect x="190" y="76" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="100" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">3</text>
  <text x="250" y="100" font-size="11" fill="#888">下标 v−1 = 3</text>

  <!-- note -->
  <text x="300" y="96" font-size="11" fill="#4a7a3a">→ 在 nums[3] 处记录「4 存在」</text>

  <!-- divider -->
  <path d="M 40 132 L 500 132" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: negate to mark -->
  <text x="40" y="160" font-size="12" fill="#446688" font-weight="bold">② 取负数标记：nums[v−1] → −nums[v−1]</text>

  <!-- before: positive 7 -->
  <rect x="60" y="176" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="88" y="201" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <text x="130" y="200" font-size="11" fill="#888">标记前（正数）</text>

  <text x="232" y="200" font-size="18" fill="#d6a040" font-weight="bold">⇒</text>

  <!-- after: negative -7 -->
  <rect x="260" y="176" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="201" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−7</text>
  <text x="330" y="200" font-size="11" fill="#b85450">标记后（取负 = 值 4 存在）</text>

  <!-- idempotent note -->
  <path d="M 40 238 L 500 238" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>
  <text x="40" y="266" font-size="12" fill="#446688" font-weight="bold">③ 幂等：重复值只标记一次（if nums[v−1] > 0 守卫）</text>

  <!-- first mark -->
  <rect x="60" y="280" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="88" y="305" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <text x="100" y="296" font-size="9" fill="#446688">第1次</text>

  <text x="132" y="304" font-size="16" fill="#d6a040" font-weight="bold">→</text>
  <rect x="160" y="280" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="305" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−7</text>

  <text x="232" y="304" font-size="16" fill="#d6a040" font-weight="bold">→</text>
  <rect x="260" y="280" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="305" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−7</text>
  <text x="300" y="296" font-size="9" fill="#888">第2次：已负，跳过</text>

  <!-- footer -->
  <rect x="40" y="340" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="362" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">扫描后：nums[i] > 0 → 值 i+1 从未被标记 → 缺失</text>
  <text x="270" y="378" text-anchor="middle" font-size="10.5" fill="#555">读 nums[i] 时须取 abs：它可能已被标记成负数</text>
</svg>
