<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">每台机器进程平均耗时：自连接把 start/end 两行配对 → 算差值 → 按机器求平均</text>

  <!-- ===== 左：Activity 表（原始） ===== -->
  <text x="115" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Activity 表（原始，start/end 各一行）</text>
  <!-- 表头 -->
  <rect x="20" y="64" width="190" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="40" y="80" text-anchor="middle" font-size="9" fill="#333">m_id</text>
  <text x="80" y="80" text-anchor="middle" font-size="9" fill="#333">p_id</text>
  <text x="130" y="80" text-anchor="middle" font-size="9" fill="#333">type</text>
  <text x="180" y="80" text-anchor="middle" font-size="9" fill="#333">ts</text>
  <line x1="58" y1="64" x2="58" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="102" y1="64" x2="102" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="158" y1="64" x2="158" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 行 m0 p0 start -->
  <rect x="20" y="88" width="190" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="102" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="80" y="102" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="130" y="102" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">start</text>
  <text x="180" y="102" text-anchor="middle" font-size="9.5" fill="#333">0.712</text>
  <line x1="58" y1="88" x2="58" y2="108" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="102" y1="88" x2="102" y2="108" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="158" y1="88" x2="158" y2="108" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 行 m0 p0 end -->
  <rect x="20" y="108" width="190" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="122" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="80" y="122" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="130" y="122" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">end</text>
  <text x="180" y="122" text-anchor="middle" font-size="9.5" fill="#333">1.520</text>
  <line x1="58" y1="108" x2="58" y2="128" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="102" y1="108" x2="102" y2="128" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="158" y1="108" x2="158" y2="128" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 行 m0 p1 start -->
  <rect x="20" y="128" width="190" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="142" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="80" y="142" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="130" y="142" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">start</text>
  <text x="180" y="142" text-anchor="middle" font-size="9.5" fill="#333">3.140</text>
  <line x1="58" y1="128" x2="58" y2="148" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="102" y1="128" x2="102" y2="148" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="158" y1="128" x2="158" y2="148" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 行 m0 p1 end -->
  <rect x="20" y="148" width="190" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="162" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="80" y="162" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="130" y="162" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">end</text>
  <text x="180" y="162" text-anchor="middle" font-size="9.5" fill="#333">4.120</text>
  <line x1="58" y1="148" x2="58" y2="168" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="102" y1="148" x2="102" y2="168" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="158" y1="148" x2="158" y2="168" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="115" y="184" text-anchor="middle" font-size="9" fill="#888">…（3 台机器共 12 行）</text>

  <!-- 配对提示：同 (m_id, p_id) 的 start 与 end 是两行 -->
  <path d="M40 88 Q20 98 20 108 Q20 118 40 128" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="12" y="110" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">配</text>
  <text x="12" y="122" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">对</text>

  <!-- ===== 自连接箭头 ===== -->
  <path d="M212 128 L258 128" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="235" y="120" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">JOIN</text>
  <text x="235" y="142" text-anchor="middle" font-size="8.5" fill="#446688">on m_id, p_id</text>

  <!-- ===== 中：配对后（每进程一行） ===== -->
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">自连接配对后（每进程一行）</text>
  <rect x="260" y="64" width="200" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="285" y="80" text-anchor="middle" font-size="9" fill="#333">m_id</text>
  <text x="320" y="80" text-anchor="middle" font-size="9" fill="#333">p_id</text>
  <text x="365" y="80" text-anchor="middle" font-size="9" fill="#333">start_ts</text>
  <text x="415" y="80" text-anchor="middle" font-size="9" fill="#333">end_ts</text>
  <line x1="305" y1="64" x2="305" y2="88" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="340" y1="64" x2="340" y2="88" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="390" y1="64" x2="390" y2="88" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 配对行 m0 p0 -->
  <rect x="260" y="88" width="200" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="103" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="320" y="103" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="365" y="103" text-anchor="middle" font-size="9.5" fill="#4a7a3a">0.712</text>
  <text x="415" y="103" text-anchor="middle" font-size="9.5" fill="#b85450">1.520</text>
  <line x1="305" y1="88" x2="305" y2="110" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="340" y1="88" x2="340" y2="110" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="390" y1="88" x2="390" y2="110" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 配对行 m0 p1 -->
  <rect x="260" y="110" width="200" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="125" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="320" y="125" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="365" y="125" text-anchor="middle" font-size="9.5" fill="#4a7a3a">3.140</text>
  <text x="415" y="125" text-anchor="middle" font-size="9.5" fill="#b85450">4.120</text>
  <line x1="305" y1="110" x2="305" y2="132" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="340" y1="110" x2="340" y2="132" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="390" y1="110" x2="390" y2="132" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="360" y="150" text-anchor="middle" font-size="9" fill="#888">…（共 6 行配对，每行 = 一个进程）</text>

  <!-- 算差值提示 -->
  <rect x="260" y="162" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="180" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">耗时 = end_ts − start_ts</text>
  <text x="360" y="196" text-anchor="middle" font-size="9.5" fill="#333">如 1.520 − 0.712 = 0.808</text>

  <!-- ===== 右：分组求平均 ===== -->
  <path d="M462 128 L498 128" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="480" y="120" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">GROUP BY</text>
  <text x="480" y="140" text-anchor="middle" font-size="8.5" fill="#b85450">machine_id</text>

  <text x="570" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">按机器求平均（ROUND 3 位）</text>
  <rect x="505" y="64" width="130" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="540" y="80" text-anchor="middle" font-size="9.5" fill="#333">machine_id</text>
  <text x="600" y="80" text-anchor="middle" font-size="9.5" fill="#333">avg</text>
  <line x1="570" y1="64" x2="570" y2="88" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="505" y="88" width="130" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="540" y="103" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="600" y="103" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0.894</text>
  <line x1="570" y1="88" x2="570" y2="110" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="505" y="110" width="130" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="540" y="125" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="600" y="125" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0.995</text>
  <line x1="570" y1="110" x2="570" y2="132" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="505" y="132" width="130" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="540" y="147" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="600" y="147" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1.456</text>
  <line x1="570" y1="132" x2="570" y2="154" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="570" y="172" text-anchor="middle" font-size="9" fill="#4a7a3a">AVG(耗时) ÷ 进程数</text>

  <!-- ===== 底部要点 ===== -->
  <rect x="30" y="216" width="600" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="240" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键要点</text>
  <text x="50" y="264" font-size="10.5" fill="#333">① 同一进程的 start / end 是两行 → 用自连接按 (machine_id, process_id) 配对成一行</text>
  <text x="50" y="284" font-size="10.5" fill="#333">② 连接键必须含 machine_id：process_id 只在机器内唯一，跨机器同号是不同进程</text>
  <text x="50" y="304" font-size="10.5" fill="#333">③ INNER JOIN 即可：题目保证每进程必有一对 start/end，无孤儿行</text>
  <text x="50" y="324" font-size="10.5" fill="#333">④ AVG(end−start) 的分母 = 进程数（配对后每行非 NULL），ROUND(..., 3) 保留 3 位小数</text>

  <!-- 跨机器错误配对警示 -->
  <rect x="30" y="348" width="600" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠ 常见错误</text>
  <text x="50" y="394" font-size="10.5" fill="#333">✗ 只按 process_id 连接 → 机器0的 start 配上机器1的 end，算出跨机器荒谬耗时</text>
  <text x="50" y="410" font-size="10.5" fill="#333">✗ 直接 GROUP BY machine_id 求 AVG(timestamp) → 把 start/end 时间戳混算，毫无意义</text>
</svg>
