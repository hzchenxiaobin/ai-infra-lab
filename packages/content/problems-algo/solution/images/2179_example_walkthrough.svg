<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums1=[2,0,1,3], nums2=[0,1,2,3]</text>

  <!-- ===== Step 1: Build A ===== -->
  <text x="30" y="50" font-size="11.5" fill="#446688" font-weight="bold">① 构造 A = [2, 0, 1, 3]</text>
  <text x="30" y="66" font-size="9.5" fill="#888">pos2[0]=0, pos2[1]=1, pos2[2]=2, pos2[3]=3 → A[i]=pos2[nums1[i]]</text>

  <!-- A array -->
  <text x="30" y="90" font-size="10" fill="#888">A:</text>
  <text x="92" y="86" text-anchor="middle" font-size="8.5" fill="#888">j=0</text>
  <text x="148" y="86" text-anchor="middle" font-size="8.5" fill="#888">1</text>
  <text x="204" y="86" text-anchor="middle" font-size="8.5" fill="#888">2</text>
  <text x="260" y="86" text-anchor="middle" font-size="8.5" fill="#888">3</text>
  <rect x="72" y="92" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="128" y="92" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="184" y="92" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="240" y="92" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- ===== Step 2: Left pass ===== -->
  <text x="320" y="50" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 左→右扫描求 left[j]</text>
  <text x="320" y="66" font-size="9.5" fill="#888">BIT 维护值域计数，left[j] = query(A[j]−1)</text>

  <!-- left pass table -->
  <rect x="320" y="80" width="240" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="98" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">左→右扫描过程</text>

  <!-- header -->
  <text x="360" y="114" text-anchor="middle" font-size="9" fill="#888">j</text>
  <text x="410" y="114" text-anchor="middle" font-size="9" fill="#888">A[j]</text>
  <text x="470" y="114" text-anchor="middle" font-size="9" fill="#888">BIT查询</text>
  <text x="530" y="114" text-anchor="middle" font-size="9" fill="#888">left[j]</text>

  <!-- j=0 -->
  <text x="360" y="130" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="410" y="130" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="470" y="130" text-anchor="middle" font-size="9" fill="#555">query(1)</text>
  <text x="530" y="130" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>

  <!-- j=1 -->
  <text x="360" y="148" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="410" y="148" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="470" y="148" text-anchor="middle" font-size="9" fill="#555">query(-1)</text>
  <text x="530" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>

  <!-- j=2 -->
  <text x="360" y="166" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="410" y="166" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="470" y="166" text-anchor="middle" font-size="9" fill="#555">query(0)</text>
  <text x="530" y="166" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>

  <!-- j=3 -->
  <text x="360" y="184" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="410" y="184" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="470" y="184" text-anchor="middle" font-size="9" fill="#555">query(2)</text>
  <text x="530" y="184" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>

  <text x="440" y="196" text-anchor="middle" font-size="9" fill="#888">left = [0, 0, 1, 3]</text>

  <!-- left values below A -->
  <text x="30" y="142" font-size="10" fill="#888">left:</text>
  <text x="92" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="148" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="204" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="260" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- ===== Step 3: Right pass ===== -->
  <path d="M 290 210 L 290 224" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="30" y="244" font-size="11.5" fill="#d6a040" font-weight="bold">③ 右→左扫描求 right[j]</text>
  <text x="30" y="260" font-size="9.5" fill="#888">right[j] = total − query(A[j])，total 为已扫元素数</text>

  <!-- right pass table -->
  <rect x="320" y="234" width="240" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="252" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">右→左扫描过程</text>

  <text x="360" y="268" text-anchor="middle" font-size="9" fill="#888">j</text>
  <text x="410" y="268" text-anchor="middle" font-size="9" fill="#888">A[j]</text>
  <text x="470" y="268" text-anchor="middle" font-size="9" fill="#888">计算</text>
  <text x="530" y="268" text-anchor="middle" font-size="9" fill="#888">right[j]</text>

  <!-- j=3 -->
  <text x="360" y="284" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="410" y="284" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="470" y="284" text-anchor="middle" font-size="9" fill="#555">0−0</text>
  <text x="530" y="284" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>

  <!-- j=2 -->
  <text x="360" y="302" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="410" y="302" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="470" y="302" text-anchor="middle" font-size="9" fill="#555">1−0</text>
  <text x="530" y="302" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>

  <!-- j=1 -->
  <text x="360" y="320" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="410" y="320" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="470" y="320" text-anchor="middle" font-size="9" fill="#555">2−0</text>
  <text x="530" y="320" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>

  <!-- j=0 -->
  <text x="360" y="338" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="410" y="338" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="470" y="338" text-anchor="middle" font-size="9" fill="#555">3−2</text>
  <text x="530" y="338" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>

  <text x="440" y="350" text-anchor="middle" font-size="9" fill="#888">right = [1, 2, 1, 0]</text>

  <!-- right values below A -->
  <text x="30" y="284" font-size="10" fill="#888">right:</text>
  <text x="92" y="284" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="148" y="284" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="204" y="284" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="260" y="284" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>

  <!-- ===== Step 4: Multiply and sum ===== -->
  <path d="M 290 364 L 290 378" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="30" y="398" font-size="11.5" fill="#b85450" font-weight="bold">④ 乘法求和</text>

  <!-- multiply table -->
  <rect x="60" y="408" width="460" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <text x="100" y="428" text-anchor="middle" font-size="9.5" fill="#888">j</text>
  <text x="180" y="428" text-anchor="middle" font-size="9.5" fill="#888">left[j]</text>
  <text x="270" y="428" text-anchor="middle" font-size="9.5" fill="#888">right[j]</text>
  <text x="370" y="428" text-anchor="middle" font-size="9.5" fill="#888">乘积</text>
  <text x="480" y="428" text-anchor="middle" font-size="9.5" fill="#888">累加</text>

  <text x="100" y="446" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="180" y="446" text-anchor="middle" font-size="10" fill="#4a7a3a">0</text>
  <text x="270" y="446" text-anchor="middle" font-size="10" fill="#d6a040">1</text>
  <text x="370" y="446" text-anchor="middle" font-size="10" fill="#555">0×1=0</text>
  <text x="480" y="446" text-anchor="middle" font-size="10" fill="#333">0</text>

  <text x="100" y="462" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="180" y="462" text-anchor="middle" font-size="10" fill="#4a7a3a">0</text>
  <text x="270" y="462" text-anchor="middle" font-size="10" fill="#d6a040">2</text>
  <text x="370" y="462" text-anchor="middle" font-size="10" fill="#555">0×2=0</text>
  <text x="480" y="462" text-anchor="middle" font-size="10" fill="#333">0</text>

  <text x="100" y="478" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="180" y="478" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="270" y="478" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="370" y="478" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1×1=1</text>
  <text x="480" y="478" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>

  <text x="100" y="494" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="180" y="494" text-anchor="middle" font-size="10" fill="#4a7a3a">3</text>
  <text x="270" y="494" text-anchor="middle" font-size="10" fill="#d6a040">0</text>
  <text x="370" y="494" text-anchor="middle" font-size="10" fill="#555">3×0=0</text>
  <text x="480" y="494" text-anchor="middle" font-size="10" fill="#333">1</text>

  <!-- final answer -->
  <rect x="170" y="500" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="522" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 0+0+1+0 = 1 ✓</text>
</svg>
