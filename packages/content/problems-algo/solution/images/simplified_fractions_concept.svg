  <rect x="234" y="126" width="68" height="38" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <rect x="302" y="126" width="68" height="38" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <rect x="370" y="126" width="68" height="38" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="126" width="68" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="150" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>

  <!-- Row b=4: 1/4 ✓, 2/4 ✗, 3/4 ✓ -->
  <rect x="30" y="164" width="68" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="64" y="188" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">b=4</text>
  <rect x="98" y="164" width="68" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="188" text-anchor="middle" font-size="12" fill="#333">1/4</text>
  <rect x="166" y="164" width="68" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="188" text-anchor="middle" font-size="12" fill="#999">2/4</text>
  <line x1="178" y1="183" x2="222" y2="183" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="234" y="164" width="68" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="188" text-anchor="middle" font-size="12" fill="#333">3/4</text>
  <rect x="302" y="164" width="68" height="38" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <rect x="370" y="164" width="68" height="38" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="164" width="68" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="188" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>

  <!-- Row b=5: 1/5 ✓, 2/5 ✓, 3/5 ✓, 4/5 ✓ -->
  <rect x="30" y="202" width="68" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="64" y="226" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">b=5</text>
  <rect x="98" y="202" width="68" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="226" text-anchor="middle" font-size="12" fill="#333">1/5</text>
  <rect x="166" y="202" width="68" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="226" text-anchor="middle" font-size="12" fill="#333">2/5</text>
  <rect x="234" y="202" width="68" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="226" text-anchor="middle" font-size="12" fill="#333">3/5</text>
  <rect x="302" y="202" width="68" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="226" text-anchor="middle" font-size="12" fill="#333">4/5</text>
  <rect x="370" y="202" width="68" height="38" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="202" width="68" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="226" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">4</text>

  <!-- Row b=6: 1/6 ✓, 2/6 ✗, 3/6 ✗, 4/6 ✗, 5/6 ✓ -->
  <rect x="30" y="240" width="68" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="64" y="264" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">b=6</text>
  <rect x="98" y="240" width="68" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="264" text-anchor="middle" font-size="12" fill="#333">1/6</text>
  <rect x="166" y="240" width="68" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="264" text-anchor="middle" font-size="12" fill="#999">2/6</text>
  <line x1="178" y1="259" x2="222" y2="259" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="234" y="240" width="68" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="264" text-anchor="middle" font-size="12" fill="#999">3/6</text>
  <line x1="246" y1="259" x2="290" y2="259" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="302" y="240" width="68" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="264" text-anchor="middle" font-size="12" fill="#999">4/6</text>
  <line x1="314" y1="259" x2="358" y2="259" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="370" y="240" width="68" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="264" text-anchor="middle" font-size="12" fill="#333">5/6</text>
  <rect x="438" y="240" width="68" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="264" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>

  <!-- Bottom notes -->
  <rect x="30" y="295" width="270" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="45" y="314" font-size="11" fill="#4a7a3a" font-weight="bold">判据</text>
  <text x="45" y="332" font-size="11" fill="#333" font-family="monospace">gcd(a,b)=1 → 最简 ✓ (绿)</text>
  <text x="45" y="348" font-size="11" fill="#333" font-family="monospace">gcd(a,b)&gt;1 → 可约 ✗ (红, 划掉)</text>

  <rect x="310" y="295" width="220" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="325" y="314" font-size="11" fill="#d6a040" font-weight="bold">欧拉函数 φ(b)</text>
  <text x="325" y="332" font-size="10.5" fill="#555">= [1,b] 中与 b 互质的个数</text>
  <text x="325" y="348" font-size="10.5" fill="#555">= 该行绿格数</text>
  <text x="325" y="360" font-size="11" fill="#d6a040" font-weight="bold">总数 = Σφ = 1+2+2+4+2 = 11</text>
</svg>
