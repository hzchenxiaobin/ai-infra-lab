<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">分数网格（n=6）：gcd=1 最简（绿）/ gcd&gt;1 可约（红）</text>

  <!-- ===== Grid: 7 cols × 6 rows, cell 68×38, start (30,50) ===== -->

  <!-- Header row -->
  <rect x="30" y="50" width="68" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="64" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">b \ a</text>
  <rect x="98" y="50" width="68" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="132" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="166" y="50" width="68" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="200" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="234" y="50" width="68" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="268" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="302" y="50" width="68" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="336" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <rect x="370" y="50" width="68" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="404" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
  <rect x="438" y="50" width="68" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="472" y="74" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">φ(b)</text>

  <!-- Row b=2: 1/2 ✓ -->
  <rect x="30" y="88" width="68" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="64" y="112" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">b=2</text>
  <rect x="98" y="88" width="68" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="112" text-anchor="middle" font-size="12" fill="#333">1/2</text>
  <rect x="166" y="88" width="68" height="38" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <rect x="234" y="88" width="68" height="38" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <rect x="302" y="88" width="68" height="38" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <rect x="370" y="88" width="68" height="38" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="88" width="68" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="112" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>

  <!-- Row b=3: 1/3 ✓, 2/3 ✓ -->
  <rect x="30" y="126" width="68" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="64" y="150" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">b=3</text>
  <rect x="98" y="126" width="68" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="150" text-anchor="middle" font-size="12" fill="#333">1/3</text>
  <rect x="166" y="126" width="68" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
