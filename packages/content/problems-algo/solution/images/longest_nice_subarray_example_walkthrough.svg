<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, 3, 8, 48, 10]</text>

  <!-- column headers -->
  <text x="30" y="44" font-size="10" fill="#888">步/idx</text>
  <text x="150" y="44" font-size="10" fill="#888">数组与窗口（绿=在窗，橙边=新增，灰删=撤销）</text>
  <text x="296" y="44" font-size="10" fill="#888">mask（6 位）</text>
  <text x="412" y="44" font-size="10" fill="#888">动作</text>

  <!-- ===== Step 0: right=0, window [1] ===== -->
  <text x="30" y="74" font-size="11" fill="#555" font-weight="bold">0</text>
  <text x="30" y="86" font-size="9" fill="#999">r=0</text>
  <rect x="70" y="62" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="87" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="108" y="62" width="34" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="82" text-anchor="middle" font-size="12" fill="#ccc">3</text>
  <rect x="146" y="62" width="34" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="163" y="82" text-anchor="middle" font-size="12" fill="#ccc">8</text>
  <rect x="184" y="62" width="34" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="82" text-anchor="middle" font-size="12" fill="#ccc">48</text>
  <rect x="222" y="62" width="34" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="82" text-anchor="middle" font-size="12" fill="#ccc">10</text>
  <text x="296" y="74" font-size="11" fill="#555" font-weight="bold">1</text>
  <text x="296" y="86" font-size="9" fill="#999">000001</text>
  <text x="412" y="74" font-size="11" fill="#4a7a3a">0&amp;1=0 → 并入</text>
  <text x="412" y="86" font-size="10" fill="#4a7a3a" font-weight="bold">ans=1</text>

  <!-- ===== Step 1: right=1, window [3], removed 1 ===== -->
  <text x="30" y="130" font-size="11" fill="#555" font-weight="bold">1</text>
  <text x="30" y="142" font-size="9" fill="#999">r=1</text>
  <rect x="70" y="118" width="34" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="87" y="138" text-anchor="middle" font-size="12" fill="#bbb" text-decoration="line-through">1</text>
  <rect x="108" y="118" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="146" y="118" width="34" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="163" y="138" text-anchor="middle" font-size="12" fill="#ccc">8</text>
  <rect x="184" y="118" width="34" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="138" text-anchor="middle" font-size="12" fill="#ccc">48</text>
  <rect x="222" y="118" width="34" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="138" text-anchor="middle" font-size="12" fill="#ccc">10</text>
  <text x="296" y="130" font-size="11" fill="#555" font-weight="bold">3</text>
  <text x="296" y="142" font-size="9" fill="#999">000011</text>
  <text x="412" y="130" font-size="11" fill="#b85450">1&amp;3=1 ✗ 撤1</text>
  <text x="412" y="142" font-size="11" fill="#4a7a3a">→ 并入 ans=1</text>

  <!-- ===== Step 2: right=2, window [3,8] ===== -->
  <text x="30" y="186" font-size="11" fill="#555" font-weight="bold">2</text>
  <text x="30" y="198" font-size="9" fill="#999">r=2</text>
  <rect x="70" y="174" width="34" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="87" y="194" text-anchor="middle" font-size="12" fill="#bbb" text-decoration="line-through">1</text>
  <rect x="108" y="174" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="194" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="146" y="174" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="163" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="184" y="174" width="34" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="194" text-anchor="middle" font-size="12" fill="#ccc">48</text>
  <rect x="222" y="174" width="34" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="194" text-anchor="middle" font-size="12" fill="#ccc">10</text>
  <text x="296" y="186" font-size="11" fill="#555" font-weight="bold">11</text>
  <text x="296" y="198" font-size="9" fill="#999">001011</text>
  <text x="412" y="186" font-size="11" fill="#4a7a3a">3&amp;8=0 → 并入</text>
  <text x="412" y="198" font-size="10" fill="#4a7a3a" font-weight="bold">ans=2</text>

  <!-- ===== Step 3: right=3, window [3,8,48] ===== -->
  <text x="30" y="242" font-size="11" fill="#555" font-weight="bold">3</text>
  <text x="30" y="254" font-size="9" fill="#999">r=3</text>
  <rect x="70" y="230" width="34" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="87" y="250" text-anchor="middle" font-size="12" fill="#bbb" text-decoration="line-through">1</text>
  <rect x="108" y="230" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="250" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="146" y="230" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="250" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="184" y="230" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">48</text>
  <rect x="222" y="230" width="34" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="250" text-anchor="middle" font-size="12" fill="#ccc">10</text>
  <!-- window bracket -->
  <path d="M 108 266 L 108 271 L 220 271 L 220 266" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="296" y="242" font-size="11" fill="#555" font-weight="bold">59</text>
  <text x="296" y="254" font-size="9" fill="#999">111011</text>
  <text x="412" y="242" font-size="11" fill="#4a7a3a">11&amp;48=0 → 并入</text>
  <text x="412" y="254" font-size="10" fill="#b85450" font-weight="bold">ans=3 ★</text>

  <!-- ===== Step 4: right=4, window [48,10], removed 3,8 ===== -->
  <text x="30" y="298" font-size="11" fill="#555" font-weight="bold">4</text>
  <text x="30" y="310" font-size="9" fill="#999">r=4</text>
  <rect x="70" y="286" width="34" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="87" y="306" text-anchor="middle" font-size="12" fill="#bbb" text-decoration="line-through">1</text>
  <rect x="108" y="286" width="34" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="306" text-anchor="middle" font-size="12" fill="#bbb" text-decoration="line-through">3</text>
  <rect x="146" y="286" width="34" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="163" y="306" text-anchor="middle" font-size="12" fill="#bbb" text-decoration="line-through">8</text>
  <rect x="184" y="286" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="306" text-anchor="middle" font-size="12" fill="#333">48</text>
  <rect x="222" y="286" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="306" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <text x="296" y="298" font-size="11" fill="#555" font-weight="bold">58</text>
  <text x="296" y="310" font-size="9" fill="#999">111010</text>
  <text x="412" y="298" font-size="11" fill="#b85450">59&amp;10=10 ✗</text>
  <text x="412" y="310" font-size="10" fill="#b85450">撤3,撤8 → 并入</text>

  <!-- legend -->
  <rect x="412" y="328" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="430" y="339" font-size="9" fill="#888">新增</text>
  <rect x="462" y="328" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="480" y="339" font-size="9" fill="#888">在窗</text>
  <rect x="510" y="328" width="14" height="14" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="528" y="339" font-size="9" fill="#888">撤销</text>
</svg>
