<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：遍历元素 → 标记 diff → 前缀和取最值</text>

  <!-- Step 1 -->
  <rect x="30" y="40" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="61" font-size="11" fill="#446688" font-weight="bold">① 初始化 diff[0..n] = 0</text>

  <path d="M 280 76 L 280 88" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Step 2: loop -->
  <rect x="30" y="90" width="500" height="190" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <rect x="30" y="90" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="107" font-size="11" fill="#446688" font-weight="bold">② for i = 0..n−1</text>
  <text x="180" y="107" font-size="10" fill="#888">令 a = nums[i]</text>

  <!-- Decision diamond -->
  <polygon points="200,140 290,160 200,180 110,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="158" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">a ≤ i ?</text>
  <text x="200" y="170" text-anchor="middle" font-size="9" fill="#888">(含 a=0)</text>

  <!-- Yes branch (left) -->
  <path d="M 110 160 L 70 160 L 70 195" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="78" y="155" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="36" y="198" width="170" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="46" y="216" font-size="10" fill="#4a7a3a" font-weight="bold">计分区间</text>
  <text x="46" y="232" font-size="10" fill="#444">[0, i−a] ∪ [i+1, n−1]</text>
  <text x="46" y="248" font-size="9" fill="#666">diff[0] += 1</text>
  <text x="46" y="260" font-size="9" fill="#666">diff[i−a+1] −= 1</text>
  <text x="120" y="248" font-size="9" fill="#666">diff[i+1] += 1</text>
  <text x="120" y="260" font-size="9" fill="#666">diff[n] −= 1</text>

  <!-- No branch (right) -->
  <path d="M 290 160 L 350 160 L 350 195" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="320" y="155" font-size="9" fill="#b85450" font-weight="bold">否</text>
  <rect x="316" y="198" width="190" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="326" y="216" font-size="10" fill="#b85450" font-weight="bold">计分区间</text>
  <text x="326" y="232" font-size="10" fill="#444">[i+1, i+n−a]</text>
  <text x="326" y="248" font-size="9" fill="#666">diff[i+1] += 1</text>
  <text x="326" y="260" font-size="9" fill="#666">diff[i+n−a+1] −= 1</text>

  <!-- Loop back arrow -->
  <path d="M 200 268 Q 200 282 280 282 L 280 90" stroke="#ddd" stroke-width="1" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <path d="M 280 292 L 280 304" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Step 3: prefix sum -->
  <rect x="30" y="306" width="500" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="326" font-size="11" fill="#446688" font-weight="bold">③ 前缀和：score = 0, bestK = 0, bestScore = 0</text>
  <text x="44" y="344" font-size="10" fill="#444">for k = 0..n−1: score += diff[k]; 若 score &gt; bestScore → 更新 bestScore, bestK = k</text>

  <path d="M 280 358 L 280 370" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="30" y="372" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="393" font-size="11" fill="#4a7a3a" font-weight="bold">④ 返回 bestK（得分最高且最小的 k）</text>

  <!-- Complexity note -->
  <rect x="30" y="416" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="44" y="437" font-size="10" fill="#d6a040" font-weight="bold">复杂度：时间 O(n) · 空间 O(n) — 遍历一次标记 + 一次前缀和扫描</text>
</svg>
