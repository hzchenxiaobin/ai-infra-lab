<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：计数按出现位置累计</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">规则：命中 bannedSet 的单词数 ≥ 2 → 垃圾信息（true）</text>

  <!-- 示例 1 面板 -->
  <rect x="18" y="54" width="240" height="176" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="74" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1</text>
  <text x="138" y="90" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">banned = ["world", "hello"]</text>
  <rect x="30" y="100" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="62" y="117" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">hello ✓</text>
  <text x="99" y="117" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">→</text>
  <rect x="104" y="100" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="136" y="117" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">world ✓</text>
  <text x="173" y="117" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">→</text>
  <rect x="178" y="100" width="64" height="26" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="117" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">leetcode ✗</text>
  <text x="62" y="142" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">cnt=1</text>
  <text x="136" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt=2</text>
  <text x="210" y="142" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(短路，不再查)</text>
  <rect x="48" y="156" width="180" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="138" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt = 2 ≥ 2 → true</text>
  <text x="138" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">第 2 次命中发生在 world，当场返回</text>

  <!-- 示例 2 面板 -->
  <rect x="262" y="54" width="240" height="176" rx="10" fill="#ffffff" stroke="#b8c2cc" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="382" y="74" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2</text>
  <text x="382" y="90" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">banned = ["world", "programming", "leetcode"]</text>
  <rect x="274" y="100" width="64" height="26" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306" y="117" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">hello ✗</text>
  <text x="343" y="117" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">→</text>
  <rect x="348" y="100" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="117" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">programming ✓</text>
  <text x="417" y="117" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">→</text>
  <rect x="422" y="100" width="64" height="26" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="117" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">fun ✗</text>
  <text x="306" y="142" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">cnt=0</text>
  <text x="380" y="142" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">cnt=1</text>
  <text x="454" y="142" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">cnt=1</text>
  <rect x="292" y="156" width="180" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="382" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt = 1 &lt; 2 → false</text>
  <text x="382" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">扫完全部也只有 1 次命中，才能下结论</text>

  <!-- 边界情形面板 -->
  <rect x="18" y="242" width="484" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">边界情形：同一个单词出现两次，就是两次命中</text>
  <rect x="80" y="280" width="66" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="113" y="296" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">"spam" ✓</text>
  <rect x="160" y="280" width="66" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="193" y="296" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">"spam" ✓</text>
  <rect x="240" y="280" width="66" height="24" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="273" y="296" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">"hi" ✗</text>
  <text x="113" y="318" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">cnt=1</text>
  <text x="193" y="318" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt=2</text>
  <text x="273" y="318" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(短路)</text>
  <rect x="340" y="278" width="140" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">true（垃圾信息）</text>
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">计数的是出现位置，不是去重后的不同单词数</text>
</svg>
