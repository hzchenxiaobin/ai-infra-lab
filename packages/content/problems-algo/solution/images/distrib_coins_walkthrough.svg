<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：[1,0,0,null,3] → 4</text>

  <!-- 左侧：树结构 -->
  <text x="150" y="52" text-anchor="middle" font-size="11" fill="#888">后序顺序 ①→④</text>

  <!-- root(1) ④ bal=0 蓝 -->
  <line x1="143" y1="88" x2="107" y2="134" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="157" y1="88" x2="203" y2="134" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="150" cy="72" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="76" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="176" y="64" font-size="10" fill="#446688" font-weight="bold">④bal=0</text>

  <!-- left(0) ② bal=+1 绿 -->
  <line x1="107" y1="166" x2="144" y2="214" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="100" cy="150" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="154" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="60" y="142" font-size="10" fill="#4a7a3a" font-weight="bold">②bal=+1</text>

  <!-- right(0) ③ bal=-1 红 -->
  <circle cx="210" cy="150" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="154" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="232" y="142" font-size="10" fill="#b85450" font-weight="bold">③bal=−1</text>

  <!-- leaf(3) ① bal=+2 绿 -->
  <circle cx="150" cy="230" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="234" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="178" y="222" font-size="10" fill="#4a7a3a" font-weight="bold">①bal=+2</text>

  <!-- 流向箭头：leaf→left ↑2 -->
  <path d="M 140 214 Q 120 188 110 166" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="116" y="194" font-size="9" fill="#d6a040" font-weight="bold">↑2</text>

  <!-- 流向箭头：left→root ↑1 -->
  <path d="M 110 134 Q 128 108 138 88" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="118" y="114" font-size="9" fill="#d6a040" font-weight="bold">↑1</text>

  <!-- 流向箭头：root→right ↓1 -->
  <path d="M 162 88 Q 186 112 200 134" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="182" y="114" font-size="9" fill="#d6a040" font-weight="bold">↓1</text>

  <!-- 右侧：步骤表 -->
  <rect x="340" y="50" width="280" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="358" y="67" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">步</text>
  <text x="400" y="67" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">节点</text>
  <text x="456" y="67" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">L/R bal</text>
  <text x="514" y="67" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">节点bal</text>
  <text x="576" y="67" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">+moves</text>

  <!-- 行 ① leaf(3) -->
  <rect x="340" y="76" width="280" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="358" y="93" text-anchor="middle" font-size="10" fill="#333">①</text>
  <text x="400" y="93" text-anchor="middle" font-size="9" fill="#333">leaf(3)</text>
  <text x="456" y="93" text-anchor="middle" font-size="9" fill="#888">0 / 0</text>
  <text x="514" y="93" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+2</text>
  <text x="576" y="93" text-anchor="middle" font-size="10" fill="#333">0</text>

  <!-- 行 ② left(0) -->
  <rect x="340" y="102" width="280" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="358" y="119" text-anchor="middle" font-size="10" fill="#333">②</text>
  <text x="400" y="119" text-anchor="middle" font-size="9" fill="#333">left(0)</text>
  <text x="456" y="119" text-anchor="middle" font-size="9" fill="#888">0 / +2</text>
  <text x="514" y="119" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="576" y="119" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>

  <!-- 行 ③ right(0) -->
  <rect x="340" y="128" width="280" height="26" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="358" y="145" text-anchor="middle" font-size="10" fill="#333">③</text>
  <text x="400" y="145" text-anchor="middle" font-size="9" fill="#333">right(0)</text>
  <text x="456" y="145" text-anchor="middle" font-size="9" fill="#888">0 / 0</text>
  <text x="514" y="145" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−1</text>
  <text x="576" y="145" text-anchor="middle" font-size="10" fill="#333">0</text>

  <!-- 行 ④ root(1) -->
  <rect x="340" y="154" width="280" height="26" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="358" y="171" text-anchor="middle" font-size="10" fill="#333">④</text>
  <text x="400" y="171" text-anchor="middle" font-size="9" fill="#333">root(1)</text>
  <text x="456" y="171" text-anchor="middle" font-size="9" fill="#555">+1 / −1</text>
  <text x="514" y="171" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">0</text>
  <text x="576" y="171" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>

  <!-- 表格边框 -->
  <rect x="340" y="50" width="280" height="130" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="378" y1="50" x2="378" y2="180" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="422" y1="50" x2="422" y2="180" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="488" y1="50" x2="488" y2="180" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="544" y1="50" x2="544" y2="180" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="50" y="280" width="570" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="335" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">总移动数 = 0 + 2 + 0 + 2 = 4 ✓</text>
  <text x="335" y="322" text-anchor="middle" font-size="10" fill="#555">leaf(3) 送 2 枚给 left(0)；left(0) 留 1 枚、转送 1 枚给 root；root 转 1 枚给 right(0)</text>

  <!-- 关键观察 -->
  <rect x="50" y="346" width="570" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="335" y="368" text-anchor="middle" font-size="10" fill="#555">② 处 moves = |0| + |+2| = 2（2 枚从 leaf 经 left 流向 root）；</text>
  <text x="335" y="388" text-anchor="middle" font-size="10" fill="#555">④ 处 moves = |+1| + |−1| = 2（left 上送 1 枚、right 下拉 1 枚）</text>
</svg>
