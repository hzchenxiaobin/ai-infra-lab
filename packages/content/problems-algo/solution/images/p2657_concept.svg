<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：累计出现 2 次 = 公共</text>
  <text x="260" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">A、B 都是 1..n 的排列，每个数在两组各出现恰好一次</text>

  <!-- A row -->
  <text x="100" y="88" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">A =</text>
  <rect x="110" y="68" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="162" y="68" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="214" y="68" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="266" y="68" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="291" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <!-- B row -->
  <text x="100" y="130" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">B =</text>
  <rect x="110" y="110" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="131" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="162" y="110" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="131" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="214" y="110" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="131" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="266" y="110" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="291" y="131" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <!-- caption between B and cnt -->
  <text x="188" y="158" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">每步给 cnt[A[i]]、cnt[B[i]] 各 +1 ↓</text>

  <!-- cnt row: snapshot after i=1 => [2,0,2,0] -->
  <text x="100" y="194" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">cnt =</text>
  <rect x="110" y="172" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="193" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="162" y="172" width="50" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="193" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">0</text>
  <rect x="214" y="172" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="193" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="266" y="172" width="50" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="291" y="193" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">0</text>

  <!-- subscripts -->
  <text x="135" y="222" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">x=1</text>
  <text x="187" y="222" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">x=2</text>
  <text x="239" y="222" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">x=3</text>
  <text x="291" y="222" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">x=4</text>

  <!-- common box -->
  <rect x="350" y="168" width="140" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="190" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">已公共元素个数</text>
  <text x="420" y="210" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">common = 2</text>
  <path d="M316,188 L348,188" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="332" y="180" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">数 =2</text>

  <!-- legend -->
  <rect x="60" y="250" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="86" y="264" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= 2：两组都见过 → 公共，common++</text>
  <rect x="60" y="276" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="290" font-size="11" fill="#446688" filter="url(#rough2)">= 1：只一组见过（中间态，未公共）</text>
  <rect x="60" y="302" width="20" height="20" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="316" font-size="11" fill="#888" filter="url(#rough2)">= 0：两组都还没见过</text>

  <text x="420" y="270" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（此快照为</text>
  <text x="420" y="286" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">处理完 i=1 后）</text>
</svg>
