<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">首尾配对：arr[i] + arr[n-1-i] = 2n，平均值为 n</text>

  <!-- ===== Pair 0: arr[0]=1, arr[5]=11 ===== -->
  <text x="60" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">配对 0</text>
  <rect x="40" y="70" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="96" y="70" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">11</text>
  <text x="158" y="87" font-size="10" fill="#666">和=12=2×6</text>
  <text x="250" y="87" font-size="10" fill="#b85450" font-weight="bold">操作 (11−1)/2 = 5</text>

  <!-- ===== Pair 1: arr[1]=3, arr[4]=9 ===== -->
  <text x="60" y="118" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">配对 1</text>
  <rect x="40" y="126" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="96" y="126" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <text x="158" y="143" font-size="10" fill="#666">和=12=2×6</text>
  <text x="250" y="143" font-size="10" fill="#b85450" font-weight="bold">操作 (9−3)/2 = 3</text>

  <!-- ===== Pair 2: arr[2]=5, arr[3]=7 ===== -->
  <text x="60" y="174" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">配对 2</text>
  <rect x="40" y="182" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="199" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="96" y="182" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="199" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="158" y="199" font-size="10" fill="#666">和=12=2×6</text>
  <text x="250" y="199" font-size="10" fill="#b85450" font-weight="bold">操作 (7−5)/2 = 1</text>

  <!-- divider -->
  <line x1="40" y1="222" x2="520" y2="222" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- Sum row -->
  <rect x="40" y="232" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="251" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">总操作数 = 5 + 3 + 1 = 9 = 1+3+5（前 n/2 个奇数之和）</text>

  <!-- ===== Formula derivation ===== -->
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">公式推导</text>

  <!-- n even box -->
  <rect x="40" y="294" width="230" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="312" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">n 为偶数 (n=2m)</text>
  <text x="155" y="330" text-anchor="middle" font-size="11" fill="#446688">ops = 1+3+…+(2m−1) = m² = n²/4</text>

  <!-- n odd box -->
  <rect x="290" y="294" width="230" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="312" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">n 为奇数 (n=2m+1)</text>
  <text x="405" y="330" text-anchor="middle" font-size="11" fill="#d6a040">ops = 2+4+…+2m = m(m+1) = (n²−1)/4</text>

  <!-- unified -->
  <rect x="120" y="350" width="320" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="373" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">统一公式：⌊n² / 4⌋ = n × n / 4（整数除法）</text>
</svg>
