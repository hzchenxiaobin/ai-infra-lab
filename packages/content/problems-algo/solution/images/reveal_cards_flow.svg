<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="500" height="420" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程图</text>

  <!-- Step 1: Sort -->
  <rect x="130" y="44" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 排序 deck → sorted[0..n-1]</text>
  <path d="M 250 82 L 250 98" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Init -->
  <rect x="100" y="100" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="123" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">② Q = [0,1,...,n-1]，ans = [0]×n</text>
  <path d="M 250 138 L 250 156" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop container -->
  <rect x="50" y="156" width="400" height="170" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="6 3" rx="10" filter="url(#rough2)"/>
  <text x="70" y="176" font-size="10.5" fill="#d6a040" font-weight="bold">for card in sorted:</text>

  <!-- 3a: pop front -->
  <rect x="110" y="184" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="206" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">③ i = Q.pop_front()</text>
  <path d="M 250 220 L 250 234" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3b: place card -->
  <rect x="110" y="236" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="258" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">④ ans[i] = card</text>
  <path d="M 250 272 L 250 286" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3c: move to back (conditional) -->
  <rect x="90" y="288" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="310" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⑤ if Q 非空: Q.push(Q.pop_front())</text>

  <!-- Loop back arrow -->
  <path d="M 410 305 L 450 305 L 450 170 L 410 170" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="458" y="240" font-size="9.5" fill="#888" transform="rotate(90 458 240)">回到循环头</text>

  <!-- Arrow to return -->
  <path d="M 250 328 L 250 350" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="150" y="352" width="200" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="375" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⑥ return ans</text>

  <!-- Annotation -->
  <text x="250" y="406" text-anchor="middle" font-size="9.5" fill="#888">每个索引至多入队一次、出队一次，总计 O(2n) 次队列操作</text>
</svg>
