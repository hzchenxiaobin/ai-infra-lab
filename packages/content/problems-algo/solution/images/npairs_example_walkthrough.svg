<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">示例演算：b = [1, 0, 4]，diff = 1</text>

  <!-- Root node [1,0,4] -->
  <rect x="245" y="44" width="130" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">[1, 0, 4]</text>

  <!-- edges root -> children -->
  <path d="M290 80 L170 118" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M330 80 L460 118" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- Left child [1,0] (blue) -->
  <rect x="110" y="118" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="170" y="141" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">[1, 0]</text>

  <!-- Right child [4] (orange, leaf) -->
  <rect x="410" y="118" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="141" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">[4]</text>
  <text x="460" y="166" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">单元素，+0</text>

  <!-- edges [1,0] -> leaves -->
  <path d="M150 154 L95 198" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M190 154 L245 198" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- Leaves under [1,0] -->
  <rect x="60" y="198" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="100" y="219" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="100" y="246" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下标 0</text>

  <rect x="205" y="198" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="245" y="219" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[0]</text>
  <text x="245" y="246" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下标 1</text>

  <!-- cross count annotation for [1,0] merge -->
  <rect x="70" y="270" width="280" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="210" y="290" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">跨段：b[0]=1 ≤ b[1]+1=0+1=1 ✓</text>
  <text x="210" y="307" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">cross +1 ⟹ pair (0,1)，归并 → [0, 1]</text>

  <!-- cross count annotation for root merge -->
  <rect x="190" y="328" width="360" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="370" y="350" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">跨段：L=[0,1] 升序，R=[4]；j=4</text>
  <text x="370" y="368" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0≤5 ✓ 且 1≤5 ✓  ⟹ cross +2，pairs (0,2)(1,2)，归并 → [0,1,4]</text>

  <!-- total -->
  <rect x="150" y="402" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="430" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">总数 = 1 (左) + 0 (右) + 2 (跨段) = 3</text>
</svg>
