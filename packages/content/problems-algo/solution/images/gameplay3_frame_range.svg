<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">默认帧 RANGE UNBOUNDED PRECEDING：并列日期会被合并求和</text>

  <!-- left: distinct dates (no tie) -->
  <text x="150" y="58" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">情形 A：日期无并列（本题主键保证）</text>
  <rect x="40" y="68" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="65" y="85" font-size="9" fill="#333">date</text>
  <text x="140" y="85" font-size="9" fill="#333">games</text>
  <text x="205" y="85" font-size="9" fill="#333">SUM</text>
  <line x1="110" y1="68" x2="110" y2="94" stroke="#4a7a3a" stroke-width="0.7" filter="url(#rough2)"/>
  <line x1="185" y1="68" x2="185" y2="94" stroke="#4a7a3a" stroke-width="0.7" filter="url(#rough2)"/>

  <rect x="40" y="94" width="220" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="109" font-size="9.5" fill="#333">d1</text>
  <text x="140" y="109" font-size="9.5" fill="#333">5</text>
  <text x="205" y="109" font-size="9.5" fill="#4a7a3a" font-weight="bold">5</text>

  <rect x="40" y="116" width="220" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="131" font-size="9.5" fill="#333">d2</text>
  <text x="140" y="131" font-size="9.5" fill="#333">6</text>
  <text x="205" y="131" font-size="9.5" fill="#4a7a3a" font-weight="bold">11</text>

  <rect x="40" y="138" width="220" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="153" font-size="9.5" fill="#333">d3</text>
  <text x="140" y="153" font-size="9.5" fill="#333">1</text>
  <text x="205" y="153" font-size="9.5" fill="#4a7a3a" font-weight="bold">12</text>
  <line x1="110" y1="94" x2="110" y2="160" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="185" y1="94" x2="185" y2="160" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <text x="150" y="184" text-anchor="middle" font-size="9.5" fill="#666">ROWS 与 RANGE 结果一致 ✓</text>

  <!-- right: tied dates -->
  <text x="440" y="58" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">情形 B：日期并列（假设放宽主键）</text>
  <rect x="330" y="68" width="240" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="352" y="85" font-size="9" fill="#333">date</text>
  <text x="420" y="85" font-size="9" fill="#333">games</text>
  <text x="480" y="85" font-size="9" fill="#333">ROWS</text>
  <text x="540" y="85" font-size="9" fill="#333">RANGE</text>
  <line x1="395" y1="68" x2="395" y2="94" stroke="#b85450" stroke-width="0.7" filter="url(#rough2)"/>
  <line x1="460" y1="68" x2="460" y2="94" stroke="#b85450" stroke-width="0.7" filter="url(#rough2)"/>
  <line x1="515" y1="68" x2="515" y2="94" stroke="#b85450" stroke-width="0.7" filter="url(#rough2)"/>

  <rect x="330" y="94" width="240" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="352" y="109" font-size="9.5" fill="#333">d1</text>
  <text x="420" y="109" font-size="9.5" fill="#333">5</text>
  <text x="480" y="109" font-size="9.5" fill="#b85450" font-weight="bold">5</text>
  <text x="540" y="109" font-size="9.5" fill="#b85450" font-weight="bold">11</text>

  <rect x="330" y="116" width="240" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="352" y="131" font-size="9.5" fill="#333">d1</text>
  <text x="420" y="131" font-size="9.5" fill="#333">6</text>
  <text x="480" y="131" font-size="9.5" fill="#b85450" font-weight="bold">11</text>
  <text x="540" y="131" font-size="9.5" fill="#b85450" font-weight="bold">11</text>

  <rect x="330" y="138" width="240" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="352" y="153" font-size="9.5" fill="#333">d2</text>
  <text x="420" y="153" font-size="9.5" fill="#333">1</text>
  <text x="480" y="153" font-size="9.5" fill="#b85450" font-weight="bold">12</text>
  <text x="540" y="153" font-size="9.5" fill="#b85450" font-weight="bold">12</text>
  <line x1="395" y1="94" x2="395" y2="160" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="460" y1="94" x2="460" y2="160" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="515" y1="94" x2="515" y2="160" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>

  <text x="440" y="184" text-anchor="middle" font-size="9.5" fill="#b85450">RANGE 把并列 d1 合并 → 两行都得 11 ✗</text>

  <!-- explanation box -->
  <rect x="40" y="210" width="520" height="190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="234" font-size="11.5" fill="#333" font-weight="bold">为什么？默认帧 RANGE 按"值范围"界定</text>

  <text x="60" y="258" font-size="10.5" fill="#555">• ORDER BY event_date + 默认帧 = RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</text>
  <text x="60" y="276" font-size="10.5" fill="#555">• RANGE 模式：帧 = 「所有 event_date ≤ 当前行 date 的行」</text>
  <text x="60" y="294" font-size="10.5" fill="#555">   → 当前列的 date 与 peer 行（同 date）一起纳入求和</text>

  <text x="60" y="320" font-size="10.5" fill="#b85450" font-weight="bold">• ROWS 模式：帧 = 「物理行号从分区首行到当前行」</text>
  <text x="60" y="338" font-size="10.5" fill="#b85450">   → 严格按排序后的物理位置累加，不合并并列行</text>

  <text x="60" y="364" font-size="10.5" fill="#4a7a3a">本题 (player_id, event_date) 是主键 → date 不并列 → 两种模式等价</text>
  <text x="60" y="382" font-size="10.5" fill="#4a7a3a">→ 不写 ROWS 子句也安全。若担心并列，显式写 ROWS BETWEEN 更稳。</text>
</svg>
