<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例① [2,0,1]，k = 4 = 2²：一跳定答案
  </text>

  <!-- left table: pa -->
  <text x="137" y="54" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">pa[i][x]：2^i 步后落点</text>
  <rect x="30" y="62" width="214" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="78" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i ＼ x</text>
  <text x="124" y="78" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <text x="172" y="78" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="220" y="78" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2</text>

  <rect x="30" y="84" width="214" height="22" fill="none" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="124" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="172" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="220" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="30" y="106" width="214" height="22" fill="none" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="124" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="172" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="220" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <rect x="30" y="128" width="214" height="22" fill="none" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="124" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="172" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="220" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <path d="M100,62 L100,150" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M148,62 L148,150" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M196,62 L196,150" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- right table: sum -->
  <text x="383" y="54" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">sum[i][x]：2^i 步接球者和</text>
  <rect x="276" y="62" width="214" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="311" y="78" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i ＼ x</text>
  <text x="370" y="78" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="418" y="78" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="466" y="78" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <rect x="276" y="84" width="214" height="22" fill="none" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="311" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="370" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="418" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="466" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="276" y="106" width="214" height="22" fill="none" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="311" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="370" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="418" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="466" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="276" y="128" width="214" height="22" fill="none" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="311" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="370" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="418" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="466" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <path d="M346,62 L346,150" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M394,62 L394,150" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M442,62 L442,150" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- highlight sum[2][2] -->
  <rect x="442" y="128" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>

  <!-- query section -->
  <text x="260" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    查询：k = 4 只有「第 2 位」是 1 → 每个起点一跳即得
  </text>
  <text x="260" y="198" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    f(0)=0+5=5，f(1)=1+3=4，f(2)=2+4=6 ← 最大
  </text>

  <!-- ball path -->
  <text x="95" y="222" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">起点</text>
  <ellipse cx="95" cy="240" rx="14" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="245" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <ellipse cx="160" cy="240" rx="14" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="245" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <ellipse cx="225" cy="240" rx="14" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="245" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <ellipse cx="290" cy="240" rx="14" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="245" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <ellipse cx="355" cy="240" rx="14" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="355" y="245" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <path d="M111,240 L143,240" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M176,240 L208,240" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M241,240 L273,240" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M306,240 L338,240" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="127" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">传1</text>
  <text x="192" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">传2</text>
  <text x="257" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">传3</text>
  <text x="322" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">传4</text>

  <text x="452" y="236" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">f(2) =</text>
  <text x="452" y="254" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2+1+0+2+1 = 6</text>

  <!-- notes -->
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    触球 5 人次（起点 + 4 次接球），编号按触球次数累加
  </text>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    建表只需 3 层（2^2 = 4 ≥ k）
  </text>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    n = 10^5、k = 10^10 时也只需 34 层，共约 340 万个状态
  </text>
</svg>
