<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：按用户分组，两个存在性断言 → 一次条件聚合</text>

  <rect x="42" y="44" width="110" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="97" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">user 101</text>
  <rect x="54" y="72" width="86" height="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="84" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">Mortgage</text>
  <rect x="54" y="92" width="86" height="17" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="97" y="104" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">AutoLoan</text>
  <rect x="54" y="112" width="86" height="17" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="97" y="124" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">Inschool</text>

  <rect x="164" y="44" width="110" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="219" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">user 102 ★</text>
  <rect x="176" y="72" width="86" height="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="219" y="84" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">Mortgage</text>
  <rect x="176" y="92" width="86" height="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="104" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">Refinance</text>
  <rect x="176" y="112" width="86" height="17" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="219" y="124" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">Inschool</text>

  <rect x="286" y="44" width="110" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="341" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">user 103</text>
  <rect x="298" y="72" width="86" height="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="84" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">Refinance</text>

  <rect x="408" y="44" width="110" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
