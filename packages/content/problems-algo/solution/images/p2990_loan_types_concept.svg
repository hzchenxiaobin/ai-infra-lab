  <text x="70" y="200" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">R:0</text>
  <rect x="99" y="186" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="200" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">M:1</text>

  <rect x="167" y="186" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">R:1</text>
  <rect x="221" y="186" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="200" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">M:1</text>

  <rect x="289" y="186" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="200" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">R:1</text>
  <rect x="343" y="186" width="50" height="20" fill="#fafafa" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="368" y="200" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">M:0</text>

  <rect x="411" y="186" width="50" height="20" fill="#fafafa" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="436" y="200" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">R:0</text>
  <rect x="465" y="186" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="200" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">M:1</text>

  <text x="97" y="222" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 缺 Refinance</text>
  <text x="219" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 两类都有</text>
  <text x="341" y="222" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 缺 Mortgage</text>
  <text x="463" y="222" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 缺 Refinance</text>

  <path d="M 219 230 Q 220 236 240 244" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 341 230 Q 330 240 300 246" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 97 230 Q 160 244 230 248" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 463 230 Q 400 246 330 248" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="252" width="460" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">HAVING SUM(loan_type = 'Refinance') &gt; 0</text>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">AND SUM(loan_type = 'Mortgage') &gt; 0</text>

  <path d="M 280 312 L 280 326" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="330" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#6a8f5e" filter="url(#rough2)">GROUP BY user_id（天然去重）→ ORDER BY user_id</text>
  <text x="280" y="364" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出：102</text>
