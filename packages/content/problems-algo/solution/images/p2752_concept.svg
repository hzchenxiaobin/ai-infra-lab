<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">行号差法：date − ROW_NUMBER() = 岛键</text>

  <!-- Section 1: customer 101 consecutive -->
  <text x="30" y="58" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 顾客 101：连续 3 天 → 岛键恒定</text>

  <!-- table header -->
  <rect x="30" y="66" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">日期 d_k</text>
  <rect x="190" y="66" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">行号 k</text>
  <rect x="290" y="66" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">岛键 d_k − k 天</text>

  <!-- row 1: 5-01 -->
  <rect x="30" y="94" width="160" height="26" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2023-05-01</text>
  <rect x="190" y="94" width="100" height="26" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="290" y="94" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2023-04-30</text>

  <!-- row 2: 5-02 -->
  <rect x="30" y="122" width="160" height="26" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2023-05-02</text>
  <rect x="190" y="122" width="100" height="26" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="290" y="122" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2023-04-30 ✓</text>

  <!-- row 3: 5-03 -->
  <rect x="30" y="150" width="160" height="26" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2023-05-03</text>
  <rect x="190" y="150" width="100" height="26" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="290" y="150" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2023-04-30 ✓</text>

  <text x="270" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">日期 +1 与行号 +1 抵消 → 岛键不变 → 同属一岛（长 3）</text>

  <!-- separator -->
  <line x1="30" y1="210" x2="510" y2="210" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- Section 2: customer 102 gap -->
  <text x="30" y="238" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 顾客 102：5-02 缺失 → 岛键跳变</text>

  <!-- header -->
  <rect x="30" y="246" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">日期 d_k</text>
  <rect x="190" y="246" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">行号 k</text>
  <rect x="290" y="246" width="220" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">岛键 d_k − k 天</text>

  <!-- row 5-01 (island A) -->
  <rect x="30" y="274" width="160" height="26" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2023-05-01</text>
  <rect x="190" y="274" width="100" height="26" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="290" y="274" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2023-04-30 （岛 A）</text>

  <!-- gap marker between 5-01 and 5-03 -->
  <text x="110" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">↕ 5-02 无交易（断点）</text>

  <!-- row 5-03 (island B start) -->
  <rect x="30" y="326" width="160" height="26" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="344" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2023-05-03</text>
  <rect x="190" y="326" width="100" height="26" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="344" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="290" y="326" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="344" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2023-05-01 ✗跳变（岛 B）</text>

  <!-- row 5-04 (island B cont) -->
  <rect x="30" y="354" width="160" height="26" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="372" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2023-05-04</text>
  <rect x="190" y="354" width="100" height="26" fill="#f6f8fa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="372" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="290" y="354" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="372" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2023-05-01 ✓（岛 B）</text>

  <text x="270" y="398" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">日期跳 2 天 > 行号 +1 → 抵消失败 → 岛键跳变 → 裂为新岛</text>
  <text x="270" y="418" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">岛键绝对值无意义，只需「同段同键、异段异键」即可分组</text>
</svg>
