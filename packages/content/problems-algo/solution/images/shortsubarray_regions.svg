<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">只排序中间无序段，整体即升序</text>

  <!-- original array -->
  <text x="34" y="82" font-size="12" fill="#888">原数组</text>
  <rect x="86" y="62" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="82" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="136" y="62" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="82" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="186" y="62" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="82" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="236" y="62" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="286" y="62" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="82" text-anchor="middle" font-size="13" fill="#333">10</text>
  <rect x="336" y="62" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="82" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="386" y="62" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="82" text-anchor="middle" font-size="13" fill="#333">15</text>

  <!-- index labels -->
  <text x="110" y="106" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="160" y="106" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="210" y="106" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="260" y="106" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="310" y="106" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="360" y="106" text-anchor="middle" font-size="10" fill="#999">5</text>
  <text x="410" y="106" text-anchor="middle" font-size="10" fill="#999">6</text>

  <!-- region brackets -->
  <path d="M86 120 L86 128 L132 128 L132 120" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="109" y="144" text-anchor="middle" font-size="10.5" fill="#4a7a3a">前缀有序</text>
  <path d="M136 120 L136 130 L382 130 L382 120" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="259" y="148" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">无序中间段（下标 1..5）</text>
  <path d="M386 120 L386 128 L432 128 L432 120" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="409" y="144" text-anchor="middle" font-size="10.5" fill="#4a7a3a">后缀有序</text>

  <!-- arrow down -->
  <path d="M 260 166 L 260 190" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="276" y="182" font-size="10.5" fill="#777">排序中间段</text>

  <!-- result array -->
  <text x="34" y="218" font-size="12" fill="#888">排序后</text>
  <rect x="86" y="198" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="218" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="136" y="198" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="218" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="186" y="198" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="218" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="236" y="198" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="286" y="198" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="218" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="336" y="198" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="218" text-anchor="middle" font-size="13" fill="#333">10</text>
  <rect x="386" y="198" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="218" text-anchor="middle" font-size="13" fill="#333">15</text>
  <text x="448" y="218" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- result note -->
  <rect x="110" y="256" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = end − start + 1 = 5 − 1 + 1 = 5</text>
  <text x="260" y="294" text-anchor="middle" font-size="10.5" fill="#777">找出无序段的左右边界即可</text>
</svg>
