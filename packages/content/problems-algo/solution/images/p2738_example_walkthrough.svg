<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：3 个文件 → bull=3, bear=2</text>

  <!-- File 1: draft1.txt -->
  <rect x="16" y="46" width="528" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="36" y="64" font-size="10" fill="#446688" filter="url(#rough2)">draft1.txt</text>
  <text x="36" y="82" font-size="10" fill="#333" filter="url(#rough2)">The stock exchange predicts a ␣bull␣ market which would make many investors happy.</text>
  <rect x="232" y="68" width="36" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="500" y="64" font-size="9" fill="#4a7a3a" filter="url(#rough2)">bull ✓</text>
  <text x="500" y="82" font-size="9" fill="#888" filter="url(#rough2)">bear ✗</text>
  <text x="530" y="96" font-size="9" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <!-- File 2: draft2.txt -->
  <rect x="16" y="112" width="528" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="36" y="130" font-size="10" fill="#d6a040" filter="url(#rough2)">draft2.txt</text>
  <text x="36" y="148" font-size="9" fill="#333" filter="url(#rough2)">The stock exchange predicts a ␣bull␣ market which would make many investors happy,</text>
  <text x="36" y="164" font-size="9" fill="#333" filter="url(#rough2)">but analysts warn of possibility of too much optimism and that in fact we are</text>
  <text x="36" y="178" font-size="9" fill="#333" filter="url(#rough2)">awaiting a ␣bear␣ market.</text>
  <rect x="232" y="134" width="36" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="158" y="168" width="36" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="500" y="130" font-size="9" fill="#4a7a3a" filter="url(#rough2)">bull ✓</text>
  <text x="500" y="148" font-size="9" fill="#b85450" filter="url(#rough2)">bear ✓</text>
  <text x="530" y="170" font-size="9" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="530" y="182" font-size="9" fill="#b85450" filter="url(#rough2)">+1</text>

  <!-- File 3: draft3.txt / final.txt -->
  <rect x="16" y="194" width="528" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="36" y="212" font-size="10" fill="#4a7a3a" filter="url(#rough2)">draft3.txt</text>
  <text x="36" y="230" font-size="9" fill="#333" filter="url(#rough2)">The stock exchange predicts a ␣bull␣ market which would make many investors happy,</text>
  <text x="36" y="246" font-size="9" fill="#333" filter="url(#rough2)">but analysts warn of possibility of too much optimism and that in fact we are</text>
  <text x="36" y="260" font-size="9" fill="#333" filter="url(#rough2)">awaiting a ␣bear␣ market. As always predicting the future market is an uncertain</text>
  <text x="36" y="274" font-size="9" fill="#333" filter="url(#rough2)">game and all investors should follow their instincts and best practices.</text>
  <rect x="232" y="216" width="36" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="158" y="250" width="36" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="500" y="212" font-size="9" fill="#4a7a3a" filter="url(#rough2)">bull ✓</text>
  <text x="500" y="230" font-size="9" fill="#b85450" filter="url(#rough2)">bear ✓</text>
  <text x="530" y="252" font-size="9" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="530" y="264" font-size="9" fill="#b85450" filter="url(#rough2)">+1</text>

  <!-- separator -->
  <line x1="16" y1="300" x2="544" y2="300" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- summary -->
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">累计汇总</text>

  <rect x="116" y="338" width="140" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="186" y="358" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">bull</text>
  <text x="186" y="376" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="186" y="338" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">3 个文件命中</text>

  <rect x="304" y="338" width="140" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="374" y="358" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">bear</text>
  <text x="374" y="376" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="374" y="338" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">2 个文件命中</text>

  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每个文件至多含 1 次␣bull␣/␣bear␣，故文件数 = 命中数</text>
</svg>
