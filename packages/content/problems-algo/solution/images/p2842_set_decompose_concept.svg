<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察①：k 子序列 = 字符集合 + 每个字符挑一个出现位置</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">以 s = "bcca"、字符集合 {b, c} 为例（k = 2）</text>

  <!-- string cells -->
  <rect x="206" y="66" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="260" y="66" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="314" y="66" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="368" y="66" width="46" height="40" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="391" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>

  <text x="229" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="283" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="337" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="391" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <text x="229" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">f(b) = 1</text>
  <text x="310" y="140" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">f(c) = 2</text>
  <text x="391" y="140" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">f(a) = 1</text>

  <!-- arrows to two boxes -->
  <path d="M 275 148 L 190 168" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 345 148 L 430 168" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- beauty box -->
  <rect x="70" y="172" width="210" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="175" y="196" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">美丽值（只看集合）</text>
  <text x="175" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Σ f(c) = 1 + 2 = 3</text>

  <!-- count box -->
  <rect x="340" y="172" width="210" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="196" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">方案数（乘法原理）</text>
  <text x="445" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">∏ f(c) = 1 × 2 = 2</text>

  <text x="310" y="254" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">集合 {b, c} 对应的全部 k 子序列（共 2 个）：</text>

  <rect x="180" y="264" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="284" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">b₀c₁ → "bc"</text>
  <rect x="330" y="264" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="284" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">b₀c₂ → "bc"</text>

  <text x="310" y="318" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">拼出的字符串相同，但下标集合不同 ⇒ 计 2 个子序列</text>

  <rect x="70" y="330" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="355" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">转化：在 ≤ 26 个频次中选 k 个 → 最大化 Σ f，累加所有最大集合的 ∏ f</text>
</svg>
