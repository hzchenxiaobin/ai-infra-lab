<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">LEFT JOIN：保留左表全部行，右表无匹配填 NULL</text>

  <!-- Person table (left) -->
  <text x="95" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Person（左表）</text>
  <rect x="30" y="64" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="82" font-size="10" fill="#333">personId</text>
  <text x="108" y="82" font-size="10" fill="#333">firstName</text>
  <line x1="95" y1="64" x2="95" y2="92" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="92" width="130" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="108" font-size="10" fill="#333">1</text>
  <text x="108" y="108" font-size="10" fill="#333">Allen</text>
  <line x1="95" y1="92" x2="95" y2="116" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="116" width="130" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="132" font-size="10" fill="#333">2</text>
  <text x="108" y="132" font-size="10" fill="#333">Bob</text>
  <line x1="95" y1="116" x2="95" y2="140" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="140" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="48" y="156" font-size="10" fill="#333">3</text>
  <text x="108" y="156" font-size="10" fill="#333">David</text>
  <line x1="95" y1="140" x2="95" y2="164" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="95" y="180" text-anchor="middle" font-size="9.5" fill="#d6a040">↑ 无地址的人</text>

  <!-- Address table (right) -->
  <text x="435" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Address（右表）</text>
  <rect x="370" y="64" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="82" font-size="10" fill="#333">personId</text>
  <text x="455" y="82" font-size="10" fill="#333">city</text>
  <line x1="435" y1="64" x2="435" y2="92" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="370" y="92" width="130" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="388" y="108" font-size="10" fill="#333">1</text>
  <text x="455" y="108" font-size="10" fill="#333">AllenTown</text>
  <line x1="435" y1="92" x2="435" y2="116" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="370" y="116" width="130" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="388" y="132" font-size="10" fill="#333">1</text>
  <text x="455" y="132" font-size="10" fill="#333">Petaluma</text>
  <line x1="435" y1="116" x2="435" y2="140" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="370" y="140" width="130" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="388" y="156" font-size="10" fill="#333">2</text>
  <text x="455" y="156" font-size="10" fill="#333">Columbus</text>
  <line x1="435" y1="140" x2="435" y2="164" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Join arrows -->
  <path d="M160 104 L370 104" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M160 128 L370 128" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M160 152 L360 180" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="265" y="98" text-anchor="middle" font-size="9" fill="#446688">ON p.personId = a.personId</text>

  <!-- Result table (bottom) -->
  <text x="280" y="210" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">结果（LEFT JOIN 产出）</text>
  <rect x="80" y="216" width="400" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="234" font-size="10" fill="#333">firstName</text>
  <text x="200" y="234" font-size="10" fill="#333">lastName</text>
  <text x="300" y="234" font-size="10" fill="#333">city</text>
  <text x="400" y="234" font-size="10" fill="#333">state</text>
  <line x1="160" y1="216" x2="160" y2="244" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="250" y1="216" x2="250" y2="244" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="350" y1="216" x2="350" y2="244" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="80" y="244" width="400" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="259" font-size="10" fill="#333">Allen</text>
  <text x="200" y="259" font-size="10" fill="#333">Wang</text>
  <text x="300" y="259" font-size="10" fill="#333">AllenTown</text>
  <text x="400" y="259" font-size="10" fill="#333">New York</text>
  <line x1="160" y1="244" x2="160" y2="266" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="250" y1="244" x2="250" y2="266" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="350" y1="244" x2="350" y2="266" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="80" y="266" width="400" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="281" font-size="10" fill="#333">Allen</text>
  <text x="200" y="281" font-size="10" fill="#333">Wang</text>
  <text x="300" y="281" font-size="10" fill="#333">Petaluma</text>
  <text x="400" y="281" font-size="10" fill="#333">California</text>
  <line x1="160" y1="266" x2="160" y2="288" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="250" y1="266" x2="250" y2="288" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="350" y1="266" x2="350" y2="288" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="80" y="288" width="400" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="303" font-size="10" fill="#333">Bob</text>
  <text x="200" y="303" font-size="10" fill="#333">Alice</text>
  <text x="300" y="303" font-size="10" fill="#333">Columbus</text>
  <text x="400" y="303" font-size="10" fill="#333">Georgia</text>
  <line x1="160" y1="288" x2="160" y2="310" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="250" y1="288" x2="250" y2="310" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="350" y1="288" x2="350" y2="310" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="80" y="310" width="400" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="120" y="325" font-size="10" fill="#333">David</text>
  <text x="200" y="325" font-size="10" fill="#333">Chen</text>
  <text x="300" y="325" font-size="10" fill="#b85450" font-weight="bold">NULL</text>
  <text x="400" y="325" font-size="10" fill="#b85450" font-weight="bold">NULL</text>
  <line x1="160" y1="310" x2="160" y2="332" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="250" y1="310" x2="250" y2="332" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="350" y1="310" x2="350" y2="332" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Callout for NULL row -->
  <path d="M300 338 L300 358" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="160" y="362" width="240" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#333">David 无地址记录</text>
  <text x="280" y="396" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">LEFT JOIN 仍保留该行，city/state 填 NULL</text>
</svg>
