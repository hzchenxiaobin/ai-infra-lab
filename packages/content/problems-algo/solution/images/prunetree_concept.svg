<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二叉树剪枝：删掉所有不含 1 的子树</text>

  <!-- ===== 原树 ===== -->
  <text x="140" y="58" text-anchor="middle" font-size="12" fill="#888">剪枝前</text>

  <!-- 根 1 -->
  <circle cx="140" cy="80" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="85" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- 根左 null -->
  <text x="100" y="122" text-anchor="middle" font-size="10" fill="#bbb" font-style="italic">null</text>
  <!-- 根右 0 (B) -->
  <line x1="152" y1="93" x2="180" y2="118" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="190" cy="132" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="137" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- B 左 0 (C) —— 红色待删 -->
  <line x1="180" y1="145" x2="155" y2="172" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="148" cy="185" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="148" y="189" text-anchor="middle" font-size="11" fill="#b85450">0</text>
  <!-- B 右 1 -->
  <line x1="200" y1="145" x2="225" y2="172" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="232" cy="185" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="232" y="189" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- 红色叉标记 -->
  <path d="M 138 178 L 158 192 M 158 178 L 138 192" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="148" y="215" text-anchor="middle" font-size="9" fill="#b85450">叶子=0, 不含1</text>

  <!-- ===== 箭头 ===== -->
  <path d="M 270 130 L 370 130" stroke="#82b366" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">后序 DFS</text>
  <text x="320" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">删空子树</text>

  <!-- ===== 剪枝后 ===== -->
  <text x="460" y="58" text-anchor="middle" font-size="12" fill="#888">剪枝后</text>

  <!-- 根 1 -->
  <circle cx="400" cy="80" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="85" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- 根右 0 (B) -->
  <line x1="412" y1="93" x2="440" y2="118" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="450" cy="132" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="137" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- B 右 1 -->
  <line x1="460" y1="145" x2="490" y2="172" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="495" cy="185" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="495" y="189" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- ===== 说明框 ===== -->
  <rect x="50" y="240" width="480" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">后序递归描述</text>
  <text x="70" y="286" font-size="11" fill="#555">prune(root) =</text>
  <text x="90" y="304" font-size="11" fill="#555">① root == null → 返回 null</text>
  <text x="90" y="322" font-size="11" fill="#555">② root.left = prune(root.left) ；root.right = prune(root.right)</text>
  <text x="90" y="340" font-size="11" fill="#555">③ 若 root.val == 0 且左右子树都为 null → 返回 null（删除自身）</text>
  <text x="90" y="356" font-size="11" fill="#888">否则返回 root（子树含 1，保留）</text>
</svg>
