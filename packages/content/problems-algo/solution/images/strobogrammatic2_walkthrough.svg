<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：n = 4 的三层递归展开</text>

  <!-- ===== Step 1: helper(0) ===== -->
  <rect x="40" y="50" width="180" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="72" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">Step 1: helper(0)</text>
  <text x="130" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">base case → [""]</text>
  <text x="130" y="106" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1 个空串（核心）</text>

  <!-- 箭头 step1 → step2 -->
  <line x1="130" y1="112" x2="130" y2="138" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="146" y="128" font-size="10" fill="#4a7a3a" filter="url(#rough2)">包裹 5 对</text>

  <!-- ===== Step 2: helper(2) ===== -->
  <rect x="40" y="142" width="480" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="164" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">Step 2: helper(2)</text>
  <text x="130" y="180" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">m=2 ≠ n=4，含 0</text>

  <!-- 5 对结果格子 -->
  <rect x="180" y="156" width="56" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="177" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">00</text>

  <rect x="244" y="156" width="56" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="177" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">11</text>

  <rect x="308" y="156" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="336" y="177" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">69</text>

  <rect x="372" y="156" width="56" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="177" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">88</text>

  <rect x="436" y="156" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="464" y="177" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">96</text>

  <!-- 配对来源标注 -->
  <text x="208" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0+''+0</text>
  <text x="272" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1+''+1</text>
  <text x="336" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6+''+9</text>
  <text x="400" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">8+''+8</text>
  <text x="464" y="204" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">9+''+6</text>

  <text x="130" y="218" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">→ 5 个长度 2 的串</text>

  <!-- 箭头 step2 → step3 -->
  <line x1="280" y1="232" x2="280" y2="258" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="296" y="248" font-size="10" fill="#4a7a3a" filter="url(#rough2)">包裹 4 对（禁 0）</text>

  <!-- ===== Step 3: helper(4) ===== -->
  <rect x="40" y="262" width="480" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="284" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">Step 3: helper(4)</text>
  <text x="130" y="300" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">m=4 == n=4，禁 0</text>

  <!-- 4 行 × 5 列结果表 -->
  <!-- 行标签 -->
  <text x="120" y="324" text-anchor="end" font-size="11" fill="#d6a040" filter="url(#rough2)">1+_+1：</text>
  <text x="120" y="346" text-anchor="end" font-size="11" fill="#d6a040" filter="url(#rough2)">6+_+9：</text>
  <text x="120" y="368" text-anchor="end" font-size="11" fill="#d6a040" filter="url(#rough2)">8+_+8：</text>
  <text x="120" y="388" text-anchor="end" font-size="11" fill="#d6a040" filter="url(#rough2)">9+_+6：</text>

  <!-- Row 1: 1+s+1 -->
  <text x="148" y="324" font-size="12" fill="#333" filter="url(#rough2)">1001</text>
  <text x="200" y="324" font-size="12" fill="#333" filter="url(#rough2)">1111</text>
  <text x="252" y="324" font-size="12" fill="#333" filter="url(#rough2)">1691</text>
  <text x="304" y="324" font-size="12" fill="#333" filter="url(#rough2)">1881</text>
  <text x="356" y="324" font-size="12" fill="#333" filter="url(#rough2)">1961</text>

  <!-- Row 2: 6+s+9 -->
  <text x="148" y="346" font-size="12" fill="#333" filter="url(#rough2)">6009</text>
  <text x="200" y="346" font-size="12" fill="#333" filter="url(#rough2)">6119</text>
  <text x="252" y="346" font-size="12" fill="#333" filter="url(#rough2)">6699</text>
  <text x="304" y="346" font-size="12" fill="#333" filter="url(#rough2)">6889</text>
  <text x="356" y="346" font-size="12" fill="#333" filter="url(#rough2)">6969</text>

  <!-- Row 3: 8+s+8 -->
  <text x="148" y="368" font-size="12" fill="#333" filter="url(#rough2)">8008</text>
  <text x="200" y="368" font-size="12" fill="#333" filter="url(#rough2)">8118</text>
  <text x="252" y="368" font-size="12" fill="#333" filter="url(#rough2)">8698</text>
  <text x="304" y="368" font-size="12" fill="#333" filter="url(#rough2)">8888</text>
  <text x="356" y="368" font-size="12" fill="#333" filter="url(#rough2)">8968</text>

  <!-- Row 4: 9+s+6 -->
  <text x="148" y="388" font-size="12" fill="#333" filter="url(#rough2)">9006</text>
  <text x="200" y="388" font-size="12" fill="#333" filter="url(#rough2)">9116</text>
  <text x="252" y="388" font-size="12" fill="#333" filter="url(#rough2)">9696</text>
  <text x="304" y="388" font-size="12" fill="#333" filter="url(#rough2)">9886</text>
  <text x="356" y="388" font-size="12" fill="#333" filter="url(#rough2)">9966</text>

  <!-- 乘法公式 -->
  <rect x="420" y="310" width="90" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="465" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">5 × 4</text>
  <text x="465" y="350" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">= 20</text>
  <text x="465" y="368" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">最终结果</text>

  <!-- 底部总结 -->
  <rect x="40" y="406" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="425" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1（核心）× 5（内层含 0）× 4（外层禁 0）= 20</text>
  <text x="280" y="440" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">每层结果数 = 内层结果数 × 该层可选对数</text>
</svg>
