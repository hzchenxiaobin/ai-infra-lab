<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：提取数字块 → 去前导零 → 哈希去重</text>

  <!-- Stage 1: original string "a1b01c001" -->
  <text x="48" y="66" font-size="11" fill="#888" filter="url(#rough2)">原始字符串</text>
  <g font-size="14" text-anchor="middle">
    <rect x="120" y="54" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="138" y="76" fill="#888" filter="url(#rough2)">a</text>
    <rect x="160" y="54" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="178" y="76" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="200" y="54" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="218" y="76" fill="#888" filter="url(#rough2)">b</text>
    <rect x="240" y="54" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="258" y="76" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
    <rect x="280" y="54" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="298" y="76" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="320" y="54" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="338" y="76" fill="#888" filter="url(#rough2)">c</text>
    <rect x="360" y="54" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="378" y="76" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
    <rect x="400" y="54" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="418" y="76" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
    <rect x="440" y="54" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="458" y="76" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  </g>

  <!-- arrow down -->
  <path d="M 280 92 L 280 110" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="106" font-size="10" fill="#888" filter="url(#rough2)">提取连续数字段</text>

  <!-- Stage 2: extracted blocks "1" "01" "001" -->
  <text x="48" y="140" font-size="11" fill="#888" filter="url(#rough2)">数字块</text>
  <g font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="140" y="126" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="168" y="148" fill="#d6a040" filter="url(#rough2)">"1"</text>
    <rect x="240" y="126" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="268" y="148" fill="#d6a040" filter="url(#rough2)">"01"</text>
    <rect x="340" y="126" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="372" y="148" fill="#d6a040" filter="url(#rough2)">"001"</text>
  </g>

  <!-- arrow down -->
  <path d="M 280 162 L 280 180" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="176" font-size="10" fill="#888" filter="url(#rough2)">去前导零（归一化）</text>

  <!-- Stage 3: normalized "1" "1" "1" -->
  <text x="48" y="210" font-size="11" fill="#888" filter="url(#rough2)">归一化</text>
  <g font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="140" y="196" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="168" y="218" fill="#4a7a3a" filter="url(#rough2)">"1"</text>
    <rect x="240" y="196" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="268" y="218" fill="#4a7a3a" filter="url(#rough2)">"1"</text>
    <rect x="340" y="196" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="372" y="218" fill="#4a7a3a" filter="url(#rough2)">"1"</text>
  </g>

  <!-- arrow down -->
  <path d="M 280 232 L 280 250" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="246" font-size="10" fill="#888" filter="url(#rough2)">哈希集合自动去重</text>

  <!-- Stage 4: set {"1"} -->
  <text x="48" y="282" font-size="11" fill="#888" filter="url(#rough2)">哈希集合</text>
  <rect x="200" y="266" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">seen = { "1" }</text>
  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">三个 "1" 合并为一个</text>

  <!-- Result -->
  <path d="M 40 326 L 520 326" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="140" y="340" width="280" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"1"、"01"、"001" 去前导零后均为 "1"</text>
  <text x="280" y="376" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">不同整数数目 = |seen| = 1</text>

  <!-- Footer -->
  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">橙框=原始数字块；绿框=去前导零后；蓝框=哈希集合</text>
</svg>
