<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：撞击在起点两侧严格交替</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">nums = [1,0,2,0,3]，起点 i=3 向右出发 —— 折线是小球轨迹（向下 = 时间推进）</text>

  <!-- 数组格子 -->
  <rect x="130" y="56" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="81" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="182" y="56" width="52" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="81" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">0</text>
  <rect x="234" y="56" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="81" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="286" y="56" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="312" y="81" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="338" y="56" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="81" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="156" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="208" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="260" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="312" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="364" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>

  <!-- L / R 括号 -->
  <path d="M 130 118 L 130 124 L 206 124 L 206 130 M 210 124 L 286 124 L 286 118" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="208" y="144" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">L = 1+0+2 = 3</text>
  <path d="M 338 118 L 338 124 L 362 124 L 362 130 M 366 124 L 390 124 L 390 118" fill="none" stroke="#a07830" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="364" y="144" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">R = 3</text>

  <!-- 纵向参考虚线 -->
  <path d="M 156 150 L 156 310" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <path d="M 260 150 L 260 310" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <path d="M 312 150 L 312 310" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <path d="M 364 150 L 364 310" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>

  <!-- 时间轴 -->
  <path d="M 66 160 L 66 296" fill="none" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="150" font-size="10" fill="#999" filter="url(#rough2)">时间</text>

  <!-- 弹球轨迹折线 -->
  <circle cx="312" cy="158" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="312" y="150" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">起点 i=3</text>

  <path d="M 312 158 L 362 179" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <circle cx="364" cy="179" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <text x="374" y="183" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">右¹ 3→2</text>

  <path d="M 364 179 L 262 200" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <circle cx="260" cy="200" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="250" y="204" text-anchor="end" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">左¹ 2→1</text>

  <path d="M 260 200 L 362 221" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <circle cx="364" cy="221" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <text x="374" y="225" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">右² 2→1</text>

  <path d="M 364 221 L 262 242" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <circle cx="260" cy="242" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="250" y="246" text-anchor="end" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">左² 1→0</text>

  <path d="M 260 242 L 362 263" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <circle cx="364" cy="263" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <text x="374" y="267" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">右³ 1→0</text>

  <path d="M 364 263 L 158 284" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <circle cx="156" cy="284" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="146" y="288" text-anchor="end" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">左³ 1→0</text>

  <path d="M 156 284 L 458 305" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="328" text-anchor="end" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">全零 → 向右滑出边界 ✓</text>

  <!-- 底部结论 -->
  <rect x="20" y="336" width="480" height="54" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="357" font-size="10" fill="#333" filter="url(#rough2)">① 撞击严格按 右、左、右、左… 交替 —— 反向扫过的是刚验证过的全零区，下一个正数必在另一侧；</text>
  <text x="34" y="375" font-size="10" fill="#333" filter="url(#rough2)">② 终局判定：L=R → +2（双向可行）；|L−R|=1 → +1（朝大的一侧出发）；|L−R|≥2 → 小侧先被吃空，必败。</text>
</svg>
