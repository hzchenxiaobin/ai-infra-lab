<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="20" y="26" font-size="13" fill="#333" filter="url(#rough2)">特判 m=1，再二分答案：O(n log n)</text>

  <!-- start -->
  <rect x="200" y="34" width="120" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="13" fill="#2d4d22" filter="url(#rough2)">开始</text>
  <path d="M260,64 L260,74" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- preprocess runs -->
  <rect x="160" y="78" width="200" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">预处理：切游程，记下各段长度</text>
  <path d="M260,110 L260,120" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: m=1 feasible? -->
  <polygon points="260,124 372,160 260,196 148,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">m = 1 可行？</text>
  <text x="260" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">min 失配数 ≤ numOps ?</text>

  <!-- yes: return 1 -->
  <text x="378" y="150" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M372,160 L396,160" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="143" width="96" height="34" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="165" text-anchor="middle" font-size="13" fill="#2d4d22" filter="url(#rough2)">返回 1</text>

  <!-- no: binary search -->
  <text x="270" y="214" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M260,196 L260,226" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="230" width="220" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="251" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">二分答案：lo = 2，hi = max(L)</text>
  <path d="M260,262 L260,272" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: check(mid) -->
  <polygon points="260,276 382,312 260,348 138,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">check(mid)：</text>
  <text x="260" y="324" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Σ ⌊L/(mid+1)⌋ ≤ numOps ?</text>

  <!-- yes: hi = mid -->
  <text x="128" y="298" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M138,312 L114,312" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="22" y="295" width="88" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="317" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">hi = mid</text>
  <path d="M66,295 L66,246 L144,246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no: lo = mid+1 -->
  <text x="390" y="298" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M382,312 L406,312" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="410" y="295" width="92" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="456" y="317" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">lo = mid+1</text>
  <path d="M456,295 L456,246 L376,246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- exit: return lo -->
  <path d="M260,348 L260,362" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="360" font-size="10.5" fill="#666" filter="url(#rough2)">lo = hi 时结束</text>
  <rect x="200" y="366" width="120" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="13" fill="#2d4d22" filter="url(#rough2)">返回 lo</text>
</svg>
