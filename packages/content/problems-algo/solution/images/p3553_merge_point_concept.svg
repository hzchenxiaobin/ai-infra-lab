<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：最小子树 = 两条路径的并 = 以 m 为中心的三岔树</text>
  <text x="310" y="44" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">树上路径唯一 → 并集连通且无冗余边；m 是三点的「中位点」</text>

  <!-- 左：三岔树示意 -->
  <text x="160" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">三岔树（腿 A/B/C 各是一条链）</text>

  <!-- 腿 A：a → n1 → m，蓝 -->
  <path d="M 75 132 L 110 172" fill="none" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <text x="82" y="150" font-size="11" fill="#446688" filter="url(#rough2)">2</text>
  <path d="M 110 172 L 144 205" fill="none" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <text x="121" y="197" font-size="11" fill="#446688" filter="url(#rough2)">3</text>

  <!-- 腿 B：b → n2 → m，绿 -->
  <path d="M 235 130 L 196 170" fill="none" stroke="#4a7a3a" stroke-width="3" filter="url(#rough2)"/>
  <text x="228" y="148" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <path d="M 196 170 L 157 205" fill="none" stroke="#4a7a3a" stroke-width="3" filter="url(#rough2)"/>
  <text x="180" y="197" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- 腿 C：m → n3 → c，橙 -->
  <path d="M 150 220 L 150 262" fill="none" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <text x="162" y="246" font-size="11" fill="#8a6a20" filter="url(#rough2)">3</text>
  <path d="M 150 262 L 158 305" fill="none" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <text x="163" y="290" font-size="11" fill="#8a6a20" filter="url(#rough2)">4</text>

  <!-- 中间节点 -->
  <circle cx="110" cy="172" r="6" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="196" cy="170" r="6" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="150" cy="262" r="6" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 汇合点 m -->
  <circle cx="150" cy="212" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="150" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">m</text>
  <text x="150" y="240" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">汇合点</text>

  <!-- 三个端点 -->
  <circle cx="75" cy="122" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="75" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <text x="75" y="100" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">src1</text>

  <circle cx="237" cy="120" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="237" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <text x="237" y="98" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">src2</text>

  <circle cx="160" cy="316" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="160" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">c</text>
  <text x="160" y="342" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">dest</text>

  <!-- 腿权标注 -->
  <text x="52" y="172" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">腿A=5</text>
  <text x="238" y="170" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">腿B=6</text>
  <text x="185" y="268" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">腿C=7</text>

  <rect x="40" y="352" width="245" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="162" y="372" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">最小子树总权 = 5 + 6 + 7 = 18</text>

  <!-- 右：三条两两路径 -->
  <rect x="330" y="66" width="262" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="461" y="87" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">P(a,b) = 腿A + 腿B = 5 + 6 = 11</text>
  <path d="M 461 100 L 461 110" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="330" y="112" width="262" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="461" y="133" text-anchor="middle" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">P(b,c) = 腿B + 腿C = 6 + 7 = 13</text>
  <path d="M 461 146 L 461 156" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="330" y="158" width="262" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="461" y="179" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">P(c,a) = 腿C + 腿A = 7 + 5 = 12</text>
  <path d="M 461 192 L 461 202" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="330" y="204" width="262" height="40" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="461" y="221" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">相加 = 36 = 2 × (5+6+7)</text>
  <text x="461" y="237" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">每条腿恰好被数了两遍！</text>
  <path d="M 461 244 L 461 254" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="330" y="256" width="262" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="461" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = (d(a,b) + d(b,c) + d(c,a)) / 2</text>
  <text x="461" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">= 36 / 2 = 18</text>

  <rect x="330" y="316" width="262" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="461" y="336" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">d(x,y) = dist[x] + dist[y] − 2·dist[LCA(x,y)]</text>
  <text x="461" y="354" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dist[·]：根到各点距离，一次 BFS 得到</text>
  <text x="461" y="372" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">LCA：倍增，单次 O(log n)</text>
</svg>
