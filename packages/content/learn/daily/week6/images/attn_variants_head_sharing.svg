    <text x="157" y="286">Q0</text><text x="199" y="286">Q1</text><text x="241" y="286">Q2</text><text x="283" y="286">Q3</text>
    <text x="325" y="286">Q4</text><text x="367" y="286">Q5</text><text x="409" y="286">Q6</text><text x="451" y="286">Q7</text>
  </g>
  <g filter="url(#sk)" stroke="#c98a2b" stroke-width="1" fill="none">
    <path d="M 157 292 Q 190 308 285 322"/><path d="M 199 292 Q 225 308 292 322"/><path d="M 241 292 Q 250 308 299 322"/><path d="M 283 292 Q 280 308 304 322"/>
    <path d="M 325 292 Q 322 308 310 322"/><path d="M 367 292 Q 355 308 317 322"/><path d="M 409 292 Q 388 308 324 322"/><path d="M 451 292 Q 420 308 330 322"/>
  </g>
  <g filter="url(#sk)">
    <rect x="140" y="322" width="330" height="20" rx="4" fill="#fbeed3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="305" y="336" font-size="10" fill="#7a5415" text-anchor="middle">K0V0 ← 全部 Q 头共享</text>
  <text x="560" y="300" font-size="12" fill="#2b2b2b">所有 Q 头共享同一份 K/V</text>
  <text x="560" y="320" font-size="12" fill="#7a5415" font-weight="bold">cache → 1/8，⚠ 头多样性受损</text>

  <!-- ── 底部 MLA 提示 ── -->
  <g filter="url(#sk)">
    <rect x="40" y="368" width="780" height="44" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.3" fill-opacity="0.3"/>
  </g>
  <text x="56" y="386" font-size="13" fill="#5d3a7e" font-weight="bold">MLA 换思路：不存 K/V 头</text>
  <text x="56" y="404" font-size="11" fill="#5d3a7e">只缓存 1 个低秩联合隐向量 c_KV（d_c=512）+ 共享位置键 k_R（64 维）→ 机制详见下一张图</text>
</svg>
