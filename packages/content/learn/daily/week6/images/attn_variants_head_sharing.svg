<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="860" height="430" fill="#fdfcf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">MHA / GQA / MQA：KV 头共享方式对比（以 8 个 query 头为例）</text>
  <path d="M 250 38 Q 430 46 610 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ── MHA 面板 ── -->
  <g filter="url(#sk)">
    <rect x="40" y="58" width="780" height="96" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" fill-opacity="0.25"/>
  </g>
  <text x="56" y="88" font-size="14" fill="#2b6e9e" font-weight="bold">MHA</text>
  <text x="56" y="106" font-size="10" fill="#666">n_kv = 8</text>
  <g filter="url(#sk)">
    <rect x="140" y="68" width="34" height="20" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
