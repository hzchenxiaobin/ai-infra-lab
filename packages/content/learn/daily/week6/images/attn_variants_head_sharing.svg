    <rect x="434" y="118" width="34" height="20" rx="4" fill="#dbe7f6" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="10" fill="#2b6e9e" text-anchor="middle">
    <text x="157" y="132">K0V0</text><text x="199" y="132">K1V1</text><text x="241" y="132">K2V2</text><text x="283" y="132">K3V3</text>
    <text x="325" y="132">K4V4</text><text x="367" y="132">K5V5</text><text x="409" y="132">K6V6</text><text x="451" y="132">K7V7</text>
  </g>
  <text x="560" y="96" font-size="12" fill="#2b2b2b">每个 Q 头独立一份 K/V</text>
  <text x="560" y="116" font-size="12" fill="#2b6e9e" font-weight="bold">cache 基准 1×（8 份）</text>

  <!-- ── GQA 面板 ── -->
  <g filter="url(#sk)">
    <rect x="40" y="160" width="780" height="96" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" fill-opacity="0.25"/>
  </g>
  <text x="56" y="190" font-size="14" fill="#2e6e2e" font-weight="bold">GQA</text>
  <text x="56" y="208" font-size="10" fill="#666">n_kv = 2，g=4</text>
  <g filter="url(#sk)">
    <rect x="140" y="170" width="34" height="20" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="182" y="170" width="34" height="20" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
