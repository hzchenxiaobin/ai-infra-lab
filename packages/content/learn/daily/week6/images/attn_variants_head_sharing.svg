    <text x="157" y="184">Q0</text><text x="199" y="184">Q1</text><text x="241" y="184">Q2</text><text x="283" y="184">Q3</text>
    <text x="325" y="184">Q4</text><text x="367" y="184">Q5</text><text x="409" y="184">Q6</text><text x="451" y="184">Q7</text>
  </g>
  <g filter="url(#sk)" stroke="#4a8e4a" stroke-width="1" fill="none">
    <path d="M 157 190 Q 180 205 200 218"/><path d="M 199 190 Q 210 205 210 218"/><path d="M 241 190 Q 235 205 240 218"/><path d="M 283 190 Q 260 205 272 218"/>
    <path d="M 325 190 Q 345 205 368 218"/><path d="M 367 190 Q 372 205 378 218"/><path d="M 409 190 Q 392 205 388 218"/><path d="M 451 190 Q 428 205 398 218"/>
  </g>
  <g filter="url(#sk)">
    <rect x="140" y="220" width="162" height="20" rx="4" fill="#dcefe2" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="308" y="220" width="162" height="20" rx="4" fill="#dcefe2" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <g font-size="10" fill="#2e6e2e" text-anchor="middle">
    <text x="221" y="234">K0V0 ← Q0-Q3（kv_h = h/4）</text>
    <text x="389" y="234">K1V1 ← Q4-Q7</text>
  </g>
  <text x="560" y="198" font-size="12" fill="#2b2b2b">每 4 个 Q 头共享一组 K/V</text>
  <text x="560" y="218" font-size="12" fill="#2e6e2e" font-weight="bold">cache → 1/4（LLaMA-3 同理 32Q/8KV）</text>

  <!-- ── MQA 面板 ── -->
  <g filter="url(#sk)">
    <rect x="40" y="262" width="780" height="96" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" fill-opacity="0.25"/>
  </g>
  <text x="56" y="292" font-size="14" fill="#7a5415" font-weight="bold">MQA</text>
  <text x="56" y="310" font-size="10" fill="#666">n_kv = 1</text>
  <g filter="url(#sk)">
    <rect x="140" y="272" width="34" height="20" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="182" y="272" width="34" height="20" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="224" y="272" width="34" height="20" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
