<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="940" height="620" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">动画：PagedAttention —— token 生成 → block 分配 → block table 映射</text>
  <path d="M 230 42 Q 470 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="58" text-anchor="middle" font-size="12" fill="#666">seq_len=50、block_size=16（每小格=4 token）：token 写满一个逻辑 block → 从空闲池分配物理 block → block table 追加映射（循环播放）</text>

  <!-- ============ 逻辑 view ============ -->
  <text x="40" y="100" font-size="14" font-weight="bold" fill="#2b6e9e">逻辑 view（序列视角，连续编号）</text>
  <g filter="url(#sk)">
    <g stroke="#4a8edb" stroke-width="1.2" fill="#eef5fc">
      <rect x="40" y="114" width="100" height="56" rx="4"/>
      <rect x="150" y="114" width="100" height="56" rx="4"/>
      <rect x="260" y="114" width="100" height="56" rx="4"/>
      <rect x="370" y="114" width="100" height="56" rx="4"/>
    </g>
  </g>
  <g font-size="11" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="90" y="130">逻辑 block 0</text><text x="200" y="130">逻辑 block 1</text>
    <text x="310" y="130">逻辑 block 2</text><text x="420" y="130">逻辑 block 3</text>
  </g>
  <g font-size="9" fill="#666" text-anchor="middle">
    <text x="90" y="184">token 0..15</text><text x="200" y="184">token 16..31</text>
    <text x="310" y="184">token 32..47</text><text x="420" y="184">token 48..49</text>
  </g>

  <!-- 逻辑 block 内的 token 格（随时间逐个写入） -->
  <g fill="#4a8edb" stroke="#2b6e9e" stroke-width="0.6">
    <!-- block 0：keyTimes .0375/.075/.1125/.15 -->
    <rect x="44" y="136" width="22" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0375;0.0417;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="68" y="136" width="22" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.075;0.0792;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="92" y="136" width="22" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1125;0.1167;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="116" y="136" width="22" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.1542;1" dur="12s" repeatCount="indefinite"/></rect>
    <!-- block 1：.2208/.2583/.2958/.3333 -->
    <rect x="154" y="136" width="22" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2208;0.225;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="178" y="136" width="22" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2583;0.2625;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="202" y="136" width="22" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2958;0.3;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="226" y="136" width="22" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3333;0.3375;1" dur="12s" repeatCount="indefinite"/></rect>
    <!-- block 2：.4042/.4417/.4792/.5167 -->
    <rect x="264" y="136" width="22" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4042;0.4083;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="288" y="136" width="22" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4417;0.4458;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="312" y="136" width="22" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4792;0.4833;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="336" y="136" width="22" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5167;0.5208;1" dur="12s" repeatCount="indefinite"/></rect>
    <!-- block 3：只有 2 个 token（1 格），其余 3 格 = 空 slot（内部碎片） -->
    <rect x="374" y="136" width="22" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5875;0.5917;1" dur="12s" repeatCount="indefinite"/></rect>
  </g>
  <g fill="none" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 2">
    <rect x="398" y="136" width="22" height="14" rx="2"/>
    <rect x="422" y="136" width="22" height="14" rx="2"/>
    <rect x="446" y="136" width="22" height="14" rx="2"/>
  </g>
  <text x="435" y="162" font-size="8" fill="#b85450">空 slot = 内部碎片</text>

  <!-- ============ Block Table ============ -->
  <g filter="url(#sk)">
    <rect x="520" y="90" width="380" height="200" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="710" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">Block Table（随生成逐步追加）</text>
  <g font-size="13" font-family="monospace" font-weight="bold">
    <text x="545" y="150" fill="#446688">block_table[0] = 7　→ 物理 P7
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1583;0.1625;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="545" y="180" fill="#2e6e2e">block_table[1] = 1　→ 物理 P1
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3417;0.3458;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="545" y="210" fill="#7a5415">block_table[2] = 12 → 物理 P12
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.525;0.5292;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="545" y="240" fill="#7a2828">block_table[3] = 3　→ 物理 P3
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6625;0.6667;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
  <text x="710" y="272" text-anchor="middle" font-size="10" fill="#888">追加时机：当前 block 写满、需要新 block 时，Scheduler 调 allocator 分配</text>

  <!-- ============ 映射箭头（分配时刻出现） ============ -->
  <g stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M 90 172 Q 180 300 320 376">
      <animate attributeName="opacity" values="0;0;0.9;0.9" keyTimes="0;0.1583;0.1667;1" dur="12s" repeatCount="indefinite"/></path>
    <path d="M 200 172 Q 190 250 166 322">
      <animate attributeName="opacity" values="0;0;0.9;0.9" keyTimes="0;0.3417;0.35;1" dur="12s" repeatCount="indefinite"/></path>
    <path d="M 310 172 Q 180 350 84 484">
      <animate attributeName="opacity" values="0;0;0.9;0.9" keyTimes="0;0.525;0.5333;1" dur="12s" repeatCount="indefinite"/></path>
    <path d="M 420 172 Q 400 260 330 322">
      <animate attributeName="opacity" values="0;0;0.9;0.9" keyTimes="0;0.6625;0.6708;1" dur="12s" repeatCount="indefinite"/></path>
  </g>

  <!-- ============ 物理 block 池 ============ -->
  <text x="40" y="316" font-size="14" font-weight="bold" fill="#7a5415">物理 block 池（显存，16 个 block）— 绿色 = 已分配给本序列</text>
  <g filter="url(#sk)">
    <g stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 2" fill="#ffffff">
      <rect x="40" y="330" width="80" height="50" rx="3"/><rect x="204" y="330" width="80" height="50" rx="3"/>
      <rect x="40" y="384" width="80" height="50" rx="3"/><rect x="122" y="384" width="80" height="50" rx="3"/><rect x="204" y="384" width="80" height="50" rx="3"/>
      <rect x="40" y="438" width="80" height="50" rx="3"/><rect x="122" y="438" width="80" height="50" rx="3"/><rect x="204" y="438" width="80" height="50" rx="3"/><rect x="286" y="438" width="80" height="50" rx="3"/>
      <rect x="122" y="492" width="80" height="50" rx="3"/><rect x="204" y="492" width="80" height="50" rx="3"/><rect x="286" y="492" width="80" height="50" rx="3"/>
    </g>
  </g>
  <!-- 已分配的 4 个物理 block：fill 在分配时刻由白变绿 -->
  <g stroke="#4a8e4a" stroke-width="1.8">
    <rect x="286" y="384" width="80" height="50" rx="3" fill="#ffffff">
      <animate attributeName="fill" values="#ffffff;#ffffff;#bfe0bf;#bfe0bf" keyTimes="0;0.1583;0.1667;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="122" y="330" width="80" height="50" rx="3" fill="#ffffff">
      <animate attributeName="fill" values="#ffffff;#ffffff;#bfe0bf;#bfe0bf" keyTimes="0;0.3417;0.35;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="40" y="492" width="80" height="50" rx="3" fill="#ffffff">
      <animate attributeName="fill" values="#ffffff;#ffffff;#bfe0bf;#bfe0bf" keyTimes="0;0.525;0.5333;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="286" y="330" width="80" height="50" rx="3" fill="#ffffff">
      <animate attributeName="fill" values="#ffffff;#ffffff;#bfe0bf;#bfe0bf" keyTimes="0;0.6625;0.6708;1" dur="12s" repeatCount="indefinite"/></rect>
  </g>
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="80" y="348">P0</text><text x="244" y="348">P2</text>
    <text x="80" y="402">P4</text><text x="162" y="402">P5</text><text x="244" y="402">P6</text>
    <text x="80" y="456">P8</text><text x="162" y="456">P9</text><text x="244" y="456">P10</text><text x="326" y="456">P11</text>
    <text x="162" y="510">P13</text><text x="244" y="510">P14</text><text x="326" y="510">P15</text>
  </g>
  <g font-size="10" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="326" y="402">P7 ✓<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1583;0.1667;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="162" y="348">P1 ✓<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3417;0.35;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="80" y="510">P12 ✓<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.525;0.5333;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="326" y="348">P3 ✓<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6625;0.6708;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
  <!-- 物理 block 内的 token 格（与逻辑 block 同步写入 —— 数据实际落在物理位置） -->
  <g fill="#4a8e4a" stroke="#2e6e2e" stroke-width="0.6">
    <!-- P7（逻辑0） -->
    <rect x="292" y="412" width="16" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0375;0.0417;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="311" y="412" width="16" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.075;0.0792;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="330" y="412" width="16" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1125;0.1167;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="349" y="412" width="16" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.1542;1" dur="12s" repeatCount="indefinite"/></rect>
    <!-- P1（逻辑1） -->
    <rect x="128" y="358" width="16" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2208;0.225;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="147" y="358" width="16" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2583;0.2625;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="166" y="358" width="16" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2958;0.3;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="185" y="358" width="16" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3333;0.3375;1" dur="12s" repeatCount="indefinite"/></rect>
    <!-- P12（逻辑2） -->
    <rect x="46" y="520" width="16" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4042;0.4083;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="65" y="520" width="16" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4417;0.4458;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="84" y="520" width="16" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4792;0.4833;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="103" y="520" width="16" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5167;0.5208;1" dur="12s" repeatCount="indefinite"/></rect>
    <!-- P3（逻辑3，只有 2 个 token = 1 格） -->
    <rect x="292" y="358" width="16" height="14" rx="2"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5875;0.5917;1" dur="12s" repeatCount="indefinite"/></rect>
  </g>

  <!-- ============ finale：kernel 按逻辑顺序扫描（红框高亮 逻辑↔物理 对） ============ -->
  <g fill="none" stroke="#b85450" stroke-width="2.5">
    <rect x="34" y="108" width="112" height="68" rx="6">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7083;0.7163;0.7732;0.7812;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="282" y="380" width="88" height="58" rx="6">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7083;0.7163;0.7732;0.7812;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="144" y="108" width="112" height="68" rx="6">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7812;0.7892;0.8462;0.8542;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="118" y="326" width="88" height="58" rx="6">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7812;0.7892;0.8462;0.8542;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="254" y="108" width="112" height="68" rx="6">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8542;0.8622;0.9191;0.9271;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="36" y="488" width="88" height="58" rx="6">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8542;0.8622;0.9191;0.9271;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="364" y="108" width="112" height="68" rx="6">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9271;0.9351;1" dur="12s" repeatCount="indefinite"/></rect>
    <rect x="282" y="326" width="88" height="58" rx="6">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9271;0.9351;1" dur="12s" repeatCount="indefinite"/></rect>
  </g>
  <text x="470" y="566" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最后红框阶段 = decode kernel 扫描：按逻辑 block 0→3 顺序，每步查 block_table 得物理 block，间接寻址读 KV</text>

  <!-- ============ 右侧说明 ============ -->
  <g filter="url(#sk)">
    <rect x="520" y="330" width="380" height="212" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="540" y="356" font-size="13" font-weight="bold" fill="#2b2b2b">逐步发生了什么？</text>
  <g font-size="12" fill="#444">
    <text x="540" y="380">① token 逐个写入当前逻辑 block（每格 = 4 token）</text>
    <text x="540" y="400">② 写满 → allocator 从空闲池取新物理 block（可不连续）</text>
    <text x="540" y="420">③ block table 追加一条 逻辑→物理 映射（橙色箭头）</text>
    <text x="540" y="440">④ 请求完成 → 整 block 回收回池，任意序列可复用</text>
  </g>
  <text x="540" y="472" font-size="12" font-weight="bold" fill="#7a5415">逻辑连续、物理散布：block_table = [7, 1, 12, 3]</text>
  <text x="540" y="494" font-size="12" fill="#2e6e2e">无外部碎片（block 粒度回收）+ 几乎无静态浪费（按需分配）</text>
  <text x="540" y="522" font-size="11" fill="#888">类比 OS：逻辑 block = 虚拟页，物理 block = 页框，block table = 页表</text>

  <text x="470" y="596" text-anchor="middle" font-size="11" fill="#666">seq_len=50 → 4 个逻辑 block；block 3 仅 2 个 token（其余空 slot = 内部碎片）；物理散布 P7/P1/P12/P3，逻辑连续由 block table 保证</text>
</svg>
