<svg xmlns="http://www.w3.org/2000/svg" width="920" height="660" viewBox="0 0 920 660" font-family="-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="920" height="660" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">allocate：前缀缓存命中与 ref_count 共享</text>
  <text x="460" y="54" text-anchor="middle" font-size="12.5" fill="#6b7280">序列 B 与在跑的序列 A 共享前 8 个 token；B 共 12 token（block_size = 4）→ 3 个块</text>

  <rect x="40" y="70" width="840" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="94" font-size="14" font-weight="700" fill="#1d4ed8">① can_allocate(seq) —— 沿哈希链探测</text>
  <text x="56" y="118" font-size="13" font-family="'SF Mono',Consolas,monospace" fill="#0f172a">h₀ ✓ 块5(used) → h₁ ✓ 块2(used) → h₂ ✗ 未登记 → 停止：num_cached_blocks = 2</text>
  <text x="56" y="142" font-size="12" fill="#475569">记账：num_new_blocks = num_blocks(3) − 命中的在用块(2) = 1 ≤ 空闲块数 → 放行，返回 2</text>
  <text x="56" y="164" font-size="11.5" fill="#dc2626">空闲不足 → 返回 −1，scheduler break：本轮不再尝试进批（队头阻塞，不跳过队首去调度后面的请求）</text>

  <rect x="40" y="188" width="840" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="212" font-size="14" font-weight="700" fill="#1d4ed8">② allocate(seq, 2) —— 三类块，三种处理</text>
  <text x="56" y="236" font-size="12.5" fill="#166534">命中且在用（块5、块2）：ref_count 1→2，不消耗空闲块 —— KV 直接复用，零计算</text>
  <text x="56" y="258" font-size="12.5" fill="#92400e">未命中（第 3 块）：_allocate_block() 从 free_block_ids 弹出 → reset() → 写入 block_table</text>
  <text x="56" y="280" font-size="12.5" fill="#475569">seq.num_cached_tokens = 2 × 4 = 8 —— B 的 prefill 只需计算 token[8:12]（4 个 token）</text>
  <text x="56" y="296" font-size="11.5" fill="#6b7280">（第三类：命中但空闲 → 直接移出空闲队列复活，内容与哈希原样保留；本例未出现）</text>

  <text x="56" y="334" font-size="14" font-weight="700" fill="#374151">③ 分配后的视图 —— ref_count = block_table 指向该块的序列数</text>

  <text x="56" y="380" font-size="13" font-weight="700" font-family="'SF Mono',Consolas,monospace" fill="#1d4ed8">A.block_table</text>
  <g font-size="16" font-weight="700" font-family="'SF Mono',Consolas,monospace" text-anchor="middle">
    <rect x="190" y="358" width="52" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="216" y="380" fill="#1e3a8a">5</text>
    <rect x="252" y="358" width="52" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="278" y="380" fill="#1e3a8a">2</text>
    <rect x="314" y="358" width="52" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="340" y="380" fill="#1e3a8a">9</text>
  </g>

  <text x="56" y="424" font-size="13" font-weight="700" font-family="'SF Mono',Consolas,monospace" fill="#15803d">B.block_table</text>
  <g font-size="16" font-weight="700" font-family="'SF Mono',Consolas,monospace" text-anchor="middle">
    <rect x="190" y="402" width="52" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="216" y="424" fill="#14532d">5</text>
    <rect x="252" y="402" width="52" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="278" y="424" fill="#14532d">2</text>
    <rect x="314" y="402" width="52" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="340" y="424" fill="#14532d">7</text>
  </g>

  <g>
    <line x1="216" y1="390" x2="482" y2="466" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>
    <line x1="278" y1="390" x2="248" y2="466" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>
    <line x1="340" y1="390" x2="810" y2="466" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>
    <line x1="216" y1="434" x2="482" y2="466" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrG)"/>
    <line x1="278" y1="434" x2="248" y2="466" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrG)"/>
    <line x1="340" y1="434" x2="646" y2="466" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrG)"/>
  </g>

  <g text-anchor="middle">
    <rect x="44" y="470" width="70" height="66" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="79" y="492" font-size="12.5" font-weight="600" fill="#64748b">块 0</text>
    <text x="79" y="512" font-size="11" fill="#94a3b8">free</text>
    <rect x="126" y="470" width="70" height="66" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="161" y="492" font-size="12.5" font-weight="600" fill="#64748b">块 1</text>
    <text x="161" y="512" font-size="11" fill="#94a3b8">free</text>
    <rect x="208" y="470" width="70" height="66" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="243" y="492" font-size="12.5" font-weight="700" fill="#14532d">块 2</text>
    <text x="243" y="510" font-size="11" font-family="'SF Mono',Consolas,monospace" fill="#166534">ref=2 h₁</text>
    <text x="243" y="526" font-size="10.5" fill="#16a34a">共享</text>
    <rect x="290" y="470" width="70" height="66" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="325" y="492" font-size="12.5" font-weight="600" fill="#64748b">块 3</text>
    <text x="325" y="512" font-size="11" fill="#94a3b8">free</text>
    <rect x="372" y="470" width="70" height="66" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="407" y="492" font-size="12.5" font-weight="600" fill="#64748b">块 4</text>
    <text x="407" y="512" font-size="11" fill="#94a3b8">free</text>
    <rect x="454" y="470" width="70" height="66" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="489" y="492" font-size="12.5" font-weight="700" fill="#14532d">块 5</text>
    <text x="489" y="510" font-size="11" font-family="'SF Mono',Consolas,monospace" fill="#166534">ref=2 h₀</text>
    <text x="489" y="526" font-size="10.5" fill="#16a34a">共享</text>
    <rect x="536" y="470" width="70" height="66" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="571" y="492" font-size="12.5" font-weight="600" fill="#64748b">块 6</text>
    <text x="571" y="512" font-size="11" fill="#94a3b8">free</text>
    <rect x="618" y="470" width="70" height="66" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="653" y="492" font-size="12.5" font-weight="700" fill="#92400e">块 7</text>
    <text x="653" y="510" font-size="11" font-family="'SF Mono',Consolas,monospace" fill="#b45309">ref=1</text>
    <text x="653" y="526" font-size="10.5" fill="#b45309">B 新分配</text>
    <rect x="700" y="470" width="70" height="66" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="735" y="492" font-size="12.5" font-weight="600" fill="#64748b">块 8</text>
    <text x="735" y="512" font-size="11" fill="#94a3b8">free</text>
    <rect x="782" y="470" width="70" height="66" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="817" y="492" font-size="12.5" font-weight="700" fill="#1e3a8a">块 9</text>
    <text x="817" y="510" font-size="11" font-family="'SF Mono',Consolas,monospace" fill="#1d4ed8">ref=1 已哈希</text>
    <text x="817" y="526" font-size="10.5" fill="#1d4ed8">A 的尾块</text>
  </g>

  <rect x="40" y="566" width="840" height="80" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="56" y="590" font-size="13" font-weight="700" fill="#1e40af">为什么 ref_count 是前缀缓存的基石</text>
  <text x="56" y="612" font-size="12" fill="#1e3a8a">共享中的块不能被任何一方释放：deallocate 只把 ref_count 减到 0 的块归还空闲队列（谁先结束都无所谓）。</text>
  <text x="56" y="634" font-size="12" fill="#1e3a8a">命中在用块 → 零新块零计算；命中空闲块 → 零计算（缓存复活）；未命中 → 新块 + 重算。B 的 prefill 计算量：12 → 4 个 token。</text>
</svg>
