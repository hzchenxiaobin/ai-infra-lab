<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">链式哈希：一个字典如何定位任意长度的前缀</text>
  <text x="450" y="54" text-anchor="middle" font-size="12.5" fill="#6b7280">compute_hash(token_ids, prefix) = xxh64( prefix 的 8 字节（无前缀时省略） ‖ token_ids 字节 )，block_size = 4</text>

  <g>
    <rect x="40" y="84" width="210" height="64" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="145" y="102" text-anchor="middle" font-size="12" font-family="'SF Mono',Consolas,monospace" fill="#1d4ed8">token[0:4]</text>
    <g font-size="11" font-family="'SF Mono',Consolas,monospace" text-anchor="middle">
      <rect x="48" y="110" width="42" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="69" y="127" fill="#1e3a8a">t₀</text>
      <rect x="98" y="110" width="42" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="119" y="127" fill="#1e3a8a">t₁</text>
      <rect x="148" y="110" width="42" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="169" y="127" fill="#1e3a8a">t₂</text>
      <rect x="198" y="110" width="42" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="219" y="127" fill="#1e3a8a">t₃</text>
    </g>

    <rect x="310" y="96" width="92" height="40" rx="6" fill="#f1f5f9" stroke="#475569"/>
    <text x="356" y="121" text-anchor="middle" font-size="13" font-family="'SF Mono',Consolas,monospace" fill="#111827">xxh64()</text>
    <line x1="250" y1="116" x2="306" y2="116" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="450" y="96" width="130" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="515" y="121" text-anchor="middle" font-size="15" font-weight="700" font-family="'SF Mono',Consolas,monospace" fill="#5b21b6">h₀</text>
    <line x1="402" y1="116" x2="446" y2="116" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="580" y1="116" x2="646" y2="132" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrP)"/>
  </g>

  <g>
    <rect x="40" y="186" width="210" height="64" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="145" y="204" text-anchor="middle" font-size="12" font-family="'SF Mono',Consolas,monospace" fill="#1d4ed8">token[4:8]</text>
    <g font-size="11" font-family="'SF Mono',Consolas,monospace" text-anchor="middle">
      <rect x="48" y="212" width="42" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="69" y="229" fill="#1e3a8a">t₄</text>
      <rect x="98" y="212" width="42" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="119" y="229" fill="#1e3a8a">t₅</text>
      <rect x="148" y="212" width="42" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="169" y="229" fill="#1e3a8a">t₆</text>
      <rect x="198" y="212" width="42" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="219" y="229" fill="#1e3a8a">t₇</text>
    </g>

    <rect x="310" y="198" width="92" height="40" rx="6" fill="#f1f5f9" stroke="#475569"/>
    <text x="356" y="223" text-anchor="middle" font-size="13" font-family="'SF Mono',Consolas,monospace" fill="#111827">xxh64()</text>
    <line x1="250" y1="218" x2="306" y2="218" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="450" y="198" width="130" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="515" y="223" text-anchor="middle" font-size="15" font-weight="700" font-family="'SF Mono',Consolas,monospace" fill="#5b21b6">h₁</text>
    <line x1="402" y1="218" x2="446" y2="218" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="580" y1="218" x2="646" y2="168" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrP)"/>

    <path d="M515,136 V167 H356 V194" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrP)"/>
    <text x="435" y="161" text-anchor="middle" font-size="11" fill="#6d28d9">prefix（盐）</text>
  </g>

  <g>
    <rect x="40" y="288" width="210" height="64" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="145" y="306" text-anchor="middle" font-size="12" font-family="'SF Mono',Consolas,monospace" fill="#b45309">token[8:10]</text>
    <g font-size="11" font-family="'SF Mono',Consolas,monospace" text-anchor="middle">
      <rect x="48" y="314" width="42" height="26" fill="#fef3c7" stroke="#f59e0b"/><text x="69" y="331" fill="#92400e">t₈</text>
      <rect x="98" y="314" width="42" height="26" fill="#fef3c7" stroke="#f59e0b"/><text x="119" y="331" fill="#92400e">t₉</text>
      <rect x="148" y="314" width="42" height="26" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
      <rect x="198" y="314" width="42" height="26" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
    </g>

    <rect x="310" y="300" width="92" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="356" y="325" text-anchor="middle" font-size="12" font-family="'SF Mono',Consolas,monospace" fill="#94a3b8">xxh64()</text>
    <line x1="250" y1="320" x2="306" y2="320" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <rect x="450" y="300" width="130" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="515" y="325" text-anchor="middle" font-size="11.5" fill="#94a3b8">（不计算）</text>

    <path d="M515,238 V267 H356 V296" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrP)"/>
    <text x="435" y="261" text-anchor="middle" font-size="11" fill="#6d28d9">prefix（盐）</text>
    <text x="515" y="366" text-anchor="middle" font-size="11.5" fill="#b45309">最后一块未满 → 永不计算、永不登记（后续还会追加 token，哈希随时失效）</text>
  </g>

  <rect x="650" y="84" width="230" height="196" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="765" y="110" text-anchor="middle" font-size="13.5" font-weight="700" font-family="'SF Mono',Consolas,monospace" fill="#5b21b6">hash_to_block_id</text>
  <line x1="670" y1="122" x2="860" y2="122" stroke="#ddd6fe"/>
  <g font-size="13" font-family="'SF Mono',Consolas,monospace" text-anchor="middle">
    <text x="765" y="146" fill="#111827">h₀ → 块 5</text>
    <text x="765" y="174" fill="#111827">h₁ → 块 2</text>
    <text x="765" y="202" fill="#94a3b8">h₂ → （无）</text>
  </g>
  <text x="765" y="234" text-anchor="middle" font-size="11" fill="#6b7280">只有「满块」才会登记</text>
  <text x="765" y="256" text-anchor="middle" font-size="11" fill="#6b7280">命中 = 整段前缀可复用</text>

  <rect x="40" y="386" width="410" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="408" font-size="12.5" font-weight="700" fill="#334155">① 为什么链式</text>
  <text x="56" y="428" font-size="11.5" fill="#475569">h₁ 的输入包含 h₀ → 哈希值浓缩了从头到当前块的全部内容；</text>
  <text x="56" y="446" font-size="11.5" fill="#475569">比对一个 h₁ = 比对整个前缀 token[0:8]，无需逐 token 比较。</text>

  <rect x="470" y="386" width="410" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="486" y="408" font-size="12.5" font-weight="700" fill="#334155">② 为什么只哈希满块</text>
  <text x="486" y="428" font-size="11.5" fill="#475569">can_allocate 只探测前 num_blocks−1 块；</text>
  <text x="486" y="446" font-size="11.5" fill="#475569">hash_blocks 只登记本次 forward 恰好写满的块 —— prompt 尾块永远重算。</text>
</svg>
