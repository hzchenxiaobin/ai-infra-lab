<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="880" height="540" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">decode：can_append / may_append —— 只在跨块边界的那一步扩块</text>
  <text x="440" y="54" text-anchor="middle" font-size="12.5" fill="#6b7280">prefill 已算好 12 个 token 的 KV（block_size=4）。decode 每步把最后一个 token 喂给模型，它的 KV 落在第 len−1 个槽</text>

  <text x="118" y="134" text-anchor="end" font-size="12" font-weight="700" font-family="'SF Mono',Consolas,monospace" fill="#1d4ed8">block_table[3]</text>
  <rect x="126" y="108" width="372" height="62" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <g font-size="10.5" fill="#6b7280" text-anchor="middle">
    <text x="174" y="103">len=13</text>
    <text x="266" y="103">len=14</text>
    <text x="358" y="103">len=15</text>
    <text x="450" y="103">len=16</text>
  </g>
  <g font-size="12" font-family="'SF Mono',Consolas,monospace" text-anchor="middle">
    <rect x="132" y="112" width="84" height="34" fill="#dbeafe" stroke="#3b82f6"/><text x="174" y="134" fill="#1e3a8a">t₁₂</text>
    <rect x="224" y="112" width="84" height="34" fill="#dbeafe" stroke="#3b82f6"/><text x="266" y="134" fill="#1e3a8a">t₁₃</text>
    <rect x="316" y="112" width="84" height="34" fill="#dbeafe" stroke="#3b82f6"/><text x="358" y="134" fill="#1e3a8a">t₁₄</text>
    <rect x="408" y="112" width="84" height="34" fill="#dbeafe" stroke="#3b82f6"/><text x="450" y="134" fill="#1e3a8a">t₁₅</text>
  </g>
  <text x="312" y="190" text-anchor="middle" font-size="11.5" fill="#b45309">len=16 这一步之后块 3 恰好填满 → hash_blocks() 把它登记进前缀缓存</text>

  <text x="118" y="230" text-anchor="end" font-size="12" font-weight="700" font-family="'SF Mono',Consolas,monospace" fill="#b45309">block_table[4]</text>
  <rect x="126" y="204" width="372" height="62" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="174" y="199" text-anchor="middle" font-size="10.5" fill="#6b7280">len=17</text>
  <g font-size="12" font-family="'SF Mono',Consolas,monospace" text-anchor="middle">
    <rect x="132" y="208" width="84" height="34" fill="#fef3c7" stroke="#f59e0b"/><text x="174" y="230" fill="#92400e">t₁₆</text>
    <rect x="224" y="208" width="84" height="34" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <rect x="316" y="208" width="84" height="34" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <rect x="408" y="208" width="84" height="34" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
  </g>
  <text x="312" y="286" text-anchor="middle" font-size="11.5" fill="#b45309">len=17：t₁₆ 落在新块的槽 0 → may_append() 分配 block_table[4]</text>

  <g>
    <rect x="40" y="296" width="460" height="28" fill="#f1f5f9" stroke="#cbd5e1"/>
    <line x1="150" y1="296" x2="150" y2="484" stroke="#e2e8f0"/>
    <line x1="250" y1="296" x2="250" y2="484" stroke="#e2e8f0"/>
    <line x1="340" y1="296" x2="340" y2="484" stroke="#e2e8f0"/>
    <g font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">
      <text x="95" y="314">len(seq)</text>
      <text x="200" y="314">len % 4</text>
      <text x="295" y="314">分配新块?</text>
      <text x="420" y="314">hash_blocks</text>
    </g>
    <rect x="40" y="324" width="460" height="32" fill="#fef3c7" stroke="#fcd34d"/>
    <rect x="40" y="356" width="460" height="32" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="388" width="460" height="32" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="420" width="460" height="32" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="452" width="460" height="32" fill="#fef3c7" stroke="#fcd34d"/>
    <g font-size="12" font-family="'SF Mono',Consolas,monospace" text-anchor="middle" fill="#111827">
      <text x="95" y="345">13</text><text x="200" y="345" font-weight="700" fill="#b45309">1</text><text x="295" y="345" fill="#166534">✓ may_append</text><text x="420" y="345" fill="#94a3b8">—</text>
      <text x="95" y="377">14</text><text x="200" y="377">2</text><text x="295" y="377" fill="#94a3b8">✗</text><text x="420" y="377" fill="#94a3b8">—</text>
      <text x="95" y="409">15</text><text x="200" y="409">3</text><text x="295" y="409" fill="#94a3b8">✗</text><text x="420" y="409" fill="#94a3b8">—</text>
      <text x="95" y="441">16</text><text x="200" y="441">0</text><text x="295" y="441" fill="#94a3b8">✗</text><text x="420" y="441" fill="#166534">✓ 块满登记</text>
      <text x="95" y="473">17</text><text x="200" y="473" font-weight="700" fill="#b45309">1</text><text x="295" y="473" fill="#166534">✓ may_append</text><text x="420" y="473" fill="#94a3b8">—</text>
    </g>
  </g>

  <text x="540" y="86" font-size="12.5" font-weight="700" fill="#334155">源码（block_manager.py:103-108）</text>
  <rect x="540" y="94" width="300" height="196" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-size="11" font-family="'SF Mono',Consolas,monospace" fill="#0f172a">
    <text x="556" y="118">def can_append(self, seq):</text>
    <text x="556" y="135.5">    return len(self.free_block_ids) \</text>
    <text x="556" y="153">        &gt;= (len(seq) % self.block_size == 1)</text>
    <text x="556" y="188">def may_append(self, seq):</text>
    <text x="556" y="205.5">    if len(seq) % self.block_size == 1:</text>
    <text x="556" y="223">        seq.block_table.append(</text>
    <text x="556" y="240.5">            self._allocate_block())</text>
  </g>

  <rect x="540" y="306" width="300" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="556" y="328" font-size="11.5" font-weight="700" fill="#1e40af">len % block_size == 1 的含义</text>
  <text x="556" y="346" font-size="11" fill="#1e3a8a">第 len−1 个 token（本次 decode 的输入）</text>
  <text x="556" y="362" font-size="11" fill="#1e3a8a">恰好落在新块的槽 0 —— 只有这步要扩块</text>

  <rect x="540" y="380" width="300" height="64" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="556" y="402" font-size="11.5" font-weight="700" fill="#166534">布尔当整数</text>
  <text x="556" y="420" font-size="11" fill="#14532d">True == 1 / False == 0：decode 单步</text>
  <text x="556" y="436" font-size="11" fill="#14532d">最多需要 1 个空闲块，判断只需一次比较</text>

  <rect x="540" y="454" width="300" height="64" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="556" y="476" font-size="11.5" font-weight="700" fill="#b91c1c">空间不足时</text>
  <text x="556" y="494" font-size="11" fill="#7f1d1d">scheduler 抢占 running 队尾的序列腾块</text>
  <text x="556" y="510" font-size="11" fill="#7f1d1d">（preempt → recompute，见下图生命周期）</text>
</svg>
