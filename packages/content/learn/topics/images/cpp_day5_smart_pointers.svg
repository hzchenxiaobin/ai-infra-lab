<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8e5db8"/>
    </marker>
  </defs>
  <rect width="1000" height="460" fill="#fdfcf7"/>

  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">三种智能指针：所有权模型对比</text>
  <path d="M 340 40 Q 500 48 660 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ========== Column 1: unique_ptr ========== -->
  <g filter="url(#sk)"><rect x="20" y="66" width="300" height="88" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="170" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">unique_ptr</text>
  <text x="170" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">独占所有权</text>
  <text x="170" y="134" text-anchor="middle" font-size="9" fill="#666">零开销 · 默认首选</text>

  <text x="170" y="172" text-anchor="middle" font-size="9" font-weight="bold" fill="#888">所有权模型</text>
  <g filter="url(#sk)">
    <rect x="44" y="192" width="56" height="34" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="196" y="188" width="104" height="42" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="72" y="213" text-anchor="middle" font-size="11" fill="#2b6e9e">u</text>
  <text x="248" y="214" text-anchor="middle" font-size="10" fill="#2b6e9e">Widget 对象</text>
  <path d="M 102 209 L 192 209" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="147" y="201" text-anchor="middle" font-size="9" fill="#2b6e9e">1 : 1 独占</text>

  <text x="30" y="264" font-size="10" fill="#b03a3a" font-weight="bold">auto u2 = u;</text>
  <text x="152" y="264" font-size="10" fill="#b03a3a">✗ 禁止拷贝</text>
  <text x="30" y="286" font-size="10" fill="#2e6e2e" font-weight="bold">auto u2 = move(u);  ✓ 转移</text>

  <text x="30" y="322" font-size="10" fill="#666">· 与裸指针同大小，零开销</text>
  <text x="30" y="340" font-size="10" fill="#666">· make_unique&lt;T&gt;() 创建（C++14）</text>
  <text x="30" y="358" font-size="10" fill="#666">· 自定义删除器：FILE* / fclose</text>

  <!-- ========== Column 2: shared_ptr ========== -->
  <g filter="url(#sk)"><rect x="350" y="66" width="300" height="88" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="500" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">shared_ptr</text>
  <text x="500" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">共享所有权</text>
  <text x="500" y="134" text-anchor="middle" font-size="9" fill="#666">引用计数 · 归零自动释放</text>

  <text x="500" y="172" text-anchor="middle" font-size="9" font-weight="bold" fill="#888">所有权模型</text>
  <g filter="url(#sk)">
    <rect x="374" y="188" width="56" height="32" fill="#cfe8d2" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="374" y="240" width="56" height="32" fill="#cfe8d2" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="526" y="182" width="104" height="40" fill="#cfe8d2" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="526" y="232" width="104" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="516" y="174" width="124" height="104" fill="none" stroke="#4a8e4a" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="402" y="208" text-anchor="middle" font-size="11" fill="#2e6e2e">s1</text>
  <text x="402" y="260" text-anchor="middle" font-size="11" fill="#2e6e2e">s2</text>
  <text x="578" y="206" text-anchor="middle" font-size="10" fill="#2e6e2e">Widget 对象</text>
  <text x="578" y="248" text-anchor="middle" font-size="9" fill="#7a5415">控制块</text>
  <text x="578" y="262" text-anchor="middle" font-size="9" fill="#7a5415">use_count = 2</text>
  <path d="M 432 204 L 512 204" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 432 256 L 512 256" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="500" y="298" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">拷贝 → 计数 +1 ｜ 析构 → 计数 −1</text>

  <text x="360" y="322" font-size="10" fill="#666">· 原子计数：计数本身线程安全</text>
  <text x="360" y="340" font-size="10" fill="#666">· make_shared 一次分配，局部性好</text>
  <text x="360" y="358" font-size="10" fill="#666">· 真正多所有者：缓存 / 观察者</text>

  <!-- ========== Column 3: weak_ptr ========== -->
  <g filter="url(#sk)"><rect x="680" y="66" width="300" height="88" rx="6" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/></g>
  <text x="830" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3a7a">weak_ptr</text>
  <text x="830" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">观察不拥有</text>
  <text x="830" y="134" text-anchor="middle" font-size="9" fill="#666">不参与引用计数</text>

  <text x="830" y="172" text-anchor="middle" font-size="9" font-weight="bold" fill="#888">存活检测</text>
  <g filter="url(#sk)">
    <rect x="704" y="192" width="56" height="34" fill="#ead9f5" stroke="#8e5db8" stroke-width="1.2"/>
    <rect x="856" y="188" width="104" height="42" fill="#f6effa" stroke="#8e5db8" stroke-width="1.4"/>
  </g>
  <text x="732" y="213" text-anchor="middle" font-size="11" fill="#5a3a7a">w</text>
  <text x="908" y="214" text-anchor="middle" font-size="10" fill="#5a3a7a">Widget 对象</text>
  <path d="M 762 209 L 852 209" stroke="#8e5db8" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arP)" filter="url(#sk)"/>
  <text x="807" y="200" text-anchor="middle" font-size="8" fill="#5a3a7a">仅观察 · 计数不变</text>

  <text x="700" y="252" font-size="10" fill="#5a3a7a" font-weight="bold">auto sp = w.lock();</text>
  <text x="700" y="272" font-size="9" fill="#2e6e2e">✓ 存活  → sp 是有效 shared_ptr</text>
  <text x="700" y="290" font-size="9" fill="#b03a3a">✗ 已销毁 → sp == nullptr</text>

  <text x="690" y="322" font-size="10" fill="#666">· 必须由 shared_ptr 构造</text>
  <text x="690" y="340" font-size="10" fill="#666">· 典型用途：打破循环引用、缓存</text>
  <text x="690" y="358" font-size="10" fill="#666">· expired() / lock() / use_count()</text>

  <!-- bottom notes -->
  <text x="500" y="404" text-anchor="middle" font-size="10" fill="#888">选择顺序：默认独占 → unique_ptr ｜ 真要共享所有权 → shared_ptr ｜ 只观察 / 打破环 → weak_ptr</text>
  <text x="500" y="428" text-anchor="middle" font-size="10" fill="#888" font-style="italic">RAII 一句话：把资源生命周期绑定到对象生命周期，析构自动释放 —— 和手写 delete 说再见</text>
</svg>
