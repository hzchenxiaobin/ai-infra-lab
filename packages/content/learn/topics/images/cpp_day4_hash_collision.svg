<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="45" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="1000" height="580" fill="#fdfcf7"/>

  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">哈希冲突的两种解决方案</text>
  <path d="M 380 40 Q 500 48 620 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左：链地址法 ===== -->
  <g filter="url(#sk)"><rect x="20" y="58" width="470" height="350" rx="8" fill="#f4fbf6" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="255" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">链地址法（拉链法）✅ STL 采用</text>

  <g filter="url(#sk)">
    <rect x="50" y="108" width="52" height="28" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="102" y="108" width="52" height="28" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="154" y="108" width="52" height="28" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="206" y="108" width="52" height="28" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="258" y="108" width="52" height="28" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="310" y="108" width="52" height="28" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="76" y="126" text-anchor="middle" font-size="10" fill="#2e6e2e">0</text>
  <text x="128" y="126" text-anchor="middle" font-size="10" fill="#2e6e2e">1</text>
  <text x="180" y="126" text-anchor="middle" font-size="10" fill="#2e6e2e">2</text>
  <text x="232" y="126" text-anchor="middle" font-size="10" fill="#2e6e2e">3</text>
  <text x="284" y="126" text-anchor="middle" font-size="10" fill="#2e6e2e">4</text>
  <text x="336" y="126" text-anchor="middle" font-size="10" fill="#2e6e2e">5</text>
  <text x="396" y="126" font-size="9" fill="#888">← 桶数组</text>

  <line x1="180" y1="136" x2="180" y2="152" stroke="#4a8e4a" stroke-width="1.2" marker-end="url(#arG)"/>
  <g filter="url(#sk)"><rect x="158" y="156" width="44" height="20" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/></g>
  <text x="180" y="170" text-anchor="middle" font-size="9" fill="#2e6e2e">k=14</text>
  <line x1="180" y1="176" x2="180" y2="188" stroke="#4a8e4a" stroke-width="1.2" marker-end="url(#arG)"/>
  <g filter="url(#sk)"><rect x="158" y="192" width="44" height="20" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/></g>
  <text x="180" y="206" text-anchor="middle" font-size="9" fill="#2e6e2e">k=26</text>

  <line x1="284" y1="136" x2="284" y2="152" stroke="#4a8e4a" stroke-width="1.2" marker-end="url(#arG)"/>
  <g filter="url(#sk)"><rect x="262" y="156" width="44" height="20" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/></g>
  <text x="284" y="170" text-anchor="middle" font-size="9" fill="#2e6e2e">k=8</text>

  <text x="330" y="170" font-size="9" fill="#888">hash(k) % 6 定桶</text>
  <text x="330" y="188" font-size="9" fill="#888">同桶元素依次挂链</text>

  <text x="40" y="248" font-size="10" fill="#666">· 每个桶是一条单链表</text>
  <text x="40" y="270" font-size="10" fill="#666">· 冲突 → 直接挂到链尾，逻辑简单</text>
  <text x="40" y="292" font-size="10" fill="#666">· 删除只摘节点，适合频繁增删</text>
  <text x="40" y="314" font-size="10" fill="#666">· 桶数足够多时均摊 O(1)</text>
  <text x="40" y="344" font-size="10" fill="#2e6e2e" font-weight="bold">STL 的 unordered_map/set 就是拉链法</text>
  <text x="40" y="366" font-size="10" fill="#2e6e2e" font-weight="bold">（桶里存节点指针，节点串成链）</text>

  <!-- ===== 右：开放寻址 ===== -->
  <g filter="url(#sk)"><rect x="510" y="58" width="470" height="350" rx="8" fill="#f4f9fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="745" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">开放寻址（线性探测）</text>

  <g filter="url(#sk)">
    <rect x="540" y="122" width="44" height="28" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="584" y="122" width="44" height="28" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="628" y="122" width="44" height="28" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="672" y="122" width="44" height="28" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="716" y="122" width="44" height="28" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" stroke-dasharray="4 3"/>
    <rect x="760" y="122" width="44" height="28" fill="none" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="804" y="122" width="44" height="28" fill="none" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="848" y="122" width="44" height="28" fill="none" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="562" y="140" text-anchor="middle" font-size="10" fill="#2b6e9e">A</text>
  <text x="606" y="140" text-anchor="middle" font-size="10" fill="#2b6e9e">B</text>
  <text x="650" y="140" text-anchor="middle" font-size="10" fill="#2b6e9e">C</text>
  <text x="694" y="140" text-anchor="middle" font-size="10" fill="#2b6e9e">D</text>
  <text x="738" y="140" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">k</text>

  <text x="650" y="114" text-anchor="middle" font-size="9" fill="#b03a3a" font-weight="bold">h(k)=2 ✗</text>
  <text x="694" y="106" text-anchor="middle" font-size="9" fill="#b03a3a" font-weight="bold">+1 ✗</text>
  <text x="738" y="98" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">+2 ✓ 落位</text>
  <path d="M 655 108 Q 674 100 688 108" stroke="#b03a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 699 108 Q 718 100 732 108" stroke="#b03a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="530" y="180" font-size="10" fill="#666">· 插入 k：h(k)=2 被占 → 试 3 被占 → 落在 4</text>

  <text x="530" y="222" font-size="10" fill="#666">· 冲突就找下一个空位（+1 / +1² / 双散列）</text>
  <text x="530" y="244" font-size="10" fill="#666">· 删除不能直接清空 → 要打墓碑标记</text>
  <text x="530" y="266" font-size="10" fill="#666">· 负载因子升高 → 聚集，性能急剧退化</text>
  <text x="530" y="288" font-size="10" fill="#666">· 内存连续，缓存友好（优点）</text>
  <text x="530" y="318" font-size="10" fill="#2b6e9e" font-weight="bold">适合小对象、只读多写少的缓存场景</text>
  <text x="530" y="340" font-size="10" fill="#2b6e9e" font-weight="bold">（ absl::flat_hash_map 等现代实现用开放寻址 ）</text>

  <!-- ===== 底部：负载因子与 rehash ===== -->
  <g filter="url(#sk)"><rect x="20" y="428" width="960" height="112" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="500" y="454" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">负载因子与 rehash</text>
  <text x="500" y="478" text-anchor="middle" font-size="10" fill="#666">load_factor = size / bucket_count，超过 max_load_factor（默认 1.0）触发 rehash</text>
  <text x="500" y="498" text-anchor="middle" font-size="10" fill="#666">rehash：桶数扩为约 2 倍的素数，全部元素重新散列 —— 均摊 O(1) 的来源；代价是单次插入出现尖刺 + 迭代器全部失效</text>
  <text x="500" y="522" text-anchor="middle" font-size="9" fill="#888">面试加分：std::hash 对内置类型有特化；自定义 key 需要 hash 函数 + operator==（map 只需要 operator&lt;）</text>

  <text x="500" y="566" text-anchor="middle" font-size="10" fill="#888" font-style="italic">拉链 vs 开放寻址的取舍 = 链表额外指针开销 vs 墓碑与聚集问题</text>
</svg>
