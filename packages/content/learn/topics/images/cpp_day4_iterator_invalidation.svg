<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e6e2e"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b03a3a"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#fdfcf7"/>

  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">迭代器失效：你的 it 什么时候变悬空？</text>
  <path d="M 330 40 Q 500 48 670 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左：erase 场景图 ===== -->
  <text x="30" y="72" font-size="11" font-weight="bold" fill="#444">vector：erase(it) 前后</text>

  <text x="160" y="62" text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a3a">it ↓</text>
  <path d="M 160 66 L 160 84" stroke="#b03a3a" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="30" y="88" width="52" height="34" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="82" y="88" width="52" height="34" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="134" y="88" width="52" height="34" fill="#fdecec" stroke="#b03a3a" stroke-width="1.6"/>
    <rect x="186" y="88" width="52" height="34" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="238" y="88" width="52" height="34" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="56" y="109" text-anchor="middle" font-size="11" fill="#2b6e9e">10</text>
  <text x="108" y="109" text-anchor="middle" font-size="11" fill="#2b6e9e">20</text>
  <text x="160" y="109" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">30</text>
  <text x="212" y="109" text-anchor="middle" font-size="11" fill="#2b6e9e">40</text>
  <text x="264" y="109" text-anchor="middle" font-size="11" fill="#2b6e9e">50</text>

  <path d="M 160 126 L 160 160" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" stroke-dasharray="3 2" filter="url(#sk)"/>
  <text x="160" y="146" text-anchor="middle" font-size="9" fill="#888">删除 30</text>

  <path d="M 140 162 L 140 180" stroke="#2e6e2e" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 185 162 L 185 180" stroke="#b03a3a" stroke-width="1.4" fill="none" marker-end="url(#arR)" stroke-dasharray="3 2" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="30" y="184" width="52" height="34" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="82" y="184" width="52" height="34" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="134" y="184" width="52" height="34" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="186" y="184" width="52" height="34" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="238" y="184" width="52" height="34" fill="none" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="56" y="205" text-anchor="middle" font-size="11" fill="#2b6e9e">10</text>
  <text x="108" y="205" text-anchor="middle" font-size="11" fill="#2b6e9e">20</text>
  <text x="160" y="205" text-anchor="middle" font-size="11" fill="#2b6e9e">40</text>
  <text x="212" y="205" text-anchor="middle" font-size="11" fill="#2b6e9e">50</text>

  <text x="30" y="248" font-size="10" fill="#2e6e2e" font-weight="bold">✅ 绿箭头：it = v.erase(it)，返回指向 40 的新迭代器</text>
  <text x="30" y="268" font-size="10" fill="#b03a3a" font-weight="bold">❌ 红箭头：旧 it 指向被删位置，继续 ++ 是未定义行为</text>

  <!-- ===== 右：正确写法 ===== -->
  <g filter="url(#sk)"><rect x="560" y="56" width="420" height="224" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="582" y="82" font-size="12" font-weight="bold" fill="#555">正确写法</text>
  <text x="582" y="106" font-size="10" fill="#333" font-family="monospace">for (auto it = v.begin();</text>
  <text x="582" y="123" font-size="10" fill="#333" font-family="monospace">     it != v.end(); ) {</text>
  <text x="582" y="140" font-size="10" fill="#333" font-family="monospace">  if (pred(*it))</text>
  <text x="582" y="157" font-size="10" fill="#333" font-family="monospace">    it = v.erase(it);  // ⭐ 返回下一个</text>
  <text x="582" y="174" font-size="10" fill="#333" font-family="monospace">  else</text>
  <text x="582" y="191" font-size="10" fill="#333" font-family="monospace">    ++it;  // 不删才前进</text>
  <text x="582" y="208" font-size="10" fill="#333" font-family="monospace">}</text>
  <text x="582" y="232" font-size="9" fill="#888">// 批量删：erase-remove 惯用法（更高效）</text>
  <text x="582" y="249" font-size="9" fill="#333" font-family="monospace">v.erase(remove_if(b,e,pred), v.end());</text>
  <text x="582" y="266" font-size="9" fill="#888">// C++20：std::erase_if(v, pred)</text>

  <!-- ===== 底部速查表 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="296" width="130" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="170" y="296" width="400" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="570" y="296" width="390" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="105" y="317" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">容器</text>
  <text x="370" y="317" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">插入时失效范围</text>
  <text x="765" y="317" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">删除时失效范围</text>

  <!-- row 1 vector -->
  <g filter="url(#sk)">
    <rect x="40" y="330" width="130" height="46" fill="#f4f9fe" stroke="#4a8edb" stroke-width="1"/>
    <rect x="170" y="330" width="400" height="46" fill="#f4f9fe" stroke="#4a8edb" stroke-width="1"/>
    <rect x="570" y="330" width="390" height="46" fill="#f4f9fe" stroke="#4a8edb" stroke-width="1"/>
  </g>
  <text x="105" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">vector</text>
  <text x="105" y="366" text-anchor="middle" font-size="8" fill="#888">连续内存</text>
  <text x="180" y="349" font-size="9" fill="#555">扩容 → 全部失效</text>
  <text x="180" y="364" font-size="9" fill="#555">不扩容 → 插入点及之后失效</text>
  <text x="580" y="349" font-size="9" fill="#555">被删元素及其后全部失效</text>
  <text x="580" y="364" font-size="9" fill="#888">（最常考！）</text>

  <!-- row 2 deque -->
  <g filter="url(#sk)">
    <rect x="40" y="376" width="130" height="46" fill="#fef9ee" stroke="#c98a2b" stroke-width="1"/>
    <rect x="170" y="376" width="400" height="46" fill="#fef9ee" stroke="#c98a2b" stroke-width="1"/>
    <rect x="570" y="376" width="390" height="46" fill="#fef9ee" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="105" y="396" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">deque</text>
  <text x="105" y="412" text-anchor="middle" font-size="8" fill="#888">分段连续</text>
  <text x="180" y="395" font-size="9" fill="#555">两端插入 → 迭代器全失效（引用仍有效）</text>
  <text x="180" y="410" font-size="9" fill="#555">中间插入 → 迭代器 + 引用全失效</text>
  <text x="580" y="395" font-size="9" fill="#555">两端删除 → 仅被删元素</text>
  <text x="580" y="410" font-size="9" fill="#555">中间删除 → 全部失效</text>

  <!-- row 3 list -->
  <g filter="url(#sk)">
    <rect x="40" y="422" width="130" height="46" fill="#f4fbf6" stroke="#4a8e4a" stroke-width="1"/>
    <rect x="170" y="422" width="400" height="46" fill="#f4fbf6" stroke="#4a8e4a" stroke-width="1"/>
    <rect x="570" y="422" width="390" height="46" fill="#f4fbf6" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <text x="105" y="442" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">list</text>
  <text x="105" y="458" text-anchor="middle" font-size="8" fill="#888">节点式</text>
  <text x="180" y="451" font-size="9" fill="#2e6e2e" font-weight="bold">不失效 ✅</text>
  <text x="580" y="441" font-size="9" fill="#555">仅被删节点的迭代器失效</text>
  <text x="580" y="456" font-size="9" fill="#888">其余迭代器安然无恙</text>

  <!-- row 4 map/set -->
  <g filter="url(#sk)">
    <rect x="40" y="468" width="130" height="46" fill="#fdf4f4" stroke="#b03a3a" stroke-width="1"/>
    <rect x="170" y="468" width="400" height="46" fill="#fdf4f4" stroke="#b03a3a" stroke-width="1"/>
    <rect x="570" y="468" width="390" height="46" fill="#fdf4f4" stroke="#b03a3a" stroke-width="1"/>
  </g>
  <text x="105" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">map / set</text>
  <text x="105" y="504" text-anchor="middle" font-size="8" fill="#888">节点式</text>
  <text x="180" y="497" font-size="9" fill="#2e6e2e" font-weight="bold">不失效 ✅</text>
  <text x="580" y="487" font-size="9" fill="#555">仅被删节点失效</text>
  <text x="580" y="502" font-size="9" fill="#888">（m.erase(it++) 或 it = m.erase(it)）</text>

  <!-- row 5 unordered -->
  <g filter="url(#sk)">
    <rect x="40" y="514" width="130" height="46" fill="#f9f5fc" stroke="#8e5db8" stroke-width="1"/>
    <rect x="170" y="514" width="400" height="46" fill="#f9f5fc" stroke="#8e5db8" stroke-width="1"/>
    <rect x="570" y="514" width="390" height="46" fill="#f9f5fc" stroke="#8e5db8" stroke-width="1"/>
  </g>
  <text x="105" y="534" text-anchor="middle" font-size="10" font-weight="bold" fill="#5a3a7a">unordered_*</text>
  <text x="105" y="550" text-anchor="middle" font-size="8" fill="#888">节点式</text>
  <text x="180" y="533" font-size="9" fill="#555">rehash → 迭代器全失效</text>
  <text x="180" y="548" font-size="9" fill="#555">（指向元素的引用 / 指针仍有效）</text>
  <text x="580" y="541" font-size="9" fill="#555">仅被删元素失效</text>

  <!-- bottom note -->
  <text x="500" y="606" text-anchor="middle" font-size="10" fill="#888" font-style="italic">规律：连续内存（vector / deque / string）失效多，节点式（list / map / set）只失效被删节点 —— 失效的本质是底层内存被搬动或释放</text>
</svg>
