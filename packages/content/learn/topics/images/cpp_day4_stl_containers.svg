<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="1000" height="680" fill="#fdfcf7"/>

  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">STL 常用容器底层数据结构</text>
  <path d="M 380 40 Q 500 48 620 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ========== Band 1: vector ========== -->
  <g filter="url(#sk)"><rect x="20" y="66" width="180" height="88" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="110" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">vector</text>
  <text x="110" y="114" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">动态数组</text>
  <text x="110" y="132" text-anchor="middle" font-size="9" fill="#666">一维连续内存</text>

  <g filter="url(#sk)">
    <rect x="240" y="86" width="46" height="36" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="286" y="86" width="46" height="36" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="332" y="86" width="46" height="36" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="378" y="86" width="46" height="36" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="424" y="86" width="46" height="36" fill="none" stroke="#4a8edb" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>
  <text x="263" y="109" text-anchor="middle" font-size="11" fill="#2b6e9e">10</text>
  <text x="309" y="109" text-anchor="middle" font-size="11" fill="#2b6e9e">20</text>
  <text x="355" y="109" text-anchor="middle" font-size="11" fill="#2b6e9e">30</text>
  <text x="401" y="109" text-anchor="middle" font-size="11" fill="#2b6e9e">40</text>
  <text x="447" y="109" text-anchor="middle" font-size="11" fill="#999">50</text>
  <text x="500" y="78" text-anchor="middle" font-size="9" fill="#2b6e9e" font-weight="bold">push_back</text>
  <path d="M 480 84 L 470 84" stroke="#4a8edb" stroke-width="1.2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <text x="730" y="96" font-size="10" fill="#666">· 随机访问 O(1)</text>
  <text x="730" y="114" font-size="10" fill="#666">· 尾部增删均摊 O(1)</text>
  <text x="730" y="132" font-size="10" fill="#666">· 中间插入 O(n)：整体搬移</text>

  <!-- ========== Band 2: list ========== -->
  <g filter="url(#sk)"><rect x="20" y="180" width="180" height="88" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="110" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">list</text>
  <text x="110" y="228" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">双向链表</text>
  <text x="110" y="246" text-anchor="middle" font-size="9" fill="#666">节点散布在堆上</text>

  <g filter="url(#sk)">
    <rect x="240" y="218" width="26" height="36" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="266" y="218" width="54" height="36" fill="#cfe8d2" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="320" y="218" width="26" height="36" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="392" y="218" width="26" height="36" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="418" y="218" width="54" height="36" fill="#cfe8d2" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="472" y="218" width="26" height="36" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="544" y="218" width="26" height="36" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="570" y="218" width="54" height="36" fill="#cfe8d2" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="624" y="218" width="26" height="36" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="293" y="241" text-anchor="middle" font-size="11" fill="#2e6e2e">20</text>
  <text x="445" y="241" text-anchor="middle" font-size="11" fill="#2e6e2e">30</text>
  <text x="597" y="241" text-anchor="middle" font-size="11" fill="#2e6e2e">40</text>
  <text x="293" y="210" text-anchor="middle" font-size="8" fill="#888">prev|data|next</text>
  <path d="M 348 228 L 390 228" stroke="#4a8e4a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 390 244 L 348 244" stroke="#4a8e4a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 500 228 L 542 228" stroke="#4a8e4a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 542 244 L 500 244" stroke="#4a8e4a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="730" y="210" font-size="10" fill="#666">· 任意位置增删 O(1)</text>
  <text x="730" y="228" font-size="10" fill="#666">· 随机访问 O(n)</text>
  <text x="730" y="246" font-size="10" fill="#666">· splice 拼接 O(1)，缓存不友好</text>

  <!-- ========== Band 3: deque ========== -->
  <g filter="url(#sk)"><rect x="20" y="294" width="180" height="88" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="110" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">deque</text>
  <text x="110" y="342" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">分段连续</text>
  <text x="110" y="360" text-anchor="middle" font-size="9" fill="#666">中控器 + 定长缓冲区</text>

  <text x="300" y="302" text-anchor="middle" font-size="9" fill="#7a5415" font-weight="bold">中控 map（指针数组）</text>
  <g filter="url(#sk)">
    <rect x="252" y="308" width="26" height="18" fill="#f5e2c0" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="288" y="308" width="26" height="18" fill="#f5e2c0" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="324" y="308" width="26" height="18" fill="#f5e2c0" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <path d="M 265 328 Q 270 338 278 348" stroke="#c98a2b" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 301 328 Q 340 338 388 348" stroke="#c98a2b" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 337 328 Q 420 338 498 348" stroke="#c98a2b" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="252" y="350" width="36" height="26" fill="#fdf3df" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="288" y="350" width="36" height="26" fill="#fdf3df" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="324" y="350" width="36" height="26" fill="#fdf3df" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="372" y="350" width="36" height="26" fill="#fdf3df" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="408" y="350" width="36" height="26" fill="#fdf3df" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="444" y="350" width="36" height="26" fill="#fdf3df" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="492" y="350" width="36" height="26" fill="#fdf3df" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="528" y="350" width="36" height="26" fill="#fdf3df" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="564" y="350" width="36" height="26" fill="#fdf3df" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="270" y="367" text-anchor="middle" font-size="10" fill="#7a5415">a</text>
  <text x="306" y="367" text-anchor="middle" font-size="10" fill="#7a5415">b</text>
  <text x="342" y="367" text-anchor="middle" font-size="10" fill="#7a5415">c</text>
  <text x="390" y="367" text-anchor="middle" font-size="10" fill="#7a5415">d</text>
  <text x="426" y="367" text-anchor="middle" font-size="10" fill="#7a5415">e</text>
  <text x="462" y="367" text-anchor="middle" font-size="10" fill="#7a5415">f</text>
  <text x="510" y="367" text-anchor="middle" font-size="10" fill="#7a5415">g</text>
  <text x="546" y="367" text-anchor="middle" font-size="10" fill="#7a5415">h</text>
  <text x="582" y="367" text-anchor="middle" font-size="10" fill="#7a5415">i</text>

  <text x="730" y="324" font-size="10" fill="#666">· 首尾 push/pop O(1)</text>
  <text x="730" y="342" font-size="10" fill="#666">· 随机访问 O(1)（两级寻址）</text>
  <text x="730" y="360" font-size="10" fill="#666">· 中间插入 O(n)</text>

  <!-- ========== Band 4: map / set ========== -->
  <g filter="url(#sk)"><rect x="20" y="408" width="180" height="88" rx="6" fill="#fdecec" stroke="#b03a3a" stroke-width="1.4"/></g>
  <text x="110" y="436" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">map / set</text>
  <text x="110" y="456" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">红黑树</text>
  <text x="110" y="474" text-anchor="middle" font-size="9" fill="#666">key 有序存储</text>

  <g stroke="#7a7a7a" stroke-width="1.2">
    <line x1="400" y1="440" x2="342" y2="466"/>
    <line x1="400" y1="440" x2="458" y2="466"/>
    <line x1="340" y1="474" x2="314" y2="492"/>
    <line x1="340" y1="474" x2="366" y2="492"/>
    <line x1="460" y1="474" x2="434" y2="492"/>
    <line x1="460" y1="474" x2="486" y2="492"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="400" cy="436" r="12" fill="#333"/>
    <circle cx="340" cy="468" r="10" fill="#b03a3a"/>
    <circle cx="460" cy="468" r="10" fill="#b03a3a"/>
    <circle cx="310" cy="496" r="9" fill="#333"/>
    <circle cx="370" cy="496" r="9" fill="#333"/>
    <circle cx="430" cy="496" r="9" fill="#333"/>
    <circle cx="490" cy="496" r="9" fill="#333"/>
  </g>
  <text x="400" y="440" text-anchor="middle" font-size="10" fill="#fff">26</text>
  <text x="340" y="472" text-anchor="middle" font-size="9" fill="#fff">17</text>
  <text x="460" y="472" text-anchor="middle" font-size="9" fill="#fff">41</text>
  <text x="310" y="500" text-anchor="middle" font-size="8" fill="#fff">14</text>
  <text x="370" y="500" text-anchor="middle" font-size="8" fill="#fff">20</text>
  <text x="430" y="500" text-anchor="middle" font-size="8" fill="#fff">30</text>
  <text x="490" y="500" text-anchor="middle" font-size="8" fill="#fff">47</text>

  <text x="730" y="428" font-size="10" fill="#666">· 增删查稳定 O(log n)</text>
  <text x="730" y="446" font-size="10" fill="#666">· 中序遍历即有序序列</text>
  <text x="730" y="464" font-size="10" fill="#666">· 节点 = 三指针 + 颜色位</text>

  <!-- ========== Band 5: unordered_map / set ========== -->
  <g filter="url(#sk)"><rect x="20" y="522" width="180" height="88" rx="6" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/></g>
  <text x="110" y="550" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a3a7a">unordered_map/set</text>
  <text x="110" y="570" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">哈希表（拉链法）</text>
  <text x="110" y="588" text-anchor="middle" font-size="9" fill="#666">无序存储</text>

  <g filter="url(#sk)">
    <rect x="250" y="546" width="40" height="26" fill="#ead9f5" stroke="#8e5db8" stroke-width="1.2"/>
    <rect x="300" y="546" width="40" height="26" fill="#ead9f5" stroke="#8e5db8" stroke-width="1.2"/>
    <rect x="350" y="546" width="40" height="26" fill="#ead9f5" stroke="#8e5db8" stroke-width="1.2"/>
    <rect x="400" y="546" width="40" height="26" fill="#ead9f5" stroke="#8e5db8" stroke-width="1.2"/>
    <rect x="450" y="546" width="40" height="26" fill="#ead9f5" stroke="#8e5db8" stroke-width="1.2"/>
  </g>
  <text x="270" y="563" text-anchor="middle" font-size="10" fill="#5a3a7a">0</text>
  <text x="320" y="563" text-anchor="middle" font-size="10" fill="#5a3a7a">1</text>
  <text x="370" y="563" text-anchor="middle" font-size="10" fill="#5a3a7a">2</text>
  <text x="420" y="563" text-anchor="middle" font-size="10" fill="#5a3a7a">3</text>
  <text x="470" y="563" text-anchor="middle" font-size="10" fill="#5a3a7a">4</text>

  <line x1="320" y1="572" x2="320" y2="580" stroke="#8e5db8" stroke-width="1.2"/>
  <g filter="url(#sk)">
    <rect x="298" y="580" width="44" height="18" fill="#f6effa" stroke="#8e5db8" stroke-width="1.1"/>
    <rect x="298" y="602" width="44" height="18" fill="#f6effa" stroke="#8e5db8" stroke-width="1.1"/>
  </g>
  <text x="320" y="593" text-anchor="middle" font-size="9" fill="#5a3a7a">k=17</text>
  <text x="320" y="615" text-anchor="middle" font-size="9" fill="#5a3a7a">k=88</text>
  <line x1="320" y1="598" x2="320" y2="602" stroke="#8e5db8" stroke-width="1.2"/>
  <line x1="420" y1="572" x2="420" y2="580" stroke="#8e5db8" stroke-width="1.2"/>
  <g filter="url(#sk)"><rect x="398" y="580" width="44" height="18" fill="#f6effa" stroke="#8e5db8" stroke-width="1.1"/></g>
  <text x="420" y="593" text-anchor="middle" font-size="9" fill="#5a3a7a">k=42</text>

  <text x="730" y="550" font-size="10" fill="#666">· 增删查均摊 O(1)，最坏 O(n)</text>
  <text x="730" y="568" font-size="10" fill="#666">· 无序，不支持范围查询</text>
  <text x="730" y="586" font-size="10" fill="#666">· rehash → 迭代器全部失效</text>

  <!-- bottom note -->
  <text x="500" y="656" text-anchor="middle" font-size="10" fill="#888" font-style="italic">选型速记：默认 vector ｜ 中间频繁增删 list ｜ 双端操作 deque ｜ 要有序 map ｜ 纯点查 unordered_map</text>
</svg>
