<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="46" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8e5db8"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b03a3a"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#fdfcf7"/>

  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">LRU 缓存 = 哈希表 + 双向链表（全程 O(1)）</text>
  <path d="M 310 40 Q 500 48 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左：哈希表 ===== -->
  <g filter="url(#sk)"><rect x="30" y="64" width="240" height="200" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/></g>
  <text x="150" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a7a">哈希表 unordered_map</text>
  <text x="150" y="106" text-anchor="middle" font-size="9" fill="#888">key → 链表节点迭代器</text>
  <g filter="url(#sk)">
    <rect x="50" y="118" width="200" height="24" fill="#faf6fd" stroke="#d5c3e8" stroke-width="1.1"/>
    <rect x="50" y="146" width="200" height="24" fill="#faf6fd" stroke="#d5c3e8" stroke-width="1.1"/>
    <rect x="50" y="174" width="200" height="24" fill="#faf6fd" stroke="#d5c3e8" stroke-width="1.1"/>
    <rect x="50" y="202" width="200" height="24" fill="#faf6fd" stroke="#d5c3e8" stroke-width="1.1"/>
  </g>
  <text x="150" y="134" text-anchor="middle" font-size="10" fill="#5a3a7a">key=4 → &amp;D</text>
  <text x="150" y="162" text-anchor="middle" font-size="10" fill="#5a3a7a">key=3 → &amp;C</text>
  <text x="150" y="190" text-anchor="middle" font-size="10" fill="#5a3a7a">key=2 → &amp;B</text>
  <text x="150" y="218" text-anchor="middle" font-size="10" fill="#5a3a7a">key=1 → &amp;A</text>
  <text x="150" y="250" text-anchor="middle" font-size="9" fill="#888">负责：O(1) 定位节点</text>

  <!-- ===== 哈希表 → 节点的虚线 ===== -->
  <path d="M 250 130 Q 320 140 400 166" stroke="#8e5db8" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arP)" filter="url(#sk)"/>
  <path d="M 250 158 Q 340 160 520 166" stroke="#8e5db8" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arP)" filter="url(#sk)"/>
  <path d="M 250 186 Q 360 186 640 166" stroke="#8e5db8" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arP)" filter="url(#sk)"/>
  <path d="M 250 214 Q 400 212 770 166" stroke="#8e5db8" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arP)" filter="url(#sk)"/>

  <!-- ===== 右：双向链表 ===== -->
  <text x="640" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">双向链表（维护新旧顺序）</text>

  <text x="342" y="158" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">最新</text>
  <text x="910" y="158" text-anchor="middle" font-size="9" fill="#b03a3a" font-weight="bold">最旧</text>

  <g filter="url(#sk)">
    <rect x="300" y="168" width="52" height="48" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="372" y="168" width="104" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="500" y="168" width="104" height="48" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="628" y="168" width="104" height="48" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="756" y="168" width="104" height="48" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
    <rect x="884" y="168" width="52" height="48" fill="#fdecec" stroke="#b03a3a" stroke-width="1.4"/>
  </g>
  <text x="326" y="196" text-anchor="middle" font-size="10" fill="#555">head</text>
  <text x="424" y="190" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">key=4</text>
  <text x="424" y="206" text-anchor="middle" font-size="9" fill="#666">val=…</text>
  <text x="552" y="190" text-anchor="middle" font-size="10" fill="#444">key=3</text>
  <text x="552" y="206" text-anchor="middle" font-size="9" fill="#666">val=…</text>
  <text x="680" y="190" text-anchor="middle" font-size="10" fill="#444">key=2</text>
  <text x="680" y="206" text-anchor="middle" font-size="9" fill="#666">val=…</text>
  <text x="808" y="190" text-anchor="middle" font-size="10" fill="#444">key=1</text>
  <text x="808" y="206" text-anchor="middle" font-size="9" fill="#666">val=…</text>
  <text x="910" y="196" text-anchor="middle" font-size="10" fill="#b03a3a">tail</text>

  <path d="M 354 182 L 370 182" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 370 202 L 354 202" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 478 182 L 498 182" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 498 202 L 478 202" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 606 182 L 626 182" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 626 202 L 606 202" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 734 182 L 754 182" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 754 202 L 734 202" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 862 182 L 882 182" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 882 202 L 862 202" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="424" y="238" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">刚访问/刚插入 → 挂到 head 一侧</text>
  <text x="910" y="238" text-anchor="middle" font-size="9" fill="#b03a3a" font-weight="bold">淘汰只发生在 tail 侧</text>
  <path d="M 948 192 Q 972 192 972 210 Q 972 228 944 226" stroke="#b03a3a" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- ===== get ===== -->
  <g filter="url(#sk)"><rect x="30" y="288" width="460" height="136" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="50" y="314" font-size="12" font-weight="bold" fill="#2b6e9e">get(key)</text>
  <text x="50" y="340" font-size="10" fill="#666">① index_.find(key) —— O(1)</text>
  <text x="50" y="360" font-size="10" fill="#666">② 命中：splice 把节点摘下、接到链表头 —— O(1)</text>
  <text x="50" y="380" font-size="10" fill="#666">③ 返回 value；未命中返回 -1</text>
  <text x="50" y="406" font-size="9" fill="#888">读操作也要"刷新"位置 —— 这就是 LRU 的语义</text>

  <!-- ===== put ===== -->
  <g filter="url(#sk)"><rect x="510" y="288" width="460" height="176" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="530" y="314" font-size="12" font-weight="bold" fill="#7a5415">put(key, value)</text>
  <text x="530" y="340" font-size="10" fill="#666">① key 已存在：更新 value + splice 到头部</text>
  <text x="530" y="360" font-size="10" fill="#666">② key 不存在：头部插入新节点 + index_[key] = begin()</text>
  <text x="530" y="380" font-size="10" fill="#666">③ 超容量：淘汰 tail 前一个节点（最久未用）</text>
  <text x="530" y="400" font-size="10" fill="#666">   index_.erase(back().first) + pop_back()</text>
  <text x="530" y="426" font-size="9" fill="#888">list::splice：把节点从当前位置摘下接到头部，</text>
  <text x="530" y="444" font-size="9" fill="#888">不拷贝不析构 —— 本题灵魂，面试要能说出</text>

  <!-- ===== bottom note ===== -->
  <text x="500" y="512" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">核心分工：哈希表负责 O(1) 定位，双向链表负责 O(1) 维护新旧顺序</text>
  <text x="500" y="536" text-anchor="middle" font-size="10" fill="#888">为什么不用数组 / 单向链表？数组头插 O(n)；单向链表摘节点拿不到前驱，也是 O(n)</text>
  <text x="500" y="560" text-anchor="middle" font-size="10" fill="#888" font-style="italic">对应 LeetCode 146；进阶：LFU（LeetCode 460）= 两条双向链表 + 哈希表</text>
</svg>
