<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#fdfcf7"/>

  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">生产者-消费者：一把互斥锁 + 两个条件变量</text>
  <path d="M 300 41 Q 500 49 700 41" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- notFull 条件变量 -->
  <g filter="url(#sk)"><rect x="330" y="56" width="340" height="52" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="500" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">条件变量 notFull_ —— 生产者的“床”</text>
  <text x="500" y="94" text-anchor="middle" font-size="9" fill="#666">队列满：push 里 wait 挂起；pop 后 notify_one 叫醒</text>
  <path d="M 500 108 L 500 120" stroke="#c98a2b" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ================= 队列 ================= -->
  <g filter="url(#sk)"><rect x="360" y="124" width="280" height="180" rx="8" fill="#f0f0f0" stroke="#777" stroke-width="1.5"/></g>
  <text x="500" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">BlockingQueue（容量 5）</text>

  <!-- cells -->
  <g filter="url(#sk)">
    <rect x="380" y="160" width="44" height="56" fill="#4a8e4a" stroke="#fff" stroke-width="2"/>
    <rect x="432" y="160" width="44" height="56" fill="#4a8e4a" stroke="#fff" stroke-width="2"/>
    <rect x="484" y="160" width="44" height="56" fill="#fff" stroke="#999" stroke-width="1.5"/>
    <rect x="536" y="160" width="44" height="56" fill="#fff" stroke="#999" stroke-width="1.5"/>
    <rect x="588" y="160" width="44" height="56" fill="#fff" stroke="#999" stroke-width="1.5"/>
  </g>
  <text x="402" y="192" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">v1</text>
  <text x="454" y="192" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">v2</text>

  <text x="500" y="240" text-anchor="middle" font-size="9" fill="#666">size = 2（tail 侧还有空位）</text>
  <text x="500" y="264" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">整张队列由一把 std::mutex 保护</text>
  <text x="500" y="284" text-anchor="middle" font-size="9" fill="#888">push / pop 进出都要先拿锁</text>

  <!-- notEmpty 条件变量 -->
  <path d="M 500 304 L 500 324" stroke="#4a8e4a" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="330" y="328" width="340" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="500" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">条件变量 notEmpty_ —— 消费者的“床”</text>
  <text x="500" y="366" text-anchor="middle" font-size="9" fill="#666">队列空：pop 里 wait 挂起；push 后 notify_one 叫醒</text>

  <!-- ================= 生产者 ================= -->
  <text x="115" y="142" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">多个生产者线程</text>
  <g filter="url(#sk)"><rect x="40" y="150" width="150" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="115" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">生产者 P1</text>
  <text x="115" y="190" text-anchor="middle" font-size="9" fill="#888">满则睡 notFull_</text>
  <g filter="url(#sk)"><rect x="40" y="230" width="150" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="115" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">生产者 P2</text>
  <text x="115" y="270" text-anchor="middle" font-size="9" fill="#888">→ 否则 push 入队</text>

  <path d="M 192 176 L 354 196" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="256" y="172" font-size="9" fill="#555" font-weight="bold">push</text>
  <path d="M 192 256 L 354 236" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="256" y="266" font-size="9" fill="#555" font-weight="bold">push</text>

  <!-- ================= 消费者 ================= -->
  <text x="885" y="142" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">多个消费者线程</text>
  <g filter="url(#sk)"><rect x="810" y="150" width="150" height="52" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="885" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">消费者 C1</text>
  <text x="885" y="190" text-anchor="middle" font-size="9" fill="#888">空则睡 notEmpty_</text>
  <g filter="url(#sk)"><rect x="810" y="230" width="150" height="52" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="885" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">消费者 C2</text>
  <text x="885" y="270" text-anchor="middle" font-size="9" fill="#888">→ 否则 pop 出队</text>

  <path d="M 646 196 L 806 176" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="726" y="172" font-size="9" fill="#555" font-weight="bold">pop</text>
  <path d="M 646 236 L 806 256" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="726" y="266" font-size="9" fill="#555" font-weight="bold">pop</text>

  <!-- ================= 默写要点 ================= -->
  <g filter="url(#sk)"><rect x="30" y="404" width="940" height="128" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.5"/></g>
  <text x="500" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a3a7a">默写三要点（每条都要能说出口）</text>
  <text x="60" y="456" font-size="9.5" fill="#555">① wait 必须带谓词（等价 while 循环）—— 防虚假唤醒，且醒来时条件可能又被别的线程改掉</text>
  <text x="60" y="480" font-size="9.5" fill="#555">② 必须用 unique_lock —— wait 内部要“解锁 → 睡 → 被唤醒 → 重新加锁”，lock_guard 做不到中途解锁</text>
  <text x="60" y="504" font-size="9.5" fill="#555">③ notify_one 叫醒一个等待者（一份数据配一个）；广播状态变化（如关闭队列）用 notify_all</text>
</svg>
