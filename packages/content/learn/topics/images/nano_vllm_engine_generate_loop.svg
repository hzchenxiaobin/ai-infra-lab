<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="900" height="680" fill="#fdfcf7"/>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">generate() 主循环：一个 step 的三段式</text>
  <path d="M 250 38 Q 450 46 650 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- generate 入口 -->
  <g filter="url(#sk)"><rect x="290" y="52" width="320" height="38" rx="8" fill="#eeeeee" stroke="#888" stroke-width="1.5"/></g>
  <text x="450" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444">generate(prompts, sampling_params)</text>

  <path d="M 450 90 L 450 106" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- add_request -->
  <g filter="url(#sk)"><rect x="230" y="108" width="440" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="450" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">逐条 add_request(prompt, sp)</text>
  <text x="450" y="150" text-anchor="middle" font-size="9.5" fill="#444">str → tokenizer.encode → Sequence → scheduler.add → waiting 队列</text>

  <path d="M 450 166 L 450 184" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- while 条件 -->
  <g filter="url(#sk)"><rect x="320" y="186" width="260" height="46" rx="23" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="450" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">while not is_finished()</text>
  <text x="450" y="224" text-anchor="middle" font-size="9" fill="#7a5415">waiting 与 running 队列都空才停</text>

  <path d="M 450 232 L 450 252" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="490" y="246" font-size="9" fill="#888">未完成 → step()</text>

  <!-- step 容器 -->
  <g filter="url(#sk)"><rect x="42" y="256" width="716" height="212" rx="12" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 4"/></g>
  <text x="400" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#356130">step()：一次引擎迭代</text>

  <!-- ① schedule -->
  <g filter="url(#sk)"><rect x="62" y="296" width="200" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="162" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">① scheduler.schedule()</text>
  <g font-size="9" fill="#444">
    <text x="162" y="340" text-anchor="middle">prefill 优先：从 waiting 取</text>
    <text x="162" y="356" text-anchor="middle">最多 max_num_batched_tokens</text>
    <text x="162" y="372" text-anchor="middle">不够则整段分块（chunked）</text>
    <text x="162" y="392" text-anchor="middle">waiting 空才轮到 running</text>
    <text x="162" y="408" text-anchor="middle">做 decode（每序列 1 token）</text>
    <text x="162" y="430" text-anchor="middle" fill="#7a5415">返回 (seqs, is_prefill)</text>
  </g>

  <path d="M 262 370 L 296 370" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ② run -->
  <g filter="url(#sk)"><rect x="298" y="296" width="210" height="150" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="403" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#356130">② model_runner.call('run')</text>
  <g font-size="9" fill="#444">
    <text x="403" y="340" text-anchor="middle">prepare：input_ids / positions /</text>
    <text x="403" y="356" text-anchor="middle">slot_mapping / block_tables</text>
    <text x="403" y="372" text-anchor="middle">prefill 走 flash-attn varlen</text>
    <text x="403" y="388" text-anchor="middle">decode 走 CUDA Graph replay</text>
    <text x="403" y="408" text-anchor="middle">logits → Sampler 采样</text>
    <text x="403" y="430" text-anchor="middle" fill="#356130">返回每序列 1 个 token</text>
  </g>

  <path d="M 508 370 L 542 370" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ③ postprocess -->
  <g filter="url(#sk)"><rect x="544" y="296" width="196" height="150" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="642" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8d3f3b">③ scheduler.postprocess()</text>
  <g font-size="9" fill="#444">
    <text x="642" y="340" text-anchor="middle">写 KV 块哈希（前缀缓存）</text>
    <text x="642" y="356" text-anchor="middle">未完成的 prefill：continue</text>
    <text x="642" y="372" text-anchor="middle">append_token 挂到序列尾</text>
    <text x="642" y="392" text-anchor="middle">遇 eos 或达到 max_tokens</text>
    <text x="642" y="408" text-anchor="middle">→ FINISHED，释放 KV 块</text>
    <text x="642" y="430" text-anchor="middle" fill="#8d3f3b">腾出的位置立刻给新请求</text>
  </g>

  <!-- num_tokens 注释 -->
  <path d="M 450 468 L 450 486" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="200" y="488" width="500" height="58" rx="8" fill="#fff" stroke="#888" stroke-width="1.2"/></g>
  <g font-size="9.5" fill="#444">
    <text x="450" y="508" text-anchor="middle">step 返回 (outputs, num_tokens)：正负号区分阶段——</text>
    <text x="450" y="526" text-anchor="middle">num_tokens &gt; 0 是 prefill 的 token 数（吞吐=tokens/Δt）；&lt; 0 时其绝对值是 decode 批大小</text>
  </g>

  <!-- 循环回边 -->
  <path d="M 700 517 C 812 517 812 209 582 209" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="800" y="368" text-anchor="middle" font-size="9.5" fill="#356130" transform="rotate(90 800 368)">FINISHED → outputs[seq_id]，pbar.update(1)</text>

  <!-- 循环出口 -->
  <path d="M 450 546 L 450 566" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="500" y="560" font-size="9" fill="#888">全部序列 FINISHED</text>

  <g filter="url(#sk)"><rect x="195" y="568" width="510" height="72" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="450" y="590" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">收尾：按 seq_id 排序（与 prompts 输入顺序一一对齐）</text>
  <text x="450" y="610" text-anchor="middle" font-size="9.5" fill="#444">tokenizer.decode(token_ids) → 返回 [{"text": …, "token_ids": …}]</text>
  <text x="450" y="628" text-anchor="middle" font-size="9" fill="#888">这就是 continuous batching：请求随到随加入 waiting，完成即退出 running，批次逐 step 动态重组</text>
</svg>
