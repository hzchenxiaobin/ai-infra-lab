<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="55" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#fdfcf7"/>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">张量并行（TP&gt;1）：共享内存 RPC + NCCL 协同</text>
  <path d="M 250 38 Q 450 46 650 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 生命线头部 -->
  <g font-size="11" font-weight="bold">
    <g filter="url(#sk)"><rect x="60" y="56" width="250" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
    <text x="185" y="74" text-anchor="middle" fill="#2b6e9e">主进程 · ModelRunner(rank 0)</text>
    <text x="185" y="90" text-anchor="middle" font-size="8.5" fill="#2b6e9e" font-weight="normal">LLMEngine.step() 在这里调用 call('run')</text>

    <g filter="url(#sk)"><rect x="360" y="56" width="180" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
    <text x="450" y="74" text-anchor="middle" fill="#8d3f3b">SharedMemory</text>
    <text x="450" y="90" text-anchor="middle" font-size="8.5" fill="#8d3f3b" font-weight="normal">name='nanovllm'，1 MiB</text>

    <g filter="url(#sk)"><rect x="590" y="56" width="250" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
    <text x="715" y="74" text-anchor="middle" fill="#7a5415">worker 进程 · rank i (1≤i&lt;TP)</text>
    <text x="715" y="90" text-anchor="middle" font-size="8.5" fill="#7a5415" font-weight="normal">构造函数末尾进入 loop() 死循环</text>
  </g>

  <!-- 生命线 -->
  <g stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3">
    <line x1="185" y1="98" x2="185" y2="400"/>
    <line x1="450" y1="98" x2="450" y2="400"/>
    <line x1="715" y1="98" x2="715" y2="400"/>
  </g>

  <!-- 1. step 调用 -->
  <g filter="url(#sk)"><rect x="80" y="112" width="180" height="34" rx="6" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="170" y="133" text-anchor="middle" font-size="9" fill="#2b6e9e">① call('run', seqs, is_prefill)</text>

  <!-- 2. write_shm -->
  <path d="M 260 168 L 357 168" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="308" y="160" text-anchor="middle" font-size="9" fill="#8d3f3b">② write_shm</text>
  <text x="308" y="182" text-anchor="middle" font-size="8" fill="#888">pickle([method, *args]) → buf</text>

  <!-- 3. event.set -->
  <path d="M 540 168 L 637 168" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="590" y="160" text-anchor="middle" font-size="9" fill="#8d3f3b">③ event.set()</text>
  <text x="590" y="182" text-anchor="middle" font-size="8" fill="#888">唤醒所有 worker</text>

  <!-- 4. worker 读 -->
  <g filter="url(#sk)"><rect x="600" y="204" width="230" height="50" rx="6" fill="#fff" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="715" y="224" text-anchor="middle" font-size="9" fill="#7a5415">④ event.wait() 返回 → read_shm</text>
  <text x="715" y="240" text-anchor="middle" font-size="8.5" fill="#444">pickle.loads 还原指令 → event.clear()</text>

  <!-- 5. 双方各自 run -->
  <g filter="url(#sk)"><rect x="80" y="230" width="180" height="34" rx="6" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="170" y="251" text-anchor="middle" font-size="9" fill="#2b6e9e">⑤ 本地也执行 self.run(...)</text>

  <!-- 6. NCCL -->
  <path d="M 690 296 L 240 296" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arg)" marker-start="url(#arg)" filter="url(#sk)"/>
  <text x="450" y="288" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#356130">⑥ 前向中 NCCL all-reduce（TP 通信）</text>
  <text x="450" y="312" text-anchor="middle" font-size="8.5" fill="#444">只有张量走 NCCL；seqs 等元数据走共享内存，各 rank 重建输入</text>

  <!-- 7. 采样只在 rank0 -->
  <g filter="url(#sk)"><rect x="80" y="330" width="180" height="34" rx="6" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="170" y="351" text-anchor="middle" font-size="9" fill="#2b6e9e">⑦ 采样只看 rank 0 的 logits</text>
  <text x="715" y="351" text-anchor="middle" font-size="9" fill="#888">worker 的 run 不采样、不返回</text>

  <!-- 8. loop 继续 -->
  <path d="M 715 380 C 715 402 715 400 715 396" stroke="#d6a040" stroke-width="0" fill="none"/>
  <path d="M 620 372 C 660 392 770 392 810 372" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="715" y="408" text-anchor="middle" font-size="9" fill="#7a5415">⑧ 回到 loop() 阻塞在 event.wait()，直到下一条指令或 'exit'</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)"><rect x="42" y="424" width="816" height="82" rx="10" fill="#fff" stroke="#888" stroke-width="1.2"/></g>
  <g font-size="9.5" fill="#444">
    <text x="60" y="446" fill="#2b6e9e" font-weight="bold">为什么用多进程而不是多线程？</text>
    <text x="60" y="464">每个 rank 要独立 init_process_group + set_device(rank)，spawn 进程各持有自己的 CUDA 上下文，绕开 GIL 与 fork 的 NCCL 死锁问题</text>
    <text x="60" y="486" fill="#8d3f3b" font-weight="bold">序列化瘦身：</text>
    <text x="192" y="486">Sequence.__getstate__ 只打包必要字段——prefill 传完整 token_ids，decode 只传 last_token，控制 1 MiB 共享内存内的开销</text>
  </g>
</svg>
