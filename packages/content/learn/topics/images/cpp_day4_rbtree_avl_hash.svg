<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="44" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8e5db8"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#fdfcf7"/>

  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">AVL vs 红黑树 vs 哈希表：map 为什么选红黑树？</text>
  <path d="M 300 40 Q 500 48 700 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Col 1: AVL ===== -->
  <g filter="url(#sk)"><rect x="20" y="60" width="300" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="170" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">AVL 树（严格平衡）</text>

  <g stroke="#7a7a7a" stroke-width="1.2">
    <line x1="170" y1="152" x2="117" y2="192"/>
    <line x1="170" y1="152" x2="223" y2="192"/>
    <line x1="115" y1="204" x2="90" y2="242"/>
    <line x1="115" y1="204" x2="140" y2="242"/>
    <line x1="225" y1="204" x2="200" y2="242"/>
    <line x1="225" y1="204" x2="250" y2="242"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="170" cy="144" r="14" fill="#2b6e9e"/>
    <circle cx="115" cy="198" r="12" fill="#4a8edb"/>
    <circle cx="225" cy="198" r="12" fill="#4a8edb"/>
    <circle cx="88" cy="250" r="10" fill="#4a8edb"/>
    <circle cx="142" cy="250" r="10" fill="#4a8edb"/>
    <circle cx="198" cy="250" r="10" fill="#4a8edb"/>
    <circle cx="252" cy="250" r="10" fill="#4a8edb"/>
  </g>
  <text x="170" y="148" text-anchor="middle" font-size="10" fill="#fff">50</text>
  <text x="115" y="202" text-anchor="middle" font-size="9" fill="#fff">30</text>
  <text x="225" y="202" text-anchor="middle" font-size="9" fill="#fff">70</text>
  <text x="88" y="254" text-anchor="middle" font-size="8" fill="#fff">20</text>
  <text x="142" y="254" text-anchor="middle" font-size="8" fill="#fff">40</text>
  <text x="198" y="254" text-anchor="middle" font-size="8" fill="#fff">60</text>
  <text x="252" y="254" text-anchor="middle" font-size="8" fill="#fff">80</text>
  <text x="170" y="286" text-anchor="middle" font-size="9" fill="#888">左右子树高度差 ≤ 1</text>

  <text x="40" y="314" font-size="10" fill="#666">· 查找最快（树最矮）</text>
  <text x="40" y="334" font-size="10" fill="#666">· 插入/删除可能 O(log n) 次回溯旋转</text>
  <text x="40" y="354" font-size="10" fill="#666">· 维护代价高</text>
  <text x="40" y="374" font-size="10" fill="#666">· 适合读极多、写极少的场景</text>

  <!-- ===== Col 2: 红黑树（胜出） ===== -->
  <g filter="url(#sk)"><rect x="350" y="60" width="300" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.5"/></g>
  <text x="500" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">红黑树 ✅ STL map/set</text>

  <g stroke="#7a7a7a" stroke-width="1.2">
    <line x1="500" y1="152" x2="447" y2="192"/>
    <line x1="500" y1="152" x2="553" y2="192"/>
    <line x1="445" y1="204" x2="420" y2="242"/>
    <line x1="445" y1="204" x2="470" y2="242"/>
    <line x1="555" y1="204" x2="530" y2="242"/>
    <line x1="555" y1="204" x2="580" y2="242"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="500" cy="144" r="14" fill="#333"/>
    <circle cx="445" cy="198" r="12" fill="#b03a3a"/>
    <circle cx="555" cy="198" r="12" fill="#b03a3a"/>
    <circle cx="418" cy="250" r="10" fill="#333"/>
    <circle cx="472" cy="250" r="10" fill="#333"/>
    <circle cx="528" cy="250" r="10" fill="#333"/>
    <circle cx="582" cy="250" r="10" fill="#333"/>
  </g>
  <text x="500" y="148" text-anchor="middle" font-size="10" fill="#fff">26</text>
  <text x="445" y="202" text-anchor="middle" font-size="9" fill="#fff">17</text>
  <text x="555" y="202" text-anchor="middle" font-size="9" fill="#fff">41</text>
  <text x="418" y="254" text-anchor="middle" font-size="8" fill="#fff">14</text>
  <text x="472" y="254" text-anchor="middle" font-size="8" fill="#fff">20</text>
  <text x="528" y="254" text-anchor="middle" font-size="8" fill="#fff">30</text>
  <text x="582" y="254" text-anchor="middle" font-size="8" fill="#fff">47</text>
  <text x="500" y="286" text-anchor="middle" font-size="9" fill="#888">近似平衡：最长路径 ≤ 2×最短</text>

  <text x="370" y="314" font-size="10" fill="#666">· 插入至多 2 次旋转，删除至多 3 次</text>
  <text x="370" y="334" font-size="10" fill="#666">· 增删查全部稳定 O(log n)</text>
  <text x="370" y="354" font-size="10" fill="#666">· 旋转是 O(1)，维护便宜</text>
  <text x="370" y="374" font-size="10" fill="#666">· 有序遍历 / 前驱后继 / 范围查询</text>

  <!-- ===== Col 3: 哈希表 ===== -->
  <g filter="url(#sk)"><rect x="680" y="60" width="300" height="44" rx="6" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/></g>
  <text x="830" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">哈希表（unordered_map）</text>

  <g filter="url(#sk)">
    <rect x="742" y="136" width="44" height="26" fill="#ead9f5" stroke="#8e5db8" stroke-width="1.2"/>
    <rect x="792" y="136" width="44" height="26" fill="#ead9f5" stroke="#8e5db8" stroke-width="1.2"/>
    <rect x="842" y="136" width="44" height="26" fill="#ead9f5" stroke="#8e5db8" stroke-width="1.2"/>
    <rect x="892" y="136" width="44" height="26" fill="#ead9f5" stroke="#8e5db8" stroke-width="1.2"/>
  </g>
  <text x="764" y="153" text-anchor="middle" font-size="10" fill="#5a3a7a">0</text>
  <text x="814" y="153" text-anchor="middle" font-size="10" fill="#5a3a7a">1</text>
  <text x="864" y="153" text-anchor="middle" font-size="10" fill="#5a3a7a">2</text>
  <text x="914" y="153" text-anchor="middle" font-size="10" fill="#5a3a7a">3</text>

  <line x1="764" y1="162" x2="764" y2="172" stroke="#8e5db8" stroke-width="1.2"/>
  <g filter="url(#sk)">
    <rect x="744" y="172" width="40" height="18" fill="#f6effa" stroke="#8e5db8" stroke-width="1.1"/>
    <rect x="744" y="194" width="40" height="18" fill="#f6effa" stroke="#8e5db8" stroke-width="1.1"/>
  </g>
  <text x="764" y="185" text-anchor="middle" font-size="9" fill="#5a3a7a">k1</text>
  <text x="764" y="207" text-anchor="middle" font-size="9" fill="#5a3a7a">k9</text>
  <line x1="764" y1="190" x2="764" y2="194" stroke="#8e5db8" stroke-width="1.2"/>
  <line x1="864" y1="162" x2="864" y2="172" stroke="#8e5db8" stroke-width="1.2"/>
  <g filter="url(#sk)"><rect x="844" y="172" width="40" height="18" fill="#f6effa" stroke="#8e5db8" stroke-width="1.1"/></g>
  <text x="864" y="185" text-anchor="middle" font-size="9" fill="#5a3a7a">k4</text>
  <text x="830" y="236" text-anchor="middle" font-size="9" fill="#888">桶数组 + 拉链</text>

  <text x="700" y="314" font-size="10" fill="#666">· 均摊 O(1)，最坏 O(n)（哈希碰撞）</text>
  <text x="700" y="334" font-size="10" fill="#666">· 无序：不支持 lower_bound / 范围查询</text>
  <text x="700" y="354" font-size="10" fill="#666">· rehash 有瞬时性能尖刺</text>
  <text x="700" y="374" font-size="10" fill="#666">· 自定义 key 需提供 hash + ==</text>

  <!-- ===== 结论 ===== -->
  <g filter="url(#sk)"><rect x="20" y="420" width="960" height="96" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="500" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">结论：map 要『有序 + 增删查都稳 + 旋转便宜』三者兼得</text>
  <text x="500" y="478" text-anchor="middle" font-size="10" fill="#5a3a15">AVL 维护太贵（旋转可能 O(log n) 次）· 哈希表无序（范围查询没有）</text>
  <text x="500" y="500" text-anchor="middle" font-size="10" fill="#5a3a15">红黑树旋转次数是 O(1)、综合最均衡 → 成为 STL 关联容器的选择</text>

  <!-- bottom note -->
  <text x="500" y="542" text-anchor="middle" font-size="10" fill="#888" font-style="italic">补充：红黑树高度 ≤ 2·log₂(n+1) → 查找 O(log n)；需要哈希性能时标准库另提供 unordered_map（C++11 起）</text>
</svg>
