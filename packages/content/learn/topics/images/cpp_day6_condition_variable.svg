<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="63" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8e5db8"/>
    </marker>
  </defs>
  <rect width="1000" height="680" fill="#fdfcf7"/>

  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">条件变量：wait 的三步舞 + 虚假唤醒</text>
  <path d="M 310 40 Q 500 48 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 消费者（左） ===== -->
  <g filter="url(#sk)"><rect x="20" y="64" width="290" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="165" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">消费者：等数据来</text>

  <g filter="url(#sk)"><rect x="20" y="110" width="290" height="54" rx="6" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.1"/></g>
  <text x="34" y="132" font-size="10" font-weight="bold" fill="#444">① std::unique_lock lk(m);</text>
  <text x="34" y="150" font-size="9" fill="#666">先拿锁——共享队列归这把锁保护</text>

  <g filter="url(#sk)"><rect x="20" y="180" width="290" height="54" rx="6" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.1"/></g>
  <text x="34" y="202" font-size="10" font-weight="bold" fill="#444">② cv.wait(lk, pred);</text>
  <text x="34" y="220" font-size="9" fill="#666">条件不满足 → 睡；已满足 → 直接往下</text>

  <g filter="url(#sk)"><rect x="20" y="250" width="290" height="54" rx="6" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.1"/></g>
  <text x="34" y="272" font-size="10" font-weight="bold" fill="#444">③ 醒来时，锁已经回到手上</text>
  <text x="34" y="290" font-size="9" fill="#666">wait 返回前会自动重新抢到锁</text>

  <g filter="url(#sk)"><rect x="20" y="320" width="290" height="54" rx="6" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.1"/></g>
  <text x="34" y="342" font-size="10" font-weight="bold" fill="#444">④ 检查通过 → 取数据消费</text>
  <text x="34" y="360" font-size="9" fill="#666">lk 析构自动解锁</text>

  <path d="M 165 166 L 165 176" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 165 236 L 165 246" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 165 306 L 165 316" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== 条件变量（中） ===== -->
  <g filter="url(#sk)"><rect x="345" y="64" width="310" height="290" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/></g>
  <text x="500" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a7a">condition_variable：会合点</text>
  <text x="500" y="112" text-anchor="middle" font-size="9" font-weight="bold" fill="#5a3a7a">睡眠队列（挂起的线程，不占 CPU）</text>
  <g filter="url(#sk)">
    <rect x="368" y="122" width="80" height="26" fill="#ead9f5" stroke="#8e5db8" stroke-width="1"/>
    <rect x="460" y="122" width="80" height="26" fill="#ead9f5" stroke="#8e5db8" stroke-width="1"/>
    <rect x="552" y="122" width="80" height="26" fill="#ead9f5" stroke="#8e5db8" stroke-width="1"/>
  </g>
  <text x="408" y="139" text-anchor="middle" font-size="9" fill="#5a3a7a">T2 睡</text>
  <text x="500" y="139" text-anchor="middle" font-size="9" fill="#5a3a7a">T3 睡</text>
  <text x="592" y="139" text-anchor="middle" font-size="9" fill="#5a3a7a">…</text>

  <text x="361" y="178" font-size="10.5" font-weight="bold" fill="#444">wait(lk) 内部三步：</text>
  <text x="361" y="200" font-size="9.5" fill="#555">① 释放锁 → 别人才能进来改条件</text>
  <text x="361" y="219" font-size="9.5" fill="#555">② 挂起自己 → 不占 CPU（轮询=空转烧 CPU）</text>
  <text x="361" y="238" font-size="9.5" fill="#555">③ 被 notify → 重新抢锁，抢到才返回</text>
  <line x1="360" y1="254" x2="640" y2="254" stroke="#d5c5e5" stroke-width="1"/>
  <text x="500" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">醒来 ≠ 条件成立！</text>
  <text x="500" y="300" text-anchor="middle" font-size="9" fill="#666">notify 只是"可能有事"的信号</text>
  <text x="500" y="318" text-anchor="middle" font-size="9" fill="#666">条件成不成立，要靠 while 重查（见下）</text>

  <!-- ===== 虚假唤醒（中下） ===== -->
  <g filter="url(#sk)"><rect x="345" y="372" width="310" height="150" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.4" stroke-dasharray="6 4"/></g>
  <text x="500" y="396" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">虚假唤醒 spurious wakeup</text>
  <text x="500" y="416" text-anchor="middle" font-size="9" fill="#7a2020">没人 notify、条件也没满足，也可能被唤醒</text>
  <text x="500" y="434" text-anchor="middle" font-size="9" fill="#7a2020">（OS 允许；或唤醒时活早被别的线程干完了）</text>
  <text x="500" y="458" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">所以必须 while，不能 if！</text>
  <text x="500" y="482" text-anchor="middle" font-size="10" fill="#444">cv.wait(lk, pred)</text>
  <text x="500" y="500" text-anchor="middle" font-size="10" fill="#444">≡ while (!pred()) cv.wait(lk);</text>

  <!-- ===== 生产者（右） ===== -->
  <g filter="url(#sk)"><rect x="690" y="64" width="290" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="835" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">生产者：造好数据</text>

  <g filter="url(#sk)"><rect x="690" y="110" width="290" height="54" rx="6" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.1"/></g>
  <text x="704" y="132" font-size="10" font-weight="bold" fill="#444">① std::unique_lock lk(m);</text>
  <text x="704" y="150" font-size="9" fill="#666">同一把锁！锁错对象 = 白等</text>

  <g filter="url(#sk)"><rect x="690" y="180" width="290" height="54" rx="6" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.1"/></g>
  <text x="704" y="202" font-size="10" font-weight="bold" fill="#444">② q.push(item);</text>
  <text x="704" y="220" font-size="9" fill="#666">修改共享状态（必须持锁）</text>

  <g filter="url(#sk)"><rect x="690" y="250" width="290" height="54" rx="6" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.1"/></g>
  <text x="704" y="272" font-size="10" font-weight="bold" fill="#444">③ cv.notify_one();</text>
  <text x="704" y="290" font-size="9" fill="#666">叫醒一个睡眠的消费者</text>

  <g filter="url(#sk)"><rect x="690" y="320" width="290" height="54" rx="6" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.1"/></g>
  <text x="704" y="342" font-size="10" font-weight="bold" fill="#444">④ 解锁（lk 析构）</text>
  <text x="704" y="360" font-size="9" fill="#666">让醒来的人抢得到锁</text>

  <!-- 横向箭头：notify → cv → 消费者 -->
  <path d="M 688 277 L 659 277" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="674" y="267" text-anchor="middle" font-size="8.5" fill="#2e6e2e">notify</text>
  <path d="M 342 277 L 313 277" stroke="#8e5db8" stroke-width="1.6" fill="none" marker-end="url(#arP)" filter="url(#sk)"/>
  <text x="328" y="267" text-anchor="middle" font-size="8.5" fill="#5a3a7a">唤醒</text>

  <!-- ===== 底部速记 ===== -->
  <g filter="url(#sk)"><rect x="20" y="548" width="960" height="104" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="44" y="574" font-size="10" fill="#666">notify_one 只叫醒一个：单消费者 / 每次只新增一件活；notify_all 全叫醒：多消费者、各自条件不同（醒了还得抢锁，抢不到接着睡）</text>
  <text x="44" y="596" font-size="10" fill="#666">改共享条件（q、ready）必须持锁；notify 本身可以不持锁——先解锁再 notify，能少一次无谓的锁交接（加分细节）</text>
  <text x="44" y="618" font-size="10" fill="#b03a3a">两大翻车点：① 不持锁就调 wait（未定义行为）② 两边用不同的 mutex 保护同一个条件 → 永远等不到唤醒</text>
</svg>
