<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#fdfcf7"/>

  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">Day 7 冲刺：四大件 + 前 6 天总复习地图</text>
  <path d="M 300 41 Q 500 49 700 41" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 四大件 banner -->
  <g filter="url(#sk)"><rect x="250" y="56" width="500" height="26" rx="13" fill="#2b2b2b"/></g>
  <text x="500" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#fdfcf7">四大件 —— 每场必问，一个都不能省</text>

  <!-- 四大件 ① 内存管理 -->
  <g filter="url(#sk)"><rect x="30" y="96" width="462" height="100" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="52" y="120" font-size="13" font-weight="bold" fill="#2b6e9e">① 内存管理（Day 2）</text>
  <text x="52" y="142" font-size="10" fill="#666">new = operator new 分配 + 调构造；五大分区</text>
  <text x="52" y="160" font-size="10" fill="#666">new[] 必配 delete[]；泄漏用 ASan / Valgrind 抓</text>
  <text x="52" y="182" font-size="9" fill="#888">高频追问：delete this 合法吗 / 如何检测泄漏</text>

  <!-- 四大件 ② 虚函数机制 -->
  <g filter="url(#sk)"><rect x="508" y="96" width="462" height="100" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="530" y="120" font-size="13" font-weight="bold" fill="#7a5415">② 虚函数机制（Day 3）</text>
  <text x="530" y="142" font-size="10" fill="#666">对象藏 vptr → 类的 vtable → 间接调用（动态绑定）</text>
  <text x="530" y="160" font-size="10" fill="#666">构造期不多态；基类析构必须 virtual</text>
  <text x="530" y="182" font-size="9" fill="#888">高频追问：vtable 存哪 / 每个对象几个 vptr</text>

  <!-- 四大件 ③ 智能指针 -->
  <g filter="url(#sk)"><rect x="30" y="208" width="462" height="100" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="52" y="232" font-size="13" font-weight="bold" fill="#2e6e2e">③ 智能指针（Day 5）</text>
  <text x="52" y="254" font-size="10" fill="#666">shared_ptr = 对象指针 + 控制块（原子引用计数）</text>
  <text x="52" y="272" font-size="10" fill="#666">unique 独占 / shared 共享 / weak 观察</text>
  <text x="52" y="294" font-size="9" fill="#888">高频追问：循环引用 → weak_ptr / 线程安全性</text>

  <!-- 四大件 ④ 深浅拷贝 -->
  <g filter="url(#sk)"><rect x="508" y="208" width="462" height="100" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.5"/></g>
  <text x="530" y="232" font-size="13" font-weight="bold" fill="#7a2828">④ 深拷贝 vs 浅拷贝（Day 3）</text>
  <text x="530" y="254" font-size="10" fill="#666">默认逐成员浅拷贝 → double free 崩溃</text>
  <text x="530" y="272" font-size="10" fill="#666">有裸指针 → Rule of Five + 手写 String</text>
  <text x="530" y="294" font-size="9" fill="#888">高频追问：自赋值检查 / copy-and-swap</text>

  <!-- arrow down -->
  <path d="M 500 314 L 500 342" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 前 6 天标题 -->
  <text x="500" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">前 6 天弱项自查 —— 哪句说不顺，就回哪天</text>

  <!-- Day 1 -->
  <g filter="url(#sk)"><rect x="30" y="380" width="148" height="150" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="104" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">Day 1 基础</text>
  <text x="104" y="428" text-anchor="middle" font-size="9" fill="#555">指针 vs 引用</text>
  <text x="104" y="446" text-anchor="middle" font-size="9" fill="#555">const / static</text>
  <text x="104" y="464" text-anchor="middle" font-size="9" fill="#555">四种 cast</text>
  <text x="104" y="510" text-anchor="middle" font-size="9" fill="#2b6e9e">⭐⭐⭐⭐</text>

  <!-- Day 2 -->
  <g filter="url(#sk)"><rect x="188" y="380" width="148" height="150" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="262" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">Day 2 内存</text>
  <text x="262" y="428" text-anchor="middle" font-size="9" fill="#555">五大分区</text>
  <text x="262" y="446" text-anchor="middle" font-size="9" fill="#555">new / delete</text>
  <text x="262" y="464" text-anchor="middle" font-size="9" fill="#555">泄漏排查 / 对齐</text>
  <text x="262" y="510" text-anchor="middle" font-size="9" fill="#7a5415">⭐⭐⭐⭐⭐</text>

  <!-- Day 3 -->
  <g filter="url(#sk)"><rect x="346" y="380" width="148" height="150" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="420" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">Day 3 面向对象</text>
  <text x="420" y="428" text-anchor="middle" font-size="9" fill="#555">构造析构顺序</text>
  <text x="420" y="446" text-anchor="middle" font-size="9" fill="#555">深浅拷贝</text>
  <text x="420" y="464" text-anchor="middle" font-size="9" fill="#555">虚函数 / 菱形继承</text>
  <text x="420" y="510" text-anchor="middle" font-size="9" fill="#2e6e2e">⭐⭐⭐⭐⭐</text>

  <!-- Day 4 -->
  <g filter="url(#sk)"><rect x="504" y="380" width="148" height="150" rx="8" fill="#fdecec" stroke="#b03a3a" stroke-width="1.4"/></g>
  <text x="578" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2828">Day 4 STL</text>
  <text x="578" y="428" text-anchor="middle" font-size="9" fill="#555">容器底层结构</text>
  <text x="578" y="446" text-anchor="middle" font-size="9" fill="#555">vector 扩容</text>
  <text x="578" y="464" text-anchor="middle" font-size="9" fill="#555">迭代器失效 / LRU</text>
  <text x="578" y="510" text-anchor="middle" font-size="9" fill="#b03a3a">⭐⭐⭐⭐⭐</text>

  <!-- Day 5 -->
  <g filter="url(#sk)"><rect x="662" y="380" width="148" height="150" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.4"/></g>
  <text x="736" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a7a">Day 5 现代 C++</text>
  <text x="736" y="428" text-anchor="middle" font-size="9" fill="#555">智能指针</text>
  <text x="736" y="446" text-anchor="middle" font-size="9" fill="#555">移动 / forward</text>
  <text x="736" y="464" text-anchor="middle" font-size="9" fill="#555">lambda</text>
  <text x="736" y="510" text-anchor="middle" font-size="9" fill="#5a3a7a">⭐⭐⭐⭐⭐</text>

  <!-- Day 6 -->
  <g filter="url(#sk)"><rect x="820" y="380" width="148" height="150" rx="8" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.4"/></g>
  <text x="894" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">Day 6 并发</text>
  <text x="894" y="428" text-anchor="middle" font-size="9" fill="#555">mutex / CV</text>
  <text x="894" y="446" text-anchor="middle" font-size="9" fill="#555">单例 DCLP</text>
  <text x="894" y="464" text-anchor="middle" font-size="9" fill="#555">atomic</text>
  <text x="894" y="510" text-anchor="middle" font-size="9" fill="#777">⭐⭐⭐⭐</text>

  <!-- bottom note -->
  <text x="500" y="572" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">弱项判定：30 秒开不了口 / 答不出“为什么” / 手写超时 —— 满足任一条就回炉重造</text>
  <text x="500" y="596" text-anchor="middle" font-size="10" fill="#888">下午手写专项 + 晚上模拟面试，把弱项变成条件反射</text>
</svg>
