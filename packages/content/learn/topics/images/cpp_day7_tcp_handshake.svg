<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="27" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#fdfcf7"/>

  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">TCP 连接与断开：三次握手 · 四次挥手</text>
  <path d="M 290 41 Q 500 49 710 41" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ================= 左：三次握手 ================= -->
  <g filter="url(#sk)"><rect x="30" y="62" width="456" height="500" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="258" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">三次握手（建立连接）</text>

  <g filter="url(#sk)"><rect x="50" y="98" width="96" height="26" rx="4" fill="#4a8edb"/></g>
  <text x="98" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Client</text>
  <g filter="url(#sk)"><rect x="360" y="98" width="96" height="26" rx="4" fill="#4a8edb"/></g>
  <text x="408" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Server</text>

  <path d="M 98 124 L 98 336" stroke="#9e9e9e" stroke-width="1.1" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <path d="M 408 124 L 408 336" stroke="#9e9e9e" stroke-width="1.1" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>

  <!-- ① SYN -->
  <text x="253" y="164" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b2b2b">① SYN  seq=x</text>
  <path d="M 110 174 L 394 174" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="88" y="178" text-anchor="end" font-size="9" fill="#2b6e9e" font-weight="bold">SYN_SENT</text>

  <!-- ② SYN+ACK -->
  <text x="253" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b2b2b">② SYN+ACK  seq=y, ack=x+1</text>
  <path d="M 396 232 L 108 232" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="418" y="236" text-anchor="start" font-size="9" fill="#2b6e9e" font-weight="bold">SYN_RCVD</text>

  <!-- ③ ACK -->
  <text x="253" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b2b2b">③ ACK  ack=y+1</text>
  <path d="M 110 290 L 394 290" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="88" y="314" text-anchor="end" font-size="9" fill="#2e6e2e" font-weight="bold">ESTABLISHED</text>
  <text x="418" y="314" text-anchor="start" font-size="9" fill="#2e6e2e" font-weight="bold">ESTABLISHED</text>

  <path d="M 50 356 L 466 356" stroke="#b9cfe8" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- 为什么三次 -->
  <text x="258" y="386" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">为什么是三次，两次不行吗？</text>
  <text x="50" y="414" font-size="9.5" fill="#555">① 两次只验证了一半收发能力：服务端无法确认</text>
  <text x="62" y="432" font-size="9.5" fill="#555">“自己 → 客户端”方向的包对方能收到</text>
  <text x="50" y="462" font-size="9.5" fill="#555">② 关键：挡历史连接 —— 滞留网络中的旧 SYN 迟到，</text>
  <text x="62" y="480" font-size="9.5" fill="#555">两次握手会直接建立无效连接、白占资源；</text>
  <text x="62" y="498" font-size="9.5" fill="#555">三次握手中客户端发现序号不对，可回 RST 拒掉</text>
  <text x="258" y="534" text-anchor="middle" font-size="9" fill="#888">ISN（初始序列号）随机生成，也是为了防历史报文混入</text>

  <!-- ================= 右：四次挥手 ================= -->
  <g filter="url(#sk)"><rect x="514" y="62" width="456" height="500" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="742" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">四次挥手（断开连接）</text>

  <g filter="url(#sk)"><rect x="534" y="98" width="96" height="26" rx="4" fill="#c98a2b"/></g>
  <text x="582" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Client（主动）</text>
  <g filter="url(#sk)"><rect x="844" y="98" width="96" height="26" rx="4" fill="#c98a2b"/></g>
  <text x="892" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Server（被动）</text>

  <path d="M 582 124 L 582 400" stroke="#9e9e9e" stroke-width="1.1" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <path d="M 892 124 L 892 400" stroke="#9e9e9e" stroke-width="1.1" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>

  <!-- ① FIN -->
  <text x="737" y="148" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b2b2b">① FIN  seq=u</text>
  <path d="M 594 158 L 878 158" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="572" y="162" text-anchor="end" font-size="9" fill="#7a5415" font-weight="bold">FIN_WAIT_1</text>

  <!-- ② ACK -->
  <text x="737" y="196" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b2b2b">② ACK  ack=u+1</text>
  <path d="M 880 206 L 592 206" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="902" y="210" text-anchor="start" font-size="9" fill="#7a5415" font-weight="bold">CLOSE_WAIT</text>
  <text x="572" y="226" text-anchor="end" font-size="9" fill="#7a5415" font-weight="bold">FIN_WAIT_2</text>
  <text x="737" y="240" text-anchor="middle" font-size="9" fill="#888" font-style="italic">半关闭：服务端还能把没发完的数据发完 —— 所以 ②③ 不能合并</text>

  <!-- ③ FIN -->
  <text x="737" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b2b2b">③ FIN  seq=w（数据发完了）</text>
  <path d="M 880 282 L 592 282" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="902" y="286" text-anchor="start" font-size="9" fill="#7a5415" font-weight="bold">LAST_ACK</text>

  <!-- ④ ACK -->
  <text x="737" y="320" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b2b2b">④ ACK  ack=w+1</text>
  <path d="M 594 330 L 878 330" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="572" y="354" text-anchor="end" font-size="9" fill="#b03a3a" font-weight="bold">TIME_WAIT</text>
  <text x="737" y="354" text-anchor="middle" font-size="9" fill="#888">（等 2MSL 再关）</text>
  <text x="572" y="384" text-anchor="end" font-size="9" fill="#2e6e2e" font-weight="bold">CLOSED</text>
  <text x="902" y="384" text-anchor="start" font-size="9" fill="#2e6e2e" font-weight="bold">CLOSED</text>

  <path d="M 534 412 L 950 412" stroke="#e8d5ae" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- TIME_WAIT 说明 -->
  <text x="742" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">TIME_WAIT 为什么等 2MSL？</text>
  <text x="534" y="466" font-size="9.5" fill="#555">① 最后的 ACK 若丢失，还能响应对方重发的 FIN</text>
  <text x="534" y="484" font-size="9.5" fill="#555">② 让本连接旧报文在网络中消亡，不污染新连接</text>
  <text x="534" y="516" font-size="9.5" fill="#b03a3a" font-weight="bold">信号题：大量 TIME_WAIT → 短连接堆积（正常，可调优）</text>
  <text x="534" y="534" font-size="9.5" fill="#b03a3a" font-weight="bold">大量 CLOSE_WAIT → 没调 close()，是 bug（fd 泄漏）</text>
</svg>
