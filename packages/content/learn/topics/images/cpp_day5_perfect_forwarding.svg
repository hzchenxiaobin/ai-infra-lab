<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b03a3a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="1000" height="500" fill="#fdfcf7"/>

  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">引用折叠与完美转发 std::forward</text>
  <path d="M 340 40 Q 500 48 660 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== collapse table ===== -->
  <g filter="url(#sk)"><rect x="20" y="60" width="420" height="230" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="230" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">引用折叠规则</text>
  <text x="95" y="103" text-anchor="middle" font-size="8" font-weight="bold" fill="#888">推导出的类型</text>
  <text x="235" y="103" text-anchor="middle" font-size="8" font-weight="bold" fill="#888">实参的引用</text>
  <text x="375" y="103" text-anchor="middle" font-size="8" font-weight="bold" fill="#888">折叠结果</text>
  <g filter="url(#sk)">
    <rect x="50" y="108" width="90" height="26" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="190" y="108" width="90" height="26" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="330" y="108" width="90" height="26" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="50" y="140" width="90" height="26" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="190" y="140" width="90" height="26" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="330" y="140" width="90" height="26" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="50" y="172" width="90" height="26" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="190" y="172" width="90" height="26" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="330" y="172" width="90" height="26" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="50" y="204" width="90" height="26" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="190" y="204" width="90" height="26" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="330" y="204" width="90" height="26" fill="#cfe8d2" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="95" y="125" text-anchor="middle" font-size="10" fill="#2b6e9e">T&amp;</text>
  <text x="235" y="125" text-anchor="middle" font-size="10" fill="#2b6e9e">&amp;</text>
  <text x="375" y="125" text-anchor="middle" font-size="10" fill="#2b6e9e">T&amp;</text>
  <text x="95" y="157" text-anchor="middle" font-size="10" fill="#2b6e9e">T&amp;</text>
  <text x="235" y="157" text-anchor="middle" font-size="10" fill="#2b6e9e">&amp;&amp;</text>
  <text x="375" y="157" text-anchor="middle" font-size="10" fill="#2b6e9e">T&amp;</text>
  <text x="95" y="189" text-anchor="middle" font-size="10" fill="#2b6e9e">T&amp;&amp;</text>
  <text x="235" y="189" text-anchor="middle" font-size="10" fill="#2b6e9e">&amp;</text>
  <text x="375" y="189" text-anchor="middle" font-size="10" fill="#2b6e9e">T&amp;</text>
  <text x="95" y="221" text-anchor="middle" font-size="10" fill="#2b6e9e">T&amp;&amp;</text>
  <text x="235" y="221" text-anchor="middle" font-size="10" fill="#2b6e9e">&amp;&amp;</text>
  <text x="375" y="221" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">T&amp;&amp;</text>
  <text x="165" y="125" text-anchor="middle" font-size="10" fill="#666">+</text>
  <text x="165" y="157" text-anchor="middle" font-size="10" fill="#666">+</text>
  <text x="165" y="189" text-anchor="middle" font-size="10" fill="#666">+</text>
  <text x="165" y="221" text-anchor="middle" font-size="10" fill="#666">+</text>
  <text x="305" y="125" text-anchor="middle" font-size="10" fill="#666">=</text>
  <text x="305" y="157" text-anchor="middle" font-size="10" fill="#666">=</text>
  <text x="305" y="189" text-anchor="middle" font-size="10" fill="#666">=</text>
  <text x="305" y="221" text-anchor="middle" font-size="10" fill="#666">=</text>
  <text x="230" y="256" text-anchor="middle" font-size="9" fill="#2b6e9e">只有"右值引用 + 右值引用"仍是右值引用；</text>
  <text x="230" y="274" text-anchor="middle" font-size="9" fill="#2b6e9e">只要掺进一个左值引用，就折叠成左值引用</text>

  <!-- ===== universal reference ===== -->
  <g filter="url(#sk)"><rect x="20" y="310" width="420" height="104" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="230" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">万能引用（转发引用）</text>
  <text x="230" y="358" text-anchor="middle" font-size="9.5" fill="#555">template &lt;typename T&gt; void f(T&amp;&amp; x);</text>
  <text x="230" y="378" text-anchor="middle" font-size="9" fill="#666">T 是正在推导的模板参数（或 auto&amp;&amp;）时，</text>
  <text x="230" y="396" text-anchor="middle" font-size="9" fill="#666">这个 &amp;&amp; 才是万能引用；类型写死则是普通右值引用</text>

  <!-- ===== forwarding flow ===== -->
  <g filter="url(#sk)"><rect x="470" y="60" width="510" height="354" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="725" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">为什么需要 std::forward</text>
  <text x="725" y="112" text-anchor="middle" font-size="10" fill="#555">outer(42);   // 传入右值</text>
  <g filter="url(#sk)"><rect x="510" y="124" width="430" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="725" y="144" text-anchor="middle" font-size="9.5" fill="#2b6e9e">template &lt;typename T&gt; void outer(T&amp;&amp; arg)</text>
  <text x="725" y="162" text-anchor="middle" font-size="8.5" fill="#666">T = int，但 arg 有名字 → arg 本身是左值</text>
  <path d="M 612 172 L 612 196" stroke="#b03a3a" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 842 172 L 842 196" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="510" y="200" width="200" height="92" rx="6" fill="#fdecec" stroke="#b03a3a" stroke-width="1.3"/></g>
  <text x="610" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a3a">inner(arg);</text>
  <text x="610" y="242" text-anchor="middle" font-size="9" fill="#b03a3a">✗ arg 永远是左值</text>
  <text x="610" y="260" text-anchor="middle" font-size="9" fill="#666">→ 命中 inner(int&amp;) 左值版</text>
  <text x="610" y="280" text-anchor="middle" font-size="8.5" fill="#999">值类别丢失</text>

  <g filter="url(#sk)"><rect x="730" y="200" width="220" height="92" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="840" y="222" text-anchor="middle" font-size="9" font-weight="bold" fill="#2e6e2e">inner(forward&lt;T&gt;(arg));</text>
  <text x="840" y="242" text-anchor="middle" font-size="9" fill="#2e6e2e">✓ 还原右值属性</text>
  <text x="840" y="260" text-anchor="middle" font-size="9" fill="#666">→ 命中 inner(int&amp;&amp;) 右值版</text>
  <text x="840" y="280" text-anchor="middle" font-size="8.5" fill="#999">完美转发</text>

  <text x="725" y="320" text-anchor="middle" font-size="9.5" fill="#555">outer(v);   // 传入左值：T = int&amp;</text>
  <text x="725" y="340" text-anchor="middle" font-size="9" fill="#2e6e2e">forward&lt;int&amp;&gt;(arg) → 折叠成 int&amp; → 命中 inner(int&amp;) ✓ 保住左值</text>
  <text x="725" y="368" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold">完美转发：进来时是什么值类别，转发出去还是什么</text>
  <text x="725" y="392" text-anchor="middle" font-size="9" fill="#888">本质：forward&lt;T&gt;(arg) 返回 T&amp;&amp;，随 T 的推导结果折叠回原样</text>

  <!-- ===== bottom notes ===== -->
  <text x="500" y="452" text-anchor="middle" font-size="10" fill="#888">一句话总结：万能引用负责"都能接"，std::forward 负责"原样转" —— 少了 forward，转发一层全变左值</text>
  <text x="500" y="478" text-anchor="middle" font-size="10" fill="#888" font-style="italic">标配组合：make_unique / emplace_back / 转发构造函数，都是"万能引用接参 + forward 转发"</text>
</svg>
