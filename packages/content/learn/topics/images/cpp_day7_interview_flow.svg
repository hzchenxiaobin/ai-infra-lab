<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#fdfcf7"/>

  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">晚上：模拟面试全流程</text>
  <path d="M 380 41 Q 500 49 620 41" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ================= 五个环节 ================= -->
  <!-- 1 自我介绍 -->
  <g filter="url(#sk)"><rect x="30" y="64" width="176" height="190" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="118" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">① 自我介绍（1min）</text>
  <text x="44" y="114" font-size="9" fill="#555">· 我是谁 → 技术栈 / 年限</text>
  <text x="44" y="134" font-size="9" fill="#555">· 最能打的项目一句话</text>
  <text x="44" y="154" font-size="9" fill="#555">· 为什么匹配这个岗位</text>
  <path d="M 44 170 L 192 170" stroke="#b9cfe8" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="118" y="192" text-anchor="middle" font-size="8.5" fill="#2b6e9e" font-weight="bold">只埋一个“钩子”，</text>
  <text x="118" y="206" text-anchor="middle" font-size="8.5" fill="#2b6e9e" font-weight="bold">引导面试官往你准备的方向追</text>
  <path d="M 208 159 L 217 159" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 2 项目深挖 -->
  <g filter="url(#sk)"><rect x="221" y="64" width="176" height="190" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="309" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">② 项目深挖（STAR）</text>
  <text x="235" y="114" font-size="9" fill="#555">· S 背景 / T 任务</text>
  <text x="235" y="134" font-size="9" fill="#555">· A 行动：方案对比 + 取舍</text>
  <text x="235" y="154" font-size="9" fill="#555">· R 结果：量化数字</text>
  <path d="M 235 170 L 383 170" stroke="#e8d5ae" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="309" y="192" text-anchor="middle" font-size="8.5" fill="#7a5415" font-weight="bold">A 是灵魂：有几个方案、为什么选这个，</text>
  <text x="309" y="206" text-anchor="middle" font-size="8.5" fill="#7a5415" font-weight="bold">防止被“为什么不用 X”问穿</text>
  <path d="M 399 159 L 408 159" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 3 基础问答 -->
  <g filter="url(#sk)"><rect x="412" y="64" width="176" height="190" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="500" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">③ 基础问答</text>
  <text x="426" y="114" font-size="9" fill="#555">· 四大件优先答稳</text>
  <text x="426" y="134" font-size="9" fill="#555">· 顺着追问链走到底</text>
  <text x="426" y="154" font-size="9" fill="#555">· 不会：坦诚 + 给思路</text>
  <path d="M 426 170 L 574 170" stroke="#bcd9be" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="500" y="192" text-anchor="middle" font-size="8.5" fill="#2e6e2e" font-weight="bold">先结论后展开，</text>
  <text x="500" y="206" text-anchor="middle" font-size="8.5" fill="#2e6e2e" font-weight="bold">语速放慢，留出思考时间</text>
  <path d="M 590 159 L 599 159" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 4 手写代码 -->
  <g filter="url(#sk)"><rect x="603" y="64" width="176" height="190" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.5"/></g>
  <text x="691" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a7a">④ 手写代码</text>
  <text x="617" y="114" font-size="9" fill="#555">· 先讲思路，再动笔</text>
  <text x="617" y="134" font-size="9" fill="#555">· 边写边说关键行</text>
  <text x="617" y="154" font-size="9" fill="#555">· 写完主动跑一个用例</text>
  <path d="M 617 170 L 765 170" stroke="#d5c3e8" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="691" y="192" text-anchor="middle" font-size="8.5" fill="#5a3a7a" font-weight="bold">边界条件、异常安全</text>
  <text x="691" y="206" text-anchor="middle" font-size="8.5" fill="#5a3a7a" font-weight="bold">主动提 = 加分项</text>
  <path d="M 781 159 L 790 159" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 5 反问环节 -->
  <g filter="url(#sk)"><rect x="794" y="64" width="176" height="190" rx="8" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.5"/></g>
  <text x="882" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">⑤ 反问环节</text>
  <text x="808" y="114" font-size="9" fill="#555">· 团队业务 / 技术栈</text>
  <text x="808" y="134" font-size="9" fill="#555">· 成长路径 / 导师制</text>
  <text x="808" y="154" font-size="9" fill="#555">· 避免只问薪资加班</text>
  <path d="M 808 170 L 956 170" stroke="#ccc" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="882" y="192" text-anchor="middle" font-size="8.5" fill="#777" font-weight="bold">2~3 个有质量的问题，</text>
  <text x="882" y="206" text-anchor="middle" font-size="8.5" fill="#777" font-weight="bold">顺带表达加入意愿</text>

  <!-- ================= 追问链 ================= -->
  <text x="500" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">面试官的连环追问 —— 提前每条走到头（示例 3 条）</text>

  <!-- 链1 内存链 -->
  <text x="30" y="331" font-size="10" font-weight="bold" fill="#2b6e9e">内存链</text>
  <g filter="url(#sk)">
    <rect x="95" y="310" width="130" height="34" rx="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="237" y="310" width="130" height="34" rx="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="379" y="310" width="130" height="34" rx="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="521" y="310" width="130" height="34" rx="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="663" y="310" width="130" height="34" rx="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="805" y="310" width="130" height="34" rx="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="160" y="331" text-anchor="middle" font-size="9" fill="#2b6e9e">new 做了什么</text>
  <text x="302" y="331" text-anchor="middle" font-size="9" fill="#2b6e9e">内存五大分区</text>
  <text x="444" y="331" text-anchor="middle" font-size="9" fill="#2b6e9e">泄漏怎么检测</text>
  <text x="586" y="331" text-anchor="middle" font-size="9" fill="#2b6e9e">智能指针</text>
  <text x="728" y="331" text-anchor="middle" font-size="9" fill="#2b6e9e">循环引用</text>
  <text x="870" y="331" text-anchor="middle" font-size="9" fill="#2b6e9e">weak_ptr</text>
  <path d="M 227 327 L 235 327" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 369 327 L 377 327" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 511 327 L 519 327" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 653 327 L 661 327" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 795 327 L 803 327" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 链2 多态链 -->
  <text x="30" y="381" font-size="10" font-weight="bold" fill="#7a5415">多态链</text>
  <g filter="url(#sk)">
    <rect x="95" y="360" width="158" height="34" rx="17" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="267" y="360" width="158" height="34" rx="17" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="439" y="360" width="158" height="34" rx="17" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="611" y="360" width="158" height="34" rx="17" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="783" y="360" width="158" height="34" rx="17" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="174" y="381" text-anchor="middle" font-size="9" fill="#7a5415">虚函数原理</text>
  <text x="346" y="381" text-anchor="middle" font-size="9" fill="#7a5415">vtable 存哪</text>
  <text x="518" y="381" text-anchor="middle" font-size="9" fill="#7a5415">构造中调虚函数</text>
  <text x="690" y="381" text-anchor="middle" font-size="9" fill="#7a5415">为什么虚析构</text>
  <text x="862" y="381" text-anchor="middle" font-size="9" fill="#7a5415">为何默认不虚</text>
  <path d="M 255 377 L 265 377" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 427 377 L 437 377" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 599 377 L 609 377" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 771 377 L 781 377" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 链3 并发链 -->
  <text x="30" y="431" font-size="10" font-weight="bold" fill="#2e6e2e">并发链</text>
  <g filter="url(#sk)">
    <rect x="95" y="410" width="200" height="34" rx="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="311" y="410" width="200" height="34" rx="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="527" y="410" width="200" height="34" rx="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="743" y="410" width="200" height="34" rx="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="195" y="431" text-anchor="middle" font-size="9" fill="#2e6e2e">线程安全单例</text>
  <text x="411" y="431" text-anchor="middle" font-size="9" fill="#2e6e2e">DCLP 为何曾不安全</text>
  <text x="627" y="431" text-anchor="middle" font-size="9" fill="#2e6e2e">memory_order</text>
  <text x="843" y="431" text-anchor="middle" font-size="9" fill="#2e6e2e">volatile vs atomic</text>
  <path d="M 297 427 L 309 427" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 513 427 L 525 427" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 729 427 L 741 427" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ================= 底部提示 ================= -->
  <text x="500" y="490" text-anchor="middle" font-size="9.5" fill="#666">答不上来的标准话术：“这个细节我没深入研究过，但基于 XX 原理我推测是 XX，回去我会验证。” —— 比瞎编强十倍</text>
  <text x="500" y="514" text-anchor="middle" font-size="9.5" fill="#888">全程录音回放：听语速、口头禅、卡壳点 —— 卡壳处就是开面试前要再过的弱项</text>
  <text x="500" y="538" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">模拟完对着《7 天冲刺收官清单》逐项打勾，然后安心睡觉</text>
</svg>
