<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="65" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="1000" height="660" fill="#fdfcf7"/>

  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">volatile ≠ atomic：原子性 · 可见性 · 有序性</text>
  <path d="M 300 40 Q 500 48 700 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 对比表 ===== -->
  <g filter="url(#sk)"><rect x="20" y="56" width="960" height="160" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <line x1="344" y1="60" x2="344" y2="212" stroke="#ddd" stroke-width="1"/>
  <line x1="646" y1="60" x2="646" y2="212" stroke="#ddd" stroke-width="1"/>
  <line x1="24" y1="88" x2="976" y2="88" stroke="#ddd" stroke-width="1"/>
  <text x="182" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">需求</text>
  <text x="495" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">volatile</text>
  <text x="813" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">std::atomic</text>
  <text x="36" y="110" font-size="9.5" font-weight="bold" fill="#444">① 原子性：读改写不被打断</text>
  <text x="356" y="110" font-size="9.5" fill="#7a2020">✗　x++ = 读+改+写三步，并发必丢更新</text>
  <text x="658" y="110" font-size="9.5" fill="#2e6e2e">✓　单条原子指令（或 CAS 循环）</text>
  <text x="36" y="142" font-size="9.5" font-weight="bold" fill="#444">② 可见性：改完别人看得见</text>
  <text x="356" y="142" font-size="9.5" fill="#7a2020">✗　只防编译器缓存进寄存器，不刷缓存</text>
  <text x="658" y="142" font-size="9.5" fill="#2e6e2e">✓　带内存栅栏，写入对全核可见</text>
  <text x="36" y="174" font-size="9.5" font-weight="bold" fill="#444">③ 有序性：指令不许乱排</text>
  <text x="356" y="174" font-size="9.5" fill="#7a2020">✗　编译器 / CPU 照样重排</text>
  <text x="658" y="174" font-size="9.5" fill="#2e6e2e">✓　memory_order 约束重排</text>
  <text x="36" y="206" font-size="9.5" font-weight="bold" fill="#444">典型用途</text>
  <text x="356" y="206" font-size="9.5" fill="#7a2020">硬件 MMIO 寄存器、信号处理</text>
  <text x="658" y="206" font-size="9.5" fill="#2e6e2e">线程间同步：标志 / 计数 / 指针发布</text>

  <!-- ===== 重排事故 ===== -->
  <text x="500" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">没有同步：重排出"半成品"</text>
  <g filter="url(#sk)"><rect x="120" y="268" width="300" height="96" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="270" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">线程 1（写端）</text>
  <text x="270" y="316" text-anchor="middle" font-size="10" fill="#444">data = 42;</text>
  <text x="270" y="336" text-anchor="middle" font-size="10" fill="#444">flag = true;　// 想说"数据好了"</text>

  <g filter="url(#sk)"><rect x="580" y="268" width="300" height="96" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="730" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">线程 2（读端）</text>
  <text x="730" y="316" text-anchor="middle" font-size="10" fill="#444">if (flag)</text>
  <text x="730" y="336" text-anchor="middle" font-size="10" fill="#b03a3a">use(data);　// 可能读到 0！</text>

  <text x="500" y="392" text-anchor="middle" font-size="9" fill="#b03a3a">两句普通赋值可能被重排 / 缓存延迟 → 线程 2 看到 flag == true 时，data 可能还是 0</text>

  <!-- ===== 修复 ===== -->
  <g filter="url(#sk)"><rect x="120" y="408" width="760" height="112" rx="8" fill="#f2fbf4" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="500" y="432" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">✓ 用 acquire / release 配对修复</text>
  <text x="160" y="456" font-size="9.5" fill="#444">data = 42;                                     // 普通写</text>
  <text x="160" y="474" font-size="9.5" fill="#444">flag.store(true, std::memory_order_release);   // 写端：之前的写不许沉到这句之后</text>
  <text x="160" y="492" font-size="9.5" fill="#444">while (!flag.load(std::memory_order_acquire));  // 读端：之后的读不许提到这句之前</text>
  <text x="500" y="510" text-anchor="middle" font-size="9.5" fill="#2e6e2e" font-style="italic">→ use(data) 保证看到 42：release 写 ↔ acquire 读 配对，建立 happens-before</text>

  <!-- ===== 内存序谱系 ===== -->
  <text x="500" y="556" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">memory_order 谱系（能说出层次就是加分）</text>
  <g filter="url(#sk)"><rect x="60" y="568" width="210" height="56" rx="4" fill="#f5e2c0" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="165" y="590" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">relaxed</text>
  <text x="165" y="608" text-anchor="middle" font-size="8.5" fill="#7a5415">只保证原子、不管顺序（纯计数）</text>
  <g filter="url(#sk)"><rect x="270" y="568" width="270" height="56" rx="4" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="405" y="590" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">acquire / release</text>
  <text x="405" y="608" text-anchor="middle" font-size="8.5" fill="#2e6e2e">读写配对、同步可见（发布数据）</text>
  <g filter="url(#sk)"><rect x="540" y="568" width="170" height="56" rx="4" fill="#dcebf9" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="625" y="590" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">acq_rel</text>
  <text x="625" y="608" text-anchor="middle" font-size="8.5" fill="#2b6e9e">读写都带（RMW 专用）</text>
  <g filter="url(#sk)"><rect x="710" y="568" width="230" height="56" rx="4" fill="#ead9f5" stroke="#8e5db8" stroke-width="1.2"/></g>
  <text x="825" y="590" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#5a3a7a">seq_cst（默认）</text>
  <text x="825" y="608" text-anchor="middle" font-size="8.5" fill="#5a3a7a">全局总顺序，最保守最稳</text>

  <text x="500" y="648" text-anchor="middle" font-size="9" fill="#888" font-style="italic">工程口诀：默认 seq_cst 最不容易错；profile 证明栅栏/锁是瓶颈再降级 acquire/release；relaxed 只用于纯计数</text>
</svg>
