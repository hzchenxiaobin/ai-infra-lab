<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="1000" height="660" fill="#fdfcf7"/>

  <text x="500" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">进程 vs 线程：内存布局视角</text>
  <path d="M 350 40 Q 500 48 650 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左：进程（隔离） ===== -->
  <g filter="url(#sk)"><rect x="20" y="62" width="460" height="398" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="250" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">进程：一人一套地址空间（互相隔离）</text>

  <!-- 进程 A -->
  <g filter="url(#sk)"><rect x="42" y="102" width="190" height="282" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="137" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">进程 A</text>
  <g filter="url(#sk)">
    <rect x="54" y="132" width="166" height="40" fill="#dcebf9" stroke="#4a8edb" stroke-width="1"/>
    <rect x="54" y="178" width="166" height="40" fill="#dcebf9" stroke="#4a8edb" stroke-width="1"/>
    <rect x="54" y="224" width="166" height="66" fill="#dcebf9" stroke="#4a8edb" stroke-width="1"/>
    <rect x="54" y="296" width="166" height="66" fill="#dcebf9" stroke="#4a8edb" stroke-width="1"/>
  </g>
  <text x="137" y="156" text-anchor="middle" font-size="10" fill="#2b6e9e">代码区</text>
  <text x="137" y="202" text-anchor="middle" font-size="10" fill="#2b6e9e">全局 / 静态区</text>
  <text x="137" y="253" text-anchor="middle" font-size="10" fill="#2b6e9e">堆（new 的对象）</text>
  <text x="137" y="270" text-anchor="middle" font-size="8" fill="#888">↑ 越 new 越高</text>
  <text x="137" y="325" text-anchor="middle" font-size="10" fill="#2b6e9e">栈（局部变量）</text>
  <text x="137" y="342" text-anchor="middle" font-size="8" fill="#888">↓ 越调用越深</text>

  <!-- 隔离墙 -->
  <path d="M 250 104 L 250 380" stroke="#b03a3a" stroke-width="2" stroke-dasharray="8 6" filter="url(#sk)"/>
  <text x="250" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a3a">隔离墙</text>

  <!-- 进程 B -->
  <g filter="url(#sk)"><rect x="268" y="102" width="190" height="282" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="363" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">进程 B</text>
  <g filter="url(#sk)">
    <rect x="280" y="132" width="166" height="40" fill="#dcebf9" stroke="#4a8edb" stroke-width="1"/>
    <rect x="280" y="178" width="166" height="40" fill="#dcebf9" stroke="#4a8edb" stroke-width="1"/>
    <rect x="280" y="224" width="166" height="66" fill="#dcebf9" stroke="#4a8edb" stroke-width="1"/>
    <rect x="280" y="296" width="166" height="66" fill="#dcebf9" stroke="#4a8edb" stroke-width="1"/>
  </g>
  <text x="363" y="156" text-anchor="middle" font-size="10" fill="#2b6e9e">代码区</text>
  <text x="363" y="202" text-anchor="middle" font-size="10" fill="#2b6e9e">全局 / 静态区</text>
  <text x="363" y="253" text-anchor="middle" font-size="10" fill="#2b6e9e">堆</text>
  <text x="363" y="325" text-anchor="middle" font-size="10" fill="#2b6e9e">栈</text>

  <text x="250" y="412" text-anchor="middle" font-size="9" fill="#666">看不见对方的内存 → 通信要走 IPC：</text>
  <text x="250" y="428" text-anchor="middle" font-size="9" fill="#666">管道 / 消息队列 / 共享内存 / socket（都得系统调用）</text>
  <text x="250" y="448" text-anchor="middle" font-size="9" fill="#b03a3a">崩溃隔离：A 挂了，B 照常活着</text>

  <!-- ===== 右：线程（共享） ===== -->
  <g filter="url(#sk)"><rect x="500" y="62" width="480" height="398" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="740" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">线程：同一进程里多条执行流（共享）</text>

  <!-- 共享区 -->
  <g filter="url(#sk)"><rect x="522" y="100" width="436" height="136" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)">
    <rect x="534" y="128" width="412" height="28" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1"/>
    <rect x="534" y="162" width="412" height="28" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1"/>
    <rect x="534" y="196" width="412" height="28" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <text x="740" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">共享区：整块地址空间都是大家的</text>
  <text x="740" y="146" text-anchor="middle" font-size="9.5" fill="#2e6e2e">代码区 ｜ 全局 / 静态区（static 单例就在这）</text>
  <text x="740" y="180" text-anchor="middle" font-size="9.5" fill="#2e6e2e">堆（new 出来的对象、shared_ptr 控制块）</text>
  <text x="740" y="214" text-anchor="middle" font-size="9.5" fill="#2e6e2e">文件描述符等进程资源</text>

  <!-- 三个线程 -->
  <g filter="url(#sk)"><rect x="522" y="280" width="136" height="104" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="590" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">线程 1</text>
  <g filter="url(#sk)">
    <rect x="532" y="306" width="116" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
    <rect x="532" y="340" width="116" height="38" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <text x="590" y="324" text-anchor="middle" font-size="9" fill="#2e6e2e">栈（私有）</text>
  <text x="590" y="358" text-anchor="middle" font-size="8.5" fill="#2e6e2e">寄存器 / TLS</text>
  <text x="590" y="371" text-anchor="middle" font-size="8" fill="#888">errno 等</text>

  <g filter="url(#sk)"><rect x="682" y="280" width="136" height="104" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="750" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">线程 2</text>
  <g filter="url(#sk)">
    <rect x="692" y="306" width="116" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
    <rect x="692" y="340" width="116" height="38" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <text x="750" y="324" text-anchor="middle" font-size="9" fill="#2e6e2e">栈（私有）</text>
  <text x="750" y="358" text-anchor="middle" font-size="8.5" fill="#2e6e2e">寄存器 / TLS</text>

  <g filter="url(#sk)"><rect x="842" y="280" width="136" height="104" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="910" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">线程 3</text>
  <g filter="url(#sk)">
    <rect x="852" y="306" width="116" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
    <rect x="852" y="340" width="116" height="38" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <text x="910" y="324" text-anchor="middle" font-size="9" fill="#2e6e2e">栈（私有）</text>
  <text x="910" y="358" text-anchor="middle" font-size="8.5" fill="#2e6e2e">寄存器 / TLS</text>

  <!-- 线程 → 共享区 箭头 -->
  <path d="M 590 278 L 590 242" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 750 278 L 750 242" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 910 278 L 910 242" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="740" y="270" text-anchor="middle" font-size="9" font-weight="bold" fill="#b03a3a">直接读写共享区 → 必须同步！</text>

  <text x="740" y="406" text-anchor="middle" font-size="9" fill="#666">通信 = 直接读写共享变量（快，但会有数据竞争 → 今天的主角）</text>
  <text x="740" y="424" text-anchor="middle" font-size="9" fill="#b03a3a">一个线程段错误 → 整个进程（含所有线程）一起退出</text>
  <text x="740" y="442" text-anchor="middle" font-size="9" fill="#666">每条线程独享：栈、寄存器、TLS（thread_local / errno / 信号掩码）</text>

  <!-- ===== 底部速记 ===== -->
  <g filter="url(#sk)"><rect x="20" y="478" width="960" height="160" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="500" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">一图速记</text>
  <line x1="316" y1="514" x2="316" y2="614" stroke="#ddd" stroke-width="1"/>
  <line x1="644" y1="514" x2="644" y2="614" stroke="#ddd" stroke-width="1"/>
  <text x="330" y="522" font-size="10" font-weight="bold" fill="#2b6e9e">进程</text>
  <text x="660" y="522" font-size="10" font-weight="bold" fill="#2e6e2e">线程</text>
  <text x="44" y="543" font-size="9.5" font-weight="bold" fill="#444">切换开销</text>
  <text x="330" y="543" font-size="9.5" fill="#666">大：切页表、刷 TLB</text>
  <text x="660" y="543" font-size="9.5" fill="#666">小：换寄存器和栈</text>
  <text x="44" y="564" font-size="9.5" font-weight="bold" fill="#444">通信方式</text>
  <text x="330" y="564" font-size="9.5" fill="#666">IPC 系统调用（贵）</text>
  <text x="660" y="564" font-size="9.5" fill="#666">读写共享变量（快，须同步）</text>
  <text x="44" y="585" font-size="9.5" font-weight="bold" fill="#444">崩溃影响</text>
  <text x="330" y="585" font-size="9.5" fill="#666">相互隔离</text>
  <text x="660" y="585" font-size="9.5" fill="#666">一个崩 → 全进程陪葬</text>
  <text x="44" y="606" font-size="9.5" font-weight="bold" fill="#444">基本单位</text>
  <text x="330" y="606" font-size="9.5" fill="#666">资源分配</text>
  <text x="660" y="606" font-size="9.5" fill="#666">CPU 调度</text>
  <text x="500" y="630" text-anchor="middle" font-size="9.5" fill="#b03a3a" font-style="italic">面试一句话：线程共享 代码区 / 全局静态区 / 堆；私有 栈 + 寄存器 + TLS</text>
</svg>
